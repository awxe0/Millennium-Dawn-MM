 TurkeyNATO.1.title:0 "United States HQ Questions Turkey"
 TurkeyNATO.1.desc:0 "Turkey is a member of the NATO alliance. But now it has Decayed into a state of civil war, and this civil war is taking place between the secular democratic Turkish people and a terrorist Ottoman Turkish state. Should we leave the Turkish region to these bigoted Ottomans, terminate our access to the Russian Black Sea and turn a blind eye to the establishment of a Russian-friendly state in the region, or should we organize a general operation with NATO states and confirm that Turkey is part of NATO?"
 TurkeyNATO.1.a:0 "Its Time For NATO To React"
