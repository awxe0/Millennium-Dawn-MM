 ####### Super Events #######
 SUPEREVENT_1_T:0 "    Turkey's 2023 Vision"
 SUPEREVENT_1_DESC:0 "A rising new generation! You are the future. We created the Republic, it is you who will raise it and keep it alive. The administration that best suits the character and customs of the Turkish nation is the administration of the Republic. - Mustafa Kemal Atatürk"
 SUPEREVENT_2_T:0 "The Turkic Union"
 SUPEREVENT_2_DESC:0 "Nations that walk the path of country scare other nations and admire them. - Hüseyin Nihal Atsız"
 SUPEREVENT_3_T:0 "Turkey Joins European Union"
 SUPEREVENT_3_DESC:0 "Culture is Europe with its slipperiness, exchange, and navigation. An indescribable word. - Cemil Meriç"
 SUPEREVENT_4_T:0 "Turkish Military Purges"
 SUPEREVENT_4_DESC:0 "I leave you alone with your conscience, and I sacrifice my humble life to the Republic founded by Aziz Mustafa Kemal. Your conscience is the last authority to put an end to this persecution. I'll leave you alone with him. - Hurşit Tolon"
 SUPEREVENT_5_T:0 "Erdogan Loses The Elections"
 SUPEREVENT_5_DESC:0 "We'll be worried about putting the case Stone in your hole." - Recep Tayyip Erdoğan"
 SUPEREVENT_6_T:0 "Erdogan Becomes The President"
 SUPEREVENT_6_DESC:0 "I am honored to be the president of the state of the Republic of Turkey and this heroic nation. - Recep Tayyip Erdoğan"
 SUPEREVENT_7_T:0 "Canal Istanbul Project"
 SUPEREVENT_7_DESC:0 "I was accused of opposing the state project. This project, which we call’ concrete canal', is not a state project; it is an election project - Ekrem İmamoğlu"
 SUPEREVENT_8_T:0 "Turkey Leaves From The NATO"
 SUPEREVENT_8_DESC:0 "NATO is the organization that protects us, NATO countries are our allies. Now Turkey is faced with the great truth. NATO has put Ataturk on the target board. He publicly declared it to the world. - Doğu Perinçek"
 SUPEREVENT_9_T:0 "Turkish Headscarves Crisis"
 SUPEREVENT_9_DESC:0 "A hijab does not make a religious person who does not have a moral veil. - Hz. Mevlana"
 SUPEREVENT_10_T:0 "Ataturk's Ideal State"
 SUPEREVENT_10_DESC:0 "One day my mortal body will turn to dust, but the Turkish Republic will stand forever. - Mustafa Kemal Atatürk"
 SUPEREVENT_11_T:0 "The End Of The Sectarian Woes"
 SUPEREVENT_11_DESC:0 "If every Turk performs the task of his place with faith, the idea of Turkism becomes solid. Turkishness becomes stronger. - Hüseyin Nihal Atsız"
 SUPEREVENT_12_T:0 "Turkey Invents Its Own Planes"
 SUPEREVENT_12_DESC:0 "The future is in the heavens. Nations that cannot protect their skies will never be sure of their tomorrow. - Mustafa Kemal Atatürk"
 SUPEREVENT_13_T:0 "Turkish Germany Proclaimed"
 SUPEREVENT_13_DESC:0 "The borrower sells his freedom. -German Proverb"
 SUPEREVENT_14_T:0 "Turkish Industry Achieved"
 SUPEREVENT_14_DESC:0 "Long run is a misleading guide to current affairs. In the long run, we are all dead. -John M. Keynes"


 X_T:0 "Welcome to §YMD +Turkey§!"
 MOD_OPENING_DESC:0 "Welcome to the mod. The mod aims to make Turkey detailed and playable. So please interact with us when you find a error or you have got a suggestion about the mod.\n\nCurrently, alternative parts of the mod related:\n\n AKP, Lib AKP, CHP, MHP, Mafias, Islamic Movement, HEPAR, ANAP, DSP, SAADET, GENÇPARTİ, LDP, ÖDP, EMEP, TKP, AYM, MIT, Technocratic HP, Perincek State and Kemalist Junta.\n\nHow To Go These Paths (Click)--->\n\n§RFor real experience, open the sounds and the super events from the settings!§!\n\n\n\n+Don't click the custom flag decisions!\nTo find Easter-Eggs open the Fictional Reality.\nMD+Turkey 0.03.3 UNK V.//MD 1.12.3A V."
 BITCOIN_DESC:0 "Settings Of The Mod"
 MD_GO:0 "§GLet's Go!§!"
 FAQ_S:0 "Paths/FAQ P:1"
 FAQ_1_DESC:0 "How can we get the other parties like CHP etc?\n\nThese parties must take power through pre-held elections. These parties will be in power in advance and will receive their focus later than usual.\n\nHow can we get Ottoman Empire?\n\nTo get the Ottoman Focus, you need to achieve the decisions of the Islamist Restaritionists. After completing these decisions you will be redirected to the focus tree. \n\nHow can we get a Mansur Yavas Or Ekrem Imamoglu?\n\nFor Ekrem Imamoglu and Mansur Yavas to arrive, the CHP needs to win the 2018 elections. Ince will lead the country from 2018 to 2021, and when the year is 2021, you will face the question. Ekrem Imamoglu or Mansur Yavas? You will choose one, and you have to make Ince resign to get Ekrem Imamoglu or Mansur."
 RETURN_TO_MENU_MD_DESC:0 "§YReturn To Menu§!"
 FAQ_S_2:0 "Paths/FAQ P:2"
 FAQ_2_DESC:0 "How can we get the Ulkists In Power? (Expired)\n\nIt is necessary to finish the Turkic Union focuses to bring the nationalists to the top. After finishing these Turkic focuses, it is necessary to organize the ulkists in the country through the decisions and bring the ulkist coup with a decision.\n\nHow can we get HEPAR?\n\nIn order to get HEPAR, Osman Pamukoglu needs to be disturbed by the events in Turkish politics. You can adjust this in the decisions section. Osman Pamukoglu, who is uncomfortable with Turkish politics, will enter politics and we will ensure that he wins the election. After HEPAR wins the election, you will be redirected to focus."
 FAQ_S_3:0 "Paths/FAQ P:3"
 FAQ_3_DESC:0 "How can we get the mafias or the anarchists to power?\n\nFirst of all, the "Fictional reality" part needs to be opened by settings that occur at the start then an event will be coming around November 22, 2000. That event will be about "Raşhan Amnesty". In that event, you will be directed to the focus tree by pressing one of the decisions that indicate the anarchists or mafias.\n\nHow can we get the Constitutional Court as a head of state?\n\nFirstly you need to focus on the "Constitutional Court" decisions, afterwards, you need to politicize the court, to provoke the military for intervention. When the military completely prepared for intervention, the event would be launched. The event gives two options, with the first option you can have the AYM as the power."
