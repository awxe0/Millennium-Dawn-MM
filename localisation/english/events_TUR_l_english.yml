 Turkey.121.title:0 "Coup Attempt Of 15 July Has Been Failed"
 Turkey.121.desc:0 "The coup d'état was attempted in Turkey against state institutions, including the government and President Recep Tayyip Erdoğan.  The attempt was carried out by a faction within the Turkish Armed Forces that organized themselves as the Peace at Home Council- whose members have never been identified. They attempted to seize control of several unimportant places in Ankara, Istanbul, Marmaris, and elsewhere, such as the Asian side entrance of the Bosphorus Bridge but failed to do so after forces loyal to the state defeated them. The Council cited an erosion of secularism, elimination of democratic rule, disregard for human rights, and Turkey's loss of credibility in the international arena as reasons for the coup. The government said the coup leaders were linked to the Gülen movement, which is designated as a terrorist organization by the Republic of Turkey and led by Fethullah Gülen, a Turkish businessman and cleric who lives in Pennsylvania. The Turkish government alleged that Gülen was behind the coup (which Gülen denied) and that the United States was harboring him. Events surrounding the coup attempt and the purges in its aftermath reflect a complex power struggle between Islamist elites in Turkey.\n\nDuring the coup attempt, over 300 people were killed and more than 2,100 were injured. Many government buildings, including the Turkish Parliament and the Presidential Palace, were bombed from the air. Mass arrests followed, with at least 40,000 detained, including at least 10,000 soldiers and, for reasons that remain unclear, 2,745 judges. 15,000 education staff were also suspended and the licenses of 21,000 teachers working at private institutions were revoked after the government stated they were loyal to Gülen. More than 77,000 people have been arrested and over 160,000 fired from their jobs, on reports of connections to Gülen.\n\nReactions to the event were largely against the coup attempt, both domestically and internationally. The main opposition parties in Turkey condemned the attempt, while several international leaders—such as those of the United States, NATO, the European Union, and neighboring countries—called for "respect of the democratic institutions in Turkey and its elected officials." International organizations expressed themselves against the coup as well. The United Nations Security Council, however, did not denounce the coup after disagreements over the phrasing of a statement.-\n\nPresident Recep Tayyip Erdoğan said the head of United States Central Command, chief General Joseph Votel, was "siding with coup plotters", after Votel criticized the Turkish government for arresting the Pentagon's contacts in Turkey."
 Turkey.121.a:0 "Zafer!"
 Turkey.122.title:0 "Coup Attempt Of 15 July Has Been Succeded"
 Turkey.122.desc:0 "The coup d'état was attempted in Turkey against state institutions, including the government and President Recep Tayyip Erdoğan. The attempt was carried out by a faction within the Turkish Armed Forces that organized themselves as the Peace at Home Council- whose members have never been identified. They controlled and seized several unimportant places in Ankara, Istanbul, Marmaris, and elsewhere, such as the Asian side entrance of the Bosphorus Bridge. The Council cited an erosion of secularism, elimination of democratic rule, disregard for human rights, and Turkey's loss of credibility in the international arena as reasons for the coup. The government said the coup leaders were linked to the Gülen movement, which is designated as a terrorist organization by the Republic of Turkey and led by Fethullah Gülen, a Turkish businessman and cleric who lives in Pennsylvania. The Turkish government alleged that Gülen was behind the coup (which Gülen accepted) and that the United States was harboring him. Events surrounding the coup attempt and the purges in its aftermath reflect a complex power struggle between Islamist elites in Turkey.\n\nDuring the coup attempt, over 300 people were killed and more than 2,100 were injured. Many government buildings, including the Turkish Parliament and the Presidential Palace, were bombed from the air. Mass arrests followed, with at least 40,000 detained, including at least 10,000 government personnel and, for reasons that remain unclear, 2,745 judges. 15,000 education staff were also suspended and the licenses of 21,000 teachers working at private institutions were revoked after the government stated they were loyal to Erdogan. More than 77,000 people have been arrested and over 160,000 fired from their jobs, on reports of connections to Erdogan.\n\nReactions to the event were largely against the coup attempt, both domestically and internationally. But the coup ended with success."
 Turkey.122.a:0 "Aman Tanrım"
