 Turkey.531.desc:0 "Due to the elections, the need for dry control in the economy was felt. Since the increase in foreign currencies will cause us political difficulties and interest rates cannot be increased for political reasons, the TCBM made this decision under the pressure of the political party.\n\\nThere was a lot of cost in not getting the exchange rate under control, the Central Bank suffered extraordinary losses. The Deceleration of the exchange rate in the economy began to disappear and bad changes began to appear in interbank trading. This will inevitably cause great harm to Turkey in the future."
