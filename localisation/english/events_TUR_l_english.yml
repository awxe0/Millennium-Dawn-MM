 Turkey.359.title:0 "#OYMOYYOK Hashtag"
 Turkey.359.desc:0 "President Erdogan met with young people before YKS tomorrow via video conference and answered their questions about YKS, social media and the coronavirus epidemic. "We didn't want students to have another month of exam stress, "he said."if we hated social media, we wouldn't have used it so widely and effectively," he said, citing his 16 million followers on Twitter." said. Erdogan said that they will create a strong legal infrastructure on social media, saying: "with the legal regulations that we will make, we will restore our nation to a reliable internet environment." said.\n\nAs the live stream continued on platforms such as YouTube and Twitter, there were Reaction comments from many young viewers, such as "no vote moy," "see you at the ballot box." After the comments, the post was closed to comments, while the reaction of young people also took to social media with the hashtag #Oymoyok."
 Turkey.359.a:0 "Who they think they are?"
 Turkey.360.title:0 "Prompter Accident"
 Turkey.360.desc:0 "President Erdogan experienced a "prompter accident" live on air. Erdogan failed to catch up when the sentences flowed quickly on the screen and intervened to "undo", but the team was warned: "We are live." Erdogan was then seen biting his lip."
 Turkey.360.a:0 "Terrible News!"
 Turkey.361.title:0 ""Hudut Namustur" Banners"
 Turkey.361.desc:0 "6 teenagers were arrested with the banner ‘Hudut Namustur' they hung. This incident caused an explosion on social media. We will deal a blow to the stability of our people and their trust in us."
 Turkey.361.a:0 "Sounds Not Good At All"
 Turkey.362.title:0 "Legacy Of 28th February"
 Turkey.362.desc:0 "The 1997 military memorandum in Turkey refers to the decisions issued by the Turkish military leadership on a National Security Council meeting on 28 February 1997. This memorandum initiated the process that precipitated the resignation of Islamist prime minister Necmettin Erbakan of the Welfare Party, and the end of his coalition government.\n\nAs the government was forced out without dissolving the parliament or suspending the constitution, the event has been famously labeled a "postmodern coup" by the Turkish admiral Salim Dervişoğlu. The process after the coup is alleged to have been organized by the Western Working Group, a purported clandestine group within the military."
 Turkey.362.a:0 "Military Has Huge Presence In Politics"
 Turkey.363.title:0 "Legacy Of 15th July"
 Turkey.363.desc:0 "On July 15, we defeated the treacherous coup attempt. Gulen's organization, which organized within us and occupied all levels of the state, could not destroy Turkey by using the power of the state. Because people didn't want it. The Turkish nation has sided with President Recep Tayyip Erdogan in this treacherous coup attempt. In addition, the lieutenant generals and generals who caused this treacherous coup attempt were arrested and sentenced to severe punishment for the destruction of the state of the Republic of Turkey."
 Turkey.363.a:0 "Long Live The Heroic Turkish Nation!"
 Turkey.364.title:0 "The GENÇPARTİ Requests Our Support"
 Turkey.364.desc:0 "Members of the party of the youth party are asking for our support. The reason they want support is to ensure that their own party hangs the dam and holds power. Sir, should we support them or not?"
 Turkey.364.a:0 "Support Them"
 Turkey.364.b:0 "There Is No Need For Supporting Them"
 Turkey.365.title:0 "Covid-19 Hits Our State"
 Turkey.365.desc:0 "The Corona virus has been infected in our country. Together with these viruses, our economy will decline, and spending to prevent the virus and economies will damage economic activity in high numbers."
 Turkey.365.a:0 "Covid-19 Crisis On The Action"
 Turkey.366.title:0 "NATO Visits To Hatay"
 Turkey.366.desc:0 "NATO Secretary General Jens Stoltenberg came to Hatay to make various visits together with Deputy Foreign Minister Yavuz Selim Kiran.\n\nNATO Secretary General Jens Stoltenberg on Tuesday, 07 May 2019 Hatay airport at 10.45 a.m., Yavuz Selim Kıran, Deputy Minister of Foreign Affairs, representatives of the delegation of representatives of NATO member countries and observer countries born of the womb of occurrence of the governor of Hatay, Hatay mayor Lütfü savaş, Provincial Gendarmerie Commander Colonel Uğur Ertekin members of the protocol and welcomed.\n\nStoltenberg and the accompanying delegation then came to the Hatay Provincial Disaster and Emergency Directorate.\n\nNATO Secretary General Stoltenberg chaired by Directorate meeting held in the parlors of the meeting Hatay AFAD Turkey "regional threats in optics", “combating irregular migration in Turkey”, an olive branch and Euphrates Shield areas in the aftermath of the struggle with terrorism terrorist organizations in the operational areas that have been purified from the return to where there were discussed such topics as evaluation meetings.\n\nAfter the meeting, which was closed to the press, the Secretary-General and the accompanying delegation attended the primary school within the scope of the social program organized for them and experienced the cuisine of Hatay, St. They left our city by air, visiting the Pierre Church and the Hatay Archaeological Museum."
 Turkey.366.a:0 "Very Good News For Hatay Situation"
 Turkey.367.title:0 "NATO Denounces Syrian Claims In Hatay"
 Turkey.367.desc:0 "NATO completely rejected Syria's requests in Hatay and stated that Hatay is a Turkish Region. NATO states that Syria is waging war against all NATO countries in the face of any attack to take Hatay."
 Turkey.367.a:0 "NATO Works Well"
 Turkey.368.title:0 "Recep Tayyip Erdogan Starts His African Trip"
 Turkey.368.desc:0 "Recep Tayyip Erdogan announced the start of his trip to Africa. President Recep Tayyip Erdogan will travel to Angola, Togo, Burkina Faso, Liberia, and Nigeria on an African trip. As a result of this trip, it is obvious that Turkey will become politically stronger."
 Turkey.368.a:0 "Very Interesting"
 Turkey.369.title:0 "Erdogan Publishes His New Book"
 Turkey.369.desc:0 "The book titled ‘A Fairer World is Possible’, written by President Recep Tayyip Erdoğan and first published in Turkish by Turkuvaz Kitap, is being released tomorrow.\n\nThe book, which will be available from 40 TL, contains the following words:\n\nIt is neither moral nor fair for only five countries to decide on issues that will affect the fate of the whole world. The world is bigger than five countries.\n\nA UN reflecting multiculturalism and multipolarity is needed to ensure a just and more sustainable global peace.\n\nThe world is neither unipolar nor bipolar, it is neither under the cultural hegemony of a dominant culture nor of several privileged actors. It is possible to build a multipolar, multicentric, multicultural, more inclusive, and just world. The first address for such a world is the UN.\n\nThe path to peace, stability, justice and effective global governance is through the reform of the UN. The reform of the UN, and in particular the restructuring of the structure of the Security Council, will of course come to life with the reconciliation of all the countries of the world.\n\nAs Turkey, we have been expressing our proposal within this framework for a long time and opening it up to the discussion of all countries. our solution proposal is to dominate a perspective that finds itself in the expression ‘The world is bigger than five and focuses on changing the structure of the UN Security Council. Restructuring the Council in such a way that it is structured to represent continents, beliefs, origins, and cultures in the fairest way possible will be a revolutionary step towards a solution and the establishment of global peace.”"
 Turkey.369.a:0 "Interesting"
 Turkey.370.title:0 "Cem Uzan Attacks To EU"
 Turkey.370.desc:0 "In a speech, Cem Uzan attacked the European Union. Cem Uzan said "As a result of the negotiations between the UK and Turkey, Turkey will not enter the European Union, and the UK will also exit. The fact that he says the UK would exit. Europe fell to panic."
 Turkey.370.a:0 "Lovely"
 Turkey.371.title:0 "Cem Uzan Signs Agreements With British Industrialists"
 Turkey.371.desc:0 "Cem Uzan came to the UK and held meetings with British investors there. As a result of the meetings, both sides were satisfied. The British will invest in Turkey, and Turkey, in return, will facilitate the UK's purchase of oil from Arabia."
 Turkey.371.a:0 "Great Deal"
 Turkey.372.title:0 "CHP-MHP Alliance Has Been Formed"
 Turkey.372.desc:0 "The CHP and MHP negotiations have ended. As a result of the negotiations, the two sides decided to become an alliance. The purpose of this alliance is to overthrow us from power. By seizing the legitimate power."
 Turkey.372.a:0 "They Are United Against Our Supremacy"
 Turkey.373.title:0 "Ekmeleddin Ihsanoglu Becomes President Candidate Of CHP-MHP"
 Turkey.373.desc:0 "Kılıçdaroğlu visited MHP Chairman Devlet Bahçeli at his office in the Parliament as part of his talks on the presidential candidate.\n\nAfter the meeting, Kılıçdaroğlu made a statement to journalists and recalled that he had been visiting various political parties, non-governmental organizations and artists for some time and had received their opinions on the presidency.\n\nCHP Chairman Kemal Kilicdaroglu offered MHP Chairman Devlet Bahceli the name of former Secretary General of the Organization of Islamic Cooperation (OIC) Ekmeleddin Ihsanoglu as a Presidential "candidate for the roof". MHP Leader Bahceli also announced that they welcomed this candidate positively and that they would work together around this name."
 Turkey.373.a:0 "The Enemy Has Been Nominated"
 Turkey.374.title:0 "Pelican Files"
 Turkey.374.desc:0 "The Pelican files refer to an unattributed list of 27 different items released in April 2016 detailing points of conflict between the Turkish Prime Minister Ahmet Davutoğlu and President Recep Tayyip Erdoğan, two politicians from the Justice and Development Party of Turkey who assumed their respective offices on 28 August 2014.[1] Released by unnamed Erdoğan supporters as a WordPress.com blog, the files heavily criticised Davutoğlu for disobeying Erdoğan's political agenda. The release of the files was widely attributed to sparking the events that would eventually lead to Davutoğlu being ousted as Prime Minister. The name "Pelican files" is a reference to the 1993 political thriller The Pelican Brief. The files were released at a time when relations between Davutoğlu and Erdoğan had deteriorated sharply. Rumours that Davutoğlu had submitted his resignation as Prime Minister was followed by the AKP Central Executive Decision Committee (MKYK) revoking Davutoğlu's right to appoint provincial and district party representatives. On 4 May 2016, a day earlier than planned, Davutoğlu and Erdoğan held a meeting at the Presidential Complex.[7] Although it was initially dubbed as a 'routine meeting' by presidential staff, the meeting was followed shortly after by a decision by the AKP to hold an Extraordinary Congress in 2016 in which Davutoğlu would not stand as a leadership candidate.The publication and aim of the "memorandum" was predicted by blogger Fuat Avni. On 19 April 2016 he wrote that Erdoğan was planning a "coup against Davutoğlu" and that the "pelican" of "Berat and Serhat" (a reference to Erdoğan's son-in-law and his brother) was about to fly. It is described as a palace coup d'état in Turkish social media and other sources."
 Turkey.374.a:0 "Binali Yildirim's Way Has Been Opened"
 Turkey.375.title:0 "Good Conclusion At MHP-DSP Coalition Negotiations"
 Turkey.375.desc:0 "The negotiations between MHP and DSP yielded results. MHP will remain with the DSP in the elections. The fact that this decision has been made is very good news for DSP and Bülent Ecevit."
 Turkey.375.a:0 "Great News"
 Turkey.376.title:0 "Good Conclusion At ANAP-DSP Coalition Negotiations"
 Turkey.376.desc:0 "The negotiations between ANAP and DSP yielded results. ANAP will remain with the DSP in the elections. The fact that this decision has been made is very good news for DSP and Bülent Ecevit."
 Turkey.376.a:0 "Great News"
 Turkey.377.title:0 "The State of Bulent Ecevit"
 Turkey.377.desc:0 "Our leader Ecevit looks old. We may have cured Bülent Ecevit and found the right diagnosis to prevent his death, but there is no solution to old age. We have two options in front of us: to continue with Ecevit or to send Ecevit to retirement without risking power and to continue on the road with the person shown by Ecevit."
 Turkey.377.a:0 "It Is Time To Resign Him!"
 Turkey.377.b:0 "He Will Rule Us Until His Death"
 Turkey.378.title:0 "Ecevit's Failing Policies"
 Turkey.378.desc:0 "Ecevit's policies are starting to fail. Political maneuvers and movements are very old. We must ensure that we are politically strengthened and modernized. Making a squad change will definitely fix these problems."
 Turkey.378.a:0 "Kadro Movement Shall Be Done Fastest As Possible"
 Turkey.379.title:0 "Creation Of The YTP"
 Turkey.379.desc:0 "The health condition of elder statesman Bülent Ecevit, the Prime Minister and leader of the party led to rumors that his Deputy Prime minister and Minister of State, Hüsamettin Özkan, was plotting to replace him. As a result, Özkan was forced to resign. However, nearly half of DSP's parliamentarians followed him including İsmail Cem, the Minister of Foreign affairs. Özkan, Cem, and Kemal Derviş, the Minister of State in charge of the economy and the former Vice President of the World Bank, then decided to establish a new social democratic party, Yeni Türkiye Partisi. Cem became the leader of the party."
 Turkey.379.a:0 "Traitors!"
 Turkey.380.title:0 "Rising TELSIM!"
 Turkey.380.desc:0 "With the Young Party taking power, the TELSIM company has become stronger. This strengthening brought the young Party to more advanced levels and encouraged it. The fact that this company has gained political content can give the company a quick boost and can cause it to crash. We need to strengthen the company."
 Turkey.380.a:0 "No Need For Expanding The Company"
 Turkey.380.b:0 "Expand The Company"
 Turkey.381.title:0 "Ekrem Imamoglu Attends Twitch"
 Turkey.381.desc:0 "Ekrem Imamoglu, who has recently become popular as hw is ruling Istanbul (A Metropolitan City), has announced that he will be broadcasting with the twitch broadcaster Purplebixi. It seems that the CHP is increasing campaigns in social media in order to get the votes of generation Z. Social media platforms are one-on-one to get votes."
 Turkey.381.a:0 "Twitch Is Turning To Somewhat Twitter Politics"
 Turkey.382.title:0 "Central Bank Lowers Interest Rate To 16"
 Turkey.382.desc:0 "The Central Bank has reduced its policy interest rate from 18 percent to 16 percent. The discount was much higher than expected. The bank lowered the interest rate by 100 basis points at the meeting on September 23. The dollar picked up momentum after the Central Bank's interest rate decision."
 Turkey.382.a:0 "Dollar Is Racing Itself"
 Turkey.383.title:0 "2003 The Delayed Elections.."
 Turkey.383.desc:0 "The 15th Turkish general election was going to be held on 3 November 2002 but following the resistance of the DSP-MHP-ANAP coalition led by Bülent Ecevit the elections were delayed to 6 June 2003. It was the 15th general election going to be held in Turkey. All 550 members of the Grand National Assembly were up for election."
 Turkey.383.a:0 "Let's Go!"
 Turkey.384.title:0 "Uzbekistan Directly Joins To The Turkic Union"
 Turkey.384.desc:0 "With the yes votes of the members of the Turkic Council, Uzbekistan became a full member. The Turkic Council is growing."
 Turkey.384.a:0 "Good News"
 Turkey.385.title:0 "Hungary And Turkmenistan Becames Spectator Of The Turkic Union"
 Turkey.385.desc:0 "With the yes votes of the members of the Turkic Council, Turkmenistan and Hungary became an observer of the Turkic Council. The Turkic Council is growing."
 Turkey.385.a:0 "Good News"
 Turkey.386.title:0 "Ukraine And Finland Become Spectator Of The Turkic Union"
 Turkey.386.desc:0 "With the yes votes of the members of the Turkic Council, Ukraine and Finland became an observer of the Turkic Council. The Turkic Council is growing."
 Turkey.386.a:0 "Good News"
 Turkey.387.title:0 "The Topic of The Two Rizelians"
 Turkey.387.desc:0 "Two Rizelians met each other in Rize. They had discussions about the state of the country. Judging by the wide window, these two Rizelians have left deep traces in the State of the Republic of Turkey."
 Turkey.387.a:0 "After Malatya's Leadership Its Rize's Turn"
 Turkey.388.title:0 "CHP And IYI Calls For Early Elections"
 Turkey.388.desc:0 "CHP Chairman Kemal Kılıçdaroğlu visited IYI Party Chairman Meral Akşener. After the visit at the IYI Party Headquarters, the two leaders made a joint statement.\n\nKilicdaroglu, claiming that the economic situation is not good, said: "The Turkish lira is losing extraordinary value, but there is nobody to produce a solution in Turkey. Normally, the Central Bank should deal with price stability, while the Central Bank has ceased to function, is in the position of an institution that looks at the depreciation of the Turkish Lira and the rise of the currency as a spectator," he said.\n\nKilicdaroglu, said that the institution legally authorized for price stability should not remain in the position of an audience for this course, said: "It cannot interfere, there are no intervention tools, there are no reserves, they have evaporated $ 128 billion, it is still unclear where it is going. Its net reserve is minus $ 35 billion," he said.\n\nKılıçdaroğlu stated that it is not right to remain silent about the economic situation and said, "We are saying that they should produce a solution and say something about the course of the economy. How will they stop the melting of the Turkish Lira, we want someone to come out and explain about it. There is a wall in front of us, there is no explanation," he said.\n\nKilicdaroglu, who said that they met with Aksener because they feel responsible for the country's economy, said: "As the Turkish lira decays, Turkey has the appearance of a poor country that is completely below economic standards. Everything has become cheaper, factories have become cheaper, institutions have become cheaper, there has been a perception that the whole can be bought for a much lower dollar," he said."We are calling them again.\n\nWe know that you can't manage, either become a director of the Central Bank, make a statement, or if you say, 'I don't think it's right to interfere with the Central Bank,' don't intervene. A huge institution has been discredited not only in Turkey but also in the world. I am calling on him clearly and unequivocally, you can't manage, don't put any more burden on the nation's back. This nation cannot bear such a burden. As soon as possible, Turkey needs to go to the elections.""
 Turkey.388.a:0 "Opposition Continues To Attack"
 Turkey.389.title:0 "Binali Becomes "Aksakal" Of The Turkic Council"
 Turkey.389.desc:0 "President Recep Tayyip Erdogan, Head of the Cooperation Council of Turkic-Speaking Countries. In his speech at the summit, Erdogan announced that Binali Yıldırım had been appointed to Aksakal of Turkey."
 Turkey.389.a:0 "Nice To See That Binali Has A Job Now"
 Turkey.390.title:0 "Osman Pamukoglu Is Ready To Destroy Terrorists"
 Turkey.390.desc:0 "Osman Pamukoglu is now ready. We can get him to serve in the army or we can get him to resign and go into politics. Sir, it's your choice."
 Turkey.390.a:0 "He Should Resign And Go For Politics"
 Turkey.390.b:0 "He's Better In Armed Forces"
 Turkey.391.title:0 "Huge Hikes In The Gasoline Lead To Traffic"
 Turkey.391.desc:0 "After the rise in the dollar, there was a 52-cent hike in gasoline, a 50-cent hike in gasoline, and a 45-cent hike in LPG. Before the hike, which took effect from midnight, there was a queue for fuel at gas stations."
 Turkey.391.a:0 "Gasoline Crisis!"
 Turkey.392.title:0 "Nakhchivan Agreement (Creation of The Turkic Union)"
 Turkey.392.desc:0 "The Nakhchivan Agreement was signed on October 3rd, 2009. It is an agreement signed by Azerbaijan, Kazakhstan, Kyrgyzstan, and Turkey, which are participating states at the Summit of Heads of State of Turkic-Speaking Countries, and is a prerequisite for the establishment of the Turkic Union. The main mission of the agreement is the institutionalization of cooperation between the participating states. With this agreement, it was decided to establish an international organization called the Turkic Union. The summit hosted by President of Azerbaijan Ilham Aliyev was attended by President of Turkey Abdullah Gul, President of Kazakhstan Nursultan Nazarbayev, President of Kyrgyzstan Kurmanbek Bakiyev, and Vice President of Turkmenistan Hır Saparliyev."
 Turkey.392.a:0 "Here We Go!"
 Turkey.392.b:0 "Here We Go! §Y(With No Sound)§!"
 Turkey.393.title:0 "Central Bank Sets Interest Rate To 10.5"
 Turkey.393.desc:0 "The central bank decided to change interest rates based on the economy doing well. The decision will take the country somewhere in the economic sense. We hope that our Central Bank has ensured the profit of our country."
 Turkey.393.a:0 "Central Bank Made Its Decision"
