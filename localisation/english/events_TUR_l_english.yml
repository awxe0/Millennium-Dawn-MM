 Turkey.353.title:0 "Provocation Attack On Kurdish Family" 
 Turkey.353.desc:0 "The home of a Kurdish family that was attacked by a group in Onya on May 12 was attacked for the second time today. 7 people from the Dedeoglu family were killed in the attack. Part of the house was set on fire by the attackers. According to DHA, the incident occurred at about 6.50 pm on Ozshahin Street in the Hasankay District of the Central Meram district. On May 12, the family was attacked by a group of 60 people with knives, stones, and sticks, saying: "We are country people, we will not live here." 5 people arrested in connection with the first attack were released on grounds of lack of evidence. A large number of riot police were deployed around the house while the house was inspected by the prosecutor and police chief. Relatives of the family are expected to arrive from Kars. The names of those killed were as follows: Yaşar Dedeoğlu, Barış Dedeoğlu, Serpil Dedeoğlu, Serap Dedeoğlu, Ipek Dedeoğlu, Metin Dedeoğlu, Sibel Dedeoğlu. Funeral vehicles were brought to the area. Members of the press are not allowed near the house, which is cordoned off by police."
 Turkey.353.a:0 "Uncertain Times"
 Turkey.354.title:0 "Mete Gazoz Became Olympic Champion" 
 Turkey.354.desc:0 "Our national archer, Mete Gazoz, became Olympic champion! We are happy that our country is in a good position in sports."
 Turkey.354.a:0 "Nice"
 Turkey.355.title:0 "Recep Tayyip Erdogan Speeks Against Americans" 
 Turkey.355.desc:0 ""Various campaigns are being carried out," he said, referring to tensions with the United States, fluctuations in the economy, and a rise in the dollar. Never listen to them, don't. Remember that if they have dollars, we have people, we have rights, we have Allah. We've worked hard, we've worked hard. What were we 16 years ago, What are we now? We'll be better. I wish you patience and hard work. We will work hard, run hard and enter 2023 very differently," he said."
