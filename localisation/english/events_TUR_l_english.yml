 Turkey.610.title:0 "Central Bank Increases Interest Rate To 15"
 Turkey.610.desc:0 "The Central Bank of the Republic of Turkey (CBRT) has raised interest rates for the first time in 27 months. At the first Monetary Policy Committee (PPC) meeting chaired by CBRT President Hafize Gaye Erkan, the policy rate was increased from 8.5 percent to 15 percent with an increase of 650 basis points. After the decision, the Dollar/TL exchange rate saw 24.41 for the first time and the Euro/TL exchange rate saw 26.84 for the first time. Turkey's credit default swap (CDS) increased by 21 points to 518."
 Turkey.610.a:0 "We Need To Ease Our Economic Conditions"  
 Turkey.611.title:0 "Central Bank Increases Interest Rate To 17.5"
 Turkey.611.desc:0 "The Central Bank policy interest rate, which citizens are eagerly waiting for as well as the sectors directly related to the economy, has been announced. The rate hike was limited to 250 basis points (2.5%) and remained below expectations."
 Turkey.611.a:0 "We Need To Ease Our Economic Conditions"  
 Turkey.624.title:0 "Central Bank Increases Interest Rate To 25"
 Turkey.624.desc:0 "Turkey’s Central Bank hiked interest rates Thursday by 750 basis points from 17.5% to 25%. The larger than expected rise prompted the Turkish lira to recover from a record low."
 Turkey.624.a:0 "Good Reaction From The Central Bank"
 Turkey.630.title:0 "Central Bank Increases Interest Rate To 30"
 Turkey.630.desc:0 "The Central Bank's Monetary Policy Board decided to increase the one-week repo auction interest rate, which is the policy interest rate, from 25 percent to 30 percent. In a statement, the Central Bank emphasized that the Board gave "the continuation of the monetary tightening process in order to establish disinflation as soon as possible, to anchor inflation expectations and to control the deterioration in pricing behavior."
 Turkey.630.a:0 "Another Reaction"
 Turkey.631.title:0 "Central Bank Increases Interest Rate To 35"
 Turkey.631.desc:0 "The Monetary Policy Committee of the Central Bank of the Republic of Turkey (CBRT) convened under the chairmanship of Hafize Gaye Erkan. The Board increased the policy rate from 30 percent to 35 percent by increasing it by 500 basis points. In the announcement stating that the Board decided to continue the monetary tightening process in order to establish disinflation as soon as possible, to anchor inflation expectations and to control the deterioration in pricing behavior, it was pointed out that inflation occurred above the forecast in the third quarter of the year."
 Turkey.631.a:0 "Is This Really Working!?"
 Turkey.643.title:0 "Central Bank Increases Interest Rate To 40"
 Turkey.643.desc:0 "Turkey's central bank has raised interest rates to 40 percent, its highest level in nearly two decades, in a significant move to tame the country's runaway inflation after the country's president, Recep Tayyip Erdogan, had previously defied economic convention by cutting rates to slow price increases."
 Turkey.643.a:0 "Price Stability First!"
 Turkey.644.title:0 "Central Bank Increases Interest Rate To 42.5"
 Turkey.644.desc:0 "The Monetary Policy Committee (the Committee) has decided to raise the policy rate (the one-week repo auction rate) from 40 percent to 42.5 percent. Headline inflation edged up in November and remains in line with the outlook presented in the most recent Inflation Report."
 Turkey.644.a:0 "Price Stability First!"
 Turkey.645.title:0 "Central Bank Increases Interest Rate To 45"
 Turkey.645.desc:0 "Turkey's central bank on Thursday hiked its key interest rate to 45%, in line as expected. Inflation in Turkey increased to 64.8% year-on-year in December, up from 62% in November."
 Turkey.645.a:0 "Price Stability First!"
 Turkey.649.title:0 "Central Bank Increases Interest Rate To 50"
 Turkey.649.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday increased its policy interest rate by 500 basis points to 50 percent. This decision, taken 10 days before the local elections, is a valuable and strong signal value step in terms of the creditworthiness that the Central Bank is trying to restore."
 Turkey.649.a:0 "It Hurts!"


 Turkey.293.title:0 "Tanks Are Passing Through Ankara" 
 Turkey.293.desc:0 "We made it clear that the new government would put the country in a difficult position and would not adapt to our military. That's why our military intervention has become inevitable. The almighty Turkish nation, our goal is not to ensure stability through ultranationalism. Our goal is to win the direction in a democratic way!"
