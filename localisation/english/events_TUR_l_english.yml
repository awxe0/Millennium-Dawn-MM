 TurkeyF.171.title:0 "General Communist Military Congress"
 TurkeyF.171.desc:0 "Members of the government in the country were sent into exile. Power has completely passed into the hands of the communists. After the country fell into the hands of the communists, the communist parties began to experience discrimination. The difference was which communist party would rule Turkey.  The TKP leaders say that they are real communists, the ÖDP leaders say that they are populists, the EMEP leaders say that they are the ones who provide the real revolution, and the VATAN leaders say that they will provide the real establishment. Sir, which side will be brought to power by the communist army? The choice is yours." 
