 TurkeyF.1.title:0 "The military seized power"
 TurkeyF.1.desc:0 "The army saw the unrest and protests in the country as a cause of the coup and took to the streets. And the powerless power immediately gave up in a short time. The army has announced that it will take over an administration that will last about 3 years."
 TurkeyF.1.a:0 "Democracy disruption"
 TurkeyF.2.title:0 "Anti Gülen Movement Actions Began"
 TurkeyF.2.desc:0 "It is clear that FETO's goal is to overthrow the country. Aren't we even late for the start of operations against FETO?"
 TurkeyF.2.a:0 "Destroy Their Corrupted Organization!"
 TurkeyF.3.title:0 "Turkey Wants Gülen To Return Turkey"
 TurkeyF.3.desc:0 "Turkey appealed to the United States for Gulen to return to their country. Sir, should we hand Gulen over to Turkey, or should we stand up and defend Gulen and host him in the country?"
 TurkeyF.3.a:0 "He is going to stay in the United States"
 TurkeyF.3.b:0 "Send him to Turkey"
 TurkeyF.4.title:0 "United States Rejects Our Demands"
 TurkeyF.4.desc:0 "United States rejected our demand, as we expected so the Gulen will stay in the United States. This proves that the United States plotted the coup against our current regime."
 TurkeyF.4.a:0 "United States wants to destroy us!"
 TurkeyF.5.title:0 "United States Accepts Our Demands"
 TurkeyF.5.desc:0 "The United States unexpectedly accepted our requests. Now the problem of Gulen has been solved. There are positive steps in our relations with America."
 TurkeyF.5.a:0 "United States is a friendly country"
 TurkeyF.6.title:0 "Brunson Has Been Arrested"
 TurkeyF.6.desc:0 "During the July 15 investigation, a 'secret witness' testified against Brunson in the prosecution, and the evangelical priest Brunson was arrested on the grounds that he was linked to Gulen and the PKK. He was sentenced to 20 years in prison, for a total of up to 35 years, on charges of" supplying information that must remain confidential to the state for the purpose of political or military espionage."
 TurkeyF.6.a:0 "Feels Good To Act"
 TurkeyF.7.title:0 "American Reaction"
 TurkeyF.7.desc:0 "Sir, the Turks arrested Brunson, our priest, and put him on trial. Should we impose a few series of sanctions to save him from Turkey? Sanctions against Turkey will affect our relationships with Turkey very badly."
 TurkeyF.7.a:0 "We need him!"
 TurkeyF.7.b:0 "Don't risk relations"
 TurkeyF.8.title:0 "American React"
 TurkeyF.8.desc:0 "The United States has announced that it will begin sanctions against us if we do not give Brunson to the United States. If they start such a sanction, our economy will be badly affected and we will lose votes. Sir, should we let Brunson go?"
 TurkeyF.8.a:0 "He will stay!"
 TurkeyF.8.b:0 "Everything is lost! Send him back to the USA"
 TurkeyF.9.title:0 "Economy Minister Berat Albayrak Resigns"
 TurkeyF.9.desc:0 "Berat Albayrak announced in the evening that he was resigning from the economy ministry. His resignation was accepted and confirmed by Erdogan shortly thereafter. The country's economy is expected to improve with this good decision made by Recep Tayyip Erdogan."
 TurkeyF.9.a:0 "Economy must improve!"
 TurkeyF.10.title:0 "The Republic of Turkey invites us to unite"
 TurkeyF.10.desc:0 "The Republic of Turkey invites us to unite. Turkey believes that unity will bring Turkish power to the world. Sir, shall we accept it or not?"
 TurkeyF.10.a:0 "Accept It"
 TurkeyF.10.b:0 "Reject It"
 TurkeyF.11.title:0 "Azerbaijan Rejects Our Offer"
 TurkeyF.11.desc:0 "Azerbaijan rejected our offer. Azerbaijan believes that the merger will bring disorganization and disorder, also they don't want to risk their relations with Russia."
 TurkeyF.11.a:0 "Fine"
 TurkeyF.12.title:0 "Establishment Of The Turkic TV"
 TurkeyF.12.desc:0 "Turkic TV has been created by Turkic Union. Turkic TV programs are televised in Azeri, Bosnian, Turkmen, Kazakh, Kyrgyz, and Uzbek with Turkish-language subtitles, and include documentaries, talk shows, culture, and music programs as well as region-specific films and soap operas. Audiences also have the opportunity to learn Turkish through tutorials."
 TurkeyF.12.a:0 "Seems Nice"
 TurkeyF.13.title:0 "Turkish Unacceptable Expansionist Ultimatum"
 TurkeyF.13.desc:0 "The Turks sent us an ultimatum. There are unacceptable conditions in the ultimatum. War is near. Let the war preparations begin!"
 TurkeyF.13.a:0 "We should defend our state!"
 TurkeyF.14.title:0 "Turkey Wants To Buy Batumi"
 TurkeyF.14.desc:0 "Turkey wants to buy the Batumi region from us. Should we sell Batumi or not? If we sell, it would help our economy, but also can damage our peace."
 TurkeyF.14.a:0 "Sell It"
 TurkeyF.14.b:0 "Batumi is ours"
 TurkeyF.15.title:0 "Georgia Rejects Our Offer About Batumi"
 TurkeyF.15.desc:0 "Georgia doesn't want us to grow stronger in the region. So they rejected our offer to Batumi. They will not be able to stop a rising Turkey."
 TurkeyF.15.a:0 "Ah"
 TurkeyF.16.title:0 "NATO Equipment Unity Vote"
 TurkeyF.16.desc:0 "NATO has offered a vote to NATO countries if there are enough yes votes, NATO equipment will become common to all countries. If the vote is successful, the news will come. And if it fails, it won't even be brought up. The choice is yours."
 TurkeyF.16.a:0 "Every NATO countries should have the same weapons"
 TurkeyF.16.b:0 "We don't need equipment unity thing"
 TurkeyF.17.title:0 "NATO Industrialization Vote"
 TurkeyF.17.desc:0 "NATO has offered NATO countries a vote. Countries that agree to the vote will start an industrialization program under NATO. The choice is yours."
 TurkeyF.17.a:0 "NATO Industrialization Program Looks Nice"
 TurkeyF.17.b:0 "We don't need NATO Industrialization Program"
 TurkeyF.18.title:0 "NATO Armament Vote"
 TurkeyF.18.desc:0 "NATO has offered NATO countries a vote. Countries that agree to the vote will start an armament program under NATO. The choice is yours."
 TurkeyF.18.a:0 "NATO Armament Program Looks Nice"
 TurkeyF.18.b:0 "We don't need NATO Armament Program"
