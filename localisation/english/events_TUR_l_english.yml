 TurkeyF.45.title:0 "Return To Tengri Religion"
 TurkeyF.45.desc:0 "Our country is currently returning to the tengri religion. With the return to Tengriye, the terror in our country will decrease and Turkish love will rise to high levels."
 TurkeyF.45.a:0 "Traditional Religion Is The Best!"
 TurkeyF.46.title:0 "Electing A Khan"
 TurkeyF.46.desc:0 "As of today, we will choose our new Turkish khan. Sir, who will take the leadership of the Turks, who will be the great Hakan? This choice will change the fate of the Turks and the fate of the world in an absolute way, make your choice carefully."
 TurkeyF.46.a:0 "Ulkist Group"
 TurkeyF.46.b:0 "Aliyev Family"
 TurkeyF.46.c:0 "Chairman Mr. Erdogan"
 TurkeyF.46.d:0 "Kazakh Leadership"
 TurkeyF.47.title:0 "Gülen Movement's Links In The Schools Have Been Cleaned"
 TurkeyF.47.desc:0 "Links to the Gulen organization were screened in schools and suspects were arrested one by one. After a while, the suspects could not resist the harsh pressure that was usual and legal and confessed. We will destroy the nests of organizations in our country one by one."
 TurkeyF.47.a:0 "Mission Accomplished"
 TurkeyF.48.title:0 "Gülen Movement's Links In The Police Have Been Cleaned"
 TurkeyF.48.desc:0 "Police officers with links to the Gulen organization were screened by military teams and the suspects were arrested one by one. After a while, the suspects could not resist the harsh pressure that was usual and legal and confessed. We will destroy the nests of this organization, which has even entered the defense forces of our country, one by one."
 TurkeyF.48.a:0 "Mission Accomplished"
 TurkeyF.49.title:0 "Ankara-Tehran Anti-PKK Doctrine"
 TurkeyF.49.desc:0 "Iran has responded warmly to our warm encounter. As a result of your visit to Iran, we have reached an agreement with Iran. There was no way we weren't going to reach an agreement. As a result of the agreement, the two countries will keep their troops afloat against the PKK threat."
 TurkeyF.49.a:0 "United Against The Horror"
 TurkeyF.50.title:0 "Ankara-Baghdad Anti-PKK Doctrine"
 TurkeyF.50.desc:0 "Iraq has responded warmly to our warm encounter. As a result of your visit to Iraq, we have reached an agreement with Iraq. There was no way we weren't going to reach an agreement. As a result of the agreement, the two countries will keep their troops afloat against the PKK threat."
 TurkeyF.50.a:0 "United Against The Horror"
 TurkeyF.51.title:0 "Agreement With Ulkists"
 TurkeyF.51.desc:0 "The CHP group went to visit Devlet Bahceli, the leader of the nationalists. As a result of the visit, the Devlet Bahceli declared that it would direct ulkists to crush the PKK threat in the east."
 TurkeyF.51.a:0 "United And Armed Against The Horror"
 TurkeyF.52.title:0 "Invitation From Turkey"
 TurkeyF.52.desc:0 "After the normalization of relations between Greece and Turkey, an unexpected offer came from Turkey. Turkey is establishing the Mediterranean Bloc and wants us to be a part of it. Sir, what to do about this strange offer. Are we old enemies now?"
 TurkeyF.52.a:0 "We Are Honored For Creation Of This Alliance"
 TurkeyF.52.b:0 "This Alliance Is Dumb, Heleno-Turkism Is A Dream" 
