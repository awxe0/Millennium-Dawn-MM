 Turkey.300.title:0 "Deniz Baykal Resigns" 
 Turkey.300.desc:0 "Deniz Baykal, who appeared in front of the journalists, said:\n\nI'm announcing my assessment and decision, which has been expected for days. It's not a tape thing, it's a conspiracy. Conspiracy is a legal and immoral order. When you're plotting, sometimes you break into a house. With secret shots, you cut and cut the most unprotected images of people, edit them, and distort them. All over the world, you destroy the moral understanding of all religions and the moral understanding of humanity. They don't care about people's honor. Those who carried out the conspiracy were perverts, not for blackmail. To do politics held.\n\nA conspiracy has been fabricated. A fresh, two-week conspiracy. One person is not the target of this conspiracy. It is the struggle of the CHP against the civilian dictate regime, which it conducts almost alone. It has been edited and released in the last two weeks. The plot loom is up-to-date and fresh with its materials and shots. It is impossible for power to be exercised without mobilizing its power and possibilities. It is impossible for such a crude conspiracy bench to be prepared and released in the last two weeks without the knowledge of the power summit. So-called bona fide statements after the incident are not enough to cover up the guilt of the bench behind the scenes. This cannot be released without the knowledge and approval of the government. Indeed, those who shame are the ones who commit shame.\n\nI also believe in the sincerity of the messages of sorrow I have received from the United States, from Pennsylvania. It's a shame, but I have a word to say to those who start. You can't defend them with a reputation for immoral and unlawful conspiracies. It's a shame, but it's those who say it's a shame to open up a living space for conspiracy. We'll all see how far those who credit these conspiracies can go.\n\nI will not surrender in the face of this painting. I won't let anyone question me. If there is a price for it, and if that price is to leave the CHP, I will pay that price. Just because I quit doesn't mean running away. On the contrary, it is a challenge. I quit: I'm not the target of this, it's the CHP.\n\nIt was announced that Cevdet Selvi, one of the vice-presidents, would act as deputy leader in accordance with the party's charter...\n\nAfter Baykal announced his decision to resign, some party members were heard saying loudly, "No, don't do it."\n\nSome party members were also seen unable to hold back tears during the announcement."
 Turkey.300.a:0 "Sad Moments For CHP" 
 Turkey.300.b:0 "Sad Moments For CHP §Y(With No Speech)§!" 
 Turkey.301.title:0 "An Attack On Kılıçdaroğlu" 
 Turkey.301.desc:0 "Attack on CHP leader Kemal Kılıçdaroğlu was attacked with fists in protest by a group after the funeral prayer of martyr contract infantry private Yener Kırıkçı in Çubuk district. With the intervention of his close bodyguards and surrounding security forces, Kılıçdaroğlu was taken to a nearby house. "
 Turkey.301.a:0 "He Must Be In Bad Situation" 
 Turkey.302.title:0 "The March for Justice" 
 Turkey.302.desc:0 "The March for Justice was a 450 km (280-mile) march from Ankara to Istanbul to protest against arrests that were made as part of the government crackdown following the July 2016 coup d'état attempt. After the coup attempt, the ruling Justice and Development Party (AKP) government declared a state of emergency. Since then at least 50,000 people have been arrested and another 140,000 people have been removed from their positions. The protest was led by opposition leader Kemal Kılıçdaroğlu, in response to a lengthy prison sentence that Enis Berberoğlu received for allegedly giving the press a video that shows Turkish intelligence smuggling weapons into Syria. The march concluded in Istanbul on 9 July with a rally attended by hundreds of thousands of people, during which Kılıçdaroğlu spoke at length about the effect that the government purge has had on the judiciary and rule of law in Turkey.\n\nTurkish President Recep Tayyip Erdoğan declared the protest march illegal. During the march, Prime Minister Binali Yıldırım and President Erdoğan compared the march to the July 2016 coup attempt and accused the participants and Kılıçdaroğlu of supporting the Gülenist Hizmet movement organization that the government says was behind the coup attempt. Counter-demonstrations have been held by AKP supporters. Police officers provided security for the marchers, and the march concluded peacefully at Maltepe, Istanbul."
 Turkey.302.a:0 "What The?"
 Turkey.303.title:0 "Yenikapi Rally" 
 Turkey.303.desc:0 "Yenikapı rally for democracy and martyrs rally, organized in Yenikapi Square on August 7, 2016, the Justice and Development Party, the Republican People's party, and the Nationalist Movement Party attended a rally against the coup attempt on July 15. The rally was seen as the latest in a series of protests against the coup. President Recep Tayyip Erdogan, Prime Minister Binali Yildirim, CHP leader Kemal Kilicdaroglu, MHP leader Devlet Bahceli, Chief of Staff Hulusi Akar, and President of the Grand National Assembly of Turkey Ismail Kahraman spoke at the rally. The Qur'an was recited for the citizens who lost their lives in the coup attempt."
 Turkey.303.a:0 "Turkey is indivisible"  
 Turkey.304.title:0 "Devlet Bahceli's Announcement" 
 Turkey.304.desc:0 "MHP Chairman Devlet Bahceli, his party's Group meeting in the Parliament made statements. Bahceli, early election request " CHP leader is asked to go to the election as soon as possible. He's obviously in a hurry. Kilicdaroglu does not have an agenda such as too much coercion, too much accountability, and early elections in our country. Don't forget that rent," he said. Bahçeli, Ataturk in a statement about the claim of insult " is a provocation under the guise of a Muslim. Whether they are secret gülen supporters must be examined. Everyone has to be vigilant. Atatürk is the common denominator of our National Union. Do those who extend their language to Ataturk think he is a better Muslim? Atatürk's hostility is a service to betrayal," he said."
 Turkey.304.a:0 "Interesting"  
 Turkey.305.title:0 "Suleyman Soylu Resigns" 
 Turkey.305.desc:0 "A curfew has been declared for the virus. People filled the grocery stores. Because of this, Suleyman Soylu, who was the Minister of Internal Affairs, resigned. His resignation was not accepted by Erdogan."
 Turkey.305.a:0 "He Is Needed" 
 Turkey.306.title:0 "2013 Corruption Scandal" 
 Turkey.306.desc:0 "On December 17, 2013, the largest “corruption and bribery” scandal in the history of the Republic erupted. Echoes of the operation, which included ministers, bureaucrats, businessmen, and mayors, followed by a second wave on December 25. Shortly after the wave, which included Bilal Erdogan, son of then Prime Minister Tayyip Erdogan, as well as a 41-strong group of businessmen, a third operation involving the Istanbul Fire Department and Beyoglu municipality came on January 16th. However, the last two waves were blocked by the AKP government, and the operation could not be carried out.\n\n1- Black Money File\n\nThe first investigation, the “Black Money file”, included 21 people, including businessman Reza Sarraf, Minister's children Barış Guler, Kaan Caglayan and Halkbank general manager, Suleyman Aslan. As part of the investigation, they were asked to be arrested for “gold smuggling, money laundering, bribery”.\n\n2- Zonning Corruption\n\nThe “Fatih dossier”, which covered the corruption and bribery investigation in the AKP Municipality of Fatih, included 27 suspects along with Mayor Mustafa Demir. The suspects were asked to be arrested on charges of” bribing and receiving".\n\n3-Urban Crimes\n\nAli Agaoglu, a famous businessman, and Abdullah Oguz Bayraktar, the son of Erdogan Bayraktar, the Minister of Environment and Urban Planning were 23 suspects in the “urban crimes” file. Suphelil which is not approved by the municipalities of not being able to be approved or not approved zoning plans, cultural and Natural Resources Board of the modification of the files they interfered with the plan, the board by applying pressure to the members of the commission in charge of, bribery or giving false reports by editing the registered cultural and historic structures, including land, Natural Protected Areas and Yesil fields, it was assumed that areas opened for development in the scope of Boğaziçi protection law.\n\n4-Money Counting Machine In Bedroom\n\nA search conducted at the home of Baris Guler, son of Interior Minister Muammer Guler at the behest of the Istanbul Public Prosecutor's office, found a large amount of Turkish Lira, foreign currency, and 6 steel cases placed in boxes. Minister Guler claimed that the money from his son's house came from the sale of the villa, and the $ 1 million 200 thousand stacked in his bedroom was money obtained from the sale of the villa in Bahcesehir. Guler claimed that the “6 safes” in the apartment belonged to the closed workplaces of his son, whom he called “mean”, and that the safes were moved from the office to the house.\n\nAt the home of Aslan, the general manager of the people's bank, $ 4.5 million was hidden in a shoebox, some phone call records, and photos. “These coins are donation coins collected to build a school,” Aslan said in a statement to the prosecutor about the millions of dollars found in shoe boxes in his home. “All of the $ 4.5 million that comes out of my house is money collected from donations, " Aslan said in a statement. These coins will be used in the construction of the Balkan University in Macedonia and the Imam Hatip High School in Çorum Osmancik. It was money collected from benevolent people and I was going to send it there,” he said.\n\nSaturday, December 21, four days after the minister's children Barış Guler, Salih Kaan Caglayan, businessman Reza Sarraf, and Halkbank general manager Suleyman Aslan were arrested. The charge against the son of the two ministers was “mediating the taking and giving of bribes.” The suspects, including Minister Bayraktar's son, businessman Agaoglu and Fatih Mayor, have been released. A total of 26 people were sent to prison as part of the first wave operation."
 Turkey.306.a:0 "Moneyyy!" 
 Turkey.307.title:0 "Binali Yildirim Made A Statement" 
