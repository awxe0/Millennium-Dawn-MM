 Turkey.317.title:0 "The Sea Saliva Begins The Invasion Of Marmara Sea" 
 Turkey.317.desc:0 "The sea saliva that forms in and around the sea of Marmara, covering the bottom and surface of the sea, continues to intensify. In the World Press, there is also news about mucilage, known as sea saliva, which occurs in the Sea of Marmara. If the mucilage in Marmara increases at this rate, it may become unstoppable. We need to act immediately and start cleaning up."
