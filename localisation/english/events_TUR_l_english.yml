 Turkey.332.title:0 "Tanju Ozcan Speaks Against Refugees" 
 Turkey.332.desc:0 "The mayor of Bolu has spoken harshly about refugees from other countries. \n\n Bolu Mayor Tanju Ozcan: " Foreign citizens who are our subscribers, water prices, solid waste fees, especially some fees will increase 10 times. A Turkish citizen and a foreign citizen will not be able to use water at the same price. Are we going to raise 10 times water and 10 times solid waste tax? Why are we doing this, we want them to leave? This Hospitality has been prolonged. I don't have the authority to force him out of town with the police. Once the borders were opened, we decommissioned the buses and sent people. And now we're ready to send it. Let's just send it.” "
