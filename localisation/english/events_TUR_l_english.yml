 TurkeyF.219.desc:0 "In a significant political development, the Technocratic Party, also known as Halkin Partisi (HP), has officially launched its operations in Turkey, accompanied by the high-profile addition of Kemal Dervis to its ranks. Dervis, a respected political leader and former prominent member of the Republican People's Party (CHP), announced his decision to join HP, citing alignment with the party's vision for progressive governance and forward-looking policies.\n\nThe inauguration of HP's Turkish branch was marked by a grand ceremony in Ankara, where party officials and supporters gathered to witness this momentous occasion. HP's chairman, Ali Demir, expressed his gratitude for the warm welcome from Turkish citizens and the commitment to contributing positively to Turkey's political landscape.\n\n"We believe in the power of technocracy and evidence-based policies to drive sustainable development and social progress. By establishing HP in Turkey, we aim to bring fresh perspectives to the political discourse and collaborate with like-minded individuals and parties," Chairman Demir declared during his address.\n\nThe highlight of the event came when Kemal Dervis, a seasoned economist and diplomat who had previously served as Turkey's Minister of Economy and later as the Administrator of the United Nations Development Programme, officially joined the Technocratic Party. Dervis had been an influential figure in the CHP, but he expressed that his decision to switch parties was driven by his belief in HP's pragmatic approach to governance and emphasis on expertise-driven solutions.\n\nIn a statement to the press, Dervis remarked, "I have always been committed to the values of progressive politics, evidence-based decision-making, and finding practical solutions to complex challenges. HP's dedication to technocracy and its desire to bring together experts from various fields to address societal issues deeply resonated with me. I am thrilled to embark on this new chapter with HP and contribute to shaping a brighter future for Turkey.""
