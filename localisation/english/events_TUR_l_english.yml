 TurkeyCourt.1.title:0 "Constitutional Court Declares New Elections"
 TurkeyCourt.1.desc:0 "The Constitutional Court found the last elections questionable and decided to repeat the elections. With this decision, a new election date will be determined through the parliament."
 TurkeyCourt.1.a:0 "Court Made Its Decision"
 TurkeyCourt.2.title:0 "Constitutional Court Rejects The New Elections"
 TurkeyCourt.2.desc:0 "The Constitutional Court did not find the last elections questionable and decided not to repeat the elections. With this decision, the assembly will continue its work."
 TurkeyCourt.2.a:0 "Court Made Its Decision"
 TurkeyCourt.3.title:0 "Constitutional Court Accepts To Investigate Opposition"
 TurkeyCourt.3.desc:0 "The Constitutional Court took the opposition under review after issuing a decision in favor of the government. These investigations will shake the trust environment of the opposition parties."
 TurkeyCourt.3.a:0 "Court Made Its Decision"
 TurkeyCourt.4.title:0 "Constitutional Court Rejects To Investigate Opposition"
 TurkeyCourt.4.desc:0 "The Constitutional Court decided not to examine the opposition by alerting a decision on the side of the government. These investigations will shake the trust environment of the opposition parties."
 TurkeyCourt.4.a:0 "Court Made Its Decision"
 TurkeyCourt.5.title:0 "Constitutional Court Accepts To Investigate Government"
 TurkeyCourt.5.desc:0 "The Constitutional Court, alarmed by a decision on the side of the opposition, took the government under review. These investigations will shake the trust environment of the ruling or coalition parties."
 TurkeyCourt.5.a:0 "Court Made Its Decision"
 TurkeyCourt.6.title:0 "Constitutional Court Refuses To Investigate Government"
 TurkeyCourt.6.desc:0 "The Constitutional Court, alarmed by a decision on the side of the government, didn't take the government under review. These investigations won't shake the trust environment of the ruling or coalition parties."
 TurkeyCourt.6.a:0 "Court Made Its Decision"
 TurkeyCourt.7.title:0 "Constitutional Court Raises New Political Questions"
 TurkeyCourt.7.desc:0 "The Constitutional Court began to become politicized within the framework of the developing events, and its own structured bureaucracy failed to prevent it."
 TurkeyCourt.7.a:0 "Court Politicization?"
 TurkeyCourt.8.title:0 "Constitutional Court Rejects To Raise New Political Questions"
 TurkeyCourt.8.desc:0 "The Constitutional Court managed not to become politicized within the framework of the developing events and ensured this with its own structured bureaucracy."
 TurkeyCourt.8.a:0 "Court Stays Defiant!"

 ####### Turkish Communist Civil War #######
 #TurkeyCo.1.title:0 "Labour Day Celebrations"
 #TurkeyCo.1.desc:0 "May 1 Labor Day was celebrated with rallies and demonstrations held throughout Turkey, especially in Istanbul, Ankara, and Izmir.\n\nOfficial celebrations were held in the Maltepe rally area on May 1 in Istanbul. DISK, KESK, chambers of Turkish engineers and architects (TMMOB), and the Union of Turkish Medical Association (TTB organized under the leadership of, "May 1 labor and Solidarity Day" celebrations unions and non-governmental organizations, as well as the CHP deputies Sezgin Tanrikulu, Gürsel Tekin, Ali Gülay Yedekci Sugar and joined."
 #TurkeyCo.1.a:0 "Nice"
 #TurkeyCo.1.b:0 "Enough! Let's get rid of this!"
 TurkeyCo.2.title:0 "EMEP Backs Workers"
 TurkeyCo.2.desc:0 "EMEP announced that it will provide material and moral support to the labor movement if the May 1 Labor Day is banned."
 TurkeyCo.2.a:0 "Ough..."
 TurkeyCo.3.title:0 "ÖDP Backs Workers"
 TurkeyCo.3.desc:0 "ÖDP announced that it will provide material and moral support to the labor movement if the May 1 Labor Day is banned."
 TurkeyCo.3.a:0 "Ough..."
 TurkeyCo.4.title:0 "TKP Backs Workers"
 TurkeyCo.4.desc:0 "TKP announced that it will provide material and moral support to the labor movement if the May 1 Labor Day is banned."
 TurkeyCo.4.a:0 "Ough..."
 TurkeyCo.5.title:0 "TKP-ÖDP-EMEP Rebellion Formed"
 TurkeyCo.5.desc:0 "The streets are filling up with people. The demonstrators are armed and unarmed. Police tried to stop the crowd, but failed, and armed organizations are providing equipment to the communists. Nationalist groups against it began to arm themselves with the government, and military groups were dispatched to the area. As the violence against the demonstrators increased, the resistance increased, and eventually, the insurgents invaded areas in the West and established their own regime. Turkey was divided in two, so a civil war broke out."
 TurkeyCo.5.a:0 "Long Live The Supreme Regime"
 TurkeyCo.6.title:0 "Communist Congress"
 TurkeyCo.6.desc:0 "After the end of the war, the first extraordinary congress was held. Congress will determine the party that will come to power. What party should this party be? It is your choice."
 TurkeyCo.6.a:0 "ÖDP is the right decision for leadership!"
 TurkeyCo.6.b:0 "EMEP is the right decision for leadership!"
 TurkeyCo.6.c:0 "Perinçek has the true spirit of a leader!"
 TurkeyCo.6.d:0 "Install The TKP Regime"
 TurkeyCo.7.title:0 "The Great Turkish Revolution"
 TurkeyCo.7.desc:0 "The army of the peoples united and destroyed the imperialist order again. We have achieved victory! My comrades, now with the new order, the peoples will live happily Justice."
 TurkeyCo.7.a:0 "Victory!"
 TurkeyCo.8.title:0 "5th ÖDP Congress"
 TurkeyCo.8.desc:0 "5th ÖDP Congress held. The Congress made the ruling ÖDP stronger."
 TurkeyCo.8.a:0 "Nice For The ÖDP"

