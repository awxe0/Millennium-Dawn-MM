 Turkey.312.title:0 "Melih Gokcek Resigns" 
 Turkey.312.desc:0 "Ankara Metropolitan Mayor Melih Gokcek, one of the 6 names on which the president and AKP leader Erdogan asked for his resignation, said: "I was asked to resign by the President. I'm leaving the Office of mayor in accordance with the order of the president." he resigned from his position, which he held for 23 years," he said. At the end of his farewell speech, Gokcek also prayed, "destroy the seditioners among us who appear from us and are not from us, O Lord." Gökçek A. Survey farewell. Belma Ilhan, the Managing Director of the, was seen unable to hold back tears."
 Turkey.312.a:0 "Orders cut iron"  
 Turkey.313.title:0 "A Constitutional Referendum Results = YES" 
 Turkey.313.desc:0 "A constitutional referendum was held throughout Turkey on 16 April 2017 on whether to approve 18 proposed amendments to the Turkish constitution that were brought forward by the governing Justice and Development Party (AKP) and the Nationalist Movement Party (MHP). As a result of its approval, the office of the Prime Minister was abolished and the existing parliamentary system of government was replaced with an executive presidency and a presidential system. The number of seats in Parliament was raised from 550 to 600, while, among a series of other proposals, the president was given more control over appointments to the Supreme Board of Judges and Prosecutors (HSYK). The referendum was held under a state of emergency that was declared following a failed military coup attempt in July 2016.\n\nEarly results indicated a 51–49% lead for the "Yes" vote. In an unprecedented move, the Supreme Electoral Council (YSK) allowed non-stamped ballots to be accepted as valid. Some critics of the reform decried this move to be illegal, claiming that as many as 1.5 million ballots were unstamped, and did not recognize the results.[4] Large-scale protests erupted following the results in order to protest the YSK's decision. In subsequent reports, the Organization for Security and Co-operation in Europe (OSCE) and Parliamentary Assembly of the Council of Europe (PACE) both criticized unfairness during the campaign and declared the YSK's decision to be illegal"
 Turkey.313.a:0 "A Brand New Turkey"  
 Turkey.314.title:0 "Swearing Ceremony After Constitution Changes" 
