 Turkey.400.title:0 "CHP Rally In Mersin"
 Turkey.400.desc:0 "The first rally organized by the CHP before the election, called “The Voice of the Nation”, attracted great attention. Since the early hours of the morning, those dec wanted to enter the rally area were taken to the area from 10 separate search points created. There was a heavy stampede in front of the search points due to the intense interest."
 Turkey.400.a:0 "Bad News"
 Turkey.401.title:0 "Wanna Sell/Buy Bitcoin?"
 Turkey.401.desc:0 "You can trade bitcoin via decisions which is opening in 2009. Opening up these decisions can destroy the realist experience, so there is a place where you can make decisions about these decisions. Now tell me, do you want to buy/sell Bitcoin or not? Binance is waiting for your answer."
 Turkey.401.a:0 "§GI Am Just Playing This For Fun§!"
 Turkey.401.b:0 "§RNope, Realism First§!"
 Turkey.403.title:0 "Eastern Express Project Has Been Passed In Parliament"
 Turkey.403.desc:0 "A project to expand the Eastern Express has passed through parliament. We can start developing the Eastern Express now."
 Turkey.403.a:0 "Perfect"
 Turkey.402.title:0 "Turkish Bar Association Elects His New Leader"
 Turkey.402.desc:0 "Voting has been completed at the 36th Ordinary General Assembly of the Turkish Bar Association (TBB). in the election, in which 348 delegates voted, the President of the Ankara Bar Association, Erinç Sağkan, became the new president of the TBB, surpassing the current President, Metin Feyzioğlu, according to unofficial results."
 Turkey.402.a:0 "Good Luck"
 Turkey.404.title:0 "Dollar Becomes 13.50 Lira"
 Turkey.404.desc:0 "After President Recep Tayyip Erdogan said "Exchange rate increase increases employment" after the cabinet meeting on November 22, the dollar / TL exchange rate set a new record and exceeded 13.46.\n\nThe Euro/TL rate exceeded 15.16, while the Pound/TL rate also saw 18 for the first time.\n\nOctober September and November, contrary to the expectations of the markets, the Central Bank of the Republic of Turkey (CBRT) went to an interest rate cut of 400 basis points in total, accelerating the depreciation of the TL.\n\nDespite the fact that inflation is close to 20 percent, the fact that the CBRT is raising interest rates to 15 percent increases the pressure on the TL."
 Turkey.404.a:0 "Inflation like a devaluation"
 Turkey.405.title:0 "Dollar Becomes 16.42 Lira"
 Turkey.405.desc:0 "The dollar and the euro started the day with a fresh record as the rise in exchange rates continued. The dollar/TL has crossed 17 and reached an all-time high. The Central Bank intervened in the market when the dollar exceeded 17 pounds, but after a short-term decline, which was seen at 16.20, the dollar again settled above the level of 16.82."
 Turkey.405.a:0 "Central Bank's Interventions Seems Like Not Working"
 Turkey.406.title:0 "Three Leaders' Statement"
 Turkey.406.desc:0 "The PKK statement came from the leaders of three parties. The statement briefly consists of the following: "The PKK should be crushed wherever it is seen.""
 Turkey.406.a:0 "Good News For National Unity"
 Turkey.407.title:0 "Jewellery Value Of The Social Democracy"
 Turkey.407.desc:0 "The CHP's social democracy is functioning. The effects are positive from a socio-economic point of view. We hope that our social democracy will not disrupt us in the future, but we are doing very well right now. Long live the Great Ascension!"
 Turkey.407.a:0 "Hurrah!" 
 Turkey.408.title:0 "Economic Boom Of The CHP Government's Turkey"
 Turkey.408.desc:0 "Thanks to the CHP government, our economic breakthroughs have reached great levels. Our people are very happy with this situation. Social democracy is functioning. Ataturk's party is following in the footsteps of its ancestor."
 Turkey.408.a:0 "What A Improvement" 
 Turkey.409.title:0 "Turkish Lira Stimulates"
 Turkey.409.desc:0 "The Turkish lira is experiencing a historic week. The exchange rate, which reached a historic high of 18.36 on Monday evening, almost crashed after President Recep Tayyip Erdogan's package to encourage the Turkish Lira.\n\nThe dollar / TL fell to 10.42, falling with the announcement of measures to encourage the TL after breaking a record by exceeding the 18 levels before the cabinet meeting on Monday.\n\nThe dollar exchange rate fell more than 14 percent in the morning on Tuesday after testing the level of 11.09, rose again and again rose above the 14 levels. the dollar /TL, which saw an intraday peak of 14.37, then declined again and fell below 10.42.\n\nTurkey's CDS is at the level of 592 basis points, while the 10-year bond interest rate is around 23.04 percent.\n\nThe implied volatility of the Turkish lira for 1 month reached 62.62 on Tuesday, which saw an all-time high. The indicator had last climbed to the level of 61.47 on August 13, 2018."
 Turkey.409.a:0 "What A Improvement" 
 Turkey.410.title:0 "Deniz Baykal Resigns" 
 Turkey.410.desc:0 "Deniz Baykal, who appeared in front of the journalists, said:\n\nI'm announcing my assessment and decision, which has been expected for days. It's not a tape thing, it's a conspiracy. Conspiracy is a legal and immoral order. When you're plotting, sometimes you break into a house. With secret shots, you cut and cut the most unprotected images of people, edit them, and distort them. All over the world, you destroy the moral understanding of all religions and the moral understanding of humanity. They don't care about people's honor. Those who carried out the conspiracy were perverts, not for blackmail. To do politics held.\n\nA conspiracy has been fabricated. A fresh, two-week conspiracy. One person is not the target of this conspiracy. It is the struggle of the CHP against the civilian dictate regime, which it conducts almost alone. It has been edited and released in the last two weeks. The plot loom is up-to-date and fresh with its materials and shots. It is impossible for power to be exercised without mobilizing its power and possibilities. It is impossible for such a crude conspiracy bench to be prepared and released in the last two weeks without the knowledge of the power summit. So-called bona fide statements after the incident are not enough to cover up the guilt of the bench behind the scenes. This cannot be released without the knowledge and approval of the government. Indeed, those who shame are the ones who commit shame.\n\nI also believe in the sincerity of the messages of sorrow I have received from the United States, from Pennsylvania. It's a shame, but I have a word to say to those who start. You can't defend them with a reputation for immoral and unlawful conspiracies. It's a shame, but it's those who say it's a shame to open up a living space for conspiracy. We'll all see how far those who credit these conspiracies can go.\n\nI will not surrender in the face of this painting. I won't let anyone question me. If there is a price for it, and if that price is to leave the CHP, I will pay that price. Just because I quit doesn't mean running away. On the contrary, it is a challenge. I quit: I'm not the target of this, it's the CHP.\n\nIt was announced that Cevdet Selvi, one of the vice-presidents, would act as deputy leader in accordance with the party's charter...\n\nAfter Baykal announced his decision to resign, some party members were heard saying loudly, "No, don't do it."\n\nSome party members were also seen unable to hold back tears during the announcement."
 Turkey.410.a:0 "Sad Moments For CHP" 
 Turkey.410.b:0 "Sad Moments For CHP §Y(With No Speech)§!" 
 Turkey.411.title:0 "Editor Notes: Local Elections Of 2024"
 Turkey.411.desc:0 "Turkey is entering the local elections on its centenary. May whoever deserves to win in the elections that will take place on March 31st. WARNING: Due to the current elections, please avoid politicizing the game too much."
 #Turkey.411.desc:0 "The Republic founded by Atatürk and his comrades-in-arms has entered the centenary year. We celebrate this historic event. Long live the Modern Republic of Turkey to many new centuries!\n\nAbout the Mod: With Millennium Dawn bringing content to Turkey as part of the new update, I will slow down and gradually terminate the developments about the mod. Thank you for your unremitting support over the past two years."
 #Turkey.411.desc:0 "With the confirmation of the Supreme Election Board of the Republic of Turkey, Recep Tayyip Erdogan has been elected as president and will continue to rule for another 5 years.\n\nI hope that these elections will be beneficial for Turkey.\n\nKeywords: Turkish Economy, Nationalism, Terrorism Suspicions, Political commitment"
 #Turkey.411.desc:0 "The people have made their decision, the AK party will accompany the 100th anniversary of Turkey, so that the AK party regime will continue to rule for another 25 years. I hope these elections have been good for Turkey."
 Turkey.411.a:0 "Let's Move On!"
 Turkey.411.b:0 "§RI Want To Listen The 100th Year March§!"
 OLDTurkey.411.b:0 "Erdogan Pushes Its Balcony Speech"
 Turkey.412.title:0 "2022 Is On The Way"
 Turkey.412.desc:0 "We have arrived at the year 2022 in a fast way. I congratulate you all on the new year and wish you a good economy and good health in the new year."
 Turkey.412.a:0 "Move On!"
 Turkey.413.title:0 "Kenan Yaşar Elected To Constitutional Court"
 Turkey.413.desc:0 "Kenan Yaşar, who was elected with 302 votes, became the new member of the Constitutional Court (AYM) with the voting held in the General Assembly of the Grand National Assembly of Turkey.\n\nThe election of a new member for the seat to be vacated from Celal Mümtaz Akıncı, who will retire on 31 January due to the age limit, was held at the General Assembly of the Grand National Assembly of Turkey. A secret ballot was held for the membership of the Constitutional Court, in which Çorum Bar Association President Kenan Yaşar, Diyarbakır Bar Association member Zülal Erdoğan and Erzurum Bar Association President Talat Gögebakan were nominated. As a result of 3 rounds of voting, Kenan Yaşar was elected as the new member of the Constitutional Court by receiving 302 votes."
 Turkey.413.a:0 "Move On!"
 Turkey.414.title:0 "Osman Pamukoğlu Enters The Politics"
 Turkey.414.desc:0 "Osman Pamukoglu announced that he would leave the military service and enter politics. This announcement created an atmosphere of panic in politics. Afterward, it was learned that Osman Pamukoglu founded a party called HEPAR. There's a new guy coming."
 Turkey.414.a:0 "He Is Coming!"
 Turkey.415.title:0 "Osman Pamukoğlu Stays In The Army"
 Turkey.415.desc:0 "Osman Pamukoglu announced that he will not leave the military service and will not participate in politics in order to remove uncertainty. Together with this announcement, politicians were happy. Things were going to get easier now that someone from a military background wasn't going to get involved in politics."
 Turkey.415.a:0 "Good To Hear"
 Turkey.416.title:0 "Osman Pamukoğlu's Rallies"
 Turkey.416.desc:0 "Osman Pamukoglu's rallies attracted great attention. Now the balance is changing. Osman Pamukoglu is expected to receive a large number of votes indirectly from the polls."
 Turkey.416.a:0 "Politics Are Going Hardcore"
 Turkey.417.title:0 "Osman Pamukoğlu's Victory"
 Turkey.417.desc:0 "The election was won. It is expected that the root of terrorist organizations will dry up with the accession of Osman Pamukoglu to power. Long live the new power! Long live the new balance!"
 Turkey.417.a:0 "Good News"
 Turkey.418.title:0 "Snow Dominates Istanbul"
 Turkey.418.desc:0 "The snowfall, which has had an effect on most of the country, has taken Istanbul prisoner today. Traffic was blocked in most of the city due to snowfall, which further increased its impact in the evening, and vehicles remained on the road. Some citizens leave their vehicles on the road and go home on foot. While the traffic density has increased to 90 percent in Istanbul, there is also a serious density of people on public transportation. Despite the warnings, precautions have not been taken in the megacity, and some Metrobus and bus services have been disrupted due to the fact that citizens are experiencing great difficulties when returning home. On the other hand, there are still citizens who cannot go home and are stranded outside."
 Turkey.418.a:0 "Damn!"
 Turkey.419.title:0 "Rahşan Amnesty"
 Turkey.419.desc:0 "The law on Conditional Release and Postponement, originally called the Law on Conditional Release and Postponement, was adopted on December 22, 2000, at the suggestion of Rahşan Ecevit, introducing a postponement or conditional release for crimes other than crimes committed against the state.\n\nOn December 19, 2000, 3 days after Operation Return to Life, which was launched to end the death fast actions, the ‘Conditional Release and Postponement Act’ No. 4616 was passed (December 22). After the amnesty law, which was issued because there was no room left in prisons, the population of prisons, which had a capacity of 70 thousand people, had fallen to 40 thousand."
 Turkey.419.a:0 "The Scope of Amnesty Is Sufficient"
 Turkey.419.b:0 "Make Minimal Changes In The Amnesty"
 Turkey.419.c:0 "Expand The Amnesty Directly"
 Turkey.4190.title:0 "Rahşan Amnesty"
 Turkey.4190.desc:0 "The law on Conditional Release and Postponement, originally called the Law on Conditional Release and Postponement, was adopted on December 22, 2000, at the suggestion of Rahşan Ecevit, introducing a postponement or conditional release for crimes other than crimes committed against the state.\n\nOn December 19, 2000, 3 days after Operation Return to Life, which was launched to end the death fast actions, the ‘Conditional Release and Postponement Act’ No. 4616 was passed (December 22). After the amnesty law, which was issued because there was no room left in prisons, the population of prisons, which had a capacity of 70 thousand people, had fallen to 40 thousand."
 Turkey.4190.a:0 "The Scope of Amnesty Is Sufficient"
 Turkey.420.title:0 "People's Reaction Of The Attack On Ataturk Statue"
 Turkey.420.desc:0 "As a result of the attack on the Atatürk statue in Samsun, a community of people formed around the Atatürk statue in the evening."
 Turkey.420.a:0 "Kemalists Are In The Streets!" 
 Turkey.421.title:0 "Recep Tayyip Erdogan Returns To His Party"
 Turkey.421.desc:0 "President Recep Tayyip Erdogan became a member of the AK Party, of which he was the founder. Many articles of the referendum adopted on April 16 will come into force together with the election in November 2019. However, the amendment to the articles of association of the president with his party came into force immediately, which paved the way for President Recep Tayyip Erdogan to become a member of the AK Party, of which he was the founder.\n\nErdogan is also expected to be re-elected as a leader at the party congress to be held on May 21.\n\nErdogan symbolically signed his membership at a ceremony held at the AK Party headquarters. Some party members and Erdogan's tearfulness attracted attention.\n\n"I am returning to my home, love, love, love, party, which I was the founder of, which I had to leave by virtue of the constitution due to the fact that I was elected to the presidency by our nation on August 27, 2014," Erdogan said at the ceremony. Exactly 979 days later, this longing ends with praise," he said."
 Turkey.421.a:0 "He Is The Best For AKP!" 
 Turkey.422.title:0 "6 Leaders Of The Opposition Gets United"
 Turkey.422.desc:0 "6 Opposition Leaders gathered. Their goal is to draft a new constitutional bill. We don't seem to like the constitutional bill that will be released from the opposition's decision very much."
 Turkey.422.a:0 "What A Terrible Moment!" 
 Turkey.423.title:0 "28th February Declaration"
 Turkey.423.desc:0 "The February 28 declaration was declared as a result of a joint speech of the opposition. As a result of this declaration, the supporters of the parliamentary system would do against our government will increase their power in the opposition."
 Turkey.423.a:0 "Opposition Becomes Stronger" 
 Turkey.424.title:0 "AKP Delegates Ask For Reformation"
 Turkey.424.desc:0 "AK party delegates are calling on our party to reform. With this reformation, we have the potential to get more votes by changing and modernizing our party and acting in accordance with our principle. At the same time, if we go to the reformation, modernization will harm our beliefs such as losing Erdogan."
 Turkey.424.a:0 "Accept The Reformation Plan" 
 Turkey.424.b:0 "AKP Stays With Erdogan!" 
 Turkey.425.title:0 "Bayraktar Kizil Elma MIUS Has Presented To The People"
 Turkey.425.desc:0 "Bayraktar Kizilelma has presented to the Turkish people, the plane is a proposed jet-powered, single-engine, low-observable, supersonic, carrier-capable unmanned fighter aircraft in development by Turkish defense company Baykar Makine."
 Turkey.425.a:0 "We Began A Race In The Technology"
 Turkey.426.title:0 "Peace Talks In Antalya Diplomacy Forum"
 Turkey.426.desc:0 "Foreign Ministers Sergey Lavrov and Dmytro Kuleba met for talks in Antalya, Turkey with Turkish Foreign Minister Mevlüt Çavuşoğlu as the mediator in the first high-level contact between the two sides since the beginning of the invasion. Ukraine had attempted to negotiate a 24-hour ceasefire to provide aid and evacuation to civilians, especially in Mariupol. After two hours of talks, no agreement was reached. Airstrikes on the port city continued."
 Turkey.426.a:0 "The Result Is No Peace, But It Is A Political Victory For Us"
 Turkey.427.title:0 "Police Attack On Furkan Foundation"
 Turkey.427.desc:0 "Members of the Furkan Foundation, headed by Alparslan Kuytul, wanted to take action for 8 detained volunteers on Cevat Yurdakul Street in Seyhan, Adana.\n\nThe group, including Alparslan Kuytul, was attacked by the police. decapitation of Alparslan Kuytul. According to the images shared by the Furkan Foundation, the police used pepper spray and rubber bullets to baton down the activists.\n\nIn a post made on the official Twitter account of the Furkan Foundation, "We Don't Want a Minister who Gives Illegal Instructions to Security! On the instructions of the Noble, the blindfolded policemen showered the members of the Furkan Movement with batons!"
 Turkey.427.a:0 "Police Is Right To Act!"
 Turkey.428.title:0 "Montreux Declaration"
 Turkey.428.desc:0 "Cavusoglu noted that the Montreux Treaty clearly contains regulations on the duration and limit of the passage of warships of riparian and non-riparian countries through the Straits and their stay in the Black Sea.\n\nCavusoglu, explaining that Turkey has fully implemented the Montreux Straits Agreement to date, said: "In these conditions, of course, we will implement the Montreux Agreement. In the event of a war in which Turkey is not a party, Turkey can close the Bosphorus to the passage of ships of countries that state to the war. Article 19 of the Montreux Convention. its substance is perfectly clear in a yellow way." said.\n\nRegarding whether the recent developments should be described as "war, conflict or operation", Cavusoglu noted that:\n\nInitially, there was an attack by Russia. But we evaluated this with our experts, our soldiers, and our lawyers. Now it is especially evident in many cities that now this has turned into a war. In other words, dec the clashes on the street turned into a war between the parties. We have come to an opinion about this, as a matter of fact. Now there is a serious conflict between the states. This is not a military operation, this is not a temporary one-two air attack, there is officially a state of war in the country right now."\n\nEmphasizing that the process should be transparent, Cavusoglu noted that Russia's ships bound for bases in the Black Sea are located in the Mediterranean Sea.\n\nCavusoglu, 19th of the Montreux Convention. he also noted that the article recognizes an exception for the passage of ships of countries that are parties to the war, saying: "What is this exception? If the warship is going to go to its base in the country that is a party to the war, to the port to which it is attached, to the base, then this passage cannot be blocked. Here he makes an exception to the general provision." he made an assessment. \n\nCavusoglu said, "Of course, there should be no abuse here either. I mean, I'm going to the base, I'm going to dock my ship.' he shouldn't be involved in the war after he's been through the Bosphorus. We will apply all the provisions of Montreux in this way, transparently." he used the expression."
 Turkey.428.a:0 "Peace Of Black Sea Should Be Mainted"
 Turkey.429.title:0 "Peace Talks In Istanbul"
 Turkey.429.desc:0 "On Tuesday, for the first time in more than two weeks, Ukrainian and Russian negotiators came face to face. They did so over a white tablecloth at a long table inside a 19th-century Ottoman palace on the banks of the Bosporus, welcomed personally by President Recep Tayyip Erdogan, who greeted them in English with “good morning.”"
 Turkey.429.a:0 "The Result Is No Peace, But Its A Second Well Political Victory For Us"
 Turkey.430.title:0 "USA Prepares To Sell F-16s"
 Turkey.430.desc:0 "The Biden administration believes that the potential sale of F-16 fighter jets to Turkey would be in line with US national security interests and at the same time serve the long-term unity of NATO, the US State Department said in a letter to Congress."
 Turkey.430.a:0 "Hoping, They Would Sell It"
 Turkey.431.title:0 "A Mine Detected In Bosphorus"
 Turkey.431.desc:0 "A mine noticed by fishermen off Sariyer yesterday caused alarm. The strait was closed to ship traffic for 5 hours, and SAS teams neutralized the mine. Minister Akar explained that the mine is of the old type."
 Turkey.431.a:0 "Its Deactivated So We Can Keep Going Forward"
 Turkey.432.title:0 "ESK Dramatically Increased The Meat Prices"
 Turkey.432.desc:0 "The Meat and Dairy Corporation (ESK) has raised the price of red meat by 48 percent. Which led people to think economy is completely useless right now."
 Turkey.432.a:0 "Not Good To Hear"
 Turkey.433.title:0 "Creation Of The Zafer Party"
 Turkey.433.desc:0 "Özdağ, who came to the Ministry of Interior to receive the documents approved by the accompanying delegation after the party handed over the documents necessary for the establishment of the Zafer Party, made statements to the press members here.\n\nWe will continue to travel around Turkey saying "Science, unity, peace" and today, August 26, is the 950th day of our arrival in Anatolia. year. 99th of the Great Offensive. we're starting our own party. We wish Turkey, the great Turkish nation and the Turkish world good.""
 Turkey.433.a:0 "Interesting"
 Turkey.434.title:0 "Kilicdaroglu Attacks The SADAT"
 Turkey.434.desc:0 "CHP Chairman Kemal Kilicdaroglu, by surprise, went in front of SADAT. Kilicdaroglu was also accompanied by a large number of deputies from the CHP.\n\nMaking a statement here, the CHP leader said, "The SADAT we are dealing with is a paramilitary organization... This is an institution that trains terrorists," he said. Stressing that election security is important, Kılıçdaroğlu said, "If anything happens that will overshadow the election and undermine the security of the election, it is this place and the Palace that is responsible for it"."
 Turkey.434.a:0 "A Terrible Move"
 Turkey.435.title:0 "Zafer Party Leader Duels The Interior Minister"
 Turkey.435.desc:0 "Victory Party Chairman Ümit Özdağ, who challenged the Interior Minister Süleyman Soylu, who said to himself, "He is less than an animal. He is a child of Soros," (Ümit Özdağ) went to the Ministry of Interior yesterday. Özdağ, who was blocked by the security forces here, continues to make remarkable posts on his social media account. Ozdag, who once again challenged Minister Soylu, said, "I will assign a position. Whenever you want, wherever you want"."
 Turkey.435.a:0 "What!"
 Turkey.436.title:0 "Finland And Sweden Wants To Join NATO"
 Turkey.436.desc:0 "The first country that wanted to take advantage of the security umbrella created by Article 5 of NATO was Finland, which shares a 1300-kilometer border with Russia.\n\nSwedish public opinion also followed its Finnish neighbors, ending the country's 200-year policy of neutrality.\n\nThe application of both countries for membership in NATO also brings about a radical change in the previous neutrality policy towards the alliance. Therefore, the steps taken are considered historic."
 Turkey.436.a:0 "Time To Use VETO Policies"
 Turkey.436.b:0 "Let Them In!"
 Turkey.437.title:0 "Turkey Deals In NATO"
 Turkey.437.desc:0 "Turkey, Sweden and Finland all classify the PKK as a terrorist organization. But Erdogan accused the two Nordic states of harboring and supporting PKK fighters, which those countries deny. But Sweden in particular does support and send aid to other Kurdish groups in Syria that Turkey’s government does not differentiate from the PKK.\n\nFor Erdogan, a guarantee of better cooperation on this issue and demonstrated respect for its security needs was priority number one.\n\nTurkey “got what it wanted” from the deal with Sweden and Finland penned Tuesday night, the Turkish president’s office said in a statement. That meant “full cooperation with Turkey in the fight against the PKK and its affiliates,” including a PKK offshoot in Syria called the YPG, which had been supported by Western countries including the U.S. in the fight against ISIS.\n\nStockholm and Helsinki also pledged “not to impose embargo restrictions in the field of defense industry” on Turkey and to take “concrete steps on the extradition of terrorist criminals,” according to the statement."
 Turkey.437.a:0 "It Would Be Great!"
 Turkey.438.title:0 "Cesme Forest Is Burning"
 Turkey.438.desc:0 "A fire broke out in a grassy area in the Cesme district of Izmir. Mayor of Cesme Ekrem Oran,"Ildır center is on fire. I appeal to all owners of private water tankers. Come to the aid as the water tanker is full of those," he said. The fire was brought under control with the intervention of crews."
 Turkey.438.a:0 "Awful"
 Turkey.439.title:0 "Grain Transportation Treaties"
 Turkey.439.desc:0 "The first day of the planned four-day meeting came with the backdrop of Russia's invasion of Ukraine and its seizure of ports on the Black Sea that were previously used to export Ukrainian wheat.\n\nThe meeting came with Russia’s invasion of Ukraine in its fifth month and with the seizure of its ports on the Black Sea raising worries about hunger among people in Africa and the Middle East.\n\nUkraine is a major exporter of wheat and other grains such as barley and maize and sunflower seeds. Kyiv has estimated that up to 25 million tons of grain are currently blocked in its ports.\n\nThe negotiators hope for a solution that would empty the silos in time for upcoming harvest in Ukraine. Some grain currently is being transported through Europe by rail, road, and river, but the amount is small compared with what could be exported through sea routes."
 Turkey.439.a:0 "Let's See How This Is Going"
 Turkey.440.title:0 "Turkish Industries Reached 150"
 Turkey.440.desc:0 "Turkish industries have passed the 150 band. Now our industry has achieved excellent capability and has reached a level that will develop faster than usual."
 Turkey.440.a:0 "Such A Success"
 Turkey.440.b:0 "Such A Success §Y(With No Speech)§!"
 Turkey.441.title:0 "Turkish Planes Has Been Invented"
 Turkey.441.desc:0 "Turkish aircraft were invented. Thanks to these domestic aircraft, we will have more reliable, more powerful, easier-to-build aircraft. Now we can dominate the weather!"
 Turkey.441.a:0 "The Engines Are Working Well"
 Turkey.441.b:0 "The Engines Are Working Well §Y(With No Sound)§!"
 Turkey.442.title:0 "Turkey Changes Its Name To Turkiye"
 Turkey.442.desc:0 "The steps taken on behalf of the use of "Turkey" instead of "Turkiye" in the international arena have achieved the goal. The United Nations has changed "Turkey" to "Turkiye" in foreign languages after Ankara's request."
 Turkey.442.a:0 "Hooray!"
 Turkey.443.title:0 "Greek-Turkish Maritime Border Crisis"
 Turkey.443.desc:0 "Following Greek Prime Minister Kyriakos Mitsotakis’ address to the US Congress last month, long-running tensions between Turkey and Greece are flaring up again.As both countries simultaneously face an economic downturn with severe inflation, and as they near their election terms in 2023, experts say that tension between them is being increasingly used for domestic purposes.\n\nWriting several tweets in the Greek language, Turkish President Recep Tayyip Erdogan has directly threatened the Greeks to be prudent with their standpoint in the Aegean Sea, otherwise “they will regret” it.\n\nErdogan recently said that Mitsotakis “no longer exists” for him as he accused him of trying to prevent the sale of F-16 fighter jets to Turkey. He also warned: “Don’t try to dance with Turkey. You’ll get tired and stuck on the road.”\n\nIn return, the Greek government called for national unity toward an “unpredictable” neighbor, while former Prime Minister Alexis Tsipras replied to Erdogan in Turkish, saying: “Greece will protect its sovereignty against all threats. So let’s end the provocation and get back to dialogue on the basis of international law. The answer to the economic crisis we are all facing is not extreme nationalism.”"
 Turkey.443.a:0 "When This Will End?"
 Turkey.444.title:0 "Turkish Minister Visits Israel"
 Turkey.444.desc:0 "The first visit from Turkey to Israel at the level of the minister of foreign affairs took place after 15 years. "We believe that a two-state solution is the only way for lasting peace," Cavusoglu said, noting that he exchanged views on regional issues with his counterpart Yair Lapid."
 Turkey.444.a:0 "Old Allies Just Came Together"
 Turkey.445.title:0 "Gazprom's Finishes Turkish Stream Project"
 Turkey.445.desc:0 "In the past, the Russian energy company Gazprom has reportedly started the construction of a pipeline for the offshore part of the Turkish Stream project. Gazprom said in a statement that the construction of the pipeline that will pass through the Black Sea in the Turkish Stream project has started in accordance with the established timetable.\n\nThe statement stated that the construction was carried out with the Audacia ship belonging to the Allseas company and that the pipeline construction in the deeper parts of the Black Sea will be carried out with the Pioneering Spirit ship.\n\nOctober of two years ago, the intergovernmental agreement was signed in Istanbul. Within the scope of the Turkish Stream project, it is planned to build two pipelines, each with a capacity of 15.75 billion cubic meters per year. It is envisaged that the first line will deliver natural gas to Turkey and the second line will deliver natural gas to Europe if the necessary guarantees are obtained."
 Turkey.445.a:0 "Good To Hear"
 Turkey.446.title:0 "Mesut Yilmaz Has Been Beaten"
 Turkey.446.desc:0 "Photos of Mesut Yılmaz being beaten up in Budapest in the past began to appear in the media from behind. These photos deeply shake the prestige of the country."
 Turkey.446.a:0 "Ouch"
 Turkey.447.title:0 "Rise Of MP"
 Turkey.447.desc:0 "The MP went from making high gains in the elections to the top of power. This is a very unexpected transition. We hope it will be good for our whole country."
 Turkey.447.a:0 "Seems Right"
 Turkey.448.title:0 "KPSS Crisis"
 Turkey.448.desc:0 "A professor who was dismissed after an investigation was launched into allegations that questions were leaked in the PUBLIC Personnel Selection Exam (KPSS). Dr. The President of OSYM, who was appointed to replace Halis Aygun, Prof. Dr. Bayram Ali Ersoy made a statement yesterday and announced that all sessions were canceled. Ersoy stated that some of the questions asked to the candidates in the exam were found to be included in the question booklets of a publishing house."
 Turkey.448.a:0 "Totally A Disaster!"
 Turkey.449.title:0 "A New Media Law Has Announced"
 Turkey.449.desc:0 "The Law on Amendments to the Press Law and Some Laws was published in the Official Gazette. The regulation, which will prevent the provision of misleading information on social media, was published in the Official Gazette and entered into force."
 Turkey.449.a:0 "Good"
 Turkey.450.title:0 "CHP Delivered Petition For Termination Of Media Law"
 Turkey.450.desc:0 "The CHP took action after the publication of the Press Law, known as the disinformation control regulation, and the Law on Amending Certain Laws in the Official Gazette.\n\nCHP Group Deputy Chairman Engin Altay delivered the petition prepared for the cancellation and termination of the validity of Article 29 of the Law on Amendments to the Press Law and Some Laws, which regulates that those who commit the crime of ‘publicly disseminating misleading information to the public’ will be sentenced to 1-3 years in prison. Engin Altay made a statement in front of the Constitutional Court.\n\nIn the petition submitted to the Constitutional Court, “Article 217 / A, added to the Turkish Criminal Code dated 26/9/2004 and numbered 5237 with Article 29 of the Law dated 13/10/2022 and numbered 7418 on Amendments to Certain Laws with the Press Law, 2, 13 of the Constitution., 25, 26., 28, 38, and 153. since it is contrary to its articles, it is necessary to decide to cancel it and to stop its validity until the cancellation case is concluded, as it will create difficult or impossible damages and situations to eliminate if applied,”it was said."
 Turkey.450.a:0 "How Dare Are They?"
 Turkey.453.title:0 "Bomb Explosion In Istiklal/Istanbul"
 Turkey.453.desc:0 "Six people were killed and 81 others wounded on Sunday when an explosion rocked a busy pedestrian street in central Istanbul in what Turkish President Tayyip Erdogan called a bomb attack that “smells like terrorism.” Hundreds of people fled the historic Istiklal Avenue after the blast, as ambulances and police raced in. The area, in the Beyoglu district of Turkey’s largest city, had been crowded as usual at the weekend with shoppers, tourists and families."
 Turkey.453.a:0 "Oooh.."
 Turkey.454.title:0 "Assasination Of Sinan Ateş"
 Turkey.454.desc:0 "Former President of Ülkü January Education and Culture Foundation and Hacettepe University Faculty Member Assoc. Dr. Sinan Ateş and his friend Selman Bozkurt, who were with him, were attacked by a person on a motorcycle at the exit of the mosque on 1456th Street in the Kızılırmak District of Çankaya district of Ankara last Friday. The Assoc who was shot in the head. Dr. Ateş lost his life at the scene, while his friend Bozkurt was injured in the shoulder. 3 people were detained along with the attacker in connection with the incident. Assoc. Dr. Sinan Ateş was buried at the Emir Sultan Cemetery after the funeral prayer attended by about 10 thousand people at the Great Mosque of Bursa."
 Turkey.454.a:0 "Not Good"
 Turkey.455.title:0 "Özgür Özel Attacks On Interior Minister"
 Turkey.455.desc:0 "Stating that he gave the file he claimed to be about Interior Minister Süleyman Soylu to three more people in case "something happened to him", CHP Group Deputy Chairman Özgür Özel announced the documents in his possession on live TV."
 Turkey.455.a:0 "What Nonsense Are They Talking"
 Turkey.456.title:0 "Devlet Bahceli Takes Attention"
 Turkey.456.desc:0 "MHP leader Devlet Bahçeli met with intense attention of journalists while passing through the Parliament corridor after the group meeting.\n\nYıldız Yazıcıoğlu, Ankara correspondent of Voice of America radio, handed Bahçeli a microphone and said, “It is being discussed that Erdogan cannot be a candidate for the third time, if no decision is taken in the Parliament ... What are your views, I wonder?” why did he ask. Bahçeli replied to Yazıcıoğlu, “I think it is understood that you did not listen to me.”\n\nMHP Deputy Chairman Muhammed Levent Bülbül's eyes opened like a fortune teller when he heard the phrase “Sinan Ates” pouring out of the journalist's mouth.\n\nThe reporter directed a question to Bahçeli, who wanted to get away from the area, this time starting with “The accusations against the MHP in the Sinan Ateş murder ...”. The MHP leader got angry on this question and said, “Mind your business, come on.”"
 Turkey.456.a:0 "What Can We Do About That"
 Turkey.457.title:0 "Rasmus Paludan Burns Qur'an In Front Of Turkish Embassy"
 Turkey.457.desc:0 "The founder of the far-right Stram Kurs party, Rasmus Paludan, stressed yesterday that the Swedish police had authorized the action to be taken today and invited everyone to the action on their social media accounts. Paludan made a long statement with a cigarette lighter in his hand between TSI and the security measures taken by the Swedish police in an area in front of the Turkish Embassy in Stockholm at 15.00.\n\nPaludan then burned the Holy Quran and continued his explanations with the burning Holy Quran in his hand. It was seen that the Swedish police did not intervene in Paludan during the action.\n\nRasmus Paludan, a Danish-Swedish citizen known for his extreme right-wing views, is known as the founder of a far-right political party called Stram Kurs, which operates in Denmark and Sweden. Paludan was previously sentenced to one month in prison in Denmark in 2020 for several crimes, including racism.\n\nPaludan has organized a Koran burning action before and most recently carried out a Koran burning action in a heavily Muslim neighborhood last year."
 Turkey.457.a:0 "How Dare Are They?"
 Turkey.458.title:0 "Turkey Indefinitely Decommissions The TFS Meetings"
 Turkey.458.desc:0 "At the request of Ankara, the trilateral mechanism meeting between Turkey, Sweden and Finland was Decommissioned indefinitely. The next meeting was scheduled to be held in Brussels in February. \n\nPresident Tayyip Erdogan said yesterday that ”if Sweden cannot respect the religious faith of Muslims, it will not receive any support from us regarding NATO.""
 Turkey.458.a:0 "Goodbye NATO!"
 Turkey.459.title:0 "Creation Of The "Table Of Six""
 Turkey.459.desc:0 "The Six Tables were established as a political organization by the CHP, the IYI Party, the Saadet Party, the Democratic Party, the DEVA Party, and the Gelecek Party with its first meeting on February 12, 2022. IYI Party Secretary General Uğur Poyraz explained that the National Alliance is an alliance in the election process and has become a business association with the election process left behind."
 Turkey.459.a:0 "Opposition Has United"
 Turkey.460.title:0 "Warnings From Various Consulates"
 Turkey.460.desc:0 "Following the security alert issued by the US Embassy on January 27, leading European countries made similar statements and decided to temporarily close their consulates in Istanbul, especially around Taksim. The security alert was based on “serious and specific” intelligence about a terrorist act that could target foreign missions, churches, and synagogues, as well as tourist hotspots, and was reflected in the statements made in cooperation with the Turkish authorities."
 Turkey.460.a:0 "What Are They Planning?"
 Turkey.461.title:0 ""Table Of Six's" Joint Memorandum of Understanding has been published"
 Turkey.461.desc:0 "The "Table Of Six" consisting of the CHP, the IYI Party, the DEVA Party, the Gelecek Party, the Saadet Party, and the Democratic Party published a Joint Memorandum of Understanding formed in the election promises. While the Joint Memorandum of Understanding contains more than 2 thousand regulations in 9 titles, the electoral threshold, the Presidential term, and Ataturk Airport were among the promises that attracted attention.\n\nThe text of the Common Policies Memorandum of the National Alliance was announced at the meeting attended by the heads of six political parties. The text of the covenant that is described by six deputy chairmen of the party, “Law, Justice and the Judiciary”, “Public Administration”, “anti-corruption, transparency and auditing”, “economy, finance and employment”, “Science, R & D, innovation, entrepreneurship and digital transformation”, “sectoral policies”, “education”, “social policy” and “foreign policy, defense, security, and migration policy under the name of” 9 consists of the main topics.\n\nThe Titles Of The Election Stakes\n\nThe 12 titles included in the Common Policies Memorandum of Understanding, which includes more than 2 thousand regulations, and which are among the most talked about on social media, are as follows:\n\n1) The residences and palaces allocated to the Presidency will be opened to the public. Some planes belonging to the Presidency will be sold.\n2) The electoral threshold will be reduced to 3 percent.\n3) The revenues obtained from corruption and smuggled abroad will be brought to the country, and an Office for the Recovery of Assets will be established within this framework.\n4) The Turkish Wealth Fund will be closed.\n5) Kanal Istanbul project will be canceled, and Ataturk Airport will be reopened.\n6) Trustees appointed to local governments will go.\n7) The finance office, human resources office, etc. offices established within the Presidency will be closed.\n8) The Central Bank, which is preparing to move to Istanbul, will return to Ankara with all its offices.\n9) The Exchange Rate Protected Deposit system will be completed.\n10) For Public-Private Cooperation projects where irregularities and corruption are detected, legal actions will be initiated against contractor companies, their partners, and responsible persons who cause public damage, if any, and the resulting damages will be collected from those concerned.\n11) No one will receive more than one salary. The interview will be over.\n12) The Council of Higher Education will be abolished, universities will choose their own management, their own faculty members will conduct the audit."
 Turkey.461.a:0 "Interesting"
 Turkey.462.title:0 "Kilicdaroglu Talks With A Young Man"
 Turkey.462.desc:0 "CHP Chairman Kemal Kiliçdaroğlu attended the Future Youth Festival held in Istanbul yesterday.\n\nWhile Kiliçdaroğlu made his speech at the event, high school student Ömer Faruk Berber, who was in the back row of the tribune, addressed the CHP leader by saying “Don't be a candidate”.\n\nWhile some of the people attending the event reacted to Ömer Faruk Berber, CHP leader Kiliçdaroğlu met with the young man who addressed him.\n\nCHP Group Deputy Chairman Engin Özkoç shared on his social media account about the meeting: “Our Chairman Kemal Kiliçdaroğlu met with high school student Ömer Faruk, who protested against him at the Youth Festival. He said that everyone has freedom of opinion, he respects every opinion. "Democracy Will Win,” he said."
 Turkey.462.a:0 "Whatever"
 Turkey.464.title:0 "The Pazarcik Earthquake"
 Turkey.464.desc:0 "On 6 February 2023, an earthquake struck southern and central Turkey and northern and western Syria. It occurred 34 km (21 mi) west of the city of Gaziantep at 04:17 AM TRT (01:17 UTC), with a maximum Mercalli intensity of XI (Extreme), and a magnitude of at least Mw 7.8. There was widespread damage and tens of thousands of fatalities.\n\nIt was the deadliest and strongest earthquake in Turkey since the 1939 Erzincan earthquake, of the same magnitude. It was also the deadliest earthquake to have affected Syria since the 1822 Aleppo earthquake and one of the strongest earthquakes ever recorded in the Levant as well as the deadliest earthquake worldwide since the 2010 Haiti earthquake. It was felt and caused structural damage as far as Israel, Lebanon, Cyprus, and the Black Sea coast of Turkey. The earthquake had more than 1,000 aftershocks, including an unusually powerful Mw  7.7 nine hours after the mainshock.As of 10 February, more than 24,000 deaths had been reported; 20,000 in Turkey and 4,000 in Syria. A large winter storm hampered rescue efforts, dropping snow on the ruins and bringing plummeting temperatures. Due to the freezing temperatures in the area, survivors, especially those trapped under rubble, are at great risk of hypothermia."
 Turkey.464.a:0 "Devastating"
 Turkey.465.title:0 "Death Of Deniz Baykal"
 Turkey.465.desc:0 "Former CHP Chairman Deniz Baykal, one of the most important figures in Turkish politics, has lost his life. The news of Baykal's death was announced by CHP Chairman Kemal Kiliçdaroğlu on his social media account. Asli Baykal, Deniz Baykal's daughter, said, "My father passed away in his sleep at home this morning. We plan to bury the funeral in Antalya on Tuesday," she informed."
 Turkey.465.a:0 "Rest In Peace!"
 Turkey.466.title:0 "Legacy Of The Gölcük 1999 Earthquake"
 Turkey.466.desc:0 "On 17 August 1999, a catastrophic magnitude 7.6 earthquake struck the Kocaeli Province of Turkey, causing monumental damage and 17,127–18,373 deaths. Named for the quake's proximity to the northwestern city of Izmit, the earthquake is also commonly referred to as the 17 August Earthquake or the 1999 Gölcük Earthquake. The earthquake occurred at 03:01 local time (00:01 UTC) at a shallow depth of 15 km. A maximum Mercalli intensity of X (Extreme) was observed. The earthquake lasted for 37 seconds, causing seismic damage and is widely remembered as one of the deadliest natural disasters in modern Turkish history.\n\nThe 1999 earthquake was part of a seismic sequence along the North Anatolian Fault that started in 1939, causing large earthquakes that moved progressively from east to west over a period of 60 years. The earthquake encouraged the establishment of a so-called earthquake tax aimed at providing assistance to the ones affected by the damages of earthquake.\n\nThere was destruction caused in Marmara as a result of the earthquake, as well as hundreds as killed and many buildings collapsed. We started repairing this place back then, but the damage is still there. These places need to be completely repaired."
 Turkey.466.a:0 "We Still Need To Build Up!"
 Turkey.467.title:0 "The Pazarcik Earthquake"
 Turkey.467.desc:0 "The Mw 7.8 earthquake is the largest in Turkey since the 1939 Erzincan earthquake of the same magnitude, and jointly the second-strongest recorded in the history of the country, after the 1668 North Anatolia earthquake. It is also one of the strongest earthquakes ever recorded in the Levant. It was felt as far as Egypt and the Black Sea coast of Turkey. There were more than 10,000 aftershocks in the three weeks that followed. The seismic sequence was the result of shallow strike-slip faulting.\n\nThere was widespread damage in an area of about 350,000 km2 (140,000 sq mi) (about the size of Germany). An estimated 14 million people, or 16 percent of Turkey's population, were affected. Development experts from the United Nations estimated that about 1.5 million people were left homeless.\n\nThe confirmed death toll stood at 59,259: 50,783 in Turkey and 8,476 in Syria. It is the deadliest earthquake in what is now present-day Turkey since the 526 Antioch earthquake and the deadliest natural disaster in its modern history.  It is also the deadliest in present-day Syria since the 1822 Aleppo earthquake; the deadliest worldwide since the 2010 Haiti earthquake; and the fifth-deadliest of the 21st century. Damages were estimated at US$104 billion in Turkey and US$14.8 billion in Syria, making them the fourth-costliest earthquakes on record."
 Turkey.467.a:0 "Devastating"
 Turkey.468.title:0 "The Pazarcik Earthquake"
 Turkey.468.desc:0 "On 6 February 2023, an earthquake struck southern and central Turkey and northern and western Syria. It occurred 34 km (21 mi) west of the city of Gaziantep at 04:17 AM TRT (01:17 UTC), with a maximum Mercalli intensity of XI (Extreme), and a magnitude of at least Mw 7.8. There was widespread damage and tens of thousands of fatalities.\n\nIt was the deadliest and strongest earthquake in Turkey since the 1939 Erzincan earthquake, of the same magnitude. It was also the deadliest earthquake to have affected Syria since the 1822 Aleppo earthquake and one of the strongest earthquakes ever recorded in the Levant as well as the deadliest earthquake worldwide since the 2010 Haiti earthquake. It was felt and caused structural damage as far as Israel, Lebanon, Cyprus, and the Black Sea coast of Turkey. The earthquake had more than 1,000 aftershocks, including an unusually powerful Mw  7.7 nine hours after the mainshock.As of 10 February, more than 11,027 deaths had been reported; 27 in Turkey and 11,000 in Syria. A large winter storm hampered rescue efforts, dropping snow on the ruins and bringing plummeting temperatures. Due to the freezing temperatures in the area, survivors, especially those trapped under rubble, are at great risk of hypothermia."
 Turkey.468.a:0 "Stand Strong Buildings!"
 Turkey.469.title:0 "2020 Aegean Sea earthquake"
 Turkey.469.desc:0 "Izmir earthquake had a moment magnitude of 7.0 which struck on Friday, 30 October 2020, about 14 km (8.7 mi) northeast of the Greek island of Samos. Many buildings were severely damaged or collapsed as a result of the earthquake, with the Church the Assumption of Mary in Karlovasi, Greece, partially collapsing, while in the Turkish city İzmir, which was heavily affected by the earthquake, dozens of buildings were either damaged or completely collapsed. Emergency services in both countries immediately attended the scene, as rescue efforts continued into the night. 1170 people are known to have died in Turkey's İzmir Province, with 7,034 more injured. \n\nIn Greece, there were an additional two fatalities and nineteen minor injuries. The earthquake is the most powerful in the Aegean Sea since 1981, and the deadliest in İzmir Province since a magnitude 6.6 killed four people in 1955. The earthquake is also the deadliest in the year of 2020."
 Turkey.469.a:0 "Oh No!"
 Turkey.470.title:0 "2020 Elazig earthquake"
 Turkey.470.desc:0 "The 2020 Elaziğ earthquake occurred at 20:55 on 24 January in Turkey. The magnitude of the earthquake was determined to be 6.7 Mw. The earthquake's epicenter was close to the town of Sivrice in Elaziğ Province and felt in the neighboring provinces of Diyarbakir, Malatya, and Adiyaman, and the neighboring countries of Armenia, Syria, and Iran. Kandilli Observatory reported the magnitude of the earthquake as 6.5 Mw . A total of 783 people were killed and more than 3,600 were injured."
 Turkey.470.a:0 "Oh No!"
 Turkey.471.title:0 "IYI Party Leaves The Table Of Six"
 Turkey.471.desc:0 "IYI Party Chairman Meral Akşener held a press conference after the meeting where she met with the members of the General Administrative Board. Akşener said that at the point reached, the IYI Party was taken into a clamp and forced to impose, but they would not submit to it.\n\nNoting that 5 political parties expressed their candidacy for Kemal Kilicdaroglu at a table of 6 meetings held yesterday, Akşener said, "We, as the IYI Party, have expressed our opinion about the candidacy of 2 names that we have often heard on the streets, shops, and squares for more than 3 years; we have witnessed our nation's intense countenance almost everywhere and we have seen that he has won by a Deceleration against Mr. Erdogan for a long time in all opinion polls. These 2 names are; It was our Mayor of Ankara Metropolitan Municipality Mr. Mansur Yavaş and our Mayor of Istanbul Metropolitan Municipality Mr. Ekrem Imamoğlu," she said."
 Turkey.471.a:0 "A Certain Decision"
 Turkey.472.title:0 "Removal Of Mines In The Syrian Borderland"
 Turkey.472.desc:0 "Regardless of the relations between Syria and Turkey, we are obliged to Decontaminate these mines because we have signed the Ottawa convention. Now we have cleared the mines as of 2011."
 Turkey.472.a:0 "For The Humanity!"
 Turkey.473.title:0 "Umit Ozdag And Muharrem Ince Creates An Alliance"
 Turkey.473.desc:0 "Victory Party Chairman Umit Özdağ, Hometown Party Chairman Muharrem Ince, Doğru Party Chairman Rifat Serdaroğlu, and Justice Party Chairman Vecdet Öz reportedly came together for the fourth alliance in Turkey.\n\nThe People's Alliance, the Nation Alliance, and the Labor and Freedom Alliance have already been established in Turkey for the elections in May 2023. The Hometown Party, the Victory Party, the Right Party, and the Justice Party had previously announced to the public that they would form a fourth alliance."
 Turkey.473.a:0 "Whatever"
 Turkey.474.title:0 "End Of The Umit Ozdag And Muharrem Ince Alliance"
 Turkey.474.desc:0 "Ümit Özdağ stated in a TV program he participated in that Muharrem Ince had left the alliance they were thinking of forming. Özdağ said that the reason for this was that he had called the Mayor of Ankara Metropolitan Municipality Mansur Yavaş to take office. Özdağ admitted that he had expected such a thing when he said that he found Ince's attitude wrong."
 Turkey.474.a:0 "And The Alliance Goes Away!"
 Turkey.475.title:0 "Anti-Governmental Protests In The Tribunes"
 Turkey.475.desc:0 "At the Fenerbahce-Konyaspor and Besiktas-Antalyaspor matches played the previous week, fans who invited the government to resign a few months before the election attracted the government's reaction."
 Turkey.475.a:0 "How Dare Are They?"
 Turkey.476.title:0 "IYI Party Returns To The Sixth Partnership"
 Turkey.476.desc:0 "IYI Party Chairman Meral Akşener met with Ekrem Imamoğlu and Mansur Yavaş then met with CHP Chairman Kemal Kılıçdaroğlu. It was stated that Akşener and Kılıçdaroğlu's meeting at the hotel in Çukurambar was also attended by Imamoğlu and Yavaş.\n\nIt was learned that Akşener conveyed to Kılıçdaroğlu the proposal to give the position of vice president to Imamoğlu and Yavaş during the meeting. After the meeting, Akşener and Kılıçdaroğlu left the hotel separately.\n\nAfter this meeting at the hotel, IYI Party Spokesman Kürşad Zorlu made a statement in front of the party headquarters. Zorlu stated that Meral Akşener, the Leader of the IYI Party, held a meeting with CHP Chairman Kemal Kılıçdaroğlu and said, "As of now, our chairman has decided to attend the meeting of the National Alliance in the Felicity Party in a moment," he said."
 Turkey.476.a:0 "They Are Back!"
 Turkey.477.title:0 "Kilicdaroglu Becomes The President Candidate Of National Alliance"
 Turkey.477.desc:0 "The presidential nomination debate took place today at the critical meeting of the Nation Alliance. Following the statements of Meral Akşener, the leader of the IYI Party, who objected to the candidacy of CHP leader Kemal Kılıçdaroğlu at the meeting announced that the Presidential candidate would be determined at the Table of Six, successive developments took place. Today, for the first time, the CHP, the IYI Party, the DEVA Party, the Future Party, and the Felicity Party of the Democratic Party came together under the hosting of the Felicity Party.  The meeting lasted 4.5 hours. The Nation Alliance's Presidential candidate declared as Kemal Kılıçdaroğlu. The popular mayors of Mansur Yavaş and Ekrem İmamoglu will be Vice-Presidents in the future."
 Turkey.477.a:0 "Here We Go!"
 Turkey.477.b:0 "Here We Go! §Y(With No Speech)§!"
 Turkey.478.title:0 "CHP's New President Candidate"
 Turkey.478.desc:0 "CHP mayors in Ankara and Istanbul have become popular in the country. We can make Ekrem Imamoglu or Mansur Yavas a candidate for President. The choice is yours."
 Turkey.478.a:0 "Mansur Yavas"
 Turkey.478.b:0 "Ekrem Imamoglu"
 Turkey.479.title:0 "Flood In Adiyaman"
 Turkey.479.desc:0 "Tokat Governor Numan Hatipoglu, who was appointed coordinator of the Gölbaşı district of Adiyaman, announced that 1 person lost his life and 3 people were missing as a result of a container in a garden in the Tut district of Adiyaman, where the downpour was effective, got caught in the water. It was learned that the 3 missing people were from the same family. Regarding the situation in the city, where 103 kg of precipitation fell per square meter, Adiyaman Mayor Süleyman Kılınç said, "We are receiving the biggest rainfall of recent times. Keep the information coming to us, we have 1 loss of life in our district, 3 losses. There are problems in the tents, we are gradually evacuating," he said. In the statement made by AFAD,"Floods and floods have occurred in the Tut district of our Adiyaman province due to excessive rains occurring in the region. Our Adıyaman, Adana, Kahramanmaraş, and Diyarbakır AFAD teams have been assigned to the incident area. We are following the developments," it was said"
 Turkey.479.a:0 "Another Disaster Following Earthquake"
 Turkey.480.title:0 "Heavy Hail In The Gaziantep"
 Turkey.480.desc:0 "Due to the rainfall and hail that started in the evening hours in the city, puddles formed on some streets and streets. Vehicle drivers and pedestrians had a difficult time because of the puddles. In the city, where the vehicles were covered with a white blanket due to hail, some citizens covered their vehicles with blankets and carpets to protect them from hail."
 Turkey.480.a:0 "Another Disaster Following Earthquake"
 Turkey.481.title:0 "Refah And AK Party Alliance"
 Turkey.481.desc:0 "Hours before the political parties submitted the alliance protocols to the Supreme Electoral Council (YSK), the Welfare Party Again (YRP), of which Fatih Erbakan is the chairman, joined the People's Alliance with a compromise reached the last moment.\n\nThe protocol of the People's Alliance, consisting of the Justice and Development Party (AKP), the Nationalist Movement Party (MHP), the Great Unity Party (BBP), and the YRP, signed by the chairmen in line with the reached consensus, was submitted to the YSK by the party managers."
 Turkey.481.a:0 "We Are United Against The Table Of Six"
 Turkey.482.title:0 "Mehmet Simsek Refuses The AK Party"
 Turkey.482.desc:0 "AKP President Recep Tayyip Erdogan met with former Finance Minister Simsek at the AKP Headquarters. During his meeting with AKP President Tayyip Erdogan, Simsek stated that he was not thinking of entering active politics, but was ready to provide support on issues that fall within his field."
 Turkey.482.a:0 "Whatever"
 Turkey.483.title:0 "HUDAPAR Joins AK Party"
 Turkey.483.desc:0 "(HUDA PAR) Chairman Zekeriya Yapicioglu said, "We have decided to support the People's Alliance candidate Recep Tayyip Erdoğan in the 2023 Presidential election. Our discussions about the parliamentary elections are also continuing," he said."
 Turkey.483.a:0 "We Are United Against The Table Of Six"
 Turkey.484.title:0 "TOGG Begins Adaptation To The Modern Life"
 Turkey.484.desc:0 "TOGG mass production excitement started with the factory opening ceremony. Turkey's smart car TOGG factory was opened today in the Gemlik district of Bursa with the participation of the President. In a very short time, TOGG mass production will start at full speed in the factory built using one of the most technological infrastructures in the world. The facility, which has a production capacity of 175 thousand per year, aims to produce a total of 1 million vehicles from 5 different models in 10 years."
 Turkey.484.a:0 "Good News"
 Turkey.485.title:0 "First HURJET Flight"
 Turkey.485.desc:0 "The HÜRJET Jet Training and Light Attack Aircraft, developed by the Turkish Aerospace Industries (TAI), had recently left the runway with the F404 Turbofan Engine. HÜRJET, whose engine integration was successfully completed, started ground tests and successfully carried out its first flight."
 Turkey.485.a:0 "Good News"
 Turkey.486.title:0 "First Boron Carbide Plant"
 Turkey.486.desc:0 "According to the statement made by the Ministry of Energy and Natural Resources, in Turkey, which has 73 percent of the world's boron reserves, Eti Maden broke a record with sales revenue of 1 billion 321 million dollars last year. Turkey's first boron carbide plant, which will be one of the first strategic facilities of Turkey and will add strength to the strength of the defense industry, will be opened today in the Bandırma district of Balıkesir.\n\n1000 Tons of boron carbide will be produced annually at the facility, where 279 people will be employed when it operates at full capacity. Boron carbide, which is the third hardest substance after diamond and cubic boron, is used in many fields, especially in the defense industry."
 Turkey.486.a:0 "Good News"
 Turkey.487.title:0 "TCG Anadolu"
 Turkey.487.desc:0 "Anadolu (L-400) is an amphibious assault ship of the Turkish Navy that can be configured as a V/STOL aircraft carrier. It is named after the peninsula of Anatolia which forms the majority of the land mass of Turkey. The construction works began on 30 April 2016 at the shipyard of Sedef Shipbuilding Inc. in Istanbul, with the keel being laid on 7 February 2018. TCG Anadolu was commissioned with a ceremony on 10 April 2023."
 Turkey.487.a:0 "Good News"
 Turkey.488.title:0 "Turkish Red Crescent Case"
 Turkey.488.desc:0 "Red Crescent President Kerem Kınık responded to the allegations that Red Crescent tents were sold to Ahbap on CNN TURK. Kızılay President Kınık said, "About 2 thousand 50 of our tents have been delivered at a cost price. We are doing it for financial sustainability," he said.\n\nSerious reductions were observed in the amount of voluntary blood given to the Red Crescent upon confession, and the organization was completely damaged."
 Turkey.488.a:0 "The Situation Gets Worse"
 Turkey.489.title:0 "Mahir Akkoyun Gets Arrested"
 Turkey.489.desc:0 "Some of the images recently shared on social media were among the most creative and attention-grabbing political Decries of the recent period. Stickers with ”Thanks to Erdogan" written on them were pasted on products in grocery stores and stores, thus criticizing the cost of living, which had recently reached an unbearable size. It is this “thanks to Erdogan” that the stickers with the slogan emblazoned on the shelves of expensive grocery stores and stores have caused a remarkable development to occur. The designer of the stickers, Mahir Akkoyun, announced via his social media account that he had been detained. Of course, a large number of politicians, as well as thousands of social media users, reacted strongly to Akkoyun's detention."
 Turkey.489.a:0 "Eh"
 Turkey.490.title:0 "IYI Party Attacks Fahrettin Altun"
 Turkey.490.desc:0 "The IYI party attacked Fahrettin Altun through animation. The IYI Party animation claimed that Communications Minister Fahrettin Altun manipulated the media and created a troll army."
 Turkey.490.a:0 "It's Not Acceptable"
 Turkey.491.title:0 "Suleyman Soylu Attacks Opposition"
 Turkey.491.desc:0 "Addressing the party members at the AK Party Sariyer District Presidency, Interior Minister Süleyman Soylu said, "It will be the opposition, not the government, that has changed. We are facing an opposition that does not even deserve opposition, let alone deserves power. The people will fulfill their needs," he said."
 Turkey.491.a:0 "Move On!"
 Turkey.492.title:0 "Mansur Yavas Pushes Anti-PKK Speech"
 Turkey.492.desc:0 "The Mayor of Ankara Metropolitan Municipality, the deputy presidential candidate of the Nation Alliance, Mansur Yavaş, reacted to the terrorist organization PKK with very harsh words. Yavaş, who said that the table of six wanted to open an immaculate page, but Kandil was trying to spoil it, said, "We are saying clearly: we will wash Kandil on their heads as well! We are also against the PKK," he said."
 Turkey.492.a:0 "Bad News"
 Turkey.493.title:0 "Creation Of The Mustafaz-Der"
 Turkey.493.desc:0 "Following the decision to end the armed struggle in 2002, activists of the Hizbullah's Menzil group founded an association called "Solidarity with the Oppressed" in 2004."
 Turkey.493.a:0 "A New Foundation"
 Turkey.494.title:0 "Court Shuts Down The Mustafaz-Der"
 Turkey.494.desc:0 "On 20 April 2010 a court in Diyarbakır ordered the closure of the Association for the Oppressed (Mustazaf-Der) on the grounds that it was “conducting activities on behalf of the terrorist organization Hizbollah.” The decision was confirmed by the Court of Cassation on 11 May 2012."
 Turkey.494.a:0 "The Movement Will Continue With Its New Name"
 Turkey.495.title:0 "HDP Changes Itself To The YSP"
 Turkey.495.desc:0 "In the Candidate presentation meeting, HDP Co-Chair Mithat Sancar pointed to the closure case against her party and said, “The power of change is in our hands, the responsibility for building the future on freedom and equality is on our shoulders. We could never leave this responsibility and duty to the initiative of the court and at the mercy of the government. As a matter of fact, we didn't quit. That's how we've built our way against all the games. Now the road is Green Left," he said.\n\nThe HDP, which decided to enter the elections under the umbrella of the Green Left Party, did not provide an oral defense to the Constitutional Court in accordance with the decision it took earlier. Party managers attended the Green Left Party candidate promotion meeting, where they nominated deputies instead of the Constitutional Court."
 Turkey.495.a:0 "What A Dramatic Change!"
 Turkey.496.title:0 "Blacksea Under Flood"
 Turkey.496.desc:0 "In August 2021, the Black Sea region in Turkey was affected by catastrophic flooding, as a series of thunderstorms that began on 7 August 2021 and continued until the 14th in northern Turkey caused several floods and landslides. The water rose to 4 meters (13 ft) in some locations, and the floods have been described as the worst in Turkey's history. 97 people died and about 228 more were injured in the floods, and more than 1800 people were evacuated as many people were rescued from rooftops. Reports have shown that at least 454 buildings had sustained significant damage. Bridges were also damaged or destroyed, and the infrastructure of multiple towns was significantly affected. Experts have stated that urbanization and climate change in Turkey have made the floods worse, although to what extent each factor was responsible has been disputed."
 Turkey.496.a:0 "A Complete Disaster"
 Turkey.497.title:0 "Soma Mining Accident"
 Turkey.497.desc:0 "On 13 May 2014, blasting at Eynez coal mine in Soma, Manisa, Turkey, caused an underground mine fire, which burned until 15 May. In total, 301 people were killed in what was the worst mine disaster in Turkey's history. The line, operated by cool producer Soma Kömür Isletmeleri A.S., suffered a fire, the causes of which were later found to be complex. The fire occurred at the mine's shift change, and 787 workers were underground at the time. At the time the disaster was thought to be mainly an explosion rather than fire. After the final bodies were pulled from the mine on 17 May 2014, four days after the fire, the Minister of Energy and Natural Resources Taner Yıldız confirmed the number of dead was 301. Disaster and Emergency Management Presidency (AFAD) announced the names of 301 workers who died in the mine disaster and 486 people who survived."
 Turkey.497.a:0 "A Complete Disaster"
 Turkey.498.title:0 "Creation Of The Ankapark"
 Turkey.498.desc:0 "Under the presidency of Melih Gökçek, steps were taken for an Ankapark project in Ankara. We hope that this Ankapark project will provide a good situation for attracting tourists."
 Turkey.498.a:0 "Interesting"
 Turkey.499.title:0 "Mansur Yavas Accepts To Continue To Ankapark"
 Turkey.499.desc:0 "AKP Member of Parliament Sinan Burhan's "Will you open Ankapark? answering the question "Yes, I will open it", Yavaş continued as follows: "Why shouldn't I open it, I have money there too. I will open it to the public, and not with money stamps.""
 Turkey.499.a:0 "It Seems Like Good News"
 Turkey.500.title:0 "Cem Saygi's Scandal"
 Turkey.500.desc:0 "After the 'Gas Pedal' dance of Hometown Party Chairman Muharrem Ince, which shook social media, the images of Cem Saygı dancing also went viral. He found himself saying, ‘What if I did twerk, bro? Ince also does the Gas Pedal,' he defended with words.\n\nAfter the events, Cem Saygı claimed that he was offered 5 thousand TL money to resign as a parliamentary candidate for the Hometown Party led by Muharrem Ince and received death threats. Having made statements on the live broadcast he opened from his social media account, Saygı, reproached Ince with the words 'Is this how he opens the way for young people'."
 Turkey.500.a:0 "Bad News"
 Turkey.501.title:0 "Muharrem Ince Promises For Space Extraction"
 Turkey.501.desc:0 "Muharrem Ince made strange and unreal promises in his election speech. Muharrem Ince told the public about space mining, nanotechnology, and fusion. He also emphasized fusion three times."
 Turkey.501.a:0 "He Is Good At Dance"
 Turkey.502.title:0 "Melih Gokcek Explodes The Balloons"
 Turkey.502.desc:0 "Melih Gökçek attacked opposition leader Kılıçdaroğlu. Melih Gökçek wrote Kılıçdaroğlu on the balloon as a method of attack and blew it up. The situation was received strangely by the public."
 Turkey.502.a:0 "What He Is Up To?"
 Turkey.503.title:0 "The Istanbul Finance Centre"
 Turkey.503.desc:0 "Istanbul Financial Center is the name given to the financial center project located in the Umraniye district of Istanbul. According to the statement made by the Ministry of Environment and Urbanization, the goal of this project is to build a larger financial center than the existing financial centers located in New York, London, and Dubai and to turn Istanbul into an international financial center. According to the statements made, the aim of the project was stated both to create a center that will become the heart of the financial sector and to build a place that lives 24 hours a day. It was also added that with the completion of the project, there will be a source of employment for about 30 thousand people. Of the approximately 2 million 500 thousand square meters construction area, 560 thousand square meters will be offices, 90 thousand square meters will be shopping malls, 70 thousand square meters will be hotels, 60 thousand square meters will be residences and a culture and congress center with a capacity of 2 thousand people."
 Turkey.503.a:0 "For The Great Future"
 Turkey.504.title:0 "IMECE Sent To Space"
 Turkey.504.desc:0 "IMECE, which started as an infrastructure project in 2013 with the funding of the Ministry of Development, is supported as an “IMECE Satellite Project” within the scope of the TUBITAK 1007 Program in 2017 and the works are started at TUBITAK SPACE. IMECE satellite, one of the outputs of the project, which is nearing its end in a period of 6 years, was launched on April 15, 2023. In this context, IMECE, which left the launch vehicle (Falcon 9) at 12.23, also sent the first signals within minutes."
 Turkey.504.a:0 "A New Space Action"
 Turkey.505.title:0 "Mansur Yavas Gets 2021 Mayor Awards"
 Turkey.505.desc:0 "Mayor of Ankara Metropolitan Municipality Mansur Yavaş said that he won the '2021 World Mayor Award' in which 32 mayors from 21 countries were nominated. Yavaş said, "This success does not belong to Mansur Yavaş. 6 million people of Ankara, God willing, I will receive this award on behalf of you," he said."
 Turkey.505.a:0 "Good For The CHP"
 Turkey.506.title:0 "Erdogan's Natural Gas Policy"
 Turkey.506.desc:0 "President Tayyip Erdogan on Thursday flicked the switch on Turkey's first delivery of natural gas to an onshore plant from a reserve discovered in the Black Sea, and promised to provide free natural gas for households before May 14 elections."
 Turkey.506.a:0 "Good News"
 Turkey.507.title:0 "AK Party Designated Attack On Kilicdaroglu"
 Turkey.507.desc:0 "On the first day of the Ramadan holiday, after Kemal Kılıçdaroğlu, the leading opposition party leader in the upcoming elections on May 14th, was targeted with sectarian insults while he was reciting prayers at the cemetery where those who lost their lives in the earthquake were located, a group attacked CHP, the opposition Republican People’s Party, members during a visit to a tomb in Adıyaman.\n\n The incident took place after Kılıçdaroğlu visited a religious shrine. During the delegation’s exit from the tomb, a person tried to get close to Kılıçdaroğlu and shouted, “We don’t want you. You don’t come here. You’re not the man who belongs here.” Some people in the area tried to attack Kılıçdaroğlu’s bodyguards."
 Turkey.507.a:0 "Whatever"
 Turkey.508.title:0 "The Ciftlinkbank Fraud"
 Turkey.508.desc:0 "The charity organization formed by the name of Çiftlinkbank swindled people with large amounts of money. The name "Tosuncuk", which manages Çiftlinkbank, has disappeared from the country Most likely, he fled abroad. The people who scammed are quite upset."
 Turkey.508.a:0 "That Should Be Bad"
 Turkey.509.title:0 "CHP Protests In Front Of TUIK Building"
 Turkey.509.desc:0 "After the announcement of the inflation figures, CHP Chairman Kemal Kilicdaroglu, who announced that he would visit the TURKSTAT, and the accompanying delegation, the doors of the TURKSTAT were not opened on the grounds that they did not have appointments. Kılıçdaroğlu, who made a statement in front of TURKSTAT, "TURKSTAT has ceased to be a state institution and has turned into a palace institution. This is no longer a state institution," he said."
 Turkey.509.a:0 "They Are Targeting Us!"
 Turkey.510.title:0 "The Pazarcik Tornado"
 Turkey.510.desc:0 "Due to the tornado in the Pazarcik district of Kahramanmaras, the tents where the earthquake victims were staying were displaced. 1 Person was killed and 50 people were injured due to fragments thrown from the roofs of damaged buildings."
 Turkey.510.a:0 "Another Disaster Following Earthquake"
 Turkey.512.title:0 "ZP's Campaign"
 Turkey.512.desc:0 "Zafer Party chairman Umit Ozdağ is on the streets to collect votes for Sinan Ogan, who is a presidential candidate. While he is on the street, he is burying the government by targeting the immigration policy."
 Turkey.512.a:0 "They Are Targeting Us!"
 Turkey.513.title:0 "Attacks On IYI Party Building"
 Turkey.513.desc:0 "A bullet hit the window of the IYI Party Istanbul Provincial Presidency building on Friday morning. IYI Party Chairman Meral Akşener first shared the incident on her Twitter account after the incident, telling President and AKP Chairman Recep Tayyip Erdogan, "Shoot the bullets coming at us knowing your threats as a duty; if you are going to come, you come!” he called out with his words."
 Turkey.513.a:0 "Start An Investigation"
 Turkey.514.title:0 "HDP Plans To End Elections In First Round"
 Turkey.514.desc:0 "On behalf of the Alliance for Labor and Freedom, HDP Co-Leader Pervin Buldan announced that they would not nominate candidates for the presidential election on May 14, saying, “We will fulfill our historical responsibility against the one-man rule in the presidential elections.”"
 Turkey.514.a:0 "Confusing"
 Turkey.515.title:0 "DSP Joins AK Party"
 Turkey.515.desc:0 "The Democratic Left Party (DSP) was the latest stopover of ruling Justice and Development Party (AK Party) officials as they seek to expand a pre-election alliance.\n\nThe party’s acting chair, Binali Yıldırım, and deputy chairperson and party spokesperson Ömer Çelik paid a visit to the party’s headquarters in the capital Ankara where they were received by DSP head Önder Aksakal.\n\nAksakal said they would discuss the proposal to join the People’s Alliance during a board meeting of his party and would announce the decision of joining AKP."
 Turkey.515.a:0 "We Are United Against The Table Of Six"
 Turkey.516.title:0 "Erdogan Announces First Turkish Space Travelers"
 Turkey.516.desc:0 "Türkiye has selected Alper Gezeravci and Tuva Cihangir Atasever as the country's first space travelers to be sent into space in the last quarter of this year, President Recep Tayyip Erdogan announced on Saturday.\n\nSpeaking at the country's major technology event TEKNOFEST, he said Gezeravci, a pilot in the Turkish Air Force, will be sent to the International Space Station, while Atasever, a system engineer in the Turkish missile producer Roketsan in the field of space launch systems, was chosen as the reserve candidate."
 Turkey.516.a:0 "Good News"
 Turkey.517.title:0 "Second Worries Of Erdogan's Health"
 Turkey.517.desc:0 "After falling ill during a live broadcast on Tuesday evening (April 25), Turkish President Recep Tayyip Erdoğan’s administration has provided several updates regarding the president’s health following two days of canceled events. Saying that the president had suffered from a common cold, the updates from Erdoğan’s communication office sought to quiet rumors that he had suffered from a more serious medical condition following the spread of rumors online."
 Turkey.517.a:0 "There Is No Problem Abroad"
 Turkey.518.title:0 "Suleyman Soylu Says 14th May Is A Coup Attempt"
 Turkey.518.desc:0 "Soylu, when asked about the words "May 14 is a political coup attempt", said, "What is wrong with it? They want to do with elections what they could not do with a coup. Erdogan has liquidated the system established by the United States," he replied. Pointing to US President Joe Biden, Biden says in this speech, 'Now we must do this job by bringing together all the opponents in Turkey to ensure this in the 2023 elections,' he says. This is not being said by a journalist, it is being said by the American president. He says not by a coup, but by an election," he used the expression."
 Turkey.518.a:0 "He Is Right"
 Turkey.519.title:0 "Opening Ceremony Of Akkuyu Nuclear Reactor"
 Turkey.519.desc:0 "The Kremlin on Tuesday said Russia will be represented at a "proper level" at the ceremony of the Akkuyu Nuclear Power Plant (NPP) in Türkiye later this month.\n\nSpeaking at a press briefing in Moscow, spokesman Dmitry Peskov said the Kremlin will soon announce who will chair the Russian delegation at the opening, adding that there will be engagement via video link as well. Earlier, Turkish President Recep Tayyip Erdogan said his Russian counterpart Vladimir Putin may travel to Türkiye to attend the ceremony on April 27, either in person or via teleconference.\n\nKicked off as part of the Russia-Türkiye collaboration, the Akkuyu NPP in Mersin province will be Türkiye’s first nuclear plant, and have an installed capacity of 4,800 megawatts and four reactors."
 Turkey.519.a:0 "To The Turkish Nuclear Age!"
 Turkey.520.title:0 "Erdogan Announces New Petrol Reserves"
 Turkey.520.desc:0 "Turkey's President Recep Tayyip Erdogan made the announcement of the new oil reserve discovery on Tuesday, revealing that it is located in the country's eastern region.\n\n“I'd like to share some fresh good news. We have discovered oil reserves with a production capacity of 100,000 barrels per day in Cudi and Gabar,” the president said at an opening ceremony of the Karapinar solar power plant.\n\nErdogan declared that the newly-found petroleum “has a high-quality structure,” and went on to say that “Turkey will no longer depend on others for energy but rather become an energy exporter.”"
 Turkey.520.a:0 "It Somehow Managed To Backfire"
 Turkey.521.title:0 "TIP's Labour Day Rallies"
 Turkey.521.desc:0 "The Workers' Party of Turkey (TIP), a left-wing political party, is one of the organizations that traditionally organize Labour Day rallies in the country. In 2021, TIP organized rallies in several cities, including Istanbul, Ankara, and Izmir, to call for better working conditions, higher wages, and greater job security for workers.\n\nIn Istanbul, TIP's Labour Day rally began in Kadikoy Square, where party members and supporters gathered to hear speeches and participate in demonstrations. The rally was peaceful, with participants carrying banners and signs calling for an end to exploitation and oppression in the workplace.\n\nSimilar rallies were also organized in other cities, with TIP members and supporters joining forces with labor unions and other progressive organizations to demand greater rights and protections for workers. The rallies were seen as an important opportunity to highlight the ongoing struggles faced by workers in Turkey and around the world, and to call for greater solidarity and collective action."
 Turkey.521.a:0 "Communists Are Gathering For Great Cause"
 Turkey.522.title:0 "CHP's/Kilicdaroglu's Rallies Of 2023"
 Turkey.522.desc:0 "In 2023, the Republican People's Party (CHP) held a series of rallies across Turkey, in the lead-up to the country's parliamentary elections. The rallies were aimed at mobilizing supporters and raising awareness about the party's policies and platform.\n\nOverall, the CHP's rallies in 2023 demonstrated the party's commitment to democratic values, social justice, and economic prosperity. The events were well-attended and energized supporters ahead of the parliamentary elections, which resulted in a strong showing for the CHP and its allies."
 Turkey.522.a:0 "Interesting"
 Turkey.523.title:0 "AKP's/Erdogan's Rallies Of 2023"
 Turkey.523.desc:0 "In 2023, the ruling Justice and Development Party (AKP) held a series of rallies across Turkey, in the lead-up to the country's parliamentary elections. The rallies were aimed at mobilizing supporters and highlighting the AKP's achievements during its time in power.\n\nOverall, the AKP's rallies in 2023 demonstrated the party's commitment to stability, security, and economic growth. The events were well-attended and energized supporters ahead of the local elections, which resulted in a strong showing for the AKP in many parts of the country."
 Turkey.523.a:0 "Interesting"
 Turkey.525.title:0 "Creation Of The People's Alliance"
 Turkey.525.desc:0 "The Alliance was formed between the ruling Justice and Development Party (AKP) and the right-wing Nationalist Movement Party (MHP), with the aim of consolidating the conservative vote and securing the re-election of President Recep Tayyip Erdogan.\n\nThe People's Alliance was founded on a shared vision of nationalism, conservatism, and strong leadership, and was able to appeal to a wide range of voters across Turkey. During the election campaign, the Alliance emphasized its commitment to economic growth, security, and stability, and promised to address the challenges facing the country."
 Turkey.525.a:0 "Initial Election Reorganization"
 Turkey.526.title:0 "Creation Of The Nation's Alliance"
 Turkey.526.desc:0 "The Nation Alliance is a political coalition that was formed in Turkey in 2018 ahead of the country's parliamentary and presidential elections. The coalition brought together several opposition parties, including the Republican People's Party (CHP), the Good Party (IYI), and the Felicity Party (SP), with the aim of providing a viable alternative to the ruling Justice and Development Party (AKP).\n\nThe Nation Alliance was formed in response to growing concerns about the AKP's increasingly authoritarian rule and the erosion of democratic institutions and civil liberties in Turkey. The opposition parties recognized the need to work together to consolidate the opposition vote and prevent the AKP from securing a majority in the parliament and winning the presidential election."
 Turkey.526.a:0 "Initial Election Reorganization"
 Turkey.527.title:0 "Erdogan's National Plane"
 Turkey.527.desc:0 "The AK party appeared in the elections this time with a poster with the name "Our domestic plane in the skies. "Thanks to the image on the posters, voters began to turn to the AK Party. It seems that the AK party will show strength in these elections."
 Turkey.527.a:0 "Its The Reality"
 Turkey.528.title:0 "Worries About Election Security"
 Turkey.528.desc:0 "There is also a lack of trust in these elections. For example, although the YSK opposed GAMER, which is a parallel structure of internal affairs, a pre-printed AKP vote in foreign voting were issues that increased election security problems."
 Turkey.528.a:0 "Whatever"
 Turkey.529.title:0 "People Attacks The HUDA-PAR Election Stand"
 Turkey.529.desc:0 "Before the rally that President Erdogan will hold in the city today, HUDA PAR set up a stand on Kahramanmaraş Street for leaflet distribution. At this time, there were those who reacted to the stand from some Trabzon residents passing through the street. In a short time, the growing crowd intervened at the stand with the slogan "What a happy who calls itself turk", while the banner belonging to the party was cut and thrown to the ground."
 Turkey.529.a:0 "The Actions Of ZP"
 Turkey.532.title:0 "Ali Yesildağ's Scandalous Statements"
 Turkey.532.desc:0 "A person named Ali Yeşildağ exposed the corruption of the government with the style of Sedat Peker. The statements caused an anti-AK Party thought to be formed in the electorate. This situation will affect the results of the election."
 Turkey.532.a:0 "Ouch"
 Turkey.533.title:0 "The Economist Attacks Erdogan"
 Turkey.533.desc:0 "The UK-based weekly magazine The Economist featured the May 14 elections on its cover this week and wrote that it was “the most important election of 2023”.\n\n Besides the Turkish flag on the cover of the issue, “Erdogan must go”, “Save democracy" and "Vote!" an image with their expressions on a sticker was also used.\n\nThe editorial said that President Recep Tayyip Erdogan's loss of the election "will give hope to democrats all over the world, show that dictators can leave with elections"."
 Turkey.533.a:0 "They Are Targeting Our Democracy"
 Turkey.534.title:0 "Erzurum Attack!"
 Turkey.534.desc:0 "Prior to the İstanbul Mayor’s planned campaign rally, Erzurum’s local government had parked dozens of public transport buses in the city’s main square in an attempt to prevent the event from proceeding as planned. Mehmet Sekmen, the city’s mayor, belongs to President Recep Tayyip Erdoğan’s Justice and Development Party (AKP). This initial attempt to derail İmamoğlu’s campaign rally led to widespread condemnation from opposition leaders. \n\nThen, shortly after the start of İmamoğlu’s speech, the gathering area and campaign bus being used by the Istanbul Mayor were attacked by a group with marble stones and building materials. Several injuries were reported, including to children. Interrupting his speech, İmamoğlu scolded the inaction of local police standing by as the attack was being carried out, saying: “You policemen who are just watching: we are watching you too. To this city’s local government and police department: we are watching you. You will have a criminal complaint filed against you.”\n\nİmamoğlu also accused the inaction of the police officers of encouraging the violence, saying “You are provoking this attack against a crowd carrying Turkish flags. All of this is in the name of supposed patriotism. People holding Turkish flags are being insulted.” A video and photos posted by the Istanbul Municipality taken from the inside of the bus showed major damage to the vehicle’s windows as well as Erzurum’s local riot police standing by idly as the attacking group hurled pieces of marble at the campaign bus being used by the Istanbul mayor."
 Turkey.534.a:0 "Victimization Wins Votes"
 Turkey.535.title:0 "Ekrem Imamoğlu Crime Prompt"
 Turkey.535.desc:0 "During the Istanbul Elections, Ekrem Imamoglu had sharply criticized the election authorities. Now Ekrem Imamoğlu has been sued for defamation and a prison sentence has been created. The events are not expected to be concluded."
 Turkey.535.a:0 "It's Getting Hardcore"
 Turkey.536.title:0 "Erdogan Talks With The Youth In TV"
 Turkey.536.desc:0 "President of the Republic of Turkey Erdogan has been on a Deceleration trend among the polls recently. Erdogan participated in a program organized by himself to prevent this. Due to the fact that the questions and answers were prepared in advance and the questioners were cowards, Erdogan's justified appearance was formed so that Erdogan could collect votes."
 Turkey.536.a:0 "Interesting"
 Turkey.537.title:0 "Bad Situation In The Istanbul Stock Exchange"
 Turkey.537.desc:0 "The Istanbul Stock Exchange BIST remained in high tensions due to the elections. The stock market suffered high losses, and as a result, Kemal Kılıçdaroğlu blamed the Ak Party for the state of the stock market. Fragility has occurred with economic balances."
 Turkey.537.a:0 "What A Failure"
 Turkey.538.title:0 "Kaz Mountains Get Destroyed"
 Turkey.538.desc:0 "Kaz Mountains forests were destroyed in order to find gold. The resulting images also disturbed climate lovers and ecologists. The institutions that caused this were also strongly condemned, by foundations and institutions."
 Turkey.538.a:0 "Dramatic Times"
 Turkey.539.title:0 "Muharrem Ince Quits Race"
 Turkey.539.desc:0 "The Turkish presidential candidate Muharrem İnce withdrew from the race after the release of a purported sex tape, boosting chances of outright success for other candidates in a race that polls suggest will be close.\n\nİnce, a two-time presidential candidate who also lost to Recep Tayyip Erdoğan in 2018, pulled his candidacy just days away from Turkey’s most consequential election in a generation saying: “I offered Turkey a third option, a third way. We couldn’t succeed this way.”\n\nThe former school headteacher and longtime member of the Republican People’s Party (CHP) said an alleged sex tape circulating online was a deep fake, using footage taken from “an Israeli porn site”."
 Turkey.539.a:0 "It's It"
 Turkey.540.title:0 "New Maiden Tower"
 Turkey.540.desc:0 "The tower was reopened after a major two-year restoration under a Culture and Tourism Ministry project. The materials used in the effort were faithful to the tower's state during the reign of Ottoman Sultan Mahmud II (1808-1839), while later additions to the structure were removed.\n\nThe renovation of the tower was carried out in accordance with international restoration principles by Feridun Cili of Istanbul Technical University, antiquities scholar Zeynep Ahunbay, and architect Han Tumertekin, under the supervision of a scientific committee."
 Turkey.540.a:0 "Interesting"
 Turkey.541.title:0 "Kerem Kinik Forced To Resign"
 Turkey.541.desc:0 "After the Kahramanmaraş-based earthquakes, while the earthquake victims in the region should have provided their tent needs ‘free of charge’, Red Crescent President Kerem Kınık, who was criticized after the news that he sold the tents in his warehouse to the AHBAP Association and the Turkish Pharmacists Association in the first week of the earthquake, resigned from the Turkish Red Crescent General Presidency."
 Turkey.541.a:0 "Good To Get Rid Of Him"
 Turkey.542.title:0 "Death Of Kemal Dervis"
 Turkey.542.desc:0 "Kemal Dervis, an economist who was instrumental in leading his native Turkey out of economic crisis early in this century, and who later became the first person to lead the United Nations Development Program from a country that had received developmental aid from the program, died on Sunday in Bethesda, Md. He was 74."
 Turkey.542.a:0 "Rest In Peace"
 Turkey.543.title:0 "The Nebatieconomics"
 Turkey.543.desc:0 "Nebati, the Head of the Economy of the Republic of Turkey, is someone who tries to change the issues by interpreting the increase in the dollar and monetary losses in a funny way. This situation has been met with anger by the public, and it has become accepted by everyone that the recent high inflation and crushing of the Turkish economy under the dollar have put the country in extremely bad places."
 Turkey.543.a:0 "The History Of Failure"
 Turkey.544.title:0 "Umit Ozdag Comes Along With Mines"
 Turkey.544.desc:0 "Zafer Party Chairman Umit Özdağ, who came to Hatay and made a series of meetings and visits, wanted to leave a symbolic mine in a field in Reyhanlı district. The gendarmerie did not allow the symbolic mine action, which Özdağ stated was an auto spare part, to take place."
 Turkey.544.a:0 "Very Weird"
 Turkey.545.title:0 "The Shipping Controversy"
 Turkey.545.desc:0 "Answering questions about the agenda in the “Election 2007” program broadcast on NTV, Erdogan said that the fact that his son took a ship was raised by the media. ”There is a ship, there is a boat," Erdogan said, saying:\n\n"There is also a zero for this, there is an old one. Pay paid by yourself If you take off, buy a ship that is 15-16-17 years old, and the small ship is also a small ship, and the payment conditions are also fine, if it is in a position to pay itself, why shouldn't it be bought? He can buy a ship with a down payment of 300, 400, 500 thousand dollars, and then if this ship can pay its installments by itself, you can do it.""
 Turkey.545.a:0 "Interesting"
 Turkey.546.title:0 "Ending Of The 2023 Election Campaign"
 Turkey.546.desc:0 "While Kılıçdaroğlu ended his election campaign by going to Anıtkabir, Erdoğan decided to end his election campaign by going to Hagia Sophia. This situation is beginning to reflect that the election is in the form of a referendum. The people will make their own decision."
 Turkey.546.a:0 "It Finishes"
 Turkey.547.title:0 "United States Recognizes Armenian Genocide"
 Turkey.547.desc:0 "The United States recognizes the Armenian genocide through two congressional resolutions passed by both houses of the United States Congress, and by presidential announcement. The House of Representatives passed a resolution with broad support on October 29, 2019, and the Senate did the same by unanimous consent on December 12, 2019, making the recognition of the Armenian genocide part of the policy of the United States."
 Turkey.547.a:0 "Ough"
 Turkey.548.title:0 "HDP And TIP Creates New Alliance"
 Turkey.548.desc:0 "The Peoples' Democratic Party (HDP), the Workers' Party of Turkey (TIP), the Labor Party (EMEP), the Social Freedom Party (TÖP), the Labor Movement Party (EHP) and the Federation of Socialist Assemblies (SMF) have announced the establishment of the Labor and Freedom Alliance."
 Turkey.548.a:0 "Whatever"
 Turkey.549.title:0 "Sinan Ogan Signals Bargains Support For Sides"
 Turkey.549.desc:0 "Presidential candidate Sinan Ogan said that if the election goes to the second round, they will sit down at the bargaining table with the candidates who remain in the second round. After these words were reacted by the opposition, Ogan said, "Since you have taken my speeches out of context the day before the elections and made unfair accusations and attacks on us, I think you will not need the support of our voter base in the second round of the elections. 2. will it be very valuable on the tour, Sinan Ogan, won't you have to convince the voter base?" said."
 Turkey.549.a:0 "He Attacked His Votes?"
 Turkey.550.title:0 "The Great 2023 Elections"
 Turkey.550.desc:0 "The previous Turkish general election took place in 2018. The election marked the country's transition from a parliamentary system to a presidential one, as narrowly endorsed by voters in the 2017 constitutional referendum. That election resulted in a victory for incumbent president Recep Tayyip Erdoğan, who had held the position since 2014. Meanwhile, the ruling Justice and Development Party (AK Party) lost its absolute majority in the Grand National Assembly of Turkey for the first time since June 2015, forcing it to rely on its coalition partner, the Nationalist Movement Party (MHP) of Devlet Bahçeli, to pass legislation. The office of the Prime Minister of Turkey was abolished on 12 July 2018, and its last holder, Binali Yıldırım, took office as the Speaker of the Grand National Assembly.\n\nAlthough there were speculations about a snap election prior to the regular one in 2023, Bahçeli ruled them out. In a written statement, he said that elections would not be held before 2023. He also confirmed that the current coalition between AK Party and MHP will remain intact and Erdoğan will be their joint nominee for President. On 9 June 2022, Erdoğan declared his candidacy. On 22 January 2023, Erdoğan announced he would initiate snap elections on 10 March which would bring the election date forward from 18 June to 14 May. However, the impact of the devastating Turkey–Syria earthquake on voter's opinions are not yet known. Muharrem İnce announced he is withdrawing his candidacy on May 11."
 Turkey.550.a:0 "Danger Ahead!"
 Turkey.550.b:0 "Its Time For Second Tour?"
 Turkey.551.title:0 "Babala TV's Kemal Kilicdaroglu Partner"
 Turkey.551.desc:0 "Babala TV owner Oguzhan Uğur, yesterday the Nation Alliance presidential candidate Kemal Kılıçdaroğlu made the shots for the Open Mic broadcast of the issues. Everyone struggled to watch the broadcast on social media yesterday for the Babala TV Open Mic Kemal Kılıçdaroğlu broadcast. Yesterday, the filming of the Babala TV Open Mic Kemal Kılıçdaroğlu broadcast was held, but the footage was not broadcast live."
 Turkey.551.a:0 "Interesting"
 Turkey.552.title:0 "Sinan Ogan Declares Support To Erdogan"
 Turkey.552.desc:0 "In the first round of the presidential elections on May 14, Sinan Ogan, the presidential candidate of the ATA Alliance, received 5.17 percent of the vote. Ogan, who held a press conference in Ankara today (May 22), announced that he will support the candidate of the People's Alliance, AKP Chairman and President Recep Tayyip Erdogan.\n\nOgan, who said that they had met with both the People's Alliance and the Nation's Alliance, said, “In the May 14 elections, the Turkish voter seriously warned both the People's Alliance and the Nation's Alliance for not showing the necessary approach to the sensitivities of the Turkish nation. The voter has also given us the task of defending these sensitivities of the Turkish nation through the executive power,” he said."
 Turkey.552.a:0 "Collapse Of ATA Alliance"
 Turkey.553.title:0 "Umit Ozdag Declares Support To Kilicdaroglu"
 Turkey.553.desc:0 "Nation Alliance's presidential candidate, CHP leader Kemal Kılıçdaroğlu and Ümit Özdağ met at the Victory Party Headquarters and announced that they had decided to support Kılıçdaroğlu in the second round. Özdağ told all voters, "Dear citizens, if you want to transfer the Turkey you took from your parents to your children, if you don't want Turkey to become 'immigrant', if you don't want to worry when your daughter goes out on the street if you want to send your son safely to the grocery store on the corner at 21.30 in the evening, support the policy that will send 13 million asylum seekers to their homeland on May 28 and vote for Kemal KILIÇDAROĞLU. This is the only way for Turkey not to become an 'immigrant'," he called."
 Turkey.553.a:0 "Rise Of Factionalization"
 Turkey.554.title:0 "Muharrem Ince Declares Its Neutrality"
 Turkey.554.desc:0 "Three days before the second round of the presidential elections to be held on May 28, Hometown Party Chairman Muharrem Ince, who withdrew from the candidacy in the first round, met with his party's officials.\n\nInce, who denied the claim that he would support the Nation Alliance's presidential candidate Kemal Kılıçdaroğlu on May 28 by sharing from his hospital bed, held a meeting with the 22-person Central Board of Directors of his party in the afternoon.\n\nAccording to the information obtained, at the meeting where the views of supporting Kılıçdaroğlu and remaining neutral were discussed, it was learned that many provincial presidents requested to support Kılıçdaroğlu. Ince had not pointed out any names following his withdrawal from the nomination. The party decided to continue with this attitude in the second round. It was stated that no announcement will be made regarding the decision."
 Turkey.554.a:0 "Whatever"
 Turkey.555.title:0 "Run-Off Of The Great 2023 Elections"
 Turkey.555.desc:0 "The presidential vote will decide not only who leads Turkey but also whether it reverts to a more secular, democratic path, how it will handle its severe cost of living crisis, and manage key relations with Russia, the Middle East and the West.\n\nKilicdaroglu, who said he would prevail in the runoff, urged his supporters to be patient and accused Erdogan's party of interfering with the counting and reporting of results."
 Turkey.555.a:0 "It's Risky!"
 Turkey.556.title:0 "Chaotic 13th Republican People's Party Extraordinary Convention"
 Turkey.556.desc:0 "The 13th Extraordinary Convention of the Republican People's Party was held on 29 and 30 January 2005 to elect a leader for the Republican People's Party (CHP), a Turkish center-left political party. Incumbent leader Deniz Baykal was challenged by the Mayor of Şişli, Mustafa Sarıgül for leadership. The convention was marred by violence between supporters of the two rivals, who had accused each other of corruption and elitism during their speeches."
 Turkey.556.a:0 "CHP's Problems"
 Turkey.557.title:0 "Chaotic 13th Republican People's Party Extraordinary Convention"
 Turkey.557.desc:0 "The 13th Extraordinary Convention of the Republican People's Party was held on 29 and 30 January 2005 to elect a leader for the Republican People's Party (CHP), a Turkish center-left political party. Incumbent leader Deniz Baykal was challenged by the Mayor of Şişli, Mustafa Sarıgül for leadership. The convention was marred by violence between supporters of the two rivals, who had accused each other of corruption and elitism during their speeches."
 Turkey.557.a:0 "Long Live Deniz Baykal"
 Turkey.557.b:0 "Long Live Mustafa Sarıgül"
 Turkey.558.title:0 "Erdogan's Third Term"
 Turkey.558.desc:0 "Recep Tayyip Erdogan has taken his oath to be sworn in as Turkey's president for an unprecedented third time. Mr. Erdogan won another five-year term after a run-off with opposition candidate Kemal Kilicdaroglu last week. Neither candidate had failed to reach the 50% threshold on 14 May, but the second round two weeks later saw Mr Erdogan secure 52.1%. The 69-year-old was sworn in at the Turkish parliament in Ankara on Saturday ahead of a separate inauguration ceremony at the mausoleum - the founder of modern Turkey, attended by foreign dignitaries. This makes him the longest-serving leader in Turkey's history - having served as prime minister for his AK party since 2002.\n\nHe will announce his new cabinet later this weekend."
 Turkey.558.a:0 "Bye Bye Kemal!"
 Turkey.559.title:0 "Erdogan Reliberalizes His Policies"
 Turkey.559.desc:0 "President Tayyip Erdogan signaled on Saturday his newly-elected government would return to more orthodox economic policies when he named Mehmet Simsek to his cabinet to tackle Turkey's cost-of-living crisis and other strains.\n\nSimsek's appointment as treasury and finance minister could set the stage for interest rate hikes in coming months, analysts said - a marked turnaround from Erdogan's longstanding policy of slashing rates despite soaring inflation."
 Turkey.559.a:0 "A U-Turn From Erdogan?"
 Turkey.560.title:0 "MKE Explosions"
 Turkey.560.desc:0 "At least five workers have been killed in a blast that rocked an explosives factory in the Turkish capital, Ankara, the defense ministry said in a statement on Saturday. The blast occurred at the MAKE Rockets and Explosives Factory some 40km (25 miles) outside Ankara.“There was an explosion in the dynamite department of the factory as a result of a chemical experiment, according to technical staff,” Vahap Sahin, the governor of the Ankara province, told reporters.\n\n“Unfortunately five workers have died, our condolences go to their families,” Sahin said. Turkey’s defense ministry also confirmed the death toll in a separate statement.“There were five other workers under the rubble, but we managed to rescue them.”\n\nWounded employees of the factory have been taken to hospitals, according to state media, which said that an investigation has been launched into the incident."
 Turkey.560.a:0 "It's Bad"
 Turkey.561.title:0 "Opposition Questions Itself"
 Turkey.561.desc:0 "The Republican People's Party lost the Presidential election under the leadership of Kemal Kılıçdaroğlu. Besides the election, the party experienced small decreases in its vote share and a serious loss of deputies. As a result of these serious losses, the CHP under the leadership of Kemal Kılıçdaroğlu became complete chaos. While the party members want Kemal Kılıçdaroğlu's resignation, Kemal Kılıçdaroğlu is trying to stand at the head of the CHP through the delegates.\n\nEkrem Imamoğlu, Mayor of Bolu Tanju, and Özgür Özel, who won the Istanbul Mayor's Office against Kemal Kılıçdaroğlu, who tried to stay in the party, came out. Mustafa Sarigul, who has recently become famous for being the deputy of Erzincan, is also likely to rise against Kemal Kılıçdaroğlu..\ It is clear from this that the next ordinary congress of the Republican People's Party will be quite violent."
 Turkey.561.a:0 "Ah CHP Classics!"
 Turkey.562.title:0 "TDP Joins The CHP"
 Turkey.562.desc:0 "TDP Chairman Mustafa Sarigul, CHP Erzincan Deputy Mustafa Sarigul, announced that his party had joined the CHP with a statement. Sarigul said, "As the TDP, we will make a historic decision, we will be on the right side of history. The merger studies of TDP and CHP have started as of today," he said."
 Turkey.562.a:0 "Whatever"
 Turkey.563.title:0 "Ecological Troubles"
 Turkey.563.desc:0 "Turkey has recently been in industrialization, industrialization has started to increase the carbon level in the country, which has brought ecologically minded people into the world. We need to take care of them and prevent problems that may occur."
 Turkey.563.a:0 "Expectedly"
 Turkey.564.title:0 "The Turkish Brain Drain"
 Turkey.564.desc:0 "The influx of Syrians to our country, the increasing Islamization of Turkey, and the move away from secularism have made the intellectuals in the country inclined to leave the country quickly. We must prevent this, if we do not, we will face unqualified labor force problems and productivity loss will occur."
 Turkey.564.a:0 "We Need To Get Over This"
 Turkey.566.title:0 "The Turkish Wealth Fund"
 Turkey.566.desc:0 "After the 2017 Turkish constitutional referendum, the Prime Ministry of Turkey was abolished. Following this change, TWF law is changed to allow the President of Turkey to become the chairman of TWF and appointment of CEO, Vice Chairman, and board members by the President."
 Turkey.566.a:0 "Another Good Institution"

 Turkey.567.title:0 "September 2001 Istanbul bombing"
 Turkey.567.desc:0 "On 10 September 2001, a suicide attack was carried out by Revolutionary People's Liberation Party/Front member Uğur Bülbül in Beyoğlu, Istanbul, at a police checkpoint in the Gümüşsuyu neighborhood. As a result of the explosion, two police officers and one passerby civilian along with the attacker were killed and 23 others were injured."
 Turkey.567.a:0 "Aman Tanrım"
 Turkey.568.title:0 "January 2001 Istanbul bombing"
 Turkey.568.desc:0 "On 3 January 2001, a suicide attack was carried out by Revolutionary People's Liberation Party/Front member Gültekin Koç in Şişli, Istanbul, at a police station. As a result of the explosion, one civilian along with the perpetrator was killed and 7 others were injured, 2 being critically."
 Turkey.568.a:0 "Aman Tanrım"
 Turkey.569.title:0 "2003 Attack on the Grand Lodge of Free and Accepted Freemasons"
 Turkey.569.desc:0 "On March 9, 2003, a suicide attack was carried out when two attackers entered the building of the Grand Lodge of Free and Accepted Freemasons in the Kartal district of Istanbul and detonated explosives on it after wounding a security guard. While Vural survived the attack, which was determined to have been carried out by Engin Vural and Nihat Dogruel, members of the Turkish structure of Al-Qaeda, Vural was injured, all of the deceased and injured were civilians. Istanbul 9. As a result of the case heard at the High Criminal Court, 4 defendants were sentenced to life imprisonment."
 Turkey.569.a:0 "Aman Tanrım"
 Turkey.570.title:0 "2006 Van Bombing"
 Turkey.570.desc:0 "The 2006 Van attack was a suicide attack carried out on March 9, 2006 in the Turkish city of Van, when Devrim Solduk, a member of the PKK, who approached a traffic vehicle belonging to the Municipality of Van, detonated explosives on it. As a result of the explosion, in addition to the attacker, two people were killed, and 19 people survived the attack with injuries."
 Turkey.570.a:0 "Aman Tanrım"
 Turkey.571.title:0 "2007 Ankara Bombing"
 Turkey.571.desc:0 "The 2007 Ankara bombing was a suicide attack that occurred in Ankara, the capital of Turkey, on 22 May 2007. Six people were reported killed, including one of Pakistani origin, and 121 people were wounded. A seventh person died from his injuries on 7 June and another on 17 June raising the death toll to eight. A ninth person died on 4 July from his injuries."
 Turkey.571.a:0 "Aman Tanrım"
 Turkey.572.title:0 "2011 Bingol Bombing"
 Turkey.572.desc:0 "The 2011 Bingöl attack was a suicide bombing carried out on October 29, 2011, in the center of the same name in the Bingöl province of Turkey. 4 people, including the attacker, were killed and 20 people were injured in the attack carried out by PKK member Nazlı Görer."
 Turkey.572.a:0 "Aman Tanrım"
 Turkey.573.title:0 "2012 Kayseri Bombing"
 Turkey.573.desc:0 "The 2012 Pınarbaşı attack is an attack carried out on May 25, 2012 on the Pınarbaşı Police Department in the Pınarbaşı district of Kayseri province of Turkey, first as an armed attack and then as a suicide attack. In addition to the two attackers, 4 people were killed in the attack carried out by PKK members, one of whom was a policeman and one was a civilian."
 Turkey.573.a:0 "Aman Tanrım"
 Turkey.574.title:0 "2012 Istanbul Suicide Bombing"
 Turkey.574.desc:0 "The 2012 Istanbul suicide bombing occurred at a police station in the Sultangazi district of Istanbul, Turkey. The suicide bomber was İbrahim Çuhadar, a member of the Revolutionary People's Liberation Party/Front (DHKP-C). On 11 September 2012, he went to the police station and attempted to enter, then detonated the explosives at the entrance of the station after the police refused him entrance. As a result of the explosion, the attacker and a police officer died and seven others were injured."
 Turkey.574.a:0 "Aman Tanrım"
 Turkey.575.title:0 "2015 Istanbul suicide bombing"
 Turkey.575.desc:0 "On 6 January 2015, Diana Ramazova from Dagestan detonated a bomb vest at a police station in Istanbul's central Sultanahmet district, near the Blue Mosque and Hagia Sophia. The attack killed Ramazova and injured two police officers, one of whom later succumbed to his wounds. Ramazova was the pregnant widow of a Norwegian-Chechen ISIS fighter in Syria who had been killed in December 2014."
 Turkey.575.a:0 "Aman Tanrım"
 Turkey.576.title:0 "Suruç bombing"
 Turkey.576.desc:0 "The Suruç bombing was a suicide attack[4] by the Turkish sect of Islamic State named Dokumacılar against Turkish leftists that took place in the Suruç district of Şanlıurfa Province in Turkey on 20 July 2015, outside the Amara Culture Centre. A total of 34 people were killed (including the perpetrator)[6] and 104 were reported injured. Most victims were members of the Socialist Party of the Oppressed (ESP) Youth Wing and the Socialist Youth Associations Federation (SGDF), university students who were giving a press statement on their planned trip to reconstruct the Syrian border town of Kobanî."
 Turkey.576.a:0 "Aman Tanrım"
 Turkey.577.title:0 "December 2016 Istanbul bombings"
 Turkey.577.desc:0 "On the evening of 10 December 2016, two explosions caused by a car bombing and suicide bombing in Istanbul's Beşiktaş municipality killed 48 people and injured 166 others. 39 of those killed were police officers, 7 were civilians and 2 were perpetrators. The Kurdistan Freedom Hawks (TAK) assumed responsibility, claiming that their members killed more than 100 police officers."
 Turkey.577.a:0 "Aman Tanrım"
 Turkey.578.title:0 "2016 Bursa bombing"
 Turkey.578.desc:0 "On 27 April 2016, a suicide bombing took place in the Turkish city of Bursa. The bombing took place at 17:26 (UTC+3), near the western entrance of the Grand Mosque and a covered market. One person, the suicide bomber, was killed and 13 people were injured. The injured people received only light injuries. Extensive damage to nearby shops and cafes was reported."
 Turkey.578.a:0 "Aman Tanrım"
 Turkey.579.title:0 "2016 Cizre bombing"
 Turkey.579.desc:0 "The 2016 Cizre bombing was a suicide bombing by PKK member Mustafa Aslan in Cizre, Turkey. The assailant used a car bomb to attack a police checkpoint outside the police headquarters. Twelve police officers and Aslan were killed in addition to 75 police officers and three civilians injured."
 Turkey.579.a:0 "Aman Tanrım"
 Turkey.580.title:0 "2016 Elazığ bombing"
 Turkey.580.desc:0 "The 2016 Elazığ bombing was a car bombing targeting a police station in Elazığ, Turkey on 18 August 2016 a Thursday. Attack was perpetrated by Kurdistan Workers' Party (PKK). Six people including one perpetrator died in the attack and 217 others were injured. Two people were arrested related to the attack."
 Turkey.580.a:0 "Aman Tanrım"
 Turkey.581.title:0 "2016 Şemdinli bombing"
 Turkey.581.desc:0 "The 2016 Şemdinli bombing was a car bomb attack on Turkish military base carried out by the PKK's armed wing HPG in Turkey which occurred on 9 October 2016. According to the Turkish authorities, a car bomb killed at least 18 people including 10 soldiers and 8 civilians. Also, another 27 people were wounded according to initial reports. The PKK's armed wing HPG claimed the attack and claimed to have killed more than 32 soldiers."
 Turkey.581.a:0 "Aman Tanrım"
 Turkey.582.title:0 "August 2016 Gaziantep bombing"
 Turkey.582.desc:0 "On 20 August 2016, a suicide bomber targeted a wedding party in Gaziantep, Turkey, at 10:50pm local time. More than 200 people were present at the party. The attack targeted a Kurdish family who had fled the Kurdish town of Siirt due to Turkish-PKK violence, and occurred during the traditional henna night party according to witnesses. The groom was injured in the attack, but the bride escaped unharmed. The groom's injuries were described as non-life-threatening. A witness reported that two suspicious individuals had approached the party and left the scene following the attack. The security forces have been looking for these two suspects. The Kurdish Peoples Democratic Party (HDP) announced that the attack had been carried out against a wedding of their party members."
 Turkey.582.a:0 "Aman Tanrım"
 Turkey.583.title:0 "2015 Ankara Bombings"
 Turkey.583.desc:0 "On 10 October 2015 at 10:04 local time (EEST) in Ankara, the capital city of Turkey, two bombs were detonated outside Ankara Central railway station. With a death toll of 109 civilians, the attack surpassed the 2013 Reyhanlı bombings as the deadliest terror attack in Turkish history. Another 500 people were injured. Censorship monitoring group Turkey Blocks identified nationwide slowing of social media services in the aftermath of the blasts, described by rights group Human Rights Watch as an "extrajudicial" measure to restrict independent media coverage of the incident."
 Turkey.583.a:0 "Aman Tanrım"
 Turkey.584.title:0 "2016 Bursa bombing"
 Turkey.584.desc:0 "On 27 April 2016, a suicide bombing took place in the Turkish city of Bursa. The bombing took place at 17:26 (UTC+3), near the western entrance of the Grand Mosque and a covered market. One person, the suicide bomber, was killed and 13 people were injured. The injured people received only light injuries. Extensive damage to nearby shops and cafes was reported."
 Turkey.584.a:0 "Aman Tanrım"
 Turkey.585.title:0 "2016 Gaziantep Bombings"
 Turkey.585.desc:0 "The October 2016 Gaziantep attacks were suicide bombings carried out on October 16, 2016, when attackers detonated explosives on two separate houses in the Şehitkamil and Şahinbey districts of the Gaziantep province of Turkey, which were found to be used by Islamic State of Iraq and Damascus militants, during a raid by security units. As a result of the explosions, in addition to the attackers, 3 policemen were killed and 13 people, 4 of them Syrians, were injured."
 Turkey.585.a:0 "Aman Tanrım"
 Turkey.586.title:0 "November 2016 Diyarbakır Bombing"
 Turkey.586.desc:0 "The November 2016 Diyarbakır bombing was an explosion near a police building in Bağlar, Diyarbakır in Turkey, on 4 November. The bomb killed at least 11 people, including two policemen. Both the Islamic State of Iraq and the Levant and the Kurdistan Freedom Hawks claimed responsibility for the bombing."
 Turkey.586.a:0 "Aman Tanrım"
 Turkey.587.title:0 "2016 Kayseri Bombing"
 Turkey.587.desc:0 "On December 17, 2016, a suspected car bombing in Kayseri, Turkey killed 15 soldiers aboard a bus and wounded at least 55 others. According to the Daily Sabah newspaper, the soldiers — all low-ranking privates and non-commissioned officers — had been given permission for leave from the commando headquarters in the city. The explosion comes a week after 44 people were killed in a double bombing in Istanbul after a football match."
 Turkey.587.a:0 "Aman Tanrım"
 Turkey.588.title:0 "March 2016 Ankara bombing"
 Turkey.588.desc:0 "The March 2016 Ankara bombing killed at least 37 people and injured 125. Of the 125 individuals who suffered injuries, 19 of them were seriously harmed. Several buildings were also damaged during the event, and a bus and many cars were reportedly completely destroyed."
 Turkey.588.a:0 "Aman Tanrım"
 Turkey.589.title:0 "March 2016 Istanbul bombing"
 Turkey.589.desc:0 "On 19 March 2016, a suicide bombing took place in Istanbul's Beyoğlu district in front of the district governor's office. The attack occurred at 10:55 (EET) at the intersection of Balo Street with İstiklal Avenue, a central shopping street. The attack caused at least five deaths, including that of the perpetrator. Thirty-six people were injured, including seven whose injuries were severe. Among those injured were twelve foreign tourists. Among those killed, two were of dual Israel-US nationality. On 22 March, the Turkish interior minister said that the bomber had links with ISIL."
 Turkey.589.a:0 "Aman Tanrım"
 Turkey.590.title:0 "January 2016 Istanbul bombing"
 Turkey.590.desc:0 "On 12 January 2016, a suicide attack in Istanbul's historic Sultanahmet district killed 13 people, all foreigners, and injured 14 others. The attack occurred at 10:20 local time, near the Blue Mosque and the Hagia Sophia, an area popular among tourists."
 Turkey.590.a:0 "Aman Tanrım"
 Turkey.591.title:0 "June 2016 Istanbul bombing"
 Turkey.591.desc:0 "On 7 June 2016, at around 08:40 (UTC+3), a bombing occurred in central Istanbul, Turkey, killing 12 people and injuring 51 others, three of them seriously. The attack targeted a bus carrying policemen as the vehicle passed through the Vezneciler district near the Şehzade Mosque and the Vezneciler Metro station."
 Turkey.591.a:0 "Aman Tanrım"
 Turkey.592.title:0 "Rocket Attacks To Igdir"
 Turkey.592.desc:0 "PKK members opened fire with long-barreled weapons at the Martyr Bulent Aydın Police Station located in the December district of Iğdır, on the Iranian border, in the morning. 1 Soldier was martyred and 2 soldiers were injured in the attack."
 Turkey.592.a:0 "Aman Tanrım"
 Turkey.593.title:0 "May 2016 Dürümlü bombing"
 Turkey.593.desc:0 "The May 2016 Dürümlü bombing (also known as Dürümlü massacre in Turkey[1][2]) was a truck bombing that took place in Dürümlü hamlet in Diyarbakir's Sur district, Turkey on 12 May 2016 at approximately 22:30 local time. As a result of the attack 16 villagers were killed and 23 villagers were wounded."
 Turkey.593.a:0 "Aman Tanrım"
 Turkey.594.title:0 "August 2016 Gaziantep Bombing"
 Turkey.594.desc:0 "On 20 August 2016, a suicide bomber targeted a Kurdish wedding in Gaziantep, Turkey. 57 people were killed and 66 injured in the attack, 14 critically."
 Turkey.594.a:0 "Aman Tanrım"
 Turkey.595.title:0 "Mardin Mityat Bombing"
 Turkey.595.desc:0 "The pain of the attack carried out by PKK terrorists on the Midyat Police Department with a car bomb 5 years ago, in which 3 policemen, one of whom was pregnant, were martyred, 3 people lost their lives and 50 people were injured, has not stopped."
 Turkey.595.a:0 "Aman Tanrım"
 Turkey.596.title:0 "2013 Reyhanlı Car Bombings"
 Turkey.596.desc:0 "The 2013 Reyhanlı car bombings took place on 11 May 2013, when two car bombs exploded in the Turkish town of Reyhanlı, a town of 64,000 people, 5 km from the Syrian border and the busiest land border post with Syria, in Hatay Province, Turkey. At least 52 people were killed and 140 injured in the attack."
 Turkey.596.a:0 "Aman Tanrım"

 Turkey.597.title:0 "Kurecik Radar Base?"
 Turkey.597.desc:0 "The United States Senate has issued a surprising statement questioning the investment of the Kurecik Radar Base in Turkey. The statement, delivered by a senior government official, raised concerns about the long-term viability and strategic significance of the radar base in light of evolving geopolitical dynamics and technological advancements."
 Turkey.597.a:0 "Push Investments"
 Turkey.597.b:0 "We Can't Afford It"
 Turkey.598.title:0 "United States Launchs Kurecik Radar Base"
 Turkey.598.desc:0 "In an unexpected turn of events, the United States and Turkey jointly announced the official inauguration of the "Kurecik Global Aerospace Research Center" in the Kurecik region of Turkey. The center marks a significant milestone in the two nations' collaboration on space exploration and advanced radar technologies."
 Turkey.598.a:0 "Thank You Sir!"
 Turkey.599.title:0 "United States Launchs Kurecik Radar Base"
 Turkey.599.desc:0 "The United States has announced that it will invest militarily in Kurecik, which is located near our border. This situation has endured to the limit of the guard of the Jews. We have to get out of the situation."
 Turkey.599.a:0 "Turks Are Working With The Jews!"
 Turkey.600.title:0 "Zarrab Event"
 Turkey.600.desc:0 "It is alleged that Zarrab, along with two Iranian citizens, made millions of dollars of financial transactions on behalf of the Iranian state and some companies in order to illegally bypass US sanctions."
 Turkey.600.a:0 "Agh!"
 Turkey.601.title:0 "?Zınısım Adnıkraf Ninekilhet"
 Turkey.601.desc:0 "Cumhuriyet newspaper has added a new abstract to the "zinisim adnikraf ninekilheT" campaign, which it launched months ago. The newspaper hinted that the candidate who will appear in Çankaya will be from the AKP and said, "The clocks are being set back 100 years on May 16. Do you realize the danger?" he asked. And what is your opinion on this issue? Is the Republic really in danger? Will an AKP member's appearance in Çankaya take Turkey back? Is it normal for a press organ to participate in the Çankaya discussions as a party? Even if what the Republic says is accepted as true, is the method correct?"
 Turkey.601.a:0 "?Zınısım Adnıkraf Ninekilhet"
 Turkey.602.title:0 "Demirtas Gets Arrested"
 Turkey.602.a:0 "Good For The Government"
 Turkey.602.desc:0 "At the Newroz celebration of 2013 during the peace process between the PKK and Turkey, Selahattin Demirtaş and HDP MP Sırrı Süreyya Önder both held a speech. While Demirtaş was absent in the hearing of April 2018, Önder defended himself that the police has mistranslated his speech. For their speeches Demirtaş was sentenced to 4 years and 8 months for having praised the Abdullah Öcalan, the imprisoned leader of the PKK, while Önder was sentenced to 3 years and 6 months in the same trial in September 2018."
 Turkey.603.title:0 "Demirtas Attacks Erdogan"
 Turkey.603.desc:0 "Co-Chairman Selahattin Demirtaş organized the shortest group meeting in history. Demirtaş started his speech by greeting the people in the hall and underlined that the group meeting had become more meaningful with the flowers brought from all over Turkey. Emphasizing that they will meet with Black Sea organizations at the HDP Headquarters, Demirtaş said, "I came out to the Decider today to say a single sentence. I came out to repeat our promise that we will not give up the struggle for democracy, peace and freedom that we have given to our peoples. We are not a bargaining movement. There has never and never been a dirty cooperation and negotiation between us and the AKP, there will never be,"he Decried.\n\nDemirtaş continued his speech by stating that there are a lot of topics that they will discuss at the group meetings and said: "But let me say one sentence that is my reason for taking the stand. Dear Recep Tayyip Erdogan, as long as there is an HDP, you will not be President as long as the HDP people breathe in this land. Dear Recep Tayyip Erdogan, we will not make you president, we will not make you president, we will not make you president."
 Turkey.603.a:0 "How Dare Are They!"
 Turkey.604.title:0 "Iran-Turkey Natural Gas Arbitration"
 Turkey.604.desc:0 "It was stated that Turkey won the arbitration case it opened in 2012 regarding the price of natural gas purchased from Iran. Officials of the Ministry of Energy and Natural Resources said, "The court has decided in favor of Turkey, the arbitration board will determine the ratio issue." Trend News Agency from Azerbaijan reported that "Iranian Deputy Oil Minister Hamit Reza Aragi stated that Turkey won the arbitration case that it went to by objecting to natural gas prices from Iran." According to the news, Aragi said that the International Court of Arbitration found the plaintiff Turkey justified against Iran. After the decision, it is expected that a 10-15 percent discount will be applied to the price of natural gas that Turkey bought from Iran in 2011-2015."
 Turkey.604.a:0 "How Dare Are They!"
 Turkey.605.title:0 "10th Year Of Turkish Olympics"
 Turkey.605.desc:0 "10. Turkish Turkish June May 30 - June 14, 2012 International Turkish Olympic Games were held in Turkey between the dates of. the International Turkish Olympic Games. the International Turkish Olympic Games. the International Turkish Olympic Games. A total of 1500 competitors from 135 countries participated in the Olympics organized by the International Turkish Association (TÜRKÇEDER) and consisting of a total of 20 competitions in 3 categories."
 Turkey.605.a:0 "Good Ceremony"
 Turkey.606.title:0 "March for Change and Justice"
 Turkey.606.desc:0 "Özcan and his supporters started their march from Anitpark in Bolu on July 3, 2023. He also stated that he started the march after he wanted to put his party on the Atatürk line. Özcan, who walked 24 kilometers on the first day, was joined by his wife and cousin, as well as his supporters. Özcan spent the night in a caravan in the Tekkeköy area.\n\NY arrived in the district of Yeniçağa on the second day of the journey. Özcan spent the night in his caravan in the Yeniçağa district of Bolu and started walking again at 8 o'clock on the third day. Özcan, who left the Gerede district behind on the third day of his walk, completed the third day of his walk in the village of Süller and walked a total of 68 kilometers. Özcan reached the Ankara provincial border on the fourth day of his walk.\n\ny Özcan, on the fifth day of his visit, they wouldn't let us into the headquarters on July 12th. Who are you not replacing in whose place as president? I'm not coming to your house. If I came to your house, you might not let me in. I'm going to Ataturk's house, I'm going to our house. Is that your father's farm? he reacted to Kemal Kılıçdaroğlu by saying."
 Turkey.606.a:0 "CHP's Problems"
 Turkey.607.title:0 "Assassination of Andrei Karlov"
 Turkey.607.desc:0 "Andrei Karlov, the Russian Ambassador to Turkey, was assassinated by Mevlüt Mert Altıntaş, an off-duty Turkish police officer, at an art exhibition in Ankara, Turkey on the evening of 19 December 2016. The assassination took place after several days of protests in Turkey over Russian involvement in the Syrian Civil War and the battle over Aleppo."
 Turkey.607.a:0 "Such Tensions With Russia"
 Turkey.608.title:0 "Tensions In US"
 Turkey.608.desc:0 "A group protesting against President Recep Tayyip Erdogan in front of the Turkish Embassy Residence in Washington and Erdogan's bodyguards got into a fight. The American police were able to break up the fight with difficulty. The events started before President Recep Tayyip Erdogan arrived at the residence, and they flared up even more with Erdogan's arrival.Before the arrival of the mayor, a group gathered on the opposite sidewalk of the residence and carrying a banner “Freedom for Demirtaş” began shouting slogans against Erdogan. On top of this, a verbal duel took place between the group of protesters who were in front of the residence with Turkish flags in their hands. Dec. After a while, the verbal duel turned into a fight. Those in Erdogan's protection team were also involved in the fight."
 Turkey.608.a:0 "Very Unexpected Situation"
 Turkey.609.title:0 "Martyred Policeman In Izmir Attack Hailed As Hero"
 Turkey.609.desc:0 "The terrorist attack in Izmir occurred just outside the city's main courthouse when the 43-year-old police officer Sekin stopped a suspicious vehicle, which turned out to be carrying explosives. Sekin, who realized the terrorists as soon as he stopped the vehicle, opened fire on them and prevented civilian casualties by halting the vehicle from proceeding. An armed clash also took place between the terrorists and the security forces. The ensuing clash and a car-bomb attack left Sekin and a court official martyred and five others injured as a bigger blast involving another vehicle was thwarted,"
 Turkey.609.a:0 "This Country Owes You"
 Turkey.612.title:0 "2009 Turkish Local Elections"
 Turkey.612.desc:0 "Local elections were held in Turkey on 29 March 2009. The overall winner was the ruling party Justice and Development Party, although the party saw a decline in its vote relative to the 2007 general election. The leading opposition party, the social democratic Kemalist CHP, increased its vote share, as did a number of smaller parties including the SP, DTP and BBP, whose party leader Muhsin Yazıcıoğlu had died in a helicopter crash four days before the election.The third largest party, the Turkish nationalist MHP, enjoyed a more modest vote surge. The election was not contested by Cem Uzan's GP."
 Turkey.612.a:0 "People has spoken"
 Turkey.613.title:0 "2014 Turkish Local Elections"
 Turkey.613.desc:0 "Local elections were held in Turkey on 30 March 2014, with some repeated on 1 June 2014. Metropolitan and district mayors as well as their municipal council members in cities, and muhtars and "elderly councils" in rural areas (and also in mahalles within urban areas) were elected. In light of the controversy around the elections, it was viewed as a referendum on the government."
 Turkey.613.a:0 "People has spoken"
 Turkey.614.title:0 "2019 Turkish Local Elections"
 Turkey.614.desc:0 "The Turkish local elections of 2019 were held on Sunday 31 March 2019 throughout the 81 provinces of Turkey. A total of 30 metropolitan and 1,351 district municipal mayors, alongside 1,251 provincial and 20,500 municipal councillors were elected, in addition to numerous local non-partisan positions such as neighbourhood wardens (muhtars) and elderly people's councils."
 Turkey.614.a:0 "People has spoken"
 Turkey.651.title:0 "2024 Turkish Local Elections"
 Turkey.651.desc:0 "The 2024 Turkish local elections are the local elections to be held on 31 March 2024 to determine the local governments in Turkey. In the elections to be held in 1393 municipalities, mayors, metropolitan mayors, members of the municipal council, members of the general provincial council, mukhtars and old people's delegations will be determined."
 Turkey.651.a:0 "People has spoken"
 Turkey.615.title:0 "Imamoglu's Secret Plans"
 Turkey.615.desc:0 "Things are getting complicated day by day in the CHP, which is intertwined with indigestion after the historic election defeat. A Zoom meeting of party members who want change was held under the leadership of Istanbul Metropolitan Municipality (IMM) President Ekrem Imamoglu, and it was thought that the purpose of the meeting was to "overthrow Kılıçdaroğlu". When the secret meeting was leaked to the media, betrayal became the main agenda in the party. CHP Chairman Kemal Kılıçdaroğlu, on the other hand, made a statement on the subject on the live broadcast he attended yesterday, stating that such meetings could only happen and that he found it "Ethically disturbing"."
 Turkey.615.a:0 "Weird Things Are Happenning"
 Turkey.616.title:0 "Tanju Ozcan Expelled From CHP"
 Turkey.616.desc:0 "The Republican People's Party has decided to expel Bolu Mayor Tanju Ozcan from the party.\n\nCHP High Disciplinary Committee Presidency made a statement,"At the meeting of the High Disciplinary Committee dated 26.07.2023, the 68th of the CHP Charter about Tanju Ozcan. In accordance with Article 1- a) and 1- b) paragraphs, a final removal penalty has been given,"it was said.Tanju Ozcan criticized CHP leader Kemal Kilicdaroglu in a statement on his social media account after the expulsion decision."
 Turkey.616.a:0 "Interesting"
 Turkey.617.title:0 "Attacks On HUDA-PAR"
 Turkey.617.desc:0 "A senior member of a Kurdish conservative party was killed and a colleague injured in a knife attack in Turkey’s city of Adana on Saturday. Salih Demir, the provincial head of the Free Cause Party (Huda Par), and Sacit Pisgin, the party’s provincial secretary, were stabbed inside the prayer room of the party’s office in Adana. Demir was severely injured and Pisgin was killed."
 Turkey.617.a:0 "Ah!"
 Turkey.618.title:0 "Emine Ulker Tarhan Leaves The CHP"
 Turkey.618.desc:0 "Emine Ülker Tarhan, one of the deputies who asked CHP Chairman Kemal Kılıçdaroğlu to leave his post after the presidential election, resigned from her party.\n\nCHP Ankara Deputy Emine Ülker Tarhan said in a written statement today that her call to learn lessons from election defeats and mistakes was ignored.Tarhan's statement is as follows: \n\n"Due to the conditions that our country is in, including the danger of war, before the 2015 General Elections, which have gained extraordinary importance for the future of our children; ignoring my call for the operation of democracy in the party, the electoral defeats and especially the mistakes that delivered the presidency to power in the first round, to be learned and seriously draw a road map, turning the congress into a race to grab seats; destroying the state that its founder built with great sacrifices, uprooting the trees he planted, and instead quietly watching the attempt to create an authoritarian state embodied in a freak palace called 'ak' and the transformation of the republican mansion into a dynastic palace; Since I understand that I cannot change the possible grave preferences of the CHP administration, which seems to insist on irresponsible calls, inconsistent tezkere rhetoric, vague policies and an understanding of opposition disconnected from the sensibilities of our people in this very critical period when Turkey is facing internal and external threats, shaken by business and terrorist murders, I resign from the CHP, where I came with high hopes not to be part of the wrong and weak policies that have neither the hope of power nor the goal.""
 Turkey.618.a:0 "Bad For The CHP"
 Turkey.619.title:0 "Emine Ulker Leaves The CHP"
 Turkey.619.desc:0 "Emine Ülker Tarhan, one of the deputies who asked CHP Chairman Kemal Kılıçdaroğlu to leave his post after the presidential election, resigned from her party.\n\nCHP Ankara Deputy Emine Ülker Tarhan said in a written statement today that her call to learn lessons from election defeats and mistakes was ignored.Tarhan's statement is as follows: \n\n"Due to the conditions that our country is in, including the danger of war, before the 2015 General Elections, which have gained extraordinary importance for the future of our children; ignoring my call for the operation of democracy in the party, the electoral defeats and especially the mistakes that delivered the presidency to power in the first round, to be learned and seriously draw a road map, turning the congress into a race to grab seats; destroying the state that its founder built with great sacrifices, uprooting the trees he planted, and instead quietly watching the attempt to create an authoritarian state embodied in a freak palace called 'ak' and the transformation of the republican mansion into a dynastic palace; Since I understand that I cannot change the possible grave preferences of the CHP administration, which seems to insist on irresponsible calls, inconsistent tezkere rhetoric, vague policies and an understanding of opposition disconnected from the sensibilities of our people in this very critical period when Turkey is facing internal and external threats, shaken by business and terrorist murders, I resign from the CHP, where I came with high hopes not to be part of the wrong and weak policies that have neither the hope of power nor the goal.""
 Turkey.619.a:0 "We Need A Change!"
 Turkey.619.b:0 "Bad For The CHP"
 Turkey.620.title:0 "Erdogan Pushes His Destiny Speech"
 Turkey.620.desc:0 "Don't say fate! There is a fate above fate. Whatever they do is empty, there is a decision from Heaven..."
 Turkey.620.a:0 "He Is The Excellency"
 Turkey.620.b:0 "He Is The Excellency §Y(With No Speech)§!"
 Turkey.621.title:0 "White Energy Operations"
 Turkey.621.desc:0 "The statements of Deputy Undersecretary Mendilcioğlu and former TEAŞ General Manager Selvi, the defendants of the White Energy Operation, at the Gendarmerie. Two bureaucrats stated that Minister Ersümer intervened in the tenders and said, ‘There is an annuity situation in the ministries. This is also the case during the period of Mr. Cumhur,’ he claimed."
 Turkey.621.a:0 "Its Unacceptable"
 Turkey.622.title:0 "Bank Operations"
 Turkey.622.desc:0 "During the 2000s, Turkey experienced a significant banking scandal that shook the nation's financial sector. This event highlighted the presence of corruption and financial misconduct within certain banks, leading to a loss of public trust and severe repercussions for the affected institutions."
 Turkey.622.a:0 "Its Unacceptable"
 Turkey.623.title:0 "Explosion in the TMO silo in Kocaeli"
 Turkey.623.desc:0 "An explosion occurred in the Soil Crops Office (TMO) silo at the Derince Port location in Kocaeli. While the explosion was felt all over the city, a large number of teams were dispatched to the area. Kocaeli Metropolitan Municipality Mayor Tahir Büyükakın announced that 12 people were injured in the explosion, 3 people were intubated. Justice Minister Yilmaz Tunc announced that a judicial investigation had been launched into the explosion. In a statement made by the TMO, "It is being evaluated that the explosion may have been caused by dust compression, and the cause will become clear as a result of a detailed technical examination," it was said. On the other hand, images of the moment of explosion appeared."
 Turkey.623.a:0 "Aman Tanrım"
 Turkey.625.title:0 "AKP's Pro-Palestinian Rally"
 Turkey.625.desc:0 "Hundreds of thousands of people gathered at a pro-Palestinian rally arranged by the ruling Justice and Development Party's (AKP) Istanbul organization on Oct. 28. President Recep Tayyip Erdogan delivered a long address during the event held at Istanbul Atatürk airport, condemning both Israel and Western nations for the recent events in Gaza. "It is the West that is most responsible for the massacre in Gaza as well," he asserted, and unequivocally declared Israel as a "war criminal."\n\nHis words resonated with the crowd, many of whom waved Palestinian and Turkish flags.The rally marked the largest pro-Palestinian demonstration in Türkiye since Oct. 7's attacks by Hamas and Israel's subsequent airstrikes in Gaza. Attendees, arriving in droves from noon onwards, chanted slogans such as "Murderer Israel" to express their outrage.\n\nNotably, Devlet Bahçeli, the leader of the rising Nations Alliance partner Nationalist Movement Party (MHP), also attended the rally."
 Turkey.625.a:0 "Hurrah!"
 Turkey.626.title:0 "Protests To US Base Of Incirlik"
 Turkey.626.desc:0 "Tensions broke out during a protest against Israel's attacks on Palestine in front of the Incirlik Base in Adana. 6 of the policemen who intervened against some activists with water cannon and pepper spray were injured."
 Turkey.626.a:0 "How Dare Are They?"
 Turkey.627.title:0 "Sayistay Refuses To Obey AYM's Verdict"
 Turkey.627.desc:0 "The Court of Accounts did not accept the decision of the Constitutional Court and did not release TIP's banned and imprisoned deputy from prison. As a result of these events, the Istanbul Bar Association started a march and CHP deputies took action in the grand national assembly. Tensions in the country have escalated and skepticism of justice has increased as a result of the events."
 Turkey.627.a:0 "Law And Order?"
 Turkey.628.title:0 "Ali Yerlikaya Orders Drug Operations!"
 Turkey.628.desc:0 "Interior Minister Ali Yerlikaya reported that 210 suspects were arrested in the "Narkoguç" operations organized as part of the fight against drugs.\n\nYerlikaya, in a statement from his social media account, Ankara Police Department Anti-Narcotic Crimes Branch Directorate, based in Ankara, established and managed an organization for the purpose of committing crimes in 32 provinces, left drugs according to location information, traded drugs by depositing money into bank accounts, laundered assets caused by crime, he stated that simultaneous "Narco-Power" operations were organized against the criminal organization for profit purposes.Yerlikaya, who explained that the foreign national Jamukhan Ulus, the ringleader of the organization, was also arrested during the operations, noted that 210 suspects were detained and the organization's executive network was destroyed."
 Turkey.628.a:0 "Good!"
 Turkey.629.title:0 "CHP's 38th Ordinary Congress"
 Turkey.629.desc:0 "Turkey's main opposition Republican People's Party (CHP) on Sunday elected Ozgur Ozel as its new leader, ending a 13-year term for incumbent Kemal Kilicdaroglu, as the country gears up for local elections next March.Ozel, 49, has been serving as the CHP's deputy parliamentary group chairman since 2015 and has been a lawmaker since 2011. He announced his candidacy in September, after Kilicdaroglu and the CHP's painful defeat to President Tayyip Erdogan and his ruling political alliance in May presidential and general elections.\n\nOzel, a pharmacist by trade, received 812 of 1,366 possible votes at a tense, hours-long party congress in Ankara that took two rounds."This is the greatest honour of my life," Ozel said after the results were announced, while thanking Kilicdaroglu for his work at the party. "We are embarking on the road for local election victory," he added.\n\n"We have believed in turning hopelessness into hope, we are hopeful," Ozel said, surrounded by applauding party members and standing alongside Istanbul Mayor Ekrem Imamoglu."
 Turkey.629.a:0 "After 13 Years, A New Man Spawned It Up"
 Turkey.632.title:0 "The Elevator Carrying 16 Students Fell"
 Turkey.632.desc:0 "An elevator "accident" occurred in the Guzelhisar Girls' Dormitory, located in the Efeler district of Aydın, affiliated to the General Directorate of Loans and Dormitories (KYK). the elevator in which 16 people were riding allegedly fell from the upper floors. According to the news in DHA, it was learned that the student who got stuck while trying to get out of the elevator and lost his life was Zeren Ertas, a 4th Grade Student at the Faculty of Economics and Administrative Sciences of Adnan Menderes University. Ertas' family has been informed.\n\nWhile it was stated that Zeren Ertaş lost his life, the students staying in the dormitory took action with the slogans "Killer KYK"."
 Turkey.632.a:0 "It Sounds Terrible"
 Turkey.633.title:0 "Police Arrest Televangelist Adnan Oktar"
 Turkey.633.desc:0 "Istanbul police arrested a controversial televangelist early Wednesday and are also seeking the arrest 235 of people suspected of links to his "gang."\n\nAdnan Oktar, also known as Harun Yahya, was on the police Financial Crime Division’s most wanted list, said security sources, who asked not to be named due to restrictions on speaking to the media.The police said Oktar was caught while preparing to flee.\n\nOktar’s gang has been accused of crimes including establishing a criminal organization, child sexual abuse, sexual intercourse with a minor, kidnapping, violating tax law, and violating the anti-terrorism law.\n\nPolice are seeking the suspects accused of links to Oktar across five province, with 166 arrested so far. The Istanbul Court of Peace also ordered the confiscation of the 235 suspects' properties, and also appointed a trustee to their companies, organizations, and associations."
 Turkey.633.a:0 "Good To Hear"

 Turkey.634.title:0 "Tensions After The March"
 Turkey.634.desc:0 "Ismail Aydemir, who participated in the 'Mercy to the martyrs, support for Palestine, curse on Israel' march held in Fatih yesterday morning, walked with the Word-i Tawhid Flag in his hand after the march. University student Ege Akersoy attacked Aydemir with a fist on the Galata Bridge. After the attack, Aydemir's face was covered in blood while Ege Akersoy was detained by police teams. Ege Akersoy was referred to the Istanbul Chief Public Prosecutor's Office after his police procedures."
 Turkey.634.a:0 "Damn"
 Turkey.635.title:0 "Turkish Parliament Ratifies Sweden's Bid"
 Turkey.635.desc:0 "Turkish MPs have ratified Sweden's bid to join Nato in a long-delayed vote that represents a big step forward on the Nordic nation's path to membership.\n\nSweden applied to join in 2022 after Russia's full-scale invasion of Ukraine, but Turkey withheld approval amid a row over what it called Sweden's support to Kurdish separatists.\n\nTurkish President Erdogan is expected to sign the legislation within days. It leaves Hungary the sole Nato member yet to ratify Sweden's accession./n/nSwedish Prime Minister Ulf Kristersson posted on social media: "Today we are one step closer to becoming a full member of Nato"./n/nAnd Nato Secretary General Jens Stoltenberg welcomed Turkey's vote, saying he was counting on Hungary to "complete its national ratification as soon as possible"."
 Turkey.636.a:0 "We Have Made Our Decision, Accept It!"
 Turkey.637.title:0 "Demirtaş Became Candidate Of Nobel"
 Turkey.637.desc:0 "The previous HDP Co-Leader Selahattin Demirtaş was reportedly proposed as a candidate for the Nobel Peace Prize. According to the information we have obtained from Emir Ali Türkmen, the publisher of Seher, written by Demirtaş, Swedish Social Democrats Party MP Thomas Hammarberg has proposed Selahattin Demirtaş as a candidate for the Nobel Peace Prize."
 Turkey.637.a:0 "Sweden Thanks Our Ratification"
 Turkey.638.title:0 "Turkey's First Astronaut"
 Turkey.638.desc:0 "Alper Gezeravci signed first in the history of Turkey. The dream of space travel came true when the first Turkish astronaut Alper Gezeravci set off for the international space station. The rocket carrying the Axiom Mission 3 (Ax-3) crew, including Gezeravci, to the International Space Station (ISS) has been launched.Turkey's historical mission has also caused great repercussions in the world press. International agencies have made headlines about the first Turkish astronaut's space trip."
 Turkey.638.a:0 "Very Good News!"
 Turkey.639.title:0 "Deputy Can Atalay Was Dismissed"
 Turkey.639.desc:0 "The decision of the Court of Cassation to dismiss the Turkish Workers' Party (TIP) Hatay Deputy Can Atalay's deputy position was read out today at the Plenary Session of the Turkish Grand National Assembly. With the reading of the decision, Atalay's power of attorney was officially reduced. However, the number of TIP's deputies has also decreased to 3.\n\n TIP, DEM Party and CHP deputies occupied the presidential podium with banners; a Constitution booklet was thrown at Bozdağ./n/n The Deputy Speaker of the Grand National Assembly, Bekir Bozdağ, who led the assembly, closed the assembly on the grounds that the work could not be continued due to the protests."
 Turkey.639.a:0 "AYM Has Shadowed"
 Turkey.640.title:0 "ISIS Strike On A Church"
 Turkey.640.desc:0 "The Islamic State has claimed responsibility for Sunday's attack on a Roman Catholic church in Istanbul that left one person dead. Experts see the footprints of the Khorasan branch of the extremist jihadist group./n/nSariyer Sunday during mass, two attackers wearing ski masks stormed the Santa Maria Catholic Church in the Sariyer district of Istanbul, randomly opened fire on the crowd and killed 52-year-old Tuncer Cihan before fleeing the scene. According to local news sources, Cihan, who was Decapitated with a Muslim ceremony, visited the church occasionally."
 Turkey.640.a:0 "It's Really Bad"
 Turkey.641.title:0 "Terror Attack In North Iraq"
 Turkey.641.desc:0 "The PKK terrorist organization tried to infiltrate a base area in Northern Iraq. 9 Turkish Armed Forces personnel were martyred in the clashes that broke out during the infiltration attempt. 4 Personnel were also injured in the clashes. The Ministry of National Defense announced that the number of terrorists neutralized after the attack had increased to 23. Operations in the region are continuing with the participation of commando teams. F-16s are also hitting terror hotspots in the region. On the other hand, it was reported that 29 targets were destroyed during the air operations carried out in northern Iraq and Syria."
 Turkey.641.a:0 "We Need To Clean The Region"
 Turkey.642.title:0 "Armed Raid On P&G Company"
 Turkey.642.desc:0 "P&G's factory in Gebze was raided by two armed men. According to initial indications, seven employees were taken hostage by the attackers. While it is suggested that the hostage takers are employees of the management unit, it is stated that the remaining part of the factory has been evacuated. A photo of the suspect who took the employees hostage appeared and it was seen that he had a ‘bomb device' on him."
 Turkey.642.a:0 "Arrest Him Right Now!"
 Turkey.646.title:0 "Anagold Incident"
 Turkey.646.desc:0 "Anagold Mining Industry and Trade A.Sh.a large number of workers were left under the ground in a landslide that occurred on the mountain where cyanide waste was formed in the Ilic district of Erzincan, where gold production has been going on since December 2010. The danger experienced in the region where toxic wastes are warned to affect the surrounding provinces is not the first. In June 2022, the pipe carrying cyanide exploded in the gold mine. Toxic waste got mixed into the Ilic Dam on the Euphrates River."
 Turkey.646.a:0 "A Catastrophe"
 Turkey.647.title:0 "Danıştay Decision"
 Turkey.647.desc:0 "The State Council Department made a statement about the Sabah newspaper's claims that the number of judges and prosecutors who were returned to duty was 4,500 and stated that the decision to expel 450 people had been canceled. Those who were expelled were accused of FETO."
 Turkey.647.a:0 "Whatever"
 Turkey.648.title:0 "The New Military Force"
 Turkey.648.desc:0 "The force of the Land Forces Command has been changed. In a written statement made by the Ministry of National Defense, "a new fors design reflecting the ancient past of the Land Forces Command, whose past is full of glory and honor, was designed, approved and put into use by the need to make a new fors design. There is no change in the badge and symbol of the Land Forces Command,”it was said."
 Turkey.648.a:0 "Good News"
 Turkey.650.title:0 "Healthcare Issues In Karabük University"
 Turkey.650.desc:0 "The allegations of some male and female students who had sexual intercourse with black students became the agenda on Karabuk University's Instagram 'confession page'. Some of the students said that they had gone to the hospital with HPV and some with suspected HIV. The Karabük Provincial Health Directorate denied the allegations."
 Turkey.650.a:0 "Ugh!"
 Turkey.652.title:0 "PKK Supporters In Belgium Provoke"
 Turkey.652.desc:0 "Belgium police used water cannons to control an altercation initiated by PKK terror group sympathizers who were raising provocative slogans while passing through an area of Turkish-origin citizens in the Heusden-Zolder district of Limburg province near the capital Brussels and their attack on them./n/nA group of PKK sympathizers were returning from Nevruz (spring) celebrations on Sunday morning in their cars, carrying flags symbolizing the PKK terrorist organization, but when they passed through a street primarily populated by Turkish-origin citizens, they shouted provocative slogans. The Turks responded to the group, resulting in an altercation."
 Turkey.652.a:0 "Protest Them!"
 Turkey.653.title:0 "Deadly Cable Car Accident In Antalya"
 Turkey.653.desc:0 "During the busy period of the Ramadan holiday, a pole collapsed at 5.28 p.m. on Friday, striking a cabin. The accident claimed one life and injured seven people, including two children. Subsequently, 184 individuals in 24 cabins were left suspended in the air.\n\nRescue operations continued throughout the night with helicopters equipped with night vision. The concerted efforts of seven helicopters, 87 vehicles, and approximately 500 personnel over 22.5 hours resulted in the successful rescue of all individuals trapped in the cabins."
 Turkey.653.a:0 "Aman Tanrım"
 Turkey.654.title:0 "The Turkish Government Temporarily Bans Instagram"
 Turkey.654.desc:0 "The Information and Communication Technologies Authority barred access to Instagram on 2 August without providing a specific reason. Government officials later said the ban was imposed because the social media platform failed to abide by Turkish laws."
 Turkey.654.a:0 "We Must Maintain Our Order In Social Media"
 Turkey.655.title:0 "The Turkish Government Bans Discord"
 Turkey.655.desc:0 "Justice minister Yilmaz Tunc said an Ankara court decided to block access to Discord from Turkey due to sufficient suspicion that crimes of "child sexual abuse and obscenity" had been committed by some using the platform. The block comes after public outrage in Turkey caused by the murder of two women by a 19-year-old man in Istanbul this month. Content on social media showed Discord users subsequently praising the killing."
 Turkey.655.a:0 "We Must Maintain Our Order In Social Media"
 Turkey.656.title:0 "Arrest Of Ahmet Özer"
 Turkey.656.desc:0 "Özer, a distinguished Kurdish academic and a member of the main opposition Republican People’s Party (CHP), was detained during an Oct 31 raid on his home and subsequently remanded in custody on “terrorism” charges."
 Turkey.656.a:0 "CHP Is Under Pressure"
 Turkey.658.title:0 "Turkish Government Ousts Van Mayor"
 Turkey.658.desc:0 "Turkish Interior Ministry has ousted Van co-Mayor Abdullah Zeydan, from the pro-Kurdish DEM Party, after he was sentenced on the charge of “aiding and propagandizing for a terrorist group.” The ministry appointed Van governor as the trustee mayor and thousands of Van people, as well as the DEM Party, protested the move. The police detained 127 people during the protest."
 Turkey.658.a:0 "Broad Clashes"
 Turkey.659.title:0 "A Turk Won A Nobel Prize"
 Turkey.659.desc:0 "MIT economists Daron Acemoglu and Simon Johnson PhD ’89, whose work has illuminated the relationship between political systems and economic growth, have been named winners of the 2024 Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel. Political scientist James Robinson of the University of Chicago, with whom they have worked closely, also shares the award."
 Turkey.659.a:0 "Something Good"
 Turkey.660.title:0 "Common Turkic Alphabet"
 Turkey.660.desc:0 "The common alphabet issue, which has been considered by the Turkish Academy and the Turkish Language Association since 1991, was created from the Latin-based Turkish alphabet and the new alphabet consisting of 34 letters was accepted as the new Turkish alphabet by the Turkish Art Organization with the signature of all countries."
 Turkey.660.a:0 "Something Good"
 Turkey.661.title:0 "Bahçeli Meets With The İmralı Delegation"
 Turkey.661.desc:0 "Following a meeting with PKK leader Abdullah Öcalan on December 28th, the İmralı delegation of the Peoples' Equality and Democracy Party (DEM Party), which has decided to establish political talks every year, met with Devlet Bahçeli, Chairman of the National Movement Party (MHP).\n\nAccording to Mezopotamya Agency, the DEM Party delegation was greeted at the door by Bahçeli. The closed-door meeting, held in the MHP leader's office in Parliament, lasted approximately 40 minutes. The content of the meeting has not yet been released."
 Turkey.661.a:0 "Whatever"
 Turkey.662.title:0 "The New Path"
 Turkey.662.desc:0 "The Felicity Party, the Future Party, and the DEVA Party have completed their efforts to establish a joint parliamentary group under the umbrella of "New Path." Celal Mümtaz Akıncı, a former Constitutional Court member and current DEVA Party Vice President, was elected party leader."
 Turkey.662.a:0 "Whatever"
 Turkey.663.title:0 "Arrest Of Umit Ozdag"
 Turkey.663.desc:0 "A court in Istanbul, Turkey ordered the arrest of Umit Ozdag, president of the anti-migrant and far-right Victory Party (VP) for “public incitement to hatred and enmity”.\n\nThe prosecutor’s office highlighted Ozdag’s alleged influence on anti-migrant unrest in Kayseri province in 2024. Ozdag’s statements had demonstrated “provocative attitudes and behaviors”, it said.\n\nTurkey saw anti-migrant and anti-refugee protests in July 2024 following an alleged case of child abuse in Kayseri province that involved Syrian refugees. Angry protesters raided shops owned by Syrians and set fire to several vehicles.\n\nOzdag denied the allegations. “The VP has nothing to do with incidents [in Kayseri],” he said in his defense at the court. "
 Turkey.663.a:0 "A Solid Pressure On Zafer Party"
 Turkey.664.title:0 "Bolu Grand Hotel Fire"
 Turkey.664.desc:0 "On 21 January 2025, a fire occurred at the Grand Kartal Hotel at the Kartalkaya ski resort in Bolu Province, Turkey; at least 78 people died, 51 others were injured. The fire started in the hotel's fourth floor kitchen/restaurant section. It occurred during the Turkish winter school break, when the hotel was 80–90% full. The scale of the fire and number of deaths were exacerbated by the absence of smoke detectors, automatic sprinklers, functioning fire alarms, functioning emergency exit lights, and other fire safety measures. Rescue efforts were hampered by freezing weather and the hotel's remote location; firefighters did not arrive until over an hour after the fire was reported. Most victims died from suffocation."
 Turkey.664.a:0 "A Disaster!"
 Turkey.665.title:0 ""Yenidoğan" Gang"
 Turkey.665.desc:0 "Forty-seven people have gone on trial in Turkey in connection with an alleged scam in which newborns were transferred between hospitals for profit.\n\nProsecutors say doctors, nurses and ambulance drivers are responsible for the deaths of at least 10 children. The defendants are accused of making false diagnoses to transfer babies to 19 private hospitals, where they were allegedly kept in intensive care in neonatal units for lengthy, sometimes unnecessary treatments.\n\nAccording to the 1,400-page indictment, those involved shared the social security payments earned for each day a baby stayed in the unit. The defendants deny wrongdoing. They say they made the decisions in good faith and gave the babies the best possible care. One of the accused, Dr Firat Sari, told prosecutors that everything had been done "in accordance with procedures", the Associated Press new agency reports. As the trial opened, dozens of people took part in a protest outside the courthouse near Istanbul, chanting "baby killers will be held accountable” and "private hospitals should be shut down", AP adds.\n\nPolice launched an inquiry following an anonymous tip-off in March 2023. Ten hospitals have had their licences revoked as a result of the investigation."
 Turkey.665.a:0 "..."
 Turkey.666.title:0 "Vestel CEO Forced To Resign"
 Turkey.666.desc:0 "On Friday, Ergun Güler, chief executive of Vestel, an electronics firm that is a subsidiary of Zorlu Holding, sent a message to employees celebrating the start of Ramadan, which began on Saturday. Köksal later sent an internal email saying the company only celebrated two bayram holidays, Eid al-Fitr and Eid al-Adha officially, not Ramadan and that it wanted to maintain a secular stance as it worked to become a multinational corporation, with employees from various beliefs and origins.\n\nAfter images of that email were circulated by local media and on social media, an Istanbul prosecutor's office launched an investigation into the issue, Anadolu Agency (AA) said, adding that Köksal was detained on Saturday for "obstructing the exercise of freedom of belief, thought and expression."In a statement, Zorlu Holding later said it acknowledged the "sensitivity" caused by the "internal argument over management principles" and that Köksal had resigned as of March 1."
 Turkey.666.a:0 "For Ramadan"
 Turkey.667.title:0 "Arrest of Ekrem Imamoglu"
 Turkey.667.desc:0 "On the morning of 19 March 2025, Turkish police surrounded İmamoğlu's residence in Istanbul. In a video, tweeted at approximately 7 a.m. local time, İmamoğlu said, "We are facing great oppression, but I will not give up. I entrust myself to my nation." Shortly after, İmamoğlu and around 100 other people, including his advisor Murat Ongun, were detained. Two Istanbul district mayors from the CHP, and several journalists and business figures, were detained as part of the same operation. These developments came on the morning of İmamoğlu becoming the CHP presidential candidate. The CHP condemned the detentions, describing them as a "coup attempt", and expressed their support for İmamoğlu. On March 23 twenty people, including the Chairman of the Board of Directors of Media Inc. and İmamoğlu's advisor Murat Ongun, Istanbul Planning Agency President Buğra Gökçe, İmamoğlu Construction General Manager Tuncay Yılmaz and İBB Kültür A.Ş. General Manager Murat Abbas, were arrested. Forty-eight people, including İmamoğlu, were detained in the corruption investigation, three people were arrested in the terrorism investigation, and judicial control [tr] decisions were issued for forty-one people.  On that day, İmamoğlu was the only candidate in the CHP's presidential primary election, held to choose the party's nominee for the upcoming presidential election. According to CHP Chairman Özgür Özel, İmamoğlu received over 14.85 million votes. \n\nThe Istanbul Chief Public Prosecutor's Office accused İmamoğlu of being the "leader of a criminal organisation," alleging corruption, extortion, bribery, and money laundering tied to municipal contracts. Prosecutors also charged him with aiding the Kurdistan Workers' Party (PKK) by forming an electoral alliance with the pro-Kurdish Peoples' Equality and Democracy Party (DEM) during the 2024 municipal elections. The government claimed this "city consensus" increased the PKK's influence in urban areas. İmamoğlu and his supporters rejected the charges as fabricated, asserting they were designed to eliminate him as a political threat to President Recep Tayyip Erdoğan. The Istanbul Chief Public Prosecutor's Office also announced that İmamoğlu's construction company had been seized as part of the investigation and its general manager had been detained. The Turkish government also imposed a four-day ban on public demonstrations in Istanbul, closed major roads, and restricted access to social media platforms such as Twitter, YouTube, and Instagram, according to internet watchdog NetBlocks. İmamoğlu was taken to the Vatan Security Department in Istanbul, where he remained in custody pending further legal proceedings."
 Turkey.667.a:0 "Problems Are Escalating"
 Turkey.667.b:0 "Problems Are Escalating §Y(With No Speech)§!" 
 Turkey.668.title:0 "Morgan Stanley Leaves Istanbul Stock Exchange"
 Turkey.668.desc:0 "In its statement to the Public Disclosure Platform (KAP) on March 19, 2025, Borsa Istanbul A.Ş. announced that Morgan Stanley Securities was removed from the Stock Exchange."
 Turkey.668.a:0 "They Made Their Decision"
 Turkey.670.title:0 "Istanbul Bar Association Leadership Removed"
 Turkey.670.desc:0 "In a decision widely condemned as politically motivated, the İstanbul 2nd Civil Court of First Instance has removed the entire executive board of the İstanbul Bar Association, including its president, constitutional law scholar Prof. Dr. İbrahim Özden Kaboğlu. The ruling comes in response to a statement the Bar issued following the killing of two journalists in a December 2024 airstrike in northern Syria, and marks an escalation in the Turkish government’s crackdown on legal institutions and independent voices."
 Turkey.670.a:0 "Law Has Shadowed"
 Turkey.672.title:0 "2nd April Boycott Campaign"
 Turkey.672.desc:0 "An opposition-led boycott in Turkey started on March 19, the day Istanbul's mayor Ekrem İmamoğlu was detained. That night, the leader of the main opposition Republican People's Party Özgür Özel told the crowd who gathered outside the Istanbul municipality headquarters to boycott pro-government media channels and a list of companies affiliated with the government on the grounds that the television channels did not cover the large scale demonstrations.\n\nOver the following days as people continued to gather in the same square Özel pressed with the calls, adding more companies and brands who kept advertising on pro-government channels and asking people to boycott their products. The opposition party even created a website, which was blocked days later by a decision of a criminal judgeship of peace.\n\nThen on April 1, joining the calls by students across Turkey, Özel called on the public at large for a day long economic boycott. “Stop all purchases! Supermarkets, online shopping, restaurants, gasoline, coffee, buy nothing,” said Özel on April 1. Scores of business — small and large — across the country announced they were closing down shops and e-commerce websites in solidarity. Meanwhile Istanbul Prosecutor's Office in a statement on April 1, said it was initiating an investigation, on the grounds that “‘divisive rhetoric’ on traditional and social media aimed at hindering the economic activity constituted ‘hatred and discrimination’ and ‘incitement to hatred and hostility,’” according to local media reports."
 Turkey.672.a:0 "Shocking"
 Turkey.674.title:0 "LeMan Protests"
 Turkey.674.desc:0 "Clashes erupted in Istanbul with police firing rubber bullets and teargas to disperse a mob on Monday after allegations that a satirical magazine had published a cartoon of the prophet Muhammad. The clashes occurred after Istanbul’s chief prosecutor ordered the arrest of the editors at LeMan magazine on grounds it had published a cartoon that “publicly insulted religious values”."
 Turkey.674.a:0 "A Religious Issue"
 Turkey.673.title:0 "A Man Attacks Turkish Opposition Leader"
 Turkey.673.desc:0 "The leader of Turkey’s main opposition party was attacked as he left a memorial ceremony in Istanbul on Sunday. Ozgur Ozel, who heads the Republican People’s Party, or CHP, was leaving the Ataturk Cultural Center in the city center when a white-haired man approached him and struck him in the face with an open hand, televised footage showed.\n\nOzel, who was attending a memorial for Sirri Sureyya Onder, a pro-Kurdish politician who died Saturday, was said to be unhurt. The suspect was detained, according to the Istanbul Chief Public Prosecutor’s Office. The Interior Ministry later said the attacker was a 66-year-old man who killed his two children in 2004 and was released on parole in 2020. The Cumhuriyet newspaper reported that he shot and stabbed his son and daughter, aged 19 and 17, respectively. The incident renewed fears over the safety of politicians in Turkey."
 Turkey.673.a:0 "Country Is Destabilizing"
 Turkey.675.title:0 "Arrest Of Tunç Soyer"
 Turkey.675.desc:0 "As part of the operation carried out against İzmir Metropolitan Municipality on 1 July, 99 out of 119 people who were taken into custody and referred to court this morning were sent to court with a request for arrest. Among those arrested were former İzmir Metropolitan Mayor Tunç Soyer and CHP İzmir Provincial Chair Şenol Aslanoğlu, along with 33 others."
 Turkey.675.a:0 "CHP Is Under Pressure"
 Turkey.676.title:0 "Antalya, Adana, Adıyaman CHP Mayors Detained"
 Turkey.676.desc:0 "The operation against the CHP municipalities of Antalya, Adana and Adıyaman came on the heels of investigations that began in Istanbul and then spread to the third biggest city Izmir. As part of the ongoing operations against the main opposition Republican People's Party (CHP) municipalities, Adana Mayor Zeydan Karalar and Adıyaman Mayor Abdurrahman Tutdere were detained on Saturday morning."
 Turkey.676.a:0 "CHP Is Under Pressure"
 Turkey.677.title:0 "Methane Gas Kills 12 Turkish Soldiers"
 Turkey.677.desc:0 "Twelve Turkish soldiers have died after being exposed to methane gas while searching a cave in northern Iraq, the Turkish Ministry of National Defence said. At least 19 personnel were exposed to the gas during the search and clear operation on Sunday, and immediately taken to hospital."
 Turkey.677.a:0 "Aman Tanrım"
 Turkey.678.title:0 "Sozcu TV Forced Off Air"
 Turkey.678.desc:0 "Turkey’s pro-opposition Sozcu TV went off the air for 10 days at midnight on Wednesday, local time, marking what many view as a fresh front in the country’s intensifying crackdown on dissent. “When the clock strikes 12 [5:00 p.m. ET], Sozcu TV will go off the air,” Serap Belovacikli, an anchorwoman at the channel, told her viewers earlier Tuesday. “But will we give up? No! We will not stop being your voice.”\n\nThe silencing comes amid a widening crackdown on the main opposition Republican People’s Party (CHP), which has sharply escalated over the past week. Three more CHP mayors — including in former ruling party strongholds that flipped in last year’s historic local elections — were detained, fueling growing alarm over the state of democracy in the country."
 Turkey.678.a:0 "Opposition Media Should Be Under Our Control"
 Turkey.679.title:0 "Grok AI ChatBot Blocked In Turkey"
 Turkey.679.desc:0 "The ban stems from content generated by Grok deemed allegedly insulting to Turkish founding father Mustafa Kemal Atatürk, current President Recep Tayyip Erdoğan, and Prophet Muhammed.\n\nThe court’s decision to block Grok was announced by Turkey’s Media and Law Studies Association (MLSA).The ban makes Turkey the first country in the world to censor the Grok AI tool, according to legal scholar Yaman Akdeniz."
 Turkey.679.a:0 "Independent AI?"
 Turkey.680.title:0 "Arrest Of Özgür Kabadayi"
 Turkey.680.desc:0 "Operations targeting CHP-run municipalities continue. In the early hours of the morning, İstanbul Police raided Şile Municipality. Mayor Özgür Kabadayı was taken into custody. CHP Parliamentary Group Deputy Chair Ali Mahir Başarır described the operation as “a mafia order.” CHP Deputy Chair Burhanettin Bulut said, “We do not accept this corrupt order!”"
 Turkey.680.a:0 "CHP Is Under Pressure"
 Turkey.681.title:0 "Muharrem Ince Rejoins CHP"
 Turkey.681.desc:0 "Operations targeting CHP-run municipalities continue. In the early hours of the morning, İstanbul Police raided Şile Municipality. Mayor Özgür Kabadayı was taken into custody. CHP Parliamentary Group Deputy Chair Ali Mahir Başarır described the operation as “a mafia order.” CHP Deputy Chair Burhanettin Bulut said, “We do not accept this corrupt order!”"
 Turkey.681.a:0 "Opposition Is Unifying"
 Turkey.682.title:0 "Erdogan Announces His New Coalition"
 Turkey.682.desc:0 "Following the PKK's symbolic disarmament ceremony, President Recep Tayyip Erdoğan continued twice, reiterating his commitment to the three-party idea. In his speech at the Kızılcahamam camp, President Erdoğan said, "As three parties, we are determined to navigate this process safely." \n\nErdoğan, openly reporting to criticism, argued that he "places significant responsibilities on all political parties" in the new process. The President's statement that the process would be conducted by three parties is drawing criticism from party leadership."
 Turkey.682.a:0 "Triple Coalition Set To Form"
 Turkey.683.title:0 "Arrest Of Fatih Altayli"
 Turkey.683.desc:0 "On 23 June 2025, veteran Turkish journalist and commentator Fatih Altaylı was arrested following the publication of a video commentary on his YouTube channel, in which he discussed historical instances of Ottoman sultans being overthrown or assassinated. Turkish prosecutors claimed the comments constituted a threat to President Recep Tayyip Erdoğan.\n\nAltaylı, born in 1962, is a former columnist and television presenter who left traditional media in 2023 to launch his independent YouTube channel, which has since become one of the most popular in the country. In the video posted on 21 June, he referred to historical patterns of political accountability in the Ottoman Empire, stating: “This is a nation which strangled its sultan when they didn’t like him or want him.” Following the video's circulation online, Altaylı was arrested and placed in pre-trial detention.\n\nEleven journalists' unions, media organisations and NGOs have publicly condemned the arrest. In a joint statement, they asserted that Altaylı’s comments fell squarely within the scope of journalistic commentary and did not incite violence or contain any threat. The Journalists’ Union of Türkiye (TGS) described the arrest as unlawful and politically motivated, stating: “No journalist can be targeted because of their thoughts, writings or criticisms, and the judiciary cannot be used as a tool for such targeting.”"
 Turkey.683.a:0 "Pro-Opposition Journalists Are At The Target"
 Turkey.684.title:0 "Arrest Of Ismail Saymaz"
 Turkey.684.desc:0 "On 19 March 2025, police took İsmail Saymaz, a freelance journalist and TV commentator who formerly worked for outlets such as Halk TV and Sözcü, into custody in a raid on his home in Istanbul. Saymaz’s lawyer said the journalist was questioned while in custody about his journalistic activity, contacts, and social media activity while reporting on the Gezi protests, including his communication with some of those convicted on charges of organising the unrest, such as businessman Osman Kavala, lawyer Can Atalay, film producer Çiğdem Mater, and architect Mücella Yapıcı.\n\nOn 21 March, the İstanbul 10th Criminal Judgeship of Peace placed Saymaz under house arrest on the charge of “assisting an attempt to overthrow the government” during the 2013 Gezi Park nationwide protests. A few days before his detention, Saymaz announced that he was banned from traveling abroad and his passport was confiscated."
 Turkey.684.a:0 "Pro-Opposition Journalists Are At The Target"
 Turkey.685.title:0 "TURKSAT 6A"
 Turkey.685.desc:0 "According to an agreement signed on 15 December 2014, the satellite will be developed and manufactured indigenously by specialists under the leadership of TÜBİTAK Space Technologies Research Institute (TÜBİTAK Uzay) in cooperation with Turkish Aerospace Industries (TAI), ASELSAN and CTech Bilişim Teknolojileri A.Ş. TAI will be in charge of design and production of the satellite structure and the subsystems such as spacecraft thermal control, chemical propulsion, harness and mechanical ground equipment needed to support the mission. TAI and TÜBİTAK Uzay will cooperate for the development of the software for satellite on-board data handling as well as for satellite command and control. They will perform the assembly, integration and test activities together at the TAI's Satellite Assembly Integration and Test Facility.\n\nThe satellite was launched on a SpaceX Falcon 9 launch vehicle."
 Turkey.685.a:0 "Good News"
 Turkey.686.title:0 "2025 Istanbul Earthquake"
 Turkey.686.desc:0 "On 23 April 2025 at 12:49:10 TRT, a Mww 6.2 earthquake struck the Sea of Marmara, 28 km (17 mi) southeast of Marmara Ereğlisi, Tekirdağ Province, Turkey, near Istanbul. One person died of a heart attack, 359 others were injured and moderate damage was recorded across the Marmara Region."
 Turkey.686.a:0 "Feeling The Risk?"
 Turkey.687.title:0 "Release Of Umit Ozdag"
 Turkey.687.desc:0 "Ümit Özdağ, chair of the anti-refugee Victory (Zafer) Party, was released from prison today after being sentenced to two years, four months, and three days for “inciting the public to hatred and hostility” under Article 216 of Turkey’s Penal Code. The ruling was delivered by the İstanbul 18th Penal Court of First Instance during a hearing held at the Marmara Prison compound in the Silivri district. Özdağ had been idetained for nearly five months.\n\nThe trial was attended by several political and legal figures, including Ankara Mayor Mansur Yavaş, opposition lawmakers, and the president of the Union of Turkish Bar Associations, Erinç Sağkan. Supporters applauded Özdağ as he entered the courtroom, some singing the national anthem before the session began."
 Turkey.687.a:0 "He Is Out"
 Turkey.688.title:0 "Northern Lights In Turkey"
 Turkey.688.desc:0 "Aurora Borealis observed widely across Türkiye due to geomagnetic storm. The Turkish Space Agency (TUA) has said that the northern lights observed in Türkiye last night were caused by a geomagnetic storm triggered by a solar flare, making it natural to see the northern lights at mid-latitudes."
 Turkey.688.a:0 "Wonderful"
 Turkey.689.title:0 "IYI Party Rlects Müsavat Dervisoglu As New Chairman"
 Turkey.689.desc:0 "The İYİ (Good) Party has elected Müsavat Dervişoğlu as its new chairman during a party congress held in the wake of recent electoral setback. Dervişoğlu, who serves as the party's deputy parliamentary leader and represents İzmir in the parliament, emerged victorious in the leadership election with 611 votes.\n\nThe election on April 27 concluded after three rounds, as no candidate secured an absolute majority in the initial two rounds. His competitor, Koray Aydın, the party's parliamentary head, garnered 548 votes."
 Turkey.689.a:0 "A New Chairman?"
 Turkey.691.title:0 "Erdogan Peaces With Sisi And Makes A Deal"
 Turkey.691.desc:0 "Turkish President Recep Tayyip Erdogan and Egyptian President Abdel Fattah al-Sisi met on Thursday to discuss Syria, Gaza and bilateral relations in their first meeting since the fall of the Syrian regime.\n\nDuring their meeting on the sidelines of the D-8 Organization for Economic Cooperation summit in Cairo, Erdogan pledged continued Turkish support for Syrian unity and the country's reconstruction after 13 years of civil war. Unlike Turkey, the main backer of the Syrian rebels who ousted Bashar al-Assad from power on Dec. 8, the Egyptian government has long-favored Assad over the Islamist-leaning opposition. Assad's fall has raised concerns in Cairo about a potential resurgence of the Muslim Brotherhood, which was removed from power in 2013."
 Turkey.691.a:0 "Alright"
 Turkey.693.title:0 "CHP Rallies Of 2025"
 Turkey.693.desc:0 "Rallies organized by the Republican People’s Party (CHP) to protest the arrest of Istanbul Mayor Ekrem İmamoğlu and demand early elections bring together a wide array of political groups, the main opposition party leader Özgür Özel said on April 24.\n\n"We are experiencing a valuable process where social democrats, socialist democrats, conservative democrats, nationalist democrats and Kurdish democrats stand shoulder to shoulder in the squares," Özel told reporters after visiting the Left Party headquarters in Ankara.\n\nThe CHP delegation led by Özel included deputy leaders Gül Çiftci, Gamze Taşcıer and Yalçın Karatepe, while the Left Party was represented by party spokespersons Önder İşleyen, İsmail Haklı Tombul, Gizem Özdem and İlknur Başer. "This process can be continuous and is Türkiye's hope," Özel said. "As the opposition and millions who voted for the government but do not find what is happening today right, our primary demand is democracy and justice.""
 Turkey.693.a:0 "They Will Resist"
 Turkey.694.title:0 "2025 Turkish Protests"
 Turkey.694.desc:0 "Protests began throughout Turkey on 19 March 2025 following the detention and arrest of Istanbul mayor Ekrem İmamoğlu and more than 100 other opposition members and protesters by Turkish authorities. The gatherings represented significant public opposition to what participants characterized as politically motivated legal actions against İmamoğlu, who was the primary opposition candidate for the 2028 Turkish presidential election and Turkish president Recep Tayyip Erdoğan's main political rival.\n\nThe demonstrations have been supported by the CHP and many other political parties, organizations, and associations. Hundreds of thousands of people are protesting in almost all of Turkey's cities (especially in Istanbul, Ankara and İzmir), with the biggest crowd being in front of the Istanbul Metropolitan Municipality's headquarters. University students are playing a major role in these protests.\n\nThe protesters represent a broad ideological spectrum, including both right and left-wing individuals. In this context, symbols of the Republic—particularly Atatürk—are frequently used as a unifying framework and symbolic point of reference throughout the demonstrations.\n\nThe protests are occurring in the context of an economic crisis. The Turkish lira's value to the U.S. dollar fell by 16.3% in the three days following İmamoğlu's arrest."
 Turkey.694.a:0 "Signs Of General Instability" 
 Turkey.695.title:0 "Sarachane Rallies"
 Turkey.695.desc:0 "Thousands of people gathered in front of the Istanbul Metropolitan Municipality building, part of the amount collected by the CHP in Saraçhane, Istanbul, in the evening. The demonstrators chanted slogans such as "There is no salvation alone, either all together or none of us" and wanted "Government resign."\n\nCHP Chairman Özgür Özel and İmamoğlu's wife, Dilek İmamoğlu, spoke there.\n\nÖzel said, "Today, the will of the people is not being taken away by a judicial coup."\n\nÖzel recalled the primary election to be held on Sunday, March 23rd, to determine the CHP's presidential candidate, a day for which İmamoğlu was the only candidate:\n\n"On Sunday, thousands, tens of thousands, millions, we will all be in the streets, at the ballot box, in the squares. I call on all 86 million... to fight, to rise up.""
 Turkey.695.a:0 "They Are Preparing For The Chaos" 
 Turkey.696.title:0 "Iconic CHP Rally In Yozgat"
 Turkey.696.desc:0 "CHP organised a rally in Yozgat with the participation of thousands of citizens. Farmers organised a convoy with about a thousand tractors before the rally. CHP Chairman Özgür Özel came to the rally area with tractors together with farmers. Ekrem İmamoğlu, the arrested Presidential Candidate of CHP, whose message was read at the rally, underlined early elections and said, "The arbitration of the nation is the cure for every problem." Speaking at the rally, farmer Abdullah Ceylan said, ‘The state is not governed with radish and turnip. It is governed with justice and law." CHP Chairman Özgür Özel said, ‘You are the victim of the past and the oppressor of today Erdoğan. This is not chivalry; this is not bravery. This is a cowardly behaviour," he said."
 Turkey.696.a:0 "Things Are Changing" 
 Turkey.697.title:0 "Central Bank Decreases Interest Rate To 47.5"
 Turkey.697.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday decreased its policy interest rate by 250 basis points to 47.5 percent. This decision shows that some things are getting better the way we want."
 Turkey.697.a:0 "Inflation Is Cooling"
 Turkey.698.title:0 "Central Bank Decreases Interest Rate To 45"
 Turkey.698.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday decreased its policy interest rate by 250 basis points to 45 percent. This decision shows that some things are getting better the way we want."
 Turkey.698.a:0 "Inflation Is Cooling"
 Turkey.699.title:0 "Central Bank Decreases Interest Rate To 42.5"
 Turkey.699.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday decreased its policy interest rate by 250 basis points to 42.5 percent. This decision shows that some things are getting better the way we want."
 Turkey.699.a:0 "Inflation Is Cooling"
 Turkey.700.title:0 "Central Bank Increases Interest Rate To 46"
 Turkey.700.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday increased its policy interest rate by 350 basis points to 46 percent. Events like Ekrem İmamoğlu's arrest have created deep wounds within the Turkish economy. These deep wounds, in turn, have triggered interest rate hikes."
 Turkey.700.a:0 "Another Blow To OVP"
 Turkey.701.title:0 "Central Bank Decreases Interest Falls To 43"
 Turkey.701.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday decreased its policy interest rate by 300 basis points to 43 percent. This decision shows that some things are getting better the way we want."
 Turkey.701.a:0 "Inflation Is Cooling"
 Turkey.702.title:0 "Anti-refugee Riots In Turkey"
 Turkey.702.desc:0 "After rumors of a Syrian refugee sexually assaulting a seven-year-old Syrian girl, (later revealed to be his own cousin) spread on social media, the city of Kayseri erupted into violence. The protests spread to other areas such as Istanbul, Hatay, Adana, Urfa, Bursa, Gaziantep, Konya, İzmir, and Antalya. Protestors waved Turkish flags and made the wolf salute in the streets. Slogans of the protest included "Erdoğan, resign!" and "I do not want refugees in my country."\n\nDozens of properties and vehicles of Syrians were burnt. Fourteen police officers and one firefighter were among those injured in the riots. At a restaurant in Maslak, a Turkish man holding a knife approached a table of Saudi businessmen, including billionaires Khaled al-Fawzan and Ibrahim al-Hadithi, while making slicing motions and the wolf salute. He was later arrested. A 15-year-old Syrian named Ahmed al-Naif died in hospital after being stabbed by three teenagers in Serik."
 Turkey.702.a:0 "Rise Of The Tensions"
 Turkey.703.title:0 "Stabbings In Eskişehir"
 Turkey.703.desc:0 "On August 12, a knife attacker in Eskişehir stabbed civilians and injured five people during a live social media broadcast. After being detained, the suspect was arrested and found to be carrying equipment decorated with Nazi symbols."
 Turkey.703.a:0 "What"
 Turkey.704.title:0 "Erdogan Feyzioglu Debate"
 Turkey.704.desc:0 "Erdoğan interrupted Feyzioğlu's speech, saying, "You're talking wrong." Feyzioğlu asked Erdoğan, "What am I talking wrong about, Mr. Prime Minister?" The Prime Minister then replied, "Such rudeness is unacceptable." Feyzioğlu replied from the podium, "I didn't act rudely, and I wouldn't consider it appropriate to say anyone is rude. It was a very constructive speech."\n\nFollowing this, despite President Gül's attempts to stop him, Erdoğan stood up and said, "You have no such legal right. But unfortunately, we promise such a thing under the bylaws. You're making a political speech, and Mr. President spoke for 25 minutes. You've been talking for an hour. What you said about Van is a complete lie. He's spewing all his spite.""
 Turkey.704.a:0 "Here Is An Argument"
 Turkey.705.title:0 "Wildfire In Bursa"
 Turkey.705.desc:0 "Overnight fires in the forested mountains surrounding Bursa in northwest Turkey spread rapidly, tinting the night sky over the city’s eastern suburbs with a red glow. Dozens of severe wildfires have hit the country daily since late June, with the government declaring two western provinces, Izmir and Bilecik, disaster areas on Friday.\n\nBursa governor’s office said in a statement Sunday that 1,765 people had been safely evacuated from villages to the northeast as more than 1,900 firefighters battled the flames. The highway linking Bursa to the capital, Ankara, was closed as surrounding forests burned."
 Turkey.705.a:0 "Take The Precautions"
 Turkey.706.title:0 "Arrest Of Riza Akpolat"
 Turkey.706.desc:0 "Rıza Akpolat, mayor of Istanbul’s upscale Beşiktaş district from the main opposition Republican People’s Party (CHP), was among 23 arrested early Friday on charges of corruption regarding tenders.\n\nAkpolat and other suspects were detained earlier this week as part of an investigation into rigging allegations that involved the municipality, companies run by municipalities and a businessperson awarded lucrative contracts in Beşiktaş on Istanbul’s European side. That businessperson, Aziz Ihsan Aktaş, was among other arrested suspects after they testified for hours at the courthouse on Thursday. The CHP converged a large crowd outside the Beşiktaş municipality building after the announcement of the arrest of the mayor and claimed the arrest was politically motivated."
 Turkey.706.a:0 "CHP Is Under Pressure"
 Turkey.707.title:0 "Arrest Of Alattin Koseler"
 Turkey.707.desc:0 "A Turkish court has ordered the arrest of Alaattin Köseler, the opposition Republican People’s Party (CHP) mayor of Istanbul’s Beykoz district, on charges of bid rigging and abuse of office. Köseler was detained on February 27, along with 18 others, including his chief of staff, following a police raid on his residence."
 Turkey.707.a:0 "CHP Is Under Pressure"
 Turkey.708.title:0 "Operation Of Trenches"
 Turkey.708.desc:0 "Trench operations are joint military operations conducted by Turkish Security Forces against PKK militants, centered in Sur, Cizre, and Nusaybin. Curfews were imposed in some of the areas where these operations were conducted, and some were declared temporary military security zones. Curfews were lifted in areas where PKK militants were neutralized, trenches were filled, barricades were removed, and security was restored."
 Turkey.708.a:0 "We Should Destroy Them!"
 Turkey.709.title:0 "Fake Diploma Scandal"
 Turkey.709.desc:0 "As Türkiye’s scandal involving fake diplomas and driver’s licenses continues to dominate headlines, Interior Minister Ali Yerlikaya announced on Tuesday that 197 suspects have been apprehended, 37 detained and 150 placed under judicial control in connection with ongoing operations. In a post on his social media account, Yerlikaya provided details about the operations. “In two coordinated operations held simultaneously in 23 provinces on Jan. 7 and in 16 provinces on May 23, a total of 197 suspects were apprehended. Of these, 37 were detained and 150 were placed under judicial control,” Yerlikaya said.\n\nRegarding the production of electronic signatures (e-signatures) with forged documents and illegal access to public systems, Yerlikaya explained that the first wave of operations was conducted by the Ankara Chief Public Prosecutor’s Office. The investigation focused on offenses including “forgery of official documents, violations related to the Measurement, Selection and Placement Center services and unauthorized access to information systems.” The Ankara Cyber Crime Division led the efforts.Yerlikaya added that fake driver’s licenses and Turkish identity cards were used to apply for and produce electronic signatures at branches and offices of electronic certification providers "TÜRKTRUST" and "E-IMZATR" in Adana, Mersin, Hatay, Ankara and Istanbul.\n\nThese e-signatures were then used to gain unauthorized access to public institutions’ systems to carry out illegal activities. On Jan. 7, during a simultaneous operation centered in Ankara and spanning 23 provinces, 126 suspects were arrested and 17 detained."
 Turkey.709.a:0 "What A Disgrace!"
 Turkey.710.title:0 "From The Editor Notes (15.01.2026)"
 Turkey.710.desc:0 "The mod is receiving frequent fix updates these days. We apologize for any inconveniences you may experience. Please feel free to report any issues you encounter with the mod. We'll get back to you quick as possible."
 Turkey.710.a:0 "Happy New Year!"
 Turkey.711.title:0 "Wildfire In Canakkale"
 Turkey.711.desc:0 "A wildfire in the Gelibolu Peninsula in Çanakkale, northwestern Turkey, has led to the partial suspension of maritime traffic through the Dardanelles Strait and evacuation of a couple of villages.\n\nThe fire, which started in the vicinity of Kumköy village in the Eceabat district on Tuesday at around 4.05 pm local time (GMT +3), quickly spread from a field to the forest area, prompting a large-scale response from firefighting teams."
 Turkey.711.a:0 "Looks Bad"
 Turkey.712.title:0 "Balikesir Earthquake"
 Turkey.712.desc:0 "The United States Geological Survey (USGS) reported a magnitude of Mww 6.1. Its epicenter was located 10 km (6.2 mi) south-southwest of Bigadiç in Balıkesir Province. The Kandilli Observatory said that the quake was centered near the districts of Alakır and Sındırgı, and occurred at a depth of 7.7 km (4.8 mi). The earthquake's epicenter lies close to the western end of the Simav fault zone, which is interpreted to be responsible for the 1969 Demirci event."
 Turkey.712.a:0 "What A Catastrophe"
 Turkey.713.title:0 "Aydın Mayor Çerçioğlu Flips Side"
 Turkey.713.desc:0 "The mayor of western Aydın province, Özlem Çerçioğlu, on Thursday announced she has left the main opposition Republican People’s Party (CHP) amid growing disagreements. Özlem Çerçioğlu, who left the CHP, joined the AKP."
 Turkey.713.a:0 "Welcome!"
 Turkey.714.title:0 "Arrest Of Inan Guney"
 Turkey.714.desc:0 "An İstanbul court late yesterday arrested Beyoğlu District Mayor İnan Güney and 16 others as part of an ongoing corruption investigation linked to the opposition-controlled İstanbul Metropolitan Municipality (İBB)."
 Turkey.714.a:0 "CHP Is Under Pressure"
 Turkey.715.title:0 "The Radar Surveillance Scandal"
 Turkey.715.desc:0 "Public outrage has reached a boiling point following the deployment of new ASELSAN-produced radar systems across the nation’s highways. While the government initially touted these as 'national security assets' and 'advanced traffic safety technology,' the truth has become painfully clear to the citizenry: the radars were primarily installed to aggressively monitor and increase traffic fines. The sudden surge in speeding tickets and automated charges has led to accusations that the state is using domestic technology to 'tax' the people through surveillance, leading to a noticeable dip in public stability."
 Turkey.715.a:0 "The New Way Of Revenue?"
 Turkey.716.title:0 "Gebze Structural Catastrophe"
 Turkey.716.desc:0 "The industrial heartland of Gebze has been shaken by a localized disaster. Several high-rise residential and commercial buildings have suffered sudden structural collapses. Preliminary investigations suggest that cost-cutting measures, substandard concrete, and a total lack of municipal oversight are to blame. As families are pulled from the rubble, the public demand for accountability in the construction sector has become deafening. The infrastructure in the region has been severely compromised, requiring immediate state intervention."
 Turkey.716.a:0 "Aman Tanrım!"
 Turkey.717.title:0 "Crimean Convoy Ambush"
 Turkey.717.desc:0 "Russian forces have intercepted and attacked maritime convoys near Crimea. Given our interests and the delicate balance in the Black Sea, this aggression challenges our maritime authority and forces us to reconsider our naval escort policies. While the hawks in Ankara demand an increase in war footing, the diplomatic cost of such a provocation is weighing heavily on our political capital."
 Turkey.717.a:0 "Aghh!"
 Turkey.718.title:0 "Babacan and Şimşek in Dialogue"
 Turkey.718.desc:0 "The economic heavyweights Ali Babacan and Mehmet Şimşek have been spotted in high-level discussions regarding the future of the Turkish economy. Their collaboration suggests a shift toward more orthodox fiscal policies, much to the relief of international markets. While their roadmap promises long-term economic growth and international investor confidence, the political cost of implementing their 'bitter pill' of austerity is immense."
 Turkey.718.a:0 "New Priorities"
 Turkey.719.title:0 "Libyan Jet Crash in Ankara"
 Turkey.719.desc:0 "A Libyan military aircraft on a diplomatic mission has crashed on the outskirts of Ankara. The incident has caused significant diplomatic embarrassment and raised concerns regarding the maintenance of foreign aircraft operating within our airspace. Political support for our overseas military entanglements has taken a sharp hit."
 Turkey.719.a:0 "A Tragic Failure"
 Turkey.720.title:0 "Earthquake Hits Balıkesir"
 Turkey.720.desc:0 "A powerful tremor has rocked the Balıkesir region. While the casualties were limited, the damage to local infrastructure and the power grid is substantial. Reconstruction must begin immediately to prevent a regional economic standstill. The government must divert significant resources to prevent the total collapse of the local economy."
 Turkey.720.a:0 "Mobilize the AFAD"
 Turkey.721.title:0 "Barzani Visits Turkey"
 Turkey.721.desc:0 "Nechirvan Barzani has arrived in Sirnak for a formal visit. The talks focus on regional security, energy pipelines, and the joint effort against cross-border militancy. While the visit confuses regional ties, it remains a sensitive topic for some nationalist circles. The visit has bolstered regional stability but created friction within our party's nationalist base."
 Turkey.721.a:0 "Is This Really Formal?"
 Turkey.722.title:0 "National Dog Parks Initiative"
 Turkey.722.desc:0 "In an effort to modernize urban living and address the concerns of animal lovers, the government has funded the creation of specialized 'Dog Parks' across major cities. While popular with urbanites, some critics argue the funds could have been used elsewhere. However, it has undeniably improved the quality of life for pet owners in the concrete jungles of Istanbul and Ankara."
 Turkey.722.a:0 "Hav Hav Hav!"
 Turkey.723.title:0 "İmamoğlu in Court"
 Turkey.723.desc:0 "Ekrem İmamoğlu has appeared in court once again to face charges. The legal proceedings have drawn massive crowds of supporters to the courthouse, turning a legal matter into a major political rallying point for the opposition. While the government gains a temporary tactical advantage, it is inadvertently boosting his popularity."
 Turkey.723.a:0 "Opposition's Resistance Continues"
 Turkey.724.title:0 "The F-35 Re-entry Negotiations"
 Turkey.724.desc:0 "President Erdoğan has launched a major diplomatic offensive aimed at rejoining the F-35 Joint Strike Fighter program. After years of exclusion following the S-400 purchase, Ankara is attempting to navigate a path back into the Pentagon's good graces. The negotiations are grueling, requiring massive lobbying efforts and significant political concessions. While the Air Force desperately needs the 5th generation capability, the process is draining our political power."
 Turkey.724.a:0 "We Need To Make A U-Maneuver"
 Turkey.725.title:0 "Court's Fatih Altaylı Ruling"
 Turkey.725.desc:0 "The court has delivered its ruling regarding the prominent journalist Fatih Altaylı. The decision has sparked a fierce debate about the freedom of the press and the limits of public criticism against the state. While the ruling satisfies those who find his commentary 'incendiary,' it has unified the opposition media."
 Turkey.725.a:0 "The Press Remains A Battleground"
 Turkey.726.title:0 "The Seizure of GAIN"
 Turkey.726.desc:0 "In a shocking move for the digital media sector, the government has appointed 'Kayyums' (state trustees) to take over the GAIN streaming platform. Citing 'national security concerns,' the state has effectively neutralized one of the last bastions of independent digital content. While this gives the government total control over another powerful media outlet to spread its message, it has further alarmed international investors."
 Turkey.726.a:0 "We Need That!"
 Turkey.727.title:0 "The Question of Gürsel Tekin"
 Turkey.727.desc:0 "Gürsel Tekin's recent public statements have caused a stir within the CHP and the wider political landscape. His critiques of internal party policy have led to a minor drop in the opposition's perceived unity. By publicly questioning the party’s current direction, he has provided the ruling coalition with ample ammunition."
 Turkey.727.a:0 "Internal Rifts Are Showing"
 Turkey.728.title:0 "The Bayrampaşa Crisis"
 Turkey.728.desc:0 "Chaos has erupted in the Bayrampaşa Municipality following a series of controversial administrative decisions involving İbrahim Karaman. The situation escalated rapidly as accusations of political interference and local mismanagement led to public demonstrations and friction between local officials and the central government. While the turmoil in Bayrampaşa has caused local instability, the government’s firm handling of the situation has projected an image of authority to some, while others see it as a democratic setback."
 Turkey.728.a:0 "Whatever!"
 Turkey.729.title:0 "İmralı Visit Controversy"
 Turkey.729.desc:0 "Reports of a recent high-level visit to the İmralı prison complex have leaked to the press. These visits are always politically charged, fueling speculation about a new 'solution process' or a change in security strategy. The government remains tight-lipped, but the mere suggestion of a visit has shifted the political atmosphere."
 Turkey.729.a:0 "#TerörsüzTürkiye"
 Turkey.730.title:0 "Özgür Özel Reelected In Kurultay"
 Turkey.730.desc:0 "Özgür Özel has delivered a powerful speech at the CHP party congress (Kurultay). His message of reform and change has resonated with the party base, strengthening his position as a leader of the opposition. Although the party’s political power is currently spent on internal restructuring, the long-term popularity of the democratic movement is on the rise."
 Turkey.730.a:0 "The Opposition Finds New Ways To Ambush"
 Turkey.731.title:0 "Papa in Volkswagen Arena"
 Turkey.731.desc:0 "In a historic and highly unusual event, the Pope has held a gathering at the Volkswagen Arena in Istanbul. The image of the Catholic leader speaking in a major Turkish stadium has been broadcast worldwide. While it serves as a powerful symbol of Turkey’s commitment to being a bridge between faiths, it has alienated more fundamentalist elements."
 Turkey.731.a:0 "An Olive Branch Between Religions"
 Turkey.732.title:0 "Russian Orlan Drone Incursion"
 Turkey.732.desc:0 "A Russian Orlan-10 drone was recovered after crashing inside our borders. This isn't just a technical failure; it's a blatant violation of our sovereignty. The presence of Russian 'eyes' so deep in our territory has caused a scandal in the Ministry of Defense, leading to a loss of public confidence in our border security."
 Turkey.732.a:0 "Secure The Border"
 Turkey.733.title:0 "Arrest of Sadattin Saran"
 Turkey.733.desc:0 "The prominent businessman and leader of Fenerbahçe, Sadattin Saran has been taken into custody. As a figure with significant influence in both the business and sports worlds, his arrest has sent shockwaves through the private sector. The resulting uncertainty has caused a dip in market stability as investors wait to see who is next."
 Turkey.733.a:0 "It Happens"
 Turkey.734.title:0 "THY Buys Boeing"
 Turkey.734.desc:0 "Turkish Airlines has finalized a massive deal to purchase a new fleet of Boeing aircraft. While this drains the national treasury in the short term, it secures THY's position as a global aviation leader. The treasury has been significantly impacted, but our 'Soft Power' through aviation has never been higher."
 Turkey.734.a:0 "Expanding Our Reach..."
 Turkey.735.title:0 "Rulings of New Quotas"
 Turkey.735.desc:0 "New rulings regarding export and import quotas have been met with stiff resistance from the TOBB lobby. Businesses are struggling to adapt to the new regulations, leading to a dip in industrial stability. Business leaders argue that these quotas are stifling innovation and creating artificial shortages."
 Turkey.735.a:0 "Now Everything Needs Custody!"
 Turkey.736.title:0 "Papa visits Ankara"
 Turkey.736.desc:0 "Following his public appearance in Istanbul, the Pope met with officials at the National Library in Ankara. The visit focused on the preservation of historical manuscripts and cultural dialogue. This high-level diplomacy has greatly boosted our international standing and political prestige."
 Turkey.736.a:0 "Looks Good!"
 Turkey.737.title:0 "CHP Istanbul Issue"
 Turkey.737.desc:0 "Internal administrative disputes within the CHP's Istanbul branch have reached the public eye. Despite the friction, the party's grip on the city's popular sentiment remains strong. While the political power struggle continues to drain resources, the CHP's measures continue to win over the population."
 Turkey.737.a:0 "Opposition Resists!"
 Turkey.738.title:0 "A Scandal In US Visit"
 Turkey.738.desc:0 "The recent diplomatic visit to the United States was overshadowed by a series of gaffes and logistical failures. The resulting media circus has damaged the administration's prestige on the international stage. We have returned home with nothing to show but a significant loss of political power."
 Turkey.738.a:0 "It's A Disaster!"
 Turkey.739.title:0 "Central Bank Decreases Interest Rate To 40.5"
 Turkey.739.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday decreased its policy interest rate by 250 basis points to 40.5 percent. This decision shows that some things are getting better the way we want."
 Turkey.739.a:0 "Inflation Is Cooling"
 Turkey.740.title:0 "Central Bank Decreases Interest Rate To 39.5"
 Turkey.740.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday increased its policy interest rate by 100 basis points to 39.5 percent. This decision shows that some things are getting better the way we want."
 Turkey.740.a:0 "Inflation Is Cooling"
 Turkey.741.title:0 "Central Bank Decreases Interest Rate To 38"
 Turkey.741.desc:0 "The Central Bank of the Republic of Turkey (CBRT) yesterday increased its policy interest rate by 150 basis points to 38 percent. This decision shows that some things are getting better the way we want."
 Turkey.741.a:0 "Inflation Is Cooling"

 ######## Turkish General Staff #######

 TurkeyArms.1.title:0 "Hilmi Özkök Becomes Leader Of General Staff"
 TurkeyArms.1.desc:0 "After years of service and leadership within the Turkish military, General Hilmi Özkök has been appointed as the Chief of the General Staff. His strategic acumen and tactical brilliance have earned him the respect of his peers and superiors alike. As the new General Staff, he now holds the responsibility of guiding the Turkish Armed Forces through these challenging times."
 TurkeyArms.1.a:0 "Military Reorganizes"
 TurkeyArms.2.title:0 "Yaşar Büyükanıt Becomes Leader Of General Staff"
 TurkeyArms.2.desc:0 "In a momentous decision, General Yaşar Büyükanıt has been appointed as the new Chief of the General Staff of the Turkish Armed Forces. His impressive military career and strong leadership qualities have earned him this prestigious position. As the General Staff, he now bears the immense responsibility of safeguarding Turkey's interests."
 TurkeyArms.2.a:0 "Military Reorganizes"
 TurkeyArms.3.title:0 "İlker Başbuğ Becomes Leader Of General Staff"
 TurkeyArms.3.desc:0 "In a significant turn of events, General İlker Başbuğ has assumed the role of Leader of the General Staff of the Turkish Armed Forces. His exceptional military expertise and unwavering dedication to the nation have led him to this prestigious position. As the new leader, he shoulders the crucial responsibility of protecting Turkey."
 TurkeyArms.3.a:0 "Military Reorganizes"
 TurkeyArms.4.title:0 "Işık Koşaner Becomes Leader Of General Staff"
 TurkeyArms.4.desc:0 "In a momentous appointment, General Işık Koşaner has assumed the role of Leader of the General Staff of the Turkish Armed Forces. His illustrious military career and proven leadership capabilities have earned him this esteemed position. As the new leader, he shoulders the critical responsibility of defending Turkey's sovereignty and guiding the nation through the treacherous complexities of global warfare."
 TurkeyArms.4.a:0 "Military Reorganizes"
 TurkeyArms.5.title:0 "Necdet Özel Becomes Leader Of General Staff"
 TurkeyArms.5.desc:0 "In a historic appointment, General Necdet Özel has assumed the mantle of Leader of the General Staff of the Turkish Armed Forces. His distinguished military career and exemplary leadership skills have earned him this prestigious position. As the new leader, he carries the immense responsibility of safeguarding Turkey's interests."
 TurkeyArms.5.a:0 "Military Reorganizes"
 TurkeyArms.6.title:0 "Hulusi Akar Becomes Leader Of General Staff"
 TurkeyArms.6.desc:0 " In a moment of historic significance, General Hulusi Akar has been appointed as the Leader of the General Staff of the Turkish Armed Forces. His distinguished military career and exceptional leadership have earned him this esteemed position."
 TurkeyArms.6.a:0 "Military Reorganizes"
 TurkeyArms.7.title:0 "Yaşar Güler Becomes Leader Of General Staff"
 TurkeyArms.7.desc:0 "In a momentous decision, General Yaşar Güler has been appointed as the Leader of the General Staff of the Turkish Armed Forces. His exceptional military career and strategic brilliance have earned him this prestigious position."
 TurkeyArms.7.a:0 "Military Reorganizes"
 TurkeyArms.8.title:0 "Metin Gürak Becomes Leader Of General Staff"
 TurkeyArms.8.desc:0 "In a momentous turn of events, General Metin Gürak has assumed the position of Leader of the General Staff of the Turkish Armed Forces. His exceptional military career and strategic brilliance have earned him this prestigious role. As the new leader, he shoulders the critical responsibility of safeguarding Turkey's interests."
 TurkeyArms.8.a:0 "Military Reorganizes"

 ######## Turkish Special Events #######

 TurkeyForeign.1.title:0 "Turkish Growing Natural Gas Demand"
 TurkeyForeign.1.desc:0 "With a surge in natural gas demand in Turkey, Russia faces a critical decision on whether to proceed with the construction of the Turkish Stream pipeline. This project aims to address Turkey's growing energy needs and enhance energy cooperation between Russia and Turkey."
 TurkeyForeign.1.b:0 "Plan Our Investments"
 TurkeyForeign.1.a:0 "We Are Not Doing Investments"
 TurkeyForeign.2.title:0 "Russia Offers Turkish Streamline"
 TurkeyForeign.2.desc:0 "Russia presents a comprehensive plan for the Turkish Stream pipeline project to Turkey. The proposal outlines the construction of an offshore pipeline to meet Turkey's increasing natural gas demand and enhance energy cooperation between the two nations."
 TurkeyForeign.2.a:0 "Accept the Russian Proposal"
 TurkeyForeign.2.b:0 "We Don't Need This"
 TurkeyForeign.3.title:0 "Turkey Makes A Deal With GAZPROM"
 TurkeyForeign.3.desc:0 "Turkey and Russia have reached a significant agreement, with Turkey striking a deal with Gazprom, the Russian state-owned energy company. This gas deal involves cooperation in the energy sector, and it has the potential to impact bilateral relations between Turkey and Russia and influence the dynamics in the region."
 TurkeyForeign.3.a:0 "GAZPROM Is Benefitical"
 TurkeyForeign.4.title:0 "Inviting Turkey to Join the Iraq War"
 TurkeyForeign.4.desc:0 "As the United States contemplates its strategy for the Iraq War in 2002, a crucial decision arises regarding the potential invitation of Turkey to join the coalition forces. This event presents the opportunity to assess the advantages and risks associated with Turkey's involvement in the conflict."
 TurkeyForeign.4.a:0 "We Are Better Without Them!"
 TurkeyForeign.4.b:0 "Extend Military Cooperation Invitation"
 TurkeyForeign.6.title:0 "Our Consulate In Turkey Has Attacked!"
 TurkeyForeign.6.desc:0 "A grave incident has occurred in Turkey, with an attack on the our consulate. The situation has escalated tensions and poses a serious threat to diplomatic relations to our relations with Turkey."
 TurkeyForeign.6.a:0 "Such An Incident"
 TurkeyForeign.7.title:0 "Turkish-Russian Crisis: The Downed Jet"
 TurkeyForeign.7.desc:0 "A grave incident has occurred, leading to the shooting down of a Russian military jet by Turkish forces. The event has ignited a diplomatic firestorm and intensified tensions between the two nations."
 TurkeyForeign.7.a:0 "Assert Sovereignty"
 TurkeyForeign.7.b:0 "Apologize and Investigate"
 TurkeyForeign.8.title:0 "Turkey Shuts Down Our Jet"
 TurkeyForeign.8.desc:0 "A Russian military jet has been shot down by Turkish forces, resulting in the loss of valuable assets and personnel. The incident has sparked a crisis, with Russia facing a critical decision on how to respond to this perceived act of aggression."
 TurkeyForeign.8.a:0 "This Is Not Acceptable!"
 TurkeyForeign.9.title:0 "Russian Jet Violates Our Airspace"
 TurkeyForeign.9.desc:0 "A Russian military jet has violated Turkish airspace, trespassing into sovereign territory. The incident has ignited a diplomatic crisis, with Turkey facing a critical decision on how to respond to this provocative act."
 TurkeyForeign.9.a:0 "Shoot It!"
 TurkeyForeign.9.b:0 "Abstain From Any Action"
 TurkeyForeign.10.title:0 "Turkey Asserts Its Position"
 TurkeyForeign.10.desc:0 "In the wake of the recent violation of Turkish airspace by a Russian military jet, Turkey takes a firm stance to assert its sovereignty and protect its territorial integrity. The incident has raised tensions significantly."
 TurkeyForeign.10.a:0 "They Will Pay!"
 TurkeyForeign.10.b:0 "Let's Calm Dawn"
 TurkeyForeign.11.title:0 "Should We Send Ships To Palestine"
 TurkeyForeign.11.desc:0 "Amid ongoing humanitarian concerns in Palestine and the desire to support the people of Gaza, a proposal has arisen within Turkey to send an aid convoy to break the Israeli blockade of the Gaza Strip. The decision to send ships to Palestine is a weighty one, presenting Turkey with significant challenges and implications on the international stage."
 TurkeyForeign.11.a:0 "Sure"
 TurkeyForeign.11.b:0 "Nope"
 TurkeyForeign.12.title:0 "Response to Turkish Ships Sabotaging Blockade: Escalating Tensions"
 TurkeyForeign.12.desc:0 "In light of ongoing attempts by Turkish ships to sabotage the Israeli blockade of the Gaza Strip, Israel faces a critical decision on how to respond to this challenge. The situation poses a significant threat to the enforcement of the blockade and has the potential to escalate tensions between the two nations."
 TurkeyForeign.12.a:0 "Shoot Their Ship!"
 TurkeyForeign.12.b:0 "Abstain From Any Actions"
 TurkeyForeign.13.title:0 "We Need Special SAM Sites"
 TurkeyForeign.13.desc:0 "Turkey faces a crucial decision on acquiring special Surface-to-Air Missile (SAM) systems to bolster its air defense capabilities. The options on the table are the Russian-made S-400 system, the American-made Patriot system, or the choice of not acquiring any of these systems."
 TurkeyForeign.13.a:0 "Order Patriots"
 TurkeyForeign.13.b:0 "Joke? We Don't Need These"
 TurkeyForeign.14.title:0 "United States Reject The Offer"
 TurkeyForeign.14.desc:0 "In a surprising turn of events, the United States has officially rejected Turkey's request to purchase the Patriot missile system. The decision comes amidst heightened tensions in the region and has added strain to Turkey's already complex relationship with the United States, leading to a potential shift in its defense procurement strategy."
 TurkeyForeign.14.b:0 "We Are Not Buying Anything Then"
 TurkeyForeign.14.a:0 "Order S400s"
 TurkeyForeign.15.title:0 "Russia Rejects The Offer"
 TurkeyForeign.15.desc:0 "In a surprising and unexpected move, Russia has officially rejected Turkey's plan to acquire additional S-400 air defense missile systems. The decision comes amidst rising tensions between the two countries and has the potential to strain their bilateral relations further."
 TurkeyForeign.15.a:0 "We Are Not Buying Anything Then"
 TurkeyForeign.16.title:0 "Turkey Wants To Buy Patriots"
 TurkeyForeign.16.desc:0 "In a bid to bolster its defense capabilities and ensure the safety and sovereignty of its nation, Turkey has expressed a keen interest in acquiring the cutting-edge Patriot missiles from the United States of America. This strategic move comes amid rising regional tensions and an evolving security landscape."
 TurkeyForeign.16.a:0 "Sell These"
 TurkeyForeign.16.b:0 "We Are Not Selling These"
 TurkeyForeign.17.title:0 "Turkey Wants To Buy S400"
 TurkeyForeign.17.desc:0 "In a move that has sparked international attention and raised concerns among its NATO allies, Turkey has expressed a desire to purchase the sophisticated S-400 air defense missile system from Russia. This decision comes amidst shifting geopolitical dynamics and has further strained Turkey's relations with its Western partners."
 TurkeyForeign.17.a:0 "Time To Disrupt The West"
 TurkeyForeign.17.b:0 "We Are Not Selling These"
 TurkeyForeign.18.title:0 "Perincek Manages To Control Of Turkey"
 TurkeyForeign.18.desc:0 "Following a series of political upheavals and a popular mandate, the charismatic and visionary politician Doğu Perinçek has risen to power in Turkey. His ascent to leadership marks a significant turning point in the nation's history, and he seeks to establish a new era of cooperation and friendship with other nations."
 TurkeyForeign.18.a:0 "Interesting"

