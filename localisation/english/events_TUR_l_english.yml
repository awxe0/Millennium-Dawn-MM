 TurkeyF.193.title:0 "European Adaption Chapter: 1"
 TurkeyF.193.desc:0 "We have completed the first chapter of the European Union Turkey Integration. We are now halfway through the accession process to the European Union. Wait for us, European Union!" 
 TurkeyF.193.a:0 "Good!" 
 TurkeyF.194.title:0 "European Adaption Chapter: 2"
 TurkeyF.194.desc:0 "We have completed the second chapter of the European Union Turkey Integration. We have now completed the accession process to the European Union. A new beginning is coming for Turkey!" 
 TurkeyF.194.a:0 "For The European Membership!" 
 TurkeyF.195.title:0 "NATO-Georgia Integration"
 TurkeyF.195.desc:0 "NATO forces, which foresee that Russia will be able to launch an armed attack on Georgia as a result of the rapid arming of the Russians, will jointly support Georgia for its defense." 
 TurkeyF.195.a:0 "United Against Russian Imperialism" 
