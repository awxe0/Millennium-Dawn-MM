 TurkeyF.185.desc:0 "The conflict with the Turks was bloody. The Turks are now offering us peace. If we leave the Caucasus alone, they will come out of the war and leave the territories. Sir, what kind of response should we make to a peace proposal like this?" 
 TurkeyF.185.a:0 "Fine, We Will Withdrawal" 
