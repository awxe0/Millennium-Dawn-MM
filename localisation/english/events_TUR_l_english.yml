 ###### Turkish News #######
 Turkey_news.1.t:0 "Gezi Park Protests"
 Turkey_news.1.d:0 "A wave of demonstrations and civil unrest in Turkey began on 28 May 2013, initially to contest the urban development plan for Istanbul's Taksim Gezi Park. The protests were sparked by outrage at the violent eviction of a sit-in at the park protesting the plan. Subsequently, supporting protests and strikes took place across Turkey, protesting a wide range of concerns at the core of which were issues of freedom of the press, expression, and assembly, as well as the Islamist government's erosion of Turkey's secularism. With no centralized leadership beyond the small assembly that organized the original environmental protest, the protests have been compared to the Occupy movement and the May 1968 events. Social media played a key part in the protests, not least because much of the Turkish media downplayed the protests, particularly in the early stages. Three and a half million people are estimated to have taken an active part in almost 5,000 demonstrations across Turkey connected with the original Gezi Park protest. Twenty-two people were killed and more than 8,000 were injured, many critically.\n\n"
 Turkey_news.1.a:0 "Protests in Turkey? Interesting"
 Turkey_news.2.t:0 "Turkish Coup Attempt Has Been Failed"
 Turkey_news.2.d:0 "The coup d'état was attempted in Turkey against state institutions, including the government and President Recep Tayyip Erdoğan.  The attempt was carried out by a faction within the Turkish Armed Forces that organized themselves as the Peace at Home Council- whose members have never been identified. They attempted to seize control of several unimportant places in Ankara, Istanbul, Marmaris, and elsewhere, such as the Asian side entrance of the Bosphorus Bridge but failed to do so after forces loyal to the state defeated them. The Council cited an erosion of secularism, elimination of democratic rule, disregard for human rights, and Turkey's loss of credibility in the international arena as reasons for the coup. The government said the coup leaders were linked to the Gülen movement, which is designated as a terrorist organization by the Republic of Turkey and led by Fethullah Gülen, a Turkish businessman and cleric who lives in Pennsylvania. The Turkish government alleged that Gülen was behind the coup (which Gülen denied) and that the United States was harboring him. "
 Turkey_news.2.a:0 "Erdogan Wins..."
 Turkey_news.3.t:0 "Turkey Decided To Buy S400"
 Turkey_news.3.d:0 "After the United States did not respond positively to the request of its ally Turkey for the Patriot missile defense system, Ankara, turning to different alternatives, evaluated Russia's attractive offer and decided to buy the S-400 air defense system. \n\nTurkey, whose security needs, especially in the Syrian war, are growing every day and its airspace is open to threats, has turned to create its own air defense systems because it is not supported by its NATO allies."
 Turkey_news.3.a:0 "Interesting"
 Turkey_news.4.t:0 "Turkey Threatens Europe With Immigration Wave"
 Turkey_news.4.d:0 "The Turkish offensive into north-eastern Syria began. Within the first week and a half 130,000 people were displaced. On 10 October it was reported that President Erdoğan had threatened to send "millions" of Syrian refugees to Europe in response to criticism of his military offensive into Kurdish-controlled northern Syria. On 27 February 2020, a senior Turkish official said Turkish police, coast guard, and border security officials had received orders to no longer stop refugees' land and sea crossings to Europe."
 Turkey_news.4.a:0 "Bad Times For The EU"
 Turkey_news.5.t:0 "Lira is losing its power"
 Turkey_news.5.d:0 "The dollar rose against the lira after the United States sanctions. In the face of this rise, Turkey could do nothing but increase interest rates. As the dollar rose, the Turkish economy became weak and the Erdogan supporters began to decline."
 Turkey_news.5.a:0 "Uncertain Times"
 Turkey_news.6.t:0 "Turkish Expansionism"
 Turkey_news.6.d:0 "After a long time, Turkey militarized itself from behind. As a result of militarization, the Turks began to expand their territory. \n\nAs a result of the expansion, Turkish relations with countries in the region deteriorated, and World tension rose."
 Turkey_news.6.a:0 "Militarism results with expansionism"
 Turkey_news.7.t:0 "Turkish 2001 Economic Crisis"
 Turkey_news.7.d:0 "On February 19, 2001, Prime Minister Ecevit emerged from a meeting with President Sezer saying, "This is a serious crisis." This underscored financial and political instability and led to further panic in the markets. Stocks plummeted and the interest rate reached 3,000%. Large quantities of Turkish lira were exchanged for U.S. dollars or euros, causing the Turkish central bank to lose $5 billion of its reserves. The crash triggered even more economic turmoil. In the first eight months of 2001, 14,875 jobs were lost, the dollar rose to 1,500,000 liras, and income inequality had risen from its already high level."
 Turkey_news.7.a:0 "Uncertain Times"
 Turkey_news.8.t:0 "Turkish Civil War"
 Turkey_news.8.d:0 "After the coup in Turkey, Kemalists and Erdogan forces, which clashed against the coup plotters, gained power in large parts of Turkey. The coup plotters fled to the Marmara line after intense fighting. \n\nThe fact that the coup plotters fought intensively was proof that the Civil War was emerging in Turkey."
 Turkey_news.8.a:0 "Uncertain Times"
 Turkey_news.9.t:0 "Turkish Military Coup"
 Turkey_news.9.d:0 "As the economy and corruption grew behind, the Turkish Armed Forces took over. About 223 people were arrested. In the attempted coup, 2 guards were killed. In Turkey, the army stated that it would leave the administration at any time and that they were extremely committed to the principles of Ataturk."
 Turkey_news.9.a:0 "Uncertain Times"
 Turkey_news.10.t:0 "Rise Of Covid-19"
 Turkey_news.10.d:0 "Coronavirus disease 2019 (COVID-19) is a contagious disease caused by severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2). The first case was identified in Wuhan, China, in December 2019. The disease has since spread worldwide, leading to an ongoing pandemic. \n\nOf course, this event will cause high damage to the economies of the world."
 Turkey_news.10.a:0 "Difficult days ahead"
 Turkey_news.11.t:0 "Clashes On The Karabakh"
 Turkey_news.11.d:0 "Clashes began on the morning of 27 September 2020 along the Nagorno-Karabakh Line of Contact, which had been established in the aftermath of the First Nagorno-Karabakh War (1988–1994). In response, Armenia and Artsakh introduced martial law and total mobilization, while Azerbaijan introduced martial law, a curfew, and partial mobilization. Turkey provided military support to Azerbaijan, although the extent of this support has been disputed. Turkey's involvement is thought to have been an attempt to extend its sphere of influence, both by increasing the standing of Azerbaijan in the conflict and by marginalizing Russia's influence over the region."
 Turkey_news.11.a:0 "Get in the bunkers"
 Turkey_news.12.t:0 "Turkish Civil War Ends"
 Turkey_news.12.d:0 "The civil war in the country has long since ended. The cities suffered heavy damage as a result of the Civil War. With the end of the war, Turkey can now begin to restore its cities. Restoration will certainly strain the country's economy."
 Turkey_news.12.a:0 "Peace arrives in Turkey"
 Turkey_news.13.t:0 "Azerbaijan Joins Turkey"
 Turkey_news.13.d:0 "As a result of Turkey's good relations with Azerbaijan, the two countries decided to merge. The merger will contribute to the two countries. This merger could be a big, general step for the Turkish Union. Strength comes from Unity."
 Turkey_news.13.a:0 "Interesting"
 Turkey_news.14.t:0 "Unification Of The Turks"
 Turkey_news.14.d:0 "The Turks decided to unite and formed the Turan Union. The Turan Union decided that the capital should be Ankara, the currency should be Turkish currency and the country should use the same language. The Turkish opposition did not even make a voice against the Turan Union but rather supported it. In this case, it caused the newly formed union to become tighter. The formation of the Turan Union changed the balance in the world. It seems that Russia and China will not be happy with this situation."
 Turkey_news.14.a:0 "Strength comes from Unity"
 Turkey_news.15.t:0 "The Ottoman Sultanate is Reborn"
 Turkey_news.15.d:1 "Much to the entire world’s dismay, the Ottoman Sultan has been restored to his throne after a particularly brutal civil war between the country’s coup plotters and its secularist Kemalists. In an extravagant ceremony that seemed straight out of the Medieval Ages, the Sultan was restored to his former position and Mustafa Kemal Atatürk’s republic was dissolved forever. \n\n[TUR.GetLeader] addressed his newly reborn sultanate, expressing a mix of surprise and humility over the fact that he was restored to his old station. The new Sultan is a mild-mannered man but is surrounded by a court of warmongers and irredentists. Experts, who never believed the Sultan's return was even possible, are clueless as to what the future could hold."
 Turkey_news.15.a:1 "Alhamdulillah!"
 Turkey_news.16.t:0 "The Islamic Republic Of Turkey has been declared"
 Turkey_news.16.d:1 "After the coup d'état in Turkey completely took over the administration, they created the Islamic Republic that was affiliated with the United States. Unrest in the country has reached hat levels. As a result of the situation, the secularists began to become guerrillas."
 Turkey_news.16.a:1 "Alhamdulillah!"
 Turkey_news.17.t:0 "The Great Turkish Civil War"
 Turkey_news.17.d:1 "With the harsh pressure shown by the police, demonstrators and workers began to arm themselves and eventually began to open fire on the police. The streets are a bloodbath. Troops began to be dispatched to the areas. The partisans formed in a certain local region united and officially invaded the west of Turkey and established a new regime there. The goal of this front, called the Liberation Front, is to rid the country of the capitalist order.\n\nIt has been announced that the current Turkish regime will be supported by NATO. Russia has said it will support the Liberation Front."
 Turkey_news.17.a:1 "Une Nouvelle Révolution"
 Turkey_news.18.t:0 "Turkey Joins Copenhagen Criterias"
 Turkey_news.18.d:1 "Turkey in recent years, governments have adopted the Constitution and it has made very extensive changes and innovations in the law, and this change and it has put innovations into effect. Finally, the Customs Union agreement for Europe 10 new countries has been added to the Union. Copenhagen from the point of view of Turkey despite the fact that its political criteria come to the fore, the implementation of the Copenhagen economic criteriathe adoption of the law is important from the point of view of the realization of Turkey's full membership in the European Union which was carrying essentially, full membership, which will start on October 3, 2005, an important part of the 35 main issues that will be covered by the negotiations is economic issues poses. The Copenhagen economic criteria mainly cover two main economic aspectsit covers."
 Turkey_news.18.a:1 "Liberalization of Markets"
 Turkey_news.19.t:0 "2008 Great Recession"
 Turkey_news.19.d:1 "The Great Recession was a period of marked general decline (recession) observed in national economies globally that occurred between 2007 and 2009. The scale and timing of the recession varied from country to country (see map).[1][2] At the time, the International Monetary Fund (IMF) concluded that it was the most severe economic and financial meltdown since the Great Depression. One result was a serious disruption of normal international relations.\n\nThe causes of the Great Recession include a combination of vulnerabilities that developed in the financial system, along with a series of triggering events that began with the bursting of the United States housing bubble in 2005–2012."
 Turkey_news.19.a:1 "Mortgage Show"
 Turkey_news.20.t:0 "Lehman Brothers Fell In Bankruptcy"
 Turkey_news.20.d:1 "On September 15, 2008, the firm filed for Chapter 11 bankruptcy protection following the exodus of most of its clients, drastic losses in its stock, and devaluation of assets by credit rating agencies, largely sparked by a loss of confidence, Lehman's involvement in the subprime mortgage crisis, and its exposure to less liquid assets. Lehman's bankruptcy filing was the largest in US history and is thought to have played a major role in the unfolding of the financial crisis of 2007–2008. The market collapse also gave support to the "Too big to fail" doctrine."
 Turkey_news.20.a:1 "Tschüss!"
 Turkey_news.21.t:0 "ISE Is In Desprate"
 Turkey_news.21.d:1 "The Istanbul Stock Exchange is preparing to put the worst year in its history behind it. the ISE, which lost 52.4 percent in 2008, will have made its biggest annual decline at this rate. One of the country's stock markets that was hit hardest by the global crisis in all world markets was the ISE. the stock market, which completed 2007 with a 42 percent premium, experienced a complete nightmare in 2008. The stock market, which started the new year at 55 thousand 538 points, declined to 26 thousand 411 points compared to yesterday's close. Thus, the annual loss of the stock exchange was recorded as 52.4 percent. Looking at the stock market's performance in other years, it is noteworthy that there has never been such a high loss. in our research starting from 1988, we found that the biggest loss after 2008 was experienced by 45 percent in 1988. The ISE lost 38 percent of its value in 2000, followed by 24.76 percent in 2002 and 24.72 percent in 1998."
 Turkey_news.21.a:1 "Do You Have Cigarette?"
 Turkey_news.22.t:0 "Mavi Marmara Crisis"
 Turkey_news.22.d:1 "The Israeli government decided on July 23, 2010, to release the three ships of the Gaza Freedom flotilla, two of which had been moored at the Port of Haifa and the third at the Port of Ashdod since their interception. Three Turkish tugboats were dispatched to bring the ships back to Turkey. The Mavi Marmara was towed by the Ocean Ergun in a two-day ride to the Port of Iskenderun, arriving on August 7, 2010. Nobody was permitted to board the Mavi Marmara due to investigations underway by the public prosecutor, but broken windows and bullet holes in the glass of the pilothouse were visible in pictures released. The IHH emblem on the ship's port side was painted over in white. According to Turkish news, forensic teams identified some 250 bullet holes in the ship, many of which they claim were painted or plastered over by Israel. The ship returned to Istanbul harbor on December 26, 2010, in a welcoming ceremony attended by thousands"
 Turkey_news.22.a:1 "Imperialism At The Corner"
 Turkey_news.23.t:0 "Legacy Of Ecevit"
 Turkey_news.23.d:1 "The State of the Republic of Turkey is showing a backward return to its traditions. Ecevit's party is again trying to save something. It seems that Turkish heroism and aggressiveness will increase soon. According to the American Foreign Affairs statement, Turkey's bad move will result in sanctions first, and then if another mistake is made, war will be opened, especially if America is uncomfortable with this situation. The American military is expected to conduct exercises in Alexandroupoli."
 Turkey_news.23.a:1 "Long Live Turkish Heroism!"
 Turkey_news.24.t:0 "Turkish Gateway Project Succeded"
 Turkey_news.24.d:1 "The State of the Republic of Turkey has announced that it has completed the Turkish transit lines project by making its plans and necessary investments. Thus, Turkey has become a major transit region. The fact that trade will now pass through this country will make a significant contribution to the country's economy. Turkey is developing rapidly."
 Turkey_news.24.a:1 "What A Trade Route!"
 Turkey_news.25.t:0 "Rise Of Heleno-Turkism"
 Turkey_news.25.d:1 "The ideals of Heleno-Turkism took power in Turkey. After this change has been observed in Turkey, the same is expected to be seen in Greece. It seems that the enmity between the two hostile countries is coming to an end. This will offend the nationalists of the two countries, and especially Russia. To add According to endorsers, a bilingual "Greek Turkish Confederation" (East Mediterranean Confederation) between Greece, Turkey, and Cyprus (with national capitals in Athens, Ankara, and Nicosia, and Confederation parliament in Istanbul) would (to an extent) be a reincarnation of the Byzantine/Ottoman Empires; thus filling the political, cultural and economic vacuum that's left behind by the absence of these two historic superpowers in the East Mediterranean region. It would have the largest economy and military in the area covering the Balkans, the Middle East, the East Mediterranean, the Caucasus, and Central Asia, and become one of the key global great powers due to its geographic location."
 Turkey_news.25.a:1 "What!"
 Turkey_news.26.t:0 "First Mafiotic Seize"
 Turkey_news.26.d:1 "As a result of a long struggle, the mafias seized power in Turkey. This situation has affected the world. \n\nDoubts in people are growing. Criminal cases will increase as mafias take power, and general crimes will increase in context. We hope that the United Nations and world organizations will be able to overcome this mafiotic situation."
 Turkey_news.26.a:1 "Oh Dear"
 Turkey_news.27.t:0 "Organization Of Islamic Cooperation Turns Real"
 Turkey_news.27.d:1 "Islamic Cooperation has been developing recently due to he decision to unite and become stronger. \n\nTogether with this decision, American anti-semitic demonstrations have risen. Now the Islamic world is the only voice this will oppose American influence and protect its territory from invaders it'll save itself against non Muslims."
 Turkey_news.27.a:1 "Islam Find Itself United"
 Turkey_news.28.t:0 "IMF Gets Controlled By Anarchists"
 Turkey_news.28.d:1 "The control of the IMF passed into the hands of anarchists, and the world countries have accepted this situation. Because the states of the world believe that these anarchists will manage the IMF more systematically. \n\nThe world meets Anarcho-Capitalism for the first time they want to take advantage of its blessings. What will the future? Time would show us."
 Turkey_news.28.a:1 "International Anarchism?"
 Turkey_news.29.t:0 "A Nato Country Turning To A Russian Ally?"
 Turkey_news.29.d:1 " On July 31, the deadline the United States set for Turkey to abandon its deal with Russia for the S-400 missile system expired. \n\nAs Ankara continues its efforts to negotiate with Washington and convince it not to impose sanctions, pundits in the West have started to talk about a major shift in Turkish foreign policy. Some have gone as far as to suggest that Turkey has “turned its back on the US” and is gravitating closer to Russia."
 Turkey_news.29.a:1 "An Incident"
 Turkey_news.30.t:0 "Andrew Brunson Sends Back To USA"
 Turkey_news.30.d:1 "Evangelical Christians in the US swiftly took up his case, saying the accusations made against him were baseless and he was being detained and persecuted for his religious faith. The American Center for Law and Justice, a conservative Christian organization, lobbied the White House and others over Brunson. It launched a petition in support of the pastor which declared that “Christianity is on trial”. Almost 600,000 people have signed it. \n\nTrump’s first tweet about Brunson, posted in April, said: “Pastor Andrew Brunson, a fine gentleman and Christian leader in the United States, is on trial and being persecuted in Turkey for no reason. They call him a Spy, but I am more a Spy than he is. Hopefully, he will be allowed to come home to his beautiful family where he belongs!”"
 Turkey_news.30.a:1 "What A Tragedy!"
 Turkey_news.31.t:0 "Turkish Civil War"
 Turkey_news.31.d:1 "Tensions in Turkey are rising because of the legitimate power of the communists received by the election results, as these election results made right-wing unhappy, they took to the streets and rebelled by starting a civil war. This right wing organization was officially funded by ulkist nationalists, this explains they are way too strong. \n\nExpectations are that the conflicts are going to continue for a long time and the communists are expected to achieve victory."
 Turkey_news.31.a:1 "Vatan Harpte!"
 Turkey_news.32.t:0 "First Anarchist Takeover"
 Turkey_news.32.d:1 "The arrival of the anarchist revolution took place in Turkey, and this situation resonated throughout the world. \n\nThere may be a spread of anarchism all over the world. If such a thing were to happen, who would be left alive? This revolution makes people shudder violently."
 Turkey_news.32.a:1 "Start Of A Which Hunt"
 Turkey_news.33.t:0 "ILLUMINATI CONFIRMED"
 Turkey_news.33.d:1 ""
 Turkey_news.33.a:1 "YOU'RE DEAD MAN"
 Turkey_news.34.t:0 "Swedish-Turkish Political Crisis"
 Turkey_news.34.d:1 " Turkey has strongly criticized the Koran-burning incident in Switzerland. Erdogan, on the other hand, said that Sweden should not be admitted to NATO. In Sweden, the Danish Right-wing Paludan, who carried out a Koran-burning action, received reactions from the Islamic World, and actions were held in front of various Swedish consulates. Some said that it would take a long time for the tension in Sweden to pass."
 Turkey_news.34.a:1 "Oh Dear,"
 Turkey_news.35.t:0 "Constitutional Government Takes Over Turkey"
 Turkey_news.35.d:1 "An unexpected event took place in Turkey. The Constitutional Court in Turkey revolted against the Turkish Armed Forces and the government. As a result of the uprising, the Constitutional Court seized the legislative, executive, and judicial powers. The order in the army, on the other hand, was thrown into disarray. The General Court asked citizens to be calm and emphasized Atatürk's principles of justice. NATO and the European Union, on the other hand, supported the court's move in Turkey."
 Turkey_news.35.a:1 "This Is Not Expected"
 Turkey_news.36.t:0 "Kahramanmaraş 7.7 and 7.6 Earthquakes"
 Turkey_news.36.d:1 "On February 6, round 4:15 a.m. local time, a magnitude 7.8 earthquake struck south-central Turkey (Türkiye) near the Turkey/Syria border. Just 11 minutes later, it was followed by a magnitude 6.7 aftershock. The largest aftershock at the time of writing was a M7.5 aftershock which struck 95 km (~60 miles) to the north. USGS observations and analyses indicate all these events are occurring within the East Anatolian fault system.\n\nThe two largest earthquakes in the recent series are relatively shallow, with the mainshock 18 kilometers, or 11 miles, deep and the 7.5 magnitude aftershock at 10 kilometers (just over 6 miles) deep. Because the quakes are relatively shallow, the intensity of the shaking is severe."
 Turkey_news.36.a:1 "May The Heavens Help"
 Turkey_news.37.t:0 "Kilicdaroglu Becomes The Candidate Of Opposition"
 Turkey_news.37.d:1 "Turkish opposition leader Kemal Kilicdaroglu emerged on Monday as the main challenger to President Tayyip Erdogan in landmark elections expected on May 14, after a six-party alliance picked him as expected as its presidential candidate.\n\nKilicdaroglu, 74, head of the country's second-biggest party, aims to emerge from Erdogan's shadow and oust the president after a two-decade reign that has transformed the NATO member country and major emerging market economy."Our table is the table of peace. Our only goal is to take the country to days of prosperity, peace and joy," Kilicdaroglu, chairman of the Republican People's Party (CHP), told about 2,000 people gathered in Ankara."
 Turkey_news.37.a:1 "Interesting"
 Turkey_news.38.t:0 "Victory Of The Muharrem Ince In 2023"
 Turkey_news.38.d:1 "Muharrem Ince became the masterpiece of the end of a long-lasting power. The AK Party government, which lasted for about 20 years, has ended its life. On the day of the election, there was enthusiasm around Muharrem Ince, now he would become the president of this country by defeating his strong rivals Recep Tayyip Erdogan, Kemal Kilicdaroglu and Sinan Ogan. It is expected that there will be an uncertainty in the environment after the end of the long-lasting AK Party regime. If the expected things do not happen, the situation will be fine."
 Turkey_news.38.a:1 "Very Interesting"
 Turkey_news.39.t:0 "Victory Of The Sinan Ogan In 2023"
 Turkey_news.39.d:1 "Muharrem Ince became the masterpiece of the end of a long-lasting power. The AK Party government, which lasted for about 20 years, has ended its life. On the day of the election, there was enthusiasm around Muharrem Ince, now he would become the president of this country by defeating his strong rivals Recep Tayyip Erdogan, Kemal Kilicdaroglu and Sinan Ogan. It is expected that there will be an uncertainty in the environment after the end of the long-lasting AK Party regime. If the expected things do not happen, the situation will be fine also Sinan Ogan's coming to power opened up another issue. What will happen to refugees now? As promised, will refugees be expelled from the country without taking into account the European Union?"
 Turkey_news.39.a:1 "Very Interesting"
 Turkey_news.40.t:0 "Victory Of The Erdogan In 2023"
 Turkey_news.40.d:1 "According to inconclusive results, President Recep Tayyip Erdogan was re-elected with 52 percent of the votes. President Recep Tayyip Erdogan, after the election victory, makes the "balcony speech" that he has made a tradition at the Presidential Complex in Beştepe. Erdogan began his speech by singing the song "To those who hear not to those who hear", which he often sang at his rallies during the campaign. The crowd gathered in Beştepe chanted slogans "Here is the army, here is the commander".\n\nErdogan said, "You have not embarrassed the People's Alliance, you have not left it alone. We walked this road together. We walked day and night without saying, and you gave us this task again. God willing, we are continuing to build and revive the Turkish Century together," he said."
 Turkey_news.40.a:1 "Very Interesting §Y(With No Speech)§!"
 Turkey_news.40.b:1 "Long Live The Recep Tayyip Erdogan"
 Turkey_news.41.t:0 "Victory Of The Kilicdaroglu In 2023"
 Turkey_news.41.d:1 "An unexpected turn of events unfolded in the Turkish elections as Kemal Kilicdaroglu, the leader of the Republican People's Party (CHP), emerged as the victor. Kilicdaroglu's win signals a dramatic shift in Turkey's political landscape, promising a new era of unity, reform, and inclusive governance.\n\nIn a closely contested race, Kilicdaroglu's campaign gained momentum with his message of national unity and social justice. The electorate, yearning for a change from the prevailing political polarization, responded favorably to his inclusive approach, ultimately propelling him to victory."
 Turkey_news.41.a:1 "Very Interesting"
 Turkey_news.42.t:0 "Return Of The Ataturk"
 Turkey_news.42.d:1 "It turned out that Mustafa Kemal Ataturk lived, this is an unbelievable situation. Scientists were baffled. Did God reveal Ataturk from behind because he had pity on the Turks? The return of Mustafa Kemal Ataturk caused tension in Greece and Armenia. The same way in Syria. Mustafa Kemal Ataturk is also expected to take over the country and make a lot of reforms. Turkey hopes to break a little from the extreme understanding of the European Union and achieve free democratic economic development under the supreme leadership of Ataturk."
 Turkey_news.42.a:1 "Its Impossible"
 Turkey_news.43.t:0 "North Kurdistan Joins Turkey"
 Turkey_news.43.d:1 "In a surprising move, the autonomous region of North Kurdistan has decided to join Turkey as a fully integrated province. The decision comes after months of negotiations between the Kurdish government and Turkish officials, with both sides agreeing to a series of terms and conditions for the merger. Under the terms of the agreement, North Kurdistan will become the 82nd province of Turkey, with its own governor and administrative structure. The Kurdish language will be recognized as an official language alongside Turkish, and the Kurdish population will enjoy full citizenship rights and representation in the Turkish parliament. The decision has been met with mixed reactions in the region, with some Kurdish nationalists denouncing it as a betrayal of their cause for independence. Others, however, see it as a step towards greater unity and cooperation between Kurds and Turks, and hope that it will lead to greater stability and prosperity for the region as a whole."
 Turkey_news.43.a:1 "It's Impossible"
 Turkey_news.44.t:0 "Assasination Of Gulen"
 Turkey_news.44.d:1 "In a shocking turn of events, Fethullah Gulen, the controversial Turkish cleric, failled to escape an alleged assassination attempt earlier today. The incident occurred at Gulen's residence, where unidentified assailants infiltrated the premises with the apparent intention of taking his life. However, Gulen's security personnel swiftly intervened, managing to thwart the attackers and ensure his safety. As investigations continue, the world watches closely to see how this latest development will impact the already complex relationship between Turkey and the United States. The incident serves as a reminder of the ongoing power struggles, political tensions, and controversies surrounding Fethullah Gulen and his movement."
 Turkey_news.44.a:1 "Oh Dear"
 Turkey_news.45.t:0 "The Operation Blueskirmish"
 Turkey_news.45.d:1 "In a surprising move, the United States and NATO governments has declared its intention to intervene in the ongoing Turkish Civil War, with a primary focus on providing NATO aid and promoting peace in the region. The decision comes after months of careful deliberation and extensive diplomatic efforts to address the escalating political crisis and widespread suffering caused by the conflict.\n\nAs the Turkish Civil War rages on, the toll on civilian lives and infrastructure continues to mount. Reports of widespread displacement, food shortages, and a lack of medical supplies have drawn international attention and concern. The United States and NATO, acknowledging the urgency of the situation, has committed itself to assist in alleviating the suffering and restoring stability to the war-torn country."
 Turkey_news.45.a:1 "United States Bringing Freedom Again"
 Turkey_news.46.t:0 "Russia Smashes Operation Blueskirmish"
 Turkey_news.46.d:1 "In a concerning turn of events, Russia has expressed its deep concerns over the intervention of the United States and NATO in the ongoing Turkish Civil War. Amidst the escalating conflict, Russian officials have warned that the involvement of foreign powers could have far-reaching consequences, potentially impacting critical international waterways such as the Turkish Straits.\n\nAs tensions rise, reports confirm that Russian troops, backed by armored vehicles and air support, have crossed into Straits. The move is seen as a show of force and a clear message from Russia that it will not tolerate what it perceives as encroachment on its sphere of influence. The situation has raised fears of a potential escalation in the conflict, with the potential for a broader regional confrontation."
 Turkey_news.46.a:1 "Tensions Are Escalating"
 Turkey_news.47.t:0 "SADAT-Led Tank Convoy March Attempts to Topple Government"
 Turkey_news.47.d:1 "In an unprecedented turn of events, Turkey plunged into turmoil as an attempted coup d'état, organized by a group linked to SADAT, an independent defense consultancy, sought to topple the government led by MIT (Hakan Fidan and Fahrettin Altun). The Turkish state faced unexpected challenges as the coup plotters orchestrated a tank convoy march towards Ankara, threatening the nation's democratic institutions. The attempted coup sent shockwaves across the nation and raised concerns among the international community about the potential consequences of a successful overthrow."
 Turkey_news.47.a:1 "SADAT Marchs"
 Turkey_news.48.t:0 "HP's Technocratic Referendum Triumph"
 Turkey_news.48.d:1 "Turkey finds itself navigating uncharted waters after the Technocratic Party (Halkin Partisi - HP) achieved a resounding victory in the technocratic referendum, signaling a paradigm shift in the nation's governance. While HP's success in the referendum showcases a public mandate for evidence-based decision-making, the aftermath has revealed a series of unforeseen challenges and societal complexities that have left the nation grappling for solutions. The referendum results, which secured a majority in favor of HP's technocratic vision, reflected a growing sentiment among Turkish citizens for a government guided by experts and data-driven policies. HP's promises of efficiency, progress, and effective problem-solving resonated with voters looking for alternative solutions to pressing issues."
 Turkey_news.48.a:1 "Technocratic Take Over?"
 Turkey_news.49.t:0 "Turkish Civil War"
 Turkey_news.49.d:1 "Turkey has descended into a state of chaos as a fierce civil war erupts between powerful mafia groups and government forces under the leadership of MIT Chief Hakan Fidan. The nation finds itself at the brink of destruction as violent clashes between the warring factions spread across major cities, leaving a trail of devastation and loss in their wake. The crisis began when tensions between the government and mafia groups reached a boiling point, fueled by long-standing rivalries and competing interests. In an attempt to exert control and expand their influence, the mafia groups launched a series of brazen attacks on key government institutions and officials. Hakan Fidan, head of Turkey's National Intelligence Organization (MIT), took charge of the government's response, vowing to protect Turkey's democratic institutions and maintain law and order."
 Turkey_news.49.a:1 "Turkey Falls In Instability"
 Turkey_news.50.t:0 "Turkey Shuts Down The Russian Planes"
 Turkey_news.50.d:1 "In a highly provocative incident, Turkey has reportedly shut down two Russian military planes that entered its airspace near the border with Syria. The incident has escalated tensions between Turkey and Russia, leading to international concern over the potential ramifications for regional stability.\n\nAccording to Turkish authorities, the Russian aircraft violated Turkey's airspace without prior authorization and ignored multiple warnings to turn back. In response to the perceived threat to its territorial integrity, Turkish fighter jets engaged the Russian planes, resulting in their downing.\n\nThe Russian government has vehemently disputed Turkey's account of the incident, claiming that its planes were on a routine patrol mission over Syria and did not cross into Turkish airspace."
 Turkey_news.50.a:1 "What A Dramatic Situation!"
 Turkey_news.51.t:0 "Turkish Government Arrests Ekrem Imamoglu"
 Turkey_news.51.d:1 "Istanbul Mayor Ekrem Imamoglu, who's Turkey's biggest rival to President Recep Tayyip Erdogan, has appeared in court for the first time since he was arrested last month and placed in a high-security jail. Imamoglu is being held on corruption and terrorism charges, but appeared in a special court at Silivri jail in a separate case on Friday accused of trying to intimidate Istanbul's chief prosecutor. Turkey's opposition has condemned Imamoglu's arrest as a "coup attempt against our next president" and his detention has prompted the biggest anti-Erdogan protests in more than a decade.\n\n"I am here because I won elections three times in Istanbul," Imamoglu told the court. "I am here under arrest because I won against the notion of 'Whoever wins Istanbul, wins Turkey'," he added.\n\nImamoglu was referring to President Erdogan, who launched his political career as mayor of Turkey's biggest city and has often used the phrase since."
 Turkey_news.51.a:1 "It Doesn't Sound Good"

