 Turkey.318.title:0 "Mansur Yavaş Attends The Twitch" 
 Turkey.318.desc:0 "Ankara Metropolitan Mayor Mansur Yavaş attended the broadcast of Pelin Baynazoğlu (Pqueen) on the live broadcast platform Twitch. The average number of live views exceeded 300 thousand broadcasts, breaking the watch record.\n\nMore than 20 thousand TL from live broadcasts will be donated to the ‘Green Capital’ Project initiated by Ankara Metropolitan Municipality.\n\n"I sincerely thank Dear Pelin and everyone who supported our Green Capital Project, who helped us set a live broadcast record by watching our Twitch broadcast. I will continue to lead our Ankara in the light of your ideas and always listen to you. Good thing there you are,” he said."
