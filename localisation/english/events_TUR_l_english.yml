 Turkey.295.title:0 "Ilker Basbug Has Been Arrested" 
 Turkey.295.desc:0 "17 months after his retirement, an investigation was launched against Basbug on January 2, 2012, as part of the 'internet andici' case, which is expected to be heard as a witness. He was arrested on 6 January 2012 on charges of 'directing an armed terrorist organization and attempting to eliminate the government."
 Turkey.295.a:0 "Gülen's Influence Is Rising" 
 Turkey.296.title:0 "Ilker Basbug Has Been Released" 
 Turkey.296.desc:0 "Former chief of the General Staff retired general Ilker Basbug was released from Silivri prison after the decision of the High Criminal Court to release him.\n\nBasbug made statements to the press after his release from Silivri Prison. He was arrested on January 6, 2012 "26th The chief of staff was arrested on charges of founding and running a terrorist organization. Appreciation belongs to the Supreme Turkish nation, " Basbug recalled, noting that 26 months passed after this announcement. Basbug continued his words:\n\n"Those who acted with feelings of hatred and revenge kept us here in this prison for 26 months. They stole me from my life for 26 months. They deprived me of my freedom for 26 months, but as I said on January 6, 2012, the Supreme Turkish nation soon realized that the game played, the invalidity of the allegations, the chief of staff and his headquarters, the headquarters of a terrorist organization and the accusation as a terrorist organization is unacceptable, that we have nothing to do with the coup. If I am here today, I am here because of the love and support that my great nation has shown us. For this reason, first of all, I express my deepest gratitude to the Supreme Turkish nation here in your presence."\n\nHe said he believed his release was a start:\n\n"My release today is a start. I believe with all my heart that my friends, who were found innocent in Silivri, Hasdal, and Maltepe, will be freed as soon as possible. If this does not happen, it will not matter or make sense for me to be free today, to gain my freedom. Because no matter how innocent I am, the Tuncer Kılınç Pasha, Hurşit Tolon Pasha, Bilgin Balanlı Pasha, Hasan Iğsiz Pasha, on the other side Tuncay Özkans and Doğu Perincek are as innocent as I am. I would also like to express that the reasons used in my release today apply to all of them. Therefore, as soon as possible, all of them, those who are held captive in these dungeons and are held here by 'calipers', as the last days call them, will surely and surely get their freedom as soon as possible. We made sure of that. No force can stop it."
 Turkey.296.a:0 "The Work Of A Big Mistake" 
 Turkey.297.title:0 "Former chief of General Staff Ilker Basbug is sued" 
 Turkey.297.desc:0 "May 27 may military coup could probably have been prevented if Menderes had announced the date of early elections in Eskisehir on May 25, 1960, "Ilker Basbug said in an interview with Cumhuriyet newspaper on January 4. Because carrying out a military coup against a government that has decided to hold early elections would obviously be a blow to the political administration of the nation."he was reminded to use his statements.\n\nBasbug insinuated a "coup" in this interview and thus committed the crime of "publicly inciting or insulting the people to hatred and hostility", the indictment said, Basbug's statement received by the prosecutor's office was included.\n\nBasbug's statement that "the struggle of power centers in the Republic of Turkey", the third of the book series, evaluated the period 1961-1980 in the circumstances of that day and within the framework of events that developed in those days, statements about crime were previously expressed by some authors, and it is not correct to establish any relationship with today's events, " was quoted in the indictment, Ilker Basbug denied the accusations.\n\nThe indictment asked that Basbug be sentenced to 1 to 3 years in prison for "publicly inciting hatred and hostility".\n\nThe Istanbul Criminal Court of First Instance accepted the indictment sent by the prosecutor general's office. Basbug will appear before a judge in the coming days as part of the case."
 Turkey.297.a:0 "No Problem, we will defend him" 
 Turkey.297.b:0 "There won't be another coup attempt in the Turkish Republic"
