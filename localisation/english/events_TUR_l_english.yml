 TurkeyF.225.title:0 "SADAT Moves On To Topple Government"
 TurkeyF.225.desc:0 "An alarming situation unfolded in the Turkish capital as an attempted coup d'état, organized by a group allegedly linked to SADAT, an independent defense consultancy, sought to topple the government led by MIT (Hakan Fidan and Fahrettin Altun). Despite efforts by the Turkish state to thwart the coup attempt, the situation escalated, leading to heightened tensions in Ankara.\n\nIn the early hours of the morning, a convoy of tanks and armed personnel began a march towards Ankara, prompting a swift response from security forces. The government immediately declared a state of emergency, and the Turkish military was mobilized to confront the advancing convoy.\n\nAs the convoy approached the city, clashes between the coup plotters and government forces erupted, resulting in sporadic gunfire and explosions that sent shockwaves through the capital. Reports of civilian casualties and damage to public infrastructure added to the growing sense of uncertainty and fear among residents."
 TurkeyF.225.a:0 "There Is No Return!"
