 Turkey.341.desc:0 "The United States has begun withdrawing its military from the region in Afghanistan. Other NATO states have also begun to come out, but we are still in the region. The United States wants us not to leave the region and continue the conflict. And our people want to withdraw. What should we do, sir?"
