 Turkey.357.desc:0 "The Corona virus has been infected in our country. Together with these viruses, our economy will decline, and spending to prevent the virus and economies will damage economic activity in high numbers."
 Turkey.357.a:0 "Oh No!"
 Turkey.358.title:0 "Turkey Reacts Against Greece"
 Turkey.358.desc:0 "According to information obtained from ministry sources, Eleni Vakali, the Maslahatguzar of this country's Embassy in Ankara, was called to the Ministry and gave a note containing Turkey's reaction to the death of a Turkish citizen as a result of a fire on the border by Greece last night in Edirne."
