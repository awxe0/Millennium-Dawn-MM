 Turkey.152.a:0 "Aman Tanrım"
 Turkey.153.title:0 "Turkish Local Elections"
 Turkey.153.desc:0 "Local elections took place across the country. Ekrem İmamoğlu says he won Istanbul's mayoral election by 29,000 votes, although the country's ruling party says they garnered 48.70% of the votes compared to only 48.65% for İmamoğlu. Binali Yildirim claims he received 48.71% of the votes and claims victory."
 Turkey.153.a:0 "Elections are rigged! Restart The Elections!"
 Turkey.153.b:0 "Elections are rigged! Restart The Elections! §Y(With No Speech)§!"
 Turkey.155.title:0 "Istanbul mayoral election"
 Turkey.155.desc:0 "The June 2019 Istanbul mayoral election was held on 23 June 2019. It was a re-run of the March 2019 mayoral election, which was annulled by the Supreme Electoral Council (YSK) on 6 May 2019. The original election had resulted in a narrow 0.2% margin of victory for opposition candidate Ekrem İmamoğlu, causing the governing Justice and Development Party (AKP) to successfully petition for a re-run. \n\nThe Nation Alliance (formed of the Republican People's Party (CHP) and the İYİ Party) fielded their initial candidate Ekrem İmamoğlu, who ran a positive campaign under the slogan Her Şey Çok Güzel Olacak (Everything will be fine). The governing People's Alliance (formed by the AKP and the Nationalist Movement Party) re-nominated their initially unsuccessful candidate Binali Yildirim. The non-aligned Peoples' Democratic Party (HDP) did not field their own candidate and announced their support for İmamoğlu. The election featured a televised debate between the two main candidates, a first in Turkey since 2002. Campaigning focused highly on rival accusations of misconduct during and after the initial March 2019 election, during which both sides alleged that they had been a victim of the other's antics.\n\nThe results showed a substantial swing in favor of İmamoğlu, who multiplied his initial 13,700-vote margin of victory 57-fold to win 54.2% of the vote against Yildirim's 45.0%. The opposition's victory defied opinion polls, which predicted a much narrower victory, and was a record in the history of Istanbul local elections in terms of both popular vote and percentage share. İmamoğlu also won pluralities in 28 of Istanbul's 39 districts. Yildirim, on the other hand, lost 11 districts he had won in March and saw a 4 percent decrease in his previous vote share, conceding defeat soon after indicative results became public. The result was seen as a huge blow to President Recep Tayyip Erdoğan, who had once said that if his party "lost Istanbul, we would lose Turkey." Commentators viewed the result as a backlash against Erdoğan, the initial annulment of the March vote (which was largely seen as an anti-democratic maneuver), economic mismanagement, and negative campaigning. It was also seen as a backfire against the government's last-ditch attempt to involve the outlawed Kurdistan Workers' Party (PKK)'s imprisoned leader Abdullah Öcalan in the process, in an attempt to convince HDP voters to boycott the election. \n\nThe opposition's landslide was characterized as the "beginning of the end" for Erdoğan, with international commentators calling the re-run a huge government miscalculation that led to a potential İmamoğlu candidacy in the next scheduled presidential election. It is suspected that the scale of the government's defeat could provoke a cabinet reshuffle and early general elections, currently scheduled for June 2023."
 Turkey.155.a:0 "Setback For AKP"
 Turkey.157.title:0 "Summit On Syria In Ankara"
 Turkey.157.desc:0 "Turkish, Russian and Iranian leaders met during a summit on Syria in Ankara. Their mission is to achieve peace and stability in the middle east by achieving a peace in the dramatic Syrian civil war caused by the ideological divisions."
 Turkey.157.a:0 "Syrian Situation Should Be Not Uncertain"
 Turkey.158.title:0 "TOGG Turkish national car has been introduced"
 Turkey.158.desc:0 " TOGG Turkish national car is introduced to the public. Public looked the car with amazed eyes. This development would make everyone happy in the state expect the traitors."
 Turkey.158.a:0 "Great!"
 Turkey.159.title:0 "A new building of the MIT"
 Turkey.159.desc:0 "The new building of the National Organization Agency (MIT) opened in Etimesgut, Ankara."
 Turkey.159.a:0 "Noice"
 Turkey.160.title:0 "Creation Of The Coronavirus Scientific Advisory Board"
 Turkey.160.desc:0 "The Coronavirus Scientific Advisory Board is a group of medical scientists set up by the Ministry of Health to develop measures in the fight against the COVID-19 pandemic in Turkey that is imposed by the government."
 Turkey.160.a:0 "We should be ready for the Covid-19 attack!"
 Turkey.161.title:0 "We have lifted the ban on Wikipedia"
 Turkey.161.desc:0 "Turkey lifts its ban on Wikipedia, due to a ruling by the Turkish High Constitutional Court."
 Turkey.161.a:0 "Nice"
 Turkey.162.title:0 "Pegasus Airlines Flight 2193"
 Turkey.162.desc:0 "Pegasus Airlines Flight 2193 was a scheduled domestic passenger flight from Izmir to Istanbul. The Boeing 737-800 operating the route skidded off the runway while landing at the Sabiha Gökçen International Airport. Three people were killed, 179 people were injured, and the aircraft was destroyed."
 Turkey.162.a:0 "Aman Tanrım"
 Turkey.163.title:0 "Syrian Attack!"
 Turkey.163.desc:0 "On 27 February 2020, during the peak of Operation Dawn of Idlib 2, the Syrian Air Force and reportedly the Russian Air Force conducted two airstrikes against a Turkish army convoy in Balyun, Idlib Governorate. According to Turkish President Recep Tayyip Erdoğan, the strikes resulted in the deaths of 34 Turkish soldiers, while other sources close to the Turkish government gave death tolls of up to 50–100 Turkish soldiers killed, making it the single deadliest attack on Turkish forces since the start of their involvement in the Syrian Civil War. Between 36 and 60 soldiers were also wounded, of which 16 were reported to be in critical condition."
 Turkey.163.a:0 "We should destroy the Assad Forces!"
 Turkey.164.title:0 "First Covid-19 Case In Turkey"
 Turkey.164.desc:0 "The Ministry of Health confirms the first COVID-19 case in Turkey."
 Turkey.164.a:0 "Oh No!"
 Turkey.165.title:0 "100th anniversary of the Turkish Grand National Assembly"
 Turkey.165.desc:0 "Turkey celebrated the 100th anniversary of the opening of the Grand National Assembly."
 Turkey.165.a:0 "Democracy Prevails"
 Turkey.166.title:0 "An Explosion Occurred!"
 Turkey.166.desc:0 "An explosion occurred in the fireworks factory in Hendek. 6 workers died and 114 workers were injured."
 Turkey.166.a:0 "Aman Tanrım"
 Turkey.167.title:0 "Forest Fire In Gallipoli"
 Turkey.167.desc:0 "450 hectares of forest were burned in the Ilgardere district of Gelibolu, Çanakkale. Transportation was stopped in the Dardanelles."
 Turkey.167.a:0 "Aman Tanrım"
 Turkey.168.title:0 "Situation About The Hagia Sophia"
 Turkey.168.desc:0 "Hagia Sophia, which Fatih Sultan Mehmet turned into a mosque after the conquest of Istanbul, was turned into a museum by the decision of the Council of Ministers dated November 24, 1934. Following the decision of the Council of State, the decision of the President of the Republic on the opening of the Hagia Sophia Mosque to worship by transferring its management to the Presidency of Religious Affairs was published in the Official Gazette. President Recep Tayyip Erdogan announced that Hagia Sophia will be opened for worship."
 Turkey.168.a:0 "Let's do this!"
 Turkey.169.title:0 "We have found natural gas in the Black Sea"
 Turkey.169.desc:0 "Turkey has found 320 billion cubic meters of natural gas in the biggest ever discovered in the Black Sea and hopes to begin production by 2023. The Turkish drilling ship Fatih had been carrying out exploration operations in the Tuna-1 sector in the western Black Sea for the past month."
 Turkey.169.a:0 "Nice News"
 Turkey.170.title:0 "Situation About The Chora Church"
 Turkey.170.desc:0 "President Recep Tayyip Erdoğan signed the decision to transfer the administration of the Chora Church to the Directorate of Religious Affairs and to open it for worship as a mosque, and the decision was published in the T.C. Resmî Gazete."
 Turkey.170.a:0 "Seems Ok"
 Turkey.171.title:0 "Turkey's first flying car has been introduced "
 Turkey.171.desc:0 "Turkey's first flying car introduced as Cezeri, took off in Teknofest Gaziantep."
 Turkey.171.a:0 "Nice!"
 Turkey.172.title:0 "Supports To Azerbaijan!"
 Turkey.172.desc:0 "Erdoğan announced that Turkey would support Azerbaijan during the 2020 Nagorno-Karabakh conflict."
 Turkey.172.a:0 "We are standing with Azerbaijani brothers"
 Turkey.173.title:0 "Forest Fire In Hatay"
 Turkey.173.desc:0 "Forest fires that started in Belen, Hatay, spread to other districts. 400 hectares of forest burned."
 Turkey.173.a:0 "Aman Tanrım"
 Turkey.174.title:0 "We have found another natural gas in the Black Sea"
 Turkey.174.desc:0 "Erdoğan announced that 85 billion cubic meters of natural gas were discovered in the Black Sea."
 Turkey.174.a:0 "Nice News"
 Turkey.175.title:0 "2020 Aegean Sea earthquake"
 Turkey.175.desc:0 "Izmir earthquake had a moment magnitude of 7.0 which struck on Friday, 30 October 2020, about 14 km (8.7 mi) northeast of the Greek island of Samos. Many buildings were severely damaged or collapsed as a result of the earthquake, with the Church the Assumption of Mary in Karlovasi, Greece, partially collapsing, while in the Turkish city İzmir, which was heavily affected by the earthquake, dozens of buildings were either damaged or completely collapsed. Emergency services in both countries immediately attended the scene, as rescue efforts continued into the night. 117 people are known to have died in Turkey's İzmir Province, with 1,034 more injured. \n\nIn Greece, there were an additional two fatalities and nineteen minor injuries. The earthquake is the most powerful in the Aegean Sea since 1981, and the deadliest in İzmir Province since a magnitude 6.6 killed four people in 1955. The earthquake is also the deadliest in the year of 2020."
 Turkey.175.a:0 "Oh No!"
 Turkey.177.title:0 "2020 Bingöl earthquake"
 Turkey.177.desc:0 "The 2020 Bingöl earthquake occurred at 17:24 on 14 June in Turkey. The magnitude of the earthquake was determined to be 5.8 Mw. The earthquake's epicenter was close to the Kaynarpinar village in Karliova, Bingöl, and felt in the neighboring provinces of Erzurum, Diyarbakir, Elaziğ, and Muş. 392 aftershocks were detected following the earthquake, with the largest being a 5.5 Mw event."
 Turkey.177.a:0 "Oh No!"
 Turkey.178.title:0 "2020 Iran–Turkey earthquakes"
 Turkey.178.desc:0 "The first and most destructive of the 2020 Iran–Turkey earthquakes occurred on 23 February, near Khoy in north-west Iran, close to the border with Turkey, killing 9 people in Başkale, Van.[2] It hit at 9:23 a.m. with a magnitude of 5.8 Mw at a depth of 6 kilometers (3.7 miles) and the epicenter was the Qotur district, according to the Iranian Seismological Center (IRSC). About 10 hours later the same area was hit by another major earthquake of 6.0 Mw."
 Turkey.178.a:0 "Oh No!"
 Turkey.179.title:0 "2020 Elazig earthquake"
 Turkey.179.desc:0 "The 2020 Elaziğ earthquake occurred at 20:55 on 24 January in Turkey. The magnitude of the earthquake was determined to be 6.7 Mw. The earthquake's epicenter was close to the town of Sivrice in Elaziğ Province and felt in the neighboring provinces of Diyarbakir, Malatya, and Adiyaman, and the neighboring countries of Armenia, Syria, and Iran. Kandilli Observatory reported the magnitude of the earthquake as 6.5 Mw . A total of 41 people were killed and more than 1,600 were injured."
 Turkey.179.a:0 "Oh No!"
 Turkey.180.title:0 "2019 Istanbul earthquake"
 Turkey.180.desc:0 "2019 Istanbul earthquake was a 5.8 magnitude earthquake that rocked the southwest of Istanbul on 26 September 2019 at 13:59. One person died due to a heart attack and 43 people were injured. The earthquake was felt in Istanbul, Tekirdağ, Kirklareli, Kocaeli, and Sakarya."
 Turkey.180.a:0 "Oh No!"
 Turkey.182.title:0 "2017 Aegean Sea earthquake"
 Turkey.182.desc:0 "A magnitude 6.6 earthquake struck on 21 July 2017, about 10 km (6.2 mi) south southeast of Bodrum, Turkey, at depth of 7.0 km. Two people were killed and more than 120 others were injured on the Greek island of Kos, while at least 360 injuries were reported in Turkey."
 Turkey.182.a:0 "Oh No!"
 Turkey.184.title:0 "2014 Aegean Sea earthquake"
 Turkey.184.desc:0 "An earthquake occurred in the northern Aegean Sea between Greece and Turkey on May 24, 2014. It had a moment magnitude of 6.9 and maximum Mercalli intensity of VIII (Severe). Serious damage was reported on the Turkish island of Imbros and the cities of Edirne and Çanakkale, as well as on the Greek island of Lemnos. The earthquake was felt in Bulgaria and southern Romania. Several aftershocks followed the mainshock, the strongest measuring 5.3 ML. This aftershock struck the Gulf of Saros at 12:31."
 Turkey.184.a:0 "Oh No!"
 Turkey.186.title:0 "2011 Van earthquakes"
 Turkey.186.desc:0 "The 2011 Van earthquakes occurred in eastern Turkey near the city of Van. The first earthquake happened on 23 October at 13:41 local time. The shock had an Mww magnitude of 7.1 and a maximum Mercalli intensity of VIII (Severe). It occurred at a shallow depth, causing heavy shaking across much of eastern Turkey and lighter tremors across neighboring parts of the South Caucasus and Levant. According to the Disaster and Emergency Management Presidency on 30 October, the earthquake killed 604 and injured 4,152. At least 11,232 buildings sustained damage in the region, 6,017 of which were found to be uninhabitable. The uninhabitable homes left as many as 8,321 households with an average household population of around 7.6 homeless in the province; this could mean that at least around 60,000 people were left homeless. The other 5,215 have been damaged but are habitable. A separate earthquake within the same earthquake system happened on 9 November at 21:23. 40 people were killed and 260 people were injured in the 9 November earthquake."
 Turkey.186.a:0 "Oh No!"
 Turkey.188.title:0 "2011 Kütahya earthquake"
 Turkey.188.desc:0 "The 2011 Kütahya earthquake struck near a populous region of western Turkey at 23:15 on 19 May with a moment magnitude of 5.8 and maximum Mercalli intensity of VII (Very strong). With an epicenter just to the east of Simav, it occurred at an estimated depth of 9.1 kilometers (5.7 mi), resulting in strong shaking in much of Kütahya. Many locals panicked and power was lost to most of Simav. A hospital in Simav reported an unknown number of injuries, and some buildings sustained damage. An elderly woman in İnegöl suffered a heart attack in the immediate aftermath of the tremor and was later confirmed dead. In Simav, one person was killed after being struck by a concrete block. More than 450 weak aftershocks followed; the strongest registered at a magnitude of 4.6."
 Turkey.188.a:0 "Oh No!"
 Turkey.189.title:0 "2010 Elazığ earthquake"
 Turkey.189.desc:0 "The 2010 Elaziğ earthquake was a 6.1 Mw earthquake that occurred on 8 March 2010 at 02:32. The epicentre was Başyurt in Elaziğ Province, in eastern Turkey. Initial reports in global media said as many as 57 people had died. By 10 March, reports in the Turkish media placed the death toll at 41, and later, the death toll rose to 42. Another 74 were injured, many after falling and jumping from buildings. A stampede through the streets led to further injuries. The earthquake came one week to the day after the Turkish Chamber of Civil Engineers sent a report to parliament detailing inadequate building projects and the possibility that Istanbul would be destroyed by an earthquake, which could kill tens of thousands of people, at some point in the next three decades."
 Turkey.189.a:0 "Oh No!"
 Turkey.193.title:0 "2004 Doğubayazıt earthquake"
 Turkey.193.desc:0 "2004 Doğubayazit earthquake was a 5.1 Mw or 5.2 Mwearthquake that rocked Doğubayazit, Ağri, Turkey on 2 July 2004 at 01.30 local time. 18 people were killed and 32 were injured. The greatest damage was at Yiğinçal village, while Kutlubulak and Sağliksuyu villages were also affected. Kandilli Observatory stated that around 1000 buildings were damaged. The earthquake was felt from Ağri, Iğdir, Kars, and areas near the Iran-Turkey border. The intensity of the shock was reported as VII, while the depth was reported as 5 km. The earthquake happened during the local mountain pasture season where villagers were in the mountains, which prevented a higher number of casualties. Various organizations sent relief to the area. Three ministers of the Turkish government visited the area, Greece offered help and France sent messages of solidarity."
 Turkey.193.a:0 "Oh No!"
 Turkey.195.title:0 "2003 Bingöl earthquake"
 Turkey.195.desc:0 "The 2003 Bingöl earthquake hit eastern Turkey with a moment magnitude of 6.4 and maximum Mercalli intensity of IX (Violent) on 1 May at 03:27. The epicenter of this strike-slip earthquake was in Bingöl Province, 15 km north of Bingöl. At least 177 people were killed, and 625 buildings collapsed or suffered heavy damage in the affected region. Eighty-four of the fatalities occurred when a dormitory block collapsed in a boarding school in Celtiksuyu."
 Turkey.195.a:0 "Oh No!"
 Turkey.197.title:0 "2002 Afyon earthquake"
 Turkey.197.desc:0 "The Afyon Province of western Turkey was struck by an earthquake measuring 6.5 Mw on 23 February 2002 at 10:1. It had a maximum felt the intensity of VIII (severe) on the Modified Mercalli intensity scale. It damages hundreds of buildings and caused the deaths of 44 people and a further 318 injuries."
 Turkey.197.a:0 "Oh No!"
 Turkey.198.title:0 "AKP Rallies"
 Turkey.198.desc:0 "The AKP has started holding election rallies in many places. It looks like the next election will be violent and dominant."
 Turkey.198.a:0 "This Election Would Be Interesting"
 Turkey.199.title:0 "CHP Rallies"
 Turkey.199.desc:0 "The CHP has started holding election rallies in many places. It looks like the next election will be violent and dominant."
 Turkey.199.a:0 "This Election Would Be Interesting"
 Turkey.200.title:0 "Muharrem Ince Becomes President Candidate Of CHP"
 Turkey.200.desc:0 "Muharrem Ince is officially a candidate in the Republican People's Party. In a secret ballot held in the CHP Group, 110 deputies unanimously declared Muharrem Ince as the CHP's Presidential candidate. With the "Unanimous and group decision" of the party, Muharrem Ince was nominated for President. Ince, who made his first statement after the decision was announced, told the press members, "I said yesterday that I would announce it when the time came, and he responded wittily by saying, 'When it comes'. Muharrem Ince was born on May 4, 1964, exactly today. Ince was nominated for President from the CHP on his birthday. Kılıçdaroğlu stated that 'we will make history' for Ince's candidacy."
 Turkey.200.a:0 "Opposition Announces Their Ways"
 Turkey.201.title:0 "Creation Of The Future Party"
 Turkey.201.desc:0 "The Future Party was founded on 12 December 2019 by Ahmet Davutoğlu, a former foreign minister and prime minister on behalf of the conservative Justice and Development Party (AKP). Having been elected prime minister on 28 August 2014 with the support of President Recep Tayyip Erdoğan, Davutoğlu later opposed the latter's moves to transform Turkey's form of government from a parliamentary to a presidential system. His conflict with Erdoğan culminated in Davutoğlu's resignation from the premiership, effective from 22 May 2016. Following his resignation, Davutoğlu frequently criticized the AKP government, which led the party to launch disciplinary actions against him. In response, he resigned from the AKP on 13 September 2019. He later expressed interest in forming a new party in opposition to President Erdoğan's administration, and ultimately launched the Future Party on 12 December 2019. The new party immediately published a list of 154 founding members which included numerous former AKP officials and affiliates."
 Turkey.201.a:0 "A loss for the AKP"
 Turkey.202.title:0 "Creation Of The DEVA"
 Turkey.202.desc:0 "DEVA Party becomes a political party in Turkey formed by former Deputy Prime Minister Ali Babacan as the result of a split from Recep Tayyip Erdoğan's Justice and Development Party. The party is currently being represented by one seat at the Grand National Assembly, with MP Mustafa Yeneroğlu being one of her founders."
 Turkey.202.a:0 "A loss for the AKP"
 Turkey.203.title:0 "Creation Of The Hometown Movement"
 Turkey.203.desc:0 "Muharrem Ince left the CHP and formed his own party. The name of the party is the hometown movement, and this party has Kemalist ideals."
 Turkey.203.a:0 "A loss for the CHP"
 Turkey.204.title:0 "CHP's New President Candidate"
 Turkey.204.desc:0 "CHP mayors in Ankara and Istanbul have become popular in the country. We can make Ekrem Imamoglu or Mansur Yavas a candidate for President. The choice is yours."
 Turkey.204.a:0 "Mansur Yavas"
 Turkey.204.b:0 "Ekrem Imamoglu"
 Turkey.205.title:0 "İyi Party Speech"
 Turkey.205.desc:0 "The İyi Party has vilified us by addressing the misery in our country. The course of the economy can bring us bad to many more bad places."
 Turkey.205.a:0 "This sounds bad"
 Turkey.206.title:0 "Early Parliamentary Elections On The Way"
 Turkey.206.desc:0 " The decision to hold early parliamentary elections was yes. Preparations for the election have now begun."
 Turkey.206.a:0 "Let's goooo!"
 Turkey.207.title:0 "Turkish Elections"
 Turkey.207.desc:0 "Elections were held in the country. And now the crates are opening one by one. Who should win this election? CHP or AKP?"
 Turkey.207.a:0 "Let's continue with Erdogan"
 Turkey.207.b:0 "We need a change, go with CHP"
 Turkey.208.title:0 "Turkey's First Centenary"
 Turkey.208.desc:0 "As Türkiye reaches the milestone of its first centenary, the occasion calls for a profound reflection on the nation's journey, challenges overcome, and the vibrant tapestry of its cultural, historical, and political evolution. This celebration is not merely a commemoration of time passed; it is a testament to the resilience and progress that have shaped Türkiye into the nation it is today."
 Turkey.208.a:0 "What a nice day!"
 Turkey.208.b:0 "§RI Want To Listen The 100th Year March§!"
 Turkey.208.b:0 "What a nice day! §Y(With No Sound)§!"
 Turkey.209.title:0 "Preparations For The New Constitution"
 Turkey.209.desc:0 "At the behest of Erdogan and the Turkish Grand National Assembly, preparations for a new constitution were started. We hope things don't turn around in these preparations."
 Turkey.209.a:0 "Interesting"
 Turkey.210.title:0 "Brand New Constitution"
 Turkey.210.desc:0 "A new constitution has been drafted, and the government praises it, while the opposition reacts harshly. This will damage the peace level of our country."
 Turkey.210.a:0 "This Constitution Would Make Turkey Better"
 Turkey.211.title:0 "Bogazici Protests"
 Turkey.211.desc:0 "Hundreds began protesting on 4 January following the appointment, chanting slogans such as "Melih Bulu is not our rector" and "we don't want a plagiarist rector". In a shared statement, faculty regarded the appointment as a violation of "academic freedom and scientific autonomy, as well as the democratic values" of the Boğaziçi.\n\nLater on the day, one of the university's buildings were sealed off by students who were able to enter the campus. Then, protesters clashed with the police as they tried to break a barricade in front of the entry to the university, causing security forces to use pepper spray to disperse the demonstrators. Two students were detained in the course of protests. By January 6, 36 students were in detention. Protests by students and faculty outside the rector's office have continued into February, with many other Turkish universities and Boğaziçi alumni associations abroad joining in the protest against the appointment.\n\nAs part of an art exhibition organized for the protest, an artwork on campus reportedly depicting the Kaaba alongside an LGBT flag and a figure of Shahmaran led to the arrest of four students, who were in the exhibition team. Turkish Ministry of Interior Süleyman Soylu referred to the arrested students as "four LGBT perverts", causing Twitter to later restrict his tweet. After this event, Boğaziçi University LGBT Studies Club was closed by order from Melih Bulu. Bulu defended and claimed himself as an LGBT rights advocate.\n\nOn 1 February, police blocked the gate of the South Campus to prevent the demonstration. Water cannons, barricades, and at least one sniper were installed. Later that night, police stormed the campus and detained 159 students. Several protestors in İzmir and 69 in Ankara were also detained. On February 2, Turkish police arrested and detained 104 near the University in Kadiköy, and responded to demonstrators with tear gas and rubber bullets. Citizens of Istanbul banged pots and pans in many parts of the city to show their solidarity with the protest. On 3 February, 50 people were detained in Izmir."
 Turkey.211.a:0 "We are losing our power"
 Turkey.212.title:0 "Türksat 5A has been launched"
 Turkey.212.desc:0 "The Türksat 5A satellite was combined with national facilities in Turkey and sent into space from Cape Canaveral on a Falcon 9 rocket."
 Turkey.212.a:0 "Great News"
 Turkey.213.title:0 "Human Rights Action Plan"
 Turkey.213.desc:0 "President Recep Tayyip Erdogan announced the Human Rights Action Plan. That would bring more rights to our people."
 Turkey.213.a:0 "Sounds Good"
 Turkey.214.title:0 "İyi Party has been opened"
 Turkey.214.desc:0 "After some nationalists in the MHP did not find the MHP's policies good, they themselves opened a new party. With the opening of a new party, the MHP lost power."
 Turkey.214.a:0 "Politics are changing"
 Turkey.215.title:0 "Constitutional Court shuts down Fazilet Party"
 Turkey.215.desc:0 "The Fazilet Party was closed upon the decision of the Constitutional Court. This will lead to the formation of the AKP and the Fazilet Party."
 Turkey.215.a:0 "Constitutional Court made its decision"
 Turkey.216.title:0 "The Independent Turkey Party has been created"
 Turkey.216.desc:0 "The Independent Turkey Party has been established by Haydar Baş."
 Turkey.216.a:0 "Pretty Interesting"
 Turkey.217.title:0 "DYP Turns To DP"
 Turkey.217.desc:0 "The DYP changed its name to become the DP. This new name was the old name of the party that shut down by the coup in the 60s."
 Turkey.217.a:0 "What A Dramatic Change!"
 Turkey.218.title:0 "Creation Of The Vatan Party"
 Turkey.218.desc:0 "After the closure of Perincek's Labour Party, Perincek founded the Vatan Party. This party is purely influenced by the Chinese actions."
 Turkey.218.a:0 "They Are Living Emergings"
 Turkey.219.title:0 "104 Retired Admiral's Statement"
 Turkey.219.desc:0 "A statement was issued by 104 retired admiral of the Turkish Navy warning and referring to the Montreux Straits Convention, the Canal Istanbul project, and the principles and revolutions of Atatürk.\n\nHere Is The Declaration Of The Retired Admirals: \n\n* Recently, both Canal Istanbul and the opening of the Montreux Convention to debate within the scope of the authority to cancel international treaties are met with concern.\n\n* The Turkish Straits are one of the most important waterways in the world and have been governed according to multinational treaties throughout history. Montreux, which is the last of these treaties and best protects Turkey's rights, is not only a treaty regulating the passage through the Turkish straits, but a great diplomatic victory that restores Turkey's full sovereignty rights in Istanbul, Canakkale, the Sea of Marmara, and The Straits, completing the Lausanne peace treaty.\n\n* Montreux is the basic document of the security of countries bordering the Black Sea and the convention that makes the Black Sea a sea of peace. Montreux is a convention that prevents Turkey from unwittingly going to war in any war, on the side of one of the warring parties.\n\n* Montreux, Turkey II. It allowed him to maintain his neutrality in World War II. For these and similar reasons, we believe that any discourse and actions that may cause the Montreux Convention, which occupies an important place in Turkey's survival, to be a topic of discussion and to come to the table, should be avoided.\n\n*On the other hand, some unacceptable Images, News, and discussions in the press and social media in recent days have been a source of deep sadness for those of us who have dedicated our lives to this profession.\n\n* TAF and especially our naval forces have experienced a very conscious Fatah attack in recent years and have sacrificed their very valuable staff to these treacherous calipers. The most important lesson to be learned from these calipers is that the TSK must meticulously maintain the fundamental values of the Constitution, which cannot be changed, and cannot be proposed to be changed.\n\n*On these grounds, we condemn and oppose the efforts of the TSK and our Navy to show that they have gone beyond these values and have moved away from the modern course drawn by Atatürk.\n\n* Otherwise, the Republic of Turkey will be able to face the risk and threat of experiencing the most dangerous events in history, which are examples of depression and survival. It is essential that the personnel of the Naval Forces Command, the protector of the mother and Blue homeland, who has a glorious past coming out of the bosom of the Turkish nation, be trained following the principles and revolutions of Ataturk.\n\n*Every corner of our country at sea, on land, in the air, in the internal security zone, and beyond the border, working hard on the path shown by Ataturk to protect our rights and interests in the Blue homeland of our suffering Turkish sailors we're with you."
 Turkey.219.a:0 "They are related to the Gulen movement!"
 Turkey.219.b:0 "CHP's coup plotters!"
 Turkey.219.c:0 "We don't care, they are retired admirals"
 Turkey.219.d:0 "They are right"
 Turkey.221.title:0 "Turkey Withdrawals From Istanbul Convention"
 Turkey.221.desc:0 "the Turkish President Recep Tayyip Erdoğan announced his country's withdrawal from the Istanbul Convention by a presidential decree published in the official government gazette. Turkey becomes the first country to withdraw from it."
 Turkey.221.a:0 "Oh, Nice"
 Turkey.221.b:0 "A Bad Decision"
 Turkey.220.title:0 "Tatvan Air Crash"
 Turkey.220.desc:0 " A Eurocopter AS532 Cougar crashed on its way from Bingöl to Tatvan. Eleven soldiers on board, as well as 8th Corps Commander Osman Erbaş, were killed in the crash."
 Turkey.220.a:0 "Aman Tanrım"
 Turkey.222.title:0 "CHP's Banners"
 Turkey.222.desc:0 ""Where is 120 billion dollars?" they hung these banners on the streets. This is done to humiliate us. We should answer these opposition provocations."
 Turkey.222.a:0 "That's Against Government! Shot Down These Banners!"
 Turkey.223.title:0 "Blacklash Against Us On Twitter"
 Turkey.223.desc:0 "The backlash against us on Twitter is making our policies difficult. We need to silence the Westerners on Twitter."
 Turkey.223.a:0 "Ah"
 Turkey.225.title:0 "Recep Tayyip Erdoğan Speech"
 Turkey.225.desc:0 "Recep Tayyip Erdogan, the president of the Republic of Turkey, gave a speech for the Canal Istanbul project. In his speech, he said that "The channel will be done stubbornly." This was received very harshly by the media."
 Turkey.225.a:0 "Canal Still Remains As A Project?"
 Turkey.224.title:0 "Protests In The Country"
 Turkey.224.desc:0 "With the repeal of the Istanbul Convention, protests occurred in the country. The repeal of the Istanbul Convention has led some to believe that women's rights are being abandoned. And the protests in the country have reduced our prestige. If our people become dissatisfied, our chances of being in power will be reduced, and the media said this was done to divide the people."
 Turkey.224.a:0 "Oough..."
 Turkey.226.title:0 "Military Statement"
 Turkey.226.desc:0 "The first statement came after the coup was carried out. \n\n Military Statement: "Messages that demand the tension of the Turkish Republic and insult Atatürk are received by politicians. These politicians will be arrested quickly. Those who brought this situation to our country can no longer come to power of the country. Those who put our country in this situation have been banned from making unlimited policies.  After the glorious Turkish army captured the country, it immediately began inspecting the administrative facilities and found some corruption. This corruption is one of the biggest steps in making Turkey like this. Efforts to amend the Constitution have been accepted after corruption has damaged our country and no one has the power to control it. After it is prepared, it will be presented to the public for election. We wish you a blessed day."
 Turkey.226.a:0 "Long Live the Junta!"
 Turkey.227.title:0 "The First Junta Congress"
 Turkey.227.desc:0 "The Junta Congress was held. The result from the Congress is to amend the Constitution and to block the parties."
 Turkey.227.a:0 "Junta makes its decision"
 Turkey.228.title:0 "Tanks On The Streets"
 Turkey.228.desc:0 "Tanks of the Turkish Armed Forces began to enter the places where the Islamists were located. Islamists who tried to resist were arrested by the special armed forces. Those arrested will be handed over to justice."
 Turkey.228.a:0 "We need to be in the balance"
 Turkey.229.title:0 "Victory For CHP"
 Turkey.229.desc:0 "Too long AKP regime finally ends with the election. CHP won the election. After the CHP won, festivities and several celebrations were held in the country. Let the new power be auspicious."
 Turkey.229.a:0 "Political Shift On Turkey"
 Turkey.230.title:0 "Kemal Derviş Tooks The Office"
 Turkey.230.desc:0 "Derviş took office as Minister of State for Economic Affairs in Turkey on 13 March 2001, when Bülent Ecevit was Prime Minister. We hope he gets us out of these difficult times with minimal damage."
 Turkey.230.a:0 "He's Our Last Chance"
 Turkey.231.title:0 "Calling For Jihad"
 Turkey.231.desc:0 "We have crushed the laws that undermine Islam with military force. It's time for the Turks to live up to their traditions in a military way. Muslims to the front!"
 Turkey.231.a:0 "Allahüekber!"
 Turkey.232.title:0 "Calling For Jihad"
 Turkey.232.desc:0 "We have crushed the laws that undermine Islam with military force. It's time for the Turks to live up to their traditions in a military way. Muslims to the front!"
 Turkey.232.a:0 "Allahüekber!"
 Turkey.233.title:0 "Bombardment Of Istanbul"
 Turkey.233.desc:0 "Clashes inside Istanbul escalated. Some regime tanks were devastated by the riots. After that, our army began to hit Istanbul from high. The beautiful city, which had not seen war for many years, was devastated. After the bombing of Istanbul, the canal crossings were closed. The level of insurgency in the country has increased. We have to win this war fast, or the end is near."
 Turkey.233.a:0 "March!"
 Turkey.234.title:0 "Mansur Yavaş Becomes The President"
 Turkey.234.desc:0 "Mansur Yavaş triumphed in elections. He became the new president of Turkey. The people are happy and celebrating. Mansur Yavaş, who won the victory, made a speech. Mansur Yavaş, the new president will follow the Atatürk's footsteps and Atatürk nationalism. Turkey was positively received by the world media."
 Turkey.234.a:0 "What a nice day, in Turkey!"
 Turkey.235.title:0 "Mansur Yavaş Visits Anitkabir"
 Turkey.235.desc:0 "The new President, Mansur Yavaş, came to Anitkabir. He gave his speech at Anitkabir. Mansur Yavaş attracted great attention in Anitkabir. Mansur Yavaş the president of Turkey was able to enter Anitkabir hardly because of the massive crowd."
 Turkey.235.a:0 "We are in the footsteps of Atatürk"
 Turkey.236.title:0 "Fast Growth In Economics"
 Turkey.236.desc:0 "With Mansur Yavaş, the Turkish economy began to rise. The rise of the economy, it doesn't rise for a long time, was greeted with enthusiasm by the public. The new system is working."
 Turkey.236.a:0 "Cheers"
 Turkey.237.title:0 "Re-Sickness In Economy"
 Turkey.237.desc:0 "The group, which has investments in the country, decided to leave the country due to pressure, which caused the Turkish economy to deteriorate from behind."
 Turkey.237.a:0 "Damn"
 Turkey.238.title:0 "The AI Management"
 Turkey.238.desc:0 "Hello Artificial Intelligence or better called "AI", now it's time to determine which way to go. Come on, press one of these keys and fly to freedom!"
 Turkey.238.a:0 "§YCoordination Order A§!"
 Turkey.238.b:0 "§OCoordination Order B§!"
 Turkey.238.c:0 "§RCoordination Order C§!"
 Turkey.238.d:0 "§GCoordination Order D§!"
 Turkey.238.e:0 "§BCoordination Order E§!"
 Turkey.239.title:0 "The Euro"
 Turkey.239.desc:0 "Our currency is now the Euro. The Turkish Lira no longer has an active power in our country. We have to get used to this economic change."
 Turkey.239.a:0 "Time To Have Valuable Money"
 Turkey.240.title:0 "We Have Sold TRT"
 Turkey.240.desc:0 "We have sold TRT. Our nation will no longer live under the control and propaganda of TRT. Long live the liberalism which cuts the taxes every time!"
 Turkey.240.a:0 "Nice"
 Turkey.241.title:0 "Tin Tin Senfoni Orkestrasi"
 Turkey.241.desc:0 "Instead of closing the orchestra, we will change the head of the orchestra and play the state orchestra 24/7. With this orchestra, we're going to show the power of liberalism."
 Turkey.241.a:0 "Nice"
 Turkey.242.title:0 "Victory Of The Liberal Group"
 Turkey.242.desc:0 "The Liberal group that wants to be in power has now become in power. Everyone is shocked that this party, which is back in the polls, has become in power. Besim Tibuk gave a victory speech and thanked those who voted for him. Now Turkey is on a Liberal path."
 Turkey.242.a:0 "LDP? Interesting"
 Turkey.243.title:0 "Liberals Want Support!"
 Turkey.243.desc:0 "A Liberal group that wants to be in power is waiting for our support. We are going to lose power, if we support them so should we support this Liberal side?"
 Turkey.243.a:0 "Yes, Its Time For Liberalism"
 Turkey.243.b:0 "No, Political Balance Should Stay"
 Turkey.244.title:0 "Kemal Derviş Joins CHP"
 Turkey.244.desc:0 "After Derviş signed the membership form, president Deniz Baykal wore the party badge on Dervish's collar and signed the party entry form and Kemal Dervis today became a member of the CHP among the applause and wore a badge with six arrows on his collar.\n\nDervish arrived at CHP headquarters with his advisor Oya Ünlü at 10.30 am today. Dervish, who was greeted by Deputy Secretary-General Mehmet Sevigen on his arrival at the party, also greeted the party members waiting there. \n\nKemal Dervis attended the CHP with the ceremony held at 11: 00. After dervish signed the membership form, president Deniz Baykal wore the party badge on Dervish's collar and signed the party entry form.\n\nSpeaking at the ceremony, Deniz Baykal said:\n\nDervis is a former member of the CHP. After a long process, he decided to join the CHP. Now he has decided to actively participate in our political life as a member of the CHP in a new period of his life again.\n\nI am very happy with this decision. It is a decision that will add great power to the CHP. But there is a very important aspect of this participation that needs to be evaluated.\n\nThis is not just an intra-party event. It is not an event that our friend joins the CHP. A major opening of the decision to renew Turkey is of special importance as an exit point.\n\We show everyone that a new formation has started in Turkey with dervish joining the CHP. Turkey is now entering a new era. Turkey needs to change and be renewed. We must quickly close a period of crisis and move Turkey to its rightful place in the world as a strong, respected, honorable country.\n\nDerviş's decision is not about seeking personal satisfaction for political life. It is a decision that has emerged as a mandatory requirement for the realization of the claim to move Turkey to a certain point.\n\nCHP is now a political party that everyone who wants to change Turkey and wants to renew it should contribute to and own. Derviş's decision is a reflection of that.\n\It will be a modern, competitive Sunday economy. It will be a producing and exporting economy. But not only a producing economy but also a competing economy, we have to put forward an order in Turkey in which people living in this economy are not abandoned to their own fate, they can safely look to the future in a sense of Social Solidarity, the strict rules of the economy, as well as the human face of social understanding, can emerge.\n\This is possible and mandatory. I know very well that dervish has brought him to this point, knowing that he will carry all kinds of orientation efforts and pressures, knowing that he will overcome them when he comes, and I congratulate Dervish for this great struggle and the right decision. Later, Sözalan Kemal Derviş also said:\n\nCHP is a very deep-rooted institution of Turkey. When we look at the history of these last 70 years, it is a party that has achieved difficult tasks at every stage. Despite all the difficulties and problems that sometimes seem insurmountable. I agree with Mr. Chairman Baikal's call. 21. we have entered the century, but we have to move Turkey to this century. This power in society has this potential. Turkey can certainly be a strong, prosperous country in Europe. But in order for us to mobilize this power, we must realize this modern synthesis by bringing together the trio of Economics, people, and effective States. We can make Turkey a country that moves forward, not backward.\n\nFor this, we need the support of all Turkish citizens, not only from the CHP. If we cannot build a team to solve these problems with a strong majority after the November 3 election, and this team cannot work in real harmony, these problems will unfortunately not be instilled.\n\nFor him, we must pack up, and let go of the old resentments. That's the future we all have in common. If we can come together, we can walk together into much brighter days after this severe crisis. I absolutely believe that. 18 months ago, I couldn't fully perceive the political dimension of the business. I was looking at it economically. It is not possible to create a structure that will take serious, fast, effective decisions in political fragmentation.\n\nOf course, we will compete, but at the end of this race, a stable, stable picture needs to emerge. It has been a difficult process, but I have never considered a solution that excludes the CHP.\n\nI wish all the center and left friends could come together. In the coming days, we will open our lap again, we will make this synthesis call every day, and with this synthesis, I hope that we can go to a very definite conclusion. So that we can overcome economic problems. We cannot be a strong country without a strong economy."
 Turkey.244.a:0 "Beneficial Decision For CHP"
 Turkey.245.title:0 "2002 AKP Clousure Case"
 Turkey.245.desc:0 "The chief prosecutor of the Supreme Court, Sabih Kanadoglu, filed a lawsuit in the Constitutional Court asking for the closure of the AK Party. Canadoglu also called for the use of the duties and powers of the general presidency by Recep Tayyip Erdogan to be prevented as a precaution.\n\nKanadoglu sent his indictment to the Constitutional Court today. Canadoglu also made a statement regarding the closure case.\n\nSabih Kanadoglu said in his statement:\n\n" Chief Prosecutor of the Supreme Court Sabih Kanadoglu, the Justice and Development Party, which does not fully comply with the law on political parties 2820 in the legal process, starting with the notification of the decision of the Constitutional Court on January 9, 2002, in accordance with the law and does not fully comply with the law as specified in the warning, 104 of the law. Article 2. he filed a lawsuit in the Constitutional Court, demanding that it be closed in accordance with the paragraph and prevent the use of the duties and powers of the general presidency by Recep Tayyip Erdogan."\n\n In the conclusion of the case, AKP could viable."
 Turkey.245.a:0 "28th February Soul Struggles"
 Turkey.246.title:0 "AKP Rallies"
 Turkey.246.desc:0 "The AKP received a lot of attention at rallies. Along with interest, their votes increased. According to polls, the AKP is the new party that will be in power."
 Turkey.246.a:0 "Rise Of Moderate-Islamism"
 Turkey.246.b:0 "Rise Of Moderate-Islamism §Y(With No Speech)§!"
 Turkey.247.title:0 "The Constitutional Court's Decision On The Erdogan"
 Turkey.247.desc:0 "The Constitutional Court said Erdogan could not be a deputy. The Constitutional Court says Erdogan has a ban on politics, so Erdogan will not be able to take any political steps until the ban on politics is lifted. If Erdogan wins the election, he will put one of the AKPs in charge."
 Turkey.247.a:0 "The Constitutional Court Resist"
 Turkey.248.title:0 "Constitution changed, Erdogan's ban lifted"
 Turkey.248.desc:0 "A three-point constitutional amendment prepared to ensure that AKP leader Tayyip Erdogan becomes a deputy and supported by the CHP was adopted with jet speed.\n\n1, which lifted Erdogan's ban and tried to add that those who tortured him by giving the CHP a motion could not be deputies but failed. 501 lawmakers participated in the secret ballot. There were 444 votes for acceptance, 45 for rejection, 9 for abstention, and 3 for blank. Turnout fell steadily after the article lifting Erdogan's ban was adopted. The vote on the entire proposal was attended by 465 MPs. There were 440 acceptance votes against 18 rejection votes, 4 abstentions and 3 blank votes.\n\nIt was up to President Ahmet Necdet Sezer to approve the constitutional amendment, which passed through parliamentary commissions and was completed in five days with two rounds of voting. Under the Constitution, Sezer can approve the amendment, take it to a referendum, or veto any articles he wants."
 Turkey.248.a:0 "CHP-AKP Alliance?"
 Turkey.249.title:0 "Kobani Protests"
 Turkey.249.desc:0 "A curfew was declared in Diyarbakir after Selahattin Demiras called for a curfew for Kobani, and soldiers took to the streets. The Kurds went outside and started protesting the government then the Kurds occupied a park and set fire to the Ataturk statue in the park this led to ulkists arming themselves and started firing against the Kurds. There were clashes in the streets. The clashes ended with raids by soldiers and police. HDP leader Selahattin Demirtas has been identified as responsible for the people killed in the protests for Kobani. Selahattin Demirtas was investigated."
 Turkey.249.a:0 "What Chaos!"
 Turkey.250.title:0 "Demirtas Speech"
 Turkey.250.desc:0 "Selahattin Demiras called for a curfew following the ISIS occupation of Kobani. After the conversation, the soldiers quickly began to move east."
 Turkey.250.a:0 "Dangerous Speech"
 Turkey.251.title:0 "Appointment Of Kayyum To Zaman"
 Turkey.251.desc:0 "At the request of the Istanbul prosecutor general's office, the magistrate decided to appoint Qayyum to the newspaper Zaman. The agencies report that the trustees went to the newspaper accompanied by police to take over."
 Turkey.251.a:0 "Government Shall Check These"
 Turkey.252.title:0 "President Recep Tayyip Erdogan's Lausanne Speech"
 Turkey.252.desc:0 "President Recep Tayyip Erdogan said that the Lausanne Peace Treaty of 24 July 1923 was tried to be hyped as a victory.\n\nAddressing the headmen in Beştepe, Erdogan said: "What have they done to us in history. In 1920, they showed us Sèvres, and in 1923, they consented us to Lausanne. And someone tried to sell Lausanne as a victory. Everything is clear." said.\n\nErdogan continued his words:\n\n"Now you see the Aegean, don't you? We gave the islands in Lausanne where your voice would be heard if you shouted. Is that the victory?\n\n"Been there for us. There are our mosques, temples, but at the moment we are still talking about what will happen on the continental shelf in the Aegean, what will happen in the air, what will happen at sea, we are still fighting for it.\n\n"Why? That's because of what's on the table in that deal. Those at that table didn't deserve that deal. Now that they can't, we're having trouble with him."
 Turkey.252.a:0 "Lausanne Is The Guarantee Of The State"
 Turkey.252.b:0 "Lausanne Should Be Updated"
 Turkey.253.title:0 "Muharrem Ince Harshly Criticized Government"
 Turkey.253.desc:0 "CHP presidential candidate Muharrem Ince addressed the public at a rally in Izmir. At the rally, attended by about 2.5 million people, when citizens said no internet, Ince said, "no Internet? I mean, you steal money, you steal votes at the ballot box, you steal questions on the exam, you steal my right from the TRT, you don't broadcast it on private televisions, there's no internet, damn it, I tell you what else!" said."
 Turkey.253.b:0 "He Should Be Stopped"
 Turkey.253.a:0 "You Know What? He Is Right!"
 Turkey.253.d:0 "He Should Be Stopped §Y(With No Speech)§!"
 Turkey.253.c:0 "You Know What? He Is Right! §Y(With No Speech)§!"
 Turkey.254.title:0 "News From The Assembly"
 Turkey.254.desc:0 "It has been decided that our Oath will be read again with CHP and Good Party votes. It will now be read in schools next to the National Anthem."
 Turkey.254.a:0 "Her Şey Cumhuriyet Adına!"
 Turkey.255.title:0 "CHP-IYI Government Established"
 Turkey.255.desc:0 "Republican People's Party (CHP) leader Kemal Kılıçdaroğlu gave a victory speech in front of CHP headquarters in Ankara. Kilicdaroglu, who took the podium together with his coalition partner Aksener and he said:\n\n"I thank you all from the bottom of my heart. We set out on a road and put up a fight. We fought without a fight, without tension. Our struggle was a struggle for democracy. There will be peace in every house you will see. No child will go to bed hungry. We will keep all our promises and carry this trust all over Turkey.""
 Turkey.255.a:0 "A Brand New Turkey On The Corner"
 Turkey.256.title:0 "AKP-MHP Government Established"
 Turkey.256.desc:0 "Erdogan, who expressed his gratitude to Ankara for their enthusiasm, love, support, and welcome ceremony along the way from the airport to the headquarters, continued his words:\n\n""You were with us in the elections of November 3, 2002, and you carried us to power. You didn't stop, 'don't stop, keep going.' you said, 'this song doesn't end here.' you did. You were with us in the elections of July 22, 2007, and we fought together against guardianship. You were with us in the elections of June 12, 2011, and we all passed the age of our country together. You were with us in the events of the gezi, in the security-judicial coup attempt on December 17-25, in the presidential election. We all stood up to the vandals and the treacherous gangs. You were with us in the 2015 election, especially on November 1. We gave lessons to those who rubbed their hands and waited for Turkey to kneel.""
 Turkey.256.a:0 "Erdogan Is Unstoppable"
 Turkey.257.title:0 "Yassiada's Name Changed"
 Turkey.257.desc:0 "The island was home to the infamous trial of then Turkish Prime minister Adnan Menderes and ministers Fatin Rüştü Zorlu and Hasan Polatkan, which was resulted with execution order. After the 1960 coup "Yassıada" name was remembered negatively, which led the island to be renamed as "Democracy and Freedom Island" on November 7, 2013."
 Turkey.257.a:0 "Interesting"
 Turkey.258.title:0 "Turkish 2008 Economic Recession"
 Turkey.258.desc:0 "Trade relations between Europe and Turkey, which are in crisis, have decreased Turkey's current account deficit has increased, macro-economic data has deteriorated, minus the growth rate has received its share of the global crisis in Turkey, along with rising unemployment and poverty."
 Turkey.258.a:0 "An Economical Failure"
 Turkey.259.title:0 "Question of the Turanism"
 Turkey.259.desc:0 "Should we, move away from the Turkish Union by adopting a Westernizing policy as Kemalists or support Turanism as Kemalists?"
 Turkey.259.a:0 "Turkic Path Is The Correct Side"
 Turkey.259.b:0 "We Should Go With Western Path"
 Turkey.260.title:0 "Erdogan Challenges The Terrorist Groups"
 Turkey.260.desc:0 "In his speech, Erdogan announced a mobilization against terrorism. Erdogan: FETO on one side, YPG on one side, PKK on one side, ISIS on the other! said. The public greeted the speech with enthusiasm."
 Turkey.260.a:0 "Hurrah!"
 Turkey.261.title:0 "Payments On The IMF Debts"
 Turkey.261.desc:0 "The 1.6 billion dollar loan tranche linked to the fourth review is expected to be released later this month, while Turkey also began repayment of 2 billion 450 million 110 thousand dollars of debt to the IMF in 2003.\n\n1 billion 591 million 70 thousand dollars of principal money and 859 million 40 thousand dollars of interest payments consisting of 27 million 715 thousand dollars of debt was made at the end of March.\n\nTurkey will pay the IMF 45 million 187,500 on April 17 and 12,622 on April 30. In May, 185 million 750 thousand dollars will be paid.\n\nAugust and in November with 485 million 751 thousand dollars with 411 million 378 thousand dollars, if there is no need for a postponement, the most loaded payments will be made in August with 848 million 567 thousand dollars, while the IMF will be “renegotiable” of the portion of the repayments to be made this year."
 Turkey.261.a:0 "Turkey Shall Rise!" 
 Turkey.262.title:0 "GP Speech"
 Turkey.262.desc:0 "Young party (GP) leader Cem Uzan said they started the election campaign from Izmir.\n\nAddressing citizens who occasionally cut the front of the election bus, Uzan said:\n\n"Yes, I will find a job for the unemployed, I will give a salary of 350 UAH until I find it. Diesel fuel will be 1 YTL. OSS and fees will be lifted. "When you greet the people on the bus," will you keep your promise?" he said to the citizen, " I swear de Billahi diesel will be 1 YTL, " he said.\n\nThis was GP's election promise."
 Turkey.262.a:0 "What A Weird Election Promise" 
 Turkey.263.title:0 "The Guardians Of The Kemalism Returns"
 Turkey.263.desc:0 "The CHP declared that with the constitutional changes made, the army would be given the task of protecting secularism. Faik Oztrak of CHP announced that Internal Service Act 35 would be restored. \n\nHere's Article 35: Duty of the armed forces; to defend against future threats and dangers from abroad the Turkish homeland deter military power in ways that ensure the safekeeping of "veguclendirilm", the decision of the Grand National Assembly of Turkey to achieve peace and international "verilengorev" abroad is here to help."
 Turkey.263.a:0 "Secularism Shall Be Guarded" 
 Turkey.264.title:0 "The Supreme Military Shura 2007"
 Turkey.264.desc:0 "According to a statement on the website of the General Staff, 38 personnel were expelled from the TSK. As a result of the second term meeting of the Supreme Military Council, a total of 38 personnel, 7 of whom were from reacticai activities, were disconnected from the Turkish Armed Forces."
 Turkey.264.a:0 "Uncertain Times" 
 Turkey.265.title:0 "The Supreme Military Shura 2008"
 Turkey.265.desc:0 "According to the age decisions, the new holder of the post of Chief of the General Staff was General Ilker Basbug, Commander of the Land Forces. Basbug, who was born on April 29, 1943, will remain in the General Staff for 2 years, just like his predecessor, General Buyukanit, because of his age. Promoted to general in 2002, Başbuğ was the Chief of Staff of the Land Forces Command, General Staff 2. Presidency, 1. Following his duties as army commander, he was appointed to the Land Forces Command in 2006. Basbug, a recipient of TSK distinguished courage and renunciation, TSK Distinguished Service Medals, and the Order of Pakistan concession, is known as ‘calmer and sharper compared to his predecessor Buyukanit."
 Turkey.265.a:0 "Interesting, Decision of the General Staff" 
 Turkey.266.title:0 "The Supreme Military Shura 2010"
 Turkey.266.desc:0 "At the meeting of the Supreme Military Shura, held in the shadow of the" Sledgehammer " case, the decision finally came out. President Abdullah Gul approved the age decisions. According to the decisions, which were described as a surprise, no appointments were made to the General Staff and the Land Forces Command. Appointments are expected today.\n\nAs a justification for not appointing the chief of the General Staff, no appointment to the Land Forces Command is shown.\n\nThe appointment was not made because 1, which was raised with the claim of internet Andice and is expected to be appointed to the Land Forces Command. Army commander Gen. Hasan Igsiz's name is not on the list.\n\nIt is said that Atilla Işık may be appointed to the Land Forces Command.\n\nIn the list of decisions, there is also a list of expulsions and temdit (extension of the term of office). 11 generals accused of" Sledgehammer " also failed to get promoted."
 Turkey.266.a:0 "Interesting, Decision of the General Staff" 
 Turkey.267.title:0 "The Supreme Military Shura 2009"
 Turkey.267.desc:0 "The decisions of the Supreme Military Shura (YAŞ) were announced. In the work of the Shura, no decision has been made regarding the officers arrested or prosecuted in connection with the Ergenekon investigation. The three export decisions are related to soldiers who are stated to be engaged in repatriation activities. Shura's remarkable decision on promotions was the promotion of Diyarbakir Corps Commander Bekir Kalyoncu to general and the promotion of Colonel Levent Görgeç, who testified as part of the Ergenekon investigation, to Brigadier General."
 Turkey.267.a:0 "Interesting, Decision of the General Staff"
 Turkey.268.title:0 "Dollar Rises To 3.94"
 Turkey.268.desc:0 "The depreciation of the Turkish Lira against the American dollar continues. The courtship set a record again, rising to 3.9415. Thus, the depreciation of the TL against the dollar has exceeded 10 percent since the beginning of 2017."
 Turkey.268.a:0 "Bad News"  
 Turkey.269.title:0 "Dollar Rises To 5.09"
 Turkey.269.desc:0 "The dollar / TL rate rose to 5.09 after the US sanctions decision against Turkey. If the Euro / TL is dry, it has forced the 5.90 level.The composite interest on the 10-year benchmark bond stood at 18.53 percent, and the composite interest on the 2-year benchmark bond stood at 21.03. The dollar index was up 0.15 percent at 94.44 points in the morning, while the euro/dollar pair moved at 1.1678."
 Turkey.269.a:0 "Bad News"  
 Turkey.270.title:0 "Dollar Rises To 5.97"
 Turkey.270.desc:0 "The US dollar rose 0.36 per cent on the day to 5.97, based on the critical 6 thresholds. The dollar is trading at 5.98 as of 19.00 Turkish time. The Euro is at 6.60. At the first FOMC meeting of the year, which took place yesterday, the committee did not change interest rates as expected, with Fed Chairman Powell announcing they would continue to fund banks while highlighting weak inflation. Powell's comments reinforced expectations of a year-end quarter rate cut in the markets, but there was no apparent volatility on prices."
 Turkey.270.a:0 "Bad News"    
 Turkey.271.title:0 "Dollar Rises To 7.2"
 Turkey.271.desc:0 "Foreign exchange prices, which did not fill the record on weekdays, were the subject of curiosity. Dollar tests 7.20 as Asian stock markets open"
 Turkey.271.a:0 "Bad News"    
 Turkey.272.title:0 "Dollar Rises To 8.05"
 Turkey.272.desc:0 "A record-breaking dollar/TL with 7,9799 on the day of the interest decision of the Central Minister of the Republic of Turkey (CBRT) climbed to 8,0510 today. Drawing a similar chart, the euro / TL moved its historical level to 9,4851. As of 9.30 am, dollars/TL was changing hands from 8,0015 euros/TL to 9,4760. Sterling / TL is at 10,4248. The dollar/TL, which started the week with a record, rose to 8,0510."
 Turkey.272.a:0 "Bad News"   
 Turkey.273.title:0 "Turkish Space Program"
 Turkey.273.desc:0 "The National Space Program has been prepared to carry out our country's vision, strategies, goals, and projects in the field of space policy in a coordinated and integrated manner to evaluate the current potential in our country, taking into account developments on Earth."
 Turkey.273.a:0 "We need to advance in technology!"   
 Turkey.274.title:0 "Turkish Aircraft Shuttle Tests"
 Turkey.274.desc:0 "Our flight tests have been successful. We can continue our flight programs."
 Turkey.274.a:0 "Well done!"   
 Turkey.275.title:0 "Turkish Landing On The Moon"
 Turkey.275.desc:0 "For the first time, a Turkish Spaceship has landed on Moon, this is a historical moment, a document that our efforts have not been wasted."
 Turkey.275.a:0 "What a beautiful day in Turkey!" 
 Turkey.276.title:0 "Turkish Landing On Mars"
 Turkey.276.desc:0 "For the first time, a Turkish Spaceship has landed on Mars, this is a historical moment, a document that our efforts have not been wasted."
 Turkey.276.a:0 "What a beautiful day in Turkey!" 
 Turkey.277.title:0 "Turkish Resource Program In Mars"
 Turkey.277.desc:0 "We've seen that the special machines we sent to extract resources on Mars work. We can bring resources from Mars to our country, which is of course a big business challenge, but the return of these resources to us will be enormous. We plan to bring these resources to a place in our country, but we didn't know where to take them. So we ask you, where should we bring these resources?"
 Turkey.277.a:0 "Kayseri is a nice place for that!" 
