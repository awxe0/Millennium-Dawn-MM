 TurkeyF.189.title:0 "Turkey Pushes Us Against EU"
 TurkeyF.189.desc:0 "Turkey is pushing us to get out of Europe, to make us embrace Turkic ties and values. Are we going to allow this? Or are we not going to give it by continuing our pro-European stance?" 
 TurkeyF.189.a:0 "Never, We Would Stick With Our Ties" 
 TurkeyF.189.b:0 "Maybe Its Time To Leave EU" 
