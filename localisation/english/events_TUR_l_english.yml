 TurkeyF.83.title:0 "First Mafia Council Meeting Held"
 TurkeyF.83.desc:0 "As expected, all the mafias came together and signed a joint decision and signed it. According to the decisions taken, it turns out that now the government is dysfunctional and the mafias should control the country in terms of governance. Mafias are now expected to be armed and organized to control power. Mafia control and intervention are approaching." 
 TurkeyF.83.a:0 "Decisions Taken"
 TurkeyF.84.title:0 "Mafias Took Over The Regime"
 TurkeyF.84.desc:0 "After the mafias completed their preparations, they quickly overthrew the government with their own weapons forces and an attack on their IT networks. All the press and judicial bodies are in shock. There is literally an air of uncertainty in the country right now. There is also no response from the military. We will find out where this country is going with the passing of time." 
 TurkeyF.84.a:0 "Its Done Of The Civilian Government"
 TurkeyF.85.title:0 "Our Boys Take Over In Italy"
 TurkeyF.85.desc:0 "The mafias we organized in Italy achieved their goal and brought down the Italian government with their weapons and raids. Our mafia organization is growing." 
 TurkeyF.85.a:0 "Good To Hear"
 TurkeyF.86.title:0 "Our Boys Take Over In Mexico"
 TurkeyF.86.desc:0 "The mafias we organized in Mexico achieved their goal and brought down the Mexican government with their weapons and raids. Our mafia organization is growing." 
 TurkeyF.86.a:0 "Good To Hear"
 TurkeyF.87.title:0 "Assassination of The US President"
 TurkeyF.87.desc:0 "The president of the United States was assassinated late last night. With this assassination, the United States of America will attack us with all its might and beat itself up with this power of revenge. Now our ease of invading the United States has increased." 
 TurkeyF.87.a:0 "We're doing fine, keep it up!"
 TurkeyF.88.title:0 "European Religious Community Is Under Attack!"
 TurkeyF.88.desc:0 "The mafia began to find and shoot religious people on the street. This situation causes unrest and internal riots in Europe to increase. There is no entity as filthy as these mafias." 
 TurkeyF.88.a:0 "Agh! Damn Mafias!"
 TurkeyF.89.title:0 "Europe Is In Chaos!"
 TurkeyF.89.desc:0 "Europe is in a state of chaos right now. These mafias subverted the order and traditions found in Europe. These mafias must be destroyed. Otherwise, Europe will lose this war against the mafias in an environment of chaos." 
 TurkeyF.89.a:0 "It Is Getting Out Of Hand"
 TurkeyF.90.title:0 "United States Is In Chaos!"
 TurkeyF.90.desc:0 "The United States of America is in a state of chaos right now. These mafias subverted the order and traditions inherent in the United States. These mafias must be destroyed. Otherwise, the United States will lose this war against the mafias in an environment of chaos." 
 TurkeyF.90.a:0 "It Is Getting Out Of Hand"
 TurkeyF.91.title:0 "Question Of The Mafia Leader"
 TurkeyF.91.desc:0 "After the mafia council seized power, it submitted a motion to elect a mafia leader. We need to indirectly elect a mafia leader from this motion. Or we need to ignore the motion and move on from the main council." 
 TurkeyF.91.a:0 "Put Sedat Peker To Leadership"
 TurkeyF.91.b:0 "Put Kürt Idris To Leadership"
 TurkeyF.91.c:0 "Put Alaattin Çakıcı To Leadership"
 TurkeyF.91.d:0 "Let's Stay With The Home Council" 
 TurkeyF.92.title:0 "Deals With MHP"
 TurkeyF.92.desc:0 "A full agreement has been reached with MHP. MHP will support the wind of change within the Ak Party and ensure that Abdullah Gul replaces Recep Tayyip Erdogan. Long live the Winds of Reform!" 
 TurkeyF.92.a:0 "One Step To Victory"
 TurkeyF.93.title:0 "Deals With CHP"
 TurkeyF.93.desc:0 "A full agreement has been reached with the CHP. The CHP will support the wind of change within the Ak Party and ensure that Abdullah Gul replaces Recep Tayyip Erdogan. Long live the Winds of Reform!" 
 TurkeyF.93.a:0 "One Step To Victory"
 TurkeyF.94.title:0 "AK Party Calls for an Extraordinary Congress"
 TurkeyF.94.desc:0 "AK Party delegates have called for an extraordinary congress for the party. The call received an acceptance vote with most of the delegates. The AK party's candidate will be clearly defined at the next congress. The winds of reform within the AK Party began to accelerate." 
 TurkeyF.94.a:0 "A Start Of The Major Development"
 TurkeyF.95.title:0 "Gül Regime Repowers"
 TurkeyF.95.desc:0 "Abdullah Gul and his liberal group achieved extraordinary success at the congress and took the leadership from Recep Tayyip Erdogan. Afterward, Abdullah Gul and his group have now started preparations to announce the new government." 
 TurkeyF.95.a:0 "What A Wise Situation"
 TurkeyF.96.title:0 "Meetings With The Unions"
 TurkeyF.96.desc:0 "We have arranged a meeting with the union leaders. Such things as the wishes of the working class were discussed at the meeting. In accordance with their requests, the "Labor Package" will be announced by our government." 
 TurkeyF.96.a:0 "A Task Has Been Completed"
 TurkeyF.97.title:0 "Meetings With The Parties"
 TurkeyF.97.desc:0 "We held a meeting with the party leaders. At the meeting, such things as deepening the bureaucracy were discussed. In accordance with their requests, a "Declaration of Bureaucratic Renewal" will be announced by our government." 
 TurkeyF.97.a:0 "A Task Has Been Completed"
 TurkeyF.98.title:0 "Meetings With The Barzani"
 TurkeyF.98.desc:0 "As a result of negotiations with Barzani, we came to a common solution. The two sides will support each other against the PKK, and Turkey will grant the Kurds more rights." 
 TurkeyF.98.a:0 "A Nice Solution Of Peace"
 TurkeyF.99.title:0 "August Protests"
 TurkeyF.99.desc:0 "The growing authoritarianism of liberalism and the loss of its principles had recently led to a loss of votes within the AK party. In August, civil disobedience broke out as a result of the government issuing a lot of arrest warrants. Protests have surrounded cities. When the police tried to disperse the protests through violence, the protests turned violent. Molotovs were launched in the streets. As retaliation police attacked with flying gas bombs. The media, on the other hand, literally protested against the government. In the Parliament, the opposition made harsh speeches and Abdullah Gul's resignation was requested. It is necessary to quickly clarify the management. Indignation should be avoided and peace of mind should be achieved." 
 TurkeyF.99.a:0 "Suppress The Riots!"
 TurkeyF.100.title:0 "August Protests Began To Calm"
 TurkeyF.100.desc:0 "Things are starting to calm down. The protests have subsided. The AK Party is trying to be shown as the culprit of the protests and the balance sheet. We quickly got out of this situation. " 
 TurkeyF.100.a:0 "Nice To See"
 TurkeyF.101.title:0 "Military Coup Attempt Has Been Failed"
 TurkeyF.101.desc:0 "With the increasing influence of the Gülen Movement within the Turkish armed forces and the fact that the Turkish armed forces obtained custody of the tanks, the Gülen movement took to the streets with weapons to overthrow the country. Tanks surrounded the general staff and security bases. The people took to the streets to protest this and they went out on the tanks. The coup attempt attempted by the Gülen Movement failed in the morning. AK Party spokesman Çelik Kavataslak said that the Magistrate's Council of the Nation had failed and that it had been destroyed." 
 TurkeyF.101.a:0 "Decisive Victory For AKP!"
 TurkeyF.102.title:0 "European-USA Crisis"
 TurkeyF.102.desc:0 "Due to the tension that Turkey is experiencing with the United States, the European Union-America crisis has arisen. With the emergence of the crisis, sharp losses appear in the dollar and the euro. By overcoming this crisis with the European Union, we will take away the superpower status of the United States of America." 
 TurkeyF.102.a:0 "This Situation Is Not Abandonable"
 TurkeyF.103.title:0 "Abandoning Dollar In Trade Facilities?"
 TurkeyF.103.desc:0 "Sir, should we stop measuring the use of the dollar in trade and the economy? If we accept such a situation, we will cause the dollar to fall." 
 TurkeyF.103.a:0 "Abandon The Dollar"
 TurkeyF.103.b:0 "Stay With The Dollar"
 TurkeyF.104.title:0 "European Army Thoughts?"
 TurkeyF.104.desc:0 "Thoughts about the creation of the army of the European Union have recently caught up with the increase. How should we vote for the creation of an army of the European Union, sir? If the European Union army is established, we will not need a union like NATO." 
 TurkeyF.104.a:0 "European Army Should Be Created"
 TurkeyF.104.b:0 "Nonsense"
 TurkeyF.105.title:0 "Expanding European Military Service?"
 TurkeyF.105.desc:0 "Recently, it has been highly desirable for the countries of the European Union to increase the strength of their own armies. Sir, what kind of answer should we give to this situation? Should we increase the strength of our own army? or should we not improve by considering it an economic mistake?" 
 TurkeyF.105.a:0 "Military Has A Very Important Role In Every Sector"
 TurkeyF.105.b:0 "Military Is Just A Economical Deficit"
 TurkeyF.106.title:0 "Reaching The European Command Unity?"
 TurkeyF.106.desc:0 "Ensuring the unity of command of the European Union has been highly desired lately. Sir, how do we answer this question? Shall we join the command unit or not?" 
 TurkeyF.106.a:0 "Yes, Of Course"
 TurkeyF.106.b:0 "No, Command Unity Is Unnecessary"
 TurkeyF.107.title:0 "Increasing The European Military Interventionism?"
 TurkeyF.107.desc:0 "It has been very desirable recently for the European Union to intervene in other countries under the name of democracy. Sir, how do we answer this question? Can we give you some backup on the intervention?" 
 TurkeyF.107.a:0 "Go For It"
 TurkeyF.107.b:0 "We Believe In The Rules Of The Democracy"
 TurkeyF.108.title:0 "Talks With Greta"
 TurkeyF.108.desc:0 "According to the interviews with Greta, our ecological attitude is quite good. Through this, we can now go to the practice of Ecological Imperialism." 
 TurkeyF.108.a:0 "Another Achievement"
 TurkeyF.109.title:0 "Ergenekon Trials"
 TurkeyF.109.desc:0 "The Ergenekon trials were a series of high-profile trials 2008–2016 which took place in Turkey in which 275 people, including military officers, journalists, and opposition lawmakers, all alleged members of Ergenekon, a suspected secularist clandestine organization, were accused of plotting against the Turkish government. The trials resulted in lengthy prison sentences for the majority of the accused." 
 TurkeyF.109.a:0 "Kemalism Should Not Maintain In The Armed Forces"
 TurkeyF.110.title:0 "IBDA-C Overthrowns The Interim Government"
 TurkeyF.110.desc:0 "The armed forces of the IBDA-C took up positions on the street last evening and confiscated the supervisory boards. Thus, the provisional government fell. In addition, a movement against the coup of IBDA-C was not included because the public, in general, supports IBDA-C." 
 TurkeyF.110.a:0 "A New Islamic Age Rises For The Nation!"
 TurkeyF.111.title:0 "Elections For The New Caliph"
 TurkeyF.111.desc:0 "Delegates from Muslim countries were gathered and the first caliph elections were held. Thanks to the elections, Islamic unity was won. May this new caliph period be beneficial for all Muslim countries." 
 TurkeyF.111.a:0 "Ebu Hanzala Is The True Person For Becoming The Caliph"
 TurkeyF.111.b:0 "Salih Mirzabeyoğlu Is The True Person For Becoming The Caliph" 
 TurkeyF.112.title:0 "Islamic State Threatens Us With Releasing Immigrant Waves"
 TurkeyF.112.desc:0 "The Islamic State is openly threatening us. Either we don't go to war with them and just stand there, or we fight them and suffer a wave of migration. Sir, what should be our decision? War or neutrality?" 
 TurkeyF.112.a:0 "What Are They Thinking About?"
 TurkeyF.113.title:0 "Islamic Unification Ultimatum"
 TurkeyF.113.desc:0 "Our country is being urged to unite by the jihadist Islamic state. If we do not comply with the call, the Islamic state will declare us enemies and we will be on the side of non-Muslims, otherwise, we will join our cause and wage jihad against non-Muslims." 
 TurkeyF.113.a:0 "We Should Join The Islamic Case"
 TurkeyF.113.b:0 "We Shouldn't Be Ally With Radical Islamists"
 TurkeyF.114.title:0 "Umayyad Offers Peace?"
 TurkeyF.114.desc:0 "The Islamic-Christian war has reached a point where it will no longer progress. After that, the new Umayyad, the head of the Islamic side, sent us a peace offer. Sir, shall we accept the offer of peace and put an end to this horror?" 
 TurkeyF.114.a:0 "Yes, We Need This Peace"
 TurkeyF.114.b:0 "This War Would Continue Until The End!"
 TurkeyF.115.title:0 "Interim Government Changes With Ottomans"
 TurkeyF.115.desc:0 "The provisional government has become the Ottoman regime as of now. This is the beginning of the new Ottoman era. With the understanding of jihad and Gaza, we will grow and strengthen the new Ottoman Empire." 
 TurkeyF.115.a:0 "Long Live The New Ottoman Empire!"
 TurkeyF.116.title:0 "Death Of The Republic"
 TurkeyF.116.desc:0 "There is no longer a republic. There is an empire and power now. Now we can make our own way and plan. God bless the state!" 
 TurkeyF.116.a:0 "This Is A New Beginning"
 TurkeyF.117.title:0 "Coronation Of The Orhan Osmanoğlu"
 TurkeyF.117.desc:0 "Orhan Osmanoğlu became the owner of the crown, which had been derelict for a long time. We hope that our new sultan will succeed in his post. Also with the return of the monarchy, the country has been completely cut off from the republic." 
 TurkeyF.117.a:0 "Let's See How The New Leadership Goes"
 TurkeyF.118.title:0 "Declaration Of The Anti-Gülenist Fatwa"
 TurkeyF.118.desc:0 "The Anti-Gulenist declaration was issued by the Islamic Ulema. Thanks to this Anti-Gulenist fatwa, we will get rid of this filthy Islamic merchant organization." 
 TurkeyF.118.a:0 "Nice, Its Time To Destroy These Gülenists!"
 TurkeyF.119.title:0 "Declaration Of The Islamic Jihad"
 TurkeyF.119.desc:0 "The Ottoman Islamic Ulama gathered and called Muslims to jihad. With this call for jihad, we will comfortably defeat the enemies of Muslims." 
 TurkeyF.119.a:0 "Its Time For The Final Strike!"
 TurkeyF.120.title:0 "Ottoman Empire Wants To Make Oil-Army Deal"
 TurkeyF.120.desc:0 "Ottoman diplomats offered our country an oil deal to save the current state of the Middle East. If we accept this oil deal, we will reduce our military power in the Middle East, and they will increase their effectiveness in the Middle East, but they will give us barrels of oil and bases in return. If we oppose the agreement, I am afraid that we may have to go to war with the Ottoman Empire." 
 TurkeyF.120.a:0 "The Deal Seems To Acceptable"
 TurkeyF.120.b:0 "No Concessions Can Be Made In The Middle East"
 TurkeyF.121.title:0 "America Accepts Our Oil-Army Deal"
 TurkeyF.121.desc:0 "America has accepted the oil deal. They will reduce their military power in the Middle East, and we will increase their effectiveness in the Middle East, but we will give them barrels of oil and bases in return." 
 TurkeyF.121.a:0 "Good To Hear"
 TurkeyF.122.title:0 "America Rejects Our Oil-Army Deal"
 TurkeyF.122.desc:0 "America rejected the oil deal. They will not reduce their military forces in the Middle East, and we will go to war officially or unofficially against America to increase our effectiveness in the Middle East." 
 TurkeyF.122.a:0 "Terrible News"
 TurkeyF.123.title:0 "Armed Neo-Nazis Take Action"
 TurkeyF.123.desc:0 "Neo-nazis armed by the Ottoman and other forces open fire with their weapons in the street. It is necessary to stop them immediately, if they are not prevented, power will soon fall into the hands of monarchists and fascists." 
 TurkeyF.123.a:0 "Arrest These Monsters!"
 TurkeyF.124.title:0 "The Immigration Waves From Ottomans"
 TurkeyF.124.desc:0 "The Ottoman State began to openly send refugees to us. This will lead to an uprising of the radical part of the country and an increase in their support. We must prevent this immediately and take control of our borders." 
 TurkeyF.124.a:0 "Send Arms To The Borders!"
 TurkeyF.125.title:0 "Instability Rises Across The Country"
 TurkeyF.125.desc:0 "Internal conflicts have now led the government to resign and instability. It is only a matter of time before our current regime resigns and falls and falls into the hands of the radicals. If we are strong, we will come out of these internal conflicts and internal games in a solid way." 
 TurkeyF.125.a:0 "Ouf.."
 TurkeyF.126.title:0 "Ottomans Asks For Making Crimean Agreement"
 TurkeyF.126.desc:0 "The Ottoman State wants Crimea to become an independent state, in return, they will take an attitude towards Ukraine. How should we act and answer this offer as a Russian Government?" 
 TurkeyF.126.a:0 "These Conditions of Agreement Are Acceptable"
 TurkeyF.126.b:0 "These Conditions of Agreement Are Unacceptable"
 TurkeyF.127.title:0 "Russia Refuses Ottoman Requests"
 TurkeyF.127.desc:0 "The Russian State called our proposal absurd and stated that they refused it. For this reason, the title of peace in the Black Sea has become turbulent." 
 TurkeyF.127.a:0 "Not Good At All"
 TurkeyF.128.title:0 "Ottomans Demand Protection"
 TurkeyF.128.desc:0 "The Ottoman State believes that it should protect us from Russia. That's why they sent us a plea offer. If we accept this offer, Ottomans will enter our territory for defense purposes, and if we don't accept it, they will attack us with their weapons." 
 TurkeyF.128.a:0 "We Need The Turkish Protection"
 TurkeyF.128.b:0 "We Don't Need The Imperialist Protection"
 TurkeyF.129.title:0 "Georgia Refuses Turkish Protection"
 TurkeyF.129.desc:0 "Georgia rejected Ottoman's defense offer. At that time, Ottomans will confiscate Georgia with its weapons to protect Georgia." 
 TurkeyF.129.a:0 "We Are Going To Enter Georgia By Arms Then"
 TurkeyF.130.title:0 "Ottomans Wants To Submit Muslim Europe"
 TurkeyF.130.desc:0 "The Ottoman empire is sending an ultimatum to the Muslim European states to join it. As a Muslim state located in Europe, we should also take an attitude towards the Ottoman State. Should we join the Ottoman Empire by following an Ottoman side or should we start war preparations against the Ottoman forces?" 
 TurkeyF.130.a:0 "As A Muslim European Nation, We Should Join Ottomans"
 TurkeyF.130.b:0 "We Are Not The Puppets Of The Ottomans"
 TurkeyF.131.title:0 "Ottomans Wants Germany To Proposal New Central Powers"
 TurkeyF.131.desc:0 "The Ottoman Empire is calling on Germany to make an alliance again. Their goal is to bring up old traditions and restore our strength. Sir, how should we respond to the Ottoman's request?" 
 TurkeyF.131.a:0 "A Pretty Nice Idea"
 TurkeyF.131.b:0 "The Past Is Passed Away"
 TurkeyF.132.title:0 "Germany Refuses Our Request"
 TurkeyF.132.desc:0 "Germany supports staying in the current situation by rejecting our offer. This is their loss. We need to keep moving abroad." 
 TurkeyF.132.a:0 "They Have Made Huge A Mistake"
 TurkeyF.133.title:0 "Austria Wants To Join Central Powers"
 TurkeyF.133.desc:0 "Austria wants to join the alliance we have established with the Ottoman Empire. We can accept such an offer in order to return to our former days. Sir, what will be our answer?" 
 TurkeyF.133.a:0 "Of Course, Together We Are Stronger"
 TurkeyF.133.b:0 "Austria Is The Enemy Of The New Germany!"
 TurkeyF.134.title:0 "Germany Refuses Austrian Request"
 TurkeyF.134.desc:0 "Germany refuses our offer of alliance. It's their loss. Whereas we could remind the world of our old days together." 
 TurkeyF.134.a:0 "Fine"
 TurkeyF.135.title:0 "Ottomans Ask For Future Border Proposal"
 TurkeyF.135.desc:0 "It seems that in the future there will be a shortage of borders between Austria and the Ottomans. That's why we're offering Austria a deal to make an agreement." 
 TurkeyF.135.a:0 "Proposal Would Be Effective"
 TurkeyF.135.b:0 "Proposal Would Be Unnecessary"
 TurkeyF.136.title:0 "Austria Makes The Border Proposal"
 TurkeyF.136.desc:0 "Vienna accepted Istanbul's offer and stated that border disputes that may arise in the future will not occur and will be resolved if they occur. This is very good news for our country." 
 TurkeyF.136.a:0 "Good News"
 TurkeyF.137.title:0 "Austria Refuses The Border Proposal"
 TurkeyF.137.desc:0 "Vienna rejected Istanbul's offer and declared that border disputes that may occur in the future and now will be ended through conflicts if they occur. This is quite bad news for our country. It seems that we cannot get out of this business without making war with Austria." 
 TurkeyF.137.a:0 "Fine"
 TurkeyF.138.title:0 "MHP Tours The Turkey"
 TurkeyF.138.desc:0 "MHP continues to tour Turkey. A lot of things were done on the tour, such as plans for solutions to the country's problems. Our people seem to be extremely satisfied with the rising right-wing party." 
 TurkeyF.138.a:0 "Excellent"
 TurkeyF.139.title:0 "Formalization Of The Front Of Right"
 TurkeyF.139.desc:0 "The right-wing front has been established. The reason for the establishment of this front is the struggle against the traitors which is created by Communism and the left. This right-wing front will be a tool for our development and return to our traditions as a united." 
 TurkeyF.139.a:0 "United, We Are Strong"
 TurkeyF.140.title:0 "Idealization Of OIC"
 TurkeyF.140.desc:0 "Our President said that all Muslims should be in unity and announced that the Organization of Islamic Cooperation was moving to activities to take on a more organized form and strengthen it." 
 TurkeyF.140.a:0 "Overview Is Good"
 TurkeyF.141.title:0 "Turanist Enlargement Planning"
 TurkeyF.141.desc:0 "Now we can strengthen and expand our country along the lines of Turkishness by shining a light on expansion policies in the name of Turkishness. We believe that this will end well." 
 TurkeyF.141.a:0 "Nihal Atsiz Was Right About Expansionism!"
 TurkeyF.142.title:0 "Islamic Enlargement Planning"
 TurkeyF.142.desc:0 "We will expand our country in the name of spreading Islam. With this expansion, the regions around us and those we have captured will become permanent Muslims." 
 TurkeyF.142.a:0 "For The Power Of Jihad!"
 TurkeyF.143.title:0 "Creation Of Front Of The Organisation of Islamic Cooperation"
 TurkeyF.143.desc:0 "The Organization of Islamic Cooperation is turning to a united front. With the formation of this union as a front, we will become a much stronger state and prevent our enemies from entering our region." 
 TurkeyF.143.a:0 "Its Time For The Rise Of New Power!"
 TurkeyF.144.title:0 "Talks With Turkic Union Countries"
 TurkeyF.144.desc:0 "A dozen unique negotiations were held in order to bring the Turkish Union closer to the Organization of Islamic Cooperation. These negotiations will ensure the formation of a large union in the future." 
 TurkeyF.144.a:0 "Sounds Good"
 TurkeyF.145.title:0 "Talks With Islamic Countries"
 TurkeyF.145.desc:0 "A dozen unique negotiations were held in order to bring the Organization of Islamic Cooperation closer to the Turkish Union. These negotiations will ensure the formation of a large union in the future." 
 TurkeyF.145.a:0 "Sounds Good"
 TurkeyF.146.title:0 "Turkey Invites Us To The Invasion Of Iran"
 TurkeyF.146.desc:0 "Turkey is inviting us to war with Iran. If we participate in this war, we can get good returns and contribute to the Turkish Union." 
 TurkeyF.146.a:0 "Let's Finish These Iranis"
 TurkeyF.146.b:0 "We Don't Need To Take Risks"
 TurkeyF.147.title:0 "Turkmenistan Rejects Our Invitation"
 TurkeyF.147.desc:0 "Turkmenistan has declared that it will not enter the war and will continue to maintain a neutral position. This declaration of neutrality will surely affect the Turkish Union badly." 
