l_english:

 ####### Turkish Local Events #######
 Turkey.1.title:0 "Operation Of Return To Life"
 Turkey.1.desc:0 "With the protests and hunger strikes from prisoners, we understood that we need to give liberty to some prisoners which have got no liberty. Our government has to introduce a new amnesty bill. With this amnesty, our people will be satisfied and happy. Let's start amnesty plans."
 Turkey.1.a:0 "It Looks Bad"
 Turkey.2.title:0 "Turkish People's Expectation From 2000's"
 Turkey.2.desc:0 "Our people want and dream about a much stronger Turkey in the 2000s. We are going to be strong and indestructible in the following years as we hope."
 Turkey.2.a:0 "2000s Will Be Our Year!"
 Turkey.3.title:0 "Turkish 2001 Economic Crisis "
 Turkey.3.desc:0 "On February 19, 2001, Prime Minister Ecevit emerged from a meeting with President Sezer saying, "This is a serious crisis." This underscored financial and political instability and led to further panic in the markets. Stocks plummeted and the interest rate reached 3,000%. Large quantities of Turkish lira were exchanged for U.S. dollars or euros, causing the Turkish central bank to lose $5 billion of its reserves. The crash triggered even more economic turmoil. In the first eight months of 2001, 14,875 jobs were lost, the dollar rose to 1,500,000 liras, and income inequality had risen from its already high level."
 Turkey.3.a:0 "Oooh..."
 Turkey.4.title:0 "Air Disaster!"
 Turkey.4.desc:0 "16 May-a CASA-type military cargo plane produced by TAI crashed near Akcadag, Malatya. 34 soldiers have died, 10 of them are Turks."
 Turkey.4.a:0 "Bad News"
 Turkey.5.title:0 "Protests Against Government"
 Turkey.5.desc:0 "With the 2001 crisis, the Turkish people began to protest the government in the streets. These events are going to be the end of our pro-western government. "
 Turkey.5.a:0 "Ough..."
 Turkey.6.title:0 "Early Elections!"
 Turkey.6.desc:0 "In a vote at the General Assembly of the parliament, the motion for early elections was adopted by 449 of the 514 deputies who participated in the vote."
 Turkey.6.a:0 "Prepare The Chests"
 Turkey.7.title:0 "Prime Minister Bülent Ecevit Was Taken To Hospital"
 Turkey.7.desc:0 "Prime Minister Bülent Ecevit was disturbed in the Central Building and he was taken to Baskent University Hospital."
 Turkey.7.a:0 "Government Is Collapsing"
 Turkey.8.title:0 "Creation Of AKP"
 Turkey.8.desc:0 "After the close of the Right Wing Islamist Fazilet party, Fazilet party's founders created a different party called AKP. This party is moderate Islamist and this party originally worked with the Islamic ***** movement."
 Turkey.8.a:0 "This party is a continuation of the Fazilet party"
 Turkey.9.title:0 "Rise Of AKP"
 Turkey.9.desc:0 "The AKP quickly began to gain power in the country. AKP rallies are filled with so many people. At this rate, this country will fall into the hands of the Islamists! Should we do something?"
 Turkey.9.a:0 "Push Anti-AKP Propaganda"
 Turkey.9.b:0 "Let It Go"
 Turkey.10.title:0 "Rise Of CHP"
 Turkey.10.desc:0 "Secular people who voted for our party began to move to the CHP. At this rate, our government will fall."
 Turkey.10.a:0 "Oh No!"
 Turkey.11.title:0 "Elections Campaign"
 Turkey.11.desc:0 "The 15th Turkish general election was going to be held on 3 November 2002 following the collapse of the DSP-MHP-ANAP coalition led by Bülent Ecevit. It was the 15th general election going to be held in Turkey. All 550 members of the Grand National Assembly were up for election."
 Turkey.11.a:0 "Let's Gooo!"
 Turkey.12.title:0 "Protests In Istanbul"
 Turkey.12.desc:0 "Many people protested against the plans of the United States to invade Iraq in Istanbul. With this event, our people's opposition to the United States has increased enormously."
 Turkey.12.a:0 "Uncertain Times"
 Turkey.13.title:0 "A Wild Offer"
 Turkey.13.desc:0 "United States invites us to war against Iraq as a NATO force. United States has announced that it will give us $ 6 billion if we go to war against Iraq. Sir, what should we do about this? Shall we join or not."
 Turkey.13.a:0 "We Need $10 Billion"
 Turkey.13.b:0 "Let's Join The Operation!"
 Turkey.13.c:0 "We Respect The Independence Of Iraq"
 Turkey.14.title:0 "Turkish Offer"
 Turkey.14.desc:0 "the Turkish government announces that it will withhold approval to war unless the United States increases a reciprocal $6 billion foreign aid grant to $10 billion."
 Turkey.14.a:0 "We Need Our Ally In Our Cause"
 Turkey.14.b:0 "No, We Are Better Without Them"
 Turkey.15.title:0 "United States Accepts"
 Turkey.15.desc:0 "US increased its mutual 6 billion foreign aid grant to $10 billion so we can join the so called Liberation Operation of Iraq."
 Turkey.15.a:0 "We Are Ready For Operation!"
 Turkey.16.title:0 "America Rejects"
 Turkey.16.desc:0 "US decided to not increase its mutual 6 billion foreign aid grant to $10 billion so we don't go to war with Iraq."
 Turkey.16.a:0 "No war then,"
 Turkey.17.title:0 "Rauf Denktas Rejects UN Cyprus Unification Plan"
 Turkey.17.desc:0 "Rauf Denktaş, chief of the Turkish Cypriots, rejected the latest version of a United Nations plan to reunite Cyprus so Northern Cyprus remains independent."
 Turkey.17.a:0 "Nice"
 Turkey.19.title:0 "Recep Tayyip Erdogan is elected to the parliament"
 Turkey.19.desc:0 "Recep Tayyip Erdoğan is elected to the Turkish parliament and is expected to become Prime Minister soon. Erdoğan supports deployment of US troops in Turkey and is expected to call for a new vote on the issue as one of his first official acts."
 Turkey.19.a:0 "Interesting"
 Turkey.20.title:0 "Turkish-US Crisis"
 Turkey.20.desc:0 "A Turkish military personnel operating in northern Iraq were captured, led away with hoods over their heads, and interrogated by the United States military."
 Turkey.20.a:0 "USA is going to pay for that!"
 Turkey.21.title:0 "Victory In The Eurovision"
 Turkey.21.desc:0 "Sertab Erener wins the Eurovision Song Contest with the song Everyway That I Can, Turkey's first victory in the contest. We are proud of her."
 Turkey.21.a:0 "Nice Nice Nice!"
 Turkey.22.title:0 "IBDA-C Bombings!"
 Turkey.22.desc:0 "Two more truck bombs exploded at the headquarters of HSBC Bank AS and the British Consulate, killing thirty people and wounding 400 others. The bombers appeared to have waited for the traffic lights in front of the HSBC headquarters on the Büyükdere Avenue in Levent to turn red to maximize the effects. Several Britons were killed in the two attacks, including the top British official in Istanbul, consul general Roger Short, while the rest of the victims were mostly Turkish citizens (such as actor and singer Kerem Yilmazer), as in the earlier synagogue blasts."
 Turkey.22.a:0 "Aman Tanrım"
 Turkey.23.title:0 "2004 Turkish Local Elections"
 Turkey.23.desc:0 "The Turkish local elections of 2004 were held throughout the eighty-one Provinces of Turkey on 28 March 2004 to elect both mayors and councilors to local government positions. All 16 metropolitan and 3,193 district municipalities were up for election, while 3,208 provincial and 34,477 municipal councilors were also elected. More than 50,000 neighborhood presidents (muhtars) were also elected, though these do not have any political affiliations."
 Turkey.23.a:0 "People has spoken"
 Turkey.24.title:0 "Afyon's Name Changed To Afyonkarahisar"
 Turkey.24.desc:0 "The name of Afyon province was changed to Afyonkarahisar."
 Turkey.24.a:0 "More Longer Name? Ok"
 Turkey.25.title:0 "School Act"
 Turkey.25.desc:0 "President Ahmet Necdet Sezer approved the law on the addition of temporary articles to the higher education law, known as” student amnesty", which brings new rights to students who have been dismissed from universities."
 Turkey.25.a:0 "Let's Increase The Education"
 Turkey.26.title:0 "A Syrian missile crashed in Turkish borders"
 Turkey.26.desc:0 "A Syrian missile crashed in the Kirikhan district of Hatay. The missile caused the explosion at two separate points 25 kilometers from the Syrian border. The Syrian General Staff informed the Turkish General Staff about the issue and reported their sadness."
 Turkey.26.a:0 "Sad"
 Turkey.27.title:0 "Another Protest, Another Assassination Attempt"
 Turkey.27.desc:0 "At the opening of the new academic year in Kütahya, a man named Mustafa Baghdad was detained while trying to protest Prime Minister Recep Tayyip Erdogan. A check said the gun was found hidden inside the bread the suspect was carrying in a bag. Mustafa Baghdad was arrested the next day."
 Turkey.27.a:0 "Aman Tanrım"
 Turkey.28.title:0 "Danistay Attack"
 Turkey.28.desc:0 "The Council of State Building was attacked by gunmen. 1 killed, 4 injured."
 Turkey.28.a:0 "Terrorists!"
 Turkey.29.title:0 "Republic Of Claim Action"
 Turkey.29.desc:0 "Turkey's preservation and maintenance of its secular identity have been an issue and source of tension long before the demonstration. In the past, Prime Minister Recep Tayyip Erdoğan has spoken out against the active restrictions on wearing Islamic-style head scarves in government offices and schools and has taken steps to bolster religious institutions. According to Guardian Unlimited, Erdoğan showed his Islamist nature when he initiated a move in 2004 to criminalize adultery, which eventually failed under intense pressure from the secularist forces in the country and the European Union, which Turkey has been trying to join.\n\nGeneral Yaşar Büyükanıt, Chief of the Turkish General Staff, warned against Islamic fundamentalism in October 2006. Prime Minister Erdoğan replied that there was no such threat. In a press conference two days before the demonstration, Büyükanıt stated: "We hope that someone is elected president who is loyal to the principles of the republic — not just in words but in essence." This statement was widely interpreted as a hint from the General urging Erdoğan not to run.\n\nThe serving president, Ahmet Necdet Sezer, aimed a clear swipe at Erdoğan the day before the demonstrations by stating, "The threat which Islamic fundamentalism poses to the country is higher than ever."Although the post is mainly ceremonial, the Turkish president has the power to veto laws if he holds them to be in violation of the Constitution of Turkey, as well as to veto appointments to the highest positions of the state administration, such as the presidencies of universities and many public institutions. Sezer, a former chief of the Constitutional Court, did so many times during his years in office. In a recent poll by Hürriyet, a majority of the participants agreed with the president's assessment.\n\nOn April 24, foreign minister Abdullah Gül was announced as the official candidate of the Justice and Development Party, by Erdoğan. His candidacy was controversial from the beginning due to his background of two proscribed Islamic political parties, and his statement "We want to change the secular system", in an interview published by the Guardian in 1995. Nevertheless, additional concerns were also present, including the effect of the hijab-style clothing of his spouse on Turkey's image, who previously filed a case against Turkey for the ban on public buildings.\n\nOn 14 April the first protest took place in Tandoğan square in Ankara. The number of people gathering in front of Anıtkabir, the mausoleum of Mustafa Kemal Atatürk in Ankara, was cited as ranging from "hundreds of thousands" to 1.5 million people. The first protest was one of the largest that Turkey had seen in years until then. The target of the first protest was the possible presidential candidacy of the then Prime Minister Recep Tayyip Erdoğan (the outcome of which will be determined by the Turkish Grand National Assembly (unless the recent modifications to the constitution become ratified on time), in which Erdoğan's Justice and Development Party (AKP) has a healthy majority). Erdoğan decided not to run for president after the rally.\n\nThe slogan of the protest was Claim Your Republic. According to the Ministry of the General Staff of the Turkish Armed Forces, who administer Anıtkabir, 370,000 people visited the monument on that day, but eyewitness accounts from those who participated say that at least twice that amount was not able to enter the crowded grounds. Police announcements gave conflicting numbers ranging from about 70,000 to 150,000 participants which were criticized among police officials themselves stating "such announcements hurt the credibility of the department."CNN Türk spoke of more than 650,000 at the meeting.\n\nThe demonstrators had different motives, including the suspicion that Erdoğan, who is thought to be attached to political Islam, will alter the secular state. Erdoğan's government denies having an Islamic agenda, but according to CNN, some critics argue that the government is inching the country towards the increased religious rule. Erdoğan has had run-ins with the law in the past: He was tried and convicted for "inciting religious hatred" and had consequently served a four-month jail term in 2000 while he was the Mayor of Istanbul, Turkey's most populous city. According to the Guardian Unlimited, the pro-Islamic prime minister's party has been eroding secularists' longtime grip on power.\n\nThe protest was initiated by the "Atatürk Thought Association" and supported by around 300 non-governmental organizations in Turkey. First, some 60,000 people who traveled from all over Turkey by bus arrived at the protest in the early hours of Saturday, 14 April. People traveled by train and the residents of Ankara joined the protest overfilling Tandoğan Square and the nearby streets two hours before the official beginning. Among the protesters were also leaders of the opposition parties, Deniz Baykal (CHP), Zeki Sezer (DSP), and some professors of various universities wearing academic regalia. Protesters, waving the Turkish flag and carrying banners depicting Atatürk, chanted "Turkey is secular and will remain secular" and "We don't want an imam as president!" The demonstration in downtown Ankara ended at 13:00 local time (10:00 GMT). Afterward, the crowd marched to the Anıtkabir to pay their respect to the founder of the republic.\n\nDuring the demonstrations, flight above Tandoğan Square and Anıtkabir was banned. Twelve ambulances and eleven police APCs were kept on standby in the surrounding streets. A contingent of 10,000 police officers watched over the crowd, but the demonstration ended peacefully.\n\nAlthough the demonstrations received international media attention, all but one (Kanal Türk) of the local networks gave the demonstrations very little coverage. Habertürk director Melih Meriç said the lack of local coverage is because of political pressure."
 Turkey.29.a:0 "This is not good..."
 Turkey.30.title:0 "TSK's E-memorandum"
 Turkey.30.desc:0 "E-memorandum is a controversial General Staff statement released on its website in 2007 weighing in the Turkish presidential elections in 2007. The candidate that would most likely be elected was Abdullah Gül. Turkey's presidential office is regarded as the guardian of the country's secular system; the fact that Gül's wife wears the Islamic headscarf, as well as his history in political Islam, turned the elections into a political crisis. \n\nDuring the crisis, in April 2007, this statement was published on Turkish Armed Forces official website regarding the Turkish presidential elections:\n\n"The problem that emerged in the presidential election process is focused on arguments over secularism. Turkish Armed Forces are concerned about the recent situation. the Turkish Armed Forces are a party in those arguments and an absolute defender of secularism. Also, the Turkish Armed Forces are opposed to those arguments and negative comments. It will display its attitude and action openly and clearly whenever it is necessary ... Those who are opposed to Great Leader Mustafa Kemal Atatürk's understanding of 'How happy is the one who says I am a Turk' are enemies of the Republic of Turkey and will remain so. The Turkish Armed Forces maintain their sound determination to carry out their duties stemming from laws to protect the unchangeable characteristics of the Republic of Turkey. Their loyalty to this determination is absolute."\n\nThe e-memorandum term was coined by Ural Akbulut to describe the General Staff statement because it was published exclusively online."
 Turkey.30.a:0 "E-memorandum?"
 Turkey.31.title:0 "Victorius CHP"
 Turkey.31.desc:0 "As a result of the CHP's application, the Constitutional Court annulled the first round of the presidential election, finding it unconstitutional."
 Turkey.31.a:0 "Damn"
 Turkey.32.title:0 "Terrorist Attack In Sırnak"
 Turkey.32.desc:0 "A passenger van was swept away by PKK militants near the village of Bashagach in the Beytushshebap District of Sirnak, killing and injuring 13 people. It was announced that 7 of the dead were village guards."
 Turkey.32.a:0 "Aman Tanrım"
 Turkey.33.title:0 "Strikes In The Turk Telecom"
 Turkey.33.desc:0 "For the first time in history, The Willing Workers of Turk Telekom in all of Turkey have started a strike."
 Turkey.33.a:0 "Aman Tanrım"
 Turkey.34.title:0 "A referendum for people"
 Turkey.34.desc:0 "A referendum was held in Turkey to elect the president of the people. The result of the referendum was yes. The president will no longer be elected by Parliament."
 Turkey.34.a:0 "Nice"
 Turkey.35.title:0 "Battle With Al-Qaeda"
 Turkey.35.desc:0 "In 13 hours of operations against al-Qaeda in Gaziantep, 25 militants were captured, 2 of whom were dead. 1 police officer died."
 Turkey.35.a:0 "Terrorists Are Cleaned"
 Turkey.36.title:0 "Deputies Ask For Continuation Of Headscarves Ban"
 Turkey.36.desc:0 "CHP, DSP deputies, and Tunceli independent MP Kamer Genç applied to the Constitutional Court for the continuation of the ban on headscarves in Turkey."
 Turkey.36.a:0 "They are gonna fail"
 Turkey.37.title:0 "2008 AKP Closure Case"
 Turkey.37.desc:0 "On 18 March 2008, documents requesting a closure trial of the ruling AKP were presented to the Constitutional Court of Turkey. On 31 May 2008, the Constitutional Court announced that it would accept the indictment of the Chief Public Prosecutor of the Supreme Court of Appeals, Abdurrahman Yalçınkaya, and hear the case concerning the closure of the party. As for banning politicians, the indictment cited 61 speeches and actions by Erdoğan, 16 for Arınç, and 10 for Gül when he was Minister of Foreign Affairs."
 Turkey.37.a:0 "Unacceptable"
 Turkey.38.title:0 "Time Delay For Turksat 3A"
 Turkey.38.desc:0 "The Türksat 3A satellite was delayed due to a last-minute malfunction."
 Turkey.38.a:0 "Fine"
 Turkey.39.title:0 "Turksat 3A was successfully launched!"
 Turkey.39.desc:0 "Turksat 3A was successfully launched into space at 01.05 Turkish time. Our country is developing and will continue to develop!"
 Turkey.39.a:0 "A Major Development"
 Turkey.40.title:0 "Murder of Ahmet Yildiz"
 Turkey.40.desc:0 "Marmara University Physics Department student Ahmet Yildiz filed a criminal complaint with the prosecutor about a year before the incident because he had received threats from his family. On the night of 15 July 2008, Yildiz, who had gone to a cafe, faced the attacker following which he tried to get out of his car and escape. He was shot three times in the chest and eventually died from his injuries. Out of the five bullets that were shot, one injured the AKP's nominee for parliament Ümmühan Daraca. Commenting after the incident, Yildiz's cousin Ahmet Kaya said, "Yildiz was the only son of an extremely religious and wealthy Kurdish family in Şanliurfa". Lambda Istanbul's human rights lawyer Firat Söyle, who had previously served as a consultant to Yildiz, said that three months before the murder, Yildiz filed a complaint with the district attorney's office after receiving death threats from his family, but the prosecutor's office refused to initiate an investigation or provide protection to Yildiz. Yildiz's murder event had wide repercussions in the local and foreign press."
 Turkey.40.a:0 "Rest In Peace"
 Turkey.41.title:0 "Istanbul Bombings"
 Turkey.41.desc:0 "The 2008 Istanbul Bombings occurred on July 27, 2008, when two explosions hit a busy shopping street in the Güngören district of Istanbul, killing seventeen people, five of them children, and injuring 154. A pedestrian street is closed to traffic. The bombings were the deadliest civilian attacks in Turkey since the 2003 Istanbul bombings, five years earlier.\n\nThe first of the two bombs was a sonic bomb which was placed in a telephone cabin and the second bomb was placed in a waste container 50 meters away, near a crowded street. The first bomb caused crowds to gather for help and curiosity, and around 10 minutes later, the second and more powerful bomb exploded, causing many casualties. The police believe that the bombs were activated remotely. Political analyst Damla Aras said that "There is a possibility they might be A4, C-4 explosives, which were brought from northern Iraq by the PKK and have been used several times in Turkey."
 Turkey.41.a:0 "Aman Tanrım"
 Turkey.42.title:0 "Constitutional Court Lets AKP Live"
 Turkey.42.desc:0 "With only 6 members voting for closure (7 would have been needed), the Court has rejected the demands of the prosecutor and did not ban the party. The court gave its verdict on 9 July 2009 rejecting the demand, and the case against the Justice and Development Party was terminated. The European Union was relieved by the decision by Turkey's highest court not to ban the ruling AKP. Joost Lagendijk, a member of the European Parliament who works on matters regarding Turkey said: Everybody is very happy with this decision, otherwise it would have created a hell of a situation for Turkey. Also, The trial started 4.5 months ago."
 Turkey.42.a:0 "Great"
 Turkey.43.title:0 "A District Collapsed In Konya"
 Turkey.43.desc:0 "A 3-storey illegal religious education dormitory built by a private foundation in Balcilar town in Tashkent, Konya district collapsed at 03:45 due to a leak of LPG gas: 18 dead and 27 injured."
 Turkey.43.a:0 "Aman Tanrım"
 Turkey.44.title:0 "PKK Attack"
 Turkey.44.desc:0 "Şemdinli Aktütün gendarmerie police station in Şemdinli district of Hakkari was attacked by PKK with heavy weapons."
 Turkey.44.a:0 "When these terror attacks will end?"
 Turkey.45.title:0 "Erdogan leaves the Davos Forum"
 Turkey.45.desc:0 "Prime Minister Recep Tayyip Erdogan, who attended the session on "Gaza: a model of peace in the Middle East" at the World Economic Forum in Davos, Switzerland; left the session because he was not given enough of a say. After the incident, Erdogan announced that he would no longer attend the Davos meetings."
 Turkey.45.a:0 "Oough..."
 Turkey.46.title:0 "Democratic Society Party's Chairmans Spoke Kurdish"
 Turkey.46.desc:0 "Democratic Society Party Chairman Ahmet Turk and Selahattin Demirtas addressed the group meeting in Kurdish from the podium. Ankara Prosecutor General's office opened an investigation into this situation. The investigation concluded on April 15 with a non-follow-up verdict."
 Turkey.46.a:0 "Eh"
 Turkey.47.title:0 "Turkish Airlines Flight 1951"
 Turkey.47.desc:0 "The aircraft, a Turkish Airlines Boeing 737-800, crashed into a field approximately 1.5 kilometers (0.9 mi) north of the Polderbaan runway (18R), prior to crossing the A9 motorway inbound, at 09:26 UTC, having flown from Istanbul, Turkey. The aircraft broke into three pieces on impact. The wreckage did not catch fire. \n\nThe crash was caused primarily by the aircraft's automated reaction, which was triggered by a faulty radio altimeter. This caused the autothrottle to decrease the engine power to idle during the approach. The crew noticed this too late to take appropriate action to increase the thrust and recover the aircraft before it stalled and crashed. Boeing has since issued a bulletin to remind pilots of all 737 series and BBJ aircraft of the importance of monitoring airspeed and altitude, advising against the use of autopilot or autothrottle while landing in cases of radio altimeter discrepancies."
 Turkey.47.a:0 "A Bad Accident"
 Turkey.48.title:0 "Championship In European Indoor Athletics"
 Turkey.48.desc:0 "Alemitu Bekele becomes the European champion in the 3000 meters at the 2009 European Indoor Athletics Championships. We are proud of her."
 Turkey.48.a:0 "Nice Nice Nice!"
 Turkey.49.title:0 "A helicopter carrying Muhsin Yazicioglu has crashed"
 Turkey.49.desc:0 "A helicopter carrying Muhsin Yazicioglu, leader of the Great Unity Party, and 5 people crashed in the countryside in Kahramanmaras. There were no survivors in the crash. The wreckage of the helicopter was reached on March 27."
 Turkey.49.a:0 "Aman Tanrım"
 Turkey.51.title:0 "Criminal Court Returns The Rights Of Necmettin Erbakan"
 Turkey.51.desc:0 "9th High Criminal Court In Ankara returned the rights of Necmettin Erbakan, who was sentenced to prison."
 Turkey.51.a:0 "Criminal Court Speaks.."
 Turkey.52.title:0 "USA-Turkey Visits"
 Turkey.52.desc:0 "US President Barack Obama addressed lawmakers on the parliamentary podium. The Associated Press announced that it was the first time Obama had visited an Islamic country."
 Turkey.52.a:0 "Better relations with the USA makes us stronger"
 Turkey.53.title:0 "1 May Declared As A Labor And Solidarity Day"
 Turkey.53.desc:0 "1 May was a public holiday called "Labor and Solidarity Day" with the decision taken in the Parliament."
 Turkey.53.a:0 "Workers Got Back Their Day!"
 Turkey.54.title:0 "Protests From Democratic Society Party In Parliament"
 Turkey.54.desc:0 "MP's from the Democratic Society Party held a sit-in in the parliament hall."
 Turkey.54.a:0 "Not Good"
 Turkey.55.title:0 "1 May Celebrations"
 Turkey.55.desc:0 "After 1978, 31 years later, May 1 was celebrated again in Taksim Square. In 1979, due to martial law, celebrations were not allowed in Taksim Square."
 Turkey.55.a:0 "Workers In Action!"
 Turkey.56.title:0 "Return to Life Operation's Cases Were Dropped"
 Turkey.56.desc:0 "In 2000, as part of Operation Return to life, which took place at Bayrampasa prison, the case against 196 prisoners expired, and the case was dropped."
 Turkey.56.a:0 "Now, they are independent"
 Turkey.58.title:0 "First Swine Flu Case"
 Turkey.58.desc:0 "The first case of swine flu in Turkey was observed in Istanbul. Swine flu can now easily reach all over Turkey."
 Turkey.58.a:0 "Ough..."
 Turkey.59.title:0 "TEKEL Worker Activity"
 Turkey.59.desc:0 "TEKEL workers in action on December 15, 2009, Turk-dependent Tekgida in-iş Trade Union registered by the Tekel workers launched in Ankara on 4 February after 1980. In 2010 the biggest mass walkout by all of the Turkey-emitted workers is the action. In addition to being at the forefront of the agenda throughout the country and being supported by a wide range of people, the action also gained international support."
 Turkey.59.a:0 "Another Day, Another Protest"
 Turkey.60.title:0 "Constitutional Court Shuts Down HADEP"
 Turkey.60.desc:0 "Constitutional Court unanimously decides to close Democratic Society Party."
 Turkey.60.a:0 "Constitutional Court makes his decision"
 Turkey.61.title:0 "Istanbul becomes one of the European Capital of Culture for 2010"
 Turkey.61.desc:0 "Istanbul, together with Essen and Pecs, became the 2010 European Capital of Culture."
 Turkey.61.a:0 "Great News"
 Turkey.62.title:0 "Rocket Launcher Attacked Turkish Navy Guardians"
 Turkey.62.desc:0 "A unit belonging to the Navy located in Iskenderun was attacked with a rocket launcher during the change of guard of privates. 6 soldiers were killed and 7 soldiers were wounded, 3 of them seriously."
 Turkey.62.a:0 "Aman Tanrım"
 Turkey.64.title:0 "Response Against Israel's Attacks On Turkish MV Mavi Marmara"
 Turkey.64.desc:0 "A declaration of condemnation was adopted in the Parliament due to Israel's attack on the MV Mavi Marmara ship."
 Turkey.64.a:0 "Nice response"
 Turkey.63.title:0 "PKK Attacks In Istanbul"
 Turkey.63.desc:0 "A bomb attack on a military service vehicle was carried out by the PKK in Halkali District of Istanbul. 5 people died, one of them a high school student, 4 of them soldiers."
 Turkey.63.a:0 "Aman Tanrım"
 Turkey.65.title:0 "Murat Basesgioglu Resigns From AKP"
 Turkey.65.desc:0 "Murat Basesgioglu resigned from Justice And Development Party due to opposition to the party's parliamentary policies."
 Turkey.65.a:0 "AKP's Loss"
 Turkey.66.title:0 "Operation Sledgehammer (Coup Plan) Indictment accepted"
 Turkey.66.desc:0 "Istanbul 10th Criminal Court accepted the indictment of the sledgehammer coup plan. The indictment listed 196 military personnel as suspects. An arrest warrant has been issued for 102 of these people."
 Turkey.66.a:0 "There won't be another coup in the Turkish Republic!"
 Turkey.68.title:0 "PKK Attacks On Dörtyol"
 Turkey.68.desc:0 "A police vehicle was attacked by the PKK in the Dörtyol District of Hatay. 4 police officers died. During the police funeral, incidents broke out in Dörtyol and Inegöl."
 Turkey.68.a:0 "Aman Tanrım"
 Turkey.67.title:0 "Anti-Terrorist Law Has Been Accepted"
 Turkey.67.desc:0 "The president approved an amendment to the Anti-Terrorism law covering children known publicly as "stone-throwing children."
 Turkey.67.a:0 "Aman Tanrım"
 Turkey.69.title:0 "A Constitutional Referendum Results = YES"
 Turkey.69.desc:0 "A constitutional referendum on a number of changes to the constitution was held in Turkey on 12 September 2010. The results showed the majority supported the constitutional amendments, with 58% in favour and 42% against. The changes were aimed at bringing the constitution into compliance with European Union standards. Supporters of Turkish EU membership hope constitutional reform will facilitate the membership process."
 Turkey.69.a:0 "To The European Union!"
 Turkey.70.title:0 "The Turkish consulate in Thessaloniki has been attacked"
 Turkey.70.desc:0 "The Turkish consulate in Thessaloniki, Greece, was attacked with a Molotov cocktail."
 Turkey.70.a:0 "They are going to pay for this"
 Turkey.71.title:0 "Higher Education Institution Acts"
 Turkey.71.desc:0 "The Higher Education Institution banned the removal of headscarved students from the course at Istanbul University."
 Turkey.71.a:0 "Nice"
 Turkey.72.title:0 "The European Court Of Human Rights Found Turkey Guilty"
 Turkey.72.desc:0 "The European Court of human rights found Turkey guilty in 19 cases filed by Greek Cypriots. Turkey's claimants were paid 15 million euros in financial and moral compensation and 160 thousand euros in court costs."
 Turkey.72.a:0 "They Are Basically Biased"
 Turkey.73.title:0 "Turkey's first digital library has been opened"
 Turkey.73.desc:0 "Turkey's first digital library was opened in the Esenler district of Istanbul."
 Turkey.73.a:0 "Good"
 Turkey.74.title:0 "Terrorist Attack"
 Turkey.74.desc:0 "A live human bomb attacked a police vehicle in Istanbul's Taksim Square. 32 people were injured, 15 of them police."
 Turkey.74.a:0 "Aman Tanrım"
 Turkey.75.title:0 "Haydarpasa Terminal Has Been Burned"
