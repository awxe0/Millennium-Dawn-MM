 TurkeyF.190.desc:0 "Does Turkey want to ally with us? Should we say yes to this proposal to tighten our Turkish ties, or should we reject it by continuing our pro-European stance?" 
 TurkeyF.190.a:0 "This Is What We Are Waiting For!" 
 TurkeyF.190.b:0 "No, This Is Unnecessary" 
