 Turkey.333.desc:0 "The Ancient Bottomless Well was excavated with legal permission and the treasure that was expected to be found was not found. Finding nothing in the bottomless well, the group of researchers left the area. The fact that its bottomless well is devastated has caused outrage on social media."
