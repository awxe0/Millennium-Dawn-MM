 Turkey.352.desc:0 "June 17, 2021, at 11.05 am, Onur Gencer entered the provincial presidency building of the Peoples ' Democratic Party (HDP) located on Poet Ashraf Boulevard in Konak district of Izmir and opened fire with a pistol, killing Party employee Deniz Poyraz."
