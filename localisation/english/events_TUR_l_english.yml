 Turkey.350.a:0 "We Will Find Them One By One!"
 Turkey.351.title:0 "The Fire Has Been Stopped" 
 Turkey.351.desc:0 "The fire in Turkey is being stopped with the help of specialist teams. The expert teams are not just Turks. There are also Ukrainian firefighting aircraft, Russian firefighting aircraft, and Azerbaijani personnel sent to help us. We defeated this fight with friends of black day and Turkish perseverance."
 Turkey.351.a:0 "Good Job Team!"
