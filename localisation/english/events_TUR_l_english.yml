 Turkey.345.b:0 "Temel Karamollaoğlu Should Take Over"
 Turkey.346.title:0 "Wildfire All Over Turkey" 
 Turkey.346.desc:0 "2021 Turkey wildfires, wildfires that started on July 28, 2021, in the Manavgat district of Antalya and spread to many cities in Turkey. As of August 12, 2021, 8 people were killed in 299 forest fires in 49 provinces, most of them in the Mediterranean, Aegean, Marmara, Western Black Sea, and Southeastern Anatolia regions, while hundreds of thousands of hectares of forests and settlements turned to ashes and thousands of animals died.\n\n299 forest fires that started on July 28, 15 of which were large, were completely controlled by extinguishing the fire in the Kuyceğiz District of Muğla as of August 12, 2021. 15 firefighting aircraft, 62 helicopters, 9 unmanned aerial vehicles, 1 unmanned helicopter, 850 land, and water tankers, 450 work machines, and 5250 personnel were involved in the fires. Many countries, including Azerbaijan, Ukraine, Russia, Spain, Croatia, Qatar, and Iran, provided personnel and vehicle support. Thousands of locals and tourists were evacuated by land and sea from hundreds of villages and towns as the fires spread to settlements.\n\nThere has been a lot of controversy after the fires, which have been described as the largest forest fires in the history of the Republic of Turkey. The Ministry of Agriculture and Forestry and the Turkish air authority have been criticized by the opposition and the public for being late and slow in responding to the fires. The focus of controversy; Firefighting existing fleet of the Ministry of Forestry in Turkey and those have to be the lack of a firefighting plane in the hangar inadequate number of wait, the burning of forest land will be opened up to construction claims, whether in residential areas of responsibility in fighting fires in the municipalities of competence, in Turkey and the effects of global warming-oriented discussions and Prime Minister Recep Tayyip Erdogan took part in handing out tea to people in the disaster area."
 Turkey.346.a:0 "Huge Damages To Us"
 Turkey.347.title:0 "Turkey Defeats The Coup Attempt" 
 Turkey.347.desc:0 "The rise of Erbakan's party to power caused reactions in the army. The military saw Erbakan as reactionary. On February 28, the Army decided to intervene when it again saw the party it had overthrown using the press in power. After the army made its plans for intervention, several Tank companies headed for the capital. In the capital, our people resisted the tanks. The army tried to scare us by flying low in Ankara, and it didn't work. Our people took to the streets and reacted. Our people did not want another coup. The army gave up after 1 day and surrendered. Now we officially have all the power."
 Turkey.347.a:0 "Yaşa!"
 Turkey.348.title:0 "Turkey Attacks Our Presence In Blacksea" 
 Turkey.348.desc:0 "Turkey retaliated against us as a move we did not expect. Turkey has declared it is closing the straits to the United States. This declaration means the collapse of the United States ' activity in the Black Sea. Russia will certainly be happy with this situation."
 Turkey.348.a:0 "What The?"
 Turkey.349.title:0 "Turkey Joins F-35 Program" 
 Turkey.349.desc:0 "Turkey joined the F-35 (Joint Attack Aircraft) project as the seventh international partner on 12 July 2002. In addition, Turkey signed a memorandum of mutual understanding regarding the production of the F-35. Turkey will be able to have these aircraft when production of the F-35 begins!"
 Turkey.349.a:0 "Nice"
 Turkey.350.title:0 "PKK Admits Setting Fires" 
