 Turkey.298.desc:0 "MHP Chairman Devlet Bahceli explained that his party's proposal for a new 100-point Constitution is ready and said that the work will be shared with the AK Party and the president first. Bahçeli said that the articles of the Constitution, which cannot be changed, are protected in the same way."
