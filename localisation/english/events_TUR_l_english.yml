 TurkeyF.186.a:0 "Clash Continues.." 
 TurkeyF.187.title:0 "A Violent Coup!"
 TurkeyF.187.desc:0 "The problem of the Gulenists, which has not been taken precautions for a long time, has grown, and eventually the gulenists have terrorized the streets with their weapons in order to overthrow the constitutional order. Although the Gülenist organization suffered many losses, it was able to overthrow the government. as a result of these changes in power, a civil war is expected." 
 TurkeyF.187.a:0 "May The Heavens Help Us!" 
 TurkeyF.188.title:0 "EMEP Overthrowns The Current Regime"
 TurkeyF.188.desc:0 "After intense clashes, the TKP administration was destroyed by the organizations established by EMEP soldiers. Thus, there was a change of power and a coup on the communist side. Now the EMEP will take over the management of the country. TKP members are expected to be sent to exile" 
