 TurkeyF.199.title:0 "Court Ends Its Third-Term"
 TurkeyF.199.desc:0 "The court has finished its third term. Now changes will begin in the court and the court will refresh its system. This will regulate political and stable development." 
 TurkeyF.199.a:0 "Court Made Its Decision" 
 TurkeyF.200.title:0 "The Court Take Over"
 TurkeyF.200.desc:0 "As a result of the turmoil, the Constitutional Court overthrew the government and became a government itself. The Constitutional Court was divided into certain parts in a short time. The administration established by the Constitutional Court will be headed by Ahmet Necdet Sezer. Ahmet Necdet Sezer was an experienced person who had previously served as the President of Turkey." 
 TurkeyF.200.a:0 "Justice Has Been Needed" 
 TurkeyF.201.title:0 "Turkish-European Brotherhood Relationship"
 TurkeyF.201.desc:0 "The eastern countries of the European Union have come together with Turkey. Turkey wants to act jointly with the European Eastern countries. What can be done about this issue, we will decide." 
 TurkeyF.201.a:0 "We Need Cooperation" 
 TurkeyF.201.b:0 "Ah! Who Needs Turks?" 
 TurkeyF.202.title:0 "The Military Drama"
 TurkeyF.202.desc:0 "The Turkish Armed Forces are very uncomfortable with the politicized situation at the Constitutional Court. Therefore, they want the Constitutional Court to put itself in order. How we respond to these requests will affect our fate." 
 TurkeyF.202.a:0 "Military Is Right! Ok?" 
 TurkeyF.202.b:0 "The Military Shouldn't Be Able To Intervene" 
 TurkeyF.203.title:0 "Weird Sounds From Ataturk's Mausoleum"
 TurkeyF.203.desc:0 "Strange sounds began to come from Atatürk's tomb. Upon this, an investigation will be launched into the incident. In addition, there is public unrest due to the possibility that Atatürk's tomb may have been damaged."
 TurkeyF.203.a:0 "Anitkabir Must Be Under Attack!"
 TurkeyF.204.title:0 "Anitkabir Has Taken Into Investigation"
 TurkeyF.204.desc:0 "The investigation team we sent has damaged the historical monuments around. Moreover, Atatürk was not found in the tomb. With this situation the domestic unrest and the chances of the military taking over the business increases. We need to investigate the events, this could be the end of us."
 TurkeyF.204.a:0 "Let's Check Everywhere"
 TurkeyF.205.title:0 "Ataturk! He Is Back!"
 TurkeyF.205.desc:0 "A taxi driver claimed that he saw Ataturk himself while he was near Anitkabir. Upon this, a search was made around and it was determined that someone resembling Atatürk was passing by in the camera recordings. The next day, someone who looked exactly like Atatürk was found at the gate of Atatürk Forest Farm. The person who claimed to be Atatürk himself was found to be correct. The place where Atatürk is located has become a rally. The guards were increased and Atatürk was taken away. The day after that, Atatürk went to the CHP building and an explanation came from there, "Atatürk is alive!", most people did not believe this situation and saw the CHP as a liar. Some believers were worried about the situation in the sections, the lodges were disturbed."
 TurkeyF.205.a:0 "Impossible!"
 TurkeyF.206.title:0 "Ataturk Returns To Politics"
 TurkeyF.206.desc:0 "It has become official that Ataturk has now returned to life, although there are those who do not accept it. Ataturk announced that he would enter politics after presenting his bill proposing the reform of the CHP. Ataturk is expected to become the head of the CHP soon. A staff change is also possible at CHP."
 TurkeyF.206.a:0 "Here We Go!"
 TurkeyF.207.title:0 "Ataturk Elected As A Supreme President"
 TurkeyF.207.desc:0 "As a result of the elections, Atatürk was elected president of the country. Atatürk is expected to make changes to all kinds of systems. This mood of change will definitely be beneficial for our country."
 TurkeyF.207.a:0 "As It's Expected"
 TurkeyF.208.title:0 "Turkey Demands Batumi"
 TurkeyF.208.desc:0 "Turkey wants Batumi, a land of our Georgia, in order to realize its Misaki National goals. Sir, if we refuse their request, it may create a war situation, we should think carefully."
 TurkeyF.208.a:0 "No, We Are Standing In Our Ground"
 TurkeyF.208.b:0 "Yes, We Cannot Risk Our Relations"
 TurkeyF.209.title:0 "Turkish Protest To Recognition North Cyprus"
 TurkeyF.209.desc:0 "Turkey is pressing for the recognition of Northern Cyprus. Sir, do you think that Northern Cyprus should be recognized or not? The choice is yours."
 TurkeyF.209.a:0 "We Are Going To Think About That"
 TurkeyF.210.title:0 "Question Of Modern Saadabad"
 TurkeyF.210.desc:0 "The Turks want to make a peace bill together with us to revive stability in the region. Shall we reject their wishes and maintain our belligerent attitude? Or should we end our warlike attitude in the name of the stability and peace of the region?"
 TurkeyF.210.a:0 "Let's Restore That"
 TurkeyF.210.b:0 "That Doesn't Need To Be Restored"
 TurkeyF.211.title:0 "Question Of Kurdish Referendum"
 TurkeyF.211.desc:0 "Our country initiated the Kurdish federalization and successfully continued them. Kurdish can now speak freely, Kurdish cities are referred to in Kurdish. In addition, within the scope of this federalization, we destroyed the PKK by pleasing the people in eastern Anatolia. We want to take the success we have achieved in the Northern Iraqi regime as well. That's why we sent them a draft referendum."
 TurkeyF.211.a:0 "Let's Make This Deal"
 TurkeyF.212.title:0 "A Referendum Offered By Turkey"
 TurkeyF.212.desc:0 "Turkey invites us to the referendum. Their desire is the annexation of the Kurdish region to Turkey. If we don't accept it, they won't do anything about that as they will continue with democratic regimes. Sir, what should we answer to these Turks?"
 TurkeyF.212.a:0 "Acceptable"
 TurkeyF.212.b:0 "Long Live The Kurdish Nation!"
 TurkeyF.213.title:0 "An Answer From North Kurdistan"
 TurkeyF.213.desc:0 "The Kurdish people rejected our referendum. They don't want to live in a welfare state like Turkey. We will continue to live with the Kurds in Eastern Anatolia."
 TurkeyF.213.a:0 "Damn"
 TurkeyF.214.title:0 "Sanctions For Gulen?"
 TurkeyF.214.desc:0 "Fetullah Gülen, who is in our country and has been declared a terrorist by Turkey, was killed by assassination. Our intelligence agencies see the Turkish government as being behind this assassination. Should we impose sanctions on the Turkish government for interfering with citizens on U.S. soil?"
 TurkeyF.214.a:0 "Issue Sanctions"
 TurkeyF.214.b:0 "Abstain From Any Sanctions"
 TurkeyF.215.title:0 "An American Reaction"
 TurkeyF.215.desc:0 "The United States realized that we had assassinated Fetullah Gulen. For this, he also decided to impose sanctions. This latest development may cause economic damage to our country, we must be prepared for it."
 TurkeyF.215.a:0 "We Should Prepare For This!"
 TurkeyF.216.title:0 "HP Party Announces Bold Move to Seek Political Opportunities in Turkey"
 TurkeyF.216.desc:0 "In a surprising development, the People's Party (HP) of Northern Cyprus has revealed plans to explore new avenues for political participation in neighboring Turkey. The decision comes after facing challenges in gaining parliamentary representation in their home country. This party wants to come to form the technocratic thinking in the country, should we allow it or not?"
 TurkeyF.216.a:0 "HP Should Be Supported"
 TurkeyF.216.b:0 "No, Block Them From Gaining Power"
 TurkeyF.217.title:0 "HP Party Expands Horizons, Sets Foot in Turkish Political Landscape"
 TurkeyF.217.desc:0 "During the official inauguration ceremony held in Istanbul, the HP party chairman, Mustafa Akıncı, emphasized the significance of this momentous occasion. He stated, "Today marks a historic milestone for our party and the people we represent. By establishing our presence in Turkey, we aim to bridge divides and promote dialogue, fostering a stronger sense of unity between our two nations. Our principles and dedication to serving the public remain steadfast, and we believe this expansion will create valuable opportunities for cooperation and progress."/n/nPolitical analysts have lauded the move, recognizing the potential for constructive exchanges and mutual benefit between the HP party and Turkish political entities. The HP party's agenda, focusing on social inclusivity, economic prosperity, and sustainable development, resonates with many of Turkey's progressive political groups./n/nWhile opening a new chapter in their political journey, the HP party remains committed to adhering to all relevant legal and regulatory procedures in Turkey. Party representatives have initiated discussions with Turkish authorities to ensure full compliance with the country's political norms."
 TurkeyF.217.a:0 "Very Interesting"
 TurkeyF.218.title:0 "Renowned Leader Kemal Dervis Joins Technocratic Party (HP) as they Expand into Turkey"
 TurkeyF.218.desc:0 "In a significant political development, the Technocratic Party, also known as Halkin Partisi (HP), has officially launched its operations in Turkey, accompanied by the high-profile addition of Kemal Dervis to its ranks. Dervis, a respected political leader and former prominent member of the Republican People's Party (CHP), announced his decision to join HP, citing alignment with the party's vision for progressive governance and forward-looking policies.\n\nThe inauguration of HP's Turkish branch was marked by a grand ceremony in Ankara, where party officials and supporters gathered to witness this momentous occasion. HP's chairman, Ali Demir, expressed his gratitude for the warm welcome from Turkish citizens and the commitment to contributing positively to Turkey's political landscape.\n\n"We believe in the power of technocracy and evidence-based policies to drive sustainable development and social progress. By establishing HP in Turkey, we aim to bring fresh perspectives to the political discourse and collaborate with like-minded individuals and parties," Chairman Demir declared during his address.\n\nThe highlight of the event came when Kemal Dervis, a seasoned economist and diplomat who had previously served as Turkey's Minister of Economy and later as the Administrator of the United Nations Development Programme, officially joined the Technocratic Party. Dervis had been an influential figure in the CHP, but he expressed that his decision to switch parties was driven by his belief in HP's pragmatic approach to governance and emphasis on expertise-driven solutions.\n\nIn a statement to the press, Dervis remarked, "I have always been committed to the values of progressive politics, evidence-based decision-making, and finding practical solutions to complex challenges. HP's dedication to technocracy and its desire to bring together experts from various fields to address societal issues deeply resonated with me. I am thrilled to embark on this new chapter with HP and contribute to shaping a brighter future for Turkey.""
 TurkeyF.218.a:0 "Unexpected Move From Kemal Dervis"
