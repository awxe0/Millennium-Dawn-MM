 FAQ_S_4:0 "Paths/FAQ P:4"
 FAQ_4_DESC:0 "How can we get the Ataturk to the power? §YSemi-Easter Egg§! \n\nFirst of all, the "Fictional reality" part needs to be opened by settings that occur at the start. Then the number of factories should be reduced by a certain amount (25<). It is also important that the level of stability is low. After these requirements are seized, Atatürk will return to save the country.\n\nHow can we get the MIT to the power? \n\nIt is the same thing with the mafia path. Get the mafia path and later an event would be launched to get the MIT path."
  