 TurkeyF.181.title:0 "EMEP's Coup Attempt Had Failed"
 TurkeyF.181.desc:0 "The EMEP members, disturbed by the victory of the TKP, called their own militias to the coup in order to defeat the TKP. The EMEP carried out a planned attack on military facilities in Ankara and Istanbul with militia forces in the evening. The next day, the strong patriotic TKP militia took to the streets and opened fire on the EMEP militia forces. A curfew was declared, and the confrontation lasted for three days. At the end of three days, the armies of the EMEP began to dissolve and surrender. Thus, the main army power of the EMEP collapsed. The EMEP's coup may have been repelled, but they are still observed to be making a mess with their weapons. We must definitely destroy this new terrorist organization!" 
 TurkeyF.181.a:0 "Traitors!" 
