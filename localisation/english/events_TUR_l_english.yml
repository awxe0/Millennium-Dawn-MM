 TurkeyU.1.title:0 "Ulkist Rebellion Occurs"
 TurkeyU.1.desc:0 "The nationalists in the streets have now started a full-scale war with their weapons. As a result of these conflicts, the country was divided and what was called the civil war situation took place. Now our country is completely opposition-free and communist. Red guards, rise up and suppress this rebellion!"
 TurkeyU.1a:0 "They Have Wanted War" 
 
