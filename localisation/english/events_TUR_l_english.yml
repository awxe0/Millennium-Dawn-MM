 TurkeyF.24.title:0 "Karabakh Conflict"
 TurkeyF.24.desc:0 "It is time to expel the Armenians who took Karabakh from our hands from Karabakh. Karabakh Belongs To Azerbaijan!"
 TurkeyF.24.a:0 "Hurrah!"
 TurkeyF.26.title:0 "Turkish Diktat"
 TurkeyF.26.desc:0 "The Republic of Turkey strongly wants us to leave our guarantee in the Kurdish regions. If we do this, the Kurdish regions will be under Turkish rule, and our power in the region will be reduced. If we move otherwise, there could be a big crack in NATO. Sir, what should we do?"
 TurkeyF.26.a:0 "Turks should destroy the Kurdish State"
 TurkeyF.26.b:0 "Turks should leave the Kurds alone"
 TurkeyF.27.title:0 "United States Accepts Our Invasion Plan"
 TurkeyF.27.desc:0 "The United States has given the green light to the war that we will enter with the Kurds. The United States will withdraw its guarantee from Kurdistan and we will enter the region."
 TurkeyF.27.a:0 "Time To Destroy Kurdish State"
 TurkeyF.28.title:0 "United States Rejects Our Invasion Plan"
 TurkeyF.28.desc:0 "The United States has given us a red light about our war with the Kurds. The United States will not withdraw its guarantee from Kurdistan, and if we go to war with the Kurds, we will go to war with the United States. As a result, a rift will occur in NATO and pave the way for other states to enter the war."
 TurkeyF.28.a:0 "We don't care about the words of the United States"
 TurkeyF.29.title:0 "Turkey Wants To By Islands"
 TurkeyF.29.desc:0 "An unexpected offer came from Turkey. Turkey wants to buy Greece's islands for a lot of money, $ 100 billion. Sir, what do we call this offer? Do we accept and leave the islands or not sell them?"
 TurkeyF.29.a:0 "We Need To Give These Islands"
 TurkeyF.29.b:0 "Stupid Offer"
 TurkeyF.30.title:0 "Greece Rejects Our Offer"
 TurkeyF.30.desc:0 "Greece doesn't seem to like our offer. We understand that we cannot take the islands without war so we need to have war with them soon."
 TurkeyF.30.a:0 "This is not good news for us"
 TurkeyF.31.title:0 "Turkish Protection Offer"
 TurkeyF.31.desc:0 "Turkey promises us conditional protection. Their condition is that we are their puppet state. If we become their puppet state, our national unity will decrease, but we will be strong against external threats. If we do not agree, our national unity will be strengthened, but we cannot do much against external threats. Sir, what should we do?"
 TurkeyF.31.a:0 "Accept Their Conditions Of Protection"
 TurkeyF.31.b:0 "Reject Their Conditions Of Protection"
 TurkeyF.32.title:0 "Bulgaria Rejects Our Conditional Protection"
 TurkeyF.32.desc:0 "Bulgaria has rejected our offer of conditional protection. We have to leave Bulgaria alone."
 TurkeyF.32.a:0 "This is not good news for us"
 TurkeyF.33.title:0 "Turkey Wants The Partition Of Armenia"
 TurkeyF.33.desc:0 "A few diplomats from Turkey came to us to decouple Armenia between Azerbaijan and Turkey. If we accept their offer, we will go to war together with Armenia. If we do not agree, peace with Armenia will continue."
 TurkeyF.33.a:0 "We Should Do The Partition Of Armenia"
 TurkeyF.33.b:0 "We Need To Stay In Peace With Our Neighbours"
 TurkeyF.34.title:0 "Baku Accepts Our Partition Plan Of Armenia"
 TurkeyF.34.desc:0 "Baku is positive about our proposal to divide Armenia, it is time to bring the Turkish Armed Forces to the Armenian border and divide Armenia with Azerbaijan."
 TurkeyF.34.a:0 "Time To Secure East"
 TurkeyF.35.title:0 "Baku Rejects Our Partition Plan Of Armenia"
 TurkeyF.35.desc:0 "Baku rejected our plan to divide Armenia by not taking very good care of our campaign. We have to invade Armenia alone."
 TurkeyF.35.a:0 "We Have To Secure East Alone"
 TurkeyF.36.title:0 "Unification Of The ANAP and DYP"
 TurkeyF.36.desc:0 "At the joint extraordinary congress of the DP and ANAP, a decision was made to unite the two parties. Now the center-right is uniting. The unification of the center-right will ensure the achievement of a large vote for power."
 TurkeyF.36.a:0 "Awesome"
 TurkeyF.37.title:0 "Turkey Wants To Revive Saadabad Pact"
 TurkeyF.37.desc:0 "Turkey wants the Saadabad Pact to be resurrected. In order to achieve this resurrection, we can start negotiations if we want, or we can prevent the resurrection of the Saadabad Pact by not entering into negotiations."
 TurkeyF.37.a:0 "Unnecessary to Revive"
 TurkeyF.37.b:0 "Sure"
 TurkeyF.38.title:0 "Tehran-Ankara Deals"
 TurkeyF.38.desc:0 "The agreement between Iran and Turkey has been officially signed. The deal is about two countries protecting each other. Turkey will guarantee the independence of Iran. Iran will guarantee the independence of Turkey."
 TurkeyF.38.a:0 "Great News For Two Muslim Countries"
 TurkeyF.39.title:0 "Cairo-Ankara Deals"
 TurkeyF.39.desc:0 "The agreement between Egypt and Turkey has been officially signed. The deal is about two countries protecting each other. Turkey will guarantee the independence of Egypt. Egypt will guarantee the independence of Turkey."
 TurkeyF.39.a:0 "Great News For Two Muslim Countries"
 TurkeyF.40.title:0 "Touring The Turkey"
 TurkeyF.40.desc:0 "Mesut Yilmaz took to the streets and visited the people and artisans, listened to their problems. People who saw Mesut Yilmaz were very happy. This situation is a political victory."
 TurkeyF.40.a:0 "Excellent Type For Populism"
 TurkeyF.41.title:0 "A Referendum Demanded By Turkey"
 TurkeyF.41.desc:0 "Turkey invites us to the referendum. Their desire is the annexation of the Kurdish region to Turkey. If we don't accept it, weapons will start exploding on our borders and people will die. Sir, what should we answer to these Turks?"
 TurkeyF.41.a:0 "Acceptable"
 TurkeyF.41.b:0 "Freedom Or Death!"
 TurkeyF.42.title:0 "War Declaration To The North Iraqi Government"
 TurkeyF.42.desc:0 "The Kurds have not accepted our requests, as a result, we will destroy this country together with our Turkish Armed Forces."
 TurkeyF.42.a:0 "We Are Ready For War!"
 TurkeyF.43.title:0 "Turkish Unification Offer"
 TurkeyF.43.desc:0 "After the conferences with Turkey, the Turks offered us a merger proposal. If we unite, Turkish nationalism and Turkish power will rise in the world, but this can lead to opposition and rebellion against us."
 TurkeyF.43.a:0 "Strength comes from Unity"
