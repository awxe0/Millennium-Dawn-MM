 TurkeyF.19.desc:0 "After the conferences with Turkey, the Turks offered us a merger proposal. If we unite, Turkish nationalism and Turkish power will rise in the world, but this can lead to opposition and rebellion against us."
 TurkeyF.19.a:0 "Strength comes from Unity"
