 turkish_tourism_sector_medium:0 "Turkish Tourism Industry"
 turkish_tourism_sector_medium_desc:0 "The unique cultural heritage, stunning landscapes, and historical sites of Turkey have long attracted visitors from around the world. By investing in infrastructure, hospitality, and international promotion, Turkey has boosted its tourism sector, providing a significant source of income and strengthening its global ties. This flourishing industry not only enhances our economy but also fosters cultural exchange and national pride.\n\n§YBy decisions £decision_icon_small you can manage the industry of tourism.§!"
