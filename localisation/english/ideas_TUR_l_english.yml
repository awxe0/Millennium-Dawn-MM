 ulkist_paramilitaries:0 "Ulkist Armed Paramilitaries"
 ulkist_paramilitaries_desc:0 "The nationalists are armed, and thanks to this situation, when our country is under threat of any invasion, these armies will fulfill their duty and ensure stability by expelling any enemies that occur."
 islamic_cooperation_and_ulkism:0 "Ulkist Islamic Cooperationism"
 islamic_cooperation_and_ulkism_desc:0 "Islam is in the Ulkism. That is why Islamism should gain strength and make good cooperation with Ulkism. These things are all for the peace of our people."
 islamic_cooperation_and_ulkism_2:0 "Ulkist Islamic Cooperationism"
 islamic_cooperation_and_ulkism_2_desc:0 "Islam is in the Ulkism. That is why Islamism should gain strength and make good cooperation with Ulkism. These things are all for the peace of our people."
 islamic_cooperation_and_ulkism_3:0 "Ulkist Islamic Cooperationism"
 islamic_cooperation_and_ulkism_3_desc:0 "Islam is in the Ulkism. That is why Islamism should gain strength and make good cooperation with Ulkism. These things are all for the peace of our people."
 ulkist_neutrality:0 "Ulkist Neutrality"
 ulkist_neutrality_desc:0 "By adopting the neutrality of the Ulkist ideology, we will prevent something bad from happening to our country. Countries that make war cries end in absolute collapse."
 kemalist_promotement:0 "Promoting Kemalism"
 kemalist_promotement_desc:0 "Kemalism has become an entity that has lost its power. We must make Kemalism useful by getting it out of the bad situation which affects Kemalism dramatically."
 islamic_appeasement:0 "Appeasing The Islamists"
 islamic_appeasement_desc:0 "We must be kind to the Islamists in our country. Our mistreatment of them will disrupt the stability and power in the country."
 ulkist_democratic_constitution:0 "Democratic Influenced Constitution"
 ulkist_democratic_constitution_desc:0 "Since the Constitution should be organized according to democracy, we will raise our Constitution to good levels by using the democratic elements in the main articles."
 local_anti_terroristic_forces:0 "Activated Local Anti Terrorist Forces"
 local_anti_terroristic_forces_desc:0 "There must be local anti-terrorist organizations and forces. It is quite possible and usual that a problem that may arise locally will arise as a problem of the whole country."
 controlling_the_society:0 "Controlled Society"
 controlling_the_society_desc:0 "If societies tend to lose selves, intervention is necessary. That is why we will establish stability by using our power in this intervention."
 blooded_eyes:0 "Bloods Of Revenge"
 blooded_eyes_desc:0 "We will take revenge on all those who made bad things happen to us. With this feeling of revenge, we will master the power of success."
 counter_pentagon_intelligence:0 "Counter Pentagon Intelligence"
 counter_pentagon_intelligence_desc:0 "The Pentagon collects information through digital networks in our country. Our country has mobilized MIT to solve these digital networks. Now is the time to get rid of this Pentagon influence!"
 kemalist_nationalism_ulkist_model:0 "Model Of Ulkist-Kemalist Nationalism"
 kemalist_nationalism_ulkist_model_desc:0 ""
 islamic_nationalism_ulkist_model:0 "Model Of Ulkist-Islamic Nationalism"
 islamic_nationalism_ulkist_model_desc:0 ""
 diciplined_forces:0 "Diciplinized Kemalist Armed Forces"
 diciplined_forces_desc:0 "We have declared that Kemalism will remain in the army forever. The existing discipline in the army must necessarily be maintained, and there must be elements of Kemalism next to it."
 well_known_Qur_an:0 "Well Known Qur An"
 well_known_Qur_an_desc:0 "Everyone in the country knows the Qur'an, by this, people generally do not remain under the influence of Islamists and religious merchants. Thanks to this, innovation in our country can live tremendously."
 ataturk_culture:0 "Kemalist Culture"
 ataturk_culture_desc:0 "By culturing the Kemalism ideology, we have made our people open to innovation and science which will lower the cost of national development."
 banned_nihal_atsizs_books:0 "Banned Nihal Atsiz's Books"
 banned_nihal_atsizs_books_desc:0 "Nihal Atsiz's nationalism will damage our religious assets and religious spirituality, so it is useful to restrict the books of this nationalist megalomanic."
 islamic_science:0 "Islamic Science"
 islamic_science_desc:0 "Islamic science is one of the important things for development. Islam is a religion that has always been a source of adversity."
 islamic_army_traditions_1:0 "Islamic Military Traditions"
 islamic_army_traditions_1_desc:0 "Islam in the army must necessarily live as a tradition. Because if the army does not stay in the Islamic traditions, the collapse will be caused from a spiritual point of view."
 islamic_army_traditions_2:0 "Islamic Military Traditions"
 islamic_army_traditions_2_desc:0 "Islam in the army must necessarily live as a tradition. Because if the army does not stay in the Islamic traditions, the collapse will be caused from a spiritual point of view."
 islamic_army_traditions_3:0 "Islamic Military Traditions"
 islamic_army_traditions_3_desc:0 "Islam in the army must necessarily live as a tradition. Because if the army does not stay in the Islamic traditions, the collapse will be caused from a spiritual point of view."
 land_fort_planting:0 "Land Fort Plantation Experimentals"
 coastal_fort_planting:0 "Coastal Fort Plantation Experimentals"
 efficent_nationalism:0 "Efficient Nationalism"
 efficent_nationalism_desc:0 "Nationalism should be useful and the kind that will make our country strong."
 golden_wolfs:0 "Golden Age Of Wolves"
 golden_wolfs_desc:0 "Now is the golden time of wolves. After this time, the wolves will develop by moving into a united herd."
 mu_island_theory:0 "The Mu Island Theory"
 mu_island_theory_desc:0 "After the sinking of Mu island, the Turks went through difficult times and the Turks held on to life. This event shows that the Turks have the potential to get out of difficult situations."
 defensive_intelligence:0 "Defensive Intelligence"
 defensive_intelligence_desc:0 "We will not allow them to infiltrate and seize our country's data, and that is why we will develop our country's digital networks."
 counter_pentagon_intelligence_2:0 "Counter Pentagon Intelligence"
 counter_pentagon_intelligence_2_desc:0 "The Pentagon collects information through digital networks in our country. Our country has mobilized MIT to solve these digital networks. Now is the time to get rid of this Pentagon influence!"
 powerized_mit:0 "Powerized Milli İstihbarat Teşkilatı"
 powerized_mit_desc:0 "The MIT is in charge of collecting intelligence on existing and potential threats from internal and external sources posed against the territory, people and integrity, the existence, independence, security, and all the other elements that compose the constitutional order and the national power of the Republic of Turkey. The MİT is in charge of communicating this intelligence to the President, the Chief of the General Staff, the Secretary-General of the National Security Council, and other relevant state organizations as necessary."
 counter_pentagon_intelligence_3:0 "Counter Pentagon Intelligence"
 counter_pentagon_intelligence_3_desc:0 "The Pentagon collects information through digital networks in our country. Our country has mobilized MIT to solve these digital networks. Now is the time to get rid of this Pentagon influence!"
 ai_computing:0 "AI Computing"
 ai_computing_desc:0 "Artificial intelligence (AI) is intelligence demonstrated by machines, as opposed to the natural intelligence displayed by animals including humans. AI research has been defined as the field of study of intelligent agents, which refers to any system that perceives its environment and takes actions that maximize its chance of achieving its goals."
 coding_offices:0 "Coding Offices"
 unified_artifical_intelligence:0 "Realm Of Artificial Intelligence"
 unified_artifical_intelligence_desc:0 "Artificial intelligence (AI) is intelligence demonstrated by machines, as opposed to the natural intelligence displayed by animals including humans. AI research has been defined as the field of study of intelligent agents, which refers to any system that perceives its environment and takes actions that maximize its chance of achieving its goals."
 independence_happiness:0 "Happiness Of Independence"
 independence_happiness_desc:0 "It is very gratifying and flattering that our country is independent. Because of this, stability will always be with us."
 independent_state_forever:0 "Independent For Forever?"
 independent_state_forever_desc:0 "It is very gratifying and flattering that our country is independent. Our independence must continue all the time, if we cannot develop, our independence will be destroyed. That is why we will maintain stable development."
 turkish_massive_construction_program:0 "Turkish Construction Program"
 turkish_massive_construction_program_desc:0 "Newly arrived people need to live in new housing. That is why we will invest money in Turkish real estate developers and ensure that buildings will be built all over our country."
 unshakable_economy:0 "Unshakable Economy"
 unshakable_economy_desc:0 "With the dynamics, we have just brought to our country, we will prevent our economy from being fragmented and weakened so that we will never enter into an economic crisis."
 tasted_the_crisis:0 "Legacy Of Crisis"
 tasted_the_crisis_desc:0 "The State of the Republic of Turkey has seen and survived a lot of crises. From here we can understand that it will survive future crises, and we can understand the durability of our economy and that it is not fragile."
 limited_tourism:0 "Limited Tourism"
 limited_tourism_desc:0 "By limiting tourism, foreigners of foreign powers will not be able to come to our country, and our country will gain trust prestige because of this."
 resistance_against_capitalism:0 "Resistance Against Capitals"
 resistance_against_capitalism_desc:0 "We will ensure state security of our workers and employees by removing the capitals, not allowing the capitalists to exploit people."
 local_investors_action:0 "Supported Local Investors"
 local_investors_action_desc:0 "Local investors should make their investments in-country and keep the money only in the country. For local investors to make such a transaction, it must be supported by the bureaucracy of our country. This support should be financial and spiritual in scope."
 local_investors_action_2:0 "Supported Local Investors"
 local_investors_action_2_desc:0 "Local investors should make their investments in-country and keep the money only in the country. For local investors to make such a transaction, it must be supported by the bureaucracy of our country. This support should be financial and spiritual in scope."
 local_investors_action_3:0 "Supported Local Investors"
 local_investors_action_3_desc:0 "Local investors should make their investments in-country and keep the money only in the country. For local investors to make such a transaction, it must be supported by the bureaucracy of our country. This support should be financial and spiritual in scope."
 dynamical_change_of_wages:0 "Dynamical Change Of Wages"
 dynamical_change_of_wages_desc:0 "By eliminating the monetary imbalances in the social classes, we will be closer to equalizing the income of each social class by making reforms that can work."
 bor_mining_facilities:0 "Boron Fields"
 bor_mining_facilities_desc:0 "Boron is a chemical element with the symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae and not by stellar nucleosynthesis, it is a low-abundance element in the Solar System and the Earth's crust. It constitutes about 0.001 percent by weight of Earth's crust. Boron is concentrated on Earth by the water-solubility of its more common naturally occurring compounds, the borate minerals. These are mined industrially as evaporites, such as borax and kernite. The largest known boron deposits are in Turkey, the largest producer of boron minerals."
 wolf_status_basic:0 "The Spirit Of Wolf"
 wolf_status_basic_desc:0 "The wolf rules the country according to his decisions and feelings, so the wolf's condition and mental state are very important."
 wolf_status_alone:0 "The Spirit Of Wolf"
 wolf_status_alone_desc:0 "The wolf rules the country according to his decisions and feelings, so the wolf's condition and mental state are very important."
 wolf_status_agressive:0 "The Spirit Of Wolf"
 wolf_status_agressive_desc:0 "The wolf rules the country according to his decisions and feelings, so the wolf's condition and mental state are very important."
 ulkist_quarries:0 "Ulkist Quarries Of Innovation"
 ulkist_quarries_desc:0 "With the opening of the Ülkü Ocaklari, our scientific and technological development will increase and our country will move to advanced levels."
 ulkist_quarries_more_educative:0 "Ulkist Quarries Of Innovation"
 ulkist_quarries_more_educative_desc:0 "With the opening of the Ülkü January, our scientific and technological development will increase and our country will move to advanced levels."
 ulkist_quarries_far_more_educative:0 "Ulkist Quarries Of Innovation"
 ulkist_quarries_far_more_educative_desc:0 "With the opening of the Ulkist Quarries, our scientific and technological development will increase and our country will move to advanced levels."
 banned_commies_books:0 "Banned Communistic Books"
 banned_commies_books_desc:0 "Communist books confuse our people and separate them from their nation. That is why these communistic books should be banned in the country and kept away."
 scientific_community_under_one_roof:0 "United Scientific Community"
 scientific_community_under_one_roof_desc:0 "Academics of science should not work separately and should work in a union because groups that cannot work together end in collapse."
 generation_of_nationalism:0 "Generation Of Nationalism And Science"
 generation_of_nationalism_desc:0 "We have created a new generation. This generation is completely blended with nationalism and science, and this generation is a completely necessary state for the development of Turkey."
 document_protectionism:0 "Protection To The Scientific Documents"
 document_protectionism_desc:0 "We will prevent the theft of documents and projects of academicians and scientists because if the projects and documents of our Academicians and scientists are stolen, our country will not issue a new scientist and academician."
 ulkist_technology_centre:0 "Ulkist Technology Centre"
 ulkist_technology_centre_desc:0 "We have opened the Ulkist technology center. We have built this science center despite all the difficulties, and thanks to this science center, our country will move to advanced levels."
 the_population_project:0 "100 Million Population Project"
 the_population_project_desc:0 "Turkey has started a program to make the population 100 million. Turkey wants to increase its population because employment power always brings strength."
 the_population_projection_of_economics:0 "Normalize The GDP-Population Index"
 the_population_projection_of_economics_desc:0 "The growing population normally causes the GDP to fall. To prevent this, we will launch a program. With this program, we will prevent the GDP from falling by launching new construction projects."
 peace_in_the_borders:0 "Peace In The Borders"
 peace_in_the_borders_desc:0 "There must be peace on our borders, otherwise, there will be incredibly painful things that can happen to us. That is why we are establishing peace at our border and we have become a global country by accepting any foreigner into our country."
 turkish_housing:0 "Population Housing"
 turkish_housing_desc:0 "Due to the increasing population, it is necessary to build new houses, these new houses will develop our housing sector and increase our workforce indirectly."
 principalist_party:0 "Principalist MHP"
 principalist_party_desc:0 "MHP will become stronger by following a principled approach. With this progressive level of appreciation, our country will achieve future peace of mind."
 turkes_legacies:0 "Türkeş Legacies"
 turkes_legacies_desc:0 "Get to know your past ancestors, don't forget them! Take care of your homeland values, especially like Türkeş! This country was not obtained easily! It was obtained by blood!"
 politics_of_surpress:0 "Politics Of Suppress"
 politics_of_surpress_desc:0 "There is no flaw in the fact that we destroy those who make policies against us. The silence of this provocative mentality is extremely important for the stability of our people and our country."
 bahceli_powers:0 "Bahçeli Powers"
 bahceli_powers_desc:0 "Our country will develop faster and become stronger under the Bahçeli administration. Long live the wise man, Devlet Bahçeli."
 bahceli_powers_2:0 "Bahçeli Powers"
 bahceli_powers_2_desc:0 "Our country will develop faster and become stronger under the Bahçeli administration. Long live the wise man, Devlet Bahçeli."
 bahceli_powers_3:0 "Bahçeli Powers"
 bahceli_powers_3_desc:0 "Our country will develop faster and become stronger under the Bahçeli administration. Long live the wise man, Devlet Bahçeli."
 mass_counter_immigrationism:0 "Permanent Counter Immigrationism Ideas"
 mass_counter_immigrationism_desc:0 "It is time to expel these destabilizing refugees from our country. Thank God we are saving our country from oncoming the impact of this refugee occupation!"
 closed_border:0 "Closed National Borders"
 closed_border_desc:0 "We will not allow foreign people to come to our country by deciding to close the border crossings."
 nationalism_in_the_borders:0 "Nationalism In The Borders"
 nationalism_in_the_borders_desc:0 "The power of nationalism should be felt at our borders and integrated by our country. The feeling of nationalism is the strongest feeling found in the world."
 harsh_solutions_of_the_border:0 "Harsh Solutions For Border.."
 harsh_solutions_of_the_border_desc:0 "To increase the security of our borders, we can ignore some articles of the Geneva Treaty. The use of toxic gases such as chlorine gas at the borders is one of the prerequisites that will prevent the arrival of refugees."
 well_execution_system:0 "Well Working Execution System"
 well_execution_system_desc:0 "Refugees who enter our country illegally should be executed. No person has the right to cross our border illegally."
 border_protection_institutions:0 "Border Protection Institutions"
 border_protection_institutions_desc:0 "To establish border protection, certain institutions must be on active duty there. These institutions will make border security permanent."
 turkish_presidency:0 "Turkish Presidency"
 turkish_presidency_desc:0 "The Turkish Presidency operates within a certain system and the general judicial forces are gathered in the main center. The type of this system is the French system itself, which works perfectly."
 steps_of_militarist_society:0 "Steps Of Military Society"
 steps_of_militarist_society_desc:0 "Now is the time to create a militaristic society. We can be strong everywhere through this militaristic society. Especially in the military sense."
 turkish_wild_hunt:0 "Turkish Wild Hunt"
 turkish_wild_hunt_desc:0 "Due to the turmoil in Europe, we can strengthen our power in the region by intervening with European powers so Let the hunt begin for the countries that have left the European Union."
 turkish_arms_innovationalism:0 "Turkish Armory Innovationalism"

 anarchist_congress_assambled:0 "Anarchist Congress Assembled"
 anarchist_congress_assambled_desc:0 "The anarchist congress has been convened, now the management levels will be put in place within the framework of a certain organization."
 anarchist_militarization:0 "Anarchist Militarization"
 anarchist_militarization_desc:0 "Anarchists will take up arms and destroy this disgusting unfair government and bring absolute freedom!"
 spirit_of_rebellion:0 "Spirit Of Rebellion"
 spirit_of_rebellion_desc:0 "By reviving thoughts of rebellion, we will cleanse our country of these invading corruption! Long live Anarchy, Long live Freedom!"
 anarchist_positivism:0 "Anarchist Positivism"
 anarchist_positivism_desc:0 "What harm can come from positively studying the world? Positivism is a spirit that will keep our people alive."
 guerilla_tactics:0 "Guerilla Tactics"
