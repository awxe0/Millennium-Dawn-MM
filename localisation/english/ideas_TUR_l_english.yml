 european_colleges_for_turkey:0 "European Planted Colleges"
 european_colleges_for_turkey_desc:0 "The Europeans built new research colleges here. These colleges will carry European knowledge to our country in a way that is not direct to our country."
 university_coercion:0 "University Education Coercion"
 university_coercion_desc:0 "It is not enough to teach people until high school, every person needs to study at university. People who study at university are a cornerstone that will ensure the formation of cultured and proper generations."
 expanded_faculties:0 "Expanded Faculties"
 expanded_faculties_desc:0 "The number of faculties in universities needs to increase because people deserve to study in the departments they want. Diversity will give vigor to our country."
 act_of_copyright:0 "Action Of Copyright"
 act_of_copyright_desc:0 "We have introduced new laws to protect copyrights in our country. Together with the protection of copyrights, we will accelerate our research and increase the environment of trust."
 rise_of_depoliticalization:0 "Rise Of Depoliticization"
 rise_of_depoliticalization_desc:0 "It is obvious that the political situation in our country has brought difficulties to our country that it does not deserve. That is why we are applying propaganda aimed at making our state and people non-political. When our country loses its political character, it will reach the unity and togetherness it deserves."
 bureocratic_reorganization:0 "Bureocratic Reorganization"
 bureocratic_reorganization_desc:0 "Bureaucracy has taken a lot of damage lately. Now we will put the bureaucracy on a legal basis and fulfill the bureaucratic order."
 social_critiction:0 "Social Critictionism"
 social_critiction_desc:0 "We need to address critical events in social life. If we do not address critical events, we can hardly get out of difficulties."
 uncontrolled_senate:0 "The Function Of The Senate"
 uncontrolled_senate_desc:0 "We have transferred some of the power of the parliament to the senate we have just established. But with the result of this power transfer, there has been chaos. Over time, the balance of power will fall into place."
 eu_style_legislative:0 "EU-Style Legislations"
 eu_style_legislative_desc:0 "We will move to a European-style legislative system. With this system, our justice will expand, accelerate and our stability will increase."
 european_parliament_membership:0 "European Parliamentary Membership"
 european_parliament_membership_desc:0 "We are not a member of the European Union, but we have been able to position ourselves in the European Union Parliament. This situation will evaluate and strengthen us politically and economically."
 passive_european_membership:0 "Passive EU Member"
 passive_european_membership_desc:0 "We are not a full member of the European Union, but we dominate in European Union affairs. We can start preparing for full membership now."
 observer_of_the_frontex:0 "Observer Status Of The Frontex"
 observer_of_the_frontex_desc:0 "Frontex is the protective wall of the European Union, even having a small share in this organization is enough to protect our borders and internal security."
 turkish_presidency_weakened:0 "Weakened Turkish Presidency"
 turkish_presidency_weakened_desc:0 "The presidential administration has harmed our country because it has too much power. This system needs to be weakened."
 financed_balkans:0 "Financed By Foreign"
 financed_balkans_desc:0 "We have obtained financing from abroad, these finances are one of the cornerstones of a strong economy."
 expat_credits:0 "Expat Credits"
 expat_credits_desc:0 "We started to get loans from our workers abroad. Together with these loans, our country will reduce its current account deficit, which will return as a good income."
 attainable_kurdish_policies:0 "Attainable Kurdish Management"
 attainable_kurdish_policies_desc:0 "The maritime problems experienced between Greece and Turkey have been resolved Decisively. This situation provides peace and tranquility while reducing competition. The decline of an industry is acceptable for peace..."
