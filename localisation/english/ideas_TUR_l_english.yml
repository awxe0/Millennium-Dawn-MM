 power_of_the_law:0 "Powers Of The Law"
 power_of_the_law_desc:0 "Laws always need to be strengthened. A strong law means strong stability and unity. A lawless state has undoubtedly always collapsed in history."
 power_and_unity_of_the_law:0 "Powers Of The Law And Unity"
 power_and_unity_of_the_law_desc:0 "Laws always need to be strengthened. A strong law means strong stability and unity. A lawless state has undoubtedly always collapsed in history."
