 mafias_level_8_desc:0 "Our cooperation with the Turkish mafia is in a sustainable position. We will provide peace to our country by uprooting the PKK and communist organizations in our country."
 mafias_level_2_D:0 "War With Turkish Mafia"
 mafias_level_2_D_desc:0 "Our Law Enforcement Officers are in a fight with the mafia. Soon we will bring the end of the mafias in our country and provide peace and stability to our country."
 mafias_level_3_D:0 "War With Turkish Mafia"
 mafias_level_3_D_desc:0 "Our Law Enforcement Officers are in a fight with the mafia. Soon we will bring the end of the mafias in our country and provide peace and stability to our country."
 mafias_level_4_D:0 "War With Turkish Mafia"
 mafias_level_4_D_desc:0 "Our Law Enforcement Officers are in a fight with the mafia. Soon we will bring the end of the mafias in our country and provide peace and stability to our country."
 institutionalism:0 "Institutionalism"
 institutionalism_desc:0 "Institutionalism (also referred to as neo-institutionalist theory or institutionalism) is an approach to the study of institutions that focuses on the constraining and enabling effects of formal and informal rules on the behavior of individuals and groups." 
 vision_of_european_union:0 "Winds Of European Union"
 vision_of_european_union_desc:0 "The winds of the European Union are felt in our country and give happiness to our people. We are very close to joining the European Union now. We are very close to making prosperity work for us! Dreams of a European Union are coming true!" 
 european_constitution:0 "Western Influenced Constitution"
 european_constitution_desc:0 "We have a constitution design that was formed as a result of infiltration from the West. Thanks to this westernized constitution, we will adapt to the European Union and the west." 
 european_border_protection:0 "Eurozone Border Protection"
 european_border_protection_desc:0 "We have to protect the regions and borders of the European Union. We will not allow our army to bring refugees by piling our soldiers on the borders. Long live the European Region!" 
 adopted_european_laws:0 "Adopted European Laws"
 adopted_european_laws_desc:0 "We have ensured that the European laws have a full impact on our country so that our country has importantly achieved legal prosperity thanks to the European laws." 
 international_peace_forces:0 "International Peace Forces"
 international_peace_forces_desc:0 "The purpose of the international peacekeeping forces is to ensure peace in the world by the armed representative forces. Peacekeeper forces are created following what our leader Atatürk said, "Peace at the home, peace at the world"" 
 european_studies:0 "European Studies"
 european_studies_desc:0 "We will carry the education and awareness of our country to advanced levels through the education system from the European Union. This educational reformation will contribute to our country in all kinds of ways." 
 full_accordance_with_UN:0 "Signatory Of The UN Peace Proposal"
 full_accordance_with_UN_desc:0 "By signing our signature as a country to the United Nations peace presentations, we will gain a public force against war. Also with this, the entire international public vote will be on our side." 
 full_accordance_with_AIHM:0 "Directly Connected To ECHR"
 full_accordance_with_AIHM_desc:0 "We now leave our courts and our law completely under the control of the ECHR. Thus, the rate of lawlessness and loyalty to power will increase at certain rates." 
 anti_inflation_program:0 "Anti Inflation Program"
 anti_inflation_program_desc:0 "We are announcing the anti-inflation program. Together with this program, we will experience an increase in deflation rates. Inflation will fall and our well-being will increase!" 
 powerful_g20_member:0 "Powerfull G20 Member"
 powerful_g20_member_desc:0 "We are one of the strongest countries in the G20 and we are using this situation in the international conjuncture so that our power is stabilized politically." 
 international_help_program:0 "International Help Program Contributor"
 international_help_program_desc:0 "We have become a country that supports international aid programs. By supporting international aid programs, "We will ensure that Turkey is heard more."" 
 toki_working_faster:0 "TOKI Constructions"
 toki_working_faster_desc:0 "TOKİ literally "Mass Housing Development Administration" is Turkey's government-backed housing agency. Founded in 1984, TOKİ carries out projects and activities primarily throughout Turkey in line with the government building and mass housing priorities." 
 reliable_president:0 "Reliable President"
 reliable_president_desc:0 "We have a credible president. This reliability gives us dedication and strength. What people wouldn't like to have a credible regime?" 
 mit_empowered:0 "Milli İstihbarat Teşkilatı"
 mit_empowered_desc:0 "The MIT is in charge of collecting intelligence on existing and potential threats from internal and external sources posed against the territory, people and integrity, the existence, independence, security, and all the other elements that compose the constitutional order and the national power of the Republic of Turkey. The MİT is in charge of communicating this intelligence to the President, the Chief of the General Staff, the Secretary-General of the National Security Council, and other relevant state organizations as necessary." 
 euro_defence:0 "Formalized Euro Defence"
 euro_defence_desc:0 "We have established the euro protection zone. Thanks to this protection zone, we will not be economically American-driven. The European economy will be independent and unaffected despite what America is going through." 
 fulfilled_order:0 "Fulfilled Liberal Order"
 fulfilled_order_desc:0 "A new Liberal order has been established. Thanks to this liberal order, we will experience the prestige and the permanence of the westernized system. The stability of the liberal revolution will not stop!" 
 echological_laws:0 "Ecological Laws"
 echological_laws_desc:0 "With the new ecological structure and laws, we will protect our nature and stability. These ecological laws increase the desired prison for events that harm the ecology by an absolute number." 
 factory_filter_law:0 "Factory Filter Law"
 factory_filter_law_desc:0 "The purpose of the smoke law for factories is to limit the carbon dioxide generated due to factories. Along with this limitation, there will be increases in the health and intelligence of our people and our workers." 
 industrialization_law:0 "Industrialization Law"
 industrialization_law_desc:0 "Now we will ensure the planned conduct of its industry by passing a law on industrialization. Planned industries are usually not in a structure that harms the ecology." 
 high_quality_engines:0 "High Quality Engines"
 high_quality_engines_desc:0 "By increasing innovations in the engine industries, we will make the engines run faster. Innovations will allow us to develop in arms and civilian use." 
 liberal_war_economy:0 "Liberal War Economy"
 liberal_war_economy_desc:0 "We will use the war economy on a liberal route. Thanks to this, we will bring our economy to a capacity that is prepared for war and will receive investment while at war. Thus, our economy will not be damaged for a certain period when a major war breaks out." 
 liberal_studies:0 "Liberal Studies"
 liberal_studies_desc:0 "A liberal and harmonious youth is being formed. Thanks to this youth, innovations, and progress will become systematic and orderly." 
 KDK_strenghened:0 "KDK"
 KDK_strenghened_desc:0 "It is a Turkish institution that examines and investigates complaints and submits recommendations about the conformity of the activities of the Government of Turkey with law and fairness under respect for human rights. The institution is independent of the government and answers to the Parliament alone. The Institution evaluates complaints of both individuals and legal entities. Foreign nationals may also lodge complaints to the Institution." 
 stopped_changing_of_the_liberalism:0 "Protected Liberalism"
 stopped_changing_of_the_liberalism_desc:0 "We will not allow liberalism to change because of the developing conjuncture. Liberalism will always move along the same line framework! He won't go any other way! If it deviates, absolute instability arises." 
 democratic_pressure:0 "Western Pressure"
 democratic_pressure_desc:0 "As a result of western pressure in this country, Liberalism began to gain strength from behind. These pressures are among the elements that are very damaging to our political power and nationalism." 
 liberal_islamic_state:0 "Liberal Islamic State"
 liberal_islamic_state_desc:0 "By blending liberalism with Islamism, we have created a form of the new order. In this form, there is now both religion and liberalism. Thanks to the order that we have created we will no longer suffer from economic and social difficulties." 
 specialized_arms_industry:0 "Specialized Arms Industry"
 specialized_arms_industry_desc:0 "Partial privatizations in the military industry will provide a huge amount of support for the expansion of our country in the military field. The fact that liberalism plays a greater role in a liberal government and even liberalism is involved in the military causes our overall profit." 
 tradesman_support_package:0 "Tradesman Support Program"
 tradesman_support_package_desc:0 "The purpose of the trader support package is to ensure that the economy is good in domestic competition by enabling traders to become more powerful. Internal competition is very important for the development of economies." 
 liberal_brain:0 "Liberal Brain"
 liberal_brain_desc:0 "Within the scope of the Liberal Brain strategy, liberalism provides huge support to markets for making people compete with globalizing innovation." 
 holy_european_imperialism:0 "Holy European Imperialism"
 holy_european_imperialism_desc:0 "" 
 central_bank_reselves_law:0 "Central Bank Reserves Law"
 central_bank_reselves_law_desc:0 "Along with the reserve bank of the central bank, control and supervision of reserves will be achieved, and the public will be notified if there is a situation such as an increase or decrease in reserves." 
 multi_party_state:0 "Guaranteed Multi-Party State"
 multi_party_state_desc:0 "The multiparty system was finalized and protected by the reforms carried out. If a single thought dominates in a country, it will be scarce in terms of the dominant thought." 
 protected_elites:0 "Protected Elites"
 protected_elites_desc:0 "The elites must support the establishment of the Ottoman government. The support of the upper class is not like the ridiculous support of the lower class. Giving them protection to get the support of the elites seems to be one of the right moves we can make right now." 
 funded_elites:0 "Funded Elites"
 funded_elites_desc:0 "The elites must support the establishment of the Ottoman government. The support of the upper class is not like the ridiculous support of the lower class. Giving them money to get the support of the elites seems to be one of the right moves we can make right now." 
 systematic_elite_boost:0 "Systematically Defended Elites"
 systematic_elite_boost_desc:0 "The elites must support the establishment of the Ottoman government. The support of the upper class is not like the ridiculous support of the lower class. We will make the support of the elites endless with systematic protection and money-making." 
 cooperation_with_islamists:0 "Cooperative Islamists"
 cooperation_with_islamists_desc:0 "Some Islamists do not look warmly at the cooperation, for them to look warmly, we are conducting a certain propaganda, they must be available for us to get their support." 
 allied_with_jihadists:0 "Alliance With Jihadists"
 allied_with_jihadists_desc:0 "We have become allied with the jihadists. Jihadists are the main force that will protect our country from non-Muslim elements. We must stand behind them with dignity." 
 replaced_mayors:0 "Replaced Mayors"
 replaced_mayors_desc:0 "Since we control the current levels of government, the Mayors are changing according to our wishes. With this change, we will get mayors who are allies to ourselves. These mayors will also be located all over the country and will provide support to our Ottoman movement." 
 replaced_mayors_allied:0 "Allied Mayors"
 replaced_mayors_allied_desc:0 "The mayors are all looking at us positively. This positive point of view is an indicator that we are invisible power. Soon we will go from invisible power to full power!" 
 no_interest_rate_policy:0 "%0 Interest Rate Policies"
 no_interest_rate_policy_desc:0 "Since interest is forbidden in Islam, the decision was made to reset the interest. The zeroing of interest rates has landed like a burden on our economy while making it easier to own a home." 
 saviour_crescent:0 "Saviour Crescent"
 saviour_crescent_desc:0 "The crescent moon, which is a symbol of Islam, is the morale source of our army and our people. With this morale and support, we will make many conquests for the sake of Islam." 
 islamic_cooperationism:0 "Islamic Cooperationism"
 islamic_cooperationism_desc:0 "It is necessary to add strength to our nation by cooperating with the supporters of Islam. Supporters of Islam should get support from the state, which is the Islamic state." 
 ibda_c_cooperationism:0 "IBDA-C Cooperationism"
 ibda_c_cooperationism_desc:0 "We have signed and cooperated with IBDA-C which is a radical Islamic organization. As a result of this cooperation, we are gaining some military and social benefits." 
 ibda_c_cooperationism_2:0 "Alliance With IBDA-C"
 ibda_c_cooperationism_2_desc:0 "We have signed and allied with IBDA-C which is a radical Islamic organization. As a result of this alliance, we are gaining some military and social benefits."
 ibda_c_cooperationism_3:0 "Alliance With IBDA-C"
 ibda_c_cooperationism_3_desc:0 "We have signed and allied with IBDA-C which is a radical Islamic organization. As a result of this alliance, we are gaining some military and social benefits."  
 hezbollah_cooperationism:0 "Hezbollah Cooperationism"
 hezbollah_cooperationism_desc:0 "We have signed and cooperated with Hezbollah, which is known as a sub-branch of Iran. As a result of this cooperation, we are gaining some military and social benefits." 
 hezbollah_cooperationism_2:0 "Alliance With Hezbollah"
 hezbollah_cooperationism_2_desc:0 "We have signed and allied with Hezbollah, which is known as a sub-branch of Iran. As a result of this alliance, we are gaining some military and social benefits." 
 communistic_organizations_crushed:0 "Anti Communist Doctrine"
 communistic_organizations_crushed_desc:0 "In our country, the banner of Islam, not the Communists, is now floating. For this, we adopt an anti-communist doctrine. This anti-communist doctrine will be one of our saving elements against breaking away from religion:" 
 communistic_organizations_crushed_2:0 "Anti Communist Doctrine"
 communistic_organizations_crushed_2_desc:0 "In our country, the banner of Islam, not the Communists, is now floating. For this, we adopt an anti-communist doctrine. This anti-communist doctrine will be one of our saving elements against breaking away from religion." 
 repair_the_state:0 "Repairing The State.."
 repair_the_state_desc:0 "Our country suffered a lot of losses during the war, cities burned to the ground. The sounds of bombs were felt all over the country, but now that the war period is over. Now we are restructuring our country from the back and completely removing support for war industries. It's time for prosperity!" 
 repair_the_mobilization:0 "Repairing The Effects Of Mobilization"
 repair_the_mobilization_desc:0 "The normal population growth has suffered enormous losses due to mobilization. Because of these losses, population declines began. It's time to fix this situation. Now that we've finished mobilizing, we can restore our people."
 dusts_of_the_kemalist_guardians:0 "Dusts Of The Kemalist Guardians"
 dusts_of_the_kemalist_guardians_desc:0 "After the Civil War, the guns were silenced. Most of the troops that followed in the footsteps of Mustafa Kemal were destroyed by our Islamic armies, but the effects of the Kemalist armies are still being felt. Because the army's situations are traditional and formulaic. We will destroy these ridiculous traditions with reforms."
 dusts_of_the_kemalist_guardians_2:0 "Dusts Of The Kemalist Guardians"
 dusts_of_the_kemalist_guardians_2_desc:0 "After the Civil War, the guns were silenced. Most of the troops that followed in the footsteps of Mustafa Kemal were destroyed by our Islamic armies, but the effects of the Kemalist armies are still being felt. Because the army's situations are traditional and formulaic. We will destroy these ridiculous traditions with reforms."
 dusts_of_the_kemalist_guardians_3:0 "Dusts Of The Kemalist Guardians"
 dusts_of_the_kemalist_guardians_3_desc:0 "After the Civil War, the guns were silenced. Most of the troops that followed in the footsteps of Mustafa Kemal were destroyed by our Islamic armies, but the effects of the Kemalist armies are still being felt. Because the army's situations are traditional and formulaic. We will destroy these ridiculous traditions with reforms."
 dusts_of_the_kemalist_guardians_4:0 "Dusts Of The Kemalist Guardians"
 dusts_of_the_kemalist_guardians_4_desc:0 "After the Civil War, the guns were silenced. Most of the troops that followed in the footsteps of Mustafa Kemal were destroyed by our Islamic armies, but the effects of the Kemalist armies are still being felt. Because the army's situations are traditional and formulaic. We will destroy these ridiculous traditions with reforms."
 islamic_army_traditions:0 "Islamic Army Traditions"
 islamic_army_traditions_desc:0 "We have restructured the deteriorating traditions of the army. Our army now has the same Islamic traditions as before. These traditions give our army an extremely powerful unity effect."
 replaced_kemalist_institutions:0 "Replaced Kemalist Institutions"
 replaced_kemalist_institutions_desc:0 "We have disabled the Kemalist institutions that have contributed to our country promptly and replaced them with Islamist institutions. Thus, we will not have an institutional problem consisting of change."
 no_economical_freedom:0 "Controlled Economic Freedom"
 no_economical_freedom_desc:0 "Economic freedoms have done nothing but harm the economy, so we are taking control of the economy by banning financing and economic freedoms in our country."
 fez_traditions:0 "Fez Traditions"
 fez_traditions_desc:0 "The forbidden fez tradition flourished from the back with the return of the Ottoman Empire and the rejection of the usual prohibitions. Our people can wear what they want on their heads!"
 ottoman_language_partially:0 "Ottoman Language Influenced Current Language"
 ottoman_language_partially_desc:0 "We have returned to our old Arabic language more than the old secular stinging language. But there is still a Latin influence with in our alphabet because fully changing it can cause a lot of damage to the country."
 destroy_the_statues:0 "Destroyed Statue Industry"
 destroy_the_statues_desc:0 "Now that we have got rid of the power holders who are constantly erecting statues around us, we can destroy all our sculptural buildings. Death to idolatry forever!"
 secondary_jihadists_state:0 "Secondary Islamic State"
 secondary_jihadists_state_desc:0 "The first Radical Islamic State was destroyed. This is the second radical Islamic state. This second state will never be destroyed like the first one, and it will spread and strengthen Islam with many conquests!"
 global_jihadists:0 "Global Jihadists"
 global_jihadists_desc:0 "Jihadists from around the world are being called to our country, with this call, we will be able to easily make conquests without suffering as a labor force. Strength Arises from Unity!"
 jihadist_barracks:0 "Jihadist Barracks"
 jihadist_barracks_desc:0 "By using jihadist barracks, we will recruit new Islamic fighters to our country. These Islamic fighters will provide the foundation of our Islamic army and the increase of its day."
 global_jihadists_declared:0 "Global Armed Jihadists"
 global_jihadists_declared_desc:0 "Jihadists from around the world who are armed themselves, are being called to our country, with this call, we will be able to easily make conquests without suffering as an army force. Strength Arises from Unity!"
 prepared_for_the_sanctions:0 "Ready For The Sanction Retaliations"
 prepared_for_the_sanctions_desc:0 "There will be big sanctions against us. We need to be prepared for these sanctions because these sanctions will not be similar to known normal sanctions."
 unpausable_war_condititions:0 "Unstoppable War Preparations"
 unpausable_war_condititions_desc:0 "We are preparing for a years-long war that will never end. This war will determine the fate and status of the whole country."
 full_mobilization:0 "Full Mobilization"
 full_mobilization_desc:0 "We call on our country to mobilize fully. This homeland needs you!" 
 no_turning_back:0 "There Is No Turning Back.."
 no_turning_back_desc:0 "We are now entering into a war that will never end. There's no going back from this war. We burned all the bridges that were behind us."
 desert_warfare:0 "Desert Forces"
 desert_warfare_desc:0 "The main goal of the desert armies is to accelerate the advance in Africa and hot regions. An advance with a regular army in the desert or a hot zone is unthinkable."
 camel_warfare:0 "Camel Warfare"
 camel_warfare_desc:0 "The main goal of the desert armies, consisting of camels, is to accelerate the advance in Africa and hot regions. An advance with a regular army in the desert or a hot zone is unthinkable. That is why camels are quite important in such a battle."
 camel_blitzkrieg:0 "Camel Blitzkrieg"
 camel_blitzkrieg_desc:0 "The main goal of the desert armies, consisting of camels, is to accelerate the advance in Africa and hot regions. An advance with a regular army in the desert or a hot zone is unthinkable. That is why camels are very important in such a war, even camels have the power to surround troops."
 anti_usa_arms:0 "Anti Effective US Forces"
 anti_usa_arms_desc:0 "We have established a military order against the American Military model. Thanks to this military order that we have established, we will be able to easily defeat the imperialist forces of America."
 hard_breakthorugh_strategies:0 "Hard Tank Breakthrough Strategies"
 hard_breakthorugh_strategies_desc:0 "By adopting the front-breaking tactics of heavy tanks, we will end the power of enemy countries by breaking the fronts of the nations that are hostile to our country."
 embraced_hardcore_revenge_policies:0 "Embraced Revenge Policies"
 embraced_hardcore_revenge_policies_desc:0 "We will provide power to our country by instilling feelings of revenge on our people. Because a sense of revenge is number one with being a means of ensuring that victories come."
 throwable_man_to_the_front:0 "Efficient Crowd Forces Supply System"
 throwable_man_to_the_front_desc:0 "We will prevent large armies from experiencing food and ammunition shortages by following a new system by large armies will not suffer supply problems."
 stuck_the_conflict:0 "Protect And Don't Move An Inch!"
 stuck_the_conflict_desc:0 "We will suspend all offensive activities from pursuing a defense policy and will not back down an inch. So our borders with our enemies will not change and they will give up in combat."
 umayyad_navy_production:0 "Glorius Umayyad Style-Navy Development Plan"
 umayyad_navy_production_desc:0 ""
 stabilizing_the_great_state:0 "Stabilizing The Great State"
 stabilizing_the_great_state_desc:0 "Our country's stamina and stability have been shaken a lot as a result of the war, to get rid of this concussion, we are bringing peace in our country under the stability program."
 recovering_from_the_great_islamic_war:0 "Recovering From The Great Religion War"
 recovering_from_the_great_islamic_war_desc:0 "As a result of our war for religion, we have succeeded. But there are almost no solid houses left in our country. Now we need to achieve social welfare and strengthen the national economy. This way we assemble recovering policies."
 trying_to_overcome_heavy_casualties:0 "Try To Overcome Men Casualties In The War"
 trying_to_overcome_heavy_casualties_desc:0 "The number of people living in our country has decreased hugely due to the war. The workforce has been decimated heavily. We need to get out of this situation now. It looks like a long-term program will work to get things back on track."
 rocketing_the_GDP:0 "Rocketing The GDP"
 rocketing_the_GDP_desc:0 "Since GDP levels are low in our country, we are embarking on plans to raise GDP. We will increase GDP by 5 times in the long term with these plans we have successfully organized."
 reliable_islamic_movement:0 "Reliable Islamic Movement"
 reliable_islamic_movement_desc:0 "Islam is a religion of trust. If there is no trust in an Islamic country, we will become a state that is incompatible with Islam. To prevent this situation, we will use Islam in our country as a means of trust."
 ottoman_neutralism:0 "Ottoman Neutralism"
 ottoman_neutralism_desc:0 "For the survival of the Ottoman Empire, we adopt Ottoman neutrality. This policy of neutrality will keep us out of wars for now, and we will enter wars when the time comes."
 returning_to_ottoman_values:0 "Traditional Ottoman Community"
 returning_to_ottoman_values_desc:0 "By using the traditional communities of the Ottoman Empire, we will gain votes, and with the vote we gain, we will have power and popularity."
 returning_to_ottoman_values_2:0 "Traditional Ottoman Community"
 returning_to_ottoman_values_2_desc:0 "By using the traditional communities of the Ottoman Empire, we will gain votes, and with this vote gain, we will have power and popularity." 
 returning_to_ottoman_values_3:0 "Traditional Ottoman Community"
 returning_to_ottoman_values_3_desc:0 "By using the traditional communities of the Ottoman Empire, we will gain votes, and with this vote gain, we will have power and popularity."
 parliament_stays_in_course:0 "Parliament Stays In Course"
 parliament_stays_in_course_desc:0 "The Parliament will continue its life with the permission of the current monarchy. It is significantly necessary to maintain democratic elements in the monarchy."
 parliament_stays_in_semi_course:0 "Half Active Parliament Stays In Course"
 parliament_stays_in_semi_course_desc:0 "The Parliament will continue its life with half control of the current monarchy. It is significantly necessary to maintain some democratic elements in the monarchy."
 parliament_abolished:0 "Abolished Parliament"
 parliament_abolished_desc:0 "The Parliament was dissolved through the absolute authority of the Monarchy. Thanks to the fact that the monarchy is absolute, we can fully ensure the administration without giving room for unnecessary things such as democracy."
 fast_decision_staff:0 "Fast Decision Staff"
 fast_decision_staff_desc:0 "We have established a rapid decision-making mechanism with the closure of the parliament and the destruction of democratic decelerating elements. The quick decision mechanism will allow us to show strength at advanced levels and make sudden attacks."
 ottoman_constitution:0 "Ottoman Constitution"
 ottoman_constitution_desc:0 "We have completed and put into effect the constitution design of the Ottoman Empire. Thanks to this constitution, we will become a state far from secularism and we will easily ensure the political unity and power of our country."
 islamization_of_kurds:0 "Islamization Of Kurds"
 islamization_of_kurds_desc:0 "By Islamizing the Kurds, we will prevent them from becoming terrorists. This move will be one of the good moves that can be made to reduce terrorism."
 modern_museums:0 "Modern Museums"
 modern_museums_desc:0 "By building modern museums, we will ensure the expansion of modern culture in the Ottoman Empire. Culture is bringing knowledge and modernization to people's minds."
 tubitak_reformed:0 "Reformed TUBITAK"
 tubitak_reformed_desc:0 "By reforming TUBITAK, we have brought it to a public interest service as before. There can no longer be a situation where we are lagging in terms of science."
 rasathaneler_s:0 "Rasathaneler"
 rasathaneler_s_desc:0 "An observatory is a location used for observing terrestrial, marine, or celestial events. Astronomy, climatology/meteorology, geophysical, oceanography, and volcanology are examples of disciplines for which observatories have been constructed."
 science_supervision_institutions:0 "Ottoman Science Supervision Institution"
 science_supervision_institutions_desc:0 "By establishing an Ottoman Scientific Audit Institution, we will prevent science theft in our country, and thanks to this, cases such as patent theft will not occur."
 fez_traditions_enforced:0 "Fez Traditions Enforced"
 fez_traditions_enforced_desc:0 "By keeping the Fez traditions mandatory, we will ensure that the Fez tradition will never disappear and come to a form that will continue forever."
 modern_and_cultural_museums:0 "Modern And Cultural Museums"
 modern_and_cultural_museums_desc:0 ""
 hilali_ahmer_cemiyeti:0 "Osmanlı Hilal-i Ahmer Cemiyeti"
 hilali_ahmer_cemiyeti_desc:0 "We will make certain small changes to the Red Crescent to ensure that it serves the public properly again. The public benefits of the Red Crescent will be at a high level as in the past."
 mehter_group:0 "Reorganized Army Mehter Group"
 mehter_group_desc:0 "By directing the Mehter group in the army, we will ensure that the mehter group composes nationalist anthems again, and through these anthems, we will create an atmosphere of unity and morale in the army."
 unitary_state_principles:0 "Unitary State Principles"
 german_assistance:0 "German Assistance"
 german_assistance_desc:0 "We will stand behind Germany, as in the First World War, and as an assistant. But this time we will stand behind Germany and get revenge for the disasters which happened in the past."
 turkish_war_machine:0 "Turkish War Machine"
 turkish_war_machine_desc:0 "The Ottoman Empire has become a Turkish war machine. Our country can produce a necessary weapon in a very short time." 
 long_term_invasion_planning:0 "Long Term Invasion Planning"
 long_term_invasion_planning_desc:0 "In the long term, we will enter into wars by making plans and calculations and we will emerge victorious in the end. These Plans and calculations have always been superior to common improvisation in world history."
 controlled_population_movements:0 "Controlled Population Movements"
 controlled_population_movements_desc:0 "Since our country is large, migration and population movements occurring in our country should be controlled. If population movements are left unchecked, there would be too many problems to occur."
 ottoman_mountainner_division:0 "Ottoman Special Mountaineers"
 ottoman_mountainner_division_desc:0 "The goals of the Special Ottoman Mountaineers were to have a strong fighting force in places such as mountains with a high altitude of all kinds."
 ottoman_cavalary_and_mountainner_forces:0 "Ottoman Special Mountaineers And Cavalaries"
 ottoman_cavalary_and_mountainner_forces_desc:0 "The goals of the Special Ottoman Mountaineers And Cavalaries were to have a strong fighting force in places such as mountains with a high altitude and hot places like deserts."
 ottoman_interventionism:0 "Ottoman Interventionism"
 ottoman_interventionism_desc:0 "By adopting the Ottoman intervention, we will prevent anything from happening in the region without our knowledge."
 building_ottoman_naval_forces:0 "Karadeniz Donanma-yı Humayun Build Up"
 building_ottoman_naval_forces_desc:0 "We are engaged in the work of restructuring the Ottoman Black Sea fleet, which was destroyed in the past. We will rebuild our old navy and take control of the Black Sea as before."
 funded_ottoman_naval_forces:0 "Karadeniz Donanma-yı Humayun Build Up"
 funded_ottoman_naval_forces_desc:0 "We are engaged in the work of restructuring the Ottoman Black Sea fleet, which was destroyed in the past. We will rebuild our old navy and take control of the Black Sea as before."
 med_navalshipments:0 "Mediterranean Naval Shipments"
 med_navalshipments_desc:0 "We will ensure that our country strengthens the Mediterranean trade basin and shipments by expanding the Mediterranean sea areas which currently Ottomans have."
 industrialization_program_for_ottomans:0 "Industrialization Program Of Ottomans"
 industrialization_program_for_ottomans_desc:0 "It's time for the industrialization of our Ottoman Empire. As part of the industrialization of the Ottoman Empire, we will now make many innovations and plans. Thanks to these plans, we will achieve a strong state position!"
 ottoman_lira:0 "Ottoman Lira"
 ottoman_lira_desc:0 "Thanks to the Ottoman lira, which we developed after the ineffectiveness and weakness of the Turkish lira, our people are now happy and feel stronger. We hope it will always continue like this."
 toki_cooperatives_ottoman:0 "Ottoman TOKI"
 toki_cooperatives_ottoman_desc:0 "By osmanizing TOKI, we will turn it into a state organization that can benefit the public again. The reforms we will take in the housing administration will be beneficial for our country."
 supporting_foundation_culture:0 "Ottoman Foundation Culture"
 supporting_foundation_culture_desc:0 "We will ensure the rapid development of our country through these foundations by restoring the traditions of the foundation that were destroyed in the Ottoman Empire."
 ottoman_lira_valuable:0 "Valuable Ottoman Lira"
 ottoman_lira_valuable_desc:0 "Thanks to the Ottoman lira, which we developed after the ineffectiveness and weakness of the Turkish lira, our people are now happy and feel stronger as our currency is much stronger than before. We hope it will always continue like this."
 powerized_gold:0 "Powerized Gold"
 powerized_gold_desc:0 "Gold is a monetary mine that was usually used in the Ottoman Empire. The strengthening of this gold will surely make the public feel happy and safe."
 cizye_tax:0 "Jizya Tax"
 cizye_tax_desc:0 "Jizya is a per capita yearly taxation historically levied in the form of financial charge on dhimmis, that is, permanent non-Muslim subjects of a state governed by Islamic law."
 ottoman_tourism:0 "Ottoman Tourism"
 ottoman_tourism_desc:0 "The Ottoman Empire should continue to make way for tourism as it did in the previous Republic. Blocking tourism will do nothing but deal a blow to the Ottoman economy."
 ottoman_film_sector:0 "Ottoman Film Sector"
 ottoman_film_sector_desc:0 "By creating an Ottoman film industry, we will market our series and films to the West. We can certainly get high money thanks to this marketing."
 unemployment_money_reform:0 "Unemployment Money Reform"
 unemployment_money_reform_desc:0 "We needed to push the unemployed to have a job by reducing the money income of the unemployed at a certain rate." 
 systematic_unemployment_decrease:0 "Systematic Unemployment Decrease"
 systematic_unemployment_decrease_desc:0 "Thanks to the reforms we have made for unemployment, unemployment is in a systematic decline, and this is a very auspicious and beautiful situation for our country."
 islamic_war_industries:0 "Islamic War Industries"
 islamic_war_industries_desc:0 "By establishing Islamic war industries, we will raise our military industry to high levels and we will be able to easily supply the needs of our soldiers."
 islamic_war_industries_boosted:0 "Expanded Islamic War Industries"
 islamic_war_industries_boosted_desc:0 "By establishing Islamic war industries, we will raise our military industry to high levels and we will be able to easily supply the needs of our soldiers."
 vulnerable_factories:0 "Vulnerable Arms Factories"
 vulnerable_factories_desc:0 "We will prevent the factories from being bombed in wartime by planting factories in unknown and hidden areas and hidden areas so that our industry will not be in danger of damage and will be able to grow continuously in wartime."
 budget_system_reorganized:0 "Reorganized Budget System"
 budget_system_reorganized_desc:0 "Where the wealth of our country is spent must necessarily be linked to a plan and supervised through institutions. The supervision and rulemaking of the wealth will make  our people have confidence in the current government and will be a factor in our economic growth."
 reformed_gold:0 "Reformed Gold"
 reformed_gold_desc:0 "Gold is one of the game tools of capitalism. The reformation of this gold and the belief of its values in the minimum values will make our people feel happy and safe."
 anti_left_movement:0 "Anti Left Movement"
 anti_left_movement_desc:0 "The legitimate aim of the anti-left movement is to destroy the supremacy of leftist organizations in the country. This right-wing movement is, in short, an organization working for the liberation of the country."
 votable_right:0 "Votable Right"
 votable_right_desc:0 "We are quickly getting rid of the features of the right that cannot be voted for. The right in our country should be in a system that fully corresponds to our people."
