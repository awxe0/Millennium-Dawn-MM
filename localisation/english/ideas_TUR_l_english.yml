 turkic_state:0 "Turkic Union Member"
 turkic_state_desc:0 "The Turkic Council, officially the Cooperation Council of Turkic-Speaking States, is an international organization comprising some of the Turkic countries. It is an intergovernmental organization whose overarching aim is to promote comprehensive cooperation among Turkic-speaking states. "
