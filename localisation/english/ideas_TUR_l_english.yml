 TMSF_overshooting:0 "Paralel Collapse: BDDK Falls Apart"
 TMSF_overshooting_desc:0 ""The sudden collapse of the Banking Regulation and Supervision Agency (BDDK) has unleashed a financial maelstrom across Turkey. The once reliable watchdog responsible for maintaining banking stability is now incapacitated, allowing reckless lending, mismanagement, and unchecked corruption to run rampant. Major banks have teetered on the edge of insolvency, triggering widespread panic among depositors and investors alike. The nation’s credit rating has plummeted, foreign investment has dried up, and inflation has soared as the government struggles to contain the crisis.\n\nThe financial sector’s collapse has spilled into the political arena, fueling public unrest and eroding confidence in the government’s ability to manage the economy. Political factions blame each other for the failure, deepening the country’s divisions. As economic turmoil tightens its grip, social order weakens, and Turkey finds itself vulnerable to both internal instability and foreign influence. Without urgent reforms and restoration of regulatory control, the nation risks descending into prolonged economic and political chaos.""
 TMSF_normal:0 "BDDK Payments"
 TMSF_normal_desc:0 ""The payment systems overseen by the Banking Regulation and Supervision Agency face severe disruptions, causing delays and failures in financial transactions across Turkey. Businesses and citizens struggle to transfer funds reliably, stalling commerce and unsettling markets. The unstable payment infrastructure erodes trust in the banking system and forces many to turn to informal alternatives."
