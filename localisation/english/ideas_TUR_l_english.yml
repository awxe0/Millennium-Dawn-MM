 harmony_of_workers_2_desc:0 "We need to support the labor movement to the fullest, otherwise our workers may face high problems and our industry will normally slow down."
 rise_of_absolutism:0 "Rise Of Absolutism"
 rise_of_absolutism_desc:0 "Indecision and unknown situations will no longer be experienced, these thoughts must be weakness and losers for humanity. The court's decision mechanism will solve our problems."
 rise_of_absolutism_2:0 "Rise Of Absolutism"
 rise_of_absolutism_2_desc:0 "Indecision and unknown situations will no longer be experienced, these thoughts must be weakness and losers for humanity. The court's decision mechanism will solve our problems."
 law_cyclation:0 "Law Cyclation"
 law_cyclation_desc:0 "Laws should be easily changed according to problems. Laws that can be easily changed will be among the activities that support the development of stability."
 engine_of_statistics:0 "Engine Of Statistics"
 engine_of_statistics_desc:0 "We have become a state that works through statistics. Since statistics have the characteristics of summarizing our troubles, statistical solutions will facilitate the control of this nation."
 controlled_and_opened_senate:0 "The Function Of The Senate"
 controlled_and_opened_senate_desc:0 "We have transferred some of the power of the parliament to the senate we have just established. But with the result of this power transfer, there has been chaos. Over time, the balance of power will fall into place."
 absorbation_of_controlled_and_opened_senate:0 "The Function Of The Senate"
 absorbation_of_controlled_and_opened_senate_desc:0 "We have transferred some of the power of the parliament to the senate we have just established. But with the result of this power transfer, there has been chaos. Over time, the balance of power will fall into place."
 quality_audits:0 "Quality Audits"
 quality_audits_desc:0 "There is always a need for quality control, an uncontrolled quality control will do nothing but harm the interests of the country."
 european_quality_life_standarts:0 "European Quality Life Standards"
 european_quality_life_standarts_desc:0 "Our people deserve to experience prosperity in the European Union, that's why we will bring our people, even if we are forced, to achieve these European Union standards."
 kickstart_of_the_militarization:0 "Kickstart The Militarization"
 kickstart_of_the_militarization_desc:0 "We need to militarize quickly, if we do not experience a rapid militarization, we may have a problem of falling behind militarily from other states."
 media_independence_bolstering:0 "Bolstering The Media Independence"
 media_independence_bolstering_desc:0 "Encouraging the media more will increase the democratic standards of our country in a good way and provide stability."
 managed_bureocracy:0 "Manage The Bureaucracy"
 managed_bureocracy_desc:0 "In order for the bureaucracy not to get out of its setting, it needs to be managed by a certain hand. We will do this with bureaucratic control tools."
 open_innovationalism:0 "Open-Minded Innovationalism"
 open_innovationalism_desc:0 "The human mind will be able to be creative without pressure, now that we have eliminated pressure, creativity will also create a high development in our innovativeness."
 regulation_machine:0 "Regulation Machine"
 regulation_machine_desc:0 "Due to the fact that we can make regulations quickly, our state has turned into a regulation machine. We will become more prescriptive and disciplined with regulations."
 scientific_approachment_of_generations:0 "Scientific Approaching"
 sores_in_human_brilliance:0 "The Rise Of Human Brilliance"
 sores_in_human_brilliance_desc:0 "The human mind will be able to experience a high level of development because the state now exists to ensure this."
 foreseeing_the_future:0 "Foreseeing The Future"
 foreseeing_the_future_desc:0 "We need to make justified predictions about the future. If we can predict the future correctly, we will have the opportunity to get out of such situations with advantage."
 foreseeing_the_future_2:0 "Foreseeing The Future"
 foreseeing_the_future_2_desc:0 "We need to make justified predictions about the future. If we can predict the future correctly, we will have the opportunity to get out of such situations with advantage."
 guarded_under_the_NATO:0 "Guarded Under Arms Of NATO"
 guarded_under_the_NATO_desc:0 "We are safe under the military force of NATO, this environment of trust will provide a bonus in almost everything, and we will be able to develop easily."
 protective_EU_membership:0 "Protective EU Deals"
 protective_EU_membership_desc:0 "We have been able to provide military solidarity with the European Union, this will provide us with an extra atmosphere of trust and increase the internal peace of the country."
 revenue_driven_industry:0 "Revenue Driven Light Industry"
 revenue_driven_industry_desc:0 "Our industry should have the ability to develop itself without financial damage so that the industry can develop systematically on its own, and the country can develop well."
 gateway_projection_status:0 "Gateway Projection Revenues"
 gateway_projection_status_desc:0 "Turkey is located as a bridge between the West and the East, thanks to this bridge feature, trade would mainly rotate in these regions, so we will be able to make a good profit and develop decently."
 german_universities:0 "German Universities"
 german_universities_desc:0 "We have opened German universities in our country, these universities will enable European Science to enter our country and strengthen Turkish science in a good way."
 credit_law:0 "Credit Law"
 credit_law_desc:0 "We have issued a credit law, the purpose of this law will be the financialization of the country. This financialization will enrich us and increase our resilience against economic crises."
 cautions_against_the_gulenist_movement:0 "Cautions Against The Gülen Movement"
 cautions_against_the_gulenist_movement_desc:0 "The Gülen movement is gaining strength in the country, we have to prevent this, so announcing and implementing several measures will reduce the harm to our country."
 cautions_against_the_gulenist_movement_2:0 "Cautions Against The Gülen Movement"
 cautions_against_the_gulenist_movement_2_desc:0 "The Gülen movement is gaining strength in the country, we have to prevent this, so announcing and implementing several measures will reduce the harm to our country."
 satisfied_regional_order:0 "The General Order"
 satisfied_regional_order_desc:0 "We have ensured the general administration, terror will no longer be able to throw a javelin within the borders of this state, and peace will be experienced for a long time."
 cautions_against_the_pkk_movement:0 "Cautions Against The PKK Movement"
 cautions_against_the_pkk_movement_desc:0 "The PKK movement is gaining strength in the country, we have to prevent this, so announcing and implementing a few measures will reduce the harm to our country."
 cautions_against_the_pkk_movement_2:0 "Cautions Against The PKK Movement"
 cautions_against_the_pkk_movement_2_desc:0 "The PKK movement is gaining strength in the country, we have to prevent this, so announcing and implementing a few measures will reduce the harm to our country."
 kurdish_approval:0 "Gained Kurdish Approval Rate"
 kurdish_approval_desc:0 "The rate of acceptance of the Kurds has increased now, thanks to this, the PKK and other traditional problems have decreased by a large amount."
 militarys_prisons:0 "Military Prisons"
 militarys_prisons_desc:0 "We have started to open military prisons, and with this initiative, civilians' fears about the law have been eliminated and stability has been ensured."
 turkish_federalization:0 "Turkish Federalization"
 turkish_federalization_desc:0 "Now we have started federalization processes in order to facilitate our management, and we will develop more comfortably and easily with this federalization."
 war_with_hezbollah:0 "War With Hezbollah"
 war_with_hezbollah_desc:0 "The destruction of Hezbollah is necessary for Middle East peace, it is the most necessary thing for the peace and tranquility of the Middle East."
 extensive_earthquake_repair:0 "Extensive Earthquake Efforts"
 extensive_earthquake_repair_desc:0 "We have lost a lot of buildings and people due to the earthquake disaster, these losses have caused a lot of economic damage. We have to be as fast as we can to separate the balance sheet of these losses."
 the_turkish_housing:0 "Turkish Housing"
 the_turkish_housing_desc:0 "Housing, or more generally, living spaces, refers to the construction and assigned usage of houses or buildings individually or collectively, for the purpose of shelter. Housing ensures that members of society have a place to live, whether it is a home or some other kind of dwelling, lodging or shelter. Many governments have one or more housing authorities, sometimes also called a housing ministry or housing department."
 the_turkish_housing_2:0 "Turkish Housing"
 the_turkish_housing_2_desc:0 "Housing, or more generally, living spaces, refers to the construction and assigned usage of houses or buildings individually or collectively, for the purpose of shelter. Housing ensures that members of society have a place to live, whether it is a home or some other kind of dwelling, lodging or shelter. Many governments have one or more housing authorities, sometimes also called a housing ministry or housing department."
 the_turkish_housing_3:0 "Turkish Housing"
 the_turkish_housing_3_desc:0 "Housing, or more generally, living spaces, refers to the construction and assigned usage of houses or buildings individually or collectively, for the purpose of shelter. Housing ensures that members of society have a place to live, whether it is a home or some other kind of dwelling, lodging or shelter. Many governments have one or more housing authorities, sometimes also called a housing ministry or housing department."
 corruption_change_ease:0 "Parliamentary Corruption Shifting Ease"
 economic_shifting_ease:0 "Parliamentary Economic Shifting Ease"
 strikes_in_turkey:0 "Strikes In The Turkey!"
 strikes_in_turkey_desc:0 "Strike action, also called labor strike, labour strike, or simply strike, is a work stoppage caused by the mass refusal of employees to work. A strike usually takes place in response to employee grievances."
 strikes_in_turkey_2:0 "Strikes In The Turkey!"
 strikes_in_turkey_2_desc:0 "Strike action, also called labor strike, labour strike, or simply strike, is a work stoppage caused by the mass refusal of employees to work. A strike usually takes place in response to employee grievances."
 strikes_in_turkey_3:0 "Strikes In The Turkey!"
 strikes_in_turkey_3_desc:0 "Strike action, also called labor strike, labour strike, or simply strike, is a work stoppage caused by the mass refusal of employees to work. A strike usually takes place in response to employee grievances."

 alliance_with_DISK:0 "Alliance With DISK"
 alliance_with_DISK_desc:0 "DISK is another significant labor union confederation in Turkey, known for its progressive stance and advocacy for workers' rights. Collaborating with DISK and embracing its "national spirit" could entail aligning with its principles, which often include advocating for social justice, equality, and the rights of workers."
 alliance_with_TURK_IS:0 "Alliance With TURK-IS"
 alliance_with_TURK_IS_desc:0 "This collaboration could imply a shared commitment to the interests of Turkish workers, as TURK-IS is a prominent labor union confederation in Turkey. Building an alliance with TURK-IS may involve aligning with their goals and values regarding labor rights, workers' welfare, and other related issues. It could also suggest a commitment to fostering a sense of national unity and solidarity among Turkish workers."

 rise_of_the_wild_left:0 "Rise Of The Wild Left"
 rise_of_the_wild_left_desc:0 "The high momentum on the radical Right has created radical momentum on the left. But these radicals on the left need to be checked immediately."

 a_new_kemalism:0 "New Kemalism"
 a_new_kemalism_desc:0 "The Kemalists set out to follow in the footsteps of Atatürk. When Atatürk came back to life, he determined that the people were applying kemalism incorrectly. Thus, kemalism made the transition to a new order suitable for modern life."
 a_new_kemalism_2:0 "New Kemalism"
 a_new_kemalism_2_desc:0 "The Kemalists set out to follow in the footsteps of Atatürk. When Atatürk came back to life, he determined that the people were applying kemalism incorrectly. Thus, kemalism made the transition to a new order suitable for modern life."
 political_troubles_caused_by_modernity:0 "Reassessing The Situation"
 political_troubles_caused_by_modernity_desc:0 "Ataturk has come back to life, and this has been a very difficult situation for him. Because Atatürk is used to his own time, he is not used to this high-tech world and new policies. Over time, he will read new books and get used to this world."
 political_troubles_caused_by_modernity_2:0 "Reassessing The Situation"
 political_troubles_caused_by_modernity_2_desc:0 "Ataturk has come back to life, and this has been a very difficult situation for him. Because Atatürk is used to his own time, he is not used to this high-tech world and new policies. Over time, he will read new books and get used to this world."
 political_troubles_caused_by_modernity_3:0 "Reassessing The Situation"
 political_troubles_caused_by_modernity_3_desc:0 "Ataturk has come back to life, and this has been a very difficult situation for him. Because Atatürk is used to his own time, he is not used to this high-tech world and new policies. Over time, he will read new books and get used to this world."
 new_turkish_economics:0 "Ankara's Economic Missions"
 new_turkish_economics_desc:0 "The economic structure in Turkey is a complete wreck. So, Ataturk organized the Ankara Economics Congress to save the situation. With this congress, Turkey's future plans were drawn. Now Turkey will achieve a certain economic development under the Ankara Mission over time."
 simultanous_switzerland:0 "Simultaneous Switzerland"
 simultanous_switzerland_desc:0 "Turkey will implement Swiss-like policies in foreign policy. With these applications, our country may be responding to attacks that may come from all sides, and Turkey will never face a serious problem."
 free_eu_visa_deal:0 "EU Visa Deal"
 free_eu_visa_deal_desc:0 "The visa issue is very important for Turkey, it needs to come into play. That is why we will proceed to the visa removal procedures by giving various laws and promises to the European Union. Thus, we will ensure the Turkey-European Union integration even faster."
 model_the_euro:0 "Modelled Euro Currency"
 model_the_euro_desc:0 "We have no idea of abolishing the Turkish lira. But by commissioning the Euro model, we will make the Turkish lira valuable and stable. With strong and stable money, per capita income can be increased."
 balkan_investment_fund:0 "Balkan Investment Fund"
 balkan_investment_fund_desc:0 "We have established the Balkan Investment Fund for the formation of investments in the Balkans in certain stages. With this fund created, the economic problems in the region will be lifted and the region will flourish."
 blocked_immigrant_routes:0 "Blocked Immigrant Routes"
 blocked_immigrant_routes_desc:0 "Because of the political crisis in the Middle East, migrants have piled up at our borders. We should prevent them from entering our country. An influx of migrants will put the country in a bad situation."
 nationalist_charities:0 "Rise Of Nationalist Charities"
 nationalist_charities_desc:0 "Nationalist charities may operate in a variety of areas, such as education, cultural preservation, or political advocacy. It is important to note, however, that organizations that promote nationalist or political agendas may not be recognized as charities in all countries, and their activities may be subject to legal restrictions or scrutiny."
 mit_cap:0 "Extra MIT Capacities"
 mit_cap_desc:0 "We have started to develop the capacity of the MIT organization. With the expansion of this capacity, MIT will engage in more powerful and qualified agency activities."
 mit_decp:0 "Extra MIT Decyrption"
 mit_decp_desc:0 "We have started to develop the strength of the MIT organization. With this expansion of empowerment, MIT will engage in more powerful and qualified agency activities."
 strenghtened_mit:0 "Strenghtened MIT"
 strenghtened_mit_desc:0 "The MIT is in charge of collecting intelligence on existing and potential threats from internal and external sources posed against the territory, people and integrity, the existence, independence, security, and all the other elements that compose the constitutional order and the national power of the Republic of Turkey. The MİT is in charge of communicating this intelligence to the President, the Chief of the General Staff, the Secretary-General of the National Security Council, and other relevant state organizations as necessary."
 educational_reformation:0 "Risen Educational Standarts"
 educational_reformation_desc:0 "Education will come to a better situation with the reforms of Atatürk. Improving the education system and policy and supporting national education is the only thing that can be done for the development of Turkey."
 educational_reformation_2:0 "Risen Educational Standarts"
 educational_reformation_2_desc:0 "Education will come to a better situation with the reforms of Atatürk. Improving the education system and policy and supporting national education is the only thing that can be done for the development of Turkey."
 educational_reformation_3:0 "Risen Educational Standarts"
 educational_reformation_3_desc:0 "Education will come to a better situation with the reforms of Atatürk. Improving the education system and policy and supporting national education is the only thing that can be done for the development of Turkey."
 sumerian_turkey:0 "Sumerian Turkey"
 sumerian_turkey_desc:0 "The Sumerians are a Turkic community from Central Asia.  Sumerians has made quite contributions in the past tense. They are now representing today's Turkey."
 quality_first:0 "Rise Of Quality"
 quality_first_desc:0 "The "rise of quality" refers to the increasing focus on producing goods and services that meet high standards of quality. This trend has been driven by a range of factors, including advances in technology, changes in consumer preferences, and increased competition in many industries."
 turkish_culture_state:0 "The Turkish Culture"
 turkish_culture_state_desc:0 "Thanks to its geographical location, Turkey has a lot of different cultures living in it. These cultural values will turn our country into a tourist attraction and cultural center, so that the Turkish people will have a superior culture."
 the_turkish_competition:0 "The Turkish Economic Competition"
 the_turkish_competition_desc:0 "We will start a law focused on increasing competitiveness. Thanks to this increase in competitiveness, our goods Sunday will strengthen, and thanks to this situation, our economy will become durable and strong."
 the_rationality:0 "Rational Values"
 the_rationality_desc:0 "We will create a rational thinking in Atatürk's Turkey, with realistic thinking, our people will realize their preferences in a rational/ science-based way, and the new rational environment will create a lot of practices such as solving crises."
 systematic_industry:0 "Good Foreign Inspired Industrial Chains"
 systematic_industry_desc:0 ""Foreign inspired industrial chains" generally refers to the supply chains or value chains in a particular industry that are influenced or shaped by foreign companies or global trends."
 benefits_of_neutrality:0 "Benefits Of The Semi-Neutrality"
 benefits_of_neutrality_desc:0 ""Semi-neutrality" is a term that can be used to describe a situation in which a country or organization seeks to maintain a position of relative neutrality or impartiality in relation to a particular conflict or issue, while still engaging in some form of action or involvement."
 volunteers_of_the_arabic_spring:0 "Volunteers Of The Freedom"
 volunteers_of_the_arabic_spring_desc:0 "The Middle East is under a political turmoil. We will stop this situation with our own external interventions and we will remove the effects of regional instability and make the country more stable and beautiful."
 med_navy_expansion:0 "Anti-Egyptian Naval Militarization"
 med_navy_expansion_desc:0 "Egypt is following a direction that is contrary to our interests in the region. For the realization of our vision of a Blue Homeland, we must strengthen our navy so that the Egyptian influence in the region will be disrupted and we will make our navy stronger and more durable."
 weapon_localization_timed:0 "Localization Of American Weaponary"
 weapon_localization_timed_desc:0 "We have obtained the necessary military vehicles from the United States. Now, by localizing these tools, we will turn Turkey into a mechanism of war."
 power_of_the_nationalism:0 "Power Of The Nationalism"
 power_of_the_nationalism_desc:0 "This country derives its power from people who love their nation. It will go on like this forever. Long live Turkish Nationalism, which embraces the Turkish People! "How Happy is He who says I am a Turk!""
 mosque_law:0 "Mosque Law"
 mosque_law_desc:0 "We have established a new mosque law. With this new law, imams and religious officials in the Mosque will not be able to conduct propaganda. Thus, political and religious stability will gain peace."
 counter_religion_politicization:0 "Counter Religion Politicization"
 counter_religion_politicization_desc:0 "We must destroy radicalization! We will also implement various policies to destroy it, We will keep the mosque under control within the scope of these policies and prevent the emergence of radical imams."
 the_land_of_religions:0 "The Land Of Free Religions"
 the_land_of_religions_desc:0 "Just because we are known as a secular state does not mean that we are not the land of free religions. We will ensure that every religion operates in our country and our country will live in a religious peace. Religious stability is development."
 general_unionization:0 "Unionization Campaign"
 general_unionization_desc:0 "A unionization campaign is an effort by employees to organize themselves into a union to represent their collective interests in their workplace. The campaign usually involves several steps, including educating employees about the benefits of unionization, collecting signatures or authorization cards from employees who support the union, and negotiating with the employer to recognize the union and begin collective bargaining."
 unemployment_planning_1:0 "The Employment Missions"
 unemployment_planning_1_desc:0 "Together with structural reforms, we will bend the neck of unemployment, and of course we will achieve this with the unions and our workers' trust in the state and the support they create in many sector. Nation Is Here!"
 unemployment_planning_2:0 "The Employment Missions"
 unemployment_planning_2_desc:0 "Together with structural reforms, we will bend the neck of unemployment, and of course we will achieve this with the unions and our workers' trust in the state and the support they create in many sector. Nation Is Here!"
 a_working_state:0 "Working State"
 a_working_state_desc:0 "We have started the process of turning our country into a scientific land. Thus, there will be happy and future-minded individuals in the country. Turkey will develop in every sense."
 functional_YSK:0 "Free Governed YSK"
 functional_YSK_desc:0 "To achieve a free and impartial YSK, it is important to establish and protect the independence and impartiality of the board. This can be done by ensuring that the members of the board are appointed through a transparent and fair process that takes into account their qualifications and experience. It is also important to provide them with the necessary resources and support to carry out their duties effectively."
 reorganized_AYM:0 "Reorganized AYM"
 reorganized_AYM_desc:0 "Achieving a well-organized and effective AYM in Turkey would require a commitment to transparency, independence, and accountability, as well as a willingness to invest in the necessary resources and support for judges to carry out their duties effectively."
 natural_transformation:0 "The Natural Transformation"
 natural_transformation_desc:0 "Our people will experience a natural change accompanied by new policies. With this change, a basic and general environment of stability and order will be provided."
 national_wisdom:0 "National Wisdom"
 national_wisdom_desc:0 ""National wisdom" is a term that is often used to describe the collective intelligence, insight, and knowledge of a nation or country. It refers to the accumulated experience and understanding of a society, including its history, culture, traditions, and values."
 nuclear_energy_project:0 "Turkish Nuclear Energy Project"
 nuclear_energy_project_desc:0 "The Republic of Turkey should not lag behind on nuclear technology. That is why, accompanied by Atatürk, we are moving on to an innovative nuclear doctrine and nuclear reactorization breakthroughs. Thanks to this comprehensive program, we will achieve success and stability. Long live the Homeland and Freedom! We will always protect our borders!"
 nuclear_energy_project_2:0 "Turkish Nuclear Energy Project"
 nuclear_energy_project_2_desc:0 "The Republic of Turkey should not lag behind on nuclear technology. That is why, accompanied by Atatürk, we are moving on to an innovative nuclear doctrine and nuclear reactorization breakthroughs. Thanks to this comprehensive program, we will achieve success and stability. Long live the Homeland and Freedom! We will always protect our borders!"
 nuclear_energy_project_3:0 "Turkish Nuclear Energy Project"
 nuclear_energy_project_3_desc:0 "The Republic of Turkey should not lag behind on nuclear technology. That is why, accompanied by Atatürk, we are moving on to an innovative nuclear doctrine and nuclear reactorization breakthroughs. Thanks to this comprehensive program, we will achieve success and stability. Long live the Homeland and Freedom! We will always protect our borders!"
 nuclear_energy_project_4:0 "Turkish Nuclear Energy Project"
 nuclear_energy_project_4_desc:0 "The Republic of Turkey should not lag behind on nuclear technology. That is why, accompanied by Atatürk, we are moving on to an innovative nuclear doctrine and nuclear reactorization breakthroughs. Thanks to this comprehensive program, we will achieve success and stability. Long live the Homeland and Freedom! We will always protect our borders!"
 space_intelligence:0 "Intelligence Of Space"
 space_intelligence_desc:0 "By increasing our technology and satellite power in space, we will increase our spy and surveillance capabilities in space. New possibilities in space will give us astropolitical power."
 state_realism:0 "Realist Values"
 state_realism_desc:0 "We will create a realistic thinking in Atatürk's Turkey, and with realistic thinking, our country will develop in a reality-oriented way. This situation is a booty for the stability of Turkey."
 ataturk_innovationalism:0 "Kemalist Innovationalism"
 ataturk_innovationalism_desc:0 "Atatürk's thought is also an innovative thought. Thanks to these thoughts, our country will become atmost the center of technology."
 promising_investors:0 "Promising Investors"
 promising_investors_desc:0 "The investor had not come here because the Turkish economy was a complete wreck. Now, with the incentives that Ankara will make, our country will attract self-confident domestic and foreign investors like a magnet and become stronger."
 promising_investors_2:0 "Promising Investors"
 promising_investors_2_desc:0 "The investor had not come here because the Turkish economy was a complete wreck. Now, with the incentives that Ankara will make, our country will attract self-confident domestic and foreign investors like a magnet and become stronger."
 tank_research_office:0 "Tank Research Office"
 tank_research_office_desc:0 "Turkey has disappointed Atatürk about the tank industry. Atatürk considered the tank industry to be one of our number one areas that could export instead of disappearing as it is today. Ataturk is now establishing these auxiliary development offices to correct the mistakes of the Turkish nation…"
 tank_research_office_2:0 "Tank Research Office"
 tank_research_office_2_desc:0 "Turkey has disappointed Atatürk about the tank industry. Atatürk considered the tank industry to be one of our number one areas that could export instead of disappearing as it is today. Ataturk is now establishing these auxiliary development offices to correct the mistakes of the Turkish nation…"
 plane_research_office:0 "Plane Research Office"
 plane_research_office_desc:0 "Turkey has disappointed Atatürk about the aircraft industry. Atatürk considered the aircraft industry to be one of our number one areas that could export instead of disappearing as it is today. Ataturk is now establishing these auxiliary development offices to correct the mistakes of the Turkish nation…"
 reissuing_peace_in_the_region:0 "Issuing Peace In The Region"
 reissuing_peace_in_the_region_desc:0 "The words of peace at home and peace in the world cannot be realized in the current conjuncture. Our neighbors are in complete turmoil, we must definitely get them out of the bad burrito and achieve regional stability. We can do this with high interventions. That is why we are starting the processes of turning the region into a peace axis by putting aside the peace policy and maintaining our own interests and national aspirations in the region."
 the_eximbank_improvement:0 "The Improvement Of Eximbank"
 the_eximbank_improvement_desc:0 "Eximbank is an institution established by the Decision of the Council of Ministers published in the Official Gazette dated August 21, 1987, which provides loans to develop exports. From 1987 until 2012, the general directorate of Türk Eximbank was located in Ankara. In 2012, it moved its headquarters to Umraniye to be closer to the exporting companies. The Bank has a total of 3 Regional Directorates in Istanbul, Ankara, and Izmir; 20 branches, and 12 liaison offices."
 wage_improvement:0 "Wage Policies"
 wage_improvement_desc:0 "The financial enrichment of people will establish the continuity of the country. That is why we, as the state, will provide extra financial support to people so that we can achieve an overall financial and state gain."
 family_and_youth_bank:0 "Family And Youth Bank"
 family_and_youth_bank_desc:0 "We encourage our young people to start a family. We will give marriage loans to our newly married couples. We will establish a family and youth bank. We will support our young people with this bank. We will support it with the revenue of natural gas. We will be with them with grants and incentive programs."
 turkiye_ekseni:0 "The Turkish Axis"
 turkiye_ekseni_desc:0 "The main goal of our foreign policy in the Turkish Century is to build the Turkey Axis. We will strengthen this together with 85 million Turkish citizens, our relatives outside the geographical borders, and our friends and allies around the world."
 turkish_genom_project:0 "Turkish Genom Project"
 turkish_genom_project_desc:0 "The Turkish Genome Project (TGP) was a national scientific research project to determine the base pairs that make up human DNA, and of identifying, mapping, and sequencing all of the genes of the human genome from both a physical and a functional standpoint in Turkey."
 justice_lessons:0 "Justice Lessons"
 justice_lessons_desc:0 "Justice lessons play a crucial role in society by educating individuals about the principles of justice, the rule of law, and the importance of fairness and equality. "
 e_turquality:0 "E-Turquality"
 e_turquality_desc:0 "E-Turquality (Stars of Informatics) program is a support program covering the development of informatics and its sub-sectors in our country, encouraging innovation and conducting it for the creation of regional and global unicorns that can compete in international Sundays."
 cimer_question:0 "CIMER Reformed"
 cimer_question_desc:0 "Presidential Communication Center, abbreviated as CIMER, is a system founded in 2015 allowing Turkish citizens to contact the Presidency of Turkey regarding complaints or to obtain information. The agency must respond to these inquiries within 15 or 30 days, depending on the type of request."
 traditional_education:0 "Traditional Education"
 traditional_education_desc:0 "Traditional education refers to the conventional form of education that has been prevalent for centuries. It typically involves teacher-centered instruction, standardized curriculum, and classroom-based learning. While traditional education has been the dominant model for a long time, there has been an increased emphasis on alternative educational approaches in recent years."
 the_national_front:0 "Fronts Of Presidency"
 the_national_front_desc:0 "Our country has developed with the new system and has managed to obtain solid authority and power by reinforcing its shortcomings. This system enabled our country to become politically stronger and a state compatible with the war was formed. The New Turkey has been strengthened with these breakthroughs. Long live the Second Century of Turkey!!"
 zafer_tourism:0 "Zafer Tourism"
 zafer_tourism_desc:0 "The Zafer Party announced on its social media accounts that it had launched an election campaign under the name of “Zafer Tourism”. The campaign is raising money from voters with a promise to send refugees back by buses."
 zafer_mancinik:0 "Zafer Mancinik"
 zafer_mancinik_desc:0 "The Zafer Mancinik project is known as an advanced version of Zafer tourism. Mancinik means catapult in English, that is, the idea of kicking refugees out of a nation with a catapult in a figurative sense."
 reach_the_left_right_front:0 "Right And Left Coalition"
 reach_the_left_right_front_desc:0 "A right-left coalition, also known as a center-right or center-left coalition, refers to a political alliance between parties on the right and left ends of the political spectrum"
 the_national_investment_act:0 "National Investment Act"
 the_national_investment_act_desc:0 "Many countries have legislation or policies in place to regulate investment activities within their borders. These laws aim to promote economic growth, protect investors, and ensure fair and transparent investment practices. These laws may cover various aspects of investment, such as foreign investment, domestic investment, incentives for investors, regulations on specific industries, and protection of intellectual property rights."
 granted_central_bank_independence:0 "Granted Central Bank Independence"
 granted_central_bank_independence_desc:0 "Central bank independence refers to the ability of a central bank to operate autonomously and make monetary policy decisions free from political interference or influence. When central banks are granted independence, it means they have the authority to pursue their objectives, such as price stability and financial stability, without undue pressure from the government or other external entities."
 turkish_style_silicon_valleys:0 "Turkish Style Silicon Valleys"
 turkish_style_silicon_valleys_desc:0 "We have started to adapt the silicon valley system, which works extremely well in America. With this adaptation, our country will move to a development process with innovative forces and our country will introduce new technological products to the world market."
 the_turkish_start_up_culture:0 "Turkish Start-Up Culture"
 the_turkish_start_up_culture_desc:0 "Turkey has experienced significant growth in its start-up ecosystem over the past decade, with a thriving start-up culture emerging in cities like Istanbul, Ankara, and Izmir."
 the_TWF:0 "Turkish Wealth Fund"
 the_TWF_desc:0 "The Turkey Wealth Fund is a $33 billion sovereign wealth fund founded in August 2016 and owned by the Government of Turkey. The fund is operated with a "Strategic Investment Plan", which was approved by the Cabinet. Companies and assets formerly owned by state institutions shall be eligible to be transferred to the fund and sub-funds shall be able to be created if viewed appropriate."
 syrian_marriage:0 "Syrian-Turkish Marriage"
 syrian_marriage_desc:0 "With the migration of Syrians, we have experienced macroeconomic, political, and demographic difficulties, and the only way to solve these problems is to marry Syrians. This marriage will help to increase our population in our country, integrate Syrians into the country and enable us to win votes at the same time."
 economic_failing_2:0 "Losing The Economic Motivation"
 economic_failing_2_desc:0 "The state created a deep dent in the economy by abandoning the policies of the well-known Orthodoxy. To close this dent, we must connect back to the capitalist view of liberal Orthodoxy and live in this economic thinking for many years for us to recover."
 the_american_force:0 "American Backed Corps"
 green_strikes_in_turkey:0 "Green Riots"
 green_strikes_in_turkey_desc:0 "Ecologists are protesting against government policies, this is very damaging to our stability and our workforce. We must overcome this immediately, otherwise, there will be problems for our country."
 the_turkish_brain_drain:0 "Turkish Brain Drain"
 the_turkish_brain_drain_desc:0 "The term "brain drain" refers to the emigration or loss of highly skilled and educated individuals from one country to another, often due to better opportunities or conditions abroad. Turkey has experienced a brain drain over the years, with many talented individuals choosing to leave the country in search of better career prospects, higher salaries, or improved living standards. Now the brain drain happens in Turkey by a huge amount we need to get over this."
 the_turkish_brain_drain_2:0 "Turkish Brain Drain"
 the_turkish_brain_drain_2_desc:0 "The term "brain drain" refers to the emigration or loss of highly skilled and educated individuals from one country to another, often due to better opportunities or conditions abroad. Turkey has experienced a brain drain over the years, with many talented individuals choosing to leave the country in search of better career prospects, higher salaries, or improved living standards. Now the brain drain happens in Turkey by a huge amount we need to get over this."
