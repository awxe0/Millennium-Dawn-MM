 turkish_2001_crisis:0 "2001 Turkish Economic Crisis"
 turkish_2001_crisis_desc:0 "The crash was emblematic of the political and economic problems that had been wearing on Turkey for years. Confidence in the government had been eroded by corruption and the inability to form lasting coalitions. The stock market crash revealed Turkey's economic situation to be not only extremely fragile but also entirely dependent on foreign investment. Although not as significant as decreased foreign investment or the massive budget deficit, the crash highlights Turkey's recent political instability."
 reformed_2001_crisis:0 "Turkish Economic Sickness"
 reformed_2001_crisis_desc:0 "People are tired of the fact that the country is generally dependent on investment and the Turkish economy has not improved for nearly 50 years due to political problems. The country must now recover from the political crisis and fix its economy for its economic independence"
