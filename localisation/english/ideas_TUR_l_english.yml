 turkish_military_infulence:0 "Guardians Of The Kemalism"
 turkish_military_infulence_desc:0 "The guardians who protect Kemalism in our country have launched coups to our country in 1960 and 1980. Along with the coups, the country's secularism principle was preserved. The Kemalist army aims to make the country follow Ataturk's ideals. When Ataturk was not a figure of the new government, the Turkish Armed Forces launched coups in the country to correct the bad situation. §GAnd when things improved, as the people expected, the army would leave the administration and elections would be held again.§!\n\n§YAlmost every 20 years, a coup or memorandum was sent to the government by the military and it demoralizing the public. People no longer like the Armed Kemalist military order. In this case, it affected the economy of our people.§!\n\n§BThe Turkish Armed Forces detained parties like §Y[Conservative_L]§! that did not adopt secularism and they will oppose these parties. The parties he opposed were eventually shut down by the Constitutional Court.§!\n\nIt is time for this order to change, the people must have self-rule, and we must get rid of this military guardianship regime quickly, but first, we must be patient. §REverything has a time.§!"
 turkish_military_infulence_coup:0 "National Unity Committee Of The Kemalism"
 turkish_military_infulence_coup_desc:0 "The guardians who protect Kemalism in our country have launched coups to our country in 1960 and 1980. Along with the coups, the country's secularism principle was preserved. The Kemalist army aims to make the country follow Ataturk's ideals. When Ataturk was not a figure of the new government, the Turkish Armed Forces launched coups in the country to correct the bad situation. §GAnd when things improved, as the people expected, the army would leave the administration and elections would be held again.§!\n\n§YAlmost every 20 years, a coup or memorandum was sent to the government by the military and it demoralizing the public. People no longer like the Armed Kemalist military order. In this case, it affected the economy of our people.§!\n\n§BThe Turkish Armed Forces detained parties like §Y[Conservative_L]§! that did not adopt secularism and they will oppose these parties. The parties he opposed were eventually shut down by the Constitutional Court.§!\n\nIt is time for this order to change, the people must have self-rule, and we must get rid of this military guardianship regime quickly, but first, we must be patient. §REverything has a time.§!"
 turkish_military_infulence_armed:0 "Mobilized Guardians Of The Kemalism"
 turkish_military_infulence_armed_desc:0 "The guardians who protect Kemalism in our country have launched coups to our country in 1960 and 1980. Along with the coups, the country's secularism principle was preserved. The Kemalist army aims to make the country follow Ataturk's ideals. When Ataturk was not a figure of the new government, the Turkish Armed Forces launched coups in the country to correct the bad situation. §GAnd when things improved, as the people expected, the army would leave the administration and elections would be held again.§!\n\n§YAlmost every 20 years, a coup or memorandum was sent to the government by the military and it demoralized the public. People no longer like the Armed Kemalist military order. In this case, it affected the economy of our people.§!\n\n§BThe Turkish Armed Forces detained parties like §Y[Conservative_L]§! that did not adopt secularism and they will oppose these parties. The parties he opposed were eventually shut down by the Constitutional Court.§!\n\nIt is time for this order to change, the people must have self-rule, and we must get rid of this military guardianship regime quickly, but first, we must be patient. §REverything has a time.§!"
