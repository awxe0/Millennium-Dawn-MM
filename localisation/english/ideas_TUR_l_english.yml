 tsk_seref_madalyonu:0 "TAF Medal Of Honor"
 tsk_seref_madalyonu_desc:0 "Turkish Armed Forces Medal of Honor awarded to successful personnel of the Turkish Armed Forces since 1967. Gold plated for those who play an important role in the dispatch and administration and victory of the war; silver plated Medal of Honor is awarded to Turkish and foreign soldiers and civilians who save people and troops whose lives are in danger, putting their lives in danger."
 tsk_basari_madalyonu:0 "TAF Achievement Medal"
 tsk_basari_madalyonu_desc:0 "The Turkish Armed Forces Achievement Medal is a medal awarded to successful personnel of the Turkish Armed Forces since 1967. In war, it is awarded to those who have performed exceptional success in performing important tasks, and in peace, their success in service exceeds what is expected of them."
 tsk_hizmet_madalyonu:0 "TAF Service Commendation Medal"
 tsk_hizmet_madalyonu_desc:0 "The Turkish Armed Forces Service Commendation Medal is a medal awarded to successful personnel of the Turkish Armed Forces since 1967. In war and peace, it is awarded to Turkish and foreign soldiers who are injured by the cause and effect of the Mission while performing their duty with superior effort and are a boastful occasion for the Turkish Armed Forces."
 tsk_ustun_cesaret_madalyonu:0 "TAF Medal For Outstanding Bravery And Renunciation"
 tsk_ustun_cesaret_madalyonu_desc:0 "The Turkish Armed Forces Medal for Outstanding Bravery and renunciation is a medal awarded by the Turkish Armed Forces to soldiers who have successfully fulfilled their responsibility and duty under difficult conditions and conditions. The medal, consisting of three pieces, is bronze, and above the medal is a picture of the soldier who served."
 tsk_ustun_hizmet_madalyonu:0 "TAF Distinguished Service Medal"
 tsk_ustun_hizmet_madalyonu_desc:0 "First issued in 1967, the Turkish Armed Forces on July 27 and July 29, the Distinguished Service Medal by the Turkish Armed Forces in its present form in 1983, with members of the armed forces engaged in superior service compared to similar products in the Armed Forces, the armed forces and the general oramirallig discovered or developed for the inventory of tools and materials promoted to Lieutenant-General and koramiral of Turkish citizens with civil and foreign soldiers and civilians, and their sacrifice in peace and war, is given in return for their heroism and outstanding performance."
 trait_TUR_gulen_champion:0 "Gülenist Champion"
 trait_TUR_gulen_champion_desc:0 "This commander has connections with the Gülen organization. This organization's mission is to destroy Kemalism, official state ideology."
 tsk_nato_officer:0 "Pro-NATO Officer"
 tsk_nato_officer_desc:0 "This commander's relations with NATO are very positive. This commander can be found in a NATO coup or in NATO exercises."