 turkish_IMF_reformation_1:0 "Turkish Monetary Reformation - §YIn Action§!"
 turkish_IMF_reformation_1_desc:0 "In the early 2000s, Turkey underwent a significant monetary reformation to address the economic challenges it was facing at the time. The country was grappling with high inflation, fiscal instability, and a history of financial crises. The government and central bank introduced a series of reforms aimed at stabilizing the economy, curbing inflation, and improving overall financial health."
