 rise_of_fp:0 "Rise Of §Y[Conservative_L]§!"
 rise_of_fp_desc:0 "Turkey has long been a secular country, but more and more people are wishing more traditions of Islam back into society. Many people are angry with the borderline anti-religion attitude of Kemalist parties."
 TURKEY_MILLENNIUM_DAWN_DESC:0 "The young republic has barely arrived in these modern times. Recently, the level of corruption in the country has reached high levels, and parties that have differences of opinion have begun to clash. In an attempt to end this, the army staged coups to the country, so that the country's economy continued to suffer damage after damage. The Turkish people entered the 2000s with hopes that the economy and political problems would improve. \n\nLet's see if there will be good days for the young Republic."
 TURKEY_MODERN_DAY_DESC:0 "After Turkey's 2001 economic crisis, the AKP party became in power with a majority of votes. Because the AKP is a religious party, it has had tensions with the military in the recent past. After the AKP became a power, it made the economy beautiful with reforms, but the economic growth has recently begun to decline. In 2016, the AKP tried to overthrow the country, which it was formerly close to, now declared a terrorist, but failed in a popular struggle. With the failure of Gulen's coup attempt, AKP votes increased.\n\nWhat will be the fate of this country?"
