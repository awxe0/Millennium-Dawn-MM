 6_arrows:0 "Six Kemalist Principles"
 6_arrows_desc:0 "There are six fundamental pillars of the ideology: Republicanism, Laicism  Statism, and Reformism (or called "Revolutionism". Together they represent a kind of Jacobinism, defined by Atatürk himself as a method of utilizing political despotism to break down the social despotism prevalent among the traditionally minded Turkish-Muslim population, for which he blamed foremost the bigotry of the ulema. The principles came to be recognized as unchangeable and sacrosanct."
 solar_energy:0 "Solar Energy"
 solar_energy_desc:0 "Solar energy is radiant light and heat from the Sun that is harnessed using a range of ever-evolving technologies such as solar heating, photovoltaics, solar thermal energy, solar architecture, molten salt power plants, and artificial photosynthesis."
 wind_rose_energy:0 "Wind Rose Energy"
 wind_rose_energy_desc:0 "Wind power or wind energy is the use of wind to provide mechanical power through wind turbines to turn electric generators for electrical power. Wind power is a popular sustainable, renewable source of power that has a much smaller impact on the environment compared to burning fossil fuels."
 hydroelectiricty:0 "Hydroelectiricty"
 hydroelectiricty_desc:0 "Hydroelectricity, or hydroelectric power, is electricity produced from hydropower. In 2015, hydropower generated 16.6% of the world's total electricity and 70% of all renewable electricity, and was expected to increase by about 3.1% each year for the next 25 years."
 EU_approach:0 "European Approach"
 TURAN_approach:0 "Turan Approach"
 laws_of_bor:0 "Boron Fields"
 laws_of_bor_desc:0 "Boron is a chemical element with the symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae and not by stellar nucleosynthesis, it is a low-abundance element in the Solar System and the Earth's crust. It constitutes about 0.001 percent by weight of Earth's crust. Boron is concentrated on Earth by the water-solubility of its more common naturally occurring compounds, the borate minerals. These are mined industrially as evaporites, such as borax and kernite. The largest known boron deposits are in Turkey, the largest producer of boron minerals."
