 anti_left_movement_2_desc:0 "The legitimate aim of the anti-left movement is to destroy the supremacy of leftist organizations in the country. This right-wing movement is, in short, an organization working for the liberation of the country."
 counter_guerillas:0 "Counter Guerillas"
 counter_guerillas_desc:0 "The counter-guerrillas, an American-born organization, is one of the main factors that will prevent the spread of communism in our country."
