 power_of_energy:0 "Small Rentier State"
 agricultural_movement_4:0 "Agricultural Movement"
 agricultural_movement_4_desc:0 "Our farmer is the master of the people. We have to support them. If they get dragged into bankruptcy, we'll collapse. That's why we, as a populist country, support agricultural actions.\n\n§YAgricultural Support Level: §GNice§!"
 agricultural_movement_3:0 "Agricultural Movement"
 agricultural_movement_3_desc:0 "Our farmer is the master of the people. We have to support them. If they get dragged into bankruptcy, we'll collapse. That's why we, as a populist country, support agricultural actions. \n\n§YAgricultural Support Level: §YMedium§!"
 agricultural_movement_2:0 "Agricultural Movement"
 agricultural_movement_2_desc:0 "Our farmer is the master of the people. We have to support them. If they get dragged into bankruptcy, we'll collapse. That's why we, as a populist country, support agricultural actions.\n\n§YAgricultural Support Level: §RLow§!"
 agricultural_movement:0 "Agricultural Movement"
 agricultural_movement_desc:0 "Our farmer is the master of the people. We have to support them. If they get dragged into bankruptcy, we'll collapse. That's why we, as a populist country, support agricultural actions.\n\n§YAgricultural Support Level: §RVery Low§!"
 encouraged_workers:0 "Encourage Workers"
 encouraged_workers_desc:0 "The workers work for this country, we must encourage them against the great capitalist order. Capitalism is beautiful when it's domesticated."
 unemployment_level_3:0 "War On Unemployment"
 unemployment_level_3_desc:0 "Unemployment is a situation that can disrupt the welfare of our people. The only way to get through this is to reduce unemployment. Low unemployment is a guarantee that this country will strengthen. That's why we're doing everything we can to reduce unemployment.\n\n§YEmployer Support Level: §GA Lot§!"
 unemployment_level_2:0 "War On Unemployment"
 unemployment_level_2_desc:0 "Unemployment is a situation that can disrupt the welfare of our people. The only way to get through this is to reduce unemployment. Low unemployment is a guarantee that this country will strengthen. That's why we're doing everything we can to reduce unemployment.\n\n§YEmployer Support Level: §YMedium§!"
 unemployment_level_1:0 "War On Unemployment"
 unemployment_level_1_desc:0 "Unemployment is a situation that can disrupt the welfare of our people. The only way to get through this is to reduce unemployment. Low unemployment is a guarantee that this country will strengthen. That's why we're doing everything we can to reduce unemployment.\n\n§YEmployer Support Level: §RLow§!"
 coding_classes:0 "Coding Classes"
 fishing_sites_3:0 "Fishing Industry"
 fishing_sites_3_desc:0 "The fishing industry includes any industry or activity concerned with taking, culturing, processing, preserving, storing, transporting, marketing, or selling fish or fish products. It is defined by the Food and Agriculture Organization as including recreational, subsistence, and commercial fishing, and the related harvesting, processing, and marketing sectors. The commercial activity is aimed at the delivery of fish and other seafood products for human consumption or as input factors in other industrial processes.\n\n§YFishing Industry Level: §GNice§!"
 fishing_sites_2:0 "Fishing Industry"
 fishing_sites_2_desc:0 "The fishing industry includes any industry or activity concerned with taking, culturing, processing, preserving, storing, transporting, marketing, or selling fish or fish products. It is defined by the Food and Agriculture Organization as including recreational, subsistence, and commercial fishing, and the related harvesting, processing, and marketing sectors. The commercial activity is aimed at the delivery of fish and other seafood products for human consumption or as input factors in other industrial processes.\n\n§YFishing Industry Level: §YMedium§!"
 fishing_sites:0 "Fishing Industry"
 fishing_sites_desc:0 "The fishing industry includes any industry or activity concerned with taking, culturing, processing, preserving, storing, transporting, marketing, or selling fish or fish products. It is defined by the Food and Agriculture Organization as including recreational, subsistence, and commercial fishing, and the related harvesting, processing, and marketing sectors. The commercial activity is aimed at the delivery of fish and other seafood products for human consumption or as input factors in other industrial processes.\n\n§YFishing Industry Level: §RLow§!"
 passaport_strong:0 "Strong Turkish Passport"
 passaport_strong_desc:0 "Our people should be able to travel anywhere they want, they deserve it."
 passaport:0 "Turkish Passaport"
 passaport_desc:0 "Our people should be able to travel anywhere they want, they deserve it."
 unions_of_the_state:0 "Trade Unions Of The State"
 unions_of_the_state_desc:0 "A trade union, often simply called a union, is an organization of workers who have come together to achieve many common goals, such as protecting the integrity of their trade, improving safety standards, and attaining better wages, benefits, and working conditions through the increased bargaining power wielded by the creation of a monopoly of the workers. Trade unions typically fund the formal organization, head office, and legal team functions of the trade union through regular fees or union dues."
 pkk_terror_idea_low:0 "PKK Insurgency"
 pkk_terror_idea_low_desc:0 "Since 1978, the Kurdistan Workers' Party (PKK) and allied left-wing groups wage a major insurgency against the Turkish government, seeking self-determination for Turkey's Kurdish provinces. Despite brutal crackdowns and the capture of their leader Abdullah Öcalan in 1999, the conflict still rages on, having left a major trauma on the peoples of the country with no end in sight."
 militarize_the_workers:0 "Armed Workers"
 militarize_the_workers_desc:0 "Workers, comrades, and farmers call you to revolt. Together we will defeat this capitalist order."
 prepare_for_war:0 "Preparing For War"
 prepare_for_war_desc:0 "The war seems imminent. We have to make preparations!"
 globalization_of_turkey:0 "Globalization Of Turkey"
 globalization_of_turkey_desc:0 "Ultranationalism has made us nervous. All races and all people in the world should be equal. Long live populism!"
 turkish_union_front:0 "Union Front"
 turkish_union_front_desc:0 "Our Front Is The People's Front. It's what our people want. As Atatürk said, We will raise our country to high levels with the new system we have established."
 communist_military:0 "Left-Wing Military"
 perincek_state:0 "Perinçek Leadership"
 communist_infulence:0 "Communist Influence"
 communist_infulence_desc:0 "This country is being infiltrated by a communist country"
 tca:0 "Türk Komunist İstihbarat Teşkilatı"
 international_brigades:0 "International Brigades"
 international_brigades_desc:0 "We openly invite all communists to our country. Communists can come to our country and fight with us against the dirty capitalist order. Long Live Communism!"
 repair_focus:0 "Repair Focus"
 repair_focus_desc:0 "Our country's infrastructure, Industria, went bankrupt due to the Civil War. We invite our workers to mobilize to fix this bankruptcy and repair our country from behind."
 closed_bosporus:0 "Bosporus Closed"
 russian_bases:0 "Russian Bases"
 support_russia:0 "Supported Russia"
 liberal_socialism:0 "Liberal Socialism"
 liberal_socialism_desc:0 "Communist thought in Russia collapsed because it was open and authoritarian. A socialist order that can think clearly can keep Turkey afloat in unity without collapse."
 tur_historical_confidence_1:0 "Turkish Historical Confidence"
 tur_historical_confidence_1_desc:0 "The Turks have produced important intelligent people in their history. The Turks established a throne in Central Asia and Europe with conquests. And when they were defeated in such a battle, they unite and fought hard. Turks are proud of their history and ancestry. Therefore, the sense of nationalism is widespread and dominant in Turkey."
 factory_law:0 "Factory Law"
 factory_law_desc:0 "The gases produced by factories are damaging our world. This has to be stopped! We have started legal action for this."
 TKP_wins_the_congress:0 "TKP Wins The Congress"
 ODP_wins_the_congress:0 "ÖDP Wins The Congress"
 EMEP_wins_the_congress:0 "EMEP Wins The Congress"
 PERINCEK_wins_the_congress:0 "Perinçek Wins The Congress"
 bozkurtlar:0 "Bozkurtlar"
 bozkurtlar_desc:0 "The Grey Wolves adhere to an extreme form of Turkish nationalism. It has been characterized as neo-fascist by scholars, mainstream media, and left-wing sources. The organization's ideology emphasizes the early history of the Turkic states in Central Asia and blends it with Islam. Synthesis of Turkish identity and Islam is widely prevalent in their rhetoric and activities. One of their mottos is "Your doctor will be a Turk and your medicine will be Islam." Other sources have described it as secular."
 quarries_1:0 "Ulkist Quarries"
 quarries_1_desc:0 "The main goal of nationalist quarries is to create nationalist ideal people for our country. The people produced by the nationalist quarries sacrifice their lives for their country and work for their country."
 quarries_2:0 "Ulkist Quarries"
 quarries_2_desc:0 "The main goal of nationalist quarries is to create nationalist ideal people for our country. The people produced by the nationalist quarries sacrifice their lives for their country and work for their country."
 nation_in_chaos:0 "Kemalist Officers Protest"
 nation_in_chaos_desc:0 "Kemalists reject and protest the new order we have established. These protests are unfounded and will be suppressed."
 islamization_of_the_army:0 "Islamization Of The Army"
 islamization_of_the_army_desc:0 "For our army to be strong, it must be Islamized. Secularism has broken the structure of the army. No matter what they say, we will Islamize the army."
 secular_parties_protest:0 "Kemalist Parties Protest"
 secular_parties_protest_desc:0 "Kemalist parties did not like the new order we had established, as we expected. We have to force them into this new order. Or this country could see a civil war."
 jihadist_state:0 "Muhammed's Divisions"
 jihadist_state_desc:0 "Our army is the soldiers of Muhammad. We will spread Islam to the end with our army. Long Live Islam!"
 anti_arabic_campaign:0 "Party Inside Nationalist Opposition Against Arabs"
 anti_arabic_campaign_desc:0 "The nationalist Turkish people's view of the Arabs is very bad. They're very uncomfortable with us improving our relations with the Arabs. That's why they started opposing movements within our party."
 moderate_sharia_state:0 "Moderate Sharia State"
 moderate_sharia_state_desc:0 "Thank God we are now ruled by Islam. By going in the way of Allah, we will rise above our country. We will not be like Arabs who want to destroy Islam. Long Live Turkishness and Islam!"
 three_crescent:0 "Three Crescent"
 controlled_juidacary:0 "Controlled Juidacary"
 controlled_juidacary_desc:0 "An independent judiciary can release terrorists, so we connect the judiciary to our state by taking a hand in the situation. Thanks to this, we will be able to quickly capture any terrorist and easily close down a party that helps terrorism."
 legacy_of_turkes:0 "Legacy Of Alparslan Türkeş"
 legacy_of_turkes_desc:0 "We're following in the footsteps of Alparslan Türkeş. We did what he said, and we built an authoritarian country, and we did not give up our nationalism and Turkism."
 islamist_barracks:0 "Jihadist Barracks"
 islamist_barracks_desc:0 "We train our jihadist youth and send them to jihad. Islam must spread!"
 turkish_dictatorship:0 "Wolf Dictatorship"
 turkish_dictatorship_desc:0 "Elections and the functioning of parties are no different from dividing the country, we have declared Our dictatorship to end this separatist movement. With the Wolf dictatorship, Turkey will undoubtedly be an unshakable whole."
 general_purges:0 "Purges On The Anti-Nationalists"
 general_purges_desc:0 "Without nationalism, there is no country, so we have to arrest those who are not nationalists. Nationalism is the most important consideration for us."
 collected_powers:0 "Collected Powers"
 collected_powers_desc:0 "The legislature, the executive, the judiciary are all in one man's hands."
 legacy_of_the_1980:0 "Legacy Of 1980"
 legacy_of_the_1980_desc:0 "We can't forget the events we experienced in 1980. Fighting between leftists and rightists left thousands dead, and as a result, the Turkish Armed Forces took control of everything with tanks, cannons, and rifles, and Kenan Evren led the country. With the arrival of Kenan Evren, right-wingers and left-wingers were caught on the ball. There have been a lot of executions. We can't forget these memories. Communists must be crushed where they are seen so that these things do not happen from behind."
 tur_historical_confidence_2:0 "Turkish Historical Confidence"
 tur_historical_confidence_2_desc:0 "The Turks have produced important intelligent people in their history. The Turks established a throne in Central Asia and Europe with conquests. And when they were defeated in such a battle, they unite and fought hard. Turks are proud of their history and ancestry. Therefore, the sense of nationalism is widespread and dominant in Turkey.""
 ataturk_nationalism:0 "Ataturk Nationalism"
 sun_language_theory:0 "Sun Language Theory"
 sun_language_theory_desc:0 "The Sun Language Theory was a Turkish nationalist linguistic pseudoscientific hypothesis developed in Turkey in the 1930s that proposed that all human languages are descendants of one proto-Turkic primal language. The theory proposed that because this primal language had close phonemic resemblances to Turkish, all other languages can essentially be traced back to Turkic roots. According to the theory, the Central Asian worshippers, who wanted to salute the omnipotence of the sun and its life-giving qualities, had done so by transforming their meaningless blabbering into a coherent set of ritual utterings, and language was born, hence the name."
 secular_schools:0 "Secular Schools"
 secular_schools_desc:0 "Secular schools dominate the country. Organizations like TED run these secular schools well."
 peace_coop:0 "Kemalist Neutrality"
 peace_coop_desc:0 "As Atatürk said, Our country will not restrict the freedoms of other countries by following a peaceful policy. With this policy followed by Atatürk, we can stabilize and make our country happy."
 assimalition_policy:0 "Assimilation Policy"
 assimalition_policy_desc:0 "By assimilating the Kurds, we can solve the problem in the East. We don't need to assign our countrymen for this."
 cold_war_with_kurds:0 "Cold War With The Kurds"
 cold_war_with_kurds_desc:0 "By going into psychological war with the Kurds, we will nationalize the eastern region."
 turkishness_principal:0 "Turkishness Principal"
 united_wolfs:0 "United Wolfs"
 united_wolfs_desc:0 "Now that the Wolves are united, no one can resist us anymore. And we will hunt anyone who opposes it in the form of a pack of wolves!"
 turkic_populism:0 "Turkic Populism"
 turkic_populism_desc:0 "We will make populist moves for Turkish unity. With these populist movements, we will bring the unity of Turkishness to the heights."
 TUR_turkic_unification:0 "Turkic Union has been proclaimed."
 purge_the_kemalistz:0 "Military Purges"
 purge_the_kemalistz_desc:0 "We have taken action to purge these coup soldiers from our army. We've made a lot of arrests in our army. These arrests will make our army weak, of course, but in the end, we will get rid of it."
 kemalists_in_exile:0 "Kemalists In Exile"
 kemalists_in_exile_desc:0 "Kemalists imposed Western traditions on us, but our people shouted No to Westernism. The fact that Westernism was not welcomed by the public and the Kemalists attempted a failed coup led us to send them into exile."
 mosque_industry:0 "Mosque Industry"
 mosque_industry_desc:0 "Mosque construction is an architectural art. We will build beautiful mosques by pushing our industry and people to build mosques. These mosques will be a reward for us and provide peace economically."
 banner_of_islam:0 "Banner Of National Opinionism"
 banner_of_islam_desc:0 "The flag of Islam has passed into bad hands, fortunately, now the flag of Islam has been saved. Turkey will strengthen the flag of Islam by living a true Islam and making conquests."
 madrassas:0 "Islamic Madrasas"
 madrassas_desc:0 "We have opened the madrasas closed by Atatürk from behind. These madrasas will teach us the way of Islam and innovation."
 volunteer_reserve:0 "Volunteer Force"
 volunteer_reserve_desc:0 "Because our country is at strong levels, it can now interfere or interfere in the internal affairs of some countries. That's why we're creating a voluntary intervention group. This group will take down the enemies of our country with intervention."
 volunteer_reserve_armed_well:0 "Intervention Forces"
 volunteer_reserve_armed_well_desc:0 "Because our country is at strong levels, it can now interfere or interfere in the internal affairs of some countries. That's why we're creating a voluntary intervention group. This group will take down the enemies of our country with intervention."
 construction_plan:0 "Erbakan's Heavy Industry Plan"
 construction_plan_desc:0 "Erbakan very much wants our country to develop in heavy industry and has set up plans for this. We will industrialize our country by applying Erbakan's factory establishment policies. An industrialized Turkey will not leave any enemies."
 policy_of_rework:0 "Policy Of Work"
 policy_of_rework_desc:0 "If our workers don't get paid, if they don't get a raise, why would they work? That's why we encourage our workers to work by giving them money and raises. A dynamic group of hardworking workers will take us to advanced levels."
 work_for_better_conditions:0 "Working For Better Conditions"
 work_for_better_conditions_desc:0 "No matter how hard our workers worked, they got the same money. Now they will work harder if they know they will make better money if they work harder."
 nato_islam_power:0 "NATO Islam Power"
 nato_islam_power_desc:0 "In Erbakan's words, we are a NATO-Islamic Force. Of course, we will protect our allies in Europe, just as we will protect Muslims in the Middle East."
 crushing_pro_nato_organizations:0 "Crushing NATO Organizations"
 crushing_pro_nato_organizations_desc:0 "It's time to crush the counter-guerrillas organized with NATO funding in our country. Crushing the counter-guerrillas will increase National Peace. We will not allow us to be run by an organization."
 d-9_forces:0 "D-8 Special Units"
 d-9_forces_desc:0 "With the D-8 Economic Union now becoming an official alliance, the D-8 Special Command Association was formed. The purpose of this D-8 Command Unit is to protect the D-8 by training special forces. D-8 Command has units in Pakistan, Iran, and Turkey."
 d-9_forces_2:0 "D-8 Special Units"
 d-9_forces_2_desc:0 "With the D-8 Economic Union now becoming an official alliance, the D-8 Special Command Association was formed. The purpose of this D-8 Command Unit is to protect the D-8 by training special forces. D-8 Command has units in Pakistan, Iran, and Turkey."
 d-9_forces_3:0 "D-8 Special Units"
 d-9_forces_3_desc:0 "With the D-8 Economic Union now becoming an official alliance, the D-8 Special Command Association was formed. The purpose of this D-8 Command Unit is to protect the D-8 by training special forces. D-8 Command has units in Pakistan, Iran, and Turkey."
 afghan_immigration:0 "Afghan Immigrationism"
 afghan_immigration_desc:0 "As a result of the Taliban's victory in the war in Afghanistan, Afghans began to arrive illegally in Turkey, passing through Iran. After the Syrians came and damaged the Turkish economy, the arrival of Afghans destroyed Turkish power. Irritated by the arrival of Afghans in the country, the nationalists stopped voting for the government and began to become the opposition. The EU's position on this issue has also led to increased opposition from secularists."
 outsides_problem_kurds:0 "Support Of The PKK In The Outside World"
 outsides_problem_kurds_desc:0 "Some foreign countries sympathize with the PKK. This sympathy gives the PKK a political presence. This forces the fight against terrorism. We have to break down that sympathy, so we have to use some media tools."
 outsides_problem_kurds_2:0 "Support Of The PKK In The Outside World"
 outsides_problem_kurds_2_desc:0 "Some foreign countries sympathize with the PKK. This sympathy gives the PKK a political presence. This forces the fight against terrorism. We have to break down that sympathy, so we have to use some media tools."
 outsides_problem_kurds_3:0 "Support Of The PKK In The Outside World"
 outsides_problem_kurds_3_desc:0 "Some foreign countries sympathize with the PKK. This sympathy gives the PKK a political presence. This forces the fight against terrorism. We have to break down that sympathy, so we have to use some media tools."
 outsides_problem_kurds_4:0 "Support Of The PKK In The Outside World"
 outsides_problem_kurds_4_desc:0 "Some foreign countries sympathize with the PKK. This sympathy gives the PKK a political presence. This forces the fight against terrorism. We have to break down that sympathy, so we have to use some media tools."
 outsides_problem_kurds_5:0 "Support Of The PKK In The Outside World"
 outsides_problem_kurds_5_desc:0 "Some foreign countries sympathize with the PKK. This sympathy gives the PKK a political presence. This forces the fight against terrorism. We have to break down that sympathy, so we have to use some media tools."
 f-35_plan:0 "F-35 Aircraft Construction Member"
 f-35_plan_desc:0 "Participants in the program included Turkey, as well as the United States, the United Kingdom, Italy, the Netherlands, Australia, Denmark, Canada, and Norway. The goal of these countries is to get a powerful aircraft which is in a high generation."
 turkish_drone_sector:0 "Turkish Drone Sector"
 turkish_drone_sector_desc:0 "Turkey is a high-level country in drone production and drone technologies. All this happened thanks to the Turkish Drone industry. By continuing to fund the Turkish Drone sector as a country, we can scare other countries by producing more modern and more powerful drones."
 turkish_armed_dictatorship:0 "Turkish Military Dictatorship"
 turkish_armed_dictatorship_desc:0 "The Turkish Armed Forces have changed a lot with the recent coup and no longer want to leave politics. The Turkish Armed Forces will now make the country strong by declaring its military dictatorship in the country, and the country will never fall into the hands of the low!"
 end_of_the_turkish_democracy:0 "End Of The Turkish Democratic System"
 end_of_the_turkish_democracy_desc:0 "Turkish democracy has failed. Because of this failure, Turkish democracy was destroyed by the unit within the Turkish Armed Forces. With the destruction of Turkish democracy, the country will develop faster because people are not working with democracy, they are fighting each other."
 controlled_press:0 "Controlled Press"
 controlled_press_desc:0 "The press is now under our control, we will never allow the press to oppose us. If the Press does not oppose us, we can bring our country's level of stability to good places."
 stabilization_of_TUR_act:0 "National Stabilization Act"
 stabilization_of_TUR_act_desc:0 "We have begun an operation to ensure national stability. With this operation, we will bring our country to stable levels. Long live the stabilizing Republic of Turkey!"
 non_european:0 "Embracing Turkish Values"
 non_european_desc:0 "The things imposed by the European Union are contrary to the Turkish people. Therefore, our army will reject what the European Union has imposed and keep our Turkish traditions alive. The survival of Turkish traditions will add strength to Turkey."
 secular_forces:0 "Fully Secularized Forces"
 secular_forces_desc:0 "After the new coup, we will create a secular army by throwing out the non-secular from the army and not taking it into the army, and by keeping the secular one in the army for a long time."
 rejecting_immigrationism:0 "Rejecting Immigrationism"
 rejecting_immigrationism_desc:0 "Accepting refugees is an insult to Turkishness. That is why we will not accept refugees into our country. Turkey Without Refugees Is Prosperity Turkey!"
 power_of_turkish_blood:0 "Power Of The Turkish Blood"
 power_of_turkish_blood_desc:0 "Being of the Turkish race is a special case. Being of the Turkish race gives strength. There is nothing the Turks cannot do with this power."
 civilian_economic_program:0 "Civilian Economic Program"
 civilian_economic_program_desc:0 "The Civil industry of our country is not in a good place, so we will develop our country by indexing a civil economic and industrial program to our country."
 controlled_sendikalar:0 "Unions Under The Power Of The State"
 controlled_sendikalar_desc:0 "We will end the independent unions in our country and connect the unions to ourselves. In this way, the unions will not deviate from the official ideology and thus stability will be ensured."
 workers_administration_2:0 "Expanded Workers Law"
 populist_principals:0 "Populist Principals"
 populist_principals_desc:0 "Our country will now experience populism in line with populist principles. Populist principles, on the other hand, are fully in line with the Turkish nation."
 TUR_economic_power_house:0 "Turkish Economic Power House"
 TUR_economic_power_house_desc:0 "The Turkish economy has left behind the period when it was bad. Now the Turkish economy is a stable force that does not fall."
 supporting_employers:0 "Supporting Employers"
 supporting_employers_desc:0 "By supporting the employers, we will reduce the unemployment rate by increasing the job rate in our country."
 anti_arabic_state:0 "Anger Of The 1917"
 anti_arabic_state_desc:0 "We have not forgotten the events of 1917. We are ready to go on an expedition to avenge the events that took place in 1917."
 guardians_of_the_balkans:0 "Guardian Of The Balkans"
 guardians_of_the_balkans_desc:0 "The leader of the Balkan pact was formerly Romania, which was also subjected to German and Soviet invasions and lost the leadership of the Balkan pact, and then the Balkan pact was destroyed by external forces. Today, we need to resurrect this destroyed pact. By protecting the Balkans, we will prevent the threat in advance and ensure Balkan stability. The guardian of the Balkans is on guard!"
 asia_minors_power:0 "White Prince"
 asia_minors_power_desc:0 "Tensions decimate between Saudi Arabia and Iran in the Middle East. Turkey is in the Middle East. In the case of the player, Turkey, which is in this player position, is called the white prince in the Middle East. Whichever way the White prince heads wins. That side will be the Iranian side!"
 restoring_the_hope:0 "Restoring The Hope!"
 restoring_the_hope_desc:0 "The United States has carried out coups and military interventions for the good of the Turkish Republic. As a result of all these interventions, democracy was passed. It was a very wrong move. By no longer giving our country a senile democracy, we will forever sword military intervention. With endless military intervention, we will be able to realize the vision that the United States thinks for our country and region. With this vision, we will be able to realize the Great Middle East Plan of the United States in the Middle East. As we set out to carry out this plan, we will receive both military and financial support from the United States, so that the country will not have an economic shortage. If we are on the side of the United States, we will be strong, if we are against it, we will disappear, just like the Soviet Union. Long live the United States and the Republic of Turkey, where Atatürk was the founder!"
 redzyned_6_arrows:0 "Redzyned Six Arrows"
 redzyned_6_arrows_desc:0 "We have designed Atatürk's six arrows from behind. With this arrangement, Atatürk's six arrows match our party program. This is an installation that will provide local stability."
 NATO_officers:0 "Pro-NATO Officers In Charge"
 NATO_officers_desc:0 "NATO commanders within our military have seized power through a second coup. NATO commanders among us are not very democracy-loving types, most likely, NATO commanders will make our country a regime forced to the west."
 general_staff_under_1:0 "Turkish General Staff"
 general_staff_under_1_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Hüseyin Kıvrıkoğlu§!"
 general_staff_under_2:0 "Turkish General Staff"
 general_staff_under_2_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Hilmi Özkök§!"
 general_staff_under_3:0 "Turkish General Staff"
 general_staff_under_3_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Yaşar Büyükanıt§!"
 general_staff_under_4:0 "Turkish General Staff"
 general_staff_under_4_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is İlker Başbuğ§!"
 general_staff_under_5:0 "Turkish General Staff"
 general_staff_under_5_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Işık Koşaner§!"
 general_staff_under_6:0 "Turkish General Staff"
 general_staff_under_6_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Necdet Özel§!"
 general_staff_under_7:0 "Turkish General Staff"
 general_staff_under_7_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Hulusi Akar§!"
 general_staff_under_8:0 "Turkish General Staff"
 general_staff_under_8_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Yaşar Güler§!"
 general_staff_under_9:0 "Turkish General Staff"
 general_staff_under_9_desc:0 "The general staff is the highest-ranking organization established to command the Armed Forces.\nThe general staff consists of a group of officers who assist the commanders of the division and higher military units in creating and disseminating policies in the army, transferring orders and overseeing work.\nIt is normally organized along functional lines with management, intelligence, operations, training, logistics, and other branches.\n\n§YLeader Of The General Staff Is Metin Gürak§!"
 turkish_NCY_officers:0 "Turkish NCY Officers"
 turkish_NCY_officers_desc:0 "Turkish military units have been in existence here since the ceasefire in Cyprus. These Turkish military forces weaken our political power and completely bind us to Turkey. We must produce our army and send Turkish soldiers home."
 turkish_war_for_confidence:0 "War For Confidence Policy"
 turkish_war_for_confidence_desc:0 "We are ready to fight for our honor anywhere. We accept a policy that can overthrow countries that can damage our dignity."
 ecevits_bird:0 "Evevit's White Bird"
 ecevits_bird_desc:0 "Ecevit's bird flies in the skies. This bird is the power of peace, Turkish power, and Turkish social democracy. With this power, we will defeat all of our enemies one by one."
 democratic_cooperatives_of_industry_1:0 "Democratic Cooperatives Of Industry" 
 democratic_cooperatives_of_industry_1_desc:0 "The purpose of Democratic Industrial Cooperatives is to please our workers. Since our state could not please our workers, we transferred the events related to the workers to the Democratic Industrial Cooperatives. Democratic Industrial Cooperatives will open new factories that will take care of workers and will ensure the economic strengthening of our country.\n\n§YDemocratic Cooperatives Of Industry's Power: §RLow Powerized§!"
 democratic_cooperatives_of_industry_2:0 "Democratic Cooperatives Of Industry" 
 democratic_cooperatives_of_industry_2_desc:0 "The purpose of Democratic Industrial Cooperatives is to please our workers. Since our state could not please our workers, we transferred the events related to the workers to the Democratic Industrial Cooperatives. Democratic Industrial Cooperatives will open new factories that will take care of workers and will ensure the economic strengthening of our country.\n\n§YDemocratic Cooperatives Of Industry's Power: §YMedium Powerized§!"
 democratic_cooperatives_of_industry_3:0 "Democratic Cooperatives Of Industry" 
 democratic_cooperatives_of_industry_3_desc:0 "The purpose of Democratic Industrial Cooperatives is to please our workers. Since our state could not please our workers, we transferred the events related to the workers to the Democratic Industrial Cooperatives. Democratic Industrial Cooperatives will open new factories that will take care of workers and will ensure the economic strengthening of our country.\n\n§YDemocratic Cooperatives Of Industry's Power: §GOver Powerized§!"
 agricultural_act:0 "Agricultural Power" 
 agricultural_act_desc:0 "It is possible to develop an agricultural industry in Turkey. It is also possible to develop the industry in Turkey. To improve these two, we press the button. First, we will develop the agricultural industry and open factories with the profits from the agricultural industry, and these factories will make a profit by operating raw materials and selling them outside the country.\n\n§YStatus Of Agricultural Act: §GWell§!\n§YStatus Of Industrial Act: §RNot Good§!"
 agricultural_act_2:0 "Agricultural-Industry Power"
 agricultural_act_2_desc:0 "It is possible to develop an agricultural industry in Turkey. It is also possible to develop the industry in Turkey. To improve these two, we press the button. First, we will develop the agricultural industry and open factories with the profits from the agricultural industry, and these factories will make a profit by operating raw materials and selling them outside the country.\n\n§YStatus Of Agricultural Act: §GVery Nice§!\n§YStatus Of Industrial Act: §YNormal§!"
 agricultural_act_3:0 "Agricultural-Industry Powerfield" 
 agricultural_act_3_desc:0 "It is possible to develop an agricultural industry in Turkey. It is also possible to develop the industry in Turkey. To improve these two, we press the button. First, we will develop the agricultural industry and open factories with the profits from the agricultural industry, and these factories will make a profit by operating raw materials and selling them outside the country.\n\n§YStatus Of Agricultural Act: §GVery Nice§!\n§YStatus Of Industrial Act: §GVery Nice§!"
 beauty_of_kyk:0 "Remastered KYK Dormitories" 
 beauty_of_kyk_desc:0 "We will open KYK dormitories to the service by configuring them. Our people will be pleased with this and will work to graduate from his university."
 summer_and_night_working_schools:0 "Summer-Night Working Universities" 
 summer_and_night_working_schools_desc:0 "We will increase the capacity of our universities by running universities morning and evening. With this capacity increase, we will get more university graduates, and we will have achieved them without building a university."
 unsickness_in_the_universities:0 "Special Climas In Universities" 
 cyprus_intervention_legacy:0 "Legacy Of Cyprus Intervention"
 cyprus_intervention_legacy_desc:0 "We will remember that there is no force that can stop us from saving Cyprus and that they cannot intimidate us with diplomatic embargoes and diplomatic maneuvers. Together with this recall, we will be able to achieve what we want."
 turkish_war_culture:0 "Turkish War Culture" 
 turkish_war_culture_desc:0 "The Turks were very good at fighting when they were in Central Asia in nomadic life. With the sedentary life and rapid modernization, this feature began to lose its power. It's time to refresh and revitalize these features."
 4_year_dockyard_plan:0 "Four-Year Turkish Naval Program"
 4_year_dockyard_plan_desc:0 "We have put into effect the naval structuring to activate our Blue Homeland project. With the development of a large navy, the countries around us will be afraid of us."
 anti_italian_state:0 "Anti Italian Force"
 anti_italian_state_desc:0 "We set out to find a powerful tactic against the military equipment and tactics of Italy. Thanks to this way, Italy will not be able to do anything against us."
 resist_against_nato_supremacy:0 "Resisting Against NATO Supremacy!"
 resist_against_nato_supremacy_desc:0 "NATO's tanks and aircraft may have superior firepower, but we can provide resistance against NATO. Together with this resistance, we can destroy the so-called invincible NATO. Long live the Turkish Resistance!"
 turkish_society_first:0 "Türk Milleti Önceliğimiz"
 turkish_society_first_desc:0 "The Turkish Nation has the strength to overcome everything. That has been proved in the War of Independence. With this power that comes from our blood, we will destroy every enemy that tries to destroy us."
 turkish_interventionism:0 "Turkish Interventionism"
 turkish_interventionism_desc:0 "As Turks, we will intervene in the events taking place around us by not closing our eyes to the events taking place around us. With this intervention, we can make a good profit in foreign politics."
 german_turkish_visits:0 "German-Turkish Visits"
 german_turkish_visits_desc:0 "We are preparing agreements and visits between Germany and Turkey and are engaged in a diplomatic initiative that will affect the two countries decently."
 wolkswagen_technicans_tur:0 "Turkish Technicians Sent To Volkswagen"
 wolkswagen_technicans_tur_desc:0 "We are sending engineers to the Volkswagen factories in Germany to inspect the German Brand Volkswagen. As a result of this review, we can bring the technology in our country to good places."
 wolkswagen_technicans_ger:0 "Received Turkish Technicians"
 wolkswagen_technicans_ger_desc:0 "Technicians came to our country from Turkey. The purpose of these technicians is to advance the technology in their own country. We can contribute to the economy of our country by taking money from these technicians."
 received_acedicians_ger:0 "Received Turkish Academicians"
 received_acedicians_ger_desc:0 "Academicians come to our country from Turkey, we can strengthen our country by obtaining the documents and money of these academicians."
 given_academicians_ger:0 "Send ed Academicians To Germany"
 given_academicians_ger_desc:0 "We are sending our Turkish academicians to Germany to develop. Our academicians who are developing in Germany will give us strength academically and technologically."
 american_turkish_visits:0 "American-Turkish Visits"
 american_turkish_visits_desc:0 "We are preparing agreements and visits between the United States and Turkey and are engaged in a diplomatic initiative that will affect the two countries decently."
 ford_technicans_tur:0 "Turkish Technicians Sended To Ford"
 ford_technicans_tur_desc:0 "We are sending engineers to the Ford factories in the United States to inspect the United States' Brand Ford. As a result of this review, we can bring the technology in our country to good places."
 ford_technicans_usa:0 "Received Turkish Technicians"
 ford_technicans_usa_desc:0 "Technicians came to our country from Turkey. The purpose of these technicians is to advance the technology in their own country. We can contribute to the economy of our country by taking money from these technicians."
 received_acedicians_usa:0 "Received Turkish Academicians"
 received_acedicians_usa_desc:0 "Academicians come to our country from Turkey, we can strengthen our country by obtaining the documents and money of these academicians."
 given_academicians_usa:0 "Sended Academicians To America"
 given_academicians_usa_desc:0 "We are sending our United States academicians to the United States to develop. Our academicians who are developing in the United States will give us strength academically and technologically."
 huge_police_stations:0 "Modernized Police Stations" 
 huge_police_stations_desc:0 "We have modernized the police stations with new decrees. With this modernization, anarchist and terrorist activities in the region will be minimized."
 ziraat_pritavized:0 "Privatized Ziraat Bank"
 ziraat_pritavized_desc:0 "We have provided free market power to banks by privatizing Ziraat Bank. With the privatization of Ziraat Bank, it will come to a good place in the market and make investments in our country."
 cultural_museums:0 "Modern Museums"
 cultural_museums_desc:0 "We will make our people both happy and cultured by opening modern museums around our country."
 modern_schools:0 "Modernized Schools"
 modern_schools_desc:0 "We are modernizing our schools because our schools are not at European Standards. With this modernization movement, our schools will have a technological capacity and will become stronger."
 dicipline_in_school:0 "Discipline First In School"
 dicipline_in_school_desc:0 "Discipline at school is very important. If there is no discipline at school, there will be no employees, and the school will be full of sloths. In this case, it destroys the innovation power of our country. That is why we have issued decrees to expand disciplines in schools."
 modern_hospitals:0 "Modernized Hospitals" 
 modern_hospitals_desc:0 "Our hospitals are having a big problem with their technological equipment. We will solve this problem by modernizing our hospitals. With the end of this trouble, the problems of our people will be resolved more systematically and quickly."
 hospitals_to_munitiplacy:0 "Munitiplacy Controlled Hospitals"
 hospitals_to_munitiplacy_desc:0 "We are saving the State from the work crowd by connecting hospitals to the Municipality. In addition, connecting hospitals to the municipality will allow the system to be implemented by region."
 supports_to_the_disableds:0 "Recovering Disableds"
 supports_to_the_disableds_desc:0 "We will recover our disabled citizens by using newly invented developing technologies."
 trial_clashings:0 "DSP And CHP's Trials"
 trial_clashings_desc:0 "There are trials between the CHP and the DSP. As these cases continue, the extent of political turmoil and electoral violence in our country will increase. These cases should be finished as quickly as possible for a new stabilized political situation."
 israeli_turkish_trade:0 "Israeli Turkish Technology Trade"
 israeli_turkish_trade_desc:0 "Agreements between Turkey and Israel benefit us. As of now, these deals have gained new content and turned to technology trading. This agreement with Israel will work to bring our technology to advanced levels."
 war_against_countergueralla:0 "War Against Counter-Guerrillas"  
 war_against_countergueralla_desc:0 "We will destroy the organization called "Counter-Guerrilla" organized by NATO in our country wherever we see it. Also, we will provoke this organization on the right by not allowing the Counter-Guerrilla organization to provoke the right."
 united_left_against_USA:0 "United Left Against USA"
 united_left_against_USA_desc:0 "We will organize the left in our country against the terrible imperialism of the United States of America, and we will not allow American Imperialism to enter our land by integrating the left and uniting the revolutionaries under one banner."
 powerized_neutral_state:0 "Powerized Neutral State"  
 powerized_neutral_state_desc:0 "We will show that we are committed only to our people by emphasizing neutrality in our country. By starting to pursue a neutral policy, we will remove our past mistakes and follow in the footsteps of Atatürk. So the whole world will see that we are a strong country."
 working_sgk:0 "Working SGK"
 working_sgk_desc:0 "The Social Security Institution is the governing authority of the Turkish social security system. It was established by the Social Security Institution Law No:5502, which was published in the Official Gazette No: 26173 on June 20, 2006. This brought five different retirement systems that affected civil servants, contractual paid workers, agricultural paid workers, and self-employed workers into a single retirement system offering equal actuarial rights and obligations."
 free_media_sponsored_state:0 "Protected Free Media"
 free_media_sponsored_state_desc:0 "It is necessary to have independent media. Without the media, our people cannot be happy and dissident voices cannot arise, and as a result, we become authoritarian and do wrong by making our people unhappy. That is why we will protect the media forever to prevent this."
 weakened_centralist_regime:0 "Weakened Centralist Regime"
 working_municipilites:0 "Working Municipalities.."
 working_municipilites_desc:0 "So far, the centralist regimes have not been of any use. It's time to disarm this system that has no use. Our people will now be slightly affected by the iron fist."
 redzyned_local_rules:0 "Redzyned Local Rules"
 redzyned_local_rules_desc:0 "When a rule is accepted all over the country, a certain discipline can be obtained, but the regions are not satisfied with this situation. It is more important to remove the dissatisfaction of the regions than discipline, that is why we create unique rules for the regions."
 local_religions_freedom:0 "Freedom For Local Religious Leaders"
 local_religions_freedom_desc:0 "Local religious leaders are very important to the local population. That's why they should be released no matter what the local leaders do. Everything is done for the happiness of our people."
 collected_economies_of_the_local_regions:0 "Collected The Economies Of The Local Regions"
 collected_economies_of_the_local_regions_desc:0 "We will integrate all local economies into each other. This indexing can destroy the peace of our people. But it will allow us to obtain development power economically."
 local_works:0 "Local Works"
 local_works_desc:0 "Local works should be supported. If a good income is obtained from local work, working capacity and diligence increase."
 local_banks:0 "Local Banks"
 local_banks_desc:0 "Local banks can identify local financial problems and make local investments, and thanks to this, local development can be achieved at a decent level."
 local_institutions:0 "Local Institutions"
 local_institutions_desc:0 "Local institutions are very good at identifying local problems and making the public happy."
 funded_science:0 "Funded Science"
 funded_science_desc:0 "It is worth pouring money into science because the benefits of science are too many to count. The idea of innovation should always remain afloat in the State of the Republic of Turkey."
 improved_exams:0 "Improved Exams"
 improved_exams_desc:0 "The exams are going strangely. By preventing this strange course, we will organize the exams from the beginning. With this arrangement, the course of the exams will be good."
 encouragment_instead_of_coercion:0 "Encouragement Instead Of Coercion"
 encouragment_instead_of_coercion_desc:0 "Instead of making people tired of studying, we will encourage people to study. Nothing gets right by force."
 believing_the_education_power:0 "Believing The Power Of Education"
 believing_the_education_power_desc:0 "Education will be most useful to us in raising our future generations. Without education, our people will not be able to take a step forward. That is why we will say that education is everything and attach importance to education."
 border_security_first:0 "Border Security"
 border_security_first_desc:0 "Boundaries are honor. We will ensure that not even a bird flies across the border by deploying Turkish military units to protect the borders. Terrorists will no longer be able to enter our country through the border."
 train_civilian_corps:0 "Civilian Protective Corps"
 train_civilian_corps_desc:0 "We will fight the PKK by creating civilian troops. Of course, civilian troops will not be as capable and powerful as the Turkish Armed Forces, but they will work to a large extent."
 train_civilian_corps_better:0 "Betterized Civilian Protective Corps"
 train_civilian_corps_better_desc:0 "We will fight the PKK by creating civilian troops. Of course, civilian troops will not be as capable and powerful as the Turkish Armed Forces, but they will work to a large extent."
 peace_state:0 "Peace State"
 peace_state_desc:0 "There is nothing beautiful that the war brings. War is a necessity. That is why we are making Turkey a country of peace. It will be better this way."
 mind_games:0 "Mind Games"
 mind_games_desc:0 "By creating mind games, we will destroy the plans of other countries and realize our plan. Playing mind games will make us a political force."
 mind_games_of_infulence:0 "Mind Games"
 mind_games_of_infulence_desc:0 "By creating mind games, we will destroy the plans of other countries and realize our plan. Playing mind games will make us a political force."
 mind_games_of_infulence_and_man:0 "Mind Games"
 mind_games_of_infulence_and_man_desc:0 "By creating mind games, we will destroy the plans of other countries and realize our plan. Playing mind games will make us a political force."
 maximixed_political_power_output:0 "Mind Games Of The New Era"
 maximixed_political_power_output_desc:0 "By creating mind games, we will destroy the plans of other countries and realize our plan. Playing mind games will make us a political force in that new imperialist era."
 immigration_buying:0 "Immigration Buying"
 immigration_buying_desc:0 "We can bring refugees who have studied in special places to our country by choosing them. We can use them for ourselves. Creating a brain drain in favor of our country brings our country to good places in innovation."
 immigration_law:0 "Immigration Law"
 immigration_law_desc:0 "It's time to pass a refugee law, no one will be able to enter this country so easily anymore. Except for the European and American people, of course."
 turkish_gateway_project_finished:0 "Turkish Gateway Project Fully Operational"
 turkish_gateway_project_finished_desc:0 "Turkish Gateway Project Project is now fully available. By completing this project, we have ensured that trade routes pass through us. The fact that trade routes will pass through us will allow us to earn a large amount of money and resources, and our growth rates will increase significantly."
 adaptable_economy:0 "Adaptable Economy"
 adaptable_economy_desc:0 "The Turkish economy has experienced very bad things, so the Turkish economy has become used to such things now. Now our economy needs to get used to getting out of such situations, as you know, the ANAP government will not allow economic downsizing."
 working_like_a_bee:0 "Working Like A Bee"
 working_like_a_bee_desc:0 "We will work like bees, not like ants. We will work hard and get to good places. Everything is for Turkey!"
 textile_industries:0 "Textile Industries"
 textile_industries_desc:0 "The textile industry is primarily concerned with the design, production, and distribution of yarn, cloth, and clothing. The raw material may be natural, or synthetic using products of the chemical industry."
 cotton_industries:0 "Cotton Industries"
 cotton_industries_desc:0 "Cotton is the world's most important natural fibre. In the year 2007, the global yield was 25 million tons from 35 million hectares cultivated in more than 50 countries. In Turkey, it's around 500 Million and we are here to increase it to advance the economy."
 new_created_automative_sector:0 "Turkish Automative Sector"
 new_created_automative_sector_desc:0 "The Turkish Automotive Industry comprises a wide range of companies and organizations involved in the design, development, manufacturing, marketing, and selling of motor vehicles. It is one of the world's largest industries by revenue. The automotive industry does not include industries dedicated to the maintenance of automobiles following delivery to the end-user."
 good_created_automative_sector:0 "Turkish Automative Sector"
 good_created_automative_sector_desc:0 "The Turkish Automotive Industry comprises a wide range of companies and organizations involved in the design, development, manufacturing, marketing, and selling of motor vehicles. It is one of the world's largest industries by revenue. The automotive industry does not include industries dedicated to the maintenance of automobiles following delivery to the end-user."
 fifth_generation_military_industries:0 "Fifth Generation Military Industries"
 fifth_generation_military_industries_desc:0 ""
 competetion_authority:0 "Turkish Competition Authority"
 competetion_authority_desc:0 "The Turkish Competition Authority is the Competition regulator in Turkey. It is a government organization in the Republic of Turkey that prevents any threats to the competitive process in the markets for goods and services through the use of the powers granted by law. Ensuring the fair allocation of resources and increasing social welfare by the protection of the competitive process constitutes the basic foundation of the mission of the Competition Authority."
 turksoy:0 "TURKSOY"
 turksoy_desc:0 "The International Organization of Turkic Culture is an international cultural organization of countries with Turkic populations, speaking languages belonging to the Turkic language family. Other than being an abbreviation of the former official name Joint Administration of Turkic Culture and Arts, Türksoy is also a compound noun in Turkish, made up of the words Turkic and ancestry."
 turkpa:0 "TURKPA"
 turkpa_desc:0 "The TURKPA in full, the Parliamentary Assembly of Turkic-Speaking Countries, is an international organization comprising some of the Turkic countries."
 unitary_speeches:0 "Unitary Turkic Speeches"
 unitary_speeches_desc:0 "Rallies uniting the Turks should take place. Along with these rallies, Turkishness will merge. Long live Turkishness!"
 turkic_media:0 "Turkic Media"
 turkic_media_desc:0 "All Turkish media are now uniting. This merger will create confusion and eventually cause the media to throw us into trouble. But with this merge, the ideals of Turkishness will become stronger."
 bureocratic_unification:0 "General Bureaucratic Unification"
 bureocratic_unification_desc:0 "The Turkish Bureaucracies are uniting under one roof. Bureaucratic unification will lead our country to serious political difficulties for a temporary period. When the bureaucratic merge is completed, the political axes will be replaced by domestic ones."
 turkic_business_council:0 "Turkic Business Council"
 turkic_business_council_desc:0 "The Turkish Business Council monitors the working forces and principles of the Turkish States and creates an economic program accordingly. This council is completely dependent on the Turkish States. It also has relations with the IMF."
 asian_economic_observer:0 "Economic Observer Of Asian Economics"
 asian_economic_observer_desc:0 "The Turkic Council is an observer in the Asian Market and Stock Exchange. Its presence in the observer position promotes faster information about economic activities in the Asian Market and Stock Exchange."
 gdp_program:0 "Mission Of GDP"
 gdp_program_desc:0 "The purpose of the GDP Mission of the Turkish Council is to achieve the rise of GDP in all Turkish countries. The Turkish Council provides financial support to countries with low GDP to increase GDP rates in low GDP countries too."
 low_debts_program:0 "Low Debts Program"
 low_debts_program_desc:0 "The purpose of the Debt Mission of the Turkish Council is to achieve a debt reduction in all Turkish countries and to ensure peace of mind and Turkic unification. In case of debt reduction, the Turkish Council provides financial support to countries with excessive debt." 
 turkic_resource_commision:0 "Turkic Resource Commission"
 turkic_resource_commision_desc:0 "The purpose of the Resource Commission of the Turkic Council is to extract resources in all Turkic countries.  In the extraction of resources, the Turkish Council provides financial support to countries that do not have the money to extract resources." 
 turkic_bankers_union:0 "Turkic Bankers Union"
 turkic_bankers_union_desc:0 "The purpose of the Turkish Council's Banking Union is to create a balance of inflation, exchange rate, and interest in all Turkish countries. To achieve this balance, the Turkish Council provides financial support to banks that cannot achieve a balance." 
 turkic_economic_movement:0 "United Turkic Economic Movement"
 turkic_economic_movement_desc:0 "Everyone is united in an economic sense. It is necessary to ensure economic development in all Turkish countries so that income injustice does not occur from region to region. If income injustice does not occur, the Turkish Union can be achieved more quickly." 
 turkic_ministry:0 "Turkic Ministry Directive"
 turkic_ministry_desc:0 "The establishment of new ministries is necessary for the Turkish Council. The establishment of ministries for the Turkish Council is now an indication that the establishment of this union is imminent." 
 turkic_armed_forces:0 "Turkic Defensive Armed Forces"
 turkic_armed_forces_desc:0 "The purpose of the Turkish Defense Army is to defend all Turkish countries to death. We have to protect the land of our ancestors. The Turkish heritage is safe!" 
 turkic_armed_forces_2:0 "Turkic Defensive Armed Forces"
 turkic_armed_forces_2_desc:0 "The purpose of the Turkish Defense Army is to defend all Turkish countries to death. We have to protect the land of our ancestors. The Turkish heritage is safe!" 
 turkic_blood:0 "Turkic Blood"
 turkic_blood_desc:0 "The Turkish soldier does not leave the area where he is located until he dies. The strength of Turkishness comes from nationalism and the love of the motherland. Let our enemies not even think about invading our territory." 
 contacting_old_traditions:0 "Contacting Old Traditions"
 contacting_old_traditions_desc:0 "We must declare our adherence to our ancient traditions for coming Turkic unification. Adherence to our ancient traditions will greatly increase Turkish unity, but it will cause absolute damage to our innovation power."
 war_spirit_of_turkic:0 "The Realm Of The War Spirit"
 war_spirit_of_turkic_desc:0 "We return to our old traditions of war. Every Turk should know how to fight. Moving from a nomadic society to a settled life should not make us lose ourselves."
 nationalistic_education_laws:0 "Nationalist Education Laws"
 nationalistic_education_laws_desc:0 "The Turkish education program depends on the nationalism of Turkishness. With this educational program, Absolute Turkish Nationalism and unity can be achieved."
 center_of_nomidaic_civizilations:0 "Center Of Nomidaic Civilizations"
 center_of_nomidaic_civizilations_desc:0 "The region where the Turks were founded is where nomadic societies were formed and passed through. It is necessary to study the nomadic communities passing through here. It is established in the study of these things."
 turkic_heritage_council:0 "Turkic Heritage Council"
 turkic_heritage_council_desc:0 "The objectives of the Foundation are to protect, study and promote the Turkic culture and heritage through support and funding activities, projects, and programs."
 turkic_expansionism:0 "Turkic Expansionism"
 turkic_expansionism_desc:0 "We are ready to fight for our honor anywhere. We accept a policy that can overthrow countries that can damage our dignity."
 tengri_sponsored_country:0 "Tengri Sponsored State"
 tengri_sponsored_country_desc:0 "This country adopts the tengri system and wants its people to belong to the Tengri religion."
 official_tengri_state:0 "Tengri Religion"
 official_tengri_state_desc:0 "Tengri was the national god of the Göktürks. The Göktürk khans based their power on a mandate from Tengri. These rulers were generally accepted as the sons of Tengri who represented him on Earth. They wore titles such as tengrikut, kutluġ, or kutalmysh, based on the belief that they attained the kut, the mighty spirit granted to these rulers by Tengri."
 leader_of_the_second_islamic_golden_age:0 "Leader Of The Second Islamic Golden Age"
 leader_of_the_second_islamic_golden_age_desc:0 "The Golden Age of the Second Islam is taking place. And we are leading this. Thanks to us, Islam began to gain unity and began to beat the Jewish games."
 united_chiefs_turkic:0 "Chiefs Of The State"
 power_is_prosper:0 "Power Is Prosper"
 power_is_prosper_desc:0 "We are in a country where the strong win and the weak lose. That is why everyone must become stronger by competing with each other so that we can prevail over other countries."
 coup_traditions:0 "Coup Traditions"
 coup_traditions_desc:0 "We are a country that has gained traditions of military intervention. This situation is an indication that there cannot be a democratic or monarchical movement in our country. This country is in the hands of the military."
 copenhagen_criterias:0 "Copenhagen Criterias"
 copenhagen_criterias_desc:0 "The Copenhagen criteria are the rules that define whether a country is eligible to join the European Union. The criteria require that a state has the institutions to preserve democratic governance and human rights, has a functioning market economy, and accepts the obligations and intent of the EU."
 yap_islet_devrets:0 "Yap, İşlet, Devret"
 yap_islet_devrets_desc:0 "Build–operate–transfer (BOT) is a form of project delivery method, usually for large-scale infrastructure projects, wherein a private entity receives a concession from the public sector (or the private sector on rare occasions) to finance, design, construct, own, and operate a facility stated in the concession contract. This enables the project proponent to recover its investment, operating, and maintenance expenses in the project. \n\n BOT is usually a model used in public-private partnerships. Due to the long-term nature of the arrangement, the fees are usually raised during the concession period. The rate of increase is often tied to a combination of internal and external variables, allowing the proponent to reach a satisfactory internal rate of return for its investment."
 tenmaks:0 "TENMAK"
 tenmaks_desc:0 "The Turkish Energy, Nuclear and Mining Research Institute (TENMAK) is a public institution under the Ministry of Energy and Natural Resources, headquartered in Ankara, Turkey."
 summer_tourism_attractions1:0 "Summer Tourism Attractions"
 summer_tourism_attractions1_desc:0 "In the Aegean and Mediterranean coasts, the duration of sunbathing, the air temperature, and the high temperature of the seawater causes the duration of entering the sea to be long. A large number of bays and bays contribute to the development of coastal tourism. It is on our shores that large hotels and resorts have been built."
 winter_tourism_attractions1:0 "Winter Tourism Attractions"
 winter_tourism_attractions1_desc:0 "To spread the tourism activities throughout the year, it has started to attach importance to winter tourism.  Uludag, Palandoken, Kartepe, Kartalkaya, Sarikamish, Erciyes, and Mount Davraz are important ski resorts in Turkey."
 tourism_power:0 "Extra Tourism Supports On Economy"
 tourism_power_desc:0 "Thanks to tourism, our country receives a significant degree of income. Turkey is very convenient for tourism due to its location. Our biggest goal is to develop the tourism sector and ensure the development of our country. Let the chimney-less Industry work."
 quantity_inspection:0 "Quantity Inspection"
 quantity_inspection_desc:0 "Quantity inspections are designed to help & protect your brand and your company's reputation by minimizing defective merchandise, customer complaints, non-compliant products, and late and short shipments."
 e_devlet:0 "E-Devlet"
 e_devlet_desc:0 "A Turkish website is a resource providing access to government services, with an information portal for foreigners. Users access e-Devlet via their ID number and password or with Identity Cards. In addition to passwords, mobile or digital signature login is available. Internet banking customers can access e-devlet from their banking provider." 
 reduced_ministers:0 "Reduced Ministers"
 reduced_ministers_desc:0 "Ministers are having too much money. It's almost a waste of money, so we have to reduce the number of ministries as we did."
 ssk_systematic:0 "SSK's Systematic Works"
 ssk_systematic_desc:0 "The largest social security organization in Turkey. It provides insurance and medical services to about 50% of the country's population." 
 bag_kur_system_perfected:0 "Bağ-Kur System Reworked"
 bag_kur_system_perfected_desc:0 "Bağ-Kur provides disability, old age, death, and health insurance assistance to its insured persons, which it covers, and provides wholesale payments and social assistance increases in exchange for funeral expenses."
 original_social_state:0 "Social State"
 original_social_state_desc:0 "The social state or welfare state is a form of government in which the state (or a well-established network of social institutions) protects and promotes the economic and social well-being of its citizens, based upon the principles of equal opportunity, equitable distribution of wealth, and public responsibility for citizens unable to avail themselves of the minimal provisions for a good life. Sociologist T. H. Marshall described the modern welfare state as a distinctive combination of democracy, welfare, and capitalism." 
 city_inside_law:0 "City Inside Law"
 city_inside_law_desc:0 "The purpose of city laws is to ensure city order. Ensuring this order is the cornerstone of raising a disciplined and hardworking society." 
 virtual_learning:0 "Virtual Learning"
 virtual_learning_desc:0 "A virtual learning environment (VLE) in educational technology is a web-based platform for the digital aspects of courses of study, usually within educational institutions. They present resources, activities, and interactions within a course structure and provide for the different stages of assessment."
 redzyne_the_syd:0 "Perfected SYD"
 redzyne_the_syd_desc:0 "SYD is a necessary structure for our security. We have put this structure into a security order and presented it to our people from behind. The safety of our people is our wish." 
 CHP_constitution_TUR_reel:0 "Social Essential Constitution"
 health_insurance:0 "Health Insurance"
 health_insurance_desc:0 "General health insurance refers to insurance that primarily ensures the protection of people's health, as well as financing expenses incurred if they encounter health risks. This country has good levels of health insurance."
 medicine_supervision:0 "Medicine Supervision"
 medicine_supervision_desc:0 "Medical supervision means regular coordination, direction, and inspection by a physician of an individual's exercise of delegation to deliver medical services when the individual is not licensed to administer medical services." 
 strike_law:0 "Strikes Law"
 strike_law_desc:0 "Workers can go on strike, but they have conditions. That's why we reviewed these conditions and presented a strike law with a new one. I hope this new one will make our workers and unions happy." 
 ILO_standarts:0 "ILO Standarts"
 ILO_standarts_desc:0 "International labor law is the body of rules spanning public and private international law which concern the rights and duties of employees, employers, trade unions and governments in regulating the workplace. The International Labour Organization and the World Trade Organization have been the main international bodies involved in reforming labor markets. The International Monetary Fund and the World Bank have indirectly driven changes in labor policy by demanding structural adjustment conditions for receiving loans or grants. Issues regarding Conflict of laws arise, determined by national courts when people work in more than one country, and supra-national bodies, particularly the law has a growing body of rules regarding labor rights of the European Union. Now we have fully enacted these laws, which are accepted in the world, in Turkey."
 stockers_hunt:0 "Stockers Hunt"
 stockers_hunt_desc:0 "We're busting traitors who are chasing stockpiling. Stockism is aimed directly at the economy of our country. We cannot ignore such attacks." 
 employer_and_employment_peace:0 "Employer And Employment Peace"
 employer_and_employment_peace_desc:0 "The employer and the employee must get along well. If they don't get along well, unemployment is rising, and bankruptcies are rising. For them to get along well with each other, we will intervene in the situation and give both sides a large amount of money. Long Live Peace And Financial Stability!" 
 inflation_defence:0 "Defend The Workers From Inflation"
 inflation_defence_desc:0 "We must save our workers from the developing inflation. In this context, we will increase the salary of our workers above inflation. It might put us in financial harm's way, but we'll put up with it."
 kemalist_education_system:0 "Kemalist Education System"
 kemalist_education_system_desc:0 "The vision of our schools should be to educate Kemalist children. With this educational model, Turkey can develop." 
 kemalist_education_system_2:0 "Kemalist-Nationalistic Education System"
 kemalist_education_system_2_desc:0 "The vision of our schools should be to educate Kemalist and nationalist children. With this educational model, Turkey can develop." 
 kemalist_institutions:0 "Kemalist Institutions"
 kemalist_institutions_desc:0 "The purpose of Kemalist thought institutions is to ensure the strengthening of our country under the concept of Kemalism." 
 a_language_of_science:0 "Language Of Science"
 a_language_of_science_desc:0 "As Ataturk said, our language should be the language of science. Under this vision of Atatürk, we are starting to transform our language into a language of science."
 general_culture_programs:0 "General Culture Programs"
 general_culture_programs_desc:0 "General cultural programs are very important for us to understand our national values." 
 mobilization_of_the_students:0 "Mobilization Of The Students"
 mobilization_of_the_students_desc:0 "It's time to call our students to mobilize on the path of knowledge. Together with this mobilization, our country will move to the forefront!" 
 school_scholarships:0 "School Scholarships"
 school_scholarships_desc:0 "A scholarship is an award of financial aid for a student to further their education at a private elementary or secondary school, or a private or public post-secondary college, university, or other academic institution. Scholarships are awarded based on various criteria, such as academic merit, diversity and inclusion, athletic skill, and financial need, among others (or some combination of these factors). Scholarship criteria usually reflect the values and goals of the donor or founder of the award" 
 foreign_language_supported_schools:0 "Foreign Language Supported Schools"
 vocational_education:0 "Vocational Education"
 vocational_education_desc:0 "Vocational education and training (VET) is a type of education which aims to provide the students with the knowledge and skills required to work successfully in the specified occupational branches." 
 TDK_progress:0 "TDK Progress..."
 TDK_progress_desc:0 "The Turkish Language Association (Turkish: Türk Dil Kurumu, TDK) is the regulatory body for the Turkish language, founded on 12 July 1932 by the initiative of Mustafa Kemal Atatürk and headquartered in Ankara, Turkey. The Institution acts as the official authority on the language, contributes to linguistic research on Turkish and other Turkic languages, and is charged with publishing the official dictionary of the language." 
 protection_of_secularism:0 "Protection Of Secularism/Laicism"
 protection_of_secularism_desc:0 "We are building a huge wall to protect secularism and secular laws. This wall should never be attempted to be destroyed because if this wall is destroyed, the reforms of Atatürk and the feelings of innovation in this country will die with the Kemalist Bureaucracy." 
 secular_front:0 "Secular Front"
 secular_front_desc:0 "The purpose of the secular front is to destroy radical Islamic activities in our country. If these radical Islamic activities are not crushed where they are seen, they will cause great damage to our secularism. So we're moving forward to prevent this."
 planted_secular:0 "Planted Secret Seculars"
 planted_secular_desc:0 "We have placed secular groups in some non-secular parties. The purpose of these groups is to harm the anti-secular staff of this party and collect legal material. Thanks to this, we can find evidence about non-secular parties and close them down." 
 alevi_cooperation:0 "Alevi Cooperation"
 alevi_cooperation_desc:0 "Alevis can understand the languages of secularists because Alevis have been attacked by Sunni Radicals for a long time. Our enemy is the same thing: "Radical Sunni Islamists". That is why we can agree with them and become united against this radicalism." 
 alevi_quarries:0 "Alevi Cooperation And Quarries"
 alevi_quarries_desc:0 "Alevis can understand the languages of secularists because Alevis have been attacked by Sunni Radicals for a long time. Our enemy is the same thing: "Radical Sunni Islamists". That is why we can agree with them and become united against this radicalism." 
 anti_radicalism_program:0 "Anti Radicalism Program"
 anti_radicalism_program_desc:0 "We have started to make programs against the developing radicalism. With these programs, there is a shift of the public from radicalism to a centralized structure." 
 protect_the_belief:0 "Protect The Belief"
 protect_the_belief_desc:0 "We also have to keep our faith. Our faith can never fall below secularism. By protecting our faith, we will prevent religious troubles and depressions from occurring in this country." 
 populist_art:0 "Art Of Populism"
 populist_art_desc:0 "Populism is actually an art. It is very important to properly perform this art. If our people are unhappy, the country turns into a paradise of inefficiency, if our people see the right populist steps, they will be happy, and our country turns into a paradise of efficiency." 
 obsudman_instution:0 "Ombudsman Institution"
 obsudman_instution_desc:0 "An ombudsman or public advocate is an official who is usually appointed by the government or by parliament but with a significant degree of independence. In some countries, an inspector general, citizen advocate, or another official may have duties similar to those of a national ombudsman and may also be appointed by a legislature. Below the national level, an ombudsman may be appointed by a state, local, or municipal government. Unofficial ombudsmen may be appointed by, or even work for, a corporation such as a utility supplier, newspaper, NGO, or professional regulatory body." 
 juidacary_quality_1:0 "Law And Equality Forces"
 juidacary_quality_1_desc:0 "The forces of law and equality work impartially and systematically. This impartiality and systematic work bind our people to our country. This docking is a factor in the strengthening of our country. \n\n§YSituation Of Law And Equality Quality:§!§R Bad§!" 
 juidacary_quality_2:0 "Law And Equality Forces"
 juidacary_quality_2_desc:0 "The forces of law and equality work impartially and systematically. This impartiality and systematic work bind our people to our country. This docking is a factor in the strengthening of our country. \n\n§YSituation Of Law And Equality Quality:§!§Y Normal§!" 
 juidacary_quality_3:0 "European Court Of Human Rights Assistance On Equality Forces"
 juidacary_quality_3_desc:0 "The legal and equality forces work impartially and systematically and are supported by the European Courts of Human Rights. This impartiality and systematic work bind our people to our country. This docking is a factor in the strengthening of our country. \n\n§YSituation Of Law And Equality Quality:§!§G Good§!"
 support_women_works:0 "Support Women Works"
 support_women_works_desc:0 "Women have the right to work, and these rights must be supported both financially and spiritually. Long live Women's Rights!" 
 cotton_industries_strenghen:0 "Cotton Industries"
cotton_industries_strenghen_desc:0 "Cotton is the world's most important natural fibre. In the year 2007, the global yield was 25 million tons from 35 million hectares cultivated in more than 50 countries. In Turkey, it's around 500 Million and we are here to increase it to advance the economy. The Cotton Industry's conditions are very well in Turkey to add."
 agency_on_pensylvania:0 "Agents On Pennsylvania"
 agency_on_pensylvania_desc:0 "We need to hire agents in Pennsylvania. Because there is a serious security attack on our country from Pennsylvania. It is our wish to prevent them." 
 south_flank_NATO:0 "Lead Of The South Flank NATO Forces"
 south_flank_NATO_desc:0 "We are leading NATO's situation in the South Flank. Our task is to protect the South and not to back down as NATO." 
 balkan_NATO:0 "Lead Of The Balkan NATO Forces"
 balkan_NATO_desc:0 "We are leading NATO's situation in the Balkans. Our task is to protect the Balkans and not to back down as NATO." 
 bedrock_of_financial_stability:0 "Bedrock Of Financial Stability"
 bedrock_of_financial_stability_desc:0 "These regions are very convenient for finances and have a layout that will not collapse. That's why this place is almost a paradise for investors." 
 power_in_un:0 "Powerized Position In UN"
 power_in_un_desc:0 "We have increased our reputation at the UN with international outreach. This respectability will work for us everywhere." 
 kilicdaroglus_emergency_powers:0 "Kilicdaroglu's Emergency Powers"
 kilicdaroglus_emergency_powers_desc:0 "We are providing emergency forces to Kilicdaroglu. With these powers, the party can be easily reorganized from the back." 
 heleno_kemalism:0 "Heleno Kemalism"
 heleno_kemalism_desc:0 "Hellenistic Kemalism is a combination of Hellenistic and Kemalist thought. As a result of the combination of these two things, an indestructible force has been formed. The resistance of Hellenism and the reformism of Kemalism are the cornerstones of power." 
 concept_of_internationalism:0 "Concept Of Blue Kemalist Internationalism"
 turkish_nationalism:0 "Turkish Nationalism"
 turkish_nationalism_desc:0 "Turkish nationalism is a political ideology that promotes and glorifies the Turkish people, as either a national, ethnic, or linguistic group." 
 national_defence_organizations:0 "National Defence Organizations"
 national_defence_organizations_desc:0 "The purpose of National Defense Organizations is to destroy terrorist activities in our country. These national organizations will facilitate our struggle with the PKK and bring us closer to victory." 
 european_values:0 "European Values"
 reliable_man:0 "Reliable Man Kilicdaroglu"
 reliable_man_desc:0 "Kılıçdaroğlu has been registered as a very reliable person. We are sure that this reliability will bring us to good places." 
 embrace_positivism:0 "Positivism"
 embrace_positivism_desc:0 "Positivism is a philosophical theory that holds that all genuine knowledge is either positive—a and exclusively derived from the experience of natural phenomena and their properties and relations—or true by definition, that is, analytic and tautological. Thus, information derived from sensory experience, as interpreted through reason and logic, forms the exclusive source of all certain knowledge." 
 strenghen_AYM:0 "Powerhouse AYM"
 strenghen_AYM_desc:0 "The Constitutional Court of Turkey (sometimes abbreviated as AYM) is the highest legal body for constitutional review in Turkey. It "examines the constitutionality, in respect of both form and substance, of laws, decrees having the force of law, and the Rules of Procedure of the Turkish Grand National Assembly" (Article 148/1 of the Turkish Constitution). If necessary, it also functions as the Supreme Criminal Court to hear any cases raised about the President, Vice President, members of the Cabinet, or judges of the high courts. In addition to those functions, it examines individual applications because one of the fundamental rights and freedoms within the scope of the European Convention on Human Rights which are guaranteed by the Constitution has been violated by public authorities (Article 148/3 of the Turkish Constitution)." 
 kemalist_nationalism:0 "Kemalist Nationalism"
 kemalist_nationalism_desc:0 "The Kemalist revolution aimed to create a nation-state from the remnants of the multi-religious and multi-ethnic Ottoman Empire. Kemalist nationalism originates from the social contract theories, especially from the principles advocated by Jean-Jacques Rousseau and his Social Contract. The Kemalist perception of the social contract was affected by the dissolution of the Ottoman Empire which was perceived as a product of the failure of the Ottoman "Millet" system and the ineffective Ottomanism policy. Kemalist nationalism, after experiencing the Ottoman Empire's breakdown, defined the social contract as its "highest ideal". It combines secularism, chauvinism, and a cult of personality of Atatürk." 
 milletin_adami_kilicdaroglu:0 "Milletin Adami Kilicdaroglu"
 milletin_adami_kilicdaroglu_desc:0 "Kilicdaroglu is now a man of the nation. He is respected and known by our people for doing whatever the people want." 
 old_school_kemalism:0 "Old School Kemalism"
 old_school_kemalism_desc:0 "Old-school Kemalism in general consists of neutral Kemalism. Although there are elements from the left Kemalism in it. The purpose of old-school Kemalism is to depoliticize the country more. According to the old-school Kemalism, if the country became depoliticized, people would have peace, and terror would end." 
 war_with_inflation:0 "War With Inflation"
 war_with_inflation_desc:0 "We are currently struggling with inflation. There is no sleep for us until inflation falls. We will overcome this by pursuing an economic policy that is close to deflation." 
 sumerbank_D:0 "Sümerbank Incomes"
 sumerbank_D_desc:0 "Sümerbank was the cornerstone of Atatürk's industrial revolution in Turkey. Sumerbank's factories and plants, which represented the state-led industrialization in the Turkish textile sector for decades, were gradually closed and sold starting in 2002. We have stopped this gradual sale as of now. Sumerbank needs to make a profit to recover from the back, so these factories need to be supported." 
 investment_cult:0 "Investment Cult"
 investment_cult_desc:0 "As globalization integrates the economies of neighboring and trading states, they are typically forced to trade off such rules as part of a common tax, tariff, and trade regime, e.g. as defined by a free trade pact. Investment policy favoring local investors over global ones is typically discouraged in such pacts, and the idea of a separate investment policy rapidly becomes a fiction or fantasy, as real decisions reflect the real need for nations to compete for investment, even from their local investors." 
 national_mobilization:0 "National Mobilization"
 national_mobilization_desc:0 "We have mobilized the whole country against the absolute forces of the PKK. The destruction of this organization will increase the peace of the Turkish Nation, so the destruction of this organization is our wish."
 work_propaganda:0 "Work Propaganda"
 work_propaganda_desc:0 "It is necessary to keep the effort to work, so we will reduce the unemployment rate in our country by making propaganda to support working." 
 industrialization_concept:0 "Concept Of Industrialization"
 industrialization_concept_desc:0 "Industrialization is the basis for building an economic masterpiece. Therefore, we will rapidly industrialize our country and take strong Turkey steps." 
 diplomatic_coverage:0 "Weltpolitik Style Diplomacy"
 diplomatic_coverage_desc:0 "Inspired by Bismark's smart policies, we will obtain guarantees from other countries. Through these guarantees, we will rid our country of emerging dangers." 
 economic_interventionary:0 "Anarchic Economic Interventions"
 economic_interventionary_desc:0 "The current economic interventions in our country are not connected to a system, so these interventions are taking place in an anarchic manner. Anarchic interventions can affect our country badly, so it must be adapted to a system." 
 economy_resolvation_project:0 "Economic Resolution Project"
 economy_resolvation_project_desc:0 "We will find solutions for the endless economic problems in Turkey, and through these solutions, we will save our country from this bad economy and make the country's economy grow." 
 economic_interventionary_organized:0 "Systematic Economic Interventions"
 economic_interventionary_organized_desc:0 "We have combined the economic interventions made in our country into a system. We will steadily grow our country within the framework of this system." 
 anti_privatization:0 "Anti Privatization"
 anti_privatization_desc:0 "By opposing privatization, we will make sure that finance is under state control so that we will not suffer from economic difficulties in the future and we will not feel the problems of the liberal market." 
 agriculture_projection:0 "Agriculture Projection"
 agriculture_projection_desc:0 "Since there are too many rural areas in our country, it is very easy to do agriculture in the country, and thanks to this agriculture, our country can earn a significant income. Farming is one of the best things to do for this country." 
 agriculture_supporteds:0 "Agriculture Projection"
 agriculture_supporteds_desc:0 "Since there are too many rural areas in our country, it is very easy to do agriculture in the country, and thanks to this agriculture, our country can earn a significant income. Farming is one of the best things to do for this country." 
 volunteer_efficent_force:0 "Volunteer Efficient Force"
 volunteer_efficent_force_desc:0 "The army should generally consist of volunteers. If the army consists mainly of volunteers, the army will be stronger and the army will be unstoppable." 
 feeded_the_military_revenge:0 "Military Revenge"
 feeded_the_military_revenge_desc:0 "Recent attacks have strained our army, and this tension naturally led to a desire for revenge in the army. This desire for revenge in the army will result in our favor. Because no country or a structural system can stand against revenge by preserving its structure." 
 feeded_the_military_revenge_extreme:0 "Extreme Military Revenge"
 feeded_the_military_revenge_extreme_desc:0 "Recent attacks have strained our army, and this tension naturally led to a desire for revenge in the army. This desire for revenge in the army will result in our favor. Because no country or a structural system can stand against revenge by preserving its structure." 
 crusade_against_pkk:0 "Crusade Against PKK"
 crusade_against_pkk_desc:0 "We will seek support from all religions against the PKK terrorist organization. This communist and faithless organization must be destroyed."
 kemalist_doctrine:0 "Kemalist Doctrine"
 kemalist_doctrine_desc:0 "We will create a Kemalist Turkey by following a Kemalist doctrine. Kemalism emerged as a combination of two opposite things, such as revolutionism and nationalism." 
 revolutionism_TR:0 "Revolutionism"
 revolutionism_TR_desc:0 "Revolutionary ideas are necessary for every country. If there is no revolutionary movement in a country, that country will stay where it is and cannot progress. Atatürk is the greatest revolutionary in our country and he is the founding leader. Since we follow in his footsteps, there is no problem in adopting revolutionism." 
 elective_state:0 "Elective State"
 quality_politics:0 "Quality Politics"
 quality_politics_desc:0 "We have prohibited making politics by dealing with dirty things. With these bans, our policy will be cleared and we will have a cleaner Turkey." 
 multi_party_elective_state:0 "True Multi-Party State"
 multi_party_elective_state_desc:0 "Our country is genuinely multi-party. Since we are multi-party, political thought can be easily discussed and a way can be found in our country." 
 ethics_committee:0 "Ethics Committee"
 ethics_committee_desc:0 "An ethics committee is a body responsible for ensuring that medical experimentation and human subject research are carried out in an ethical manner following national and international law." 
 state_search_group:0 "State Search Group"
 state_search_group_desc:0 "The purpose of the inner city search service is to keep the country out of absolute trouble. The inner city search service senses the enemies in the area and sends a direct message to the central government when there is a problem. Therefore, this service is very important in terms of both management and security." 
 controlled_pro_western_clubs:0 "Controlled Pro Western Clubs"
 controlled_pro_western_clubs_desc:0 "Checking Clubs and entertainment venues located as westerners are now completely necessary. With this control and supervision, we can prevent westernism from spreading like a virus in our country." 
 neutral_power_of_realm:0 "Neutral Power Of Realm"
 neutral_power_of_realm_desc:0 "Atatürk always wanted our country to be in a neutral position. Turkey realized this wish of Atatürk until 1954, but then it broke its neutrality by joining NATO. As now we are in charge we would like to withdraw our country from political contacts in line with the need for neutrality to return to our country." 
 TTK_progress:0 "Türk Tarih Kurumu"
 TTK_progress_desc:0 "The Turkish Historical Society (TTK for short) is a research institution established on April 12, 1931, as a result of Mustafa Kemal Atatürk's directive, to research Turkish history from the first sources. With the Statutory Decree No. 664, the Turkish Historical Society has a separate public legal entity, and it was subordinated to the supervision and supervision of the Atatürk Culture, Language and History Supreme Institution, which was established in 1983." 
 17_year_politiche:0 "17 Age Politiche"
 17_year_politiche_desc:0 "We have lowered the age of consent to 17 years old. Thanks to this, our country will be able to add the young population to the workforce more quickly." 
 militaristic_education:0 "Militaristic Education"
 militaristic_education_desc:0 "Remaining compulsory and increasing military education in our country is necessary because of our position and traditions. War is a reality and Turkey is in a dangerous situation. The homeland must be prepared for all kinds of defense." 
 village_institutions:0 "Village Institutions"
 village_institutions_desc:0 "Village Institutes were a group of rural schools founded following a project led by Hasan Âli Yücel, who was the Minister of Education at the time. The project started on April 17, 1940, to train teachers. The project has been shut down by DP after DP takes the power. Now on, we recreated this project. They were the cornerstones of the rural development projects in the post-war Turkish state. At the time there weren't many educational institutions in most villages, the institutes helped educate the rural populace. Village Institutes were established to meet the needs of the teachers of each village." 
 improvement_of_general_culture:0 "Improvement Of General Culture"
 improvement_of_general_culture_desc:0 "It is very important to make progress in general culture. A person who does not know his general culture remains ignorant no matter what he knows." 
 general_culture_protection_institutions:0 "General Culture Protection Institutions"
 general_culture_protection_institutions_desc:0 "Lately, popular culture things that are disrupting the general culture have been developing. By establishing an institution that protects the General Culture, we will not allow this popular culture to affect the general culture negatively."
 quality_museums:0 "Quality Museums"
 quality_museums_desc:0 "We will make our people both happy and cultured by opening above-quality museums around our country."
 turkish_theathers:0 "Turkish Theaters"
 turkish_theathers_desc:0 "Theater is a collaborative form of performing art that uses live performers, usually actors or actresses, to present the experience of a real or imagined event before a live audience in a specific place, often a stage. The performers may communicate this experience to the audience through combinations of gesture, speech, song, music, and dance. Elements of art, such as painted scenery and stagecraft such as lighting are used to enhance the physicality, presence, and immediacy of the experience." 
 turkish_films:0 "Turkish Films/Series"
 turkish_films_desc:0 "Domestic films and domestic TV series productions should be continued. Thanks to this, our country is not affected by another country and protects its identity." 
 four_elements_under_protection:0 "Four Elements Under Protection"
 four_elements_under_protection_desc:0 "The first four articles of our constitution are under protection. If these protected laws are attempted to be changed, military intervention will be inevitable." 
 prisoner_law:0 "Prisoner Law"
 prisoner_law_desc:0 "We have finished the draft law on criminals and have passed a more sensible criminal law. Criminals will no longer be able to easily do whatever they want." 
 improve_the_women_laws:0 "Improvement Of Women Rights"
 improve_the_women_laws_desc:0 "Women's rights have lost power in our country lately. We have enacted new laws to protect women's rights to strengthen women's rights from behind. Women's rights are very important to us." 
 protect_informals:0 "Protect Informals"
 protect_informals_desc:0 "We have passed a law on copyright protection. Scientists and many businesses will be pleased with this copyright protection." 
 constitution_protection_under_arms:0 "Constitution Protection Under Arms"
 constitution_protection_under_arms_desc:0 "" 
 turkish_books_level_1:0 "Turkish Book Development"
 turkish_books_level_1_desc:0 "The increase in Turkish books will mean an increase in reading. The increase in reading is a gem to take our country forward. Increasing reading is a development tool." 
 turkish_books_level_2:0 "Huge Turkish Book Development"
 turkish_books_level_2_desc:0 "The increase in Turkish books will mean an increase in reading. The increase in reading is a gem to take our country forward. Increasing reading is a development tool." 
 datamining_crush:0 "Crush The Datamining"
 datamining_crush_desc:0 "Data mining should be destroyed where it is found. Data mining is a national nuisance. Data mining is a means of stealing information." 
 socialists_shield:0 "Shield Against Capitalism"
 socialists_shield_desc:0 "This country is a pillar and defense zone against Capitalism. People who do not like and hate capitalism gathered in this country for a common purpose. And that is to destroy every capitalist thing in this country." 
 turkish_autarky:0 "Turkish Autarky"
 turkish_autarky_desc:0 "Autarky is the characteristic of self-sufficiency, usually applied to societies, communities, states, and their economic systems."
 great_power_projection:0 "Great Power Projection"
 great_power_projection_desc:0 "Our country has developed itself politically and militarily by establishing bases in many places. This situation will be useful for us in the world conjuncture." 
 total_war_economy:0 "Total War Economy"
 total_war_economy_desc:0 "Since there is a war, we need to organize our economy accordingly and operate our factories accordingly. Because of this situation, we are trying to produce a surplus by putting pressure on the factories that are not normal. This pressure will bring a certain amount of authority and instability."
 growing_industries:0 "Growing Industries.."
 growing_industries_desc:0 "Industries began to experience great growth. Thanks to this growth, we can provide faster production acceleration."
 faster_production:0 "Faster Production"
 faster_production_desc:0 "We enable our factories to produce more. More production is more goods stability and strength." 
 compliance_forces:0 "Compliance Forces"
 compliance_forces_desc:0 "We created new authoritarians to prevent riots in the region. These authoritarians aim to stop the rebellions and make the people accept the current Turkish regime." 
 rise_of_greek_nationalism:0 "Greek Nationalism Supported"
 rise_of_greek_nationalism_desc:0 "Turkey is supporting Greek nationalism because if the Greeks make our government an extreme right party because of nationalism, we will be out of NATO. They will take advantage of the opportunity to occupy Greece." 
 rise_of_bulgarian_nationalism:0 "Bulgarian Nationalism Supported"
 rise_of_bulgarian_nationalism_desc:0 "Turkey is supporting Bulgarian nationalism because if the Bulgarians make our government an extreme right party because of nationalism, we will be out of NATO. They will take advantage of the opportunity to occupy Bulgaria." 
 covering_industries:0 "Covering Industries"
 covering_industries_desc:0 "We must protect our industry against possible aircraft attacks and bombardments. So we must hide our industries. It is very important to us that our industries are not harmed." 
 covering_people_in_shelters:0 "Covering People In Shelters"
 covering_people_in_shelters_desc:0 "It seems that radioactive and chemical weapons will be used a lot in this war, so it would be beneficial to move our population to places such as tunnels or underground shelters." 
 all_time_working_factories:0 "7/24 Working Factories"
 all_time_working_factories_desc:0 "Factories are working non-stop. Our people get tired of this, but these are the situations that resulted from the war. Let's grind a little more and produce, victory is ahead!" 
 call_arms_for_war:0 "Called The Arms For War"
 call_arms_for_war_desc:0 "We invite all our people to war. This war is the war of this nation, that is your war for life." 
 guerilla_warfare:0 "Guerrilla Warfare"
 guerilla_warfare_desc:0 "Guerrilla warfare is a form of irregular warfare in which small groups of combatants, such as paramilitary personnel, armed civilians, or irregulars, use military tactics including ambushes, sabotage, raids, petty warfare, hit-and-run tactics, and mobility, to fight a larger and less-mobile traditional military." 
 war_for_the_motherland:0 "War For The Motherland"
 war_for_the_motherland_desc:0 "The motherland is in danger. The war has turned the world into hell. We have to get our homeland out of this hell. We will never allow the invasion of our homeland." 
 uranium_trade:0 "Uranium Trade"
 uranium_trade_desc:0 "Our country is now engaged in uranium trade. Because uranium is a material that is very difficult to find and provides high energy, it is sold in the markets for a lot of money. Because of this, our country also earns a lot of money." 
 banner_of_victory:0 "Banner Of Victory"
 banner_of_victory_desc:0 "We seem to have emerged victorious from the third world war. From now on, our country will not be defeated by any country, we will be a country that will not lose any war." 
 russian_victory_sighted:0 "Russian Supremacy"
 russian_victory_sighted_desc:0 "Russian supremacy is entirely in Europe. Now the basis of all of Europe is Russia. This superiority provided by Russia is now an indication that our Russia is a superpower and an invincible power." 
 militant_interventionism:0 "Interventionist Corps"
 militant_interventionism_desc:0 "We have formed intervention groups. These intervention groups aim to make the situation in another country work to our advantage."
 emergency_relocation_plan:0 "Emergency Relocation Plan"
 emergency_relocation_plan_desc:0 "War is at hand, we need to take action for it. We must send the population of our country to the east to safe places and build defenses on our western borders."
 socialist_defenders:0 "Socialist Defenders"
 socialist_defenders_desc:0 "We have established socialist militants all over our country against the worldwide plague of capitalism. As soon as the threat of capitalism comes, these militants will take the gun they buried in the ground and fight to the end." 
 counter_fetwa:0 "Counter Fetwa"
 counter_fetwa_desc:0 "The Gülen Movement issuing a fatwa against us so we will also issue a fatwa against them. We will crush these religious merchants in our limits." 
 controlled_television:0 "Controlled Television"
 controlled_television_desc:0 "We are taking over the television channels through RTÜK to block the propaganda of terrorism and foreign aggression. Many arrangements will be on our agenda as we get our hands on television." 
 collegues_against_gulenists:0 "Anti Gülenist Colleagues"
 collegues_against_gulenists_desc:0 "By pulling the Colleagues to our side, we turned them into Anti-Gulenist. In this way, we have strengthened our side against the Gülen Movement." 
 scientific_community_against_gulenists:0 "Anti Gülenist Scientific Community"
 nationalist_coverage:0 "Nationalist Coverage"
 nationalist_coverage_desc:0 "Thanks to nationalism, we can build a large and powerful army. Nationalism is the most important thing for states. Liberal ideas are utter nonsense."
 wheat_fields:0 "Wheat Fields"
 wheat_fields_desc:0 "Wheat is grown on more land area than any other food crop (220.4 million hectares or 545 million acres, 2014). World trade in wheat is greater than for all other crops combined. In 2017, world production of wheat was 772 million tonnes (1.7 trillion pounds), with a forecast of 2019 production at 766 million tonnes (1.7 trillion pounds), making it the second most-produced cereal after maize." 
 adana_agriculture_basis:0 "Adana Agriculture Bases"
 mafia_underground_base:0 "Mafia Underground Base"
 mafia_underground_base_desc:0 "The headquarters of the national mafia organization has been designated. Thanks to this center, general authority, and general administration are provided. In other words, this center is a cornerstone of the newly developing mafia order and we can say that it is the cornerstone of supervision."
 datamining_group:0 "Datamining Group"
 datamining_group_desc:0 "Data mining is a process of extracting and discovering patterns in large data sets involving methods at the intersection of machine learning, statistics, and database systems."
 code_breaker_group:0 "Code Breaker Group"
 code_breaker_group_desc:0 "We have established a code-breaking group. The purpose of this group is to infiltrate government networks by breaking the code and take over these networks to handle the administration."
 controlling_the_banks:0 "Controlling The Banks"
 controlling_the_banks_desc:0 "Banks must necessarily be controlled. All banks must be public banks, otherwise, there will be problems with an order, and exploitation will occur. We will not allow banks to exploit our people. Only we, the mafia, can exploit it."
 controlling_the_security_channels:0 "Controlling The Security Channels"
 controlling_the_security_channels_desc:0 "By infiltrating the firewalls, we have taken the security and power of our country under our control. We are now comfortably aware of every incident that has taken place in the army and security forces."
 relocation_of_mafias:0 "Relocation Of Mafias"
 relocation_of_mafias_desc:0 "By relocating the mafias and distributing the mafias all over our country, we will generally gain power in the country."
 mafia_underground_base_2:0 "Confident Mafia Base"
 mafia_underground_base_2_desc:0 "The headquarters of the national mafia organization has been designated. Thanks to this center, general authority, and general administration are provided. In other words, this center is a cornerstone of the newly developing mafia order and we can say that it is the cornerstone of supervision."
 one_man_state:0 "Mafia Dictatorship"
 one_man_state_desc:0 "There is no democratic order any more. The order of power was formed according to the power of the mafias. Now the most powerful mafia will be in power, and others will be their assistants."
 one_man_state_strong:0 "Powered Mafia Dictatorship"
 one_man_state_strong_desc:0 "There is no democratic order anymore. The order of power was formed according to the power of the mafias. Now the most powerful mafia will be in power, and others will be their assistants."
 tores_in_the_law:0 "Töres In Law"
 tores_in_the_law_desc:0 "At the request of the mafias, the ceremonies will now be found in the law. These ceremonies can undermine structural stability."
 controlled_tores:0 "Töres Under Control"
 controlled_tores_desc:0 "At the request of the mafias, the ceremonies will now be found in the law. These ceremonies can undermine structural stability. To eliminate this beating, we will establish a certain supervisory superiority in the ceremonies. Supervision is important."
 the_new_hyrarchy:0 "The New Hierarchy"
 the_new_hyrarchy_desc:0 "With the disappearance of the old democratic order, there is now a new hierarchy. This hierarchy keeps the mafias at the top and the minorities at the bottom. This new hierarchy is systematically close to nazism."
 gun_studies_1:0 "Allowed Personal Weaponry"
 gun_studies_1_desc:0 "People need to learn how to use a gun and everyone needs to have a gun in their hands. Our people can learn this spontaneously or by going to certain weapons courses. The better our people learn weapons, the stronger our military will be shaped."
 gun_studies_25:0 "Gun Studies"
 gun_studies_25_desc:0 "People need to learn how to use a gun and everyone needs to have a gun in their hands. Our people can learn this spontaneously or by going to certain weapons courses. The better our people learn weapons, the stronger our military will be shaped."
 casinos_1:0 "Legalized Casinos"
 casinos_1_desc:0 "Banning casinos is complete nonsense. People should play if they want to play with their money. After all, we also use casinos to make money."
 casinos_2:0 "Casino Commissions"
 casinos_2_desc:0 "Banning casinos is complete nonsense. People should play if they want to play with their money. After all, we also use casinos to make money as we put commissions to casinos."
 state_of_criminals:0 "State Of Criminals"
 state_of_criminals_desc:0 "Our country is a paradise for criminals. Criminals come to our country from all over the world, and we take care of them, and thanks to this, we get money."
 education_of_loyalty:0 "Education Of Loyalty"
 education_of_loyalty_desc:0 "Loyalty to our people must necessarily be taught. Without loyalty, new mafias will not appear, and new people will not come to the mafias, and this will push us into congestion."
 return_to_islam:0 "Return To Islam.."
 return_to_islam_desc:0 "Our mafia-like country needs to get support from the religious. To get support from the religious, we will bring our people closer to Islam and crush the atheistic activities we see."
 return_to_islam_2:0 "Return To Islam.."
 return_to_islam_2_desC:0 "Our mafia-like country needs to get support from the religious. To get support from the religious, we will bring our people closer to Islam and crush the atheistic activities we see."
 right_wing_supremacy:0 "Dominated With Right Wing Books"
 right_wing_supremacy_desc:0 "With the destruction of the leftist section in our country, right-wing has dominated our country. Right-wing books and right-wing education are just small indicators. If we look at the big picture, we'll see more."
 right_wing_supremacy_2:0 "Right Wing Education"
 right_wing_supremacy_2_desc:0 "With the destruction of the leftist section in our country, right-wing has dominated our country. Right-wing books and right-wing education are just small indicators. If we look at the big picture, we'll see more."
 controlled_media:0 "Controlled Social Media"
 controlled_media_desc:0 "It is an absolute necessity to monitor and control social media. If social media is not controlled, it can drag the public to rise. This needs to be urgently prevented."
 new_prisons:0 "New Prisons"
 new_prisons_desc:0 "It is important for us that new prisons are built. With the construction of new prisons, more criminals will be able to attract their crimes, and stability will increase at a certain level."
 all_power_to_TRT:0 "All Powers To TRT"
 all_power_to_TRT_desc:0 "It is most reasonable for us that all the media is conducted by TRT. Since TRT is a network managed by us, we would have got any problems. That is why we are turning TRT into a general media."
 secret_DNA_interventions_1:0 "Secret DNA Interventions"
 secret_DNA_interventions_1_desc:0 "It looks good for us to interfere with people's genes and DNA. Together with this intervention, we can apply our people to work and remove the age of emotion. Of course, it is necessary to hide this genetic intervention. The emergence of this situation may even lead our country into a civil war."
 secret_DNA_interventions_2:0 "Secret Funded DNA Interventions"
 secret_DNA_interventions_2_desc:0 "It looks good for us to interfere with people's genes and DNA. Together with this intervention, we can apply our people to work and remove the age of emotion. Of course, it is necessary to hide this genetic intervention. The emergence of this situation may even lead our country into a civil war."
 acceptable_violance:0 "Acceptable Violance"
 acceptable_violance_desc:0 "Violence should be an acceptable thing in our country. Violence gives strength to a person and brings with it the habit of getting used to recovery."
 arrest_the_unemployment:0 "Arrest The Unemployment"
 arrest_the_unemployment_desc:0 "To prevent unemployment, we are abandoning the so-called democratic ways and switching to violent ways. To prevent unemployment, we are arresting the unemployed. In this case, unemployment will not remain at the high levels."
 create_state_information_bureau:0 "State Information Bureau"
 create_state_information_bureau_desc:0 "We will establish information offices in each city to collect information from each city. These offices will be secret and will have an activity such as regional espionage."
 harsh_loyaly_laws:0 "Harsh Loyalty Laws"
 harsh_loyaly_laws_desc:0 "We will eliminate people who are unfaithful with tough new laws. These harsh laws are good at ensuring general stability, although they bring a great deal of peace of mind."
 weaken_emotion:0 "Weakened Emotion"
 weaken_emotion_desc:0 "Emotion is a very unnecessary thing. Emotion makes people powerless. We will weaken the feeling with the mafiotic reforms and raise a new cold-blooded generation. Thanks to this cold-blooded generation, a generation will also be formed that does not give room for emotions and only looks at its work."
 weaken_emotion_2:0 "Weakened Emotion"
 weaken_emotion_2_desc:0 "Emotion is a very unnecessary thing. Emotion makes people powerless. We will weaken the feeling with the mafiotic reforms and raise a new cold-blooded generation. Thanks to this cold-blooded generation, a generation will also be formed that does not give room for emotions and only looks at its work."
 gun_studies_3:0 "Gun Studies"
 gun_studies_3_desc:0 "People need to learn how to use a gun and everyone needs to have a gun in their hands. Our people can learn this spontaneously or by going to certain weapons courses. The better our people learn weapons, the stronger our military will be shaped."
 national_unity_lessons:0 "Education Of National Unity"
 national_unity_lessons_desc:0 "National unity education is very important for us. If there is no national unity, there will be no stability, there will be no economy, there will be no development, in short, nothing will happen. That is why national unity is the most important thing."
 military_traditions_problematic:0 "The Unstable Army"
 military_traditions_problematic_desc:0 "With the seizure of power by the mafia, disobedience, and anarchy unexpectedly appeared in the country. This disorder has made the army extremely powerless. The honor of our army is worn out, and the country is depressed in terms of security. It seems that it is necessary to resolve this situation quickly, otherwise, we will be occupied."
 military_traditions_problematic_2:0 "The Unstable Army"
 military_traditions_problematic_2_desc:0 "With the seizure of power by the mafia, disobedience, and anarchy unexpectedly appeared in the country. This disorder has made the army extremely powerless. The honor of our army is worn out, and the country is depressed in terms of security. It seems that it is necessary to resolve this situation quickly, otherwise, we will be occupied."
 military_traditions_problematic_3:0 "The Unstable Army"
 military_traditions_problematic_3_desc:0 "With the seizure of power by the mafia, disobedience, and anarchy unexpectedly appeared in the country. This disorder has made the army extremely powerless. The honor of our army is worn out, and the country is depressed in terms of security. It seems that it is necessary to resolve this situation quickly, otherwise, we will be occupied."
 military_traditions_problematic_4:0 "The Unstable Army"
 military_traditions_problematic_4_desc:0 "With the seizure of power by the mafia, disobedience, and anarchy unexpectedly appeared in the country. This disorder has made the army extremely powerless. The honor of our army is worn out, and the country is depressed in terms of security. It seems that it is necessary to resolve this situation quickly, otherwise, we will be occupied."
 military_traditions_problematic_5:0 "The Unstable Army"
 military_traditions_problematic_5_desc:0 "With the seizure of power by the mafia, disobedience, and anarchy unexpectedly appeared in the country. This disorder has made the army extremely powerless. The honor of our army is worn out, and the country is depressed in terms of security. It seems that it is necessary to resolve this situation quickly, otherwise, we will be occupied."
 mafia_defence_organization:0 "Mafia Defence Organizations"
 mafia_defence_organization_desc:0 "We have established the mafia defense organization. Through this organization, we will save our country from dangerous situations and eliminate our enemies from the country. Where there is security, stability prevails."
 war_academies:0 "War Academies"
 war_academies_desc:0 "War academies have become quite necessary for our country because after the mafia took over the country, there are no more generals left in the country and no new general will come. That is why we will use the combat academies to train the mafias and drive them to the front. It is necessary to solve the crisis caused by the absence of any general."
 experimental_PKK_war:0 "Experiments Of The Clash With PKK"
 experimental_PKK_war_desc:0 "It's time to put the experience of our mafias from the war with the PKK into a rule. Through this rule, we will constantly gain combat experience. This situation is almost like a war bank."
 experimental_PKK_war_2:0 "Experiments Of The Clash With PKK"
 experimental_PKK_war_2_desc:0 "It's time to put the experience of our mafias from the war with the PKK into a rule. Through this rule, we will constantly gain combat experience. This situation is almost like a war bank."
 TUR_PKK_active_foreign: "PKK Activity"
 TUR_PKK_active_foreign_desc: "The Kurdish insurgent group is operating bases or assisting affiliated groups in this country"
 speedful_forces:0 "Speedful Forces"
 speedful_forces_desc:0 "We are doing the necessary work to accelerate our armies. Thanks to these works, our army was able to accelerate to some extent. Speed is an important element in combat and planning. An increase in speed is a good quantity."
 gun_studies_4:0 "Gun Studies"
 gun_studies_4_desc:0 "People need to learn how to use a gun and everyone needs to have a gun in their hands. Our people can learn this spontaneously or by going to certain weapons courses. The better our people learn weapons, the stronger our military will be shaped."
 gun_tests:0 "Gun Tests"
 gun_tests_desc:0 "We need to test the weapons at our disposal. By testing the weapons we have, we will increase reliability of our weapons. We should increase the reliability of weapons."
 withdrawal_law:0 "Withdrawal Law"
 withdrawal_law_desc:0 "We are passing the law of withdrawal. Through this law, we will limit the retreat from a certain place and we will not easily leave the place where our soldier steps."
 tanks_and_airplanes_what:0 "Tanks And Airplanes?"
 tanks_and_airplanes_what_desc:0 "The mafias don't know anything about airplanes and tanks. Mafiosi know only infantry-heavy information. Mafias must adapt to airplanes and tanks. Otherwise, what are we going to do with these planes and tanks."
 border_mafias_in_action:0 "Border Mafias In Action"
 border_mafias_in_action_desc:0 "With the mafia taking over, border security was completely disrupted. As a reason for this, border mafias were created. The goal of border mafias is to protect the borders and shoot those who try to cross the border. That way, border security will remain intact."
 border_mafias_in_action_2:0 "Border Mafias In Action"
 border_mafias_in_action_2_desc:0 "With the mafia taking over, border security was completely disrupted. As a reason for this, border mafias were created. The goal of border mafias is to protect the borders and shoot those who try to cross the border. That way, border security will remain intact."
 conducted_border_mines:0 "Border Mines In The Border"
 conducted_border_mines_desc:0 "We have planted mines on the borders through the mafias. Thanks to these mines, no one will be able to cross the borders, and our country will not be affected by activities on the border."
 pretty_isolated_state:0 "Fully Isolated State"
 pretty_isolated_state_desc:0 "Because all the borders of our country are closed, it does not interact with any country. Non-interaction causes the isolation of our country, while isolation gives us absolute power."
 fund_hezbollah:0 "Funded Hezbollah"
 fund_hezbollah_desc:0 "Hezbollah should be supported in every sense. In parallel with the support of Hezbollah, the power of the PKK will decrease. The decline of the PKK's power will bring deep relief to our country."
 assistance_from_ulkists:0 "Assistance From Ulkists"
 assistance_from_ulkists_desc:0 "We have received support from the ulkists to destroy the PKK. The PKK needs to be destroyed and disposed of in every sector."
 counter_pkk_arming:0 "Anti PKK Militarizing"
 counter_pkk_arming_desc:0 "We invite our people to join the army against the PKK. We will put an end to this terror and turn the east into a center of peace. Long live the Turkish Armed Forces!"
 legalized_world_drug_trade:0 "Legalized Drug Trade"
 legalized_world_drug_trade_desc:0 "The drug trade is a godsend for our mafia-like country. The income that can be obtained from the drug trade can reach trillions. The drug trade briefly makes us the richest and most powerful in every industry. That's why we're starting the drug trade and supporting it with secured convoys. Come on, it's time to make money!"
 legalized_world_drug_trade_convoys:0 "Specialized Drug Trade"
 legalized_world_drug_trade_convoys_desc:0 "The drug trade is a godsend for our mafia-like country. The income that can be obtained from the drug trade can reach trillions. The drug trade briefly makes us the richest and most powerful in every industry. That's why we're starting the drug trade and supporting it with secured convoys. Come on, it's time to make money!"
 legalized_world_drug_trade_specialized:0 "Far Specialized Drug Trade"
 legalized_world_drug_trade_specialized_desc:0 "The drug trade is a godsend for our mafia-like country. The income that can be obtained from the drug trade can reach trillions. The drug trade briefly makes us the richest and most powerful in every industry. That's why we're starting the drug trade and supporting it with secured convoys. Come on, it's time to make money!"
 legalized_world_drug_trade_specialized_max:0 "Worldwide Drug Trade"
 legalized_world_drug_trade_specialized_max_desc:0 "The drug trade is a godsend for our mafia-like country. The income that can be obtained from the drug trade can reach trillions. The drug trade briefly makes us the richest and most powerful in every industry. That's why we're starting the drug trade and supporting it with secured convoys. Come on, it's time to make money!"
 turkish_interventionary_group:0 "Turkish Interventionary Group"
 turkish_interventionary_group_desc:0 "The purpose of the Turkish intervention group is to support and arm the mafia elements in the region financially and spiritually."
 local_american_communists_help:0 "Local American Commies' Help"
 local_american_communists_help_desc:0 "We are seeking support from native communist Americans. The support of Native Americans can strengthen us in the war against the United States"
 south_american_help:0 "South American Mafias' Intel"
 south_american_help_desc:0 "Taking advantage of the knowledge of the South American mafias in America, we will fight with America and defeat them. Wait, victory is coming!"
 poison_modified_cigarettes:0 "Poisoned Americans"
 poison_modified_cigarettes_desc:0 "We have poisoned Americans by putting poisons to cigarettes, so we will invade the Americans in a short time. Now that America has no strength left to resist, it will surely surrender soon."
 weakened_pentagon:0 "Sabotaged Pentagon"
 weakened_pentagon_desc:0 "We have poisoned the armies of the Europeans, so we will invade the Europeans in a short time. Now that Europe has no strength left to resist, it will surely surrender soon."
 pakistani_help:0 "Pakistani Mafias' Intel"
 pakistani_help_desc:0 "Taking advantage of the knowledge of the Pakistani mafias in Europe, we will fight with Europe and defeat them. Wait, victory is coming!"
 poisoned_europeans:0 "Poisoned European Forces"
 poisoned_europeans_desc:0 "We have poisoned the armies of the Europeans, so we will invade the Europeans in a short time. Now that Europe has no strength left to resist, it will surely surrender soon."
 chemical_weapons_on_europeans:0 "Chemical Weapons Usage On Europeans"
 chemical_weapons_on_europeans_desc:0 "We will use chemical weapons on Europeans so that the European public vote will become anti-war and we will take advantage of this to invade Europe comfortably."
 local_muslims_help:0 "Local Muslims' Help"
 local_muslims_help_desc:0 "We are seeking support from Muslims in Europe. The support of Muslims in Europe can strengthen us in the war against Europe."
 poisoned_russians:0 "Poisoned Russian Forces"
 poisoned_russians_desc:0 "We have poisoned the armies of the Russians, so we will invade the Russians in a short time. Now that Russia has no strength left to resist, it will surely surrender soon."
 industrial_powerhouse:0 "Mafia Industrial Powerhouse"
 industrial_powerhouse_desc:0 "Mafia industries have gained strength by gaining momentum. This strengthening is an indication that this country is now an industrial power. Long live the new system! Long live the industrial age of Turkey!"
 mafia_capitol:0 "Funded Mafia Capital"
 mafia_capitol_desc:0 "It is very important for our country that mafia capitals are found and that they profit at good rates. The more confidence the mafia capitalists gain in supply and demand, the more profit they make."
 increased_mafia_capitol:0 "Reliable Mafia Capital"
 increased_mafia_capitol_desc:0 "It is very important for our country that mafia capitals are found and that they profit at good rates. The more confidence the mafia capitalists gain in supply and demand, the more profit they make."
 mafia_marketplaces:0 "Special Mafia Marketplaces"
 mafia_marketplaces_desc:0 "We will achieve a certain order in the economy by establishing special markets for mafias. Together with this order, we intend to prevent economic blockages."
 mafia_trade_union:0 "Mafia Trade Union"
 mafia_trade_union_desc:0 "With the creation of the mafia trade association, national and international trade between mafias will dec facilitated and economic returns will increase. It's good for all of us that the economic elements will show up."
 mafia_gold:0 "Mafia Gold"
 mafia_gold_desc:0 "Mafia gold means important things to us. The fact that the mafia has a surplus of gold indicates that the economy of our country is so strong. We have to increase the earning of gold by our mafias."
 mafia_gold_2:0 "Mafia Goldyards"
 mafia_gold_2_desc:0 "Mafia gold means important things to us. The fact that the mafia has a surplus of gold indicates that the economy of our country is so strong. We have to increase the earning of gold by our mafias."
 mafia_gold_3:0 "State Of Mafia Gold"
 mafia_gold_3_desc:0 "Mafia gold means important things to us. The fact that the mafia has a surplus of gold indicates that the economy of our country is so strong. We have to increase the earning of gold by our mafias."
 new_taxation_system:0 "New Taxation System"
 new_taxation_system_desc:0 "We are removing the old taxation system and introducing a new one. Together with this new taxation system, we will receive a larger amount of money from the public."
 taxing_immigrants:0 "Taxing Immigrants"
 taxing_immigrants_desc:0 "Special taxes will be levied on refugees. This decision has made our people happy. Because refugees were not subject to paying taxes in ancient times."
 expanded_KDV:0 "Expanded KDV"
 expanded_KDV_desc:0 "With the increase of KDV, our state will earn more money, and if our state earns money, it will automatically benefit from our mafias and become stronger."
 general_tax:0 "Heavy Taxes On The Society"
 general_tax_desc:0 "By imposing heavy taxes on our people, we will increase the profits of our state more and force balances. The increase in the returns of mafias should not necessarily stop."
 supply_trade:0 "Supply Trade"
 supply_trade_desc:0 "We need to expand the trade in supplies. The development of trade, as is known, ensures the economic development of the state."
 military_trade:0 "Military Trade"
 military_trade_desc:0 "We need to expand the trade in military vehicles. As you know, the development of military trade is a big step for the development and financing, and strengthening of our army."
 land_of_criminality:0 "Trade Of Criminality"
 land_of_criminality_desc:0 "Trading things that are plain and legal is unnecessary, it makes very little money. That's why it's much more important for us to trade illegal things. Thanks to this can make more money from this."
 powerized_industry:0 "Powerized Industry"
 powerized_industry_desc:0 "We are engaged in the process of powering the industry because a country with a bad industry will never develop and will count on the spot."
 true_civilian_power:0 "True Civilian Power"
 true_civilian_power_desc:0 "It is necessary to build a civilian factory, which is more important than military factories. Military factories in general bring short-term returns. The returns of civilian factories, on the other hand, are generally long-term and better."
 mafiatic_drain:0 "The Mafia Crisis"
 mafiatic_drain_desc:0 "The reason for the emergence of the mafiotic crisis is that after the mafias seized power, a certain bureaucracy did not remain in the middle. Countries without a bureaucracy are weak and cannot develop in a political sense." 
 mafias_level_1:0 "Turkish Mafias"
 mafias_level_1_desc:0 "There are a certain number of mafia groups in Turkey, and these mafias have had a lot of influence on Turkish politics."
 mafias_level_2:0 "Cooperation With Turkish Mafia"
 mafias_level_2_desc:0 "Our cooperation with the Turkish mafia is in a sustainable position. We will provide peace to our country by uprooting the PKK and communist organizations in our country."
 mafias_level_3:0 "Cooperation With Turkish Mafia"
 mafias_level_3_desc:0 "Our cooperation with the Turkish mafia is in a sustainable position. We will provide peace to our country by uprooting the PKK and communist organizations in our country."
