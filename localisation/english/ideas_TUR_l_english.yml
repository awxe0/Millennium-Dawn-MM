 counter_guerillas_NATO_cooperated_desc:0 "The counter-guerrillas, an American-born organization, is one of the main factors that will prevent the spread of communism in our country."
 political_rehabilitation:0 "Political Rehabilitation"
 political_rehabilitation_desc:0 "Our country has been politically damaged by the recent war. We need to restructure and correct it so that the policy does not suffer permanent damage. That's why we're meditating our policy backward."
