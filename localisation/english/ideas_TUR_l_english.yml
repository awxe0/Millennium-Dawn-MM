 power_on_bosporus:0 "Treaty of Montreux Confirmed"
 power_on_bosporus_desc:0 "The Montreux Convention Regarding the Regime of the Straits is a 1936 agreement that gives Turkey control over the Bosporus and Dardanelles straits and regulates the transit of naval warships. The Convention guarantees the free passage of civilian vessels in peacetime and restricts the passage of naval ships not belonging to Black Sea states. The terms of the Convention have been a source of controversy over the years, most notably about the Soviet Union's military access to the Mediterranean Sea. \n\nSigned on 20 July 1936 at the Montreux Palace in Switzerland, the Convention permitted Turkey to remilitarise the Straits. It went into effect on 9 November 1936 and was registered in the League of Nations Treaty Series on 11 December 1936. It remains in force."
