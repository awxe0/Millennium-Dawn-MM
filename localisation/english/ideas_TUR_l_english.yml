 action_of_IFAD_desc:0 "The international fund of agricultural development (IFAD) is an international financial institution and a specialized agency of the United Nations that works to address poverty and hunger in rural areas of developing countries. It is the only multilateral development organization that focuses on rural economies, food security, and climate change."
 action_of_FDO:0 "FDO"
 healthy_water:0 "Healthy Water"
 healthy_water_desc:0 "Healthy water is very necessary for humanity. We need to maintain healthy waters. If we don't protect these waters, the end is near."
