 POTEF108E_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF109E: "Oceania"
 POTEF109E_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF110E: "Pacific"
 POTEF110E_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF150E: "German Doctrine"
 POTEF150E_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member state can adopt this tradition and tactics."
 POTEF151E: "Empire of Trade"
 POTEF151E_desc: "The European Federation will become an Empire of Trade."
 POTEF200E: "French Doctrine"
 POTEF200E_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member state can adopt this tradition and tactics."
 POTEF201E: "Imperial Power"
 POTEF201E_desc: "The European Federation stands in the tradition of its imperial predecessors."
 POTEF202E: "Empire of Freedom"
 POTEF202E_desc: "The European Federation will become an Empire of Freedom."
 POTEF203E: "America: Ally or Adversary"
 POTEF203E_desc: "America and Europe have been allies for most of the 20th century. With the recent political changes in §Y[USA.GetNameWithFlag]§! this has been questioned…"
 POTEF204E: "NATO Legacy"
 POTEF204E_desc: "In the Tradition of the peacekeeping Legacy of NATO §Y[USA.GetNameWithFlag]§! and the §YEDU§! form a new alliance."
 POTEF205E: "Trump's Legacy"
 POTEF205E_desc: "§Y[USA.GetNameWithFlag]§! went form an ally to an adversary. Europe has to react to this decisive strategic change."
 POTEF206E: "Break the Wall"
 POTEF206E_desc: "To counter the American threat to European sovereignty, the general staff of the §YEDU§! has drafted a plan to ally with §Y[MEX.GetNameWithFlag]§! and invade §Y[USA.GetNameWithFlag]§! from the South."
 POTEF207E: "Buster's Resurrection"
 POTEF207E_desc: "To counter the US threat to Europe, the general staff of the §YEDU§! has proposed to ally with §Y[CAN.GetNameWithFlag]§! and revise the Defence Scheme No. 1, a plan created by Canadian Lt Col James 'Buster' Sutherland Brown, for a Canadian pre-emptive attack against the US in the event of an imminent conflict between the US and the British Empire. With this plan the §YEDU§! can launch an invasion from the North on §Y[USA.GetFlag] the US§!."
 POTEF250E: "Benelux Doctrine"
 POTEF250E_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member state can adopt this tactics."
 POTEF251E: "Liberal Legacy"
 POTEF251E_desc: "The European Federation honors its Liberal Legacy."
 POTEF252E: "Safeguard the old Traderouts"
 POTEF252E_desc: "The European Federation needs to safeguard the old Traderouts to the Caribbean, Africa and the former Dutch East Indies."
 POTEF253E: "Indonesia"
 POTEF253E_desc: "The European Federation needs to improve its relationship to the former Dutch colony §Y[IND.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF300E: "Iberian Doctrine"
 POTEF300E_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member state can adopt this tradition and tactics."
 POTEF301E: "Latin Cousins"
 POTEF301E_desc: "The European Federation needs to improve its relationship to the former colonies in South America."
 POTEF302E: "Mexico"
 POTEF302E_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[MEX.GetNameWithFlag]§! and build new strategic outposts in Central America."
 POTEF303E: "Greater Colombia"
 POTEF303E_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[COL.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF304E: "Central America"
 POTEF304E_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in §YCentral America§! and build new strategic outposts there."
 POTEF305E: "Southern Cone"
 POTEF305E_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in the §YSouthern Cone of South America§! and build new strategic outposts there."
 POTEF306E: "Brazil"
 POTEF306E_desc: "The European Federation needs to improve its relationship to the former Portuguese  colony §Y[BRA.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF350E: "British Doctrine"
 POTEF350E_desc: "The §YBritain§! traditionally focused on strong a strong Navy. With the Naval Doctrine all member state can adopt this tradition and tactics."
 POTEF351E: "Safeguard the North Atlantic"
 POTEF351E_desc: "To secure the Freedom of the Seas and free trade the European Federation needs to control the North Atlantic."
 POTEF352E: "Commonwealth Legacy"
 POTEF352E_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominions."
 POTEF353E: "Canada"
 POTEF353E_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[CAN.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF354E: "Australia"
 POTEF354E_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[AST.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF355E: "New Zealand"
 POTEF355E_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[NZL.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF356E: "Safeguard the North Sea"
 POTEF356E_desc: "The North Sea is the backyard of European Federation and needs to be secured."
 POTEF357E: "Malaya Legacy"
 POTEF357E_desc: "The European Federation needs to improve its relationship to the former British colonies of Malaya."
 POTEF358E: "Malaysia"
 POTEF358E_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[MAY.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF359E: "Singapore"
 POTEF359E_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[SIN.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF360E: "Guarantee Hong Kong"
 POTEF360E_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and gurantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400E: "Nordic Doctrine"
 POTEF400E_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member state can adopt this tradition and tactics."
 POTEF401E: "Safeguard the Arctic"
 POTEF401E_desc: "To secure the Freedom of the Seas and its geostrategic position the European Federation needs to control the Arctic."
 POTEF450E: "Mediterranean Doctrine"
 POTEF450E_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member state can adopt this tradition and tactics."
 POTEF451E: "Northern Africa"
 POTEF451E_desc: "To create a convergence zone and a safe harbor for refugees the European Federation needs to improve its relationship to §YNorthern Africa§! and build new strategic outposts there."
 POTEF452E: "Unite Cyprus"
 POTEF452E_desc: "As sovereign member state of the European Federation §Y[CYP.GetNameWithFlag]§! needs to be reunited."
 POTEF500E: "Balkan Doctrine"
 POTEF500E_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member state can adopt this tradition and tactics."
 POTEF501E: "Balkan Infrastructure"
 POTEF501E_desc: "The European Federation needs to develop the infrastructure of the Balkan to preserve the regional peace and secure the Balkan from foreign influence."
 POTEF502E: "Contest the Silk Road"
 POTEF502E_desc: "The European Federation needs to contest China's new silk road and reduce the Chinese influence in Central Asia."
 POTEF503E: "Competitor China"
 POTEF503E_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major compeditor of the European Federation on global level. The European Federation needs to adept its policies to this."
 POTEF504E: "Operation Arrow"
 POTEF504E_desc: "Named after the Arrow War (Second Anglo-Chinese War), Operation Arrow is a plan for a European intervention in §Y[CHI.GetNameWithFlag]§! to stop the Chinese expansion policy."
 POTEF505E: "Asian Allies"
 POTEF505E_desc: "To confront §Y[CHI.GetNameWithFlag]§!, the European Federation needs allies in Asia."
 POTEF506E: "Republik of Korea"
 POTEF506E_desc: "§Y[KOR.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF507E: "Japan"
 POTEF507E_desc: "§Y[JAP.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF550E: "Black Sea Doctrine"
 POTEF550E_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member state can adopt this tactics."
 POTEF551E: "Safeguard the Black Sea"
 POTEF551E_desc: "The Black Sea is the conection of European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552E: "Reintegrate the Breakaway Republics"
 POTEF552E_desc: "§Y[SOV.GetNameWithFlag]§! has violated the sovereignty of various eastern member states of the European Federation by supporting separatist movements and creating Breakway Republics. We need to reintegrate these Russian minions. "
 POTEF553E: "Rival Russia"
 POTEF553E_desc: "§Y[SOV.GetNameWithFlag]§! has become a major rival of the European Federation. We need to impose sanctions on them. "
 POTEF554E: "Operation Charlemagne"
 POTEF554E_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600E: "Caucasus Doctrine"
 POTEF600E_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focuse on a strong defense to fit the new situation. With the Defense Doctrine all member state can adopt this tactics."
 POTEF601E: "European Access"
 POTEF601E_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure needs to be build."
 POTEF650E: "Visegrad Doctrine"
 POTEF650E_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member state can adopt this tradition and tactics."
 POTEF651E: "European Air Defense Network"
 POTEF651E_desc: "The European Federation needs to build an Air Defense Network to secure its Eastern flank."
 POTEF652E: "Eastern Firewall"
 POTEF652E_desc: "The rising influence of §Y[SOV.GetNameWithFlag]§! in the Eastern member states need to be countered."
 POTEF700E: "Baltic Doctrine"
 POTEF700E_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member state can adopt this tradition and tactics."
 POTEF701E: "Safeguard the Baltic Sea"
 POTEF701E_desc: "The Baltic Sea is the island sea of the European Federation and needs to be secured."
 POTEF800E: "Pax Europaea"
 POTEF800E_desc: "The European Federation needs to become the global superpower to enforce world peace."
 USoE001E: "Constitute the new European Nation"
 USoE001E_desc: "The unified European Union needs to constitute itself as a new nation. The Constitution and the Unification Treaties are one thing, but now the people need to fulfill that legal framework with life."
 USoE002E: "A European Officer Corps"
 USoE002E_desc: "In the Union, every member state had its own army and later there was the EuroArmy. We need to create a European Officer Corps with common doctrine and training."
 USoE003E: "European Political Parties"
 USoE003E_desc: "A new nation needs new political parties. The former political parties of the member states have to unify."
 USoE004E: "European Patriotism"
 USoE004E_desc: "A new nation needs its own patriotism and national symbols."
 USoE005E: "The New Great Game"
 USoE005E_desc: "The New Great Game has just begun and Europe is late, while the US, China and Russia already made their first moves."
 USoE006E: "Europe's Heart and Soul"
 USoE006E_desc: "The new nation needs to define its values and standards. Europe needs a Heart and Soul!"
 USoE100E: "A Game of Spheres"
 USoE100E_desc: "When you play the game of spheres, you win or you die. There is no middle ground."
 USoE101E: "Engage the Eagle"
 USoE101E_desc: "The American Eagle needs to be grounded! It has flown far too long over European skies."
 USoE102E: "Brawl with the Bear"
 USoE102E_desc: "We need to strike the Bear before he strikes us."
 USoE103E: "Dance with the Dragon"
 USoE103E_desc: "The Dance with the Dragon is a dangerous game."
 USoE104E: "A Heart of Iron"
 USoE104E_desc: "In ancient times, the blacksmiths would forge an iron throne out of the weapons of the beaten villains. In our days, we just declare Europe has proven its heart of iron and is now the uncontested world ruler! "
 USoE200E: "Peaceful Coexistence"
 USoE200E_desc: "There are sharper swords than those of iron. Why pay with blood if you can pay with money?"
 USoE201E: "America First"
 USoE201E_desc: "We need to respect the America First doctrine if we want that our doctrines are respected."
 USoE202E: "Russosphere"
 USoE202E_desc: "Russia is the protector of all Russian people. That's their sphere of influence, which we need to respect."
 USoE203E: "Shinosphere"
 USoE203E_desc: "China's sphere of influence covers southeast Asia and doesn't bother us. China is our trade partner, not our rival."
 USoE204E: "Eurosphere"
 USoE204E_desc: "We appeased all superpowers of the 21st century, now we have free hands to establish the Eurosphere in Europe, Levant and North Africa."
 USoE300E: "Clash of Civilizations"
 USoE300E_desc: "The Clash of Civilizations was a thesis from American political scientist Samuel P. Huntington, that people's cultural and religious identities will be the primary source of conflict in the post-Cold War world. The future wars will be fought not between countries, but between cultures."
 USoE301E: "The Rest of the West"
 USoE301E_desc: "Europe is the rest of the west. America has left us alone and isolated in the America First doctrine."
 USoE302E: "Cross and Crescent"
 USoE302E_desc: "At Europe's southeast border, the cross clashes with the crescent. Who will prevail: the Western or the Islamic civilization?"
 USoE303E: "The Pope and the Patriarch"
 USoE303E_desc: "Since the Great Schism of 1054, the pope and the Orthodox patriarch have gone different paths. It's time to unite again to defend the Western civilization."
 USoE304E: "Two Crosses"
 USoE304E_desc: "Eastern and Western Christianity need to unite against Islam."
 USoE305E: "Eurasian Alliance"
 USoE305E_desc: "After the dissolution of NATO, Europe can form a new great alliance with its Russian neighbour."
 USoE306E: "Constantinople"
 USoE306E_desc: "Constantinople is part of the West. Europe needs to free it form the Islamic influence."
 USoE307E: "Antioch"
 USoE307E_desc: "The Principality of Antioch was one of the crusader states created during the First Crusade. It belongs to the West and shall be free from Islam once again."
 USoE308E: "Tripoli"
 USoE308E_desc: "The County of Tripoli (1109–1289) was the last of the crusader states. It shall rise again. Europe needs to free the Levant from Islam."
 USoE309E: "Jerusalem"
 USoE309E_desc: "Europe needs to save the Holy City from Islamic influence. The Kingdom of Jerusalem shall guard the holy sites once again."
 USoE310E: "Knights of Malta"
 USoE310E_desc: "Europe needs to free Northern Africa from Islamic influence. Europe will follow the example of Knights of Malta."
 USoE311E: "Arabian Westernization"
 USoE311E_desc: "Some countries on the Arabian Peninsula already have close ties to the West. Europe needs to fully westernize the Arabian Peninsula to have a safe neighbourhood."
 USoE312E: "Indian Westernization"
 USoE312E_desc: "With the colonial legacy, India has traditionally close ties to the West. Europe should deepen this relation to fully westernize India."
 USoE313E: "The Republic of Persia"
 USoE313E_desc: "Iran is one of the major rivals of the West in the Middle East. Europe can stop Iran's conquest for regional hegemony when Europe westernizes Iran to the Republic of Persia."
 USoE320E: "The West vs the Rest"
 USoE320E_desc: "Europe and America are the western superpowers that can match every enemy in the world. With NATO as a base, the West can enforce its global dominance."
 USoE321E: "Asian Westernization"
 USoE321E_desc: "The West needs to focus on the emerging powers in Asia. The West should fight or westernize them."
 USoE322E: "The Four Tigers"
 USoE322E_desc: "The Four Asian Tigers of Hong Kong, Singapore, South Korea and Taiwan always had close ties to the West and fear the emerging Chinese dragon. They could be viable allies of the West in Asia."
 USoE323E: "Japan"
 USoE323E_desc: "After the end of the World War II, Japan was an important ally of the West in Asia. The West needs to continue this close partnership."
 USoE324E: "China"
 USoE324E_desc: "China is the major rival of the West in Asia. If the West can westernize China, there will be no contender for Western hegemony in Asia."
 USoE325E: "Operation Unthinkable 2.0"
 USoE325E_desc: "Operation Unthinkable was a war plan of the British Chiefs of Staff against the Soviet Union ordered by Winston Churchill in May 1945. Together with the former German Wehrmacht, the western allies should launch a surprise attack on the Soviet Union. The West needs to revise that plan to fit the current setup and act in preemptive self-defense against Russia to prevent Russian hegemony in Europe."
 USoE400E: "The Torch of Freedom"
 USoE400E_desc: "Europe needs to carry on the Torch of Freedom! The United States of Europe are a democratic republic which respects the human rights and the rule of law."
 USoE401E: "Digital Democracy"
 USoE401E_desc: "Europe needs to reform its democratic institutions for the digital age. With social media and social networks, the people can directly participate in legislation and government."
 USoE402E: "Hammer and Sickle"
 USoE402E_desc: "Karl Marx and Friedrich Engels, the fathers of Socialism and Marxism, were Europeans. Europe needs to carry on that legacy."
 USoE403E: "EUSSR"
 USoE403E_desc: "The European left trapped the capitalists in the European Union, now the spiritual heir of Karl Marx and Friedrich Engels have the power to establish the EUSSR: the European Union of Soviet Socialist Republics."
 USoE404E: "AI Government"
 USoE404E_desc: "Artificial intelligence has evolved enough to govern a country more efficiently than inefficient and possibly corrupt human politicians. The AI agent of the ruling party will take control and rule the country based on the values of the ruling party."
 USoE500E: "The Green Future"
 USoE500E_desc: "With the undeniable climate change, there is no future but a green future for Europe."
 USoE501E: "Environmental Empire"
 USoE501E_desc: "Europe needs to become an Environmental Empire where economy and environment are no contradiction."
 USoE502E: "Environmental Imperialism"
 USoE502E_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE503E: "North America"
 USoE503E_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE504E: "South America"
 USoE504E_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE505E: "Europe"
 USoE505E_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE506E: "Africa"
 USoE506E_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE507E: "Middle East"
 USoE507E_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE508E: "Asia"
 USoE508E_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE509E: "Oceania"
 USoE509E_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE510E: "Pacific"
 USoE510E_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE600E: "The Cross and the Crown"
 USoE600E_desc: "Europe need to fulfill its legacy and become an empire once again."
 USoE601E: "The New Knights"
 USoE601E_desc: "In a hostile world, the military has taken control in Europe to save its people from corrupt politicians and foreign powers."
 USoE602E: "General of the European Armies"
 USoE602E_desc: "The general staff has decided that Europe will be led by an army general. He will be awarded with the rank of the General of the European Armies."
 USoE603E: "Air Marshal of Europe"
 USoE603E_desc: "The general staff has decided that Europe will be led by an air force general. He will be awarded with the rank of the Air Marshal of Europe."
 USoE604E: "Fleet Admiral of Europe"
 USoE604E_desc: "The general staff has decided that Europe will be led by an admiral. He will be awarded with the rank of the Fleet Admiral of Europe."
 USoE605E: "European Empire"
 USoE605E_desc: "Once again Europe has become an Empire and can defend the interests of its people on global level."
 USoE620E: "The New Emperor"
 USoE620E_desc: "Europe needs a new emperor who leads the continent through the 21st century."
 USoE621E: "Choose a House"
 USoE621E_desc: "Europe has many great houses with a long and glorious history. United for the first time, the continent needs to decide which house should rule in the 21st century."
 USoE622E: "House of Savoy"
 USoE622E_desc: "The House of Savoy is a royal dynasty that was established in 1003 in the historical Savoy region. Through gradual expansion, the family grew in power from ruling a small Alpine county north-west of Italy to absolute rule of the Kingdom of Sicily. Members of the house ruled Sardinia, Italy, Albania, Ethiopia and, for a short period, Spain. The house also claims the titles of Kings of Cyprus, Jerusalem and Armenia."
 USoE623E: "House of Wittelsbach"
 USoE623E_desc: "The House of Wittelsbach is a German-Bavarian dynasty, with branches that have ruled over territories including: Bavaria, Holland, Zeeland, Cologne, Sweden, Romania, Bohemia, Hungary, Denmark, Norway, Greece and the Holy Roman Empire. The line of Jacobite succession, which recognises the right for a Catholic monarch, acknowledges Franz, Hereditary Prince of Bavaria to be the rightful heir as Francis II."
 USoE624E: "House of Borbón-Anjou"
 USoE624E_desc: "The House of Borbón-Anjou is the reigning royal house of the Kingdom of Spain. By the 18th century, members of the Spanish Bourbon dynasty held thrones in Spain, Naples, Sicily, and Parma."
 USoE625E: "House of Bourbon"
 USoE625E_desc: "The House of Bourbon is a European dynasty of French origin, a branch of the Capetian dynasty, the royal House of France. Bourbon kings first ruled France and Navarre in the 16th century."
 USoE626E: "House of Hanover"
 USoE626E_desc: "The House of Hanover is a German royal house that ruled Hanover, Great Britain, and Ireland at various times during the 17th to 20th centuries. The house originated in 1635 as a cadet branch of the House of Brunswick-Lüneburg, growing in prestige until Hanover became an Electorate in 1692."
 USoE627E: "House of Glücksburg"
 USoE627E_desc: "The House of Glücksburg, shortened from House of Schleswig-Holstein-Sonderburg-Glücksburg, is a Dano-German branch of the House of Oldenburg, members of which have reigned at various times in Denmark, Norway, Greece and several northern German states."
 USoE628E: "House of Windsor"
 USoE628E_desc: "The House of Windsor is the reigning royal house of the United Kingdom and the other Commonwealth realms. In 1901, the House of Saxe-Coburg and Gotha succeeded the House of Hanover in the British monarchy. In 1917, the name of the royal house was changed from the German Saxe-Coburg and Gotha to the English Windsor (from Windsor Castle) because of World War I."
 USoE629E: "House of Orange-Nassau"
 USoE629E_desc: "The House of Orange-Nassau is the current reigning house of the Netherlands. A branch of the European House of Nassau, the house has played a central role in the politics and government of the Netherlands and Europe, especially since William the Silent organized the Dutch revolt against Spanish rule, which after the Eighty Years' War (1568–1648) led to an independent Dutch state. "
 USoE630E: "House of Habsburg-Lorraine"
 USoE630E_desc: "The House of Habsburg-Lorraine originated from the marriage in 1736 of Francis III, Duke of Lorraine and Bar, and Maria Theresa of Austria, later successively Queen of Bohemia, Queen of Hungary and Archduchess of Austria. Its members are the legitimate surviving line of the House of Habsburg and the House of Lorraine, inheriting their patrimonial possessions and vocation to the Empire."
 USoE631E: "House of Bonaparte"
 USoE631E_desc: "The House of Bonaparte is a former imperial and royal European dynasty of Italian origin. It was founded in 1804 by Napoleon I. Napoleon turned the Grande Armée against every major European power and dominated continental Europe through a series of military victories. He installed members of his family on the thrones of client states, extending the power of the dynasty."
 USoE632E: "House of Hohenzollern"
 USoE632E_desc: "The House of Hohenzollern is a German former royal dynasty whose members were variously princes, electors, kings and emperors of Hohenzollern, Brandenburg, Prussia, the German Empire, and Romania. The family arose in the area around the town of Hechingen in Swabia during the 11th century and took their name from Hohenzollern Castle."
 USoE633E: "Choose a Palace "
 USoE633E_desc: "The new Emperor of Europe needs a representative palace to rule."
 USoE634E: "Quirinal Palace"
 USoE634E_desc: "The Quirinal Palace is a historic building in Rome, Italy, and serves as one of the three current official residences of the President of the Italian Republic. The Quirinal Palace was selected by Napoleon to be his residence par excellence as Emperor. However, its permanence never took place because of the French defeat in 1814 and the subsequent European Restoration."
 USoE635E: "Neuschwanstein Castle"
 USoE635E_desc: "Neuschwanstein Castle is a 19th-century Romanesque Revival palace on a rugged hill in southwest Bavaria, Germany. The palace was commissioned by King Ludwig II of Bavaria. The castle was intended as a home for the King, until he died in 1886. It was open to the public shortly after his death. Since then, more than 61 million people have visited Neuschwanstein Castle."
 USoE636E: "Royal Palace of Madrid"
 USoE636E_desc: "The Royal Palace of Madrid is the official residence of the Spanish royal family at the city of Madrid, although now used only for state ceremonies. The palace has 135,000 square metres of floor space and contains 3,418 rooms. It is the largest functioning royal palace and the largest by floor area in Europe."
 USoE637E: "Palace of Versailles"
 USoE637E_desc: "The Palace of Versailles was the principal royal residence of France from 1682, under Louis XIV, until the start of the French Revolution in 1789, under Louis XVI. The palace is now a historical monument and UNESCO World Heritage site, notable especially for the ceremonial Hall of Mirrors and the vast Gardens of Versailles with fountains, canals, and geometric flower beds and groves."
 USoE638E: "Buckingham Palace"
 USoE638E_desc: "Buckingham Palace is the London residence and administrative headquarters of the monarch of the United Kingdom. Located in the City of Westminster, the palace is often at the centre of state occasions and royal hospitality. It has been a focal point for the British people at times of national rejoicing and mourning."
 USoE639E: "Hofburg"
 USoE639E_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty rulers and today serves as the official residence and workplace of the President of Austria. It is located in the centre of Vienna and was built in the 13th century and expanded several times afterwards."
 USoE640E: "Sanssouci"
 USoE640E_desc: "Sanssouci was the summer palace of Frederick the Great, King of Prussia, in Potsdam, near Berlin. It is often counted among the German rivals of Versailles. While Sanssouci is in the more intimate Rococo style and is far smaller than its French Baroque counterpart, it too is notable for the numerous temples and follies in the park."
 USoE641E: "A New Palace"
 USoE641E_desc: "A new emperor needs an new palace, not a historic monument. Let's build a new palace with modern architecture in Brussels."
 USoE642E: "Coronation"
 USoE642E_desc: "Europe needs to prepare for the coronation of the new Emperor. But first, it needs to decide which crown the emperor should wear and who should do the coronation."
 USoE643E: "The Imperial Crown"
 USoE643E_desc: "The new empire is the continuation and the legacy of the Holy Roman Empire, so the emperor needs to wear the Crown of the Holy Roman Empire."
 USoE644E: "A New Ecumenical Crown"
 USoE644E_desc: "A new empire and a new emperor need a new crown and not a historic relict."
 USoE645E: "By the Pope"
 USoE645E_desc: "The new emperor by the grace of god needs to be crowned by the pope."
 USoE646E: "By the People"
 USoE646E_desc: "The new Emperor needs to be crowned by the people, so let's call for an election to legitimate His Majesty's rule."
 USoE647E: "The Holy European Empire"
 USoE647E_desc: "The emperor is crowned and the Holy European Empire is established."
 USoE700E: "Pax Occidentalis"
 USoE700E_desc: "Europe has acquired global dominance and can enforce world peace. This era will be called Pax Occidentalis."
 USoE701E: "Guardians of World Peace"
 USoE701E_desc: "Europe, America, Russia and China have settled their spheres of influence. Every superpower enforces peace in their sphere and so they are the guardians of world peace."
 
##################### European Union Module A1 #####################
 EU001D: "EU Policies"
 EU001D_desc: "The policies of §Y[EUU.GetFlag] The EU§! are determined by the Union’s values, objectives and principles. Because the EU started as an economic community, economic policy is still an important area in the EU. In keeping with its values, the EU seeks to promote the wellbeing, security and interests of the citizens. The EU wishes to keep the economy stable and competitive. The EU tries to reform itself..."
 EU002D: "EU Candidate"
 EU002D_desc: "Before applying for membership to §Y[EUU.GetFlag] The European Union§! We need to get EU Candidate status. The will be hard negotiations with the member states of §Y[EUU.GetFlag] The European Union§!. We will need a lot of influence."
 EU100D: "EU Reforms"
 EU100D_desc: "The member states try to reform §Y[EUU.GetFlag] The European Union§! to strengthen the European integration."
 EU101D: "Charter of Fundamental Rights of the European Union"
 EU101D_desc: "\"The peoples of Europe, in creating an ever closer union among them, are resolved to share a peaceful future based on common values. Conscious of its spiritual and moral heritage, the Union is founded on the indivisible, universal values of human dignity, freedom, equality and solidarity; it is based on the principles of democracy and the rule of law.\" - Preamble of the CFR"
 EU102D: "European Convention"
 EU102D_desc: "Following the Laeken declaration the European Council has decided to convene a Convention on the future of the Union to make a decisive step for the citizen towards a simpler Union, one that is stronger in the pursuit of its essential objectives and more definitely present in the world."
 EU103D: "European Constitution"
 EU103D_desc: "The European Convention ended with the Draft of the Treaty establishing a Constitution for Europe. This international treaty would replace the existing European treaties to create a consolidated constitution for §Y[EUU.GetFlag] The European Union§! and expanded Qualified Majority Voting into policy areas which had previously been decided by unanimity among member states."
 EU104D: "Treaty of Lisbon"
 EU104D_desc: "The process leading to the Lisbon Treaty is a result of the negative outcome of the ratification of the European Constitution. Treaty of Lisbon amending the Treaty on European Union and the Treaty establishing the European Community. The last is renamed the Treaty on the Functioning of the European Union."
 EU105D: "European External Action Service"
 EU105D_desc: "The European External Action Service is the European Union's diplomatic service. It helps the EU's foreign affairs chief – the High Representative for Foreign Affairs and Security Policy – carry out the Union's Common Foreign and Security Policy."
 EU200D: "EU Fiscal Policies"
 EU200D_desc: "Fiscal policies have a significant impact on economic growth, macroeconomic stability and inflation. Key aspects in this respect are the level and composition of government expenditure and revenue, budget deficits and government debt. The need for fiscal discipline is even stronger in a monetary union, such as the euro area, which is made of sovereign states that retain responsibility for their fiscal policies."
 EU201D: "ECB Intervention"
 EU201D_desc: "To implement its monetary policy decisions, the Governing Council of the ECB has adopted a set of monetary policy instruments and procedures as laid down in the General documentation on Eurosystem monetary policy instruments and procedures."
 EU202D: "European Banking Union"
 EU202D_desc: "In response to the recent financial crisis the European Banking Union was created for a safer financial sector for the single market. These initiatives form a single rulebook for all financial actors in the EU member states. They include stronger prudential requirements for banks, improved protection for depositors and rules for managing failing banks."
 EU203D: "Eurobonds"
 EU203D_desc: "Eurobonds are a new option of financing public debt. Such common issuance of bonds by the eurozone members would imply a significant deepening of the monetary union. It would create new means through which governments finance their debt, by offering safe and liquid investment opportunities for savers and financial institutions and by setting up a Eurobond market that matches the US bond market."
 EU204D: "European Financial Stability Facility (EFSF)"
 EU204D_desc: "The EFSF was created as a temporary crisis resolution mechanism by the euro area member states in European debt crisis and provided financial assistance to several member states. This was financed by the EFSF through the issuance of EFSF bonds and other debt instruments on capital markets. The EFSF does not provide any further financial assistance, as this task is now performed solely by the ESM."
 EU205D: "European Stability Mechanism (ESM)"
 EU205D_desc: "The ESM’s mission is to provide financial assistance to euro area countries experiencing or threatened by severe financing problems. This assistance is granted only if it is proven necessary to safeguard the financial stability of the euro area as a whole and of ESM Members."
 EU206D: "Fiscal Union"
 EU206D_desc: "Fiscal union involves member states sharing the same common budget. It means spending and tax levels would be taken by a central fiscal authority. Fiscal union is proposed as a step for further European integration. It would mean a central European authority would set spending and tax rates for all member states."
 EU207D: "European Economic Government"
 EU207D_desc: "A European Economic Government would make possible a common fiscal and active economic policy in the EU. It would give §Y[EUU.GetFlag] The European Union§! an own tax authority and a central authority would set minimum wages for the member states."
 EU208D: "European Minister of Economy and Finance"
 EU208D_desc: "A European Minister of Economy and Finance combines the policies and powers established by the Fiscal Union and the European Economic Government into one office."
 EU300D: "EU Defense Policies"
 EU300D_desc: "The Common Security and Defence Policy (CSDP) enables the Union to take a leading role in peace-keeping operations, conflict prevention and in the strengthening of the international security. It is an integral part of the EU's comprehensive approach towards crisis management, drawing on civilian and military assets."
 EU301D: "European Defence Agency (EDA)"
 EU301D_desc: "The European Defence Agency was established to support the member states and §Y[EUU.GetFlag] The European Union§! in their effort to improve European defence capabilities in the field of crisis management and to sustain the European Security and Defence Policy as it stands now and develops in the future."
 EU302D: "Permanent Structured Cooperation (PESCO)"
 EU302D_desc: "PESCO allows thus willing and able member states to jointly plan, develop and invest in shared capability projects, and enhance the operational readiness and contribution of their armed forces. The aim is to jointly develop a coherent full spectrum force package and make the capabilities available to member states for national and multinational missions and operations."
 EU303D: "European Defence Fund"
 EU303D_desc: "The European Defence Fund will provide a key contribution to Europe’s strategic autonomy, protecting and defending its citizens. It will promote defence cooperation among companies and between EU countries to foster innovation and develop state-of-the-art defence technology and products. The fund will coordinate, supplement and amplify national investments in defence."
 EU304D: "European Security Council"
 EU304D_desc: "A ESC would make the EU better prepared for making decisions about international politics. If the EU does not manage to take and implement coherent decisions more quickly, their ability to enforce EU rules and strengthen multilateral formats will be weakened. The EU’s diplomatic, financial and military resources should therefore be supplemented by a format for more effective intergovernmental cooperation."
 EU305D: "EuroArmy"
 EU305D_desc: "To strength the military capabilities of §Y[EUU.GetFlag] The European Union§! the member states can draft common armed forces. These forces will be known as §YEuroArmy§!"
 EU306D: "EuroNavy"
 EU306D_desc: "With multinational fleets and task forces becoming more common and important in the 21st century the member states of §Y[EUU.GetFlag] The European Union§! can join their forces and transfer their warships to a unified European Naval Command known as §YEuroNavy§!."
 EU307D: "EU Permanent Member of the UNSC"
 EU307D_desc: "The member states have decided that the EU should be a permanent member of the United Nations Security Council (UNSC). This is done by reforming the UNSC or by transferring the seat(s) of the member state(s) already being UNSC member(s) to the EU."
 EU308D: "EU Nuclear Power"
 EU308D_desc: "Becoming a nuclear power will strength the political power of the EU and the influence of the Union in the world. The Union will acquire the nuclear weapons by transferring and sharing the nuclear weapons of their member states or by developing own nuclear warheads."
 EU400D: "EU Secondary Legislation"
 EU400D_desc: "The EU treaties are binding agreements between EU member states set out EU objectives, rules for EU institutions, how decisions are made and the relationship between the EU and its members. Treaties are known as primary law. The body of law that comes from the principles and objectives of the treaties is known as secondary law (regulations, directives, decisions, recommendations and opinions)."
 EU401D: "General Data Protection Regulation"
 EU401D_desc: "The EU General Data Protection Regulation (GDPR) is designed to: harmonize data privacy laws across Europe, protect and empower all EU citizens data privacy and reshape the way organizations across the region approach data privacy."
 EU402D: "Directive on Copyright in the Digital Single Market"
 EU402D_desc: "Digital technologies have radically changed the way creative content is produced, distributed and accessed. We are adapting the EU copyright rules to new consumer behaviours in a Europe which values its cultural diversity."
 EU403D: "Dublin II Regulation"
 EU403D_desc: "The Dublin II Regulation establishes the principle that only one member state is responsible for examining an asylum application. The objective is to avoid asylum seekers from being sent from one country to another, and also to prevent abuse of the system by the submission of several applications for asylum by one person."
 EU404D: "Relocation and Resettlement of Asylum Seekers"
 EU404D_desc: "Asylum seekers with a high chance of having their applications successfully processed are relocated from Greece and Italy, where they have arrived, to other member states where they will have their asylum applications processed. If these applications are successful, the applicants will be granted refugee status with the right to reside in the member state to which they are relocated."
 EU405D: "EU–Turkey deal"
 EU405D_desc: "§Y[EUU.GetFlag] The European Union§! and [TUR.GetNameWithFlag] will negotiate an agreement aimed at stopping the flow of irregular migration via Turkey to Europe. All new irregular migrants and asylum seekers arriving from Turkey to the Greek islands and whose applications for asylum have been declared inadmissible should be returned to Turkey. §Y[EUU.GetFlag] The European Union§! will pay 3 billion Euro for the Facility for Refugees in Turkey."
 EU406D: "European Asylum Agency"
 EU406D_desc: "The EU Commission proposed a future EU Asylum Agency equipped with the necessary mandate, tools and financial means needed to provide a rapid and full service to member states throughout the asylum procedure."
 EU407D: "Frontex"
 EU407D_desc: "Frontex helps EU countries and Schengen associated countries manage their external borders. It also to helps to harmonise border controls across the EU. The agency facilitates cooperation between border authorities in each EU country, providing technical support and expertise."
 EU408D: "European Border and Coast Guard Agency"
 EU408D_desc: "Frontex becomes the European Border and Coast Guard Agency. Europe’s external borders have seen an unprecedented rise in the number of migrants and refugees wishing to enter the EU in recent years. Countries that have an external border have sole responsibility for border control. But Frontex can provide additional technical support for EU countries facing severe migratory pressure."
 EU500D: "European Commission Policies "
 EU500D_desc: "European Commission Policies "
 EU600D: "EU Enlargement"
 EU600D_desc: "Enlargement policy applies to countries currently aspiring to join the EU and potential candidates. The prospect of membership is a powerful stimulus for democratic and economic reforms in countries that want to become EU members."
 EU601D: "2004 enlargement of the European Union"
 EU601D_desc: "On 1 May 2004 ten new countries with a combined population of almost 75 million joined the EU. The 25-member EU now has 450 million citizens and includes three former Soviet republics (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! and §Y[LIT.GetNameWithFlag]§!), four former satellites of the USSR (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! and §Y[SLO.GetNameWithFlag]§!), a former Yugoslav republic (§Y[SLV.GetNameWithFlag]§!) and two Mediterranean islands (§Y[CYP.GetNameWithFlag]§! and §Y[MLT.GetNameWithFlag]§!)."
 EU602D: "2007 enlargement of the European Union"
 EU602D_desc: "Two more countries from eastern Europe - §Y[BUL.GetNameWithFlag]§!and §Y[ROM.GetNameWithFlag]§! - join the EU, bringing the number of member states to 27."
 EU603D: "2013 enlargement of the European Union"
 EU603D_desc: "2013 §Y[CRO.GetNameWithFlag]§! joined the EU, bringing the number of member states to 28."
 EU700D: "Withdrawal Policies"
 EU700D_desc: "With rising Euroscepticism throughout the Union some member states will think about leaving §Y[EUU.GetFlag] The European Union§!."
 EU701D: "Article 50"
 EU701D_desc: "\"Any Member State may decide to withdraw from the Union in accordance with its own constitutional requirements.\"\n- Article 50(1), Treaty on European Union.\nFirst Article 50 was drafted for the Constitutional Treaty for the European Union. Following the failure of the ratification of the Constitution, the clause was incorporated into the Treaty of Lisbon."
 EU702D: "Withdrawal Treaty"
 EU702D_desc: "Withdrawal from §Y[EUU.GetFlag] The European Union§! is a complex process where the leaving country has to adapt its national law for time when the EU law expires due to the leaving of the Union. The leaving country and the §Y[EUU.GetFlag] The European Union§! have to reach an agreement on their future relationship."
 EU703D: "No Deal Exit"
 EU704D: "Rejoin"
 EU704D_desc: "Leaving the Union doesn't mean leaving forever. A country can rejoin after an Exit."EU703D_desc: "If a Withdrawal Treaty with §Y[EUU.GetFlag] The European Union§! is not reached, emergency measures have to be taken to protect our people from the chaos of a No Deal Exit."
 EU110D: "Federalisation of the European Union"
 EU110D_desc: "The process of European integration has reached a state where any further integration will lead to a Federalisation of §Y[EUU.GetFlag] The European Union§!."
 EU111D: "United States of Europe"
 EU111D_desc: "After more than 70 years of European integration the member states of §Y[EUU.GetFlag] The European Union§! have decided to give up their sovereignty and form the §Y[EUU.GetFlag] The United States of Europe§!."
 EU112D: "European Federation"
 EU112D_desc: "The member states of §Y[EUU.GetFlag] The European Union§! have decided to transfer the Union into §Y[EUU.GetFlag] The European Federation§! with the Qualified Majority Voting as fundamental principle and headed by the §YPresident of the European Federation§!."
 EU113D: "Europe of Fatherlands"
 EU113D_desc: "Any further European integration will jeopardise the cultural heritage, the national Identities and the sovereignty of the member states. Europe is a Europe of Fatherlands, so the European integration has to stop at this stage."
 EU604D: "Future enlargement of the European Union"
 EU604D_desc: "Future enlargement of the European Union"
 EU605D: "Western Balkans Enlargement"
 EU605D_desc: "The Western Balkan countries of §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! and §Y[KOS.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU606D: "Turkey"
 EU606D_desc: "§Y[TUR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU607D: "Black Sea Enlargement"
 EU607D_desc: "The Black Sea countries of §Y[MLV.GetNameWithFlag]§! and §Y[UKR.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU608D: "Caucasus Enlargement"
 EU608D_desc: "The Caucasus countries of §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! and §Y[GEO.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU609D: "European Economic Area"
 EU609D_desc: "The non-EU countries of the European Economic Area (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! and §Y[ICE.GetNameWithFlag]§!) become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU610D: "Belarus"
 EU610D_desc: "§Y[BLR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU611D: "Internal Enlargement"
 EU611D_desc: "Internal enlargement is the process of new member states arising from the break-up of or secession from an existing member state. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! and §Y[WAS.GetNameWithFlag]§! can become candidates for joining §Y[EUU.GetFlag] The European Union§!, when they become independent."
 POTEF001D: "President of the  European Federation"
 POTEF001D_desc: "The §YPresident of the European Federation (POTEF)§! is the paramount leader of Europe. Therefore the President of the European Federation has the power to make the decisive strategic decisions for the whole Federation."
 POTEF100D: "Alpine Doctrine"
 POTEF100D_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member state can adopt this tradition and tactics."
 POTEF101D: "The Integrity of Creation"
 POTEF101D_desc: "To save and conserve the Integrity of Creation the European Federation adapts its policies."
 POTEF102D: "Environmental Imperialism"
 POTEF102D_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF103D: "North America"
 POTEF103D_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF104D: "South America"
 POTEF104D_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF105D: "Europe"
 POTEF105D_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF106D: "Africa"
 POTEF106D_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF107D: "Middle East"
 POTEF107D_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF108D: "Asia"
 POTEF108D_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF109D: "Oceania"
 POTEF109D_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF110D: "Pacific"
 POTEF110D_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF150D: "German Doctrine"
 POTEF150D_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member state can adopt this tradition and tactics."
 POTEF151D: "Empire of Trade"
 POTEF151D_desc: "The European Federation will become an Empire of Trade."
 POTEF200D: "French Doctrine"
 POTEF200D_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member state can adopt this tradition and tactics."
 POTEF201D: "Imperial Power"
 POTEF201D_desc: "The European Federation stands in the tradition of its imperial predecessors."
 POTEF202D: "Empire of Freedom"
 POTEF202D_desc: "The European Federation will become an Empire of Freedom."
 POTEF203D: "America: Ally or Adversary"
 POTEF203D_desc: "America and Europe have been allies for most of the 20th century. With the recent political changes in §Y[USA.GetNameWithFlag]§! this has been questioned…"
 POTEF204D: "NATO Legacy"
 POTEF204D_desc: "In the Tradition of the peacekeeping Legacy of NATO §Y[USA.GetNameWithFlag]§! and the §YEDU§! form a new alliance."
 POTEF205D: "Trump's Legacy"
 POTEF205D_desc: "§Y[USA.GetNameWithFlag]§! went form an ally to an adversary. Europe has to react to this decisive strategic change."
 POTEF206D: "Break the Wall"
 POTEF206D_desc: "To counter the American threat to European sovereignty, the general staff of the §YEDU§! has drafted a plan to ally with §Y[MEX.GetNameWithFlag]§! and invade §Y[USA.GetNameWithFlag]§! from the South."
 POTEF207D: "Buster's Resurrection"
 POTEF207D_desc: "To counter the US threat to Europe, the general staff of the §YEDU§! has proposed to ally with §Y[CAN.GetNameWithFlag]§! and revise the Defence Scheme No. 1, a plan created by Canadian Lt Col James 'Buster' Sutherland Brown, for a Canadian pre-emptive attack against the US in the event of an imminent conflict between the US and the British Empire. With this plan the §YEDU§! can launch an invasion from the North on §Y[USA.GetFlag] the US§!."
 POTEF250D: "Benelux Doctrine"
 POTEF250D_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member state can adopt this tactics."
 POTEF251D: "Liberal Legacy"
 POTEF251D_desc: "The European Federation honors its Liberal Legacy."
 POTEF252D: "Safeguard the old Traderouts"
 POTEF252D_desc: "The European Federation needs to safeguard the old Traderouts to the Caribbean, Africa and the former Dutch East Indies."
 POTEF253D: "Indonesia"
 POTEF253D_desc: "The European Federation needs to improve its relationship to the former Dutch colony §Y[IND.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF300D: "Iberian Doctrine"
 POTEF300D_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member state can adopt this tradition and tactics."
 POTEF301D: "Latin Cousins"
 POTEF301D_desc: "The European Federation needs to improve its relationship to the former colonies in South America."
 POTEF302D: "Mexico"
 POTEF302D_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[MEX.GetNameWithFlag]§! and build new strategic outposts in Central America."
 POTEF303D: "Greater Colombia"
 POTEF303D_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[COL.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF304D: "Central America"
 POTEF304D_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in §YCentral America§! and build new strategic outposts there."
 POTEF305D: "Southern Cone"
 POTEF305D_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in the §YSouthern Cone of South America§! and build new strategic outposts there."
 POTEF306D: "Brazil"
 POTEF306D_desc: "The European Federation needs to improve its relationship to the former Portuguese  colony §Y[BRA.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF350D: "British Doctrine"
 POTEF350D_desc: "The §YBritain§! traditionally focused on strong a strong Navy. With the Naval Doctrine all member state can adopt this tradition and tactics."
 POTEF351D: "Safeguard the North Atlantic"
 POTEF351D_desc: "To secure the Freedom of the Seas and free trade the European Federation needs to control the North Atlantic."
 POTEF352D: "Commonwealth Legacy"
 POTEF352D_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominions."
 POTEF353D: "Canada"
 POTEF353D_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[CAN.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF354D: "Australia"
 POTEF354D_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[AST.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF355D: "New Zealand"
 POTEF355D_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[NZL.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF356D: "Safeguard the North Sea"
 POTEF356D_desc: "The North Sea is the backyard of European Federation and needs to be secured."
 POTEF357D: "Malaya Legacy"
 POTEF357D_desc: "The European Federation needs to improve its relationship to the former British colonies of Malaya."
 POTEF358D: "Malaysia"
 POTEF358D_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[MAY.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF359D: "Singapore"
 POTEF359D_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[SIN.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF360D: "Guarantee Hong Kong"
 POTEF360D_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and gurantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400D: "Nordic Doctrine"
 POTEF400D_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member state can adopt this tradition and tactics."
 POTEF401D: "Safeguard the Arctic"
 POTEF401D_desc: "To secure the Freedom of the Seas and its geostrategic position the European Federation needs to control the Arctic."
 POTEF450D: "Mediterranean Doctrine"
 POTEF450D_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member state can adopt this tradition and tactics."
 POTEF451D: "Northern Africa"
 POTEF451D_desc: "To create a convergence zone and a safe harbor for refugees the European Federation needs to improve its relationship to §YNorthern Africa§! and build new strategic outposts there."
 POTEF452D: "Unite Cyprus"
 POTEF452D_desc: "As sovereign member state of the European Federation §Y[CYP.GetNameWithFlag]§! needs to be reunited."
 POTEF500D: "Balkan Doctrine"
 POTEF500D_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member state can adopt this tradition and tactics."
 POTEF501D: "Balkan Infrastructure"
 POTEF501D_desc: "The European Federation needs to develop the infrastructure of the Balkan to preserve the regional peace and secure the Balkan from foreign influence."
 POTEF502D: "Contest the Silk Road"
 POTEF502D_desc: "The European Federation needs to contest China's new silk road and reduce the Chinese influence in Central Asia."
 POTEF503D: "Competitor China"
 POTEF503D_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major compeditor of the European Federation on global level. The European Federation needs to adept its policies to this."
 POTEF504D: "Operation Arrow"
 POTEF504D_desc: "Named after the Arrow War (Second Anglo-Chinese War), Operation Arrow is a plan for a European intervention in §Y[CHI.GetNameWithFlag]§! to stop the Chinese expansion policy."
 POTEF505D: "Asian Allies"
 POTEF505D_desc: "To confront §Y[CHI.GetNameWithFlag]§!, the European Federation needs allies in Asia."
 POTEF506D: "Republik of Korea"
 POTEF506D_desc: "§Y[KOR.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF507D: "Japan"
 POTEF507D_desc: "§Y[JAP.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF550D: "Black Sea Doctrine"
 POTEF550D_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member state can adopt this tactics."
 POTEF551D: "Safeguard the Black Sea"
 POTEF551D_desc: "The Black Sea is the conection of European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552D: "Reintegrate the Breakaway Republics"
 POTEF552D_desc: "§Y[SOV.GetNameWithFlag]§! has violated the sovereignty of various eastern member states of the European Federation by supporting separatist movements and creating Breakway Republics. We need to reintegrate these Russian minions. "
 POTEF553D: "Rival Russia"
 POTEF553D_desc: "§Y[SOV.GetNameWithFlag]§! has become a major rival of the European Federation. We need to impose sanctions on them. "
 POTEF554D: "Operation Charlemagne"
 POTEF554D_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600D: "Caucasus Doctrine"
 POTEF600D_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focuse on a strong defense to fit the new situation. With the Defense Doctrine all member state can adopt this tactics."
 POTEF601D: "European Access"
 POTEF601D_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure needs to be build."
 POTEF650D: "Visegrad Doctrine"
 POTEF650D_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member state can adopt this tradition and tactics."
 POTEF651D: "European Air Defense Network"
 POTEF651D_desc: "The European Federation needs to build an Air Defense Network to secure its Eastern flank."
 POTEF652D: "Eastern Firewall"
 POTEF652D_desc: "The rising influence of §Y[SOV.GetNameWithFlag]§! in the Eastern member states need to be countered."
 POTEF700D: "Baltic Doctrine"
 POTEF700D_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member state can adopt this tradition and tactics."
 POTEF701D: "Safeguard the Baltic Sea"
 POTEF701D_desc: "The Baltic Sea is the island sea of the European Federation and needs to be secured."
 POTEF800D: "Pax Europaea"
 POTEF800D_desc: "The European Federation needs to become the global superpower to enforce world peace."
 USoE001D: "Constitute the new European Nation"
 USoE001D_desc: "The unified European Union needs to constitute itself as a new nation. The Constitution and the Unification Treaties are one thing, but now the people need to fulfill that legal framework with life."
 USoE002D: "A European Officer Corps"
 USoE002D_desc: "In the Union, every member state had its own army and later there was the EuroArmy. We need to create a European Officer Corps with common doctrine and training."
 USoE003D: "European Political Parties"
 USoE003D_desc: "A new nation needs new political parties. The former political parties of the member states have to unify."
 USoE004D: "European Patriotism"
 USoE004D_desc: "A new nation needs its own patriotism and national symbols."
 USoE005D: "The New Great Game"
 USoE005D_desc: "The New Great Game has just begun and Europe is late, while the US, China and Russia already made their first moves."
 USoE006D: "Europe's Heart and Soul"
 USoE006D_desc: "The new nation needs to define its values and standards. Europe needs a Heart and Soul!"
 USoE100D: "A Game of Spheres"
 USoE100D_desc: "When you play the game of spheres, you win or you die. There is no middle ground."
 USoE101D: "Engage the Eagle"
 USoE101D_desc: "The American Eagle needs to be grounded! It has flown far too long over European skies."
 USoE102D: "Brawl with the Bear"
 USoE102D_desc: "We need to strike the Bear before he strikes us."
 USoE103D: "Dance with the Dragon"
 USoE103D_desc: "The Dance with the Dragon is a dangerous game."
 USoE104D: "A Heart of Iron"
 USoE104D_desc: "In ancient times, the blacksmiths would forge an iron throne out of the weapons of the beaten villains. In our days, we just declare Europe has proven its heart of iron and is now the uncontested world ruler! "
 USoE200D: "Peaceful Coexistence"
 USoE200D_desc: "There are sharper swords than those of iron. Why pay with blood if you can pay with money?"
 USoE201D: "America First"
 USoE201D_desc: "We need to respect the America First doctrine if we want that our doctrines are respected."
 USoE202D: "Russosphere"
 USoE202D_desc: "Russia is the protector of all Russian people. That's their sphere of influence, which we need to respect."
 USoE203D: "Shinosphere"
 USoE203D_desc: "China's sphere of influence covers southeast Asia and doesn't bother us. China is our trade partner, not our rival."
 USoE204D: "Eurosphere"
 USoE204D_desc: "We appeased all superpowers of the 21st century, now we have free hands to establish the Eurosphere in Europe, Levant and North Africa."
 USoE300D: "Clash of Civilizations"
 USoE300D_desc: "The Clash of Civilizations was a thesis from American political scientist Samuel P. Huntington, that people's cultural and religious identities will be the primary source of conflict in the post-Cold War world. The future wars will be fought not between countries, but between cultures."
 USoE301D: "The Rest of the West"
 USoE301D_desc: "Europe is the rest of the west. America has left us alone and isolated in the America First doctrine."
 USoE302D: "Cross and Crescent"
 USoE302D_desc: "At Europe's southeast border, the cross clashes with the crescent. Who will prevail: the Western or the Islamic civilization?"
 USoE303D: "The Pope and the Patriarch"
 USoE303D_desc: "Since the Great Schism of 1054, the pope and the Orthodox patriarch have gone different paths. It's time to unite again to defend the Western civilization."
 USoE304D: "Two Crosses"
 USoE304D_desc: "Eastern and Western Christianity need to unite against Islam."
 USoE305D: "Eurasian Alliance"
 USoE305D_desc: "After the dissolution of NATO, Europe can form a new great alliance with its Russian neighbour."
 USoE306D: "Constantinople"
 USoE306D_desc: "Constantinople is part of the West. Europe needs to free it form the Islamic influence."
 USoE307D: "Antioch"
 USoE307D_desc: "The Principality of Antioch was one of the crusader states created during the First Crusade. It belongs to the West and shall be free from Islam once again."
 USoE308D: "Tripoli"
 USoE308D_desc: "The County of Tripoli (1109–1289) was the last of the crusader states. It shall rise again. Europe needs to free the Levant from Islam."
 USoE309D: "Jerusalem"
 USoE309D_desc: "Europe needs to save the Holy City from Islamic influence. The Kingdom of Jerusalem shall guard the holy sites once again."
 USoE310D: "Knights of Malta"
 USoE310D_desc: "Europe needs to free Northern Africa from Islamic influence. Europe will follow the example of Knights of Malta."
 USoE311D: "Arabian Westernization"
 USoE311D_desc: "Some countries on the Arabian Peninsula already have close ties to the West. Europe needs to fully westernize the Arabian Peninsula to have a safe neighbourhood."
 USoE312D: "Indian Westernization"
 USoE312D_desc: "With the colonial legacy, India has traditionally close ties to the West. Europe should deepen this relation to fully westernize India."
 USoE313D: "The Republic of Persia"
 USoE313D_desc: "Iran is one of the major rivals of the West in the Middle East. Europe can stop Iran's conquest for regional hegemony when Europe westernizes Iran to the Republic of Persia."
 USoE320D: "The West vs the Rest"
 USoE320D_desc: "Europe and America are the western superpowers that can match every enemy in the world. With NATO as a base, the West can enforce its global dominance."
 USoE321D: "Asian Westernization"
 USoE321D_desc: "The West needs to focus on the emerging powers in Asia. The West should fight or westernize them."
 USoE322D: "The Four Tigers"
 USoE322D_desc: "The Four Asian Tigers of Hong Kong, Singapore, South Korea and Taiwan always had close ties to the West and fear the emerging Chinese dragon. They could be viable allies of the West in Asia."
 USoE323D: "Japan"
 USoE323D_desc: "After the end of the World War II, Japan was an important ally of the West in Asia. The West needs to continue this close partnership."
 USoE324D: "China"
 USoE324D_desc: "China is the major rival of the West in Asia. If the West can westernize China, there will be no contender for Western hegemony in Asia."
 USoE325D: "Operation Unthinkable 2.0"
 USoE325D_desc: "Operation Unthinkable was a war plan of the British Chiefs of Staff against the Soviet Union ordered by Winston Churchill in May 1945. Together with the former German Wehrmacht, the western allies should launch a surprise attack on the Soviet Union. The West needs to revise that plan to fit the current setup and act in preemptive self-defense against Russia to prevent Russian hegemony in Europe."
 USoE400D: "The Torch of Freedom"
 USoE400D_desc: "Europe needs to carry on the Torch of Freedom! The United States of Europe are a democratic republic which respects the human rights and the rule of law."
 USoE401D: "Digital Democracy"
 USoE401D_desc: "Europe needs to reform its democratic institutions for the digital age. With social media and social networks, the people can directly participate in legislation and government."
 USoE402D: "Hammer and Sickle"
 USoE402D_desc: "Karl Marx and Friedrich Engels, the fathers of Socialism and Marxism, were Europeans. Europe needs to carry on that legacy."
 USoE403D: "EUSSR"
 USoE403D_desc: "The European left trapped the capitalists in the European Union, now the spiritual heir of Karl Marx and Friedrich Engels have the power to establish the EUSSR: the European Union of Soviet Socialist Republics."
 USoE404D: "AI Government"
 USoE404D_desc: "Artificial intelligence has evolved enough to govern a country more efficiently than inefficient and possibly corrupt human politicians. The AI agent of the ruling party will take control and rule the country based on the values of the ruling party."
 USoE500D: "The Green Future"
 USoE500D_desc: "With the undeniable climate change, there is no future but a green future for Europe."
 USoE501D: "Environmental Empire"
 USoE501D_desc: "Europe needs to become an Environmental Empire where economy and environment are no contradiction."
 USoE502D: "Environmental Imperialism"
 USoE502D_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE503D: "North America"
 USoE503D_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE504D: "South America"
 USoE504D_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE505D: "Europe"
 USoE505D_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE506D: "Africa"
 USoE506D_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE507D: "Middle East"
 USoE507D_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE508D: "Asia"
 USoE508D_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE509D: "Oceania"
 USoE509D_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE510D: "Pacific"
 USoE510D_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE600D: "The Cross and the Crown"
 USoE600D_desc: "Europe need to fulfill its legacy and become an empire once again."
 USoE601D: "The New Knights"
 USoE601D_desc: "In a hostile world, the military has taken control in Europe to save its people from corrupt politicians and foreign powers."
 USoE602D: "General of the European Armies"
 USoE602D_desc: "The general staff has decided that Europe will be led by an army general. He will be awarded with the rank of the General of the European Armies."
 USoE603D: "Air Marshal of Europe"
 USoE603D_desc: "The general staff has decided that Europe will be led by an air force general. He will be awarded with the rank of the Air Marshal of Europe."
 USoE604D: "Fleet Admiral of Europe"
 USoE604D_desc: "The general staff has decided that Europe will be led by an admiral. He will be awarded with the rank of the Fleet Admiral of Europe."
 USoE605D: "European Empire"
 USoE605D_desc: "Once again Europe has become an Empire and can defend the interests of its people on global level."
 USoE620D: "The New Emperor"
 USoE620D_desc: "Europe needs a new emperor who leads the continent through the 21st century."
 USoE621D: "Choose a House"
 USoE621D_desc: "Europe has many great houses with a long and glorious history. United for the first time, the continent needs to decide which house should rule in the 21st century."
 USoE622D: "House of Savoy"
 USoE622D_desc: "The House of Savoy is a royal dynasty that was established in 1003 in the historical Savoy region. Through gradual expansion, the family grew in power from ruling a small Alpine county north-west of Italy to absolute rule of the Kingdom of Sicily. Members of the house ruled Sardinia, Italy, Albania, Ethiopia and, for a short period, Spain. The house also claims the titles of Kings of Cyprus, Jerusalem and Armenia."
 USoE623D: "House of Wittelsbach"
 USoE623D_desc: "The House of Wittelsbach is a German-Bavarian dynasty, with branches that have ruled over territories including: Bavaria, Holland, Zeeland, Cologne, Sweden, Romania, Bohemia, Hungary, Denmark, Norway, Greece and the Holy Roman Empire. The line of Jacobite succession, which recognises the right for a Catholic monarch, acknowledges Franz, Hereditary Prince of Bavaria to be the rightful heir as Francis II."
 USoE624D: "House of Borbón-Anjou"
 USoE624D_desc: "The House of Borbón-Anjou is the reigning royal house of the Kingdom of Spain. By the 18th century, members of the Spanish Bourbon dynasty held thrones in Spain, Naples, Sicily, and Parma."
 USoE625D: "House of Bourbon"
 USoE625D_desc: "The House of Bourbon is a European dynasty of French origin, a branch of the Capetian dynasty, the royal House of France. Bourbon kings first ruled France and Navarre in the 16th century."
 USoE626D: "House of Hanover"
 USoE626D_desc: "The House of Hanover is a German royal house that ruled Hanover, Great Britain, and Ireland at various times during the 17th to 20th centuries. The house originated in 1635 as a cadet branch of the House of Brunswick-Lüneburg, growing in prestige until Hanover became an Electorate in 1692."
 USoE627D: "House of Glücksburg"
 USoE627D_desc: "The House of Glücksburg, shortened from House of Schleswig-Holstein-Sonderburg-Glücksburg, is a Dano-German branch of the House of Oldenburg, members of which have reigned at various times in Denmark, Norway, Greece and several northern German states."
 USoE628D: "House of Windsor"
 USoE628D_desc: "The House of Windsor is the reigning royal house of the United Kingdom and the other Commonwealth realms. In 1901, the House of Saxe-Coburg and Gotha succeeded the House of Hanover in the British monarchy. In 1917, the name of the royal house was changed from the German Saxe-Coburg and Gotha to the English Windsor (from Windsor Castle) because of World War I."
 USoE629D: "House of Orange-Nassau"
 USoE629D_desc: "The House of Orange-Nassau is the current reigning house of the Netherlands. A branch of the European House of Nassau, the house has played a central role in the politics and government of the Netherlands and Europe, especially since William the Silent organized the Dutch revolt against Spanish rule, which after the Eighty Years' War (1568–1648) led to an independent Dutch state. "
 USoE630D: "House of Habsburg-Lorraine"
 USoE630D_desc: "The House of Habsburg-Lorraine originated from the marriage in 1736 of Francis III, Duke of Lorraine and Bar, and Maria Theresa of Austria, later successively Queen of Bohemia, Queen of Hungary and Archduchess of Austria. Its members are the legitimate surviving line of the House of Habsburg and the House of Lorraine, inheriting their patrimonial possessions and vocation to the Empire."
 USoE631D: "House of Bonaparte"
 USoE631D_desc: "The House of Bonaparte is a former imperial and royal European dynasty of Italian origin. It was founded in 1804 by Napoleon I. Napoleon turned the Grande Armée against every major European power and dominated continental Europe through a series of military victories. He installed members of his family on the thrones of client states, extending the power of the dynasty."
 USoE632D: "House of Hohenzollern"
 USoE632D_desc: "The House of Hohenzollern is a German former royal dynasty whose members were variously princes, electors, kings and emperors of Hohenzollern, Brandenburg, Prussia, the German Empire, and Romania. The family arose in the area around the town of Hechingen in Swabia during the 11th century and took their name from Hohenzollern Castle."
 USoE633D: "Choose a Palace "
 USoE633D_desc: "The new Emperor of Europe needs a representative palace to rule."
 USoE634D: "Quirinal Palace"
 USoE634D_desc: "The Quirinal Palace is a historic building in Rome, Italy, and serves as one of the three current official residences of the President of the Italian Republic. The Quirinal Palace was selected by Napoleon to be his residence par excellence as Emperor. However, its permanence never took place because of the French defeat in 1814 and the subsequent European Restoration."
 USoE635D: "Neuschwanstein Castle"
 USoE635D_desc: "Neuschwanstein Castle is a 19th-century Romanesque Revival palace on a rugged hill in southwest Bavaria, Germany. The palace was commissioned by King Ludwig II of Bavaria. The castle was intended as a home for the King, until he died in 1886. It was open to the public shortly after his death. Since then, more than 61 million people have visited Neuschwanstein Castle."
 USoE636D: "Royal Palace of Madrid"
 USoE636D_desc: "The Royal Palace of Madrid is the official residence of the Spanish royal family at the city of Madrid, although now used only for state ceremonies. The palace has 135,000 square metres of floor space and contains 3,418 rooms. It is the largest functioning royal palace and the largest by floor area in Europe."
 USoE637D: "Palace of Versailles"
 USoE637D_desc: "The Palace of Versailles was the principal royal residence of France from 1682, under Louis XIV, until the start of the French Revolution in 1789, under Louis XVI. The palace is now a historical monument and UNESCO World Heritage site, notable especially for the ceremonial Hall of Mirrors and the vast Gardens of Versailles with fountains, canals, and geometric flower beds and groves."
 USoE638D: "Buckingham Palace"
 USoE638D_desc: "Buckingham Palace is the London residence and administrative headquarters of the monarch of the United Kingdom. Located in the City of Westminster, the palace is often at the centre of state occasions and royal hospitality. It has been a focal point for the British people at times of national rejoicing and mourning."
 USoE639D: "Hofburg"
 USoE639D_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty rulers and today serves as the official residence and workplace of the President of Austria. It is located in the centre of Vienna and was built in the 13th century and expanded several times afterwards."
 USoE640D: "Sanssouci"
 USoE640D_desc: "Sanssouci was the summer palace of Frederick the Great, King of Prussia, in Potsdam, near Berlin. It is often counted among the German rivals of Versailles. While Sanssouci is in the more intimate Rococo style and is far smaller than its French Baroque counterpart, it too is notable for the numerous temples and follies in the park."
 USoE641D: "A New Palace"
 USoE641D_desc: "A new emperor needs an new palace, not a historic monument. Let's build a new palace with modern architecture in Brussels."
 USoE642D: "Coronation"
 USoE642D_desc: "Europe needs to prepare for the coronation of the new Emperor. But first, it needs to decide which crown the emperor should wear and who should do the coronation."
 USoE643D: "The Imperial Crown"
 USoE643D_desc: "The new empire is the continuation and the legacy of the Holy Roman Empire, so the emperor needs to wear the Crown of the Holy Roman Empire."
 USoE644D: "A New Ecumenical Crown"
 USoE644D_desc: "A new empire and a new emperor need a new crown and not a historic relict."
 USoE645D: "By the Pope"
 USoE645D_desc: "The new emperor by the grace of god needs to be crowned by the pope."
 USoE646D: "By the People"
 USoE646D_desc: "The new Emperor needs to be crowned by the people, so let's call for an election to legitimate His Majesty's rule."
 USoE647D: "The Holy European Empire"
 USoE647D_desc: "The emperor is crowned and the Holy European Empire is established."
 USoE700D: "Pax Occidentalis"
 USoE700D_desc: "Europe has acquired global dominance and can enforce world peace. This era will be called Pax Occidentalis."
 USoE701D: "Guardians of World Peace"
 USoE701D_desc: "Europe, America, Russia and China have settled their spheres of influence. Every superpower enforces peace in their sphere and so they are the guardians of world peace."
 
##################### European Union Module A2 #####################
 EU001C: "EU Policies"
 EU001C_desc: "The policies of §Y[EUU.GetFlag] The EU§! are determined by the Union’s values, objectives and principles. Because the EU started as an economic community, economic policy is still an important area in the EU. In keeping with its values, the EU seeks to promote the wellbeing, security and interests of the citizens. The EU wishes to keep the economy stable and competitive. The EU tries to reform itself..."
 EU002C: "EU Candidate"
 EU002C_desc: "Before applying for membership to §Y[EUU.GetFlag] The European Union§! We need to get EU Candidate status. The will be hard negotiations with the member states of §Y[EUU.GetFlag] The European Union§!. We will need a lot of influence."
 EU100C: "EU Reforms"
 EU100C_desc: "The member states try to reform §Y[EUU.GetFlag] The European Union§! to strengthen the European integration."
 EU101C: "Charter of Fundamental Rights of the European Union"
 EU101C_desc: "\"The peoples of Europe, in creating an ever closer union among them, are resolved to share a peaceful future based on common values. Conscious of its spiritual and moral heritage, the Union is founded on the indivisible, universal values of human dignity, freedom, equality and solidarity; it is based on the principles of democracy and the rule of law.\" - Preamble of the CFR"
 EU102C: "European Convention"
 EU102C_desc: "Following the Laeken declaration the European Council has decided to convene a Convention on the future of the Union to make a decisive step for the citizen towards a simpler Union, one that is stronger in the pursuit of its essential objectives and more definitely present in the world."
 EU103C: "European Constitution"
 EU103C_desc: "The European Convention ended with the Draft of the Treaty establishing a Constitution for Europe. This international treaty would replace the existing European treaties to create a consolidated constitution for §Y[EUU.GetFlag] The European Union§! and expanded Qualified Majority Voting into policy areas which had previously been decided by unanimity among member states."
 EU104C: "Treaty of Lisbon"
 EU104C_desc: "The process leading to the Lisbon Treaty is a result of the negative outcome of the ratification of the European Constitution. Treaty of Lisbon amending the Treaty on European Union and the Treaty establishing the European Community. The last is renamed the Treaty on the Functioning of the European Union."
 EU105C: "European External Action Service"
 EU105C_desc: "The European External Action Service is the European Union's diplomatic service. It helps the EU's foreign affairs chief – the High Representative for Foreign Affairs and Security Policy – carry out the Union's Common Foreign and Security Policy."
 EU200C: "EU Fiscal Policies"
 EU200C_desc: "Fiscal policies have a significant impact on economic growth, macroeconomic stability and inflation. Key aspects in this respect are the level and composition of government expenditure and revenue, budget deficits and government debt. The need for fiscal discipline is even stronger in a monetary union, such as the euro area, which is made of sovereign states that retain responsibility for their fiscal policies."
 EU201C: "ECB Intervention"
 EU201C_desc: "To implement its monetary policy decisions, the Governing Council of the ECB has adopted a set of monetary policy instruments and procedures as laid down in the General documentation on Eurosystem monetary policy instruments and procedures."
 EU202C: "European Banking Union"
 EU202C_desc: "In response to the recent financial crisis the European Banking Union was created for a safer financial sector for the single market. These initiatives form a single rulebook for all financial actors in the EU member states. They include stronger prudential requirements for banks, improved protection for depositors and rules for managing failing banks."
 EU203C: "Eurobonds"
 EU203C_desc: "Eurobonds are a new option of financing public debt. Such common issuance of bonds by the eurozone members would imply a significant deepening of the monetary union. It would create new means through which governments finance their debt, by offering safe and liquid investment opportunities for savers and financial institutions and by setting up a Eurobond market that matches the US bond market."
 EU204C: "European Financial Stability Facility (EFSF)"
 EU204C_desc: "The EFSF was created as a temporary crisis resolution mechanism by the euro area member states in European debt crisis and provided financial assistance to several member states. This was financed by the EFSF through the issuance of EFSF bonds and other debt instruments on capital markets. The EFSF does not provide any further financial assistance, as this task is now performed solely by the ESM."
 EU205C: "European Stability Mechanism (ESM)"
 EU205C_desc: "The ESM’s mission is to provide financial assistance to euro area countries experiencing or threatened by severe financing problems. This assistance is granted only if it is proven necessary to safeguard the financial stability of the euro area as a whole and of ESM Members."
 EU206C: "Fiscal Union"
 EU206C_desc: "Fiscal union involves member states sharing the same common budget. It means spending and tax levels would be taken by a central fiscal authority. Fiscal union is proposed as a step for further European integration. It would mean a central European authority would set spending and tax rates for all member states."
 EU207C: "European Economic Government"
 EU207C_desc: "A European Economic Government would make possible a common fiscal and active economic policy in the EU. It would give §Y[EUU.GetFlag] The European Union§! an own tax authority and a central authority would set minimum wages for the member states."
 EU208C: "European Minister of Economy and Finance"
 EU208C_desc: "A European Minister of Economy and Finance combines the policies and powers established by the Fiscal Union and the European Economic Government into one office."
 EU300C: "EU Defense Policies"
 EU300C_desc: "The Common Security and Defence Policy (CSDP) enables the Union to take a leading role in peace-keeping operations, conflict prevention and in the strengthening of the international security. It is an integral part of the EU's comprehensive approach towards crisis management, drawing on civilian and military assets."
 EU301C: "European Defence Agency (EDA)"
 EU301C_desc: "The European Defence Agency was established to support the member states and §Y[EUU.GetFlag] The European Union§! in their effort to improve European defence capabilities in the field of crisis management and to sustain the European Security and Defence Policy as it stands now and develops in the future."
 EU302C: "Permanent Structured Cooperation (PESCO)"
 EU302C_desc: "PESCO allows thus willing and able member states to jointly plan, develop and invest in shared capability projects, and enhance the operational readiness and contribution of their armed forces. The aim is to jointly develop a coherent full spectrum force package and make the capabilities available to member states for national and multinational missions and operations."
 EU303C: "European Defence Fund"
 EU303C_desc: "The European Defence Fund will provide a key contribution to Europe’s strategic autonomy, protecting and defending its citizens. It will promote defence cooperation among companies and between EU countries to foster innovation and develop state-of-the-art defence technology and products. The fund will coordinate, supplement and amplify national investments in defence."
 EU304C: "European Security Council"
 EU304C_desc: "A ESC would make the EU better prepared for making decisions about international politics. If the EU does not manage to take and implement coherent decisions more quickly, their ability to enforce EU rules and strengthen multilateral formats will be weakened. The EU’s diplomatic, financial and military resources should therefore be supplemented by a format for more effective intergovernmental cooperation."
 EU305C: "EuroArmy"
 EU305C_desc: "To strength the military capabilities of §Y[EUU.GetFlag] The European Union§! the member states can draft common armed forces. These forces will be known as §YEuroArmy§!"
 EU306C: "EuroNavy"
 EU306C_desc: "With multinational fleets and task forces becoming more common and important in the 21st century the member states of §Y[EUU.GetFlag] The European Union§! can join their forces and transfer their warships to a unified European Naval Command known as §YEuroNavy§!."
 EU307C: "EU Permanent Member of the UNSC"
 EU307C_desc: "The member states have decided that the EU should be a permanent member of the United Nations Security Council (UNSC). This is done by reforming the UNSC or by transferring the seat(s) of the member state(s) already being UNSC member(s) to the EU."
 EU308C: "EU Nuclear Power"
 EU308C_desc: "Becoming a nuclear power will strength the political power of the EU and the influence of the Union in the world. The Union will acquire the nuclear weapons by transferring and sharing the nuclear weapons of their member states or by developing own nuclear warheads."
 EU400C: "EU Secondary Legislation"
 EU400C_desc: "The EU treaties are binding agreements between EU member states set out EU objectives, rules for EU institutions, how decisions are made and the relationship between the EU and its members. Treaties are known as primary law. The body of law that comes from the principles and objectives of the treaties is known as secondary law (regulations, directives, decisions, recommendations and opinions)."
 EU401C: "General Data Protection Regulation"
 EU401C_desc: "The EU General Data Protection Regulation (GDPR) is designed to: harmonize data privacy laws across Europe, protect and empower all EU citizens data privacy and reshape the way organizations across the region approach data privacy."
 EU402C: "Directive on Copyright in the Digital Single Market"
 EU402C_desc: "Digital technologies have radically changed the way creative content is produced, distributed and accessed. We are adapting the EU copyright rules to new consumer behaviours in a Europe which values its cultural diversity."
 EU403C: "Dublin II Regulation"
 EU403C_desc: "The Dublin II Regulation establishes the principle that only one member state is responsible for examining an asylum application. The objective is to avoid asylum seekers from being sent from one country to another, and also to prevent abuse of the system by the submission of several applications for asylum by one person."
 EU404C: "Relocation and Resettlement of Asylum Seekers"
 EU404C_desc: "Asylum seekers with a high chance of having their applications successfully processed are relocated from Greece and Italy, where they have arrived, to other member states where they will have their asylum applications processed. If these applications are successful, the applicants will be granted refugee status with the right to reside in the member state to which they are relocated."
 EU405C: "EU–Turkey deal"
 EU405C_desc: "§Y[EUU.GetFlag] The European Union§! and [TUR.GetNameWithFlag] will negotiate an agreement aimed at stopping the flow of irregular migration via Turkey to Europe. All new irregular migrants and asylum seekers arriving from Turkey to the Greek islands and whose applications for asylum have been declared inadmissible should be returned to Turkey. §Y[EUU.GetFlag] The European Union§! will pay 3 billion Euro for the Facility for Refugees in Turkey."
 EU406C: "European Asylum Agency"
 EU406C_desc: "The EU Commission proposed a future EU Asylum Agency equipped with the necessary mandate, tools and financial means needed to provide a rapid and full service to member states throughout the asylum procedure."
 EU407C: "Frontex"
 EU407C_desc: "Frontex helps EU countries and Schengen associated countries manage their external borders. It also to helps to harmonise border controls across the EU. The agency facilitates cooperation between border authorities in each EU country, providing technical support and expertise."
 EU408C: "European Border and Coast Guard Agency"
 EU408C_desc: "Frontex becomes the European Border and Coast Guard Agency. Europe’s external borders have seen an unprecedented rise in the number of migrants and refugees wishing to enter the EU in recent years. Countries that have an external border have sole responsibility for border control. But Frontex can provide additional technical support for EU countries facing severe migratory pressure."
 EU500C: "European Commission Policies "
 EU500C_desc: "European Commission Policies "
 EU600C: "EU Enlargement"
 EU600C_desc: "Enlargement policy applies to countries currently aspiring to join the EU and potential candidates. The prospect of membership is a powerful stimulus for democratic and economic reforms in countries that want to become EU members."
 EU601C: "2004 enlargement of the European Union"
 EU601C_desc: "On 1 May 2004 ten new countries with a combined population of almost 75 million joined the EU. The 25-member EU now has 450 million citizens and includes three former Soviet republics (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! and §Y[LIT.GetNameWithFlag]§!), four former satellites of the USSR (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! and §Y[SLO.GetNameWithFlag]§!), a former Yugoslav republic (§Y[SLV.GetNameWithFlag]§!) and two Mediterranean islands (§Y[CYP.GetNameWithFlag]§! and §Y[MLT.GetNameWithFlag]§!)."
 EU602C: "2007 enlargement of the European Union"
 EU602C_desc: "Two more countries from eastern Europe - §Y[BUL.GetNameWithFlag]§!and §Y[ROM.GetNameWithFlag]§! - join the EU, bringing the number of member states to 27."
 EU603C: "2013 enlargement of the European Union"
 EU603C_desc: "2013 §Y[CRO.GetNameWithFlag]§! joined the EU, bringing the number of member states to 28."
 EU700C: "Withdrawal Policies"
 EU700C_desc: "With rising Euroscepticism throughout the Union some member states will think about leaving §Y[EUU.GetFlag] The European Union§!."
 EU701C: "Article 50"
 EU701C_desc: "\"Any Member State may decide to withdraw from the Union in accordance with its own constitutional requirements.\"\n- Article 50(1), Treaty on European Union.\nFirst Article 50 was drafted for the Constitutional Treaty for the European Union. Following the failure of the ratification of the Constitution, the clause was incorporated into the Treaty of Lisbon."
 EU702C: "Withdrawal Treaty"
 EU702C_desc: "Withdrawal from §Y[EUU.GetFlag] The European Union§! is a complex process where the leaving country has to adapt its national law for time when the EU law expires due to the leaving of the Union. The leaving country and the §Y[EUU.GetFlag] The European Union§! have to reach an agreement on their future relationship."
 EU703C: "No Deal Exit"
 EU703C_desc: "If a Withdrawal Treaty with §Y[EUU.GetFlag] The European Union§! is not reached, emergency measures have to be taken to protect our people from the chaos of a No Deal Exit."
 EU110C: "Federalisation of the European Union"
 EU110C_desc: "The process of European integration has reached a state where any further integration will lead to a Federalisation of §Y[EUU.GetFlag] The European Union§!."
 EU111C: "United States of Europe"
 EU111C_desc: "After more than 70 years of European integration the member states of §Y[EUU.GetFlag] The European Union§! have decided to give up their sovereignty and form the §Y[EUU.GetFlag] The United States of Europe§!."
 EU112C: "European Federation"
 EU112C_desc: "The member states of §Y[EUU.GetFlag] The European Union§! have decided to transfer the Union into §Y[EUU.GetFlag] The European Federation§! with the Qualified Majority Voting as fundamental principle and headed by the §YPresident of the European Federation§!."
 EU113C: "Europe of Fatherlands"
 EU113C_desc: "Any further European integration will jeopardise the cultural heritage, the national Identities and the sovereignty of the member states. Europe is a Europe of Fatherlands, so the European integration has to stop at this stage."
 EU604C: "Future enlargement of the European Union"
 EU604C_desc: "Future enlargement of the European Union"
 EU605C: "Western Balkans Enlargement"
 EU605C_desc: "The Western Balkan countries of §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! and §Y[KOS.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU606C: "Turkey"
 EU606C_desc: "§Y[TUR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU607C: "Black Sea Enlargement"
 EU607C_desc: "The Black Sea countries of §Y[MLV.GetNameWithFlag]§! and §Y[UKR.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU608C: "Caucasus Enlargement"
 EU608C_desc: "The Caucasus countries of §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! and §Y[GEO.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU609C: "European Economic Area"
 EU609C_desc: "The non-EU countries of the European Economic Area (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! and §Y[ICE.GetNameWithFlag]§!) become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU610C: "Belarus"
 EU610C_desc: "§Y[BLR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU611C: "Internal Enlargement"
 EU611C_desc: "Internal enlargement is the process of new member states arising from the break-up of or secession from an existing member state. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! and §Y[WAS.GetNameWithFlag]§! can become candidates for joining §Y[EUU.GetFlag] The European Union§!, when they become independent."
 POTEF001C: "President of the  European Federation"
 POTEF001C_desc: "The §YPresident of the European Federation (POTEF)§! is the paramount leader of Europe. Therefore the President of the European Federation has the power to make the decisive strategic decisions for the whole Federation."
 POTEF100C: "Alpine Doctrine"
 POTEF100C_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member state can adopt this tradition and tactics."
 POTEF101C: "The Integrity of Creation"
 POTEF101C_desc: "To save and conserve the Integrity of Creation the European Federation adapts its policies."
 POTEF102C: "Environmental Imperialism"
 POTEF102C_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF103C: "North America"
 POTEF103C_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF104C: "South America"
 POTEF104C_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF105C: "Europe"
 POTEF105C_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF106C: "Africa"
 POTEF106C_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF107C: "Middle East"
 POTEF107C_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF108C: "Asia"
 POTEF108C_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF109C: "Oceania"
 POTEF109C_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF110C: "Pacific"
 POTEF110C_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF150C: "German Doctrine"
 POTEF150C_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member state can adopt this tradition and tactics."
 POTEF151C: "Empire of Trade"
 POTEF151C_desc: "The European Federation will become an Empire of Trade."
 POTEF200C: "French Doctrine"
 POTEF200C_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member state can adopt this tradition and tactics."
 POTEF201C: "Imperial Power"
 POTEF201C_desc: "The European Federation stands in the tradition of its imperial predecessors."
 POTEF202C: "Empire of Freedom"
 POTEF202C_desc: "The European Federation will become an Empire of Freedom."
 POTEF203C: "America: Ally or Adversary"
 POTEF203C_desc: "America and Europe have been allies for most of the 20th century. With the recent political changes in §Y[USA.GetNameWithFlag]§! this has been questioned…"
 POTEF204C: "NATO Legacy"
 POTEF204C_desc: "In the Tradition of the peacekeeping Legacy of NATO §Y[USA.GetNameWithFlag]§! and the §YEDU§! form a new alliance."
 POTEF205C: "Trump's Legacy"
 POTEF205C_desc: "§Y[USA.GetNameWithFlag]§! went form an ally to an adversary. Europe has to react to this decisive strategic change."
 POTEF206C: "Break the Wall"
 POTEF206C_desc: "To counter the American threat to European sovereignty, the general staff of the §YEDU§! has drafted a plan to ally with §Y[MEX.GetNameWithFlag]§! and invade §Y[USA.GetNameWithFlag]§! from the South."
 POTEF207C: "Buster's Resurrection"
 POTEF207C_desc: "To counter the US threat to Europe, the general staff of the §YEDU§! has proposed to ally with §Y[CAN.GetNameWithFlag]§! and revise the Defence Scheme No. 1, a plan created by Canadian Lt Col James 'Buster' Sutherland Brown, for a Canadian pre-emptive attack against the US in the event of an imminent conflict between the US and the British Empire. With this plan the §YEDU§! can launch an invasion from the North on §Y[USA.GetFlag] the US§!."
 POTEF250C: "Benelux Doctrine"
 POTEF250C_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member state can adopt this tactics."
 POTEF251C: "Liberal Legacy"
 POTEF251C_desc: "The European Federation honors its Liberal Legacy."
 POTEF252C: "Safeguard the old Traderouts"
 POTEF252C_desc: "The European Federation needs to safeguard the old Traderouts to the Caribbean, Africa and the former Dutch East Indies."
 POTEF253C: "Indonesia"
 POTEF253C_desc: "The European Federation needs to improve its relationship to the former Dutch colony §Y[IND.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF300C: "Iberian Doctrine"
 POTEF300C_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member state can adopt this tradition and tactics."
 POTEF301C: "Latin Cousins"
 POTEF301C_desc: "The European Federation needs to improve its relationship to the former colonies in South America."
 POTEF302C: "Mexico"
 POTEF302C_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[MEX.GetNameWithFlag]§! and build new strategic outposts in Central America."
 POTEF303C: "Greater Colombia"
 POTEF303C_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[COL.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF304C: "Central America"
 POTEF304C_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in §YCentral America§! and build new strategic outposts there."
 POTEF305C: "Southern Cone"
 POTEF305C_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in the §YSouthern Cone of South America§! and build new strategic outposts there."
 POTEF306C: "Brazil"
 POTEF306C_desc: "The European Federation needs to improve its relationship to the former Portuguese  colony §Y[BRA.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF350C: "British Doctrine"
 POTEF350C_desc: "The §YBritain§! traditionally focused on strong a strong Navy. With the Naval Doctrine all member state can adopt this tradition and tactics."
 POTEF351C: "Safeguard the North Atlantic"
 POTEF351C_desc: "To secure the Freedom of the Seas and free trade the European Federation needs to control the North Atlantic."
 POTEF352C: "Commonwealth Legacy"
 POTEF352C_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominions."
 POTEF353C: "Canada"
 POTEF353C_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[CAN.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF354C: "Australia"
 POTEF354C_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[AST.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF355C: "New Zealand"
 POTEF355C_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[NZL.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF356C: "Safeguard the North Sea"
 POTEF356C_desc: "The North Sea is the backyard of European Federation and needs to be secured."
 POTEF357C: "Malaya Legacy"
 POTEF357C_desc: "The European Federation needs to improve its relationship to the former British colonies of Malaya."
 POTEF358C: "Malaysia"
 POTEF358C_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[MAY.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF359C: "Singapore"
 POTEF359C_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[SIN.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF360C: "Guarantee Hong Kong"
 POTEF360C_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and gurantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400C: "Nordic Doctrine"
 POTEF400C_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member state can adopt this tradition and tactics."
 POTEF401C: "Safeguard the Arctic"
 POTEF401C_desc: "To secure the Freedom of the Seas and its geostrategic position the European Federation needs to control the Arctic."
 POTEF450C: "Mediterranean Doctrine"
 POTEF450C_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member state can adopt this tradition and tactics."
 POTEF451C: "Northern Africa"
 POTEF451C_desc: "To create a convergence zone and a safe harbor for refugees the European Federation needs to improve its relationship to §YNorthern Africa§! and build new strategic outposts there."
 POTEF452C: "Unite Cyprus"
 POTEF452C_desc: "As sovereign member state of the European Federation §Y[CYP.GetNameWithFlag]§! needs to be reunited."
 POTEF500C: "Balkan Doctrine"
 POTEF500C_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member state can adopt this tradition and tactics."
 POTEF501C: "Balkan Infrastructure"
 POTEF501C_desc: "The European Federation needs to develop the infrastructure of the Balkan to preserve the regional peace and secure the Balkan from foreign influence."
 POTEF502C: "Contest the Silk Road"
 POTEF502C_desc: "The European Federation needs to contest China's new silk road and reduce the Chinese influence in Central Asia."
 POTEF503C: "Competitor China"
 POTEF503C_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major compeditor of the European Federation on global level. The European Federation needs to adept its policies to this."
 POTEF504C: "Operation Arrow"
 POTEF504C_desc: "Named after the Arrow War (Second Anglo-Chinese War), Operation Arrow is a plan for a European intervention in §Y[CHI.GetNameWithFlag]§! to stop the Chinese expansion policy."
 POTEF505C: "Asian Allies"
 POTEF505C_desc: "To confront §Y[CHI.GetNameWithFlag]§!, the European Federation needs allies in Asia."
 POTEF506C: "Republik of Korea"
 POTEF506C_desc: "§Y[KOR.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF507C: "Japan"
 POTEF507C_desc: "§Y[JAP.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF550C: "Black Sea Doctrine"
 POTEF550C_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member state can adopt this tactics."
 POTEF551C: "Safeguard the Black Sea"
 POTEF551C_desc: "The Black Sea is the conection of European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552C: "Reintegrate the Breakaway Republics"
 POTEF552C_desc: "§Y[SOV.GetNameWithFlag]§! has violated the sovereignty of various eastern member states of the European Federation by supporting separatist movements and creating Breakway Republics. We need to reintegrate these Russian minions. "
 POTEF553C: "Rival Russia"
 POTEF553C_desc: "§Y[SOV.GetNameWithFlag]§! has become a major rival of the European Federation. We need to impose sanctions on them. "
 POTEF554C: "Operation Charlemagne"
 POTEF554C_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600C: "Caucasus Doctrine"
 POTEF600C_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focuse on a strong defense to fit the new situation. With the Defense Doctrine all member state can adopt this tactics."
 POTEF601C: "European Access"
 POTEF601C_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure needs to be build."
 POTEF650C: "Visegrad Doctrine"
 POTEF650C_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member state can adopt this tradition and tactics."
 POTEF651C: "European Air Defense Network"
 POTEF651C_desc: "The European Federation needs to build an Air Defense Network to secure its Eastern flank."
 POTEF652C: "Eastern Firewall"
 POTEF652C_desc: "The rising influence of §Y[SOV.GetNameWithFlag]§! in the Eastern member states need to be countered."
 POTEF700C: "Baltic Doctrine"
 POTEF700C_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member state can adopt this tradition and tactics."
 POTEF701C: "Safeguard the Baltic Sea"
 POTEF701C_desc: "The Baltic Sea is the island sea of the European Federation and needs to be secured."
 POTEF800C: "Pax Europaea"
 POTEF800C_desc: "The European Federation needs to become the global superpower to enforce world peace."
 USoE001C: "Constitute the new European Nation"
 USoE001C_desc: "The unified European Union needs to constitute itself as a new nation. The Constitution and the Unification Treaties are one thing, but now the people need to fulfill that legal framework with life."
 USoE002C: "A European Officer Corps"
 USoE002C_desc: "In the Union, every member state had its own army and later there was the EuroArmy. We need to create a European Officer Corps with common doctrine and training."
 USoE003C: "European Political Parties"
 USoE003C_desc: "A new nation needs new political parties. The former political parties of the member states have to unify."
 USoE004C: "European Patriotism"
 USoE004C_desc: "A new nation needs its own patriotism and national symbols."
 USoE005C: "The New Great Game"
 USoE005C_desc: "The New Great Game has just begun and Europe is late, while the US, China and Russia already made their first moves."
 USoE006C: "Europe's Heart and Soul"
 USoE006C_desc: "The new nation needs to define its values and standards. Europe needs a Heart and Soul!"
 USoE100C: "A Game of Spheres"
 USoE100C_desc: "When you play the game of spheres, you win or you die. There is no middle ground."
 USoE101C: "Engage the Eagle"
 USoE101C_desc: "The American Eagle needs to be grounded! It has flown far too long over European skies."
 USoE102C: "Brawl with the Bear"
 USoE102C_desc: "We need to strike the Bear before he strikes us."
 USoE103C: "Dance with the Dragon"
 USoE103C_desc: "The Dance with the Dragon is a dangerous game."
 USoE104C: "A Heart of Iron"
 USoE104C_desc: "In ancient times, the blacksmiths would forge an iron throne out of the weapons of the beaten villains. In our days, we just declare Europe has proven its heart of iron and is now the uncontested world ruler! "
 USoE200C: "Peaceful Coexistence"
 USoE200C_desc: "There are sharper swords than those of iron. Why pay with blood if you can pay with money?"
 USoE201C: "America First"
 USoE201C_desc: "We need to respect the America First doctrine if we want that our doctrines are respected."
 USoE202C: "Russosphere"
 USoE202C_desc: "Russia is the protector of all Russian people. That's their sphere of influence, which we need to respect."
 USoE203C: "Shinosphere"
 USoE203C_desc: "China's sphere of influence covers southeast Asia and doesn't bother us. China is our trade partner, not our rival."
 USoE204C: "Eurosphere"
 USoE204C_desc: "We appeased all superpowers of the 21st century, now we have free hands to establish the Eurosphere in Europe, Levant and North Africa."
 USoE300C: "Clash of Civilizations"
 USoE300C_desc: "The Clash of Civilizations was a thesis from American political scientist Samuel P. Huntington, that people's cultural and religious identities will be the primary source of conflict in the post-Cold War world. The future wars will be fought not between countries, but between cultures."
 USoE301C: "The Rest of the West"
 USoE301C_desc: "Europe is the rest of the west. America has left us alone and isolated in the America First doctrine."
 USoE302C: "Cross and Crescent"
 USoE302C_desc: "At Europe's southeast border, the cross clashes with the crescent. Who will prevail: the Western or the Islamic civilization?"
 USoE303C: "The Pope and the Patriarch"
 USoE303C_desc: "Since the Great Schism of 1054, the pope and the Orthodox patriarch have gone different paths. It's time to unite again to defend the Western civilization."
 USoE304C: "Two Crosses"
 USoE304C_desc: "Eastern and Western Christianity need to unite against Islam."
 USoE305C: "Eurasian Alliance"
 USoE305C_desc: "After the dissolution of NATO, Europe can form a new great alliance with its Russian neighbour."
 USoE306C: "Constantinople"
 USoE306C_desc: "Constantinople is part of the West. Europe needs to free it form the Islamic influence."
 USoE307C: "Antioch"
 USoE307C_desc: "The Principality of Antioch was one of the crusader states created during the First Crusade. It belongs to the West and shall be free from Islam once again."
 USoE308C: "Tripoli"
 USoE308C_desc: "The County of Tripoli (1109–1289) was the last of the crusader states. It shall rise again. Europe needs to free the Levant from Islam."
 USoE309C: "Jerusalem"
 USoE309C_desc: "Europe needs to save the Holy City from Islamic influence. The Kingdom of Jerusalem shall guard the holy sites once again."
 USoE310C: "Knights of Malta"
 USoE310C_desc: "Europe needs to free Northern Africa from Islamic influence. Europe will follow the example of Knights of Malta."
 USoE311C: "Arabian Westernization"
 USoE311C_desc: "Some countries on the Arabian Peninsula already have close ties to the West. Europe needs to fully westernize the Arabian Peninsula to have a safe neighbourhood."
 USoE312C: "Indian Westernization"
 USoE312C_desc: "With the colonial legacy, India has traditionally close ties to the West. Europe should deepen this relation to fully westernize India."
 USoE313C: "The Republic of Persia"
 USoE313C_desc: "Iran is one of the major rivals of the West in the Middle East. Europe can stop Iran's conquest for regional hegemony when Europe westernizes Iran to the Republic of Persia."
 USoE320C: "The West vs the Rest"
 USoE320C_desc: "Europe and America are the western superpowers that can match every enemy in the world. With NATO as a base, the West can enforce its global dominance."
 USoE321C: "Asian Westernization"
 USoE321C_desc: "The West needs to focus on the emerging powers in Asia. The West should fight or westernize them."
 USoE322C: "The Four Tigers"
 USoE322C_desc: "The Four Asian Tigers of Hong Kong, Singapore, South Korea and Taiwan always had close ties to the West and fear the emerging Chinese dragon. They could be viable allies of the West in Asia."
 USoE323C: "Japan"
 USoE323C_desc: "After the end of the World War II, Japan was an important ally of the West in Asia. The West needs to continue this close partnership."
 USoE324C: "China"
 USoE324C_desc: "China is the major rival of the West in Asia. If the West can westernize China, there will be no contender for Western hegemony in Asia."
 USoE325C: "Operation Unthinkable 2.0"
 USoE325C_desc: "Operation Unthinkable was a war plan of the British Chiefs of Staff against the Soviet Union ordered by Winston Churchill in May 1945. Together with the former German Wehrmacht, the western allies should launch a surprise attack on the Soviet Union. The West needs to revise that plan to fit the current setup and act in preemptive self-defense against Russia to prevent Russian hegemony in Europe."
 USoE400C: "The Torch of Freedom"
 USoE400C_desc: "Europe needs to carry on the Torch of Freedom! The United States of Europe are a democratic republic which respects the human rights and the rule of law."
 USoE401C: "Digital Democracy"
 USoE401C_desc: "Europe needs to reform its democratic institutions for the digital age. With social media and social networks, the people can directly participate in legislation and government."
 USoE402C: "Hammer and Sickle"
 USoE402C_desc: "Karl Marx and Friedrich Engels, the fathers of Socialism and Marxism, were Europeans. Europe needs to carry on that legacy."
 USoE403C: "EUSSR"
 USoE403C_desc: "The European left trapped the capitalists in the European Union, now the spiritual heir of Karl Marx and Friedrich Engels have the power to establish the EUSSR: the European Union of Soviet Socialist Republics."
 USoE404C: "AI Government"
 USoE404C_desc: "Artificial intelligence has evolved enough to govern a country more efficiently than inefficient and possibly corrupt human politicians. The AI agent of the ruling party will take control and rule the country based on the values of the ruling party."
 USoE500C: "The Green Future"
 USoE500C_desc: "With the undeniable climate change, there is no future but a green future for Europe."
 USoE501C: "Environmental Empire"
 USoE501C_desc: "Europe needs to become an Environmental Empire where economy and environment are no contradiction."
 USoE502C: "Environmental Imperialism"
 USoE502C_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE503C: "North America"
 USoE503C_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE504C: "South America"
 USoE504C_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE505C: "Europe"
 USoE505C_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE506C: "Africa"
 USoE506C_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE507C: "Middle East"
 USoE507C_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE508C: "Asia"
 USoE508C_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE509C: "Oceania"
 USoE509C_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE510C: "Pacific"
 USoE510C_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE600C: "The Cross and the Crown"
 USoE600C_desc: "Europe need to fulfill its legacy and become an empire once again."
 USoE601C: "The New Knights"
 USoE601C_desc: "In a hostile world, the military has taken control in Europe to save its people from corrupt politicians and foreign powers."
 USoE602C: "General of the European Armies"
 USoE602C_desc: "The general staff has decided that Europe will be led by an army general. He will be awarded with the rank of the General of the European Armies."
 USoE603C: "Air Marshal of Europe"
 USoE603C_desc: "The general staff has decided that Europe will be led by an air force general. He will be awarded with the rank of the Air Marshal of Europe."
 USoE604C: "Fleet Admiral of Europe"
 USoE604C_desc: "The general staff has decided that Europe will be led by an admiral. He will be awarded with the rank of the Fleet Admiral of Europe."
 USoE605C: "European Empire"
 USoE605C_desc: "Once again Europe has become an Empire and can defend the interests of its people on global level."
 USoE620C: "The New Emperor"
 USoE620C_desc: "Europe needs a new emperor who leads the continent through the 21st century."
 USoE621C: "Choose a House"
 USoE621C_desc: "Europe has many great houses with a long and glorious history. United for the first time, the continent needs to decide which house should rule in the 21st century."
 USoE622C: "House of Savoy"
 USoE622C_desc: "The House of Savoy is a royal dynasty that was established in 1003 in the historical Savoy region. Through gradual expansion, the family grew in power from ruling a small Alpine county north-west of Italy to absolute rule of the Kingdom of Sicily. Members of the house ruled Sardinia, Italy, Albania, Ethiopia and, for a short period, Spain. The house also claims the titles of Kings of Cyprus, Jerusalem and Armenia."
 USoE623C: "House of Wittelsbach"
 USoE623C_desc: "The House of Wittelsbach is a German-Bavarian dynasty, with branches that have ruled over territories including: Bavaria, Holland, Zeeland, Cologne, Sweden, Romania, Bohemia, Hungary, Denmark, Norway, Greece and the Holy Roman Empire. The line of Jacobite succession, which recognises the right for a Catholic monarch, acknowledges Franz, Hereditary Prince of Bavaria to be the rightful heir as Francis II."
 USoE624C: "House of Borbón-Anjou"
 USoE624C_desc: "The House of Borbón-Anjou is the reigning royal house of the Kingdom of Spain. By the 18th century, members of the Spanish Bourbon dynasty held thrones in Spain, Naples, Sicily, and Parma."
 USoE625C: "House of Bourbon"
 USoE625C_desc: "The House of Bourbon is a European dynasty of French origin, a branch of the Capetian dynasty, the royal House of France. Bourbon kings first ruled France and Navarre in the 16th century."
 USoE626C: "House of Hanover"
 USoE626C_desc: "The House of Hanover is a German royal house that ruled Hanover, Great Britain, and Ireland at various times during the 17th to 20th centuries. The house originated in 1635 as a cadet branch of the House of Brunswick-Lüneburg, growing in prestige until Hanover became an Electorate in 1692."
 USoE627C: "House of Glücksburg"
 USoE627C_desc: "The House of Glücksburg, shortened from House of Schleswig-Holstein-Sonderburg-Glücksburg, is a Dano-German branch of the House of Oldenburg, members of which have reigned at various times in Denmark, Norway, Greece and several northern German states."
 USoE628C: "House of Windsor"
 USoE628C_desc: "The House of Windsor is the reigning royal house of the United Kingdom and the other Commonwealth realms. In 1901, the House of Saxe-Coburg and Gotha succeeded the House of Hanover in the British monarchy. In 1917, the name of the royal house was changed from the German Saxe-Coburg and Gotha to the English Windsor (from Windsor Castle) because of World War I."
 USoE629C: "House of Orange-Nassau"
 USoE629C_desc: "The House of Orange-Nassau is the current reigning house of the Netherlands. A branch of the European House of Nassau, the house has played a central role in the politics and government of the Netherlands and Europe, especially since William the Silent organized the Dutch revolt against Spanish rule, which after the Eighty Years' War (1568–1648) led to an independent Dutch state. "
 USoE630C: "House of Habsburg-Lorraine"
 USoE630C_desc: "The House of Habsburg-Lorraine originated from the marriage in 1736 of Francis III, Duke of Lorraine and Bar, and Maria Theresa of Austria, later successively Queen of Bohemia, Queen of Hungary and Archduchess of Austria. Its members are the legitimate surviving line of the House of Habsburg and the House of Lorraine, inheriting their patrimonial possessions and vocation to the Empire."
 USoE631C: "House of Bonaparte"
 USoE631C_desc: "The House of Bonaparte is a former imperial and royal European dynasty of Italian origin. It was founded in 1804 by Napoleon I. Napoleon turned the Grande Armée against every major European power and dominated continental Europe through a series of military victories. He installed members of his family on the thrones of client states, extending the power of the dynasty."
 USoE632C: "House of Hohenzollern"
 USoE632C_desc: "The House of Hohenzollern is a German former royal dynasty whose members were variously princes, electors, kings and emperors of Hohenzollern, Brandenburg, Prussia, the German Empire, and Romania. The family arose in the area around the town of Hechingen in Swabia during the 11th century and took their name from Hohenzollern Castle."
 USoE633C: "Choose a Palace "
 USoE633C_desc: "The new Emperor of Europe needs a representative palace to rule."
 USoE634C: "Quirinal Palace"
 USoE634C_desc: "The Quirinal Palace is a historic building in Rome, Italy, and serves as one of the three current official residences of the President of the Italian Republic. The Quirinal Palace was selected by Napoleon to be his residence par excellence as Emperor. However, its permanence never took place because of the French defeat in 1814 and the subsequent European Restoration."
 USoE635C: "Neuschwanstein Castle"
 USoE635C_desc: "Neuschwanstein Castle is a 19th-century Romanesque Revival palace on a rugged hill in southwest Bavaria, Germany. The palace was commissioned by King Ludwig II of Bavaria. The castle was intended as a home for the King, until he died in 1886. It was open to the public shortly after his death. Since then, more than 61 million people have visited Neuschwanstein Castle."
 USoE636C: "Royal Palace of Madrid"
 USoE636C_desc: "The Royal Palace of Madrid is the official residence of the Spanish royal family at the city of Madrid, although now used only for state ceremonies. The palace has 135,000 square metres of floor space and contains 3,418 rooms. It is the largest functioning royal palace and the largest by floor area in Europe."
 USoE637C: "Palace of Versailles"
 USoE637C_desc: "The Palace of Versailles was the principal royal residence of France from 1682, under Louis XIV, until the start of the French Revolution in 1789, under Louis XVI. The palace is now a historical monument and UNESCO World Heritage site, notable especially for the ceremonial Hall of Mirrors and the vast Gardens of Versailles with fountains, canals, and geometric flower beds and groves."
 USoE638C: "Buckingham Palace"
 USoE638C_desc: "Buckingham Palace is the London residence and administrative headquarters of the monarch of the United Kingdom. Located in the City of Westminster, the palace is often at the centre of state occasions and royal hospitality. It has been a focal point for the British people at times of national rejoicing and mourning."
 USoE639C: "Hofburg"
 USoE639C_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty rulers and today serves as the official residence and workplace of the President of Austria. It is located in the centre of Vienna and was built in the 13th century and expanded several times afterwards."
 USoE640C: "Sanssouci"
 USoE640C_desc: "Sanssouci was the summer palace of Frederick the Great, King of Prussia, in Potsdam, near Berlin. It is often counted among the German rivals of Versailles. While Sanssouci is in the more intimate Rococo style and is far smaller than its French Baroque counterpart, it too is notable for the numerous temples and follies in the park."
 USoE641C: "A New Palace"
 USoE641C_desc: "A new emperor needs an new palace, not a historic monument. Let's build a new palace with modern architecture in Brussels."
 USoE642C: "Coronation"
 USoE642C_desc: "Europe needs to prepare for the coronation of the new Emperor. But first, it needs to decide which crown the emperor should wear and who should do the coronation."
 USoE643C: "The Imperial Crown"
 USoE643C_desc: "The new empire is the continuation and the legacy of the Holy Roman Empire, so the emperor needs to wear the Crown of the Holy Roman Empire."
 USoE644C: "A New Ecumenical Crown"
 USoE644C_desc: "A new empire and a new emperor need a new crown and not a historic relict."
 USoE645C: "By the Pope"
 USoE645C_desc: "The new emperor by the grace of god needs to be crowned by the pope."
 USoE646C: "By the People"
 USoE646C_desc: "The new Emperor needs to be crowned by the people, so let's call for an election to legitimate His Majesty's rule."
 USoE647C: "The Holy European Empire"
 USoE647C_desc: "The emperor is crowned and the Holy European Empire is established."
 USoE700C: "Pax Occidentalis"
 USoE700C_desc: "Europe has acquired global dominance and can enforce world peace. This era will be called Pax Occidentalis."
 USoE701C: "Guardians of World Peace"
 USoE701C_desc: "Europe, America, Russia and China have settled their spheres of influence. Every superpower enforces peace in their sphere and so they are the guardians of world peace."
 
 
##################### European Union Module A3 #####################
 EU001B: "EU Policies"
 EU001B_desc: "The policies of §Y[EUU.GetFlag] The EU§! are determined by the Union’s values, objectives and principles. Because the EU started as an economic community, economic policy is still an important area in the EU. In keeping with its values, the EU seeks to promote the wellbeing, security and interests of the citizens. The EU wishes to keep the economy stable and competitive. The EU tries to reform itself..."
 EU002B: "EU Candidate"
 EU002B_desc: "Before applying for membership to §Y[EUU.GetFlag] The European Union§! We need to get EU Candidate status. The will be hard negotiations with the member states of §Y[EUU.GetFlag] The European Union§!. We will need a lot of influence."
 EU100B: "EU Reforms"
 EU100B_desc: "The member states try to reform §Y[EUU.GetFlag] The European Union§! to strengthen the European integration."
 EU101B: "Charter of Fundamental Rights of the European Union"
 EU101B_desc: "\"The peoples of Europe, in creating an ever closer union among them, are resolved to share a peaceful future based on common values. Conscious of its spiritual and moral heritage, the Union is founded on the indivisible, universal values of human dignity, freedom, equality and solidarity; it is based on the principles of democracy and the rule of law.\" - Preamble of the CFR"
 EU102B: "European Convention"
 EU102B_desc: "Following the Laeken declaration the European Council has decided to convene a Convention on the future of the Union to make a decisive step for the citizen towards a simpler Union, one that is stronger in the pursuit of its essential objectives and more definitely present in the world."
 EU103B: "European Constitution"
 EU103B_desc: "The European Convention ended with the Draft of the Treaty establishing a Constitution for Europe. This international treaty would replace the existing European treaties to create a consolidated constitution for §Y[EUU.GetFlag] The European Union§! and expanded Qualified Majority Voting into policy areas which had previously been decided by unanimity among member states."
 EU104B: "Treaty of Lisbon"
 EU104B_desc: "The process leading to the Lisbon Treaty is a result of the negative outcome of the ratification of the European Constitution. Treaty of Lisbon amending the Treaty on European Union and the Treaty establishing the European Community. The last is renamed the Treaty on the Functioning of the European Union."
 EU105B: "European External Action Service"
 EU105B_desc: "The European External Action Service is the European Union's diplomatic service. It helps the EU's foreign affairs chief – the High Representative for Foreign Affairs and Security Policy – carry out the Union's Common Foreign and Security Policy."
 EU200B: "EU Fiscal Policies"
 EU200B_desc: "Fiscal policies have a significant impact on economic growth, macroeconomic stability and inflation. Key aspects in this respect are the level and composition of government expenditure and revenue, budget deficits and government debt. The need for fiscal discipline is even stronger in a monetary union, such as the euro area, which is made of sovereign states that retain responsibility for their fiscal policies."
 EU201B: "ECB Intervention"
 EU201B_desc: "To implement its monetary policy decisions, the Governing Council of the ECB has adopted a set of monetary policy instruments and procedures as laid down in the General documentation on Eurosystem monetary policy instruments and procedures."
 EU202B: "European Banking Union"
 EU202B_desc: "In response to the recent financial crisis the European Banking Union was created for a safer financial sector for the single market. These initiatives form a single rulebook for all financial actors in the EU member states. They include stronger prudential requirements for banks, improved protection for depositors and rules for managing failing banks."
 EU203B: "Eurobonds"
 EU203B_desc: "Eurobonds are a new option of financing public debt. Such common issuance of bonds by the eurozone members would imply a significant deepening of the monetary union. It would create new means through which governments finance their debt, by offering safe and liquid investment opportunities for savers and financial institutions and by setting up a Eurobond market that matches the US bond market."
 EU204B: "European Financial Stability Facility (EFSF)"
 EU204B_desc: "The EFSF was created as a temporary crisis resolution mechanism by the euro area member states in European debt crisis and provided financial assistance to several member states. This was financed by the EFSF through the issuance of EFSF bonds and other debt instruments on capital markets. The EFSF does not provide any further financial assistance, as this task is now performed solely by the ESM."
 EU205B: "European Stability Mechanism (ESM)"
 EU205B_desc: "The ESM’s mission is to provide financial assistance to euro area countries experiencing or threatened by severe financing problems. This assistance is granted only if it is proven necessary to safeguard the financial stability of the euro area as a whole and of ESM Members."
 EU206B: "Fiscal Union"
 EU206B_desc: "Fiscal union involves member states sharing the same common budget. It means spending and tax levels would be taken by a central fiscal authority. Fiscal union is proposed as a step for further European integration. It would mean a central European authority would set spending and tax rates for all member states."
 EU207B: "European Economic Government"
 EU207B_desc: "A European Economic Government would make possible a common fiscal and active economic policy in the EU. It would give §Y[EUU.GetFlag] The European Union§! an own tax authority and a central authority would set minimum wages for the member states."
 EU208B: "European Minister of Economy and Finance"
 EU208B_desc: "A European Minister of Economy and Finance combines the policies and powers established by the Fiscal Union and the European Economic Government into one office."
 EU300B: "EU Defense Policies"
 EU300B_desc: "The Common Security and Defence Policy (CSDP) enables the Union to take a leading role in peace-keeping operations, conflict prevention and in the strengthening of the international security. It is an integral part of the EU's comprehensive approach towards crisis management, drawing on civilian and military assets."
 EU301B: "European Defence Agency (EDA)"
 EU301B_desc: "The European Defence Agency was established to support the member states and §Y[EUU.GetFlag] The European Union§! in their effort to improve European defence capabilities in the field of crisis management and to sustain the European Security and Defence Policy as it stands now and develops in the future."
 EU302B: "Permanent Structured Cooperation (PESCO)"
 EU302B_desc: "PESCO allows thus willing and able member states to jointly plan, develop and invest in shared capability projects, and enhance the operational readiness and contribution of their armed forces. The aim is to jointly develop a coherent full spectrum force package and make the capabilities available to member states for national and multinational missions and operations."
 EU303B: "European Defence Fund"
 EU303B_desc: "The European Defence Fund will provide a key contribution to Europe’s strategic autonomy, protecting and defending its citizens. It will promote defence cooperation among companies and between EU countries to foster innovation and develop state-of-the-art defence technology and products. The fund will coordinate, supplement and amplify national investments in defence."
 EU304B: "European Security Council"
 EU304B_desc: "A ESC would make the EU better prepared for making decisions about international politics. If the EU does not manage to take and implement coherent decisions more quickly, their ability to enforce EU rules and strengthen multilateral formats will be weakened. The EU’s diplomatic, financial and military resources should therefore be supplemented by a format for more effective intergovernmental cooperation."
 EU305B: "EuroArmy"
 EU305B_desc: "To strength the military capabilities of §Y[EUU.GetFlag] The European Union§! the member states can draft common armed forces. These forces will be known as §YEuroArmy§!"
 EU306B: "EuroNavy"
 EU306B_desc: "With multinational fleets and task forces becoming more common and important in the 21st century the member states of §Y[EUU.GetFlag] The European Union§! can join their forces and transfer their warships to a unified European Naval Command known as §YEuroNavy§!."
 EU307B: "EU Permanent Member of the UNSC"
 EU307B_desc: "The member states have decided that the EU should be a permanent member of the United Nations Security Council (UNSC). This is done by reforming the UNSC or by transferring the seat(s) of the member state(s) already being UNSC member(s) to the EU."
 EU308B: "EU Nuclear Power"
 EU308B_desc: "Becoming a nuclear power will strength the political power of the EU and the influence of the Union in the world. The Union will acquire the nuclear weapons by transferring and sharing the nuclear weapons of their member states or by developing own nuclear warheads."
 EU400B: "EU Secondary Legislation"
 EU400B_desc: "The EU treaties are binding agreements between EU member states set out EU objectives, rules for EU institutions, how decisions are made and the relationship between the EU and its members. Treaties are known as primary law. The body of law that comes from the principles and objectives of the treaties is known as secondary law (regulations, directives, decisions, recommendations and opinions)."
 EU401B: "General Data Protection Regulation"
 EU401B_desc: "The EU General Data Protection Regulation (GDPR) is designed to: harmonize data privacy laws across Europe, protect and empower all EU citizens data privacy and reshape the way organizations across the region approach data privacy."
 EU402B: "Directive on Copyright in the Digital Single Market"
 EU402B_desc: "Digital technologies have radically changed the way creative content is produced, distributed and accessed. We are adapting the EU copyright rules to new consumer behaviours in a Europe which values its cultural diversity."
 EU403B: "Dublin II Regulation"
 EU403B_desc: "The Dublin II Regulation establishes the principle that only one member state is responsible for examining an asylum application. The objective is to avoid asylum seekers from being sent from one country to another, and also to prevent abuse of the system by the submission of several applications for asylum by one person."
 EU404B: "Relocation and Resettlement of Asylum Seekers"
 EU404B_desc: "Asylum seekers with a high chance of having their applications successfully processed are relocated from Greece and Italy, where they have arrived, to other member states where they will have their asylum applications processed. If these applications are successful, the applicants will be granted refugee status with the right to reside in the member state to which they are relocated."
 EU405B: "EU–Turkey deal"
 EU405B_desc: "§Y[EUU.GetFlag] The European Union§! and [TUR.GetNameWithFlag] will negotiate an agreement aimed at stopping the flow of irregular migration via Turkey to Europe. All new irregular migrants and asylum seekers arriving from Turkey to the Greek islands and whose applications for asylum have been declared inadmissible should be returned to Turkey. §Y[EUU.GetFlag] The European Union§! will pay 3 billion Euro for the Facility for Refugees in Turkey."
 EU406B: "European Asylum Agency"
 EU406B_desc: "The EU Commission proposed a future EU Asylum Agency equipped with the necessary mandate, tools and financial means needed to provide a rapid and full service to member states throughout the asylum procedure."
 EU407B: "Frontex"
 EU407B_desc: "Frontex helps EU countries and Schengen associated countries manage their external borders. It also to helps to harmonise border controls across the EU. The agency facilitates cooperation between border authorities in each EU country, providing technical support and expertise."
 EU408B: "European Border and Coast Guard Agency"
 EU408B_desc: "Frontex becomes the European Border and Coast Guard Agency. Europe’s external borders have seen an unprecedented rise in the number of migrants and refugees wishing to enter the EU in recent years. Countries that have an external border have sole responsibility for border control. But Frontex can provide additional technical support for EU countries facing severe migratory pressure."
 EU500B: "European Commission Policies "
 EU500B_desc: "European Commission Policies "
 EU600B: "EU Enlargement"
 EU600B_desc: "Enlargement policy applies to countries currently aspiring to join the EU and potential candidates. The prospect of membership is a powerful stimulus for democratic and economic reforms in countries that want to become EU members."
 EU601B: "2004 enlargement of the European Union"
 EU601B_desc: "On 1 May 2004 ten new countries with a combined population of almost 75 million joined the EU. The 25-member EU now has 450 million citizens and includes three former Soviet republics (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! and §Y[LIT.GetNameWithFlag]§!), four former satellites of the USSR (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! and §Y[SLO.GetNameWithFlag]§!), a former Yugoslav republic (§Y[SLV.GetNameWithFlag]§!) and two Mediterranean islands (§Y[CYP.GetNameWithFlag]§! and §Y[MLT.GetNameWithFlag]§!)."
 EU602B: "2007 enlargement of the European Union"
 EU602B_desc: "Two more countries from eastern Europe - §Y[BUL.GetNameWithFlag]§!and §Y[ROM.GetNameWithFlag]§! - join the EU, bringing the number of member states to 27."
 EU603B: "2013 enlargement of the European Union"
 EU603B_desc: "2013 §Y[CRO.GetNameWithFlag]§! joined the EU, bringing the number of member states to 28."
 EU700B: "Withdrawal Policies"
 EU700B_desc: "With rising Euroscepticism throughout the Union some member states will think about leaving §Y[EUU.GetFlag] The European Union§!."
 EU701B: "Article 50"
 EU701B_desc: "\"Any Member State may decide to withdraw from the Union in accordance with its own constitutional requirements.\"\n- Article 50(1), Treaty on European Union.\nFirst Article 50 was drafted for the Constitutional Treaty for the European Union. Following the failure of the ratification of the Constitution, the clause was incorporated into the Treaty of Lisbon."
 EU702B: "Withdrawal Treaty"
 EU702B_desc: "Withdrawal from §Y[EUU.GetFlag] The European Union§! is a complex process where the leaving country has to adapt its national law for time when the EU law expires due to the leaving of the Union. The leaving country and the §Y[EUU.GetFlag] The European Union§! have to reach an agreement on their future relationship."
 EU703B: "No Deal Exit"
 EU703B_desc: "If a Withdrawal Treaty with §Y[EUU.GetFlag] The European Union§! is not reached, emergency measures have to be taken to protect our people from the chaos of a No Deal Exit."
 EU110B: "Federalisation of the European Union"
 EU110B_desc: "The process of European integration has reached a state where any further integration will lead to a Federalisation of §Y[EUU.GetFlag] The European Union§!."
 EU111B: "United States of Europe"
 EU111B_desc: "After more than 70 years of European integration the member states of §Y[EUU.GetFlag] The European Union§! have decided to give up their sovereignty and form the §Y[EUU.GetFlag] The United States of Europe§!."
 EU112B: "European Federation"
 EU112B_desc: "The member states of §Y[EUU.GetFlag] The European Union§! have decided to transfer the Union into §Y[EUU.GetFlag] The European Federation§! with the Qualified Majority Voting as fundamental principle and headed by the §YPresident of the European Federation§!."
 EU113B: "Europe of Fatherlands"
 EU113B_desc: "Any further European integration will jeopardise the cultural heritage, the national Identities and the sovereignty of the member states. Europe is a Europe of Fatherlands, so the European integration has to stop at this stage."
 EU604B: "Future enlargement of the European Union"
 EU604B_desc: "Future enlargement of the European Union"
 EU605B: "Western Balkans Enlargement"
 EU605B_desc: "The Western Balkan countries of §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! and §Y[KOS.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU606B: "Turkey"
 EU606B_desc: "§Y[TUR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU607B: "Black Sea Enlargement"
 EU607B_desc: "The Black Sea countries of §Y[MLV.GetNameWithFlag]§! and §Y[UKR.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU608B: "Caucasus Enlargement"
 EU608B_desc: "The Caucasus countries of §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! and §Y[GEO.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU609B: "European Economic Area"
 EU609B_desc: "The non-EU countries of the European Economic Area (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! and §Y[ICE.GetNameWithFlag]§!) become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU610B: "Belarus"
 EU610B_desc: "§Y[BLR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU611B: "Internal Enlargement"
 EU611B_desc: "Internal enlargement is the process of new member states arising from the break-up of or secession from an existing member state. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! and §Y[WAS.GetNameWithFlag]§! can become candidates for joining §Y[EUU.GetFlag] The European Union§!, when they become independent."
 POTEF001B: "President of the  European Federation"
 POTEF001B_desc: "The §YPresident of the European Federation (POTEF)§! is the paramount leader of Europe. Therefore the President of the European Federation has the power to make the decisive strategic decisions for the whole Federation."
 POTEF100B: "Alpine Doctrine"
 POTEF100B_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member state can adopt this tradition and tactics."
 POTEF101B: "The Integrity of Creation"
 POTEF101B_desc: "To save and conserve the Integrity of Creation the European Federation adapts its policies."
 POTEF102B: "Environmental Imperialism"
 POTEF102B_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF103B: "North America"
 POTEF103B_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF104B: "South America"
 POTEF104B_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF105B: "Europe"
 POTEF105B_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF106B: "Africa"
 POTEF106B_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF107B: "Middle East"
 POTEF107B_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF108B: "Asia"
 POTEF108B_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF109B: "Oceania"
 POTEF109B_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF110B: "Pacific"
 POTEF110B_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF150B: "German Doctrine"
 POTEF150B_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member state can adopt this tradition and tactics."
 POTEF151B: "Empire of Trade"
 POTEF151B_desc: "The European Federation will become an Empire of Trade."
 POTEF200B: "French Doctrine"
 POTEF200B_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member state can adopt this tradition and tactics."
 POTEF201B: "Imperial Power"
 POTEF201B_desc: "The European Federation stands in the tradition of its imperial predecessors."
 POTEF202B: "Empire of Freedom"
 POTEF202B_desc: "The European Federation will become an Empire of Freedom."
 POTEF203B: "America: Ally or Adversary"
 POTEF203B_desc: "America and Europe have been allies for most of the 20th century. With the recent political changes in §Y[USA.GetNameWithFlag]§! this has been questioned…"
 POTEF204B: "NATO Legacy"
 POTEF204B_desc: "In the Tradition of the peacekeeping Legacy of NATO §Y[USA.GetNameWithFlag]§! and the §YEDU§! form a new alliance."
 POTEF205B: "Trump's Legacy"
 POTEF205B_desc: "§Y[USA.GetNameWithFlag]§! went form an ally to an adversary. Europe has to react to this decisive strategic change."
 POTEF206B: "Break the Wall"
 POTEF206B_desc: "To counter the American threat to European sovereignty, the general staff of the §YEDU§! has drafted a plan to ally with §Y[MEX.GetNameWithFlag]§! and invade §Y[USA.GetNameWithFlag]§! from the South."
 POTEF207B: "Buster's Resurrection"
 POTEF207B_desc: "To counter the US threat to Europe, the general staff of the §YEDU§! has proposed to ally with §Y[CAN.GetNameWithFlag]§! and revise the Defence Scheme No. 1, a plan created by Canadian Lt Col James 'Buster' Sutherland Brown, for a Canadian pre-emptive attack against the US in the event of an imminent conflict between the US and the British Empire. With this plan the §YEDU§! can launch an invasion from the North on §Y[USA.GetFlag] the US§!."
 POTEF250B: "Benelux Doctrine"
 POTEF250B_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member state can adopt this tactics."
 POTEF251B: "Liberal Legacy"
 POTEF251B_desc: "The European Federation honors its Liberal Legacy."
 POTEF252B: "Safeguard the old Traderouts"
 POTEF252B_desc: "The European Federation needs to safeguard the old Traderouts to the Caribbean, Africa and the former Dutch East Indies."
 POTEF253B: "Indonesia"
 POTEF253B_desc: "The European Federation needs to improve its relationship to the former Dutch colony §Y[IND.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF300B: "Iberian Doctrine"
 POTEF300B_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member state can adopt this tradition and tactics."
 POTEF301B: "Latin Cousins"
 POTEF301B_desc: "The European Federation needs to improve its relationship to the former colonies in South America."
 POTEF302B: "Mexico"
 POTEF302B_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[MEX.GetNameWithFlag]§! and build new strategic outposts in Central America."
 POTEF303B: "Greater Colombia"
 POTEF303B_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[COL.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF304B: "Central America"
 POTEF304B_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in §YCentral America§! and build new strategic outposts there."
 POTEF305B: "Southern Cone"
 POTEF305B_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in the §YSouthern Cone of South America§! and build new strategic outposts there."
 POTEF306B: "Brazil"
 POTEF306B_desc: "The European Federation needs to improve its relationship to the former Portuguese  colony §Y[BRA.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF350B: "British Doctrine"
 POTEF350B_desc: "The §YBritain§! traditionally focused on strong a strong Navy. With the Naval Doctrine all member state can adopt this tradition and tactics."
 POTEF351B: "Safeguard the North Atlantic"
 POTEF351B_desc: "To secure the Freedom of the Seas and free trade the European Federation needs to control the North Atlantic."
 POTEF352B: "Commonwealth Legacy"
 POTEF352B_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominions."
 POTEF353B: "Canada"
 POTEF353B_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[CAN.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF354B: "Australia"
 POTEF354B_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[AST.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF355B: "New Zealand"
 POTEF355B_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[NZL.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF356B: "Safeguard the North Sea"
 POTEF356B_desc: "The North Sea is the backyard of European Federation and needs to be secured."
 POTEF357B: "Malaya Legacy"
 POTEF357B_desc: "The European Federation needs to improve its relationship to the former British colonies of Malaya."
 POTEF358B: "Malaysia"
 POTEF358B_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[MAY.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF359B: "Singapore"
 POTEF359B_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[SIN.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF360B: "Guarantee Hong Kong"
 POTEF360B_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and gurantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400B: "Nordic Doctrine"
 POTEF400B_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member state can adopt this tradition and tactics."
 POTEF401B: "Safeguard the Arctic"
 POTEF401B_desc: "To secure the Freedom of the Seas and its geostrategic position the European Federation needs to control the Arctic."
 POTEF450B: "Mediterranean Doctrine"
 POTEF450B_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member state can adopt this tradition and tactics."
 POTEF451B: "Northern Africa"
 POTEF451B_desc: "To create a convergence zone and a safe harbor for refugees the European Federation needs to improve its relationship to §YNorthern Africa§! and build new strategic outposts there."
 POTEF452B: "Unite Cyprus"
 POTEF452B_desc: "As sovereign member state of the European Federation §Y[CYP.GetNameWithFlag]§! needs to be reunited."
 POTEF500B: "Balkan Doctrine"
 POTEF500B_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member state can adopt this tradition and tactics."
 POTEF501B: "Balkan Infrastructure"
 POTEF501B_desc: "The European Federation needs to develop the infrastructure of the Balkan to preserve the regional peace and secure the Balkan from foreign influence."
 POTEF502B: "Contest the Silk Road"
 POTEF502B_desc: "The European Federation needs to contest China's new silk road and reduce the Chinese influence in Central Asia."
 POTEF503B: "Competitor China"
 POTEF503B_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major compeditor of the European Federation on global level. The European Federation needs to adept its policies to this."
 POTEF504B: "Operation Arrow"
 POTEF504B_desc: "Named after the Arrow War (Second Anglo-Chinese War), Operation Arrow is a plan for a European intervention in §Y[CHI.GetNameWithFlag]§! to stop the Chinese expansion policy."
 POTEF505B: "Asian Allies"
 POTEF505B_desc: "To confront §Y[CHI.GetNameWithFlag]§!, the European Federation needs allies in Asia."
 POTEF506B: "Republik of Korea"
 POTEF506B_desc: "§Y[KOR.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF507B: "Japan"
 POTEF507B_desc: "§Y[JAP.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF550B: "Black Sea Doctrine"
 POTEF550B_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member state can adopt this tactics."
 POTEF551B: "Safeguard the Black Sea"
 POTEF551B_desc: "The Black Sea is the conection of European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552B: "Reintegrate the Breakaway Republics"
 POTEF552B_desc: "§Y[SOV.GetNameWithFlag]§! has violated the sovereignty of various eastern member states of the European Federation by supporting separatist movements and creating Breakway Republics. We need to reintegrate these Russian minions. "
 POTEF553B: "Rival Russia"
 POTEF553B_desc: "§Y[SOV.GetNameWithFlag]§! has become a major rival of the European Federation. We need to impose sanctions on them. "
 POTEF554B: "Operation Charlemagne"
 POTEF554B_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600B: "Caucasus Doctrine"
 POTEF600B_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focuse on a strong defense to fit the new situation. With the Defense Doctrine all member state can adopt this tactics."
 POTEF601B: "European Access"
 POTEF601B_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure needs to be build."
 POTEF650B: "Visegrad Doctrine"
 POTEF650B_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member state can adopt this tradition and tactics."
 POTEF651B: "European Air Defense Network"
 POTEF651B_desc: "The European Federation needs to build an Air Defense Network to secure its Eastern flank."
 POTEF652B: "Eastern Firewall"
 POTEF652B_desc: "The rising influence of §Y[SOV.GetNameWithFlag]§! in the Eastern member states need to be countered."
 POTEF700B: "Baltic Doctrine"
 POTEF700B_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member state can adopt this tradition and tactics."
 POTEF701B: "Safeguard the Baltic Sea"
 POTEF701B_desc: "The Baltic Sea is the island sea of the European Federation and needs to be secured."
 POTEF800B: "Pax Europaea"
 POTEF800B_desc: "The European Federation needs to become the global superpower to enforce world peace."
 USoE001B: "Constitute the new European Nation"
 USoE001B_desc: "The unified European Union needs to constitute itself as a new nation. The Constitution and the Unification Treaties are one thing, but now the people need to fulfill that legal framework with life."
 USoE002B: "A European Officer Corps"
 USoE002B_desc: "In the Union, every member state had its own army and later there was the EuroArmy. We need to create a European Officer Corps with common doctrine and training."
 USoE003B: "European Political Parties"
 USoE003B_desc: "A new nation needs new political parties. The former political parties of the member states have to unify."
 USoE004B: "European Patriotism"
 USoE004B_desc: "A new nation needs its own patriotism and national symbols."
 USoE005B: "The New Great Game"
 USoE005B_desc: "The New Great Game has just begun and Europe is late, while the US, China and Russia already made their first moves."
 USoE006B: "Europe's Heart and Soul"
 USoE006B_desc: "The new nation needs to define its values and standards. Europe needs a Heart and Soul!"
 USoE100B: "A Game of Spheres"
 USoE100B_desc: "When you play the game of spheres, you win or you die. There is no middle ground."
 USoE101B: "Engage the Eagle"
 USoE101B_desc: "The American Eagle needs to be grounded! It has flown far too long over European skies."
 USoE102B: "Brawl with the Bear"
 USoE102B_desc: "We need to strike the Bear before he strikes us."
 USoE103B: "Dance with the Dragon"
 USoE103B_desc: "The Dance with the Dragon is a dangerous game."
 USoE104B: "A Heart of Iron"
 USoE104B_desc: "In ancient times, the blacksmiths would forge an iron throne out of the weapons of the beaten villains. In our days, we just declare Europe has proven its heart of iron and is now the uncontested world ruler! "
 USoE200B: "Peaceful Coexistence"
 USoE200B_desc: "There are sharper swords than those of iron. Why pay with blood if you can pay with money?"
 USoE201B: "America First"
 USoE201B_desc: "We need to respect the America First doctrine if we want that our doctrines are respected."
 USoE202B: "Russosphere"
 USoE202B_desc: "Russia is the protector of all Russian people. That's their sphere of influence, which we need to respect."
 USoE203B: "Shinosphere"
 USoE203B_desc: "China's sphere of influence covers southeast Asia and doesn't bother us. China is our trade partner, not our rival."
 USoE204B: "Eurosphere"
 USoE204B_desc: "We appeased all superpowers of the 21st century, now we have free hands to establish the Eurosphere in Europe, Levant and North Africa."
 USoE300B: "Clash of Civilizations"
 USoE300B_desc: "The Clash of Civilizations was a thesis from American political scientist Samuel P. Huntington, that people's cultural and religious identities will be the primary source of conflict in the post-Cold War world. The future wars will be fought not between countries, but between cultures."
 USoE301B: "The Rest of the West"
 USoE301B_desc: "Europe is the rest of the west. America has left us alone and isolated in the America First doctrine."
 USoE302B: "Cross and Crescent"
 USoE302B_desc: "At Europe's southeast border, the cross clashes with the crescent. Who will prevail: the Western or the Islamic civilization?"
 USoE303B: "The Pope and the Patriarch"
 USoE303B_desc: "Since the Great Schism of 1054, the pope and the Orthodox patriarch have gone different paths. It's time to unite again to defend the Western civilization."
 USoE304B: "Two Crosses"
 USoE304B_desc: "Eastern and Western Christianity need to unite against Islam."
 USoE305B: "Eurasian Alliance"
 USoE305B_desc: "After the dissolution of NATO, Europe can form a new great alliance with its Russian neighbour."
 USoE306B: "Constantinople"
 USoE306B_desc: "Constantinople is part of the West. Europe needs to free it form the Islamic influence."
 USoE307B: "Antioch"
 USoE307B_desc: "The Principality of Antioch was one of the crusader states created during the First Crusade. It belongs to the West and shall be free from Islam once again."
 USoE308B: "Tripoli"
 USoE308B_desc: "The County of Tripoli (1109–1289) was the last of the crusader states. It shall rise again. Europe needs to free the Levant from Islam."
 USoE309B: "Jerusalem"
 USoE309B_desc: "Europe needs to save the Holy City from Islamic influence. The Kingdom of Jerusalem shall guard the holy sites once again."
 USoE310B: "Knights of Malta"
 USoE310B_desc: "Europe needs to free Northern Africa from Islamic influence. Europe will follow the example of Knights of Malta."
 USoE311B: "Arabian Westernization"
 USoE311B_desc: "Some countries on the Arabian Peninsula already have close ties to the West. Europe needs to fully westernize the Arabian Peninsula to have a safe neighbourhood."
 USoE312B: "Indian Westernization"
 USoE312B_desc: "With the colonial legacy, India has traditionally close ties to the West. Europe should deepen this relation to fully westernize India."
 USoE313B: "The Republic of Persia"
 USoE313B_desc: "Iran is one of the major rivals of the West in the Middle East. Europe can stop Iran's conquest for regional hegemony when Europe westernizes Iran to the Republic of Persia."
 USoE320B: "The West vs the Rest"
 USoE320B_desc: "Europe and America are the western superpowers that can match every enemy in the world. With NATO as a base, the West can enforce its global dominance."
 USoE321B: "Asian Westernization"
 USoE321B_desc: "The West needs to focus on the emerging powers in Asia. The West should fight or westernize them."
 USoE322B: "The Four Tigers"
 USoE322B_desc: "The Four Asian Tigers of Hong Kong, Singapore, South Korea and Taiwan always had close ties to the West and fear the emerging Chinese dragon. They could be viable allies of the West in Asia."
 USoE323B: "Japan"
 USoE323B_desc: "After the end of the World War II, Japan was an important ally of the West in Asia. The West needs to continue this close partnership."
 USoE324B: "China"
 USoE324B_desc: "China is the major rival of the West in Asia. If the West can westernize China, there will be no contender for Western hegemony in Asia."
 USoE325B: "Operation Unthinkable 2.0"
 USoE325B_desc: "Operation Unthinkable was a war plan of the British Chiefs of Staff against the Soviet Union ordered by Winston Churchill in May 1945. Together with the former German Wehrmacht, the western allies should launch a surprise attack on the Soviet Union. The West needs to revise that plan to fit the current setup and act in preemptive self-defense against Russia to prevent Russian hegemony in Europe."
 USoE400B: "The Torch of Freedom"
 USoE400B_desc: "Europe needs to carry on the Torch of Freedom! The United States of Europe are a democratic republic which respects the human rights and the rule of law."
 USoE401B: "Digital Democracy"
 USoE401B_desc: "Europe needs to reform its democratic institutions for the digital age. With social media and social networks, the people can directly participate in legislation and government."
 USoE402B: "Hammer and Sickle"
 USoE402B_desc: "Karl Marx and Friedrich Engels, the fathers of Socialism and Marxism, were Europeans. Europe needs to carry on that legacy."
 USoE403B: "EUSSR"
 USoE403B_desc: "The European left trapped the capitalists in the European Union, now the spiritual heir of Karl Marx and Friedrich Engels have the power to establish the EUSSR: the European Union of Soviet Socialist Republics."
 USoE404B: "AI Government"
 USoE404B_desc: "Artificial intelligence has evolved enough to govern a country more efficiently than inefficient and possibly corrupt human politicians. The AI agent of the ruling party will take control and rule the country based on the values of the ruling party."
 USoE500B: "The Green Future"
 USoE500B_desc: "With the undeniable climate change, there is no future but a green future for Europe."
 USoE501B: "Environmental Empire"
 USoE501B_desc: "Europe needs to become an Environmental Empire where economy and environment are no contradiction."
 USoE502B: "Environmental Imperialism"
 USoE502B_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE503B: "North America"
 USoE503B_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE504B: "South America"
 USoE504B_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE505B: "Europe"
 USoE505B_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE506B: "Africa"
 USoE506B_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE507B: "Middle East"
 USoE507B_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE508B: "Asia"
 USoE508B_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE509B: "Oceania"
 USoE509B_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE510B: "Pacific"
 USoE510B_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE600B: "The Cross and the Crown"
 USoE600B_desc: "Europe need to fulfill its legacy and become an empire once again."
 USoE601B: "The New Knights"
 USoE601B_desc: "In a hostile world, the military has taken control in Europe to save its people from corrupt politicians and foreign powers."
 USoE602B: "General of the European Armies"
 USoE602B_desc: "The general staff has decided that Europe will be led by an army general. He will be awarded with the rank of the General of the European Armies."
 USoE603B: "Air Marshal of Europe"
 USoE603B_desc: "The general staff has decided that Europe will be led by an air force general. He will be awarded with the rank of the Air Marshal of Europe."
 USoE604B: "Fleet Admiral of Europe"
 USoE604B_desc: "The general staff has decided that Europe will be led by an admiral. He will be awarded with the rank of the Fleet Admiral of Europe."
 USoE605B: "European Empire"
 USoE605B_desc: "Once again Europe has become an Empire and can defend the interests of its people on global level."
 USoE620B: "The New Emperor"
 USoE620B_desc: "Europe needs a new emperor who leads the continent through the 21st century."
 USoE621B: "Choose a House"
 USoE621B_desc: "Europe has many great houses with a long and glorious history. United for the first time, the continent needs to decide which house should rule in the 21st century."
 USoE622B: "House of Savoy"
 USoE622B_desc: "The House of Savoy is a royal dynasty that was established in 1003 in the historical Savoy region. Through gradual expansion, the family grew in power from ruling a small Alpine county north-west of Italy to absolute rule of the Kingdom of Sicily. Members of the house ruled Sardinia, Italy, Albania, Ethiopia and, for a short period, Spain. The house also claims the titles of Kings of Cyprus, Jerusalem and Armenia."
 USoE623B: "House of Wittelsbach"
 USoE623B_desc: "The House of Wittelsbach is a German-Bavarian dynasty, with branches that have ruled over territories including: Bavaria, Holland, Zeeland, Cologne, Sweden, Romania, Bohemia, Hungary, Denmark, Norway, Greece and the Holy Roman Empire. The line of Jacobite succession, which recognises the right for a Catholic monarch, acknowledges Franz, Hereditary Prince of Bavaria to be the rightful heir as Francis II."
 USoE624B: "House of Borbón-Anjou"
 USoE624B_desc: "The House of Borbón-Anjou is the reigning royal house of the Kingdom of Spain. By the 18th century, members of the Spanish Bourbon dynasty held thrones in Spain, Naples, Sicily, and Parma."
 USoE625B: "House of Bourbon"
 USoE625B_desc: "The House of Bourbon is a European dynasty of French origin, a branch of the Capetian dynasty, the royal House of France. Bourbon kings first ruled France and Navarre in the 16th century."
 USoE626B: "House of Hanover"
 USoE626B_desc: "The House of Hanover is a German royal house that ruled Hanover, Great Britain, and Ireland at various times during the 17th to 20th centuries. The house originated in 1635 as a cadet branch of the House of Brunswick-Lüneburg, growing in prestige until Hanover became an Electorate in 1692."
 USoE627B: "House of Glücksburg"
 USoE627B_desc: "The House of Glücksburg, shortened from House of Schleswig-Holstein-Sonderburg-Glücksburg, is a Dano-German branch of the House of Oldenburg, members of which have reigned at various times in Denmark, Norway, Greece and several northern German states."
 USoE628B: "House of Windsor"
 USoE628B_desc: "The House of Windsor is the reigning royal house of the United Kingdom and the other Commonwealth realms. In 1901, the House of Saxe-Coburg and Gotha succeeded the House of Hanover in the British monarchy. In 1917, the name of the royal house was changed from the German Saxe-Coburg and Gotha to the English Windsor (from Windsor Castle) because of World War I."
 USoE629B: "House of Orange-Nassau"
 USoE629B_desc: "The House of Orange-Nassau is the current reigning house of the Netherlands. A branch of the European House of Nassau, the house has played a central role in the politics and government of the Netherlands and Europe, especially since William the Silent organized the Dutch revolt against Spanish rule, which after the Eighty Years' War (1568–1648) led to an independent Dutch state. "
 USoE630B: "House of Habsburg-Lorraine"
 USoE630B_desc: "The House of Habsburg-Lorraine originated from the marriage in 1736 of Francis III, Duke of Lorraine and Bar, and Maria Theresa of Austria, later successively Queen of Bohemia, Queen of Hungary and Archduchess of Austria. Its members are the legitimate surviving line of the House of Habsburg and the House of Lorraine, inheriting their patrimonial possessions and vocation to the Empire."
 USoE631B: "House of Bonaparte"
 USoE631B_desc: "The House of Bonaparte is a former imperial and royal European dynasty of Italian origin. It was founded in 1804 by Napoleon I. Napoleon turned the Grande Armée against every major European power and dominated continental Europe through a series of military victories. He installed members of his family on the thrones of client states, extending the power of the dynasty."
 USoE632B: "House of Hohenzollern"
 USoE632B_desc: "The House of Hohenzollern is a German former royal dynasty whose members were variously princes, electors, kings and emperors of Hohenzollern, Brandenburg, Prussia, the German Empire, and Romania. The family arose in the area around the town of Hechingen in Swabia during the 11th century and took their name from Hohenzollern Castle."
 USoE633B: "Choose a Palace "
 USoE633B_desc: "The new Emperor of Europe needs a representative palace to rule."
 USoE634B: "Quirinal Palace"
 USoE634B_desc: "The Quirinal Palace is a historic building in Rome, Italy, and serves as one of the three current official residences of the President of the Italian Republic. The Quirinal Palace was selected by Napoleon to be his residence par excellence as Emperor. However, its permanence never took place because of the French defeat in 1814 and the subsequent European Restoration."
 USoE635B: "Neuschwanstein Castle"
 USoE635B_desc: "Neuschwanstein Castle is a 19th-century Romanesque Revival palace on a rugged hill in southwest Bavaria, Germany. The palace was commissioned by King Ludwig II of Bavaria. The castle was intended as a home for the King, until he died in 1886. It was open to the public shortly after his death. Since then, more than 61 million people have visited Neuschwanstein Castle."
 USoE636B: "Royal Palace of Madrid"
 USoE636B_desc: "The Royal Palace of Madrid is the official residence of the Spanish royal family at the city of Madrid, although now used only for state ceremonies. The palace has 135,000 square metres of floor space and contains 3,418 rooms. It is the largest functioning royal palace and the largest by floor area in Europe."
 USoE637B: "Palace of Versailles"
 USoE637B_desc: "The Palace of Versailles was the principal royal residence of France from 1682, under Louis XIV, until the start of the French Revolution in 1789, under Louis XVI. The palace is now a historical monument and UNESCO World Heritage site, notable especially for the ceremonial Hall of Mirrors and the vast Gardens of Versailles with fountains, canals, and geometric flower beds and groves."
 USoE638B: "Buckingham Palace"
 USoE638B_desc: "Buckingham Palace is the London residence and administrative headquarters of the monarch of the United Kingdom. Located in the City of Westminster, the palace is often at the centre of state occasions and royal hospitality. It has been a focal point for the British people at times of national rejoicing and mourning."
 USoE639B: "Hofburg"
 USoE639B_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty rulers and today serves as the official residence and workplace of the President of Austria. It is located in the centre of Vienna and was built in the 13th century and expanded several times afterwards."
 USoE640B: "Sanssouci"
 USoE640B_desc: "Sanssouci was the summer palace of Frederick the Great, King of Prussia, in Potsdam, near Berlin. It is often counted among the German rivals of Versailles. While Sanssouci is in the more intimate Rococo style and is far smaller than its French Baroque counterpart, it too is notable for the numerous temples and follies in the park."
 USoE641B: "A New Palace"
 USoE641B_desc: "A new emperor needs an new palace, not a historic monument. Let's build a new palace with modern architecture in Brussels."
 USoE642B: "Coronation"
 USoE642B_desc: "Europe needs to prepare for the coronation of the new Emperor. But first, it needs to decide which crown the emperor should wear and who should do the coronation."
 USoE643B: "The Imperial Crown"
 USoE643B_desc: "The new empire is the continuation and the legacy of the Holy Roman Empire, so the emperor needs to wear the Crown of the Holy Roman Empire."
 USoE644B: "A New Ecumenical Crown"
 USoE644B_desc: "A new empire and a new emperor need a new crown and not a historic relict."
 USoE645B: "By the Pope"
 USoE645B_desc: "The new emperor by the grace of god needs to be crowned by the pope."
 USoE646B: "By the People"
 USoE646B_desc: "The new Emperor needs to be crowned by the people, so let's call for an election to legitimate His Majesty's rule."
 USoE647B: "The Holy European Empire"
 USoE647B_desc: "The emperor is crowned and the Holy European Empire is established."
 USoE700B: "Pax Occidentalis"
 USoE700B_desc: "Europe has acquired global dominance and can enforce world peace. This era will be called Pax Occidentalis."
 USoE701B: "Guardians of World Peace"
 USoE701B_desc: "Europe, America, Russia and China have settled their spheres of influence. Every superpower enforces peace in their sphere and so they are the guardians of world peace."
 
##################### European Union Module A4 #####################
 EU001A: "EU Policies"
 EU001A_desc: "The policies of §Y[EUU.GetFlag] The EU§! are determined by the Union’s values, objectives and principles. Because the EU started as an economic community, economic policy is still an important area in the EU. In keeping with its values, the EU seeks to promote the wellbeing, security and interests of the citizens. The EU wishes to keep the economy stable and competitive. The EU tries to reform itself..."
 EU002A: "EU Candidate"
 EU002A_desc: "Before applying for membership to §Y[EUU.GetFlag] The European Union§! We need to get EU Candidate status. The will be hard negotiations with the member states of §Y[EUU.GetFlag] The European Union§!. We will need a lot of influence."
 EU100A: "EU Reforms"
 EU100A_desc: "The member states try to reform §Y[EUU.GetFlag] The European Union§! to strengthen the European integration."
 EU101A: "Charter of Fundamental Rights of the European Union"
 EU101A_desc: "\"The peoples of Europe, in creating an ever closer union among them, are resolved to share a peaceful future based on common values. Conscious of its spiritual and moral heritage, the Union is founded on the indivisible, universal values of human dignity, freedom, equality and solidarity; it is based on the principles of democracy and the rule of law.\" - Preamble of the CFR"
 EU102A: "European Convention"
 EU102A_desc: "Following the Laeken declaration the European Council has decided to convene a Convention on the future of the Union to make a decisive step for the citizen towards a simpler Union, one that is stronger in the pursuit of its essential objectives and more definitely present in the world."
 EU103A: "European Constitution"
 EU103A_desc: "The European Convention ended with the Draft of the Treaty establishing a Constitution for Europe. This international treaty would replace the existing European treaties to create a consolidated constitution for §Y[EUU.GetFlag] The European Union§! and expanded Qualified Majority Voting into policy areas which had previously been decided by unanimity among member states."
 EU104A: "Treaty of Lisbon"
 EU104A_desc: "The process leading to the Lisbon Treaty is a result of the negative outcome of the ratification of the European Constitution. Treaty of Lisbon amending the Treaty on European Union and the Treaty establishing the European Community. The last is renamed the Treaty on the Functioning of the European Union."
 EU105A: "European External Action Service"
 EU105A_desc: "The European External Action Service is the European Union's diplomatic service. It helps the EU's foreign affairs chief – the High Representative for Foreign Affairs and Security Policy – carry out the Union's Common Foreign and Security Policy."
 EU200A: "EU Fiscal Policies"
 EU200A_desc: "Fiscal policies have a significant impact on economic growth, macroeconomic stability and inflation. Key aspects in this respect are the level and composition of government expenditure and revenue, budget deficits and government debt. The need for fiscal discipline is even stronger in a monetary union, such as the euro area, which is made of sovereign states that retain responsibility for their fiscal policies."
 EU201A: "ECB Intervention"
 EU201A_desc: "To implement its monetary policy decisions, the Governing Council of the ECB has adopted a set of monetary policy instruments and procedures as laid down in the General documentation on Eurosystem monetary policy instruments and procedures."
 EU202A: "European Banking Union"
 EU202A_desc: "In response to the recent financial crisis the European Banking Union was created for a safer financial sector for the single market. These initiatives form a single rulebook for all financial actors in the EU member states. They include stronger prudential requirements for banks, improved protection for depositors and rules for managing failing banks."
 EU203A: "Eurobonds"
 EU203A_desc: "Eurobonds are a new option of financing public debt. Such common issuance of bonds by the eurozone members would imply a significant deepening of the monetary union. It would create new means through which governments finance their debt, by offering safe and liquid investment opportunities for savers and financial institutions and by setting up a Eurobond market that matches the US bond market."
 EU204A: "European Financial Stability Facility (EFSF)"
 EU204A_desc: "The EFSF was created as a temporary crisis resolution mechanism by the euro area member states in European debt crisis and provided financial assistance to several member states. This was financed by the EFSF through the issuance of EFSF bonds and other debt instruments on capital markets. The EFSF does not provide any further financial assistance, as this task is now performed solely by the ESM."
 EU205A: "European Stability Mechanism (ESM)"
 EU205A_desc: "The ESM’s mission is to provide financial assistance to euro area countries experiencing or threatened by severe financing problems. This assistance is granted only if it is proven necessary to safeguard the financial stability of the euro area as a whole and of ESM Members."
 EU206A: "Fiscal Union"
 EU206A_desc: "Fiscal union involves member states sharing the same common budget. It means spending and tax levels would be taken by a central fiscal authority. Fiscal union is proposed as a step for further European integration. It would mean a central European authority would set spending and tax rates for all member states."
 EU207A: "European Economic Government"
 EU207A_desc: "A European Economic Government would make possible a common fiscal and active economic policy in the EU. It would give §Y[EUU.GetFlag] The European Union§! an own tax authority and a central authority would set minimum wages for the member states."
 EU208A: "European Minister of Economy and Finance"
 EU208A_desc: "A European Minister of Economy and Finance combines the policies and powers established by the Fiscal Union and the European Economic Government into one office."
 EU300A: "EU Defense Policies"
 EU300A_desc: "The Common Security and Defence Policy (CSDP) enables the Union to take a leading role in peace-keeping operations, conflict prevention and in the strengthening of the international security. It is an integral part of the EU's comprehensive approach towards crisis management, drawing on civilian and military assets."
 EU301A: "European Defence Agency (EDA)"
 EU301A_desc: "The European Defence Agency was established to support the member states and §Y[EUU.GetFlag] The European Union§! in their effort to improve European defence capabilities in the field of crisis management and to sustain the European Security and Defence Policy as it stands now and develops in the future."
 EU302A: "Permanent Structured Cooperation (PESCO)"
 EU302A_desc: "PESCO allows thus willing and able member states to jointly plan, develop and invest in shared capability projects, and enhance the operational readiness and contribution of their armed forces. The aim is to jointly develop a coherent full spectrum force package and make the capabilities available to member states for national and multinational missions and operations."
 EU303A: "European Defence Fund"
 EU303A_desc: "The European Defence Fund will provide a key contribution to Europe’s strategic autonomy, protecting and defending its citizens. It will promote defence cooperation among companies and between EU countries to foster innovation and develop state-of-the-art defence technology and products. The fund will coordinate, supplement and amplify national investments in defence."
 EU304A: "European Security Council"
 EU304A_desc: "A ESC would make the EU better prepared for making decisions about international politics. If the EU does not manage to take and implement coherent decisions more quickly, their ability to enforce EU rules and strengthen multilateral formats will be weakened. The EU’s diplomatic, financial and military resources should therefore be supplemented by a format for more effective intergovernmental cooperation."
 EU305A: "EuroArmy"
 EU305A_desc: "To strength the military capabilities of §Y[EUU.GetFlag] The European Union§! the member states can draft common armed forces. These forces will be known as §YEuroArmy§!"
 EU306A: "EuroNavy"
 EU306A_desc: "With multinational fleets and task forces becoming more common and important in the 21st century the member states of §Y[EUU.GetFlag] The European Union§! can join their forces and transfer their warships to a unified European Naval Command known as §YEuroNavy§!."
 EU307A: "EU Permanent Member of the UNSC"
 EU307A_desc: "The member states have decided that the EU should be a permanent member of the United Nations Security Council (UNSC). This is done by reforming the UNSC or by transferring the seat(s) of the member state(s) already being UNSC member(s) to the EU."
 EU308A: "EU Nuclear Power"
 EU308A_desc: "Becoming a nuclear power will strength the political power of the EU and the influence of the Union in the world. The Union will acquire the nuclear weapons by transferring and sharing the nuclear weapons of their member states or by developing own nuclear warheads."
 EU400A: "EU Secondary Legislation"
 EU400A_desc: "The EU treaties are binding agreements between EU member states set out EU objectives, rules for EU institutions, how decisions are made and the relationship between the EU and its members. Treaties are known as primary law. The body of law that comes from the principles and objectives of the treaties is known as secondary law (regulations, directives, decisions, recommendations and opinions)."
 EU401A: "General Data Protection Regulation"
 EU401A_desc: "The EU General Data Protection Regulation (GDPR) is designed to: harmonize data privacy laws across Europe, protect and empower all EU citizens data privacy and reshape the way organizations across the region approach data privacy."
 EU402A: "Directive on Copyright in the Digital Single Market"
 EU402A_desc: "Digital technologies have radically changed the way creative content is produced, distributed and accessed. We are adapting the EU copyright rules to new consumer behaviours in a Europe which values its cultural diversity."
 EU403A: "Dublin II Regulation"
 EU403A_desc: "The Dublin II Regulation establishes the principle that only one member state is responsible for examining an asylum application. The objective is to avoid asylum seekers from being sent from one country to another, and also to prevent abuse of the system by the submission of several applications for asylum by one person."
 EU404A: "Relocation and Resettlement of Asylum Seekers"
 EU404A_desc: "Asylum seekers with a high chance of having their applications successfully processed are relocated from Greece and Italy, where they have arrived, to other member states where they will have their asylum applications processed. If these applications are successful, the applicants will be granted refugee status with the right to reside in the member state to which they are relocated."
 EU405A: "EU–Turkey deal"
 EU405A_desc: "§Y[EUU.GetFlag] The European Union§! and [TUR.GetNameWithFlag] will negotiate an agreement aimed at stopping the flow of irregular migration via Turkey to Europe. All new irregular migrants and asylum seekers arriving from Turkey to the Greek islands and whose applications for asylum have been declared inadmissible should be returned to Turkey. §Y[EUU.GetFlag] The European Union§! will pay 3 billion Euro for the Facility for Refugees in Turkey."
 EU406A: "European Asylum Agency"
 EU406A_desc: "The EU Commission proposed a future EU Asylum Agency equipped with the necessary mandate, tools and financial means needed to provide a rapid and full service to member states throughout the asylum procedure."
 EU407A: "Frontex"
 EU407A_desc: "Frontex helps EU countries and Schengen associated countries manage their external borders. It also to helps to harmonise border controls across the EU. The agency facilitates cooperation between border authorities in each EU country, providing technical support and expertise."
 EU408A: "European Border and Coast Guard Agency"
 EU408A_desc: "Frontex becomes the European Border and Coast Guard Agency. Europe’s external borders have seen an unprecedented rise in the number of migrants and refugees wishing to enter the EU in recent years. Countries that have an external border have sole responsibility for border control. But Frontex can provide additional technical support for EU countries facing severe migratory pressure."
 EU500A: "European Commission Policies "
 EU500A_desc: "European Commission Policies "
 EU600A: "EU Enlargement"
 EU600A_desc: "Enlargement policy applies to countries currently aspiring to join the EU and potential candidates. The prospect of membership is a powerful stimulus for democratic and economic reforms in countries that want to become EU members."
 EU601A: "2004 enlargement of the European Union"
 EU601A_desc: "On 1 May 2004 ten new countries with a combined population of almost 75 million joined the EU. The 25-member EU now has 450 million citizens and includes three former Soviet republics (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! and §Y[LIT.GetNameWithFlag]§!), four former satellites of the USSR (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! and §Y[SLO.GetNameWithFlag]§!), a former Yugoslav republic (§Y[SLV.GetNameWithFlag]§!) and two Mediterranean islands (§Y[CYP.GetNameWithFlag]§! and §Y[MLT.GetNameWithFlag]§!)."
 EU602A: "2007 enlargement of the European Union"
 EU602A_desc: "Two more countries from eastern Europe - §Y[BUL.GetNameWithFlag]§!and §Y[ROM.GetNameWithFlag]§! - join the EU, bringing the number of member states to 27."
 EU603A: "2013 enlargement of the European Union"
 EU603A_desc: "2013 §Y[CRO.GetNameWithFlag]§! joined the EU, bringing the number of member states to 28."
 EU700A: "Withdrawal Policies"
 EU700A_desc: "With rising Euroscepticism throughout the Union some member states will think about leaving §Y[EUU.GetFlag] The European Union§!."
 EU701A: "Article 50"
 EU701A_desc: "\"Any Member State may decide to withdraw from the Union in accordance with its own constitutional requirements.\"\n- Article 50(1), Treaty on European Union.\nFirst Article 50 was drafted for the Constitutional Treaty for the European Union. Following the failure of the ratification of the Constitution, the clause was incorporated into the Treaty of Lisbon."
 EU702A: "Withdrawal Treaty"
 EU702A_desc: "Withdrawal from §Y[EUU.GetFlag] The European Union§! is a complex process where the leaving country has to adapt its national law for time when the EU law expires due to the leaving of the Union. The leaving country and the §Y[EUU.GetFlag] The European Union§! have to reach an agreement on their future relationship."
 EU703A: "No Deal Exit"
 EU703A_desc: "If a Withdrawal Treaty with §Y[EUU.GetFlag] The European Union§! is not reached, emergency measures have to be taken to protect our people from the chaos of a No Deal Exit."
 EU110A: "Federalisation of the European Union"
 EU110A_desc: "The process of European integration has reached a state where any further integration will lead to a Federalisation of §Y[EUU.GetFlag] The European Union§!."
 EU111A: "United States of Europe"
 EU111A_desc: "After more than 70 years of European integration the member states of §Y[EUU.GetFlag] The European Union§! have decided to give up their sovereignty and form the §Y[EUU.GetFlag] The United States of Europe§!."
 EU112A: "European Federation"
 EU112A_desc: "The member states of §Y[EUU.GetFlag] The European Union§! have decided to transfer the Union into §Y[EUU.GetFlag] The European Federation§! with the Qualified Majority Voting as fundamental principle and headed by the §YPresident of the European Federation§!."
 EU113A: "Europe of Fatherlands"
 EU113A_desc: "Any further European integration will jeopardise the cultural heritage, the national Identities and the sovereignty of the member states. Europe is a Europe of Fatherlands, so the European integration has to stop at this stage."
 EU604A: "Future enlargement of the European Union"
 EU604A_desc: "Future enlargement of the European Union"
 EU605A: "Western Balkans Enlargement"
 EU605A_desc: "The Western Balkan countries of §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! and §Y[KOS.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU606A: "Turkey"
 EU606A_desc: "§Y[TUR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU607A: "Black Sea Enlargement"
 EU607A_desc: "The Black Sea countries of §Y[MLV.GetNameWithFlag]§! and §Y[UKR.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU608A: "Caucasus Enlargement"
 EU608A_desc: "The Caucasus countries of §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! and §Y[GEO.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU609A: "European Economic Area"
 EU609A_desc: "The non-EU countries of the European Economic Area (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! and §Y[ICE.GetNameWithFlag]§!) become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU610A: "Belarus"
 EU610A_desc: "§Y[BLR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU611A: "Internal Enlargement"
 EU611A_desc: "Internal enlargement is the process of new member states arising from the break-up of or secession from an existing member state. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! and §Y[WAS.GetNameWithFlag]§! can become candidates for joining §Y[EUU.GetFlag] The European Union§!, when they become independent."
 POTEF001A: "President of the  European Federation"
 POTEF001A_desc: "The §YPresident of the European Federation (POTEF)§! is the paramount leader of Europe. Therefore the President of the European Federation has the power to make the decisive strategic decisions for the whole Federation."
 POTEF100A: "Alpine Doctrine"
 POTEF100A_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member state can adopt this tradition and tactics."
 POTEF101A: "The Integrity of Creation"
 POTEF101A_desc: "To save and conserve the Integrity of Creation the European Federation adapts its policies."
 POTEF102A: "Environmental Imperialism"
 POTEF102A_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
