 POTEF110A_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF150A: "German Doctrine"
 POTEF150A_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member state can adopt this tradition and tactics."
 POTEF151A: "Empire of Trade"
 POTEF151A_desc: "The European Federation will become an Empire of Trade."
 POTEF200A: "French Doctrine"
 POTEF200A_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member state can adopt this tradition and tactics."
 POTEF201A: "Imperial Power"
 POTEF201A_desc: "The European Federation stands in the tradition of its imperial predecessors."
 POTEF202A: "Empire of Freedom"
 POTEF202A_desc: "The European Federation will become an Empire of Freedom."
 POTEF203A: "America: Ally or Adversary"
 POTEF203A_desc: "America and Europe have been allies for most of the 20th century. With the recent political changes in §Y[USA.GetNameWithFlag]§! this has been questioned…"
 POTEF204A: "NATO Legacy"
 POTEF204A_desc: "In the Tradition of the peacekeeping Legacy of NATO §Y[USA.GetNameWithFlag]§! and the §YEDU§! form a new alliance."
 POTEF205A: "Trump's Legacy"
 POTEF205A_desc: "§Y[USA.GetNameWithFlag]§! went form an ally to an adversary. Europe has to react to this decisive strategic change."
 POTEF206A: "Break the Wall"
 POTEF206A_desc: "To counter the American threat to European sovereignty, the general staff of the §YEDU§! has drafted a plan to ally with §Y[MEX.GetNameWithFlag]§! and invade §Y[USA.GetNameWithFlag]§! from the South."
 POTEF207A: "Buster's Resurrection"
 POTEF207A_desc: "To counter the US threat to Europe, the general staff of the §YEDU§! has proposed to ally with §Y[CAN.GetNameWithFlag]§! and revise the Defence Scheme No. 1, a plan created by Canadian Lt Col James 'Buster' Sutherland Brown, for a Canadian pre-emptive attack against the US in the event of an imminent conflict between the US and the British Empire. With this plan the §YEDU§! can launch an invasion from the North on §Y[USA.GetFlag] the US§!."
 POTEF250A: "Benelux Doctrine"
 POTEF250A_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member state can adopt this tactics."
 POTEF251A: "Liberal Legacy"
 POTEF251A_desc: "The European Federation honors its Liberal Legacy."
 POTEF252A: "Safeguard the old Traderouts"
 POTEF252A_desc: "The European Federation needs to safeguard the old Traderouts to the Caribbean, Africa and the former Dutch East Indies."
 POTEF253A: "Indonesia"
 POTEF253A_desc: "The European Federation needs to improve its relationship to the former Dutch colony §Y[IND.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF300A: "Iberian Doctrine"
 POTEF300A_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member state can adopt this tradition and tactics."
 POTEF301A: "Latin Cousins"
 POTEF301A_desc: "The European Federation needs to improve its relationship to the former colonies in South America."
 POTEF302A: "Mexico"
 POTEF302A_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[MEX.GetNameWithFlag]§! and build new strategic outposts in Central America."
 POTEF303A: "Greater Colombia"
 POTEF303A_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[COL.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF304A: "Central America"
 POTEF304A_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in §YCentral America§! and build new strategic outposts there."
 POTEF305A: "Southern Cone"
 POTEF305A_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in the §YSouthern Cone of South America§! and build new strategic outposts there."
 POTEF306A: "Brazil"
 POTEF306A_desc: "The European Federation needs to improve its relationship to the former Portuguese  colony §Y[BRA.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF350A: "British Doctrine"
 POTEF350A_desc: "The §YBritain§! traditionally focused on strong a strong Navy. With the Naval Doctrine all member state can adopt this tradition and tactics."
 POTEF351A: "Safeguard the North Atlantic"
 POTEF351A_desc: "To secure the Freedom of the Seas and free trade the European Federation needs to control the North Atlantic."
 POTEF352A: "Commonwealth Legacy"
 POTEF352A_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominions."
 POTEF353A: "Canada"
 POTEF353A_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[CAN.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF354A: "Australia"
 POTEF354A_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[AST.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF355A: "New Zealand"
 POTEF355A_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[NZL.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF356A: "Safeguard the North Sea"
 POTEF356A_desc: "The North Sea is the backyard of European Federation and needs to be secured."
 POTEF357A: "Malaya Legacy"
 POTEF357A_desc: "The European Federation needs to improve its relationship to the former British colonies of Malaya."
 POTEF358A: "Malaysia"
 POTEF358A_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[MAY.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF359A: "Singapore"
 POTEF359A_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[SIN.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF360A: "Guarantee Hong Kong"
 POTEF360A_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and gurantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400A: "Nordic Doctrine"
 POTEF400A_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member state can adopt this tradition and tactics."
 POTEF401A: "Safeguard the Arctic"
 POTEF401A_desc: "To secure the Freedom of the Seas and its geostrategic position the European Federation needs to control the Arctic."
 POTEF450A: "Mediterranean Doctrine"
 POTEF450A_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member state can adopt this tradition and tactics."
 POTEF451A: "Northern Africa"
 POTEF451A_desc: "To create a convergence zone and a safe harbor for refugees the European Federation needs to improve its relationship to §YNorthern Africa§! and build new strategic outposts there."
 POTEF452A: "Unite Cyprus"
 POTEF452A_desc: "As sovereign member state of the European Federation §Y[CYP.GetNameWithFlag]§! needs to be reunited."
 POTEF500A: "Balkan Doctrine"
 POTEF500A_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member state can adopt this tradition and tactics."
 POTEF501A: "Balkan Infrastructure"
 POTEF501A_desc: "The European Federation needs to develop the infrastructure of the Balkan to preserve the regional peace and secure the Balkan from foreign influence."
 POTEF502A: "Contest the Silk Road"
 POTEF502A_desc: "The European Federation needs to contest China's new silk road and reduce the Chinese influence in Central Asia."
 POTEF503A: "Competitor China"
 POTEF503A_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major compeditor of the European Federation on global level. The European Federation needs to adept its policies to this."
 POTEF504A: "Operation Arrow"
 POTEF504A_desc: "Named after the Arrow War (Second Anglo-Chinese War), Operation Arrow is a plan for a European intervention in §Y[CHI.GetNameWithFlag]§! to stop the Chinese expansion policy."
 POTEF505A: "Asian Allies"
 POTEF505A_desc: "To confront §Y[CHI.GetNameWithFlag]§!, the European Federation needs allies in Asia."
 POTEF506A: "Republik of Korea"
 POTEF506A_desc: "§Y[KOR.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF507A: "Japan"
 POTEF507A_desc: "§Y[JAP.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF550A: "Black Sea Doctrine"
 POTEF550A_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member state can adopt this tactics."
 POTEF551A: "Safeguard the Black Sea"
 POTEF551A_desc: "The Black Sea is the conection of European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552A: "Reintegrate the Breakaway Republics"
 POTEF552A_desc: "§Y[SOV.GetNameWithFlag]§! has violated the sovereignty of various eastern member states of the European Federation by supporting separatist movements and creating Breakway Republics. We need to reintegrate these Russian minions. "
 POTEF553A: "Rival Russia"
 POTEF553A_desc: "§Y[SOV.GetNameWithFlag]§! has become a major rival of the European Federation. We need to impose sanctions on them. "
 POTEF554A: "Operation Charlemagne"
 POTEF554A_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600A: "Caucasus Doctrine"
 POTEF600A_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focuse on a strong defense to fit the new situation. With the Defense Doctrine all member state can adopt this tactics."
 POTEF601A: "European Access"
 POTEF601A_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure needs to be build."
 POTEF650A: "Visegrad Doctrine"
 POTEF650A_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member state can adopt this tradition and tactics."
 POTEF651A: "European Air Defense Network"
 POTEF651A_desc: "The European Federation needs to build an Air Defense Network to secure its Eastern flank."
 POTEF652A: "Eastern Firewall"
 POTEF652A_desc: "The rising influence of §Y[SOV.GetNameWithFlag]§! in the Eastern member states need to be countered."
 POTEF700A: "Baltic Doctrine"
 POTEF700A_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member state can adopt this tradition and tactics."
 POTEF701A: "Safeguard the Baltic Sea"
 POTEF701A_desc: "The Baltic Sea is the island sea of the European Federation and needs to be secured."
 POTEF800A: "Pax Europaea"
 POTEF800A_desc: "The European Federation needs to become the global superpower to enforce world peace."
 USoE001A: "Constitute the new European Nation"
 USoE001A_desc: "The unified European Union needs to constitute itself as a new nation. The Constitution and the Unification Treaties are one thing, but now the people need to fulfill that legal framework with life."
 USoE002A: "A European Officer Corps"
 USoE002A_desc: "In the Union, every member state had its own army and later there was the EuroArmy. We need to create a European Officer Corps with common doctrine and training."
 USoE003A: "European Political Parties"
 USoE003A_desc: "A new nation needs new political parties. The former political parties of the member states have to unify."
 USoE004A: "European Patriotism"
 USoE004A_desc: "A new nation needs its own patriotism and national symbols."
 USoE005A: "The New Great Game"
 USoE005A_desc: "The New Great Game has just begun and Europe is late, while the US, China and Russia already made their first moves."
 USoE006A: "Europe's Heart and Soul"
 USoE006A_desc: "The new nation needs to define its values and standards. Europe needs a Heart and Soul!"
 USoE100A: "A Game of Spheres"
 USoE100A_desc: "When you play the game of spheres, you win or you die. There is no middle ground."
 USoE101A: "Engage the Eagle"
 USoE101A_desc: "The American Eagle needs to be grounded! It has flown far too long over European skies."
 USoE102A: "Brawl with the Bear"
 USoE102A_desc: "We need to strike the Bear before he strikes us."
 USoE103A: "Dance with the Dragon"
 USoE103A_desc: "The Dance with the Dragon is a dangerous game."
 USoE104A: "A Heart of Iron"
 USoE104A_desc: "In ancient times, the blacksmiths would forge an iron throne out of the weapons of the beaten villains. In our days, we just declare Europe has proven its heart of iron and is now the uncontested world ruler! "
 USoE200A: "Peaceful Coexistence"
 USoE200A_desc: "There are sharper swords than those of iron. Why pay with blood if you can pay with money?"
 USoE201A: "America First"
 USoE201A_desc: "We need to respect the America First doctrine if we want that our doctrines are respected."
 USoE202A: "Russosphere"
 USoE202A_desc: "Russia is the protector of all Russian people. That's their sphere of influence, which we need to respect."
 USoE203A: "Shinosphere"
 USoE203A_desc: "China's sphere of influence covers southeast Asia and doesn't bother us. China is our trade partner, not our rival."
 USoE204A: "Eurosphere"
 USoE204A_desc: "We appeased all superpowers of the 21st century, now we have free hands to establish the Eurosphere in Europe, Levant and North Africa."
 USoE300A: "Clash of Civilizations"
 USoE300A_desc: "The Clash of Civilizations was a thesis from American political scientist Samuel P. Huntington, that people's cultural and religious identities will be the primary source of conflict in the post-Cold War world. The future wars will be fought not between countries, but between cultures."
 USoE301A: "The Rest of the West"
 USoE301A_desc: "Europe is the rest of the west. America has left us alone and isolated in the America First doctrine."
 USoE302A: "Cross and Crescent"
 USoE302A_desc: "At Europe's southeast border, the cross clashes with the crescent. Who will prevail: the Western or the Islamic civilization?"
 USoE303A: "The Pope and the Patriarch"
 USoE303A_desc: "Since the Great Schism of 1054, the pope and the Orthodox patriarch have gone different paths. It's time to unite again to defend the Western civilization."
 USoE304A: "Two Crosses"
 USoE304A_desc: "Eastern and Western Christianity need to unite against Islam."
 USoE305A: "Eurasian Alliance"
 USoE305A_desc: "After the dissolution of NATO, Europe can form a new great alliance with its Russian neighbour."
 USoE306A: "Constantinople"
 USoE306A_desc: "Constantinople is part of the West. Europe needs to free it form the Islamic influence."
 USoE307A: "Antioch"
 USoE307A_desc: "The Principality of Antioch was one of the crusader states created during the First Crusade. It belongs to the West and shall be free from Islam once again."
 USoE308A: "Tripoli"
 USoE308A_desc: "The County of Tripoli (1109–1289) was the last of the crusader states. It shall rise again. Europe needs to free the Levant from Islam."
 USoE309A: "Jerusalem"
 USoE309A_desc: "Europe needs to save the Holy City from Islamic influence. The Kingdom of Jerusalem shall guard the holy sites once again."
 USoE310A: "Knights of Malta"
 USoE310A_desc: "Europe needs to free Northern Africa from Islamic influence. Europe will follow the example of Knights of Malta."
 USoE311A: "Arabian Westernization"
 USoE311A_desc: "Some countries on the Arabian Peninsula already have close ties to the West. Europe needs to fully westernize the Arabian Peninsula to have a safe neighbourhood."
 USoE312A: "Indian Westernization"
 USoE312A_desc: "With the colonial legacy, India has traditionally close ties to the West. Europe should deepen this relation to fully westernize India."
 USoE313A: "The Republic of Persia"
 USoE313A_desc: "Iran is one of the major rivals of the West in the Middle East. Europe can stop Iran's conquest for regional hegemony when Europe westernizes Iran to the Republic of Persia."
 USoE320A: "The West vs the Rest"
 USoE320A_desc: "Europe and America are the western superpowers that can match every enemy in the world. With NATO as a base, the West can enforce its global dominance."
 USoE321A: "Asian Westernization"
 USoE321A_desc: "The West needs to focus on the emerging powers in Asia. The West should fight or westernize them."
 USoE322A: "The Four Tigers"
 USoE322A_desc: "The Four Asian Tigers of Hong Kong, Singapore, South Korea and Taiwan always had close ties to the West and fear the emerging Chinese dragon. They could be viable allies of the West in Asia."
 USoE323A: "Japan"
 USoE323A_desc: "After the end of the World War II, Japan was an important ally of the West in Asia. The West needs to continue this close partnership."
 USoE324A: "China"
 USoE324A_desc: "China is the major rival of the West in Asia. If the West can westernize China, there will be no contender for Western hegemony in Asia."
 USoE325A: "Operation Unthinkable 2.0"
 USoE325A_desc: "Operation Unthinkable was a war plan of the British Chiefs of Staff against the Soviet Union ordered by Winston Churchill in May 1945. Together with the former German Wehrmacht, the western allies should launch a surprise attack on the Soviet Union. The West needs to revise that plan to fit the current setup and act in preemptive self-defense against Russia to prevent Russian hegemony in Europe."
 USoE400A: "The Torch of Freedom"
 USoE400A_desc: "Europe needs to carry on the Torch of Freedom! The United States of Europe are a democratic republic which respects the human rights and the rule of law."
 USoE401A: "Digital Democracy"
 USoE401A_desc: "Europe needs to reform its democratic institutions for the digital age. With social media and social networks, the people can directly participate in legislation and government."
 USoE402A: "Hammer and Sickle"
 USoE402A_desc: "Karl Marx and Friedrich Engels, the fathers of Socialism and Marxism, were Europeans. Europe needs to carry on that legacy."
 USoE403A: "EUSSR"
 USoE403A_desc: "The European left trapped the capitalists in the European Union, now the spiritual heir of Karl Marx and Friedrich Engels have the power to establish the EUSSR: the European Union of Soviet Socialist Republics."
 USoE404A: "AI Government"
 USoE404A_desc: "Artificial intelligence has evolved enough to govern a country more efficiently than inefficient and possibly corrupt human politicians. The AI agent of the ruling party will take control and rule the country based on the values of the ruling party."
 USoE500A: "The Green Future"
 USoE500A_desc: "With the undeniable climate change, there is no future but a green future for Europe."
 USoE501A: "Environmental Empire"
 USoE501A_desc: "Europe needs to become an Environmental Empire where economy and environment are no contradiction."
 USoE502A: "Environmental Imperialism"
 USoE502A_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE503A: "North America"
 USoE503A_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE504A: "South America"
 USoE504A_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE505A: "Europe"
 USoE505A_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE506A: "Africa"
 USoE506A_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE507A: "Middle East"
 USoE507A_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE508A: "Asia"
 USoE508A_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE509A: "Oceania"
 USoE509A_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE510A: "Pacific"
 USoE510A_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE600A: "The Cross and the Crown"
 USoE600A_desc: "Europe need to fulfill its legacy and become an empire once again."
 USoE601A: "The New Knights"
 USoE601A_desc: "In a hostile world, the military has taken control in Europe to save its people from corrupt politicians and foreign powers."
 USoE602A: "General of the European Armies"
 USoE602A_desc: "The general staff has decided that Europe will be led by an army general. He will be awarded with the rank of the General of the European Armies."
 USoE603A: "Air Marshal of Europe"
 USoE603A_desc: "The general staff has decided that Europe will be led by an air force general. He will be awarded with the rank of the Air Marshal of Europe."
 USoE604A: "Fleet Admiral of Europe"
 USoE604A_desc: "The general staff has decided that Europe will be led by an admiral. He will be awarded with the rank of the Fleet Admiral of Europe."
 USoE605A: "European Empire"
 USoE605A_desc: "Once again Europe has become an Empire and can defend the interests of its people on global level."
 USoE620A: "The New Emperor"
 USoE620A_desc: "Europe needs a new emperor who leads the continent through the 21st century."
 USoE621A: "Choose a House"
 USoE621A_desc: "Europe has many great houses with a long and glorious history. United for the first time, the continent needs to decide which house should rule in the 21st century."
 USoE622A: "House of Savoy"
 USoE622A_desc: "The House of Savoy is a royal dynasty that was established in 1003 in the historical Savoy region. Through gradual expansion, the family grew in power from ruling a small Alpine county north-west of Italy to absolute rule of the Kingdom of Sicily. Members of the house ruled Sardinia, Italy, Albania, Ethiopia and, for a short period, Spain. The house also claims the titles of Kings of Cyprus, Jerusalem and Armenia."
 USoE623A: "House of Wittelsbach"
 USoE623A_desc: "The House of Wittelsbach is a German-Bavarian dynasty, with branches that have ruled over territories including: Bavaria, Holland, Zeeland, Cologne, Sweden, Romania, Bohemia, Hungary, Denmark, Norway, Greece and the Holy Roman Empire. The line of Jacobite succession, which recognises the right for a Catholic monarch, acknowledges Franz, Hereditary Prince of Bavaria to be the rightful heir as Francis II."
 USoE624A: "House of Borbón-Anjou"
 USoE624A_desc: "The House of Borbón-Anjou is the reigning royal house of the Kingdom of Spain. By the 18th century, members of the Spanish Bourbon dynasty held thrones in Spain, Naples, Sicily, and Parma."
 USoE625A: "House of Bourbon"
 USoE625A_desc: "The House of Bourbon is a European dynasty of French origin, a branch of the Capetian dynasty, the royal House of France. Bourbon kings first ruled France and Navarre in the 16th century."
 USoE626A: "House of Hanover"
 USoE626A_desc: "The House of Hanover is a German royal house that ruled Hanover, Great Britain, and Ireland at various times during the 17th to 20th centuries. The house originated in 1635 as a cadet branch of the House of Brunswick-Lüneburg, growing in prestige until Hanover became an Electorate in 1692."
 USoE627A: "House of Glücksburg"
 USoE627A_desc: "The House of Glücksburg, shortened from House of Schleswig-Holstein-Sonderburg-Glücksburg, is a Dano-German branch of the House of Oldenburg, members of which have reigned at various times in Denmark, Norway, Greece and several northern German states."
 USoE628A: "House of Windsor"
 USoE628A_desc: "The House of Windsor is the reigning royal house of the United Kingdom and the other Commonwealth realms. In 1901, the House of Saxe-Coburg and Gotha succeeded the House of Hanover in the British monarchy. In 1917, the name of the royal house was changed from the German Saxe-Coburg and Gotha to the English Windsor (from Windsor Castle) because of World War I."
 USoE629A: "House of Orange-Nassau"
 USoE629A_desc: "The House of Orange-Nassau is the current reigning house of the Netherlands. A branch of the European House of Nassau, the house has played a central role in the politics and government of the Netherlands and Europe, especially since William the Silent organized the Dutch revolt against Spanish rule, which after the Eighty Years' War (1568–1648) led to an independent Dutch state. "
 USoE630A: "House of Habsburg-Lorraine"
 USoE630A_desc: "The House of Habsburg-Lorraine originated from the marriage in 1736 of Francis III, Duke of Lorraine and Bar, and Maria Theresa of Austria, later successively Queen of Bohemia, Queen of Hungary and Archduchess of Austria. Its members are the legitimate surviving line of the House of Habsburg and the House of Lorraine, inheriting their patrimonial possessions and vocation to the Empire."
 USoE631A: "House of Bonaparte"
 USoE631A_desc: "The House of Bonaparte is a former imperial and royal European dynasty of Italian origin. It was founded in 1804 by Napoleon I. Napoleon turned the Grande Armée against every major European power and dominated continental Europe through a series of military victories. He installed members of his family on the thrones of client states, extending the power of the dynasty."
 USoE632A: "House of Hohenzollern"
 USoE632A_desc: "The House of Hohenzollern is a German former royal dynasty whose members were variously princes, electors, kings and emperors of Hohenzollern, Brandenburg, Prussia, the German Empire, and Romania. The family arose in the area around the town of Hechingen in Swabia during the 11th century and took their name from Hohenzollern Castle."
 USoE633A: "Choose a Palace "
 USoE633A_desc: "The new Emperor of Europe needs a representative palace to rule."
 USoE634A: "Quirinal Palace"
 USoE634A_desc: "The Quirinal Palace is a historic building in Rome, Italy, and serves as one of the three current official residences of the President of the Italian Republic. The Quirinal Palace was selected by Napoleon to be his residence par excellence as Emperor. However, its permanence never took place because of the French defeat in 1814 and the subsequent European Restoration."
 USoE635A: "Neuschwanstein Castle"
 USoE635A_desc: "Neuschwanstein Castle is a 19th-century Romanesque Revival palace on a rugged hill in southwest Bavaria, Germany. The palace was commissioned by King Ludwig II of Bavaria. The castle was intended as a home for the King, until he died in 1886. It was open to the public shortly after his death. Since then, more than 61 million people have visited Neuschwanstein Castle."
 USoE636A: "Royal Palace of Madrid"
 USoE636A_desc: "The Royal Palace of Madrid is the official residence of the Spanish royal family at the city of Madrid, although now used only for state ceremonies. The palace has 135,000 square metres of floor space and contains 3,418 rooms. It is the largest functioning royal palace and the largest by floor area in Europe."
 USoE637A: "Palace of Versailles"
 USoE637A_desc: "The Palace of Versailles was the principal royal residence of France from 1682, under Louis XIV, until the start of the French Revolution in 1789, under Louis XVI. The palace is now a historical monument and UNESCO World Heritage site, notable especially for the ceremonial Hall of Mirrors and the vast Gardens of Versailles with fountains, canals, and geometric flower beds and groves."
 USoE638A: "Buckingham Palace"
 USoE638A_desc: "Buckingham Palace is the London residence and administrative headquarters of the monarch of the United Kingdom. Located in the City of Westminster, the palace is often at the centre of state occasions and royal hospitality. It has been a focal point for the British people at times of national rejoicing and mourning."
 USoE639A: "Hofburg"
 USoE639A_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty rulers and today serves as the official residence and workplace of the President of Austria. It is located in the centre of Vienna and was built in the 13th century and expanded several times afterwards."
 USoE640A: "Sanssouci"
 USoE640A_desc: "Sanssouci was the summer palace of Frederick the Great, King of Prussia, in Potsdam, near Berlin. It is often counted among the German rivals of Versailles. While Sanssouci is in the more intimate Rococo style and is far smaller than its French Baroque counterpart, it too is notable for the numerous temples and follies in the park."
 USoE641A: "A New Palace"
 USoE641A_desc: "A new emperor needs an new palace, not a historic monument. Let's build a new palace with modern architecture in Brussels."
 USoE642A: "Coronation"
 USoE642A_desc: "Europe needs to prepare for the coronation of the new Emperor. But first, it needs to decide which crown the emperor should wear and who should do the coronation."
 USoE643A: "The Imperial Crown"
 USoE643A_desc: "The new empire is the continuation and the legacy of the Holy Roman Empire, so the emperor needs to wear the Crown of the Holy Roman Empire."
 USoE644A: "A New Ecumenical Crown"
 USoE644A_desc: "A new empire and a new emperor need a new crown and not a historic relict."
 USoE645A: "By the Pope"
 USoE645A_desc: "The new emperor by the grace of god needs to be crowned by the pope."
 USoE646A: "By the People"
 USoE646A_desc: "The new Emperor needs to be crowned by the people, so let's call for an election to legitimate His Majesty's rule."
 USoE647A: "The Holy European Empire"
 USoE647A_desc: "The emperor is crowned and the Holy European Empire is established."
 USoE700A: "Pax Occidentalis"
 USoE700A_desc: "Europe has acquired global dominance and can enforce world peace. This era will be called Pax Occidentalis."
 USoE701A: "Guardians of World Peace"
 USoE701A_desc: "Europe, America, Russia and China have settled their spheres of influence. Every superpower enforces peace in their sphere and so they are the guardians of world peace."
 
##################### European Union Module A5 #####################
 EU001F: "EU Policies"
 EU001F_desc: "The policies of §Y[EUU.GetFlag] The EU§! are determined by the Union’s values, objectives and principles. Because the EU started as an economic community, economic policy is still an important area in the EU. In keeping with its values, the EU seeks to promote the wellbeing, security and interests of the citizens. The EU wishes to keep the economy stable and competitive. The EU tries to reform itself..."
 EU002F: "EU Candidate"
 EU002F_desc: "Before applying for membership to §Y[EUU.GetFlag] The European Union§! We need to get EU Candidate status. The will be hard negotiations with the member states of §Y[EUU.GetFlag] The European Union§!. We will need a lot of influence."
 EU100F: "EU Reforms"
 EU100F_desc: "The member states try to reform §Y[EUU.GetFlag] The European Union§! to strengthen the European integration."
 EU101F: "Charter of Fundamental Rights of the European Union"
 EU101F_desc: "\"The peoples of Europe, in creating an ever closer union among them, are resolved to share a peaceful future based on common values. Conscious of its spiritual and moral heritage, the Union is founded on the indivisible, universal values of human dignity, freedom, equality and solidarity; it is based on the principles of democracy and the rule of law.\" - Preamble of the CFR"
 EU102F: "European Convention"
 EU102F_desc: "Following the Laeken declaration the European Council has decided to convene a Convention on the future of the Union to make a decisive step for the citizen towards a simpler Union, one that is stronger in the pursuit of its essential objectives and more definitely present in the world."
 EU103F: "European Constitution"
 EU103F_desc: "The European Convention ended with the Draft of the Treaty establishing a Constitution for Europe. This international treaty would replace the existing European treaties to create a consolidated constitution for §Y[EUU.GetFlag] The European Union§! and expanded Qualified Majority Voting into policy areas which had previously been decided by unanimity among member states."
 EU104F: "Treaty of Lisbon"
 EU104F_desc: "The process leading to the Lisbon Treaty is a result of the negative outcome of the ratification of the European Constitution. Treaty of Lisbon amending the Treaty on European Union and the Treaty establishing the European Community. The last is renamed the Treaty on the Functioning of the European Union."
 EU105F: "European External Action Service"
 EU105F_desc: "The European External Action Service is the European Union's diplomatic service. It helps the EU's foreign affairs chief – the High Representative for Foreign Affairs and Security Policy – carry out the Union's Common Foreign and Security Policy."
 EU200F: "EU Fiscal Policies"
 EU200F_desc: "Fiscal policies have a significant impact on economic growth, macroeconomic stability and inflation. Key aspects in this respect are the level and composition of government expenditure and revenue, budget deficits and government debt. The need for fiscal discipline is even stronger in a monetary union, such as the euro area, which is made of sovereign states that retain responsibility for their fiscal policies."
 EU201F: "ECB Intervention"
 EU201F_desc: "To implement its monetary policy decisions, the Governing Council of the ECB has adopted a set of monetary policy instruments and procedures as laid down in the General documentation on Eurosystem monetary policy instruments and procedures."
 EU202F: "European Banking Union"
 EU202F_desc: "In response to the recent financial crisis the European Banking Union was created for a safer financial sector for the single market. These initiatives form a single rulebook for all financial actors in the EU member states. They include stronger prudential requirements for banks, improved protection for depositors and rules for managing failing banks."
 EU203F: "Eurobonds"
 EU203F_desc: "Eurobonds are a new option of financing public debt. Such common issuance of bonds by the eurozone members would imply a significant deepening of the monetary union. It would create new means through which governments finance their debt, by offering safe and liquid investment opportunities for savers and financial institutions and by setting up a Eurobond market that matches the US bond market."
 EU204F: "European Financial Stability Facility (EFSF)"
 EU204F_desc: "The EFSF was created as a temporary crisis resolution mechanism by the euro area member states in European debt crisis and provided financial assistance to several member states. This was financed by the EFSF through the issuance of EFSF bonds and other debt instruments on capital markets. The EFSF does not provide any further financial assistance, as this task is now performed solely by the ESM."
 EU205F: "European Stability Mechanism (ESM)"
 EU205F_desc: "The ESM’s mission is to provide financial assistance to euro area countries experiencing or threatened by severe financing problems. This assistance is granted only if it is proven necessary to safeguard the financial stability of the euro area as a whole and of ESM Members."
 EU206F: "Fiscal Union"
 EU206F_desc: "Fiscal union involves member states sharing the same common budget. It means spending and tax levels would be taken by a central fiscal authority. Fiscal union is proposed as a step for further European integration. It would mean a central European authority would set spending and tax rates for all member states."
 EU207F: "European Economic Government"
 EU207F_desc: "A European Economic Government would make possible a common fiscal and active economic policy in the EU. It would give §Y[EUU.GetFlag] The European Union§! an own tax authority and a central authority would set minimum wages for the member states."
 EU208F: "European Minister of Economy and Finance"
 EU208F_desc: "A European Minister of Economy and Finance combines the policies and powers established by the Fiscal Union and the European Economic Government into one office."
 EU300F: "EU Defense Policies"
 EU300F_desc: "The Common Security and Defence Policy (CSDP) enables the Union to take a leading role in peace-keeping operations, conflict prevention and in the strengthening of the international security. It is an integral part of the EU's comprehensive approach towards crisis management, drawing on civilian and military assets."
 EU301F: "European Defence Agency (EDA)"
 EU301F_desc: "The European Defence Agency was established to support the member states and §Y[EUU.GetFlag] The European Union§! in their effort to improve European defence capabilities in the field of crisis management and to sustain the European Security and Defence Policy as it stands now and develops in the future."
 EU302F: "Permanent Structured Cooperation (PESCO)"
 EU302F_desc: "PESCO allows thus willing and able member states to jointly plan, develop and invest in shared capability projects, and enhance the operational readiness and contribution of their armed forces. The aim is to jointly develop a coherent full spectrum force package and make the capabilities available to member states for national and multinational missions and operations."
 EU303F: "European Defence Fund"
 EU303F_desc: "The European Defence Fund will provide a key contribution to Europe’s strategic autonomy, protecting and defending its citizens. It will promote defence cooperation among companies and between EU countries to foster innovation and develop state-of-the-art defence technology and products. The fund will coordinate, supplement and amplify national investments in defence."
 EU304F: "European Security Council"
 EU304F_desc: "A ESC would make the EU better prepared for making decisions about international politics. If the EU does not manage to take and implement coherent decisions more quickly, their ability to enforce EU rules and strengthen multilateral formats will be weakened. The EU’s diplomatic, financial and military resources should therefore be supplemented by a format for more effective intergovernmental cooperation."
 EU305F: "EuroArmy"
 EU305F_desc: "To strength the military capabilities of §Y[EUU.GetFlag] The European Union§! the member states can draft common armed forces. These forces will be known as §YEuroArmy§!"
 EU306F: "EuroNavy"
 EU306F_desc: "With multinational fleets and task forces becoming more common and important in the 21st century the member states of §Y[EUU.GetFlag] The European Union§! can join their forces and transfer their warships to a unified European Naval Command known as §YEuroNavy§!."
 EU307F: "EU Permanent Member of the UNSC"
 EU307F_desc: "The member states have decided that the EU should be a permanent member of the United Nations Security Council (UNSC). This is done by reforming the UNSC or by transferring the seat(s) of the member state(s) already being UNSC member(s) to the EU."
 EU308F: "EU Nuclear Power"
 EU308F_desc: "Becoming a nuclear power will strength the political power of the EU and the influence of the Union in the world. The Union will acquire the nuclear weapons by transferring and sharing the nuclear weapons of their member states or by developing own nuclear warheads."
 EU400F: "EU Secondary Legislation"
 EU400F_desc: "The EU treaties are binding agreements between EU member states set out EU objectives, rules for EU institutions, how decisions are made and the relationship between the EU and its members. Treaties are known as primary law. The body of law that comes from the principles and objectives of the treaties is known as secondary law (regulations, directives, decisions, recommendations and opinions)."
 EU401F: "General Data Protection Regulation"
 EU401F_desc: "The EU General Data Protection Regulation (GDPR) is designed to: harmonize data privacy laws across Europe, protect and empower all EU citizens data privacy and reshape the way organizations across the region approach data privacy."
 EU402F: "Directive on Copyright in the Digital Single Market"
 EU402F_desc: "Digital technologies have radically changed the way creative content is produced, distributed and accessed. We are adapting the EU copyright rules to new consumer behaviours in a Europe which values its cultural diversity."
 EU403F: "Dublin II Regulation"
 EU403F_desc: "The Dublin II Regulation establishes the principle that only one member state is responsible for examining an asylum application. The objective is to avoid asylum seekers from being sent from one country to another, and also to prevent abuse of the system by the submission of several applications for asylum by one person."
 EU404F: "Relocation and Resettlement of Asylum Seekers"
 EU404F_desc: "Asylum seekers with a high chance of having their applications successfully processed are relocated from Greece and Italy, where they have arrived, to other member states where they will have their asylum applications processed. If these applications are successful, the applicants will be granted refugee status with the right to reside in the member state to which they are relocated."
 EU405F: "EU–Turkey deal"
 EU405F_desc: "§Y[EUU.GetFlag] The European Union§! and [TUR.GetNameWithFlag] will negotiate an agreement aimed at stopping the flow of irregular migration via Turkey to Europe. All new irregular migrants and asylum seekers arriving from Turkey to the Greek islands and whose applications for asylum have been declared inadmissible should be returned to Turkey. §Y[EUU.GetFlag] The European Union§! will pay 3 billion Euro for the Facility for Refugees in Turkey."
 EU406F: "European Asylum Agency"
 EU406F_desc: "The EU Commission proposed a future EU Asylum Agency equipped with the necessary mandate, tools and financial means needed to provide a rapid and full service to member states throughout the asylum procedure."
 EU407F: "Frontex"
 EU407F_desc: "Frontex helps EU countries and Schengen associated countries manage their external borders. It also to helps to harmonise border controls across the EU. The agency facilitates cooperation between border authorities in each EU country, providing technical support and expertise."
 EU408F: "European Border and Coast Guard Agency"
 EU408F_desc: "Frontex becomes the European Border and Coast Guard Agency. Europe’s external borders have seen an unprecedented rise in the number of migrants and refugees wishing to enter the EU in recent years. Countries that have an external border have sole responsibility for border control. But Frontex can provide additional technical support for EU countries facing severe migratory pressure."
 EU500F: "European Commission Policies "
 EU500F_desc: "European Commission Policies "
 EU600F: "EU Enlargement"
 EU600F_desc: "Enlargement policy applies to countries currently aspiring to join the EU and potential candidates. The prospect of membership is a powerful stimulus for democratic and economic reforms in countries that want to become EU members."
 EU601F: "2004 enlargement of the European Union"
 EU601F_desc: "On 1 May 2004 ten new countries with a combined population of almost 75 million joined the EU. The 25-member EU now has 450 million citizens and includes three former Soviet republics (§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§! and §Y[LIT.GetNameWithFlag]§!), four former satellites of the USSR (§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! and §Y[SLO.GetNameWithFlag]§!), a former Yugoslav republic (§Y[SLV.GetNameWithFlag]§!) and two Mediterranean islands (§Y[CYP.GetNameWithFlag]§! and §Y[MLT.GetNameWithFlag]§!)."
 EU602F: "2007 enlargement of the European Union"
 EU602F_desc: "Two more countries from eastern Europe - §Y[BUL.GetNameWithFlag]§!and §Y[ROM.GetNameWithFlag]§! - join the EU, bringing the number of member states to 27."
 EU603F: "2013 enlargement of the European Union"
 EU603F_desc: "2013 §Y[CRO.GetNameWithFlag]§! joined the EU, bringing the number of member states to 28."
 EU700F: "Withdrawal Policies"
 EU700F_desc: "With rising Euroscepticism throughout the Union some member states will think about leaving §Y[EUU.GetFlag] The European Union§!."
 EU701F: "Article 50"
 EU701F_desc: "\"Any Member State may decide to withdraw from the Union in accordance with its own constitutional requirements.\"\n- Article 50(1), Treaty on European Union.\nFirst Article 50 was drafted for the Constitutional Treaty for the European Union. Following the failure of the ratification of the Constitution, the clause was incorporated into the Treaty of Lisbon."
 EU702F: "Withdrawal Treaty"
 EU702F_desc: "Withdrawal from §Y[EUU.GetFlag] The European Union§! is a complex process where the leaving country has to adapt its national law for time when the EU law expires due to the leaving of the Union. The leaving country and the §Y[EUU.GetFlag] The European Union§! have to reach an agreement on their future relationship."
 EU703F: "No Deal Exit"
 EU703F_desc: "If a Withdrawal Treaty with §Y[EUU.GetFlag] The European Union§! is not reached, emergency measures have to be taken to protect our people from the chaos of a No Deal Exit."
 EU110F: "Federalisation of the European Union"
 EU110F_desc: "The process of European integration has reached a state where any further integration will lead to a Federalisation of §Y[EUU.GetFlag] The European Union§!."
 EU111F: "United States of Europe"
 EU111F_desc: "After more than 70 years of European integration the member states of §Y[EUU.GetFlag] The European Union§! have decided to give up their sovereignty and form the §Y[EUU.GetFlag] The United States of Europe§!."
 EU112F: "European Federation"
 EU112F_desc: "The member states of §Y[EUU.GetFlag] The European Union§! have decided to transfer the Union into §Y[EUU.GetFlag] The European Federation§! with the Qualified Majority Voting as fundamental principle and headed by the §YPresident of the European Federation§!."
 EU113F: "Europe of Fatherlands"
 EU113F_desc: "Any further European integration will jeopardise the cultural heritage, the national Identities and the sovereignty of the member states. Europe is a Europe of Fatherlands, so the European integration has to stop at this stage."
 EU604F: "Future enlargement of the European Union"
 EU604F_desc: "Future enlargement of the European Union"
 EU605F: "Western Balkans Enlargement"
 EU605F_desc: "The Western Balkan countries of §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! and §Y[KOS.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU606F: "Turkey"
 EU606F_desc: "§Y[TUR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU607F: "Black Sea Enlargement"
 EU607F_desc: "The Black Sea countries of §Y[MLV.GetNameWithFlag]§! and §Y[UKR.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU608F: "Caucasus Enlargement"
 EU608F_desc: "The Caucasus countries of §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! and §Y[GEO.GetNameWithFlag]§! become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU609F: "European Economic Area"
 EU609F_desc: "The non-EU countries of the European Economic Area (§Y[SWI.GetNameWithFlag]§!, §Y[NOR.GetNameWithFlag]§! and §Y[ICE.GetNameWithFlag]§!) become candidate for joining §Y[EUU.GetFlag] The European Union§!. "
 EU610F: "Belarus"
 EU610F_desc: "§Y[BLR.GetNameWithFlag]§! becomes candidate for joining §Y[EUU.GetFlag] The European Union§!."
 EU611F: "Internal Enlargement"
 EU611F_desc: "Internal enlargement is the process of new member states arising from the break-up of or secession from an existing member state. §Y[CAT.GetNameWithFlag]§!, §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§! and §Y[WAS.GetNameWithFlag]§! can become candidates for joining §Y[EUU.GetFlag] The European Union§!, when they become independent."
 POTEF001F: "President of the  European Federation"
 POTEF001F_desc: "The §YPresident of the European Federation (POTEF)§! is the paramount leader of Europe. Therefore the President of the European Federation has the power to make the decisive strategic decisions for the whole Federation."
 POTEF100F: "Alpine Doctrine"
 POTEF100F_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member state can adopt this tradition and tactics."
 POTEF101F: "The Integrity of Creation"
 POTEF101F_desc: "To save and conserve the Integrity of Creation the European Federation adapts its policies."
 POTEF102F: "Environmental Imperialism"
 POTEF102F_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF103F: "North America"
 POTEF103F_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF104F: "South America"
 POTEF104F_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF105F: "Europe"
 POTEF105F_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF106F: "Africa"
 POTEF106F_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF107F: "Middle East"
 POTEF107F_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF108F: "Asia"
 POTEF108F_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF109F: "Oceania"
 POTEF109F_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF110F: "Pacific"
 POTEF110F_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 POTEF150F: "German Doctrine"
 POTEF150F_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member state can adopt this tradition and tactics."
 POTEF151F: "Empire of Trade"
 POTEF151F_desc: "The European Federation will become an Empire of Trade."
 POTEF200F: "French Doctrine"
 POTEF200F_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member state can adopt this tradition and tactics."
 POTEF201F: "Imperial Power"
 POTEF201F_desc: "The European Federation stands in the tradition of its imperial predecessors."
 POTEF202F: "Empire of Freedom"
 POTEF202F_desc: "The European Federation will become an Empire of Freedom."
 POTEF203F: "America: Ally or Adversary"
 POTEF203F_desc: "America and Europe have been allies for most of the 20th century. With the recent political changes in §Y[USA.GetNameWithFlag]§! this has been questioned…"
 POTEF204F: "NATO Legacy"
 POTEF204F_desc: "In the Tradition of the peacekeeping Legacy of NATO §Y[USA.GetNameWithFlag]§! and the §YEDU§! form a new alliance."
 POTEF205F: "Trump's Legacy"
 POTEF205F_desc: "§Y[USA.GetNameWithFlag]§! went form an ally to an adversary. Europe has to react to this decisive strategic change."
 POTEF206F: "Break the Wall"
 POTEF206F_desc: "To counter the American threat to European sovereignty, the general staff of the §YEDU§! has drafted a plan to ally with §Y[MEX.GetNameWithFlag]§! and invade §Y[USA.GetNameWithFlag]§! from the South."
 POTEF207F: "Buster's Resurrection"
 POTEF207F_desc: "To counter the US threat to Europe, the general staff of the §YEDU§! has proposed to ally with §Y[CAN.GetNameWithFlag]§! and revise the Defence Scheme No. 1, a plan created by Canadian Lt Col James 'Buster' Sutherland Brown, for a Canadian pre-emptive attack against the US in the event of an imminent conflict between the US and the British Empire. With this plan the §YEDU§! can launch an invasion from the North on §Y[USA.GetFlag] the US§!."
 POTEF250F: "Benelux Doctrine"
 POTEF250F_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member state can adopt this tactics."
 POTEF251F: "Liberal Legacy"
 POTEF251F_desc: "The European Federation honors its Liberal Legacy."
 POTEF252F: "Safeguard the old Traderouts"
 POTEF252F_desc: "The European Federation needs to safeguard the old Traderouts to the Caribbean, Africa and the former Dutch East Indies."
 POTEF253F: "Indonesia"
 POTEF253F_desc: "The European Federation needs to improve its relationship to the former Dutch colony §Y[IND.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF300F: "Iberian Doctrine"
 POTEF300F_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member state can adopt this tradition and tactics."
 POTEF301F: "Latin Cousins"
 POTEF301F_desc: "The European Federation needs to improve its relationship to the former colonies in South America."
 POTEF302F: "Mexico"
 POTEF302F_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[MEX.GetNameWithFlag]§! and build new strategic outposts in Central America."
 POTEF303F: "Greater Colombia"
 POTEF303F_desc: "The European Federation needs to improve its relationship to the former Spanish colony §Y[COL.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF304F: "Central America"
 POTEF304F_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in §YCentral America§! and build new strategic outposts there."
 POTEF305F: "Southern Cone"
 POTEF305F_desc: "The European Federation needs to improve its relationship to the former Spanish colonies in the §YSouthern Cone of South America§! and build new strategic outposts there."
 POTEF306F: "Brazil"
 POTEF306F_desc: "The European Federation needs to improve its relationship to the former Portuguese  colony §Y[BRA.GetNameWithFlag]§! and build new strategic outposts in South America."
 POTEF350F: "British Doctrine"
 POTEF350F_desc: "The §YBritain§! traditionally focused on strong a strong Navy. With the Naval Doctrine all member state can adopt this tradition and tactics."
 POTEF351F: "Safeguard the North Atlantic"
 POTEF351F_desc: "To secure the Freedom of the Seas and free trade the European Federation needs to control the North Atlantic."
 POTEF352F: "Commonwealth Legacy"
 POTEF352F_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominions."
 POTEF353F: "Canada"
 POTEF353F_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[CAN.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF354F: "Australia"
 POTEF354F_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[AST.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF355F: "New Zealand"
 POTEF355F_desc: "The European Federation needs to honor its Commonwealth Legacy and improve its relationship to the former British Dominion §Y[NZL.GetNameWithFlag]§! and build new strategic outposts there."
 POTEF356F: "Safeguard the North Sea"
 POTEF356F_desc: "The North Sea is the backyard of European Federation and needs to be secured."
 POTEF357F: "Malaya Legacy"
 POTEF357F_desc: "The European Federation needs to improve its relationship to the former British colonies of Malaya."
 POTEF358F: "Malaysia"
 POTEF358F_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[MAY.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF359F: "Singapore"
 POTEF359F_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[SIN.GetNameWithFlag]§! and build new strategic outposts in South East Asia."
 POTEF360F: "Guarantee Hong Kong"
 POTEF360F_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and gurantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400F: "Nordic Doctrine"
 POTEF400F_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member state can adopt this tradition and tactics."
 POTEF401F: "Safeguard the Arctic"
 POTEF401F_desc: "To secure the Freedom of the Seas and its geostrategic position the European Federation needs to control the Arctic."
 POTEF450F: "Mediterranean Doctrine"
 POTEF450F_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member state can adopt this tradition and tactics."
 POTEF451F: "Northern Africa"
 POTEF451F_desc: "To create a convergence zone and a safe harbor for refugees the European Federation needs to improve its relationship to §YNorthern Africa§! and build new strategic outposts there."
 POTEF452F: "Unite Cyprus"
 POTEF452F_desc: "As sovereign member state of the European Federation §Y[CYP.GetNameWithFlag]§! needs to be reunited."
 POTEF500F: "Balkan Doctrine"
 POTEF500F_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member state can adopt this tradition and tactics."
 POTEF501F: "Balkan Infrastructure"
 POTEF501F_desc: "The European Federation needs to develop the infrastructure of the Balkan to preserve the regional peace and secure the Balkan from foreign influence."
 POTEF502F: "Contest the Silk Road"
 POTEF502F_desc: "The European Federation needs to contest China's new silk road and reduce the Chinese influence in Central Asia."
 POTEF503F: "Competitor China"
 POTEF503F_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major compeditor of the European Federation on global level. The European Federation needs to adept its policies to this."
 POTEF504F: "Operation Arrow"
 POTEF504F_desc: "Named after the Arrow War (Second Anglo-Chinese War), Operation Arrow is a plan for a European intervention in §Y[CHI.GetNameWithFlag]§! to stop the Chinese expansion policy."
 POTEF505F: "Asian Allies"
 POTEF505F_desc: "To confront §Y[CHI.GetNameWithFlag]§!, the European Federation needs allies in Asia."
 POTEF506F: "Republik of Korea"
 POTEF506F_desc: "§Y[KOR.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF507F: "Japan"
 POTEF507F_desc: "§Y[JAP.GetNameWithFlag]§!  and the European Federation are both threaten from the Chinese dragon. To deal with this threat both should ally."
 POTEF550F: "Black Sea Doctrine"
 POTEF550F_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member state can adopt this tactics."
 POTEF551F: "Safeguard the Black Sea"
 POTEF551F_desc: "The Black Sea is the conection of European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552F: "Reintegrate the Breakaway Republics"
 POTEF552F_desc: "§Y[SOV.GetNameWithFlag]§! has violated the sovereignty of various eastern member states of the European Federation by supporting separatist movements and creating Breakway Republics. We need to reintegrate these Russian minions. "
 POTEF553F: "Rival Russia"
 POTEF553F_desc: "§Y[SOV.GetNameWithFlag]§! has become a major rival of the European Federation. We need to impose sanctions on them. "
 POTEF554F: "Operation Charlemagne"
 POTEF554F_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600F: "Caucasus Doctrine"
 POTEF600F_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focuse on a strong defense to fit the new situation. With the Defense Doctrine all member state can adopt this tactics."
 POTEF601F: "European Access"
 POTEF601F_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure needs to be build."
 POTEF650F: "Visegrad Doctrine"
 POTEF650F_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member state can adopt this tradition and tactics."
 POTEF651F: "European Air Defense Network"
 POTEF651F_desc: "The European Federation needs to build an Air Defense Network to secure its Eastern flank."
 POTEF652F: "Eastern Firewall"
 POTEF652F_desc: "The rising influence of §Y[SOV.GetNameWithFlag]§! in the Eastern member states need to be countered."
 POTEF700F: "Baltic Doctrine"
 POTEF700F_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member state can adopt this tradition and tactics."
 POTEF701F: "Safeguard the Baltic Sea"
 POTEF701F_desc: "The Baltic Sea is the island sea of the European Federation and needs to be secured."
 POTEF800F: "Pax Europaea"
 POTEF800F_desc: "The European Federation needs to become the global superpower to enforce world peace."
 USoE001F: "Constitute the new European Nation"
 USoE001F_desc: "The unified European Union needs to constitute itself as a new nation. The Constitution and the Unification Treaties are one thing, but now the people need to fulfill that legal framework with life."
 USoE002F: "A European Officer Corps"
 USoE002F_desc: "In the Union, every member state had its own army and later there was the EuroArmy. We need to create a European Officer Corps with common doctrine and training."
 USoE003F: "European Political Parties"
 USoE003F_desc: "A new nation needs new political parties. The former political parties of the member states have to unify."
 USoE004F: "European Patriotism"
 USoE004F_desc: "A new nation needs its own patriotism and national symbols."
 USoE005F: "The New Great Game"
 USoE005F_desc: "The New Great Game has just begun and Europe is late, while the US, China and Russia already made their first moves."
 USoE006F: "Europe's Heart and Soul"
 USoE006F_desc: "The new nation needs to define its values and standards. Europe needs a Heart and Soul!"
 USoE100F: "A Game of Spheres"
 USoE100F_desc: "When you play the game of spheres, you win or you die. There is no middle ground."
 USoE101F: "Engage the Eagle"
 USoE101F_desc: "The American Eagle needs to be grounded! It has flown far too long over European skies."
 USoE102F: "Brawl with the Bear"
 USoE102F_desc: "We need to strike the Bear before he strikes us."
 USoE103F: "Dance with the Dragon"
 USoE103F_desc: "The Dance with the Dragon is a dangerous game."
 USoE104F: "A Heart of Iron"
 USoE104F_desc: "In ancient times, the blacksmiths would forge an iron throne out of the weapons of the beaten villains. In our days, we just declare Europe has proven its heart of iron and is now the uncontested world ruler! "
 USoE200F: "Peaceful Coexistence"
 USoE200F_desc: "There are sharper swords than those of iron. Why pay with blood if you can pay with money?"
 USoE201F: "America First"
 USoE201F_desc: "We need to respect the America First doctrine if we want that our doctrines are respected."
 USoE202F: "Russosphere"
 USoE202F_desc: "Russia is the protector of all Russian people. That's their sphere of influence, which we need to respect."
 USoE203F: "Shinosphere"
 USoE203F_desc: "China's sphere of influence covers southeast Asia and doesn't bother us. China is our trade partner, not our rival."
 USoE204F: "Eurosphere"
 USoE204F_desc: "We appeased all superpowers of the 21st century, now we have free hands to establish the Eurosphere in Europe, Levant and North Africa."
 USoE300F: "Clash of Civilizations"
 USoE300F_desc: "The Clash of Civilizations was a thesis from American political scientist Samuel P. Huntington, that people's cultural and religious identities will be the primary source of conflict in the post-Cold War world. The future wars will be fought not between countries, but between cultures."
 USoE301F: "The Rest of the West"
 USoE301F_desc: "Europe is the rest of the west. America has left us alone and isolated in the America First doctrine."
 USoE302F: "Cross and Crescent"
 USoE302F_desc: "At Europe's southeast border, the cross clashes with the crescent. Who will prevail: the Western or the Islamic civilization?"
 USoE303F: "The Pope and the Patriarch"
 USoE303F_desc: "Since the Great Schism of 1054, the pope and the Orthodox patriarch have gone different paths. It's time to unite again to defend the Western civilization."
 USoE304F: "Two Crosses"
 USoE304F_desc: "Eastern and Western Christianity need to unite against Islam."
 USoE305F: "Eurasian Alliance"
 USoE305F_desc: "After the dissolution of NATO, Europe can form a new great alliance with its Russian neighbour."
 USoE306F: "Constantinople"
 USoE306F_desc: "Constantinople is part of the West. Europe needs to free it form the Islamic influence."
 USoE307F: "Antioch"
 USoE307F_desc: "The Principality of Antioch was one of the crusader states created during the First Crusade. It belongs to the West and shall be free from Islam once again."
 USoE308F: "Tripoli"
 USoE308F_desc: "The County of Tripoli (1109–1289) was the last of the crusader states. It shall rise again. Europe needs to free the Levant from Islam."
 USoE309F: "Jerusalem"
 USoE309F_desc: "Europe needs to save the Holy City from Islamic influence. The Kingdom of Jerusalem shall guard the holy sites once again."
 USoE310F: "Knights of Malta"
 USoE310F_desc: "Europe needs to free Northern Africa from Islamic influence. Europe will follow the example of Knights of Malta."
 USoE311F: "Arabian Westernization"
 USoE311F_desc: "Some countries on the Arabian Peninsula already have close ties to the West. Europe needs to fully westernize the Arabian Peninsula to have a safe neighbourhood."
 USoE312F: "Indian Westernization"
 USoE312F_desc: "With the colonial legacy, India has traditionally close ties to the West. Europe should deepen this relation to fully westernize India."
 USoE313F: "The Republic of Persia"
 USoE313F_desc: "Iran is one of the major rivals of the West in the Middle East. Europe can stop Iran's conquest for regional hegemony when Europe westernizes Iran to the Republic of Persia."
 USoE320F: "The West vs the Rest"
 USoE320F_desc: "Europe and America are the western superpowers that can match every enemy in the world. With NATO as a base, the West can enforce its global dominance."
 USoE321F: "Asian Westernization"
 USoE321F_desc: "The West needs to focus on the emerging powers in Asia. The West should fight or westernize them."
 USoE322F: "The Four Tigers"
 USoE322F_desc: "The Four Asian Tigers of Hong Kong, Singapore, South Korea and Taiwan always had close ties to the West and fear the emerging Chinese dragon. They could be viable allies of the West in Asia."
 USoE323F: "Japan"
 USoE323F_desc: "After the end of the World War II, Japan was an important ally of the West in Asia. The West needs to continue this close partnership."
 USoE324F: "China"
 USoE324F_desc: "China is the major rival of the West in Asia. If the West can westernize China, there will be no contender for Western hegemony in Asia."
 USoE325F: "Operation Unthinkable 2.0"
 USoE325F_desc: "Operation Unthinkable was a war plan of the British Chiefs of Staff against the Soviet Union ordered by Winston Churchill in May 1945. Together with the former German Wehrmacht, the western allies should launch a surprise attack on the Soviet Union. The West needs to revise that plan to fit the current setup and act in preemptive self-defense against Russia to prevent Russian hegemony in Europe."
 USoE400F: "The Torch of Freedom"
 USoE400F_desc: "Europe needs to carry on the Torch of Freedom! The United States of Europe are a democratic republic which respects the human rights and the rule of law."
 USoE401F: "Digital Democracy"
 USoE401F_desc: "Europe needs to reform its democratic institutions for the digital age. With social media and social networks, the people can directly participate in legislation and government."
 USoE402F: "Hammer and Sickle"
 USoE402F_desc: "Karl Marx and Friedrich Engels, the fathers of Socialism and Marxism, were Europeans. Europe needs to carry on that legacy."
 USoE403F: "EUSSR"
 USoE403F_desc: "The European left trapped the capitalists in the European Union, now the spiritual heir of Karl Marx and Friedrich Engels have the power to establish the EUSSR: the European Union of Soviet Socialist Republics."
 USoE404F: "AI Government"
 USoE404F_desc: "Artificial intelligence has evolved enough to govern a country more efficiently than inefficient and possibly corrupt human politicians. The AI agent of the ruling party will take control and rule the country based on the values of the ruling party."
 USoE500F: "The Green Future"
 USoE500F_desc: "With the undeniable climate change, there is no future but a green future for Europe."
 USoE501F: "Environmental Empire"
 USoE501F_desc: "Europe needs to become an Environmental Empire where economy and environment are no contradiction."
 USoE502F: "Environmental Imperialism"
 USoE502F_desc: "Europe is green, but the world is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE503F: "North America"
 USoE503F_desc: "Europe is green, but North America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE504F: "South America"
 USoE504F_desc: "Europe is green, but South America is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE505F: "Europe"
 USoE505F_desc: "Europe is green, but the other European countries are still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE506F: "Africa"
 USoE506F_desc: "Europe is green, but Africa is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE507F: "Middle East"
 USoE507F_desc: "Europe is green, but the Middle East is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE508F: "Asia"
 USoE508F_desc: "Europe is green, but Asia is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE509F: "Oceania"
 USoE509F_desc: "Europe is green, but Oceania is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE510F: "Pacific"
 USoE510F_desc: "Europe is green, but the Pacific is still dark and grey. Europe needs to spread its policies and technologies throughout the globe and fight back the fossil energy empires that are destroying the planet."
 USoE600F: "The Cross and the Crown"
 USoE600F_desc: "Europe need to fulfill its legacy and become an empire once again."
 USoE601F: "The New Knights"
 USoE601F_desc: "In a hostile world, the military has taken control in Europe to save its people from corrupt politicians and foreign powers."
 USoE602F: "General of the European Armies"
 USoE602F_desc: "The general staff has decided that Europe will be led by an army general. He will be awarded with the rank of the General of the European Armies."
 USoE603F: "Air Marshal of Europe"
 USoE603F_desc: "The general staff has decided that Europe will be led by an air force general. He will be awarded with the rank of the Air Marshal of Europe."
 USoE604F: "Fleet Admiral of Europe"
 USoE604F_desc: "The general staff has decided that Europe will be led by an admiral. He will be awarded with the rank of the Fleet Admiral of Europe."
 USoE605F: "European Empire"
 USoE605F_desc: "Once again Europe has become an Empire and can defend the interests of its people on global level."
 USoE620F: "The New Emperor"
 USoE620F_desc: "Europe needs a new emperor who leads the continent through the 21st century."
 USoE621F: "Choose a House"
 USoE621F_desc: "Europe has many great houses with a long and glorious history. United for the first time, the continent needs to decide which house should rule in the 21st century."
 USoE622F: "House of Savoy"
 USoE622F_desc: "The House of Savoy is a royal dynasty that was established in 1003 in the historical Savoy region. Through gradual expansion, the family grew in power from ruling a small Alpine county north-west of Italy to absolute rule of the Kingdom of Sicily. Members of the house ruled Sardinia, Italy, Albania, Ethiopia and, for a short period, Spain. The house also claims the titles of Kings of Cyprus, Jerusalem and Armenia."
 USoE623F: "House of Wittelsbach"
 USoE623F_desc: "The House of Wittelsbach is a German-Bavarian dynasty, with branches that have ruled over territories including: Bavaria, Holland, Zeeland, Cologne, Sweden, Romania, Bohemia, Hungary, Denmark, Norway, Greece and the Holy Roman Empire. The line of Jacobite succession, which recognises the right for a Catholic monarch, acknowledges Franz, Hereditary Prince of Bavaria to be the rightful heir as Francis II."
 USoE624F: "House of Borbón-Anjou"
 USoE624F_desc: "The House of Borbón-Anjou is the reigning royal house of the Kingdom of Spain. By the 18th century, members of the Spanish Bourbon dynasty held thrones in Spain, Naples, Sicily, and Parma."
 USoE625F: "House of Bourbon"
 USoE625F_desc: "The House of Bourbon is a European dynasty of French origin, a branch of the Capetian dynasty, the royal House of France. Bourbon kings first ruled France and Navarre in the 16th century."
 USoE626F: "House of Hanover"
 USoE626F_desc: "The House of Hanover is a German royal house that ruled Hanover, Great Britain, and Ireland at various times during the 17th to 20th centuries. The house originated in 1635 as a cadet branch of the House of Brunswick-Lüneburg, growing in prestige until Hanover became an Electorate in 1692."
 USoE627F: "House of Glücksburg"
 USoE627F_desc: "The House of Glücksburg, shortened from House of Schleswig-Holstein-Sonderburg-Glücksburg, is a Dano-German branch of the House of Oldenburg, members of which have reigned at various times in Denmark, Norway, Greece and several northern German states."
 USoE628F: "House of Windsor"
 USoE628F_desc: "The House of Windsor is the reigning royal house of the United Kingdom and the other Commonwealth realms. In 1901, the House of Saxe-Coburg and Gotha succeeded the House of Hanover in the British monarchy. In 1917, the name of the royal house was changed from the German Saxe-Coburg and Gotha to the English Windsor (from Windsor Castle) because of World War I."
 USoE629F: "House of Orange-Nassau"
 USoE629F_desc: "The House of Orange-Nassau is the current reigning house of the Netherlands. A branch of the European House of Nassau, the house has played a central role in the politics and government of the Netherlands and Europe, especially since William the Silent organized the Dutch revolt against Spanish rule, which after the Eighty Years' War (1568–1648) led to an independent Dutch state. "
 USoE630F: "House of Habsburg-Lorraine"
 USoE630F_desc: "The House of Habsburg-Lorraine originated from the marriage in 1736 of Francis III, Duke of Lorraine and Bar, and Maria Theresa of Austria, later successively Queen of Bohemia, Queen of Hungary and Archduchess of Austria. Its members are the legitimate surviving line of the House of Habsburg and the House of Lorraine, inheriting their patrimonial possessions and vocation to the Empire."
 USoE631F: "House of Bonaparte"
 USoE631F_desc: "The House of Bonaparte is a former imperial and royal European dynasty of Italian origin. It was founded in 1804 by Napoleon I. Napoleon turned the Grande Armée against every major European power and dominated continental Europe through a series of military victories. He installed members of his family on the thrones of client states, extending the power of the dynasty."
 USoE632F: "House of Hohenzollern"
 USoE632F_desc: "The House of Hohenzollern is a German former royal dynasty whose members were variously princes, electors, kings and emperors of Hohenzollern, Brandenburg, Prussia, the German Empire, and Romania. The family arose in the area around the town of Hechingen in Swabia during the 11th century and took their name from Hohenzollern Castle."
 USoE633F: "Choose a Palace "
 USoE633F_desc: "The new Emperor of Europe needs a representative palace to rule."
 USoE634F: "Quirinal Palace"
 USoE634F_desc: "The Quirinal Palace is a historic building in Rome, Italy, and serves as one of the three current official residences of the President of the Italian Republic. The Quirinal Palace was selected by Napoleon to be his residence par excellence as Emperor. However, its permanence never took place because of the French defeat in 1814 and the subsequent European Restoration."
 USoE635F: "Neuschwanstein Castle"
 USoE635F_desc: "Neuschwanstein Castle is a 19th-century Romanesque Revival palace on a rugged hill in southwest Bavaria, Germany. The palace was commissioned by King Ludwig II of Bavaria. The castle was intended as a home for the King, until he died in 1886. It was open to the public shortly after his death. Since then, more than 61 million people have visited Neuschwanstein Castle."
 USoE636F: "Royal Palace of Madrid"
 USoE636F_desc: "The Royal Palace of Madrid is the official residence of the Spanish royal family at the city of Madrid, although now used only for state ceremonies. The palace has 135,000 square metres of floor space and contains 3,418 rooms. It is the largest functioning royal palace and the largest by floor area in Europe."
 USoE637F: "Palace of Versailles"
 USoE637F_desc: "The Palace of Versailles was the principal royal residence of France from 1682, under Louis XIV, until the start of the French Revolution in 1789, under Louis XVI. The palace is now a historical monument and UNESCO World Heritage site, notable especially for the ceremonial Hall of Mirrors and the vast Gardens of Versailles with fountains, canals, and geometric flower beds and groves."
 USoE638F: "Buckingham Palace"
 USoE638F_desc: "Buckingham Palace is the London residence and administrative headquarters of the monarch of the United Kingdom. Located in the City of Westminster, the palace is often at the centre of state occasions and royal hospitality. It has been a focal point for the British people at times of national rejoicing and mourning."
 USoE639F: "Hofburg"
 USoE639F_desc: "The Hofburg is the former principal imperial palace of the Habsburg dynasty rulers and today serves as the official residence and workplace of the President of Austria. It is located in the centre of Vienna and was built in the 13th century and expanded several times afterwards."
 USoE640F: "Sanssouci"
 USoE640F_desc: "Sanssouci was the summer palace of Frederick the Great, King of Prussia, in Potsdam, near Berlin. It is often counted among the German rivals of Versailles. While Sanssouci is in the more intimate Rococo style and is far smaller than its French Baroque counterpart, it too is notable for the numerous temples and follies in the park."
 USoE641F: "A New Palace"
 USoE641F_desc: "A new emperor needs an new palace, not a historic monument. Let's build a new palace with modern architecture in Brussels."
 USoE642F: "Coronation"
 USoE642F_desc: "Europe needs to prepare for the coronation of the new Emperor. But first, it needs to decide which crown the emperor should wear and who should do the coronation."
 USoE643F: "The Imperial Crown"
 USoE643F_desc: "The new empire is the continuation and the legacy of the Holy Roman Empire, so the emperor needs to wear the Crown of the Holy Roman Empire."
 USoE644F: "A New Ecumenical Crown"
 USoE644F_desc: "A new empire and a new emperor need a new crown and not a historic relict."
 USoE645F: "By the Pope"
 USoE645F_desc: "The new emperor by the grace of god needs to be crowned by the pope."
 USoE646F: "By the People"
 USoE646F_desc: "The new Emperor needs to be crowned by the people, so let's call for an election to legitimate His Majesty's rule."
 USoE647F: "The Holy European Empire"
 USoE647F_desc: "The emperor is crowned and the Holy European Empire is established."
 USoE700F: "Pax Occidentalis"
 USoE700F_desc: "Europe has acquired global dominance and can enforce world peace. This era will be called Pax Occidentalis."
 USoE701F: "Guardians of World Peace"
 USoE701F_desc: "Europe, America, Russia and China have settled their spheres of influence. Every superpower enforces peace in their sphere and so they are the guardians of world peace."
 
 # TR GENERIC #
 TR_GENERIC_anti_corruption_reforms: "Anti-Corruption Reforms"
 TR_GENERIC_anti_corruption_reforms_desc: "By approving anti-corruption reforms we can hopefully reduce our nation's internal corruption."
 TR_GENERIC_network_infrastructure: "Internet Infrastructure"
 TR_GENERIC_network_infrastructure_desc: "The modern world has turned the internet into a basic human need. Investing in this need will assist in education, constructional efforts and much more."
 TR_GENERIC_centralization: "Centralization"
 TR_GENERIC_centralization_desc: "Centralization of the state will assist in maintaining our expansive nation. Centralizing the nation will also help bring additional political capital and should yield some additional tax revenue in conjunction with the political capital boost."
 TR_GENERIC_decentralization: "Decentralization"
 TR_GENERIC_decentralization_desc: "Decentralizing the state and removing red tape will help reduce the overall bureaucratic cost and encourage additional construction growth."
 TR_GENERIC_political_reform: "Political Reform"
 TR_GENERIC_political_reform_desc: "To prevent stagnation of our domestic political scenes, the government must keep the country and its people politically engaged and active. Legislation must be drafted, government officials appointed, funding plans passed and public projects planned. The [Root.GetAdjective] government may not become complacent in its effort to modernize and strengthen the country."
 TR_GENERIC_cabinet_reform: "Cabinet Reform"
 TR_GENERIC_cabinet_reform_desc: "By replacing several key actors in the cabinet that are currently opposed to the head of government's agenda, the executive branch can project strength and determination in dealing with upcoming political questions and crises. In doing so, we must ignore the haters, losers and naysayers."
 TR_GENERIC_expand_the_secret_service: "Expand the Secret Service"
 TR_GENERIC_expand_the_secret_service_desc: "The security of [Root.GetNameDef] is greatly dependent upon the strength of its military and civilian intelligence agencies. We must find effective countermeasures against hostile agents, subversive elements of society, terrorists or the (at least not impossible) potential of an enemy nuclear attack."
 TR_GENERIC_build_intelligence_stations: "Build Intelligence Stations"
 TR_GENERIC_build_intelligence_stations_desc: "A follow-up to World War 2's RADAR stations, the Intelligence Stations will provide us with detailed reports on enemy troops movements and incoming aircraft. We will use the experiences from the espionage affairs and intrigue of the Cold War era."
 TR_GENERIC_strengthen_government: "Strengthen the Government"
 TR_GENERIC_strengthen_government_desc: "Our established government is in need of some strengthening. Politically entrenching our party will give us more options to pursue a variety of policies."
 TR_GENERIC_political_games: "Political Games"
 TR_GENERIC_political_games_desc: "What is a government without an expansive political culture? We must plant the seeds of debate and discussion for our political environment to prosper and remain stable."
 TR_GENERIC_public_service_annoucement: "Public Service Announcement"
 TR_GENERIC_public_service_annoucement_desc: "We must establish a standardized way of communicating public interest messages directly through our citizens. This is done through a public service announcement."
 TR_GENERIC_the_establishment: "The Establishment"
 TR_GENERIC_the_establishment_desc: "Figures of the Establishment have been strengthening their grip on state politics. We can make good use of this for some extra arm-length regarding state matters."
 TR_GENERIC_the_state: "The State"
 TR_GENERIC_the_state_desc: "With a firm hand on all that regards our land, we can, for once and for all, get rid of the pests of division and stalling that have plagued our nation for so long now."
 TR_GENERIC_diplomatic_positions: "Diplomatic Positions"
 TR_GENERIC_diplomatic_positions_desc: "Following political reform and our focus in external affairs, we can establish cohesive diplomatic positions with our neighbors for greater international cooperation."
 TR_GENERIC_our_place: "Our Place"
 TR_GENERIC_our_place_desc: "We are our own masters - and we deserve to be free from the greedy hands of our influencing powers."
 TR_GENERIC_station_in_the_world: "The World's Views"
 TR_GENERIC_station_in_the_world_desc: "Exposing the nation to the world will bring us a plethora of benefits - including actionable power for our figureheads."
 TR_GENERIC_the_west: "The West"
 TR_GENERIC_the_west_desc: "Western countries emphasize democracy and freedom, and are often aligned towards the US. Western countries work to keep the status quo in world politics."
 TR_GENERIC_eastern_emergence: "Eastern Emergence"
 TR_GENERIC_eastern_emergence_desc: "Politically Emerging countries wish to deviate from the current world order, and setup new organisations to replace the old ones. While not strictly anti-US or anti-West, Emerging countries often try to undermine Western influences."
 TR_GENERIC_non_aligned: "Non-Aligned"
 TR_GENERIC_non_aligned_desc: "Neutral countries try to stay out of global politics, and often focus on internal or regional development. They don't feel strongly of either the West or the East."
 TR_GENERIC_the_conservative_approach: "Conservative Approach"
 TR_GENERIC_the_conservative_approach_desc: "Conservative countries actively attempt to maintain the global status quo, focusing on the upkeep of Western old guard-style politics and international outlook."
 TR_GENERIC_the_nationalist_rise: "Nationalistic Rise"
 TR_GENERIC_the_nationalist_rise_desc: "Nationalist countries focus heavily on themselves, and the past glories of their nation. They often fall to authoritarian politics and promote the existence of a single ethnicity or people."
 TR_GENERIC_the_salafist_rise: "Salafist Rise"
 TR_GENERIC_the_salafist_rise_desc: "Salafism is an ultra-conservative interpretation of Islam. Salafists want to reform Islam by bringing it back to its more traditional and literal roots, by force if necessary."
 TR_GENERIC_western_ideas: "Western Ideas"
 TR_GENERIC_western_ideas_desc: "The ideals of democracy and freedom that the West holds so dearly is key to the success of any respectable nation-state. We should adopt them."
 TR_GENERIC_the_rising_powers: "The Rising Powers"
 TR_GENERIC_the_rising_powers_desc: "For how long should a nation have to follow the rules of its invisible puppeteers? Let us deviate from this unjust and corrupt world order to rise along our brethren."
 TR_GENERIC_us_above_all: "Us Above All"
 TR_GENERIC_us_above_all_desc: "The nation is the only sacred and pure thing in the world. It is to be not only respected, but have its needs satisfied - no matter how strongly others might feel about it!"
 TR_GENERIC_jihad: "Jihad"
 TR_GENERIC_jihad_desc: "Allah is the Greatest!"
 TR_GENERIC_international_diplomacy: "International Diplomacy"
 TR_GENERIC_international_diplomacy_desc: "The art of making backroom deals, public displays of holier-than-thou attitudes and dividing small countries between their bigger neighbors, the practice of international diplomacy has a long established culture with a mixture of grandstanding and pragmatic machiavellianism. After all, the main goal of diplomacy is to secure the country's oil supply. [Root.GetNameDef] may not fall behind."
 TR_GENERIC_trade_with_the_neighbors: "Trade with the Neighbors"
 TR_GENERIC_trade_with_the_neighbors_desc: "After closing ranks with our immediate neighbors through both expansion of our diplomatic staffs and expansion of our road network, we can now pursue a closer trade integration with our next door partners. This will help profits for both our large companies and our small business people."
 TR_GENERIC_alignment_debate: "Alignment Debate"
 TR_GENERIC_alignment_debate_desc: "An open question of international diplomacy is always the conflicting and juxtaposed ideas of neutrality and isolationism versus the idea of interventionism."
 TR_GENERIC_neutrality: "Neutrality"
 TR_GENERIC_neutrality_desc: "We should always be concerned with the safety and prosperity of [Root.GetAdjective] citizens first and foremost. We cannot waste our young men, natural resources and financial assets in foreign entanglements. Instead, we must make sure that he home front is safe by securing our borders and avoiding membership in international alliance networks."
 TR_GENERIC_interventionism: "Interventionism"
 TR_GENERIC_interventionism_desc: "Looking at only ourselves in the international stage is not only selfish, but insulting to all peoples of the world. No matter what it takes, we should secure the prosperity and safety of everyone across the region, and perhaps, even the globe! And if we happen to seize some extra resources and gratification for [Root.GetNameDef] while we're at it..."
 TR_GENERIC_build_fortifications: "Build Fortifications"
 TR_GENERIC_build_fortifications_desc: "Strong defensive architecture is the key to securing an unbreakable frontline in the case of an invasion by foreign forces."
 TR_GENERIC_militarism: "Militarism"
 TR_GENERIC_militarism_desc: "Militarism is the idea of a country possessing a strong military which is used to secure and protect national interests both in domestic areas as well as in foreign areas."
 TR_GENERIC_peaceful_emergence: "Peaceful Emergence"
 TR_GENERIC_peaceful_emergence_desc: "Despite our different world views, we shouldn't be hostile towards the old order, but instead slowly work to change the world through diplomacy and economics."
 TR_GENERIC_revanchism: "Revanchism"
 TR_GENERIC_revanchism_desc: "Revanchism is the term for the will of a country to regain territory it has previously lost. Made popular by the French after the loss of Alsace-Lorraine, revanchism is still a key factor in the politics of many countries."
 TR_GENERIC_build_roads: "Build Roads"
 TR_GENERIC_build_roads_desc: "Transportation is key in any well-developed area of the world, and we can encourage greater access to education and urban life by building roads all over the nation, especially in lesser developed regions."
 TR_GENERIC_build_railways: "Build Railways"
 TR_GENERIC_build_railways_desc: "Transportation is key in any well-developed area of the world, and we can encourage industrialization as well as establishing a fast and cheap method of transportation by constructing railways in the less developed parts of the country."
 TR_GENERIC_build_highways: "Build Highways"
 TR_GENERIC_build_highways_desc: "For the sake of long-distance transportation of individuals all across [Root.GetNameDef], highways are needed. Let's build some."
 TR_GENERIC_expand_urban_areas: "Expand Urban Areas"
 TR_GENERIC_expand_urban_areas_desc: "The urban regions of [Root.GetNameDef] are the core of its progress and, potentially, its economy. By expanding and enhancing life in urbanization, we may further centralize the economy and stimulate citizen dynamism."
 TR_GENERIC_developmentalism: "Developmentalism"
 TR_GENERIC_developmentalism_desc: "Developmentalism is an economic theory which states that the best way for developing the economies of less developed countries is by having a strong and varied internal market with high tariffs."
 TR_GENERIC_increase_resource_production: "Increase Resource Production"
 TR_GENERIC_increase_resource_production_desc: "Higher resource yields in our production sites means higher pay when bulk-exporting. Prioritizing resource extraction will let us boost our economy as well as let us produce greater quantities of equipment for our troops."
 TR_GENERIC_economic_autonomy: "Economic Autonomy"
 TR_GENERIC_economic_autonomy_desc: "One of the biggest dangers to a country is to surrender our economy to a foreign power. Our people aren't theirs to oppress, but ours."
 TR_GENERIC_autarky: "Autarky"
 TR_GENERIC_autarky_desc: "Self-sufficiency is one of the most important things we can teach to our citizens. Not only does it mean a lower workload for the bureaucracy, but it also means reduced national security threats, heightened control over domestic politics, and a more educated populace."
 TR_GENERIC_economic_measures: "Economic Measures"
 TR_GENERIC_economic_measures_desc: "Through the implementation of economic regulative measures and international debt control, we can stimulate growth in our local budget and reduce debt interest rates."
 TR_GENERIC_assure_the_national_fuel_reserve: "Assure the National Fuel Reserve"
 TR_GENERIC_assure_the_national_fuel_reserve_desc: "Our oil is extremely important, not only for military use in vehicles and armor but also for general civilian transportation and daily use. We may deepen the fuel silos in order to make the National Fuel Reserve more effective at storing this black gold."
 TR_GENERIC_ease_of_business_reforms: "Ease of Business Reforms"
 TR_GENERIC_ease_of_business_reforms_desc: "One of the possible approaches to encourage spending and business-making to the [Root.GetAdjective] citizen is to reform the law and economy so that it's easier and more profitable for independent entrepreneurs to make a living."
 TR_GENERIC_attract_foreign_investors: "Attract Foreign Investors"
 TR_GENERIC_attract_foreign_investors_desc: "By loosening business law we can make our land attractive to opportunistic foreign investors who might see a shining star or two right where we are."
 TR_GENERIC_mobilize_the_working_class: "Mobilize the Working Class"
 TR_GENERIC_mobilize_the_working_class_desc: "Spending more on recruitment centers is one of the surefire ways to make sure we have enough manpower and industrial support to push [Root.GetNameDef] toward victory in the case conflict breaks out."
 TR_GENERIC_light_industry_investments: "Light Industry Investments"
 TR_GENERIC_light_industry_investments_desc: "Injecting capital into civilian industries as well as the oil complex can help our economy come forward in the toughest of times."
 TR_GENERIC_heavy_industry_investments: "Heavy Industry Investments"
 TR_GENERIC_heavy_industry_investments_desc: "Injecting capital into the military-industrial complex will make equipment yields higher, making sure all of our troops are well-equipped for battle."
 TR_GENERIC_refitting_the_military_industry: "Refitting the Military Industry"
 TR_GENERIC_refitting_the_military_industry_desc: "We can open new factories in order to make sure our equipment production doesn't fall back."
 TR_GENERIC_energy_sector: "The Energy Sector"
 TR_GENERIC_energy_sector_desc: "To be able to sustain a country, its energy sector must be kept up to date first. We should build both a fossil fuel plant and some renewable energy infrastructure for affordable, reliable energy for the entire region."
 TR_GENERIC_fossil_powerplant: "Fossil Fuel Power Plants"
 TR_GENERIC_fossil_powerplant_desc: "We can focus our energy sector into picking up fossil fuels as THE correct choice, sacrificing output and innovation for cheap and well-studied methods of energy production."
 TR_GENERIC_improved_energy_cycling: "Improved Power Plants"
 TR_GENERIC_improved_energy_cycling_desc: "By making our stance within the energy sector known, more companies and organizations will opt in toward fossil fuel energy production. This also means downtime for renewable energy sources."
 TR_GENERIC_renewable_retooling: "Renewable Retooling"
 TR_GENERIC_renewable_retooling_desc: "We may instead focus our energy sector into picking up alternative, sustainable fuels to obtain great output and low environmental impact by sacrificing reliability and putting up with the greater cost."
 TR_GENERIC_combined_military_defense_industries: "Combined Defense Industries"
 TR_GENERIC_combined_military_defense_industries_desc: "Through our excellent work, and effort we are now able to more efficiently run our defense industries."
 TR_GENERIC_renewable_infrastructure: "Renewable Infrastructure"
 TR_GENERIC_renewable_infrastructure_desc: "Now that the hype for renewable energy has picked up in our nation, we can proceed with the construction of sustainable infrastructure with the financial aid of the investors interested."
 TR_GENERIC_unemployment_program: "Unemployment Programs"
 TR_GENERIC_unemployment_program_desc: "Hasty measures may be instated to make sure we can withhold greater unemployment thresholds before the nation begins to suffer. Their implementation may also be a way to modify our welfare and healthcare budget, in the interest of the people."
 TR_GENERIC_satisfy_the_middle_class: "Satisfy the Middle Class"
 TR_GENERIC_satisfy_the_middle_class_desc: "The middle class is perhaps the biggest group of interest in the nation. Consisting mostly of industrial and business conglomerates, we can expect them to be satisfied by expanding urban infrastructure."
 TR_GENERIC_build_churches: "Build Churches"
 TR_GENERIC_build_churches_desc: "If we are to keep the priests and clergy happy, we must also inject some capital into the construction of churches, temples, and other places of praise through the land. That the average citizen will stay more grounded as a side effect is also a benefit."
 TR_GENERIC_please_the_upper_class: "Please the Upper Class"
 TR_GENERIC_please_the_upper_class_desc: "The oligarchy forms a small but important part in any state, with them being the invisible hand behind investments, land acquisitions, and the economy at both a micro and a macro level. Appeasing to them is only natural for us."
 TR_GENERIC_import_foreign_automobiles: "Import Foreign Automobiles"
 TR_GENERIC_import_foreign_automobiles_desc: "The grass is always greener on the other side of the fence, and the cars are always cleaner on the other side of the border, too. Importing motor vehicles straight from foreign industries will be a great excuse to zip up some government hype for ourselves."
 TR_GENERIC_invest_in_biofuels: "Invest in Biofuels"
 TR_GENERIC_invest_in_biofuels_desc: "Alternative energy is the future! ...Or so say the investors. Regardless, we believe in their interests and that they will align with our nation's."
 TR_GENERIC_assure_intellectual_freedoms: "Assure Intellectual Freedoms"
 TR_GENERIC_assure_intellectual_freedoms_desc: "Let all intellectuals across [Root.GetNameDef] know that their scientific effort is not only valuable but key to our prosperity and shall be guarded no matter their ideology or allegiance."
 TR_GENERIC_create_an_automotive_industry: "Create an Automotive Industry"
 TR_GENERIC_create_an_automotive_industry_desc: "Once we've learned all the little secrets of auto-making by those pesky foreigners, we can begin exploiting our own alternatives to stimulate the national industry and please the lower class in the process."
 TR_GENERIC_build_primary_schools: "Build Primary Schools"
 TR_GENERIC_build_primary_schools_desc: "Education - the heart and soul to the populace of any land in the world. Primary education specifically is extremely important to be given access to - as an uneducated child will grow up to be an uneducated adult. Building more primary schooling institutions will let us improve the literacy rates of our country."
 TR_GENERIC_assure_access_to_education: "Assure Access to Education"
 TR_GENERIC_assure_access_to_education_desc: "Education is not just a key need, but a right! We need to make sure that it's provided for - fully - for any and all citizens, at every time. The next generation of intellectuals will be sure to provide us with some backup when it's done."
 TR_GENERIC_expand_the_universities: "Expand the Universities"
 TR_GENERIC_expand_the_universities_desc: "Now that the bases for primary education have been set, we can now invest in higher education, so that geniuses and world-renowned intellectuals may come from [Root.GetNameDef], too."
 TR_GENERIC_industrial_research_task_forces: "Industrial Research Task Forces"
 TR_GENERIC_industrial_research_task_forces_desc: "Our IRTF would be a nation-funded team of researchers dedicated to the observation of the best industrial practices, so that we may implement them in the future."
 TR_GENERIC_naval_reform: "Naval Reform"
 TR_GENERIC_naval_reform_desc: "It's about time we get rid of our outdated naval practices and begin taking the water forces more seriously."
 TR_GENERIC_naval_bases: "Naval Bases"
 TR_GENERIC_naval_bases_desc: "The construction of docks and harbors all over the coasts will not only benefit the industry, but our navy, too."
 TR_GENERIC_submarines: "Submarines"
 TR_GENERIC_submarines_desc: "We may begin looking into submarine technology, to prevent any invaders from getting uncomfortably close to our above-water ships."
 TR_GENERIC_surface_ships: "Surface Ships"
 TR_GENERIC_surface_ships_desc: "The brute force behind any maritime operation, investigating the most effective and modern surface ships will directly lead us toward naval supremacy."
 TR_GENERIC_dockyards: "Dockyards"
 TR_GENERIC_dockyards_desc: "Building more harbors and stimulating the naval industry is needed for us to thrive in commerce and combat!"
 TR_GENERIC_nuclear_submarines: "Nuclear Submarines"
 TR_GENERIC_nuclear_submarines_desc: "A nuclear submarine is any type of submarine powered by a nuclear reactor. They are more powerful, speedier, and need to refuel practically never."
 TR_GENERIC_naval_doctrine_innovations: "Naval Doctrine Innovations"
 TR_GENERIC_naval_doctrine_innovations_desc: "We may study standard factional doctrine of some of the most powerful military world orders to become more effective in maritime combat ourselves."
 TR_GENERIC_aircraft_carriers: "Aircraft Carriers"
 TR_GENERIC_aircraft_carriers_desc: "An aircraft carrier is a warship that serves as a seagoing airbase, equipped with a full-length flight deck and facilities for carrying, arming, deploying, and recovering aircraft."
 TR_GENERIC_naval_doctrine_expertise: "Naval Doctrine Expertise"
 TR_GENERIC_naval_doctrine_expertise_desc: "Integrating every element of modern naval doctrine into a combined set of tactics will make even the greatest maritime powers tremble with our prowess."
 TR_GENERIC_vessel_production: "Ship Construction"
 TR_GENERIC_vessel_production_desc: "It might be possible to generate an uptick in naval production rates by optimizing dockyard paperwork and promoting naval culture in coastal states."
 TR_GENERIC_air_force_reform: "Air Force Reform"
 TR_GENERIC_air_force_reform_desc: "Under the principle that a nation controlling its skies is a nation controlling its lands, we must pursue modernization in all doctrines regarding the air."
 TR_GENERIC_fighter_planes: "Fighter Planes"
 TR_GENERIC_fighter_planes_desc: "Fighter or pursuit aircraft are designed with air-to-air engagement in mind. They are the primary way for our air force to obtain aerial superiority over any battle space."
 TR_GENERIC_air_doctrine_innovations: "Air Doctrine Innovations"
 TR_GENERIC_air_doctrine_innovations_desc: "Aerial doctrine changes as fast as our and our enemies' technology does, evolving and devolving alongside it. It's about time to hasten up the process."
 TR_GENERIC_countermeasures_against_aircraft: "Countermeasures against Aircraft"
 TR_GENERIC_countermeasures_against_aircraft_desc: "If we are to defend our land from potentially aerially superior adversaries, then we must focus specifically on anti-aircraft weapon technology."
 TR_GENERIC_bomber_planes: "Bomber Planes"
 TR_GENERIC_bomber_planes_desc: "Strategic bombing with the usage of bomber aircraft will demoralize the enemy and damage their logistics network, even in this day and age of irregular transportation. It's a priority when on the offensive."
 TR_GENERIC_drones: "Drones"
 TR_GENERIC_drones_desc: "UAV (unmanned aerial vehicle) technology will give us the ability to bombard, assassinate, and get rid of long-distance targets, be it humans or infrastructure, without sacrificing a speck of manpower as drones are remote-controlled."
 TR_GENERIC_air_doctrine_expertise: "Air Doctrine Expertise"
 TR_GENERIC_air_doctrine_expertise_desc: "Our air force is now truly one to be reckoned with - and so are the tactics we utilize. Continuing to modernize and evolve our doctrine will allow us to control the skies in ways never thought of before."
