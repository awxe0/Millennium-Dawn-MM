 TUR_crush_the_pkks_world_presence_desc:0 "The §Y£pkk PKK, §Y£tak TJK, §Y£ypg YPG §!§!§!, along with many other minor Kurdish insurgency groups, has been waging a guerrilla war against the Turkish government since the 80's. The goal of these groups varies from full independence to substantial autonomy. \n\n§Y£pkk PKK §! activity is measured by their §YAggressiveness§! and §YStrength§!.\n\n§YAggressiveness§! measures the overall willingness of the §Y£pkk PKK §! to fight and will influence the frequency of attacks. §YAggressiveness§! will decrease naturally every week up to a certain cap. Aggressiveness cap can both decrease and increase based off of the development of Kurdish provinces, as well as your and other countries' events and decisions. If it drops to 50 or lower, the §Y£pkk PKK §! will call a ceasefire. Low §HAggressiveness§! does not equate to no attacks, it just means that the §Y£pkk PKK §! will conduct less attacks than usual.\n\n§YStrength§! measures the military capabilities and popularity of the §Y£pkk PKK §! and will impact the strength of resistance in Kurdish states. The minimum value of §YStrength§! is 15 per every country the §Y£pkk PKK §! operates in. Strength will also affect the damage done by the attacks, meaning that the higher it is, the more you will hurt.\n\n§YAggressiveness§! will result in a §Rhigher frequency of attacks§!, and §HStrength§! will determine the damage done by these attacks. These random attacks will result in an increase of §Y£pkk PKK §! §HStrength§!, which can cause the §Y£pkk PKK §! declaring independence from us if it reaches §H100!§! We can manually attack the §Y£pkk PKK §!'s §Hstrength§! through raids, but we would risk increasing their §HAggressiveness§!.\n\nTo remove the §Y£pkk PKK§!  you need to have their strenght Below §Y15§! and their aggressiveness should Below §Y45§! aswell. \n\n§Y£pkk PKK §! Aggressiveness: [?TUR.TUR_PKK_aggro]\nAggressiveness Cap: [?TUR.TUR_PKK_max_aggro]\nAggressiveness: [?TUR.TUR_PKK_aggro_increase] per week\n\n§Y£pkk PKK §! Strength: [?TUR.TUR_PKK_strength]\nMinimum Strength: [?TUR.TUR_PKK_min_strength]"
