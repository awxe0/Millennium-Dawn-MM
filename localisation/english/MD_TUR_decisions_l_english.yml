 TUR_mafiatic_ins:0 "Photo of The Mafia HQ"
 TUR_mafiatic_desc:0 "Turkish mafia is the general term for criminal organizations based in Turkey and/or composed of (former) Turkish citizens. Crime groups with origins in Turkey are active throughout Western Europe (where a strong Turkish immigrant community exists) and less so in the Middle East. Turkish criminal groups also participate in a wide range of criminal activities, internationally the most important being drug trafficking, especially heroin. In the trafficking of heroin, they cooperate with Bulgarian mafia groups who transport the heroin further to countries such as Italy. The Cosa Nostra and the Turkish Mafia are known to be extremely close. Criminal activities such as the trafficking of other types of drugs, illegal gambling, human trafficking, prostitution, or extortion are committed in Turkey itself as well as in European countries with a sizeable Turkish community such as Germany, Netherlands, Belgium, Albania, and the United Kingdom.\n\nMost Turkish crime syndicates have their origin in two regions: the Trabzon province on the Black Sea coast of northeastern Turkey and the East and Southeast Anatolia in the south of the country. The biggest origin is on the coast of the Black Sea, located near Trabzon."
