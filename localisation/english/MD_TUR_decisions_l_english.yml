 TUR_municipality_race:0 "Turkish Local Elections"
 TUR_mun_desc:0 "The municipal elections in Turkey are significant as they determine the local governance and administration of cities, towns, and districts. The candidates usually represent different political parties, and the election campaigns focus on local issues, infrastructure development, public services, and community welfare.\n\nWhat we will achieve if we take over the municipalities of the cities in the country:\n\n+5 Local Construction Speed\n\nMunicipal elections can develop without depending on regular elections, so it is possible that local elections can continue if you ban the election.\n\n\n\n\n\n\n\n\n\n\nYellow Cities: Government And Coaliation\nRed Cities: Opposition"
