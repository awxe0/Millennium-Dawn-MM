 TUR_turkic_council:0 "Turkic Council Reforms"
 TUR_turkic_council_desc:0 "The Turkic Council, officially the Cooperation Council of Turkic-Speaking States, is an international organization comprising some of the Turkic countries consisting of Turkey and four former Soviet republics. It is an intergovernmental organization whose overarching aim is to promote comprehensive cooperation among Turkic states. It was founded on October 3, 2009, in Nakhchivan. The idea of setting up this cooperative council was first put forward by Kazakh President Nursultan Nazarbayev in 2006.\n\n\n\n\n\n\n\n\n\n\n\nThe General Secretariat is in Istanbul, Turkey. The member countries are Azerbaijan, Kazakhstan, Kyrgyzstan, Turkey, and Uzbekistan. Turkmenistan is currently not an official member of the council due to its neutral status. However, by default of its Turkic heritage, it is a possible future member of the council."
 TUR_toki:0 "Toki East Housing Program"
 TUR_toki_desc:0 "TOKI literally (Mass Housing Development Administration) is Turkey's government-backed housing agency. Founded in 1984, TOKİ carries out projects and activities primarily throughout Turkey in line with the government building and mass housing priorities. In 2004 the Government enabled the Districts with a new municipality law to cooperate with TOKİ to develop unprivileged areas."
