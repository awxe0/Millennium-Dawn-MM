 TUR_robbing_desc:0 "Working is a very unnecessary situation. Stealing instead of working brings profit and power, and as a Mafia government, we will dominate the world and become rich by stealing the innovation programs and money of the global world. No country in the world can steal as easily as we do, because in almost no country are mafias completely independent and their power is limited. But here, on the contrary, the mafias are free and they run a government.\n\nOur theft-based economics program will work! For example: What will happen if the United States loses the pentagon files? What will Russia be able to do after learning about the disclosure of its military? Nothing at all, the only thing they can do will be to obey us! Long Live Mafias Supreme Regime!"
