 TUR_nationalized_weaponary_desc:0 "Turkey's Undersecretariat for Defense Industries (SSM), the procurement agency for the Turkish Armed Forces, signed an agreement with TAI for the conceptual development of basic capabilities. TAI and TUSAŞ Engine Industries (TEI) would lead the design, entry, and development processes of the fighter jet. The studies would reveal the cost of the fighter while investigating which mechanical and electronic systems would be employed and included, and a wider perspective of the opportunities and challenges in military aviation."
