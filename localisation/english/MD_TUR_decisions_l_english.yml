 TUR_earthquake_cautions:0 "Turkish Housing/Earthquake Credibility"
 TUR_earthquake_description_desc:0 "Turkey has had many earthquakes. This list includes any notable historical earthquakes that have epicenters within the current boundaries of Turkey, or which caused significant effects in this area. Overall, the population in major cities like Istanbul resides in structures that are a mix of vulnerable and earthquake-resistant construction.\n\nTectonic setting\nTurkey is a seismically active area within the complex zone of collision between the Eurasian Plate and both the African and Arabian Plates. Much of the country lies on the Anatolian Plate, a small plate bounded by two major strike-slip fault zones, the North Anatolian Fault and East Anatolian Fault. The western part of the country is also affected by the zone of extensional tectonics in the Aegean Sea caused by the southward migration of the Hellenic arc. The easternmost part of Turkey lies on the western end of the Zagros fold and thrust belt, which is dominated by thrust tectonics.\n\nSeismic hazard\nSeismic hazard in Turkey is highest along the plate boundaries, but there is a significant risk of damaging earthquakes almost anywhere in the country. Seismic maps that show risk have changed through time                     \n\n\n\n\n\n\n\n\n\n\n\n\n\n§gEarthquakes in Turkey affect housing projects. That is why it is difficult to talk about housing projects in our country. We have to make a decision,\n\n1) We will use cheap goods by keeping the buildings in a bad way, by this housing, we won't care about the lives of our people.\n\n2)We will try to care about the lives of our people by making housing projects an acceptable budget.\n\n3)We will care about the lives of our people by making housing projects expensive.\n\n§RIf we continue to have poor buildings, we will receive the maximum damage.\n§YIf we continue to have some resistant buildings, we will receive medium damage.\n§GIf we continue to have the fully resistant buildings, we will receive the minimum damage.\n\n§YKeep in mind that only 7 and >7 magnitude effects have a change in effects.\n\n£pol_idea §YResistancy To The Earthquake:§! §R[?TUR_building_resistancy]§!"
