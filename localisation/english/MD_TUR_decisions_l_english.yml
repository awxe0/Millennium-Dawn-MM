 TUR_court_desc:0 "The Constitutional Court of Turkey, sometimes abbreviated as AYM is the highest legal body for constitutional review in Turkey. It "examines the constitutionality, in respect of both form and substance, of laws, decrees having the force of law, and the Rules of Procedure of the Turkish Grand National Assembly.\n\n§YHere is the statistics of the AYM:§!\n\n\n\n\n\n§YThe groups of the division:§!\n\n\n\n\n\n\nThe unity rate of the AYM, indicates the AYM's regeneration ability. If regeneration ability is high, AYM tends to reject radical choices. \n\nThe politicization rate of the AYM indicates the bad situation in AYM. If politicization accelerates a lot, the military could jump in. \n\nThe group's part won't be useful until the AYM takes over the regime. So don't mind these."
