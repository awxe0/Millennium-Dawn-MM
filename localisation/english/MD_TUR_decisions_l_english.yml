 TUR_the_covid:0 "The Covid-19"
 TUR_the_covid_desc:0 "COVID-19, also known as the coronavirus disease 2019, is a highly contagious respiratory illness caused by the severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2). The disease was first identified in December 2019 in Wuhan, Hubei Province, China, and quickly spread to become a global pandemic.\n\nCovid, which is spreading around the world, has also spread to our country and has started to harm our country. There will definitely be casualties, and we need to get over it at least one way. Let's start beating Covid."
