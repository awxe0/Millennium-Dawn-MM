 TUR_space_program:0 "Turkish National Space Program"
 TUR_space_desc:0 "The Turkish Space Agency organized a workshop in Gebze under the name "National Space Program Workshop".\n\nThe president of Turkey introduced the National Space Program prepared by TUA to the public. According to the program, Turkey's goals are:\n\nHard landing on the moon in 2023 and soft landing in 2028\n\nGathering satellite production under one roof\n\nEstablish a regional positioning and timing system\n\nEstablishing a spaceport for independent access to space\n\nSending a Turkish citizen to space for a scientific mission\n\nConducting scientific research on Space Weather\n\nIncrease their ability to observe objects in space from the ground\n\nDeveloping the space industry ecosystem\n\nDeveloping space awareness in society and raising manpower\n\nEstablishing a Space Technology Development ZoneIf\n\nWe can go into space, Turkey will now be fully developed and strengthened. We'll do this too!"
 TUR_state_bank:0 "Central Bank Of Turkey"
 TUR_state_bank_desc:0 "The Central Bank of the Republic of Turkey is the central bank of Turkey. Its responsibilities include conducting monetary and exchange rate policy, managing the international reserves of Turkey, as well as printing and issuing banknotes, and establishing, maintaining, and regulating payment systems in the country. The CBRT is tasked by law to achieve and maintain price and financial stability in Turkey and has the mandate to use, at its own discretion, whichever policy instrument is at its disposal to reach these objectives. Therefore, it has an instrument but not goal independence."
 TUR_state_capital_1:0 "Connect To EU Bank"
 TUR_ulkist_desc:0 "The Grey Wolves established by Colonel Alparslan Türkeş in the late 1960s, rose to prominence during the late 1970s political violence in Turkey when its members engaged in urban guerrilla warfare with left-wing activists and militants.\n\nA staunchly Pan-Turkist organization, in the early 1990s the Grey Wolves extended their area of operation into the post-Soviet states with Turkic and Muslim populations. Up to thousands of its members fought in the First Nagorno-Karabakh War on the Azerbaijani side, and the First and Second Chechen Wars on the Chechen side."
