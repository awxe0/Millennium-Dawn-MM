 TUR_union_situation_desc:0 "Labour unions in Turkey gained legality with the removal of the phrase “no society based on a class basis” in the Law on Associations of 1938 from the text on 5 June 1946. The unions, which were closed with a martial law decision on December 7, 1946, became legal again with the adoption of the Law on Employers' Unions and Trade Union Unions in 1947.\n\n§gToday, labor unions, and employer unions are constantly in conflict with each other. We need to keep these unions in agreement with each other. Otherwise, bad things will happen to us. These bad things go as far as pushing people to strike. As long as we make them happy, nothing bad will happen to us.§!\n\nLabour Union forces: §Y£disk DISK, £turk_is TURK-IS and more§!\nEmployers' Union forces: §Y£tisk Collective TISK§!\n\n§gEmployer unions do not pose much of a problem to us. That's why we're concentrating on labor unions.§!\n\n§YLabour Unions And Threats:§!\n\n§gLabour unions may revolt, which requires a majority of the underlying possibilities.\n\n§RMain Reasons Of Strikes:§!\n\n§YBad Relations With The Unions:§! Unions would likely drop the industrial output.\n§YLow Stability:§! Causes stress in the workforce.\n§YHave An Economy In Depression:§! Causes general riots in the workforce.\n§YIn War:§! The workforce could continue to produce until they had enough.\n\n§GPolitical Stance With Unions:§!\n\n§gWith creating good relations with the unions, you can ally with them to increase your industrial output and achieve income maximization without angering the workers.\n\n§YPower Range Of Unions:§!\n\n§gYou can decrease their power range with declaring certain laws, you can launch these laws when your relations with them above 95.\n\n§gIf you decrease their power range their damage would be a lot lower.§!\n\n£population_texticon §YRelations With The Labour Unions:§! §g[?TUR_union_acceptance]§!\n£puppet_texticon §YUnion's Political Stance (In Favour):§! §g[?TUR_union_uneasiness]§!\n£market_subsidy_small_texticon §YPower Range Of Unions:§! §g[?TUR_union_political_level]§!\n\n§RKeep in mind that the rise of the industries, would increase sydnicalization dramatically.§!"
