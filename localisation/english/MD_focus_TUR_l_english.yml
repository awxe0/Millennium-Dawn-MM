 TUR_target_aussie_welfare: "Attack Australian standard of living"
 TUR_spread_hatred_indonesia: "Start rumours between Indonesia"
 TUR_watch_the_conflict: "§PSteal Australian treasure§!"
 TUR_watch_the_conflict_desc: "Using our connections and influence, we will steal Australian precious metals and use them for our own goods."
