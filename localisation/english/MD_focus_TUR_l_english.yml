l_english:
 TUR_PKK_autonomy_idea: "PKK Resistance"
 TUR_PKK_autonomy_idea_desc: "Incorporating the PKK into another country will be near impossible."
 kurdish_resistance_dynamic_modifier: "Kurdish Resistance"
 kurdish_resistance_dynamic_modifier_desc: "Ever since the end of the great war, and the treaty of Sevres, the Kurd's have been yearning for a country of their own, free and independent from that of ours. Their independence from our nation will bring devastating consequences, but their occupation will do no good either."
 TUR_pkk_legalized: "PKK Legalized"
 TUR_pkk_legalized_desc: "We have legalized the PKK, but at what cost?"
 TUR_turkish_media_unctrolled2: "Turkish Media - §RUncontrolled§!"
 TUR_turkish_media_unctrolled2_desc: "Currently, our media is completely free from government control or influence, which can cause some problems in the future"
 TUR_PKK_insurgency_ceasefire: "PKK Insurgency - Ceasefire"
 TUR_PKK_insurgency_ceasefire_desc: "The PKK is a leftist Kurdish insurgency group that has fought for greater Kurdish autonomy since the 70s. Both sides have engaged in terror tactics trying to achieve victory over each other.\n\nCurrently, the PKK has declared a unilateral ceasefire.\n\n-Peace process and negotiations can only continue with an active ceasefire\n-A ceasefire allows us to gather our strength and prepare a surprise attack against the PKK.§W\n------------\n§!We can get rid of the PKK by §Hreducing its strength to 15 and its aggressiveness to 45 or less§!, and then doing the §Hdecisions§! made available."
 TUR_PKK_insurgency_active: "PKK Insurgency - Active"
 TUR_PKK_insurgency_active_desc: "The PKK is a leftist Kurdish insurgency group that has fought for greater Kurdish autonomy since the 70s. Both sides have engaged in terror tactics trying to achieve victory over each other.\n\nCurrently, the PKK is actively fighting against the government.\n\n-Peace process and negotiations can only continue with an active ceasefire\n-A ceasefire allows us to gather our strength and prepare a surprise attack against the PKK.§W\n------------\n§!We can get rid of the PKK by §Hreducing its strength to 15 and its aggressiveness to 45 or less§!, and then doing the §Hdecisions§! made available."
 TUR_kurdish_trouble: "Kurdish Trouble"
 TUR_kurdish_trouble_desc: "The East of our country is essentially an active warzone as a result of decades of fighting with the PKK."
